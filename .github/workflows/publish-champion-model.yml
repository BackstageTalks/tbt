name: V20.5 · Publish champion model to private GitHub Release

on:
  workflow_dispatch:
    inputs:
      allow_supabase_storage_fallback:
        description: "One-time fallback: fetch current champion from legacy Supabase Storage if no versioned GH asset exists"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: tbt-production-model-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: api
      TBT_HISTORY_DIR: .cache/tbt/history
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1
      TBT_MODEL_ARCHIVE_RELEASE_TAG: tbt-models-v1
      TBT_MODEL_PRODUCTION_RELEASE_TAG: tbt-model-production-v1
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight private repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TBT_DATA_REPOSITORY" || exit 1
          test -n "$TBT_DATA_GH_TOKEN" || exit 1
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing non-private repo"; exit 1; }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          python -m compileall -q api scripts

      - name: Download partitioned history
        run: bash scripts/download_history_release.sh .cache/tbt

      - name: Validate history integrity
        run: python scripts/validate_history_partitions.py --history-dir "$TBT_HISTORY_DIR"

      - name: Resolve registered champion
        id: champion
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          from tbt.repositories.supabase import SupabaseRepository
          row = SupabaseRepository().champion_model_version()
          if not row or not row.get('model_version'):
              raise SystemExit('No champion registered in Supabase')
          print(row['model_version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Registered champion: $VERSION"

      - name: Try versioned GitHub model archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/model-input
          if gh release download "$TBT_MODEL_ARCHIVE_RELEASE_TAG" \
              --repo "$TBT_DATA_REPOSITORY" \
              --pattern "model-${{ steps.champion.outputs.version }}.joblib" \
              --dir .cache/tbt/model-input \
              --clobber; then
            mv ".cache/tbt/model-input/model-${{ steps.champion.outputs.version }}.joblib" .cache/tbt/champion-input.joblib
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: One-time legacy Supabase Storage fallback
        if: steps.archive.outputs.found != 'true' && inputs.allow_supabase_storage_fallback
        run: python scripts/model_store.py download --file .cache/tbt/champion-input.joblib

      - name: Require a champion artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s .cache/tbt/champion-input.joblib || {
            echo "No versioned GH artifact exists and legacy fallback was unavailable/disabled.";
            exit 1;
          }

      - name: Verify input is exactly the registered champion
        run: python scripts/verify_champion_artifact.py --file .cache/tbt/champion-input.joblib

      - name: Upgrade champion to V3 state checkpoint without changing weights
        run: |
          python scripts/upgrade_champion_artifact.py \
            --input .cache/tbt/champion-input.joblib \
            --output .cache/tbt/model.joblib \
            --history-dir "$TBT_HISTORY_DIR"

      - name: Verify egress-safe champion artifact
        run: python scripts/verify_champion_artifact.py --file .cache/tbt/model.joblib --require-state

      - name: Publish versioned and production assets to GitHub
        shell: bash
        run: |
          set -euo pipefail
          cp .cache/tbt/model.joblib ".cache/tbt/model-${{ steps.champion.outputs.version }}.joblib"

          gh release view "$TBT_MODEL_ARCHIVE_RELEASE_TAG" --repo "$TBT_DATA_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TBT_MODEL_ARCHIVE_RELEASE_TAG" \
              --repo "$TBT_DATA_REPOSITORY" \
              --title 'TBT model archive v1' \
              --notes 'Versioned model artifacts.'
          gh release upload "$TBT_MODEL_ARCHIVE_RELEASE_TAG" \
            ".cache/tbt/model-${{ steps.champion.outputs.version }}.joblib" \
            --repo "$TBT_DATA_REPOSITORY" --clobber

          gh release view "$TBT_MODEL_PRODUCTION_RELEASE_TAG" --repo "$TBT_DATA_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TBT_MODEL_PRODUCTION_RELEASE_TAG" \
              --repo "$TBT_DATA_REPOSITORY" \
              --title 'TBT production champion' \
              --notes 'Machine-managed production champion. model.joblib always matches Supabase champion metadata.'
          gh release upload "$TBT_MODEL_PRODUCTION_RELEASE_TAG" \
            .cache/tbt/model.joblib \
            --repo "$TBT_DATA_REPOSITORY" --clobber

      - name: Safety note
        run: |
          echo "Champion published to private GitHub Release with V3 feature state."
          echo "This workflow intentionally does not write predictions, so it can run while the DB is read-only."
          echo "Run 'Refresh TBT predictions' only after Supabase writes are restored."
