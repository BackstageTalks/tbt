name: Full enriched model training

on:
  workflow_run:
    workflows: ["Integrate season 2021-2026 serve-return"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbt-model-trainer
  cancel-in-progress: false

jobs:
  train:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      EXPECTED_COMPLETED: "739596"
      EXPECTED_READY: "257628"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install training dependencies
        run: python -m pip install --retries 8 --timeout 60 -r api/requirements-train.txt

      - name: Verify private data source
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"

      - name: Download and verify enriched canonical history
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          from scripts.audit_serve_return_gaps import analyze
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities

          root=Path(".cache/tbt/history")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",root).download(require_bundle_manifest=True)
          matches,safety=sanitize_history_identities(load_partitions(root))
          if safety.get("quarantined_rows"):
              raise SystemExit("Canonical identity quarantine is non-empty")
          report=analyze(matches)
          Path(".cache/tbt/full-training").mkdir(parents=True,exist_ok=True)
          Path(".cache/tbt/full-training/coverage_before.json").write_text(
              json.dumps(report,indent=2),encoding="utf-8"
          )
          overall=report["overall"]
          expected_completed=int(os.environ["EXPECTED_COMPLETED"])
          expected_ready=int(os.environ["EXPECTED_READY"])
          if overall["completed"] != expected_completed:
              raise SystemExit(f"Completed history drift: {overall['completed']} != {expected_completed}")
          if overall["both_ready"] != expected_ready:
              raise SystemExit(f"Enriched serve/return baseline not ready: {overall['both_ready']} != {expected_ready}")
          print(json.dumps({
              "completed":overall["completed"],
              "both_ready":overall["both_ready"],
              "both_ready_rate":report["both_ready_rate"],
          },indent=2))
          PY

      - name: Point-in-time leakage audit
        run: |
          set -euo pipefail
          python scripts/audit_training_leakage.py             --history-dir .cache/tbt/history             --report .cache/tbt/full-training/leakage_audit.json
          python - <<'PY'
          import json
          r=json.load(open(".cache/tbt/full-training/leakage_audit.json"))
          passed=r.get("passed") is True or str(r.get("status","")).upper()=="PASS"
          if not passed:
              raise SystemExit("Leakage audit failed")
          print("Leakage audit PASS")
          PY

      - name: Build full production training table
        run: |
          set -euo pipefail
          python scripts/build_production_training_table.py             --history-dir .cache/tbt/history             --out .cache/tbt/full-training/training_table.parquet             --report .cache/tbt/full-training/training_table_report.json
          test -s .cache/tbt/full-training/training_table.parquet

      - name: Train governed candidate on enriched history
        run: |
          set -euo pipefail
          # Train mode performs a strict chronological train/calibration/holdout
          # fit, compares against Elo and the current production champion, and
          # saves the candidate to the private candidate release. No provider
          # requests are made and promotion is intentionally not requested.
          python scripts/pipeline.py train             --data-repository "$TBT_DATA_REPOSITORY"             --max-requests 1
          test -s .cache/tbt/model/model.joblib
          test -s .cache/tbt/model/training_report.json
          cp .cache/tbt/model/training_report.json             .cache/tbt/full-training/training_report.json

      - name: Verify full candidate training contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open(".cache/tbt/full-training/training_report.json"))
          data=r.get("data") or {}
          decision=r.get("promotion_decision") or {}
          if int(data.get("matches_total") or 0) < 700000:
              raise SystemExit(f"Unexpectedly small full training corpus: {data.get('matches_total')}")
          for key in ("train","calibration","holdout"):
              if int(data.get(key) or 0) <= 0:
                  raise SystemExit(f"Missing {key} partition")
          holdout=r.get("holdout") or {}
          eligibility=(r.get("evaluation_governance") or {}).get("eligibility_reason")
          holdout_n=int(holdout.get("n") or 0)
          if holdout_n <= 0 and eligibility != "no_eligible_unseen_evaluation_rows":
              raise SystemExit(f"Candidate has no governed holdout: {eligibility}")
          if decision.get("promotion_requested") is not False:
              raise SystemExit("Training unexpectedly requested production promotion")
          print(json.dumps({
              "matches_total":data.get("matches_total"),
              "train":data.get("train"),
              "calibration":data.get("calibration"),
              "holdout":data.get("holdout"),
              "holdout_metrics":holdout,
              "elo_baseline":r.get("elo_baseline_holdout"),
              "production_holdout":r.get("production_holdout"),
              "delta_vs_elo":r.get("delta_vs_elo"),
              "delta_vs_production":r.get("delta_vs_production"),
              "promotion_decision":decision,
          },indent=2))
          PY

      - name: Full calendar-year walk-forward backtest
        run: |
          set -euo pipefail
          python scripts/pipeline.py backtest             --data-repository "$TBT_DATA_REPOSITORY"             --max-requests 1
          test -s .cache/tbt/backtest.json
          cp .cache/tbt/backtest.json .cache/tbt/full-training/walk_forward_backtest.json

      - name: Promotion readiness after training
        run: |
          set -euo pipefail
          python scripts/model_promotion_readiness.py             --data-repository "$TBT_DATA_REPOSITORY"             --minimum-gate-rows 200             --target-rows 1000             --minimum-days 3             --out .cache/tbt/full-training/promotion_readiness.json

      - name: Build compact full-training summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          train=json.load(open(".cache/tbt/full-training/training_report.json"))
          walk=json.load(open(".cache/tbt/full-training/walk_forward_backtest.json"))
          ready=json.load(open(".cache/tbt/full-training/promotion_readiness.json"))
          table=json.load(open(".cache/tbt/full-training/training_table_report.json"))
          coverage=json.load(open(".cache/tbt/full-training/coverage_before.json"))
          summary={
              "schema":1,
              "canonical_completed":coverage["overall"]["completed"],
              "canonical_complete_serve_return":coverage["overall"]["both_ready"],
              "canonical_complete_serve_return_rate":coverage["both_ready_rate"],
              "training_rows":(train.get("data") or {}).get("matches_total"),
              "split":{
                  "train":(train.get("data") or {}).get("train"),
                  "calibration":(train.get("data") or {}).get("calibration"),
                  "holdout":(train.get("data") or {}).get("holdout"),
              },
              "holdout":train.get("holdout"),
              "elo_holdout":train.get("elo_baseline_holdout"),
              "production_holdout":train.get("production_holdout"),
              "delta_vs_elo":train.get("delta_vs_elo"),
              "delta_vs_production":train.get("delta_vs_production"),
              "candidate_decision":train.get("promotion_decision"),
              "walk_forward":{
                  "tested_matches":walk.get("tested_matches"),
                  "overall":walk.get("overall"),
                  "elo_baseline_overall":walk.get("elo_baseline_overall"),
                  "delta_vs_elo":walk.get("delta_vs_elo"),
              },
              "promotion_readiness":ready,
              "training_table_event_statistics":table.get("event_statistics"),
              "production_promoted":False,
              "provider_requests":0,
          }
          p=Path(".cache/tbt/full-training/full_training_summary.json")
          p.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Persist latest full-training audit privately
        run: |
          set -euo pipefail
          path="audit/full-training-latest.json"
          encoded="$(base64 -w0 .cache/tbt/full-training/full_training_summary.json)"
          sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Update BlinQ full enriched training audit"               -f content="$encoded" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Add BlinQ full enriched training audit"               -f content="$encoded" >/dev/null
          fi

      - name: Upload full training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-full-enriched-training-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            .cache/tbt/full-training/*.json
            .cache/tbt/model/training_report.json
            .cache/tbt/model/promotion_history.json
