name: Market odds - exact quote collection and calibration pilot

on:
  workflow_dispatch:
    inputs:
      max_events:
        description: "Upcoming published SG events to query (one request each)"
        required: true
        type: choice
        options: ["10", "20", "30", "40"]
        default: "30"
      max_requests:
        description: "Hard cap on RapidAPI requests"
        required: true
        type: choice
        options: ["20", "40", "60"]
        default: "40"
  schedule:
    # Opt-in via repo variable TBT_MARKET_QUOTES_AUTO=true after the first pilot.
    - cron: '25 6,12,18 * * *'

permissions:
  contents: read

# Independent dedicated release: never race with itself or mutate production.
concurrency:
  group: tbt-market-odds-archive-writer
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' || vars.TBT_MARKET_QUOTES_AUTO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      MAX_EVENTS: ${{ inputs.max_events || '30' }}
      MAX_REQUESTS: ${{ inputs.max_requests || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install and run contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt pytest
          python -m compileall -q api scripts
          python -m pytest tests/test_market_price_observations.py -q
      - name: Verify private archive and provider access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }
          test -n "$RAPIDAPI_KEY" || { echo "Missing RAPIDAPI_KEY"; exit 1; }
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing to write odds outside a PRIVATE repository"; exit 1; }
      - name: Capture real two-sided match-total lines and prices
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collect_market_odds_snapshots.py \
            --data-repository "$TBT_DATA_REPOSITORY" \
            --max-events "$MAX_EVENTS" \
            --max-requests "$MAX_REQUESTS"
      - name: Read-only time-separated market-price calibration audit
        shell: bash
        run: |
          python scripts/audit_market_price_calibration.py \
            --data-repository "$TBT_DATA_REPOSITORY"
      - name: Summarize actual odds coverage
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          def load(name):
              p=Path(".cache/tbt/market-odds")/name
              return json.loads(p.read_text()) if p.exists() else {}
          observations=load("report.json")
          calibration=load("calibration_audit.json")
          print("## BlinQ actual market odds pilot")
          print("Only real, timestamped, two-sided provider lines are persisted.")
          print("No fake odds, no edits to production data, no automatic model deployment.\n")
          for key in ("eligible_upcoming_events", "events_requested", "new_complete_two_sided_quotes", "unique_monthly_quotes", "by_market"):
              if key in observations: print(f"- {key}: {observations[key]}")
          print(f"- Request errors: {len(observations.get('fetch_errors', []))}")
          if calibration:
              print(f"- Historical support: {calibration.get('distinct_events')} events / {calibration.get('distinct_start_days')} days")
              print(f"- Calibration status: {calibration.get('status')}")
              for market, section in calibration.get("segments", {}).items():
                  print(f"- {market}: {section}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinq-market-price-pilot-${{ github.run_id }}
          path: |
            .cache/tbt/market-odds/report.json
            .cache/tbt/market-odds/calibration_audit.json
          if-no-files-found: warn
          retention-days: 30
