name: BlinQ ATP leaderboard research (read-only)

on:
  pull_request:
    paths:
      - 'scripts/audit_atp_leaderboard_ablation.py'
      - 'tests/test_atp_leaderboard_ablation.py'
      - '.github/workflows/atp-leaderboard-ablation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_atp_leaderboard_ablation.py'
      - 'tests/test_atp_leaderboard_ablation.py'
      - '.github/workflows/atp-leaderboard-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-atp-leaderboard-readonly
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install test/train dependencies
        run: python -m pip install -r api/requirements-train.txt pytest
      - name: Contract and model regression tests
        run: python -m pytest tests/test_atp_leaderboard_priors.py tests/test_atp_leaderboard_ablation.py tests/test_backtest_feature_policy.py -q
      - name: Run retrospective ATP paired ablation
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python -u scripts/audit_atp_leaderboard_ablation.py --data-repository "$TBT_DATA_REPOSITORY"
      - name: Upload private evidence (never publish model)
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: atp-leaderboard-research-${{ github.run_id }}
          path: .cache/tbt/atp-leaderboard-ablation/report.json
          if-no-files-found: warn
          retention-days: 30
