name: PropLine nightly quota closeout

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Maximum PropLine attempts in this run (1-750)"
        required: false
        type: number
        default: 750

permissions:
  contents: read

# No GitHub cron: caller owns the schedule. No overlapping closeout writers.
concurrency:
  group: propline-nightly-closeout
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      PROPL: ${{ secrets.PROPL }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      CLOSEOUT_GAP_TARGETS: .cache/tbt/propline-night/gap_targets.json
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      CLOSEOUT_MAX_REQUESTS: ${{ inputs.max_requests || 750 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated canonical read and exact stats write support
        run: python -m pip install 'pandas>=2.1,<3' 'pyarrow>=15,<24'
      - name: Test night-only CDB linker and closeout invariants offline
        run: |
          python -m unittest discover -s tests -p 'test_propline_nightly_closeout.py' -v
          python -m unittest discover -s tests -p 'test_propline_nightly_cdb.py' -v
      - name: Read current canonical 2026 gaps (no provider requests)
        run: python scripts/propline_nightly_cdb.py plan
      - name: Collect gap-targeted historical stats and remaining nightly odds
        run: python scripts/propline_nightly_closeout.py
      - name: Strict exact-link additive CDB import and persisted readback
        run: python scripts/propline_nightly_cdb.py publish
      - name: Preserve local batches if archival fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propline-nightly-closeout-${{ github.run_id }}
          path: |
            reports/*.json.gz
            reports/propline_cdb_gapfill_report.json
          if-no-files-found: ignore
          retention-days: 14
