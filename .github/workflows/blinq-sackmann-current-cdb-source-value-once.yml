name: BlinQ Sackmann full provenance versus CURRENT CDB (one-shot read-only)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/blinq-sackmann-current-cdb-source-value-once.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-sackmann-source-value-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      SOURCE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      OUT: /tmp/blinq-sackmann-current-value
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Aneeshers/tennis-sackmann-archive
          ref: 83733587353df8a41f2fd4f516147d5aa83f5a8d
          path: source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate private output target, pinned source and audit tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$PRIVATE_REPO" --json visibility -q .visibility)" = PRIVATE
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          python -m pip install --quiet 'pandas>=2,<3' pyarrow
          python -m unittest discover -s app/tests -p test_pbp_candidate_audit.py -v
          python -m unittest discover -s app/tests -p test_source_value_routes.py -v
          mkdir -p "$OUT/cdb" "$OUT/results"

      - name: Download one coherent manifest-verified CURRENT canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/download_stable_cdb.py \
            --repository "$PRIVATE_REPO" --out "$OUT/cdb" \
            --report "$OUT/results/snapshot.json"
          gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" > "$OUT/release.json"

      - name: Verify exact source candidates, provenance, NULL-only value routes
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          python -u app/scripts/audit_pbp_source_vs_current_cdb.py \
            --source source --cdb "$OUT/cdb" --release "$OUT/release.json" \
            --out "$OUT/results/pbp-current-cdb-gap.json" \
            --candidates "$OUT/results/pbp-candidates-private.jsonl.gz" \
            > "$OUT/results/pbp-aggregate-stdout.log"
          python -u app/scripts/audit_source_value_routes.py \
            --cdb "$OUT/cdb" --source source \
            --candidates "$OUT/results/pbp-candidates-private.jsonl.gz" \
            --audit "$OUT/results/pbp-current-cdb-gap.json" \
            --out "$OUT/results" \
            > "$OUT/results/value-routes-aggregate-stdout.log"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'results'
          a=json.loads((root/'pbp-current-cdb-gap.json').read_text())
          r=json.loads((root/'value-routes-report.json').read_text())
          c=r['counts']
          assert r['state']=='VERIFIED_VALUE_ROUTE_AUDIT_NOT_A_WRITER'
          assert r['production_writes']==0 and r['model_changes']==0
          assert a['canonical_writes']==0 and a['approved_cdb_cells']==0
          assert c['canonical_rows']==a['counts']['cdb_rows']
          assert c['canonical_rows']>=995143 and c['canonical_complement_cells']>=0
          assert c['candidate_cells_total']==c['candidate_cells_recoverable_from_cdb']+c['candidate_cells_requiring_external_values']
          assert c['candidate_cells_requiring_external_values']==sum(
            v for k,v in c.items() if k.endswith('_external_cells'))
          assert c['candidate_cells_recoverable_from_cdb']==(
            c['candidate_cells_cdb_recovery_agrees_exactly']+c['candidate_cells_cdb_recovery_differs'])
          assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
                     for name,digest in r['outputs'].items())
          assert hashlib.sha256((root/'pbp-candidates-private.jsonl.gz').read_bytes()).hexdigest()==a['candidate_ledger_sha256']
          print('READ_ONLY_VALUE_ROUTE_VERIFIED',json.dumps({
            'canonical_matches':c['canonical_rows'],
            'complement_cells':c['canonical_complement_cells'],
            'external_cells':c['candidate_cells_requiring_external_values'],
            'provenance_native_external_cells':c.get('HISTORICAL_SOURCE_PROVENANCE_NATIVE_PLAYERS_external_cells',0),
            'remapped_external_cells':c.get('HISTORICAL_SOURCE_PROVENANCE_REMAPPED_PLAYERS_external_cells',0),
            'overlap_value_conflicts':c['candidate_cells_cdb_recovery_differs'],
            'published_cdb_cells':0,
          },sort_keys=True),flush=True)
          PY

      - name: Store event-level evidence exclusively in PRIVATE repository; independent checksum read-back
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUT/results"
          sha256sum snapshot.json pbp-current-cdb-gap.json pbp-candidates-private.jsonl.gz \
            canonical-complement-research.jsonl.gz source-value-routes.jsonl.gz \
            value-routes-report.json > SHA256SUMS
          sha256sum -c SHA256SUMS
          tag="blinq-sackmann-current-value-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$tag" -R "$PRIVATE_REPO" --target main \
            --title "BlinQ current CDB source value evidence ${{ github.run_id }}" \
            --notes "Research only; raw source/native IDs; not write-authorized, no import, no model change."
          gh release upload "$tag" SHA256SUMS snapshot.json pbp-current-cdb-gap.json \
            pbp-candidates-private.jsonl.gz canonical-complement-research.jsonl.gz \
            source-value-routes.jsonl.gz value-routes-report.json -R "$PRIVATE_REPO"
          mkdir -p "$OUT/independent-readback"
          gh release download "$tag" -R "$PRIVATE_REPO" -D "$OUT/independent-readback"
          (cd "$OUT/independent-readback" && sha256sum -c SHA256SUMS)
          echo "PRIVATE_SOURCE_VALUE_READBACK_VERIFIED"
