name: BlinQ Valuebet market sidecar

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/valuebet-market-sidecar-request.json"
      - ".github/workflows/valuebet-market-sidecar.yml"
      - "scripts/link_valuebetennis_market_history.py"
      - "api/tbt/data/offline_market_history.py"
      - "tests/test_valuebet_market_sidecar_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/valuebet-market-sidecar-request.json"
      - ".github/workflows/valuebet-market-sidecar.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tbt-valuebet-sidecar-pr-{0}', github.ref) || 'tbt-valuebet-sidecar' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      SOURCE_PAGE: https://www.valuebetennis.com/en/donnees.htm
      SOURCE_BASE: https://www.valuebetennis.com/datasets
      SOURCE_LABEL: valuebetennis_cc_by_4
    steps:
      - uses: actions/checkout@v4

      - name: Validate controlled request
        run: |
          set -euo pipefail
          request=.github/valuebet-market-sidecar-request.json
          test -s "$request"
          test "$(jq -r '.mode' "$request")" = "publish-sidecar"
          test "$(jq -r '.license' "$request")" = "CC BY 4.0"
          test "$(jq -r '.zero_provider_api_requests' "$request")" = "true"
          test "$(jq -r '.production_mutated' "$request")" = "false"
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies and focused tests
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m pytest tests/test_offline_market_history_v2.py tests/test_valuebet_market_sidecar_contract.py -q

      - name: Verify private destination
        run: |
          set -euo pipefail
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"

      - name: Download current CC BY 4.0 source files
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/valuebet/source
          for year in 2021 2022 2023 2024 2025 2026; do
            url="$SOURCE_BASE/valuebetennis-matchs-$year.csv"
            target=".cache/tbt/valuebet/source/valuebetennis-matchs-$year.csv"
            curl --fail --location --retry 5 --retry-delay 2 "$url" -o "$target"
            test -s "$target"
          done
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          root = Path(".cache/tbt/valuebet/source")
          files = []
          total_rows = 0
          for path in sorted(root.glob("valuebetennis-matchs-*.csv")):
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              with path.open("r", encoding="utf-8-sig", newline="") as handle:
                  rows = sum(1 for _ in csv.reader(handle, delimiter=";")) - 1
              if rows < 50000:
                  raise SystemExit(f"Unexpectedly small source file: {path.name} rows={rows}")
              total_rows += rows
              files.append({"file": path.name, "rows": rows, "sha256": sha})
          if len(files) != 6:
              raise SystemExit(f"Expected six season files, got {len(files)}")
          if total_rows < 450000:
              raise SystemExit(f"Unexpectedly small Valuebet corpus: {total_rows}")
          Path(".cache/tbt/valuebet/source-manifest.json").write_text(
              json.dumps({"source_page": "https://www.valuebetennis.com/en/donnees.htm",
                          "license": "CC BY 4.0",
                          "files": files,
                          "total_rows": total_rows}, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({"total_rows": total_rows, "files": files}, indent=2))
          PY

      - name: Download checksum-verified canonical history
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore

          directory = Path(".cache/tbt/valuebet/history")
          store = ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", directory)
          store.download(require_bundle_manifest=True)
          PY

      - name: Link Valuebet opening and pre-match closing odds
        run: |
          set -euo pipefail
          args=()
          for year in 2021 2022 2023 2024 2025 2026; do
            args+=(--source-csv ".cache/tbt/valuebet/source/valuebetennis-matchs-$year.csv")
          done
          python scripts/link_valuebetennis_market_history.py             --history-dir .cache/tbt/valuebet/history             "${args[@]}"             --source-label "$SOURCE_LABEL"             --out-dir .cache/tbt/valuebet/link
          test -s .cache/tbt/valuebet/link/report.json
          test -s .cache/tbt/valuebet/link/auto_linked.jsonl

      - name: Validate linker and build year sidecars
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json
          from collections import Counter, defaultdict
          from pathlib import Path

          report = json.loads(Path(".cache/tbt/valuebet/link/report.json").read_text())
          counts = report.get("counts") or {}
          if int(report.get("api_requests", -1)) != 0:
              raise SystemExit("Valuebet linker unexpectedly used provider API")
          if report.get("production_mutated") is not False:
              raise SystemExit("Valuebet linker unexpectedly mutated production")
          staged = int(counts.get("staged_matches") or 0)
          if staged <= 0:
              raise SystemExit("No Valuebet market-history matches linked")

          source_manifest = json.loads(Path(".cache/tbt/valuebet/source-manifest.json").read_text())
          rows_by_year = defaultdict(list)
          opening = Counter()
          closing = Counter()
          bookmaker = Counter()

          with Path(".cache/tbt/valuebet/link/auto_linked.jsonl").open("r", encoding="utf-8") as handle:
              for line in handle:
                  row = json.loads(line)
                  year = str(row["canonical"]["scheduled_date_utc"])[:4]
                  marker = row["incoming_market_history"]
                  rows_by_year[year].append(row)
                  if marker.get("opening") is not None:
                      opening[year] += 1
                  if marker.get("closing") is not None:
                      closing[year] += 1
                  if marker.get("opening") is not None and marker.get("closing") is not None:
                      bookmaker[year] += 1

          sidecar_dir = Path(".cache/tbt/valuebet/sidecar")
          sidecar_dir.mkdir(parents=True, exist_ok=True)
          per_year = {}
          for year, rows in sorted(rows_by_year.items()):
              path = sidecar_dir / f"valuebet-market-{year}.jsonl.gz"
              with gzip.open(path, "wt", encoding="utf-8", compresslevel=6) as out:
                  for row in rows:
                      out.write(json.dumps(row, ensure_ascii=False, separators=(",", ":")) + "\n")
              per_year[year] = {
                  "rows": len(rows),
                  "opening": opening[year],
                  "closing": closing[year],
                  "opening_and_closing": bookmaker[year],
                  "bytes_gzip": path.stat().st_size,
              }

          audit = {
              "schema": 1,
              "source": {
                  "name": "Valuebetennis",
                  "page": source_manifest["source_page"],
                  "license": source_manifest["license"],
                  "attribution": "Valuebetennis, Tennis results and odds since 2021, https://www.valuebetennis.com/en/donnees.htm",
                  "files": source_manifest["files"],
                  "total_rows": source_manifest["total_rows"],
              },
              "link_report": report,
              "sidecar": {
                  "path_prefix": "research/historical_market/valuebet",
                  "per_year": per_year,
                  "total_rows": sum(item["rows"] for item in per_year.values()),
              },
              "api_requests": 0,
              "production_mutated": False,
              "price_semantics": {
                  "opening": "market opening odds as defined by Valuebetennis",
                  "closing": "last odds recorded by Valuebetennis before the match",
              },
              "model_feature_policy": "opening_only_candidate_after_separate_leakage_ablation; closing_validation_only",
          }
          Path(".cache/tbt/valuebet/valuebet-market-sidecar-audit.json").write_text(
              json.dumps(audit, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "source_rows": source_manifest["total_rows"],
              "staged_matches": staged,
              "per_year": per_year,
          }, indent=2))
          PY

      - name: Publish private year sidecars and audit
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          upload_file() {
            local source="$1"
            local path="$2"
            local message="$3"
            local existing_sha
            existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
            SOURCE_FILE="$source" EXISTING_SHA="$existing_sha" COMMIT_MESSAGE="$message" python - <<'PY'
          import base64, json, os
          from pathlib import Path
          payload = {
              "message": os.environ["COMMIT_MESSAGE"],
              "content": base64.b64encode(Path(os.environ["SOURCE_FILE"]).read_bytes()).decode("ascii"),
          }
          if os.environ.get("EXISTING_SHA"):
              payload["sha"] = os.environ["EXISTING_SHA"]
          Path("/tmp/valuebet-upload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               --input /tmp/valuebet-upload.json >/dev/null
          }

          for file in .cache/tbt/valuebet/sidecar/valuebet-market-*.jsonl.gz; do
            base="$(basename "$file")"
            upload_file "$file" "research/historical_market/valuebet/$base"               "Update Valuebet historical market sidecar $base from run $GITHUB_RUN_ID"
          done
          upload_file             .cache/tbt/valuebet/valuebet-market-sidecar-audit.json             audit/valuebet-market-sidecar-latest.json             "Audit Valuebet market sidecar run $GITHUB_RUN_ID"

      - name: Upload workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: blinq-valuebet-market-sidecar-${{ github.run_id }}
          path: |
            .cache/tbt/valuebet/source-manifest.json
            .cache/tbt/valuebet/link/report.json
            .cache/tbt/valuebet/link/review.jsonl
            .cache/tbt/valuebet/link/quarantine.jsonl
            .cache/tbt/valuebet/valuebet-market-sidecar-audit.json
          if-no-files-found: error
          retention-days: 14
