name: BlinQ Charting 13-cell candidate independent witness review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blinq-charting-13-cell-witness-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-charting-13-cell-witness-readonly
  cancel-in-progress: false

jobs:
  witness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: main
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: private-data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch verified private context field-gap observations
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          mkdir -p work/source work/out
          gh release download blinq-charting-context-recovery-38305377606-1 \
            -R "$PRIVATE_REPO" -p 'field_gap_research_only.jsonl.gz' \
            -p 'field_gap_report.json' -p 'context_recovery_report.json' -D work/source
          python - <<'PY'
          import gzip,json,hashlib
          from pathlib import Path
          base=Path('work')
          report=json.loads((base/'source/field_gap_report.json').read_text())
          src=base/'source/field_gap_research_only.jsonl.gz'
          digest=hashlib.sha256(src.read_bytes()).hexdigest()
          assert report['field_gap_output_sha256']==digest
          with gzip.open(src,'rt') as f:
              rows=[json.loads(line) for line in f if line.strip()]
          targets=[r for r in rows if r.get('status')=='RESEARCH_FIELD_GAPS_PENDING_EVENT_ID_PROOF']
          assert len(targets)==1 and len(targets[0]['missing_cells'])==13
          charting={}
          with gzip.open('private-data/tennis/charting/matches.json.gz','rt') as f:charting=json.load(f)
          target=targets[0]
          chart=charting[target['source_match_id']]
          output={'schema':1,'status':'RESEARCH_ONLY_EVENT_ID_WITNESS_REQUIRED',
                  'source_match':chart,'source_match_id':target['source_match_id'],
                  'canonical_candidate_id':target['canonical_match_id_candidate'],
                  'context_link_type':target['source_match_status'],
                  'missing_cells':target['missing_cells'],
                  'matching_existing_cells':target['matching_existing_cells'],
                  'profile_provenance':target.get('source_profile_provenance'),
                  'canonical_partition_sha256':report['canonical_partition_sha256'],
                  'event_identity_proven':False,'cdb_writes':0}
          (base/'out/candidate.json').write_text(json.dumps(output,indent=2,ensure_ascii=False)+'\n')
          from datetime import datetime,timedelta
          day=datetime.strptime(str(chart['date']),'%Y%m%d').date()
          years=sorted({(day+timedelta(days=d)).year for d in (-1,0,1)})
          years=[year for year in years if f'history-{year}.parquet' in report['canonical_partition_sha256']]
          assert years
          (base/'out/years.txt').write_text(' '.join(map(str,years)))
          print('SINGLE_RESEARCH_CANDIDATE_EXTRACTED',len(target['missing_cells']))
          PY
      - name: Independently read current provider event and players from relevant partition
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyarrow
          for year in $(cat work/out/years.txt); do
            gh release download tbt-data-v1 -R "$PRIVATE_REPO" \
              -p "history-$year.parquet" -D work/source
          done
          python - <<'PY'
          import json,hashlib,pyarrow.parquet as pq
          from pathlib import Path
          root=Path('work')
          target=json.loads((root/'out/candidate.json').read_text())
          matches=[]
          partitions=list((root/'source').glob('history-*.parquet'))
          assert partitions
          for partition in partitions:
              assert hashlib.sha256(partition.read_bytes()).hexdigest()==target['canonical_partition_sha256'][partition.name]
              pf=pq.ParquetFile(partition)
              available=set(pf.schema.names)
              keys=sorted(set(['match_id','player1_id','player2_id','player1_name','player2_name',
                               'winner_id','tournament','round_name','surface','scheduled_at',
                               'provider_context_json','score','stats_json']) & available)
              for batch in pf.iter_batches(columns=keys,batch_size=8192):
                  for row in batch.to_pylist():
                      if str(row.get('match_id'))==target['canonical_candidate_id']:
                          matches.append((row,partition))
          if len(matches)!=1:raise ValueError('One canonical target not proven in current pinned year')
          row,matched_partition=matches[0]
          ctx=row.get('provider_context_json')
          if isinstance(ctx,str):ctx=json.loads(ctx)
          if not isinstance(ctx,dict):ctx={}
          identity=ctx.get('_tbt_event_identity')
          candidate_event={
             'canonical_match_id':str(row['match_id']),
             'player1_id':str(row['player1_id']),
             'player2_id':str(row['player2_id']),
             'player1_name':row.get('player1_name'),
             'player2_name':row.get('player2_name'),
             'tournament':row.get('tournament'),
             'round_name':row.get('round_name'),
             'surface':row.get('surface'),
             'scheduled_at':str(row.get('scheduled_at')),
             'winner_id':str(row.get('winner_id')),
             'provider_event_id':ctx.get('_tbt_provider_event_id') or ctx.get('provider_event_id'),
             'trusted_event_identity':identity,
             'score':row.get('score'),
             'source_claimed_native_provider_event_id':None,
             'source_event_to_canonical_provider_id_independently_proven':False,
          }
          target['canonical_event']=candidate_event
          target['decision']='BLOCK_CDB_WRITE_NO_INDEPENDENT_SOURCE_PROVIDER_EVENT_WITNESS'
          target['readback_sha256']=hashlib.sha256(matched_partition.read_bytes()).hexdigest()
          (root/'out/candidate.json').write_text(json.dumps(target,indent=2,ensure_ascii=False,default=str)+'\n')
          print('PINNED_CANONICAL_EVENT_READ',len(matches),'CDB_WRITES=0')
          PY
      - name: Publish isolated private event evidence with checksummed readback
        shell: bash
        run: |
          set -euo pipefail
          tag="blinq-charting-single-event-witness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p work/readback
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('work/out/candidate.json').read_text())
          notes=[
            'Research-only exact source/canonical event investigation. CDB unchanged.',
            'SOURCE_ID='+r['source_match_id'],
            'CANONICAL_ID='+r['canonical_candidate_id'],
            'LINK_TYPE='+r['context_link_type'],
            'PLAYER_NAMES='+json.dumps(r['source_match'].get('players'),ensure_ascii=False),
            'SOURCE_CONTEXT='+json.dumps({k:r['source_match'].get(k) for k in ('tour','date','tournament','round','surface')},ensure_ascii=False),
            'CANONICAL_CONTEXT='+json.dumps({k:v for k,v in r['canonical_event'].items() if k not in ('trusted_event_identity',)},ensure_ascii=False,default=str),
            'MISSING_STATS='+json.dumps(r['missing_cells'],sort_keys=True),
            'MATCHING_EXISTING_FIELDS='+json.dumps(r['matching_existing_cells']),
            'INDEPENDENT_EVENT_ID_PROVEN=false',
            'CDB_WRITES=0']
          Path('work/out/summary.md').write_text('\n'.join(notes)+'\n')
          PY
          (cd work/out && sha256sum candidate.json summary.md > SHA256SUMS && sha256sum -c SHA256SUMS)
          gh release create "$tag" work/out/candidate.json work/out/summary.md work/out/SHA256SUMS \
            -R "$PRIVATE_REPO" --title 'BlinQ single Charting match identity witness (read-only)' \
            --notes-file work/out/summary.md
          gh release download "$tag" -R "$PRIVATE_REPO" -D work/readback
          (cd work/readback && sha256sum -c SHA256SUMS)
          echo "PRIVATE_WITNESS_READBACK_VERIFIED: $tag, CDB_WRITES=0"