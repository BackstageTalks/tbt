name: BlinQ 7.1.1 approved shadow candidate switch (one-time)
# Retry after promotion-history preservation fix 5c11a9bc; no production activation.
on:
  push:
    branches: [ops/blinq-shadow-711-switch-20261014]
    paths:
      - .github/workflows/blinq-shadow-711-switch-once.yml

permissions:
  contents: read

concurrency:
  group: blinq-711-shadow-switch-once
  cancel-in-progress: false

jobs:
  switch-shadow-only:
    if: github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
      BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
      PYTHONPATH: api:scripts
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Verify private permissions and install model dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$BLINQ_LIVE_WORKER_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility --jq .visibility)" = PRIVATE
          python -m pip install -r api/requirements-train.txt pytest
      - name: Test shadow cohort isolation and frozen candidate invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/switch_frozen_candidate_to_shadow.py
          python -m pytest -q tests/test_shadow_candidate_switch.py tests/test_shadow_evaluation.py tests/test_model_calibration_status.py
      - name: Acquire cross-repository lock without changing canonical data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_global_writer_lock.py acquire --wait-seconds 1200
      - name: Archive previous shadow and copy verified 7.1.1 binary to active shadow
        shell: bash
        run: |
          set -euo pipefail
          python scripts/switch_frozen_candidate_to_shadow.py | tee /tmp/blinq-shadow-switch-711-proof.jsonl
          grep -E -q 'SHADOW_SWITCH_VERIFIED|ALREADY_SWITCHED' /tmp/blinq-shadow-switch-711-proof.jsonl
      - name: Refresh signed Admin calibration snapshot without deploy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_model_calibration_status.py --output /tmp/blinq-shadow-admin-711.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/blinq-shadow-admin-711.json').read_text())
          expected = "v201-20261014T183415325901Z"
          assert report["candidate_version"] == expected, "New shadow candidate missing in Admin report"
          assert report["production_version"] == "v201-20260925T204608601094Z"
          assert (report.get("offline_candidate") or {}).get("candidate_version") == expected
          print(json.dumps({"admin_candidate": expected, "admin_offline_candidate": expected, "no_production_promotion": True}))
          PY
      - name: Release global lock when runner survives
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_global_writer_lock.py release --if-held
      - name: Publish only non-sensitive proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-711-shadow-switch-${{ github.run_id }}
          path: /tmp/blinq-shadow-switch-711-proof.jsonl
          if-no-files-found: warn
          retention-days: 30

  independent-lock-cleanup:
    if: always()
    needs: switch-shadow-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - name: Verify exact run owner before orphan lock cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          repo='BackstageTalks/tbt-data'
          endpoint="repos/$repo/git/ref/tags/blinq-cdb-global-writer"
          expected="owner=$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          if ! result="$(gh api "$endpoint" 2>/tmp/blinq-lock.err)"; then
            if grep -q 'HTTP 404' /tmp/blinq-lock.err; then
              echo 'Verified: CDB global writer lock absent.'
              exit 0
            fi
            cat /tmp/blinq-lock.err >&2
            exit 1
          fi
          sha="$(jq -er .object.sha <<<"$result")"
          owner="$(gh api "repos/$repo/git/tags/$sha" --jq .message)"
          if [[ "$owner" != "$expected" ]]; then
            echo 'Lock belongs to a different writer; preserving it.'
            exit 0
          fi
          [[ "$(gh api "$endpoint" --jq .object.sha)" == "$sha" ]] || exit 1
          gh api --method DELETE "repos/$repo/git/refs/tags/blinq-cdb-global-writer" --silent
          if gh api "$endpoint" >/tmp/blinq-check.json 2>/tmp/blinq-check.err; then
            echo "::error::Writer lock still exists"
            exit 1
          fi
          grep -q 'HTTP 404' /tmp/blinq-check.err || exit 1
          echo 'Verified: exact stale owner lock removed.'
