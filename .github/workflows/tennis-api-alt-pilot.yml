name: Tennis API ATP WTA ITF · 50/day pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-api-alt-50daily-manual-pilot
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check RapidAPI secret
        run: test -n "$RAPIDAPI_KEY" || { echo "Set existing RAPIDAPI_KEY secret"; exit 1; }
      - name: Probe ATP WTA upcoming and exact live odds market names
        run: python scripts/tennis_api_alt_pilot.py
      - name: Save 7-day odds market audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-api-alt-market-pilot
          path: reports/tennis_api_alt_50day.json
          if-no-files-found: warn
          retention-days: 7
