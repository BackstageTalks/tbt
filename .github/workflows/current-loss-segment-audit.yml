name: Current loss segment audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'ops/current-loss-audit-20261002' || github.ref_name == 'ops/current-loss-audit-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify private data access
        run: |
          test -n "$GH_TOKEN"
          gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility
      - name: Run issued-market audits
        run: |
          python scripts/audit_top_reliability.py             --data-repository "$TBT_DATA_REPOSITORY"             --window-days 90             --out .cache/tbt/current-loss/top.json
          python scripts/audit_market_reliability.py             --data-repository "$TBT_DATA_REPOSITORY"             --window-days 90             --out .cache/tbt/current-loss/market.json             --markdown .cache/tbt/current-loss/market.md
      - name: Print decision evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          top = json.loads(Path(".cache/tbt/current-loss/top.json").read_text())
          market = json.loads(Path(".cache/tbt/current-loss/market.json").read_text())

          def compact(m):
              keys = ("published","settled","wins","losses","hit_rate","average_odds",
                      "yield_flat_stake","calibration_n","mean_confidence",
                      "observed_minus_predicted","brier","small_sample")
              return {k:m.get(k) for k in keys}

          out = {
              "top_overall": compact(top["overall"]),
              "top_by_competition": {k:compact(v) for k,v in top["subgroups"]["competition"].items()},
              "top_by_confidence": {k:compact(v) for k,v in top["subgroups"]["confidence_band"].items()},
              "top_by_stats": {k:compact(v) for k,v in top["subgroups"]["stats"].items()},
              "top_by_surface_evidence": {k:compact(v) for k,v in top["subgroups"]["surface_evidence"].items()},
              "top_by_picked_rank": {k:compact(v) for k,v in top["subgroups"]["picked_rank"].items()},
              "market_sections": {k:compact(v["overall"]) for k,v in market["sections"].items()},
              "top_market_by_depth": {k:compact(v) for k,v in market["sections"]["top_daily"]["by_data_depth"].items()},
              "top_market_by_confidence": {k:compact(v) for k,v in market["sections"]["top_daily"]["by_confidence"].items()},
              "value_by_depth": {k:compact(v) for k,v in market["sections"]["value"]["by_data_depth"].items()},
              "high_confidence_top_losses": market["high_confidence_top_losses"],
              "probability_market_discrepancies": market["probability_market_discrepancies"],
              "recent_value_losses": market["value_audit"]["recent_losses"],
              "diagnostics": market["diagnostics"],
          }
          print("BLINQ_CURRENT_LOSS_AUDIT_BEGIN")
          print(json.dumps(out, indent=2, ensure_ascii=False))
          print("BLINQ_CURRENT_LOSS_AUDIT_END")
          PY
      - name: Isolate current champion cohorts
        run: |
          python - <<'PY'
          import json, sys
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import audit_market_reliability as a

          ledger = json.loads(Path(".cache/tbt/market-quality/input/ledger.json").read_text())
          now = datetime.now(timezone.utc)
          start = now - timedelta(days=90)
          candidates = {}
          for row in ledger:
              if not isinstance(row, dict):
                  continue
              for pub in row.get("market_publications") or []:
                  if not isinstance(pub, dict) or pub.get("section") not in {"top_daily", "value"}:
                      continue
                  if str(pub.get("market") or "").lower() != "match_winner":
                      continue
                  issued = a.timestamp(pub.get("issued_at"))
                  result = pub.get("result") if isinstance(pub.get("result"), dict) else {}
                  scheduled = a.timestamp(result.get("scheduled_at") or row.get("scheduled_at"))
                  if issued is None or scheduled is None or not start <= scheduled < now:
                      continue
                  if issued >= scheduled or pub.get("excluded_reason") or pub.get("publication_status") in {"pending", "expired_unpublished"}:
                      continue
                  key = a._semantic_key(row, pub)
                  if key is None:
                      continue
                  prior = candidates.get(key)
                  if prior is None or issued < prior[2]:
                      candidates[key] = (row, pub, issued, scheduled)

          rows = []
          for row, pub, issued, scheduled in candidates.values():
              correct, status = a._outcome(pub)
              if status not in {"win", "loss"}:
                  continue
              probability, source = a._probability(row, pub)
              depth = a._depth(row, pub)
              version, version_source = a._model_version(row, pub)
              rows.append({
                  "section": str(pub.get("section")),
                  "correct": bool(correct),
                  "probability": probability,
                  "probability_source": source,
                  "depth": depth,
                  "competition": a.competition(row),
                  "model_version": version,
                  "model_version_source": version_source,
                  "scheduled": scheduled,
              })

          versions = sorted({r["model_version"] for r in rows if r["model_version"] != "unverified"})
          current = versions[-1] if versions else ""
          current_rows = [r for r in rows if r["model_version"] == current]

          def conf_band(p):
              if p is None: return "unknown"
              if p < .65: return "lt65"
              if p < .68: return "65_68"
              if p < .72: return "68_72"
              if p < .75: return "72_75"
              if p < .80: return "75_80"
              return "80_plus"
          def depth_band(d):
              if d is None: return "unknown"
              if d < .80: return "lt080"
              if d < .90: return "080_090"
              return "090_plus"
          def summarize(xs):
              n=len(xs); w=sum(r["correct"] for r in xs)
              known=[r for r in xs if r["probability"] is not None]
              return {"n":n,"wins":w,"losses":n-w,"hit_rate":w/n if n else None,
                      "mean_probability":sum(r["probability"] for r in known)/len(known) if known else None,
                      "known_probability_n":len(known)}
          def grouped(xs, fn):
              d=defaultdict(list)
              for r in xs: d[fn(r)].append(r)
              return {k:summarize(v) for k,v in sorted(d.items())}

          out = {
              "current_model_version": current,
              "overall": summarize(current_rows),
              "by_section": grouped(current_rows, lambda r:r["section"]),
              "by_section_confidence": grouped(current_rows, lambda r:f"{r['section']}|{conf_band(r['probability'])}"),
              "by_section_competition": grouped(current_rows, lambda r:f"{r['section']}|{r['competition']}"),
              "by_section_competition_confidence": grouped(current_rows, lambda r:f"{r['section']}|{r['competition']}|{conf_band(r['probability'])}"),
              "by_section_depth": grouped(current_rows, lambda r:f"{r['section']}|{depth_band(r['depth'])}"),
              "last_7d": summarize([r for r in current_rows if r["scheduled"] >= now-timedelta(days=7)]),
              "last_14d": summarize([r for r in current_rows if r["scheduled"] >= now-timedelta(days=14)]),
          }
          Path(".cache/tbt/current-loss/current_champion.json").write_text(json.dumps(out, indent=2, ensure_ascii=False))
          print("BLINQ_CURRENT_CHAMPION_BEGIN")
          print(json.dumps(out, indent=2, ensure_ascii=False))
          print("BLINQ_CURRENT_CHAMPION_END")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: current-loss-segment-audit
          path: .cache/tbt/current-loss/
          retention-days: 3
