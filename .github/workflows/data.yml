name: Tennis data and predictions
on:
  push:
    branches: [main]
    paths:
      - '.github/refresh-now'
      - '.github/data-operation-request.json'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [mega-data, doubles-data, sg-rebuild, feature-audit, history, statistics, ace-statistics, sg-scores, provider-probe, environment-static, history-audit, history-manifest-repair, history-integrity-repair, history-repair, history-self-match-repair, production-preflight, production-audit, top-audit, market-audit, results-rebuild, deploy-current, current-refresh, train, backtest, refresh]
        default: history
        required: true
      start:
        description: Oldest date (newest days downloaded first)
        type: string
        default: ''
      lookback_days:
        description: Rolling history window; ignored if start is supplied
        type: number
        default: 1095
      end:
        description: Newest date; blank means yesterday UTC
        type: string
        default: ''
      max_requests:
        description: Global/manual Tennis RapidAPI request cap, including retries. mega-data never exceeds this cap.
        type: number
        default: 1000
      market_odds_max_events:
        description: Current betting-day events to enrich with provider-1 odds during refresh
        type: number
        default: 120
      propline_max_events:
        description: PropLine fallback events per refresh (0 disables; max 75)
        type: number
        default: 75
      doubles_odds_max_events:
        description: Current betting-day doubles candidates to enrich with provider-1 Match Winner odds
        type: number
        default: 40
      betting_day_start_hour:
        description: Europe/Bratislava hour that starts the BlinQ betting day
        type: number
        default: 6
      morning_refresh:
        description: Prepare the new betting day before 06:00, publish after 06:01
        type: boolean
        default: false
      ace_target_samples:
        description: Target recent Aces/DF stat samples per current upcoming player
        type: number
        default: 18
      ace_lookback_days:
        description: Maximum history window for targeted Aces/DF statistics
        type: number
        default: 550
      sg_target_samples:
        description: Target recent structured score samples per current upcoming player
        type: number
        default: 24
      sg_lookback_days:
        description: Maximum history window for targeted Sets/Games score samples
        type: number
        default: 730
      promote:
        description: Publish trained model only if holdout gate passes
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: tbt-history-data-writer
  # Explicit replacement markers may cancel a stale writer; ordinary writers never cancel each other.
  cancel-in-progress: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[replace-current-refresh]') || contains(github.event.head_commit.message, '[replace-stale-data-run]')) }}
jobs:
  pipeline:
    # EMERGENCY API PAUSE 2026-10-06: shared daily quota reached 96%.
    # Blocks all provider/data pipeline dispatches until explicitly reverted.
    if: false
    # Refresh/results publication mutates tbt-predictions-v1, so it must also
    # share the exact production publication lock used by CI/player deploys.
    # History/statistics modes receive a run-unique job group and therefore do
    # not block ordinary application deploys. The workflow-level history lock
    # still serializes all shared history writers.
    concurrency:
      group: ${{ ((github.event_name == 'push' || inputs.mode == 'refresh' || inputs.mode == 'results-rebuild' || inputs.mode == 'deploy-current') && 'tbt-production-deploy') || format('tbt-data-pipeline-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      BLINQ_SHARED_API_BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
      BLINQ_SHARED_API_BUDGET_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      BLINQ_SHARED_API_BUDGET_PURPOSE: ${{ (github.event_name == 'push' || inputs.mode == 'refresh') && 'refresh' || 'history' }}
      PROPL: ${{ secrets.PROPL }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      MODE: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[current-refresh]') && 'current-refresh') || inputs.mode || (github.event_name == 'push' && 'refresh') }}
      START_DATE: ${{ inputs.start }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || 1095 }}
      END_DATE: ${{ inputs.end }}
      MAX_REQUESTS: ${{ inputs.max_requests || 1000 }}
      MARKET_ODDS_MAX_EVENTS: ${{ inputs.market_odds_max_events || 120 }}
      PROPLINE_MAX_EVENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.propline_max_events == 0 && '0' || inputs.propline_max_events || 75 }}
      DOUBLES_ODDS_MAX_EVENTS: ${{ inputs.doubles_odds_max_events || 40 }}
      MORNING_REFRESH: ${{ inputs.morning_refresh && 'true' || 'false' }}
      BETTING_DAY_START_HOUR: ${{ inputs.betting_day_start_hour || 6 }}
      ACE_TARGET_SAMPLES: ${{ inputs.ace_target_samples || 18 }}
      ACE_LOOKBACK_DAYS: ${{ inputs.ace_lookback_days || 550 }}
      SG_TARGET_SAMPLES: ${{ inputs.sg_target_samples || 24 }}
      SG_LOOKBACK_DAYS: ${{ inputs.sg_lookback_days || 730 }}
      PROMOTE: ${{ inputs.promote }}
      TBT_WEATHER_RESEARCH: ${{ vars.TBT_WEATHER_RESEARCH }}
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4

      - name: Resolve controlled push data request
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[data-request]')
        shell: bash
        run: |
          set -euo pipefail
          request=".github/data-operation-request.json"
          test -s "$request" || { echo "Missing controlled data request"; exit 1; }
          mode="$(jq -r '.mode // empty' "$request")"
          case "$mode" in
            train|backtest|feature-audit|production-preflight|deploy-current|ace-statistics|statistics) ;;
            *) echo "Push data request forbids mode: $mode"; exit 1 ;;
          esac
          promote="$(jq -r '.promote // false' "$request")"
          [[ "$promote" == "true" || "$promote" == "false" ]] || { echo "Invalid promote flag"; exit 1; }
          max_requests="$(jq -r '.max_requests // 1000' "$request")"
          [[ "$max_requests" =~ ^[0-9]+$ ]] && (( 10#$max_requests >= 1 && 10#$max_requests <= 12000 )) || {
            echo "Invalid max_requests: $max_requests (expected 1..12000)"; exit 1;
          }
          start_date="$(jq -r '.start // empty' "$request")"
          end_date="$(jq -r '.end // empty' "$request")"
          echo "MODE=$mode" >> "$GITHUB_ENV"
          echo "PROMOTE=$promote" >> "$GITHUB_ENV"
          echo "MAX_REQUESTS=$max_requests" >> "$GITHUB_ENV"
          echo "START_DATE=$start_date" >> "$GITHUB_ENV"
          echo "END_DATE=$end_date" >> "$GITHUB_ENV"
          echo "BLINQ_SHARED_API_BUDGET_PURPOSE=history" >> "$GITHUB_ENV"
          echo "Resolved controlled data request: mode=$mode max_requests=$max_requests start=$start_date end=$end_date promote=$promote"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: python -m pip install -r api/requirements-train.txt
      - name: Execute selected operation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" != provider-probe ]]; then
            test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          fi
          # Writer runs start from a physically clean canonical release. The repair
          # is a no-op when history is already clean and rewrites only affected years.
          if [[ "$MODE" == history || "$MODE" == statistics ]]; then
            python scripts/repair_history_data.py --data-repository "$TBT_DATA_REPOSITORY"
          fi
          if [[ "$MODE" == mega-data ]]; then
            args=(
              --data-repository "$TBT_DATA_REPOSITORY"
              --max-requests "$MAX_REQUESTS"
              --lookback-days "$LOOKBACK_DAYS"
              --ace-target-samples "$ACE_TARGET_SAMPLES"
              --ace-lookback-days "$ACE_LOOKBACK_DAYS"
              --sg-target-samples "$SG_TARGET_SAMPLES"
              --sg-lookback-days "$SG_LOOKBACK_DAYS"
            )
            if [[ -n "$START_DATE" ]]; then args+=(--start "$START_DATE"); fi
            if [[ -n "$END_DATE" ]]; then args+=(--end "$END_DATE"); fi
            python scripts/run_mega_data.py "${args[@]}"
          elif [[ "$MODE" == history || "$MODE" == statistics ]]; then
            args=(--publish --data-repository "$TBT_DATA_REPOSITORY" --mode "$MODE" --lookback-days "$LOOKBACK_DAYS" --max-requests "$MAX_REQUESTS")
            if [[ -n "$START_DATE" ]]; then args+=(--start "$START_DATE"); fi
            if [[ -n "$END_DATE" ]]; then args+=(--end "$END_DATE"); fi
            python scripts/download_tennis_history.py "${args[@]}"
          elif [[ "$MODE" == doubles-data ]]; then
            args=(
              --data-repository "$TBT_DATA_REPOSITORY"
              --lookback-days "$LOOKBACK_DAYS"
              --max-requests "$MAX_REQUESTS"
            )
            if [[ -n "$START_DATE" ]]; then args+=(--start "$START_DATE"); fi
            if [[ -n "$END_DATE" ]]; then args+=(--end "$END_DATE"); fi
            python scripts/enrich_doubles_history.py "${args[@]}"
          elif [[ "$MODE" == ace-statistics ]]; then
            python scripts/enrich_ace_history.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --lookback-days "$ACE_LOOKBACK_DAYS" \
              --target-samples "$ACE_TARGET_SAMPLES" \
              --max-requests "$MAX_REQUESTS"
          elif [[ "$MODE" == sg-scores ]]; then
            python scripts/enrich_sg_history.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --lookback-days "$SG_LOOKBACK_DAYS" \
              --target-samples "$SG_TARGET_SAMPLES" \
              --max-requests "$MAX_REQUESTS"
          elif [[ "$MODE" == sg-rebuild ]]; then
            # Explicit one-off verification sweep. This mode deliberately
            # bypasses the local event-detail cache so the operator can spend a
            # fresh quota window re-validating identity, score and BO3/BO5 facts.
            python scripts/enrich_sg_history.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --lookback-days "$SG_LOOKBACK_DAYS" \
              --target-samples "$SG_TARGET_SAMPLES" \
              --max-requests "$MAX_REQUESTS" \
              --rebuild-existing \
              --force-provider-refresh
          elif [[ "$MODE" == feature-audit ]]; then
            python scripts/download_production_preflight_inputs.py
            python scripts/audit_feature_v3_coverage.py \
              --history-dir .cache/tbt/history \
              --out .cache/tbt/feature-v3/coverage.json
          elif [[ "$MODE" == provider-probe ]]; then
            python scripts/probe_tennis_provider.py \
              --max-requests "$MAX_REQUESTS" \
              --days-back 3 --days-ahead 2 \
              --odds-samples 12 --stats-samples 8
          elif [[ "$MODE" == environment-static ]]; then
            end_date="$END_DATE"
            if [[ -z "$end_date" ]]; then end_date="$(date -u +%F)"; fi
            start_date="$START_DATE"
            if [[ -z "$start_date" ]]; then start_date="$(date -u -d "$end_date - $LOOKBACK_DAYS days" +%F)"; fi
            python scripts/enrich_environment_snapshot.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --start "$start_date" --end "$end_date" \
              --static-only --complete-static \
              --max-requests "$MAX_REQUESTS"
          elif [[ "$MODE" == history-audit ]]; then
            python scripts/audit_history_data.py --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == history-manifest-repair ]]; then
            python scripts/repair_missing_history_manifest.py --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == history-integrity-repair ]]; then
            python scripts/repair_history_bundle_integrity.py --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == history-repair ]]; then
            python scripts/repair_history_data.py --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == history-self-match-repair ]]; then
            python scripts/repair_history_self_match.py --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == production-audit ]]; then
            python scripts/audit_production_predictions.py \
              --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == top-audit ]]; then
            python scripts/audit_top_reliability.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --window-days 90
          elif [[ "$MODE" == market-audit ]]; then
            python scripts/audit_market_reliability.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --window-days 90
          elif [[ "$MODE" == results-rebuild ]]; then
            python scripts/rebuild_results_history.py \
              --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == deploy-current ]]; then
            python scripts/init_shadow_release.py \
              --data-repository "$TBT_DATA_REPOSITORY"
            echo "Reusing current private prediction candidate; no Tennis RapidAPI calls."
          elif [[ "$MODE" == production-preflight ]]; then
            python scripts/download_production_preflight_inputs.py
            profiles=()
            if [[ -s .cache/tbt/player-assets/player_profiles.json ]]; then
              profiles=(--profiles .cache/tbt/player-assets/player_profiles.json)
            fi
            python scripts/build_player_master.py \
              --history-dir .cache/tbt/history \
              "${profiles[@]}" \
              --out .cache/tbt/production/player_master.json \
              --csv .cache/tbt/production/player_master.csv \
              --report .cache/tbt/production/player_master_report.json
            python scripts/build_tournament_venue_master.py \
              --history-dir .cache/tbt/history \
              --tournaments-out .cache/tbt/production/tournament_master.json \
              --tournaments-csv .cache/tbt/production/tournament_master.csv \
              --venues-out .cache/tbt/production/venue_master.json \
              --venues-csv .cache/tbt/production/venue_master.csv \
              --report .cache/tbt/production/tournament_venue_report.json
            python scripts/build_production_training_table.py \
              --history-dir .cache/tbt/history \
              --out .cache/tbt/production/training_table.parquet \
              --report .cache/tbt/production/training_table_report.json
            python scripts/audit_training_leakage.py \
              --history-dir .cache/tbt/history \
              --report .cache/tbt/production/leakage_audit_report.json
            python scripts/audit_statistics_inventory.py \
              --history-dir .cache/tbt/history \
              --out .cache/tbt/production/statistics_inventory_report.json
            python scripts/build_production_readiness_report.py \
              --player-report .cache/tbt/production/player_master_report.json \
              --tournament-report .cache/tbt/production/tournament_venue_report.json \
              --training-report .cache/tbt/production/training_table_report.json \
              --leakage-report .cache/tbt/production/leakage_audit_report.json \
              --statistics-report .cache/tbt/production/statistics_inventory_report.json \
              --out .cache/tbt/production/readiness_report.json \
              --markdown .cache/tbt/production/readiness_report.md
          else
            args=(
              "$MODE"
              --max-requests "$MAX_REQUESTS"
              --market-odds-max-events "$MARKET_ODDS_MAX_EVENTS" \
              --propline-max-events "$PROPLINE_MAX_EVENTS"
              --doubles-odds-max-events "$DOUBLES_ODDS_MAX_EVENTS"
              --betting-day-start-hour "$BETTING_DAY_START_HOUR"
            )
            if [[ "$PROMOTE" == true ]]; then args+=(--promote); fi
            if [[ "$MORNING_REFRESH" == true ]]; then args+=(--morning-refresh); fi
            if [[ "$MODE" == train ]]; then
              # Train is always preceded by the same fail-closed point-in-time
              # leakage audit used by production-preflight. This intentionally
              # happens before fitting or writing any model candidate.
              python scripts/download_production_preflight_inputs.py
              python scripts/audit_training_leakage.py \
                --history-dir .cache/tbt/history \
                --report .cache/tbt/production/leakage_audit_report.json
            fi
            python scripts/pipeline.py "${args[@]}"
          fi

      - name: Update model promotion readiness
        if: env.MODE == 'refresh' || env.MODE == 'train'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/model_promotion_readiness.py \
            --data-repository "$TBT_DATA_REPOSITORY" \
            --minimum-gate-rows 200 \
            --target-rows 1000 \
            --minimum-days 3 \
            --out .cache/tbt/model-readiness/readiness.json
          path="audit/model-promotion-readiness-latest.json"
          existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 .cache/tbt/model-readiness/readiness.json)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" \
              -f message="Update BlinQ model promotion readiness" \
              -f content="$encoded" -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" \
              -f message="Update BlinQ model promotion readiness" \
              -f content="$encoded" >/dev/null
          fi

      - name: Persist training decision audit
        if: ${{ always() && env.MODE == 'train' }}
        continue-on-error: true
        env:
          TRAIN_RUN_ID: ${{ github.run_id }}
          TRAIN_RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def read_json(path, default=None):
              p = Path(path)
              if not p.is_file():
                  return default
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  return {"read_error": str(exc)}

          report = read_json(".cache/tbt/model/training_report.json", {})
          history = read_json(".cache/tbt/model/promotion_history.json", [])
          decision = (
              report.get("promotion_decision")
              if isinstance(report, dict)
              else None
          )
          if decision is None:
              decision = history[-1] if isinstance(history, list) and history else None
          audit = {
              "schema": 1,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "run_id": os.environ.get("TRAIN_RUN_ID"),
              "run_sha": os.environ.get("TRAIN_RUN_SHA"),
              "promotion_requested": os.environ.get("PROMOTE") == "true",
              "decision": decision,
              "training_report": report,
          }
          Path("/tmp/model-training-audit.json").write_text(
              json.dumps(audit, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
          path="audit/model-training-latest.json"
          existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/model-training-audit.json)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit BlinQ model training run $TRAIN_RUN_ID"               -f content="$encoded"               -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit BlinQ model training run $TRAIN_RUN_ID"               -f content="$encoded" >/dev/null
          fi

      - name: Upload training decision evidence
        if: ${{ always() && env.MODE == 'train' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-model-training-${{ github.run_id }}
          path: |
            .cache/tbt/model/training_report.json
            .cache/tbt/model/promotion_history.json
            .cache/tbt/production/leakage_audit_report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save morning refresh budget evidence
        if: env.MODE == 'refresh' && env.MORNING_REFRESH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinq-morning-refresh-report-${{ github.run_id }}
          path: .cache/tbt/predictions/refresh_report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload mega-data report
        if: ${{ always() && env.MODE == 'mega-data' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-mega-data-${{ github.run_id }}
          path: |
            .cache/tbt/mega-data/mega_data_report.json
            .cache/tbt/mega-data/mega_data_report.md
            .cache/tbt/mega-data/statistics_inventory_before.json
            .cache/tbt/mega-data/statistics_inventory_after.json
            .cache/tbt/mega-data/history_download_report.json
            .cache/tbt/mega-data/statistics_primary_report.json
            .cache/tbt/mega-data/statistics_tail_report.json
            .cache/tbt/mega-data/refresh_report.json
            .cache/tbt/mega-data/history_audit_after.json
            .cache/tbt/mega-data/sg_run_summary.json
            .cache/tbt/sg-history/sg_projection_dry_run.json
            .cache/tbt/mega-data/ace_run_summary.json
            .cache/tbt/mega-data/feature_v3_coverage.json
            .cache/tbt/provider-probe/provider_probe_report.json
            .cache/tbt/provider-probe/provider_probe_report.md
            .cache/tbt/launch/launch_gate.json
            .cache/tbt/launch/launch_gate.md
            .cache/tbt/production/readiness_report.json
            .cache/tbt/production/readiness_report.md
          if-no-files-found: warn

      - name: Upload TOP evidence and calibration audit
        if: ${{ always() && env.MODE == 'top-audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-top-audit-${{ github.run_id }}
          path: .cache/tbt/top-accuracy/audit.json
          if-no-files-found: error
      - name: Upload TOP VALUE doubles quality and overlap audit
        if: ${{ always() && env.MODE == 'market-audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-market-audit-${{ github.run_id }}
          path: |
            .cache/tbt/market-quality/audit.json
            .cache/tbt/market-quality/audit.md
          if-no-files-found: error

      - name: Upload Data Model v3 feature audit
        if: ${{ always() && env.MODE == 'feature-audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-feature-v3-${{ github.run_id }}
          path: .cache/tbt/feature-v3/coverage.json
          if-no-files-found: error

      - name: Upload doubles history report
        if: ${{ always() && env.MODE == 'doubles-data' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-doubles-data-${{ github.run_id }}
          path: |
            .cache/tbt/doubles/doubles_history_report.json
          if-no-files-found: error

      - name: Upload SG score enrichment report
        if: ${{ always() && (env.MODE == 'sg-scores' || env.MODE == 'sg-rebuild') }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-${{ env.MODE }}-${{ github.run_id }}
          path: |
            .cache/tbt/sg-history/sg_run_summary.json
            .cache/tbt/sg-history/sg_projection_dry_run.json
          if-no-files-found: warn

      - name: Upload ACE/DF enrichment report
        if: ${{ always() && env.MODE == 'ace-statistics' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-ace-statistics-${{ github.run_id }}
          path: .cache/tbt/ace-history/ace_run_summary.json
          if-no-files-found: warn

      - name: Upload provider capability probe
        if: ${{ always() && env.MODE == 'provider-probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-provider-probe-${{ github.run_id }}
          path: |
            .cache/tbt/provider-probe/provider_probe_report.json
            .cache/tbt/provider-probe/provider_probe_report.md
          if-no-files-found: error

      - name: Upload history manifest recovery report
        if: ${{ always() && env.MODE == 'history-manifest-repair' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-history-manifest-repair-${{ github.run_id }}
          path: .cache/tbt/history-manifest-repair/history_manifest_repair_report.json
          if-no-files-found: warn

      - name: Upload history repair diagnostics
        if: ${{ always() && env.MODE == 'history-repair' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-history-repair-${{ github.run_id }}
          path: .cache/tbt/history-repair-all/history_repair_report.json
          if-no-files-found: ignore

      - name: Upload history/statistics run report
        if: ${{ always() && (env.MODE == 'history' || env.MODE == 'statistics') }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-${{ env.MODE }}-${{ github.run_id }}
          path: |
            .cache/tbt/history/download_report.json
            .cache/tbt/history/download_progress.json
          if-no-files-found: warn

      - name: Upload production prediction audit
        if: ${{ always() && env.MODE == 'production-audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-production-audit-${{ github.run_id }}
          path: |
            .cache/tbt/production-audit/production_prediction_audit.json
            .cache/tbt/production-audit/production_prediction_audit.md
          if-no-files-found: error

      - name: Upload results rebuild report
        if: ${{ always() && env.MODE == 'results-rebuild' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-results-rebuild-${{ github.run_id }}
          path: .cache/tbt/results-rebuild/results_rebuild_report.json
          if-no-files-found: error

      - name: Upload production preflight artifacts
        if: env.MODE == 'production-preflight'
        uses: actions/upload-artifact@v4
        with:
          name: blinq-production-preflight
          path: |
            .cache/tbt/production/player_master.json
            .cache/tbt/production/player_master.csv
            .cache/tbt/production/player_master_report.json
            .cache/tbt/production/tournament_master.json
            .cache/tbt/production/tournament_master.csv
            .cache/tbt/production/venue_master.json
            .cache/tbt/production/venue_master.csv
            .cache/tbt/production/tournament_venue_report.json
            .cache/tbt/production/training_table.parquet
            .cache/tbt/production/training_table_report.json
            .cache/tbt/production/leakage_audit_report.json
            .cache/tbt/production/statistics_inventory_report.json
            .cache/tbt/production/readiness_report.json
            .cache/tbt/production/readiness_report.md
          if-no-files-found: error

      - name: Plan remaining presentation-enrichment budget
        if: env.MODE == 'refresh' && env.MORNING_REFRESH != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/plan_player_enrichment_budget.py \
            --total-cap "$MAX_REQUESTS" \
            --refresh-report .cache/tbt/predictions/refresh_report.json \
            --photo 250 \
            --fallback-ranking 120 \
            --player-detail 250 \
            --tournament-logo 120 \
            --github-env "$GITHUB_ENV"

      - name: Refresh presentation metadata for current feed
        if: env.MODE == 'refresh' && env.MORNING_REFRESH != 'true' && env.BLINQ_ENRICH_PLANNED_MAX != '0'
        shell: bash
        run: |
          set -euo pipefail
          # The prediction candidate is already immutable in tbt-predictions-v1.
          # Refresh presentation-only metadata/assets before assembling the
          # serving feed so rank/country/photos/logos/profile details are always
          # available without requiring live RapidAPI access from Azure.
          python scripts/enrich_player_cards.py \
            --data-repository "$TBT_DATA_REPOSITORY" \
            --max-players 0 \
            --max-photo-requests "$BLINQ_ENRICH_PHOTO_CAP" \
            --max-fallback-ranking-requests "$BLINQ_ENRICH_FALLBACK_RANK_CAP" \
            --max-player-detail-requests "$BLINQ_ENRICH_DETAIL_CAP" \
            --max-tournament-logo-requests "$BLINQ_ENRICH_LOGO_CAP"

      - name: Prepare refreshed serving feed and cached player assets
        if: env.MODE == 'refresh' || env.MODE == 'current-refresh' || env.MODE == 'results-rebuild' || env.MODE == 'deploy-current'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_feed.py
          test -s api/data/feed.json
          python scripts/verify_presentation_feed.py api/data/feed.json --summary

  deploy:
    name: Deploy current prediction generation
    needs: pipeline
    if: >-
      needs.pipeline.result == 'success' &&
      ((github.event_name == 'push' && (contains(github.event.head_commit.message, '[refresh-now]') || contains(github.event.head_commit.message, '[deploy-current]'))) ||
       inputs.mode == 'refresh' || inputs.mode == 'results-rebuild' || inputs.mode == 'deploy-current')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only the short public publication window shares the production lock.
    # The long history/model work above never holds tbt-production-deploy.
    concurrency:
      group: tbt-production-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard against stale application deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          current="$(git rev-parse HEAD)"
          latest="$(git rev-parse origin/main)"
          if [[ "$current" != "$latest" ]]; then
            echo "::notice::Skipping deployment: this data workflow started on $current but main is now $latest. The next application deploy will consume the latest private prediction generation."
            echo "BLINQ_SKIP_STALE_DEPLOY=true" >> "$GITHUB_ENV"
          else
            echo "BLINQ_SKIP_STALE_DEPLOY=false" >> "$GITHUB_ENV"
          fi

      - name: Prepare immutable serving snapshot
        if: env.BLINQ_SKIP_STALE_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          python scripts/prepare_feed.py
          test -s api/data/feed.json
          python scripts/verify_presentation_feed.py api/data/feed.json --summary

      - name: Sanitize generated artifacts before deploy
        if: env.BLINQ_SKIP_STALE_DEPLOY != 'true'
        run: python scripts/clean_generated_artifacts.py

      - name: Recheck latest main and stamp deployed frontend
        if: env.BLINQ_SKIP_STALE_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          current="$(git rev-parse HEAD)"
          latest="$(git rev-parse origin/main)"
          if [[ "$current" != "$latest" || "$GITHUB_SHA" != "$latest" ]]; then
            echo "::warning::Skipping old data-redeploy $current: main is now $latest."
            echo "BLINQ_SKIP_STALE_DEPLOY=true" >> "$GITHUB_ENV"
          else
            python scripts/stamp_web_deployment.py --web web --sha "$GITHUB_SHA"
          fi

      - name: Deploy refreshed feed and application
        if: env.BLINQ_SKIP_STALE_DEPLOY != 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          action: upload
          app_location: web
          api_location: api
          output_location: ''
          skip_app_build: true

      - name: Verify exact web revision after prediction redeploy
        if: env.BLINQ_SKIP_STALE_DEPLOY != 'true' && vars.TBT_PRODUCTION_URL != ''
        env:
          TBT_PRODUCTION_URL: ${{ vars.TBT_PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          base="${TBT_PRODUCTION_URL%/}"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL -H 'Cache-Control: no-cache' "$base/deployment.json?__blinq_sha=$GITHUB_SHA" -o /tmp/blinq-data-deployment.json; then
              if python -c 'import json,os; assert json.load(open("/tmp/blinq-data-deployment.json"))["git_sha"] == os.environ["GITHUB_SHA"]'; then
                exit 0
              fi
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Deployed frontend revision differs from the verified data workflow"
          exit 1

      - name: Confirm exactly deployed prediction publication
        if: env.BLINQ_SKIP_STALE_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/confirm_prediction_publication.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --deployed-feed api/data/feed.json; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Prediction publication confirmation failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Capture market immediately after publication
        if: env.BLINQ_SKIP_STALE_DEPLOY != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run propline-clv-pilot.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f events_per_run=12
          gh workflow run the-odds-clv.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f reason=publication

  morning_presentation:
    name: Optional photos and profiles after morning publish
    needs: [pipeline, deploy]
    if: >-
      needs.pipeline.result == 'success' &&
      needs.deploy.result == 'success' &&
      inputs.mode == 'refresh' && inputs.morning_refresh == true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: tbt-player-assets-writer
      cancel-in-progress: false
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      BLINQ_SHARED_API_BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
      BLINQ_SHARED_API_BUDGET_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      BLINQ_SHARED_API_BUDGET_PURPOSE: ${{ inputs.mode == 'refresh' && 'refresh' || 'history' }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      MAX_REQUESTS: ${{ inputs.max_requests || 1000 }}
    steps:
      - name: Checkout latest presentation assets
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: python -m pip install -r api/requirements-train.txt

      - name: Load the actual morning request count
        uses: actions/download-artifact@v4
        with:
          name: blinq-morning-refresh-report-${{ github.run_id }}
          path: .cache/tbt/predictions

      - name: Plan only unused morning request allowance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/plan_player_enrichment_budget.py \
            --total-cap "$MAX_REQUESTS" \
            --refresh-report .cache/tbt/predictions/refresh_report.json \
            --photo 250 \
            --fallback-ranking 120 \
            --player-detail 250 \
            --tournament-logo 120 \
            --github-env "$GITHUB_ENV"

      - name: Enrich presentation after predictions were deployed
        id: enrich
        if: env.BLINQ_ENRICH_PLANNED_MAX != '0'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          test -n "$RAPIDAPI_KEY" || { echo 'Missing RAPIDAPI_KEY'; exit 1; }
          python scripts/enrich_player_cards.py \
            --data-repository "$TBT_DATA_REPOSITORY" \
            --max-players 0 \
            --max-photo-requests "$BLINQ_ENRICH_PHOTO_CAP" \
            --max-fallback-ranking-requests "$BLINQ_ENRICH_FALLBACK_RANK_CAP" \
            --max-player-detail-requests "$BLINQ_ENRICH_DETAIL_CAP" \
            --max-tournament-logo-requests "$BLINQ_ENRICH_LOGO_CAP"

      - name: Deploy added artwork with no new paid data refresh
        if: steps.enrich.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # This mode only prepares and redeploys the current private feed.
          gh workflow run data.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f mode=deploy-current -f max_requests=1
          echo "Queued no-provider deploy-current for refreshed player assets."
