name: Tennis data and predictions
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [mega-data, sg-rebuild, feature-audit, history, statistics, ace-statistics, sg-scores, provider-probe, environment-static, history-audit, history-manifest-repair, history-integrity-repair, history-repair, history-self-match-repair, production-preflight, train, backtest, refresh]
        default: history
        required: true
      start:
        description: Oldest date (newest days downloaded first)
        type: string
        default: ''
      lookback_days:
        description: Rolling history window; ignored if start is supplied
        type: number
        default: 1095
      end:
        description: Newest date; blank means yesterday UTC
        type: string
        default: ''
      max_requests:
        description: Global/manual Tennis RapidAPI request cap, including retries. mega-data never exceeds this cap.
        type: number
        default: 100
      market_odds_max_events:
        description: Current betting-day events to enrich with provider-1 odds during refresh
        type: number
        default: 120
      betting_day_start_hour:
        description: Europe/Bratislava hour that starts the BlinQ betting day
        type: number
        default: 6
      ace_target_samples:
        description: Target recent Aces/DF stat samples per current upcoming player
        type: number
        default: 18
      ace_lookback_days:
        description: Maximum history window for targeted Aces/DF statistics
        type: number
        default: 550
      sg_target_samples:
        description: Target recent structured score samples per current upcoming player
        type: number
        default: 24
      sg_lookback_days:
        description: Maximum history window for targeted Sets/Games score samples
        type: number
        default: 730
      promote:
        description: Publish trained model only if holdout gate passes
        type: boolean
        default: false
  schedule:
    - cron: '20 1,7,13,19 * * *'
    - cron: '40 22 * * *'
permissions:
  contents: read
concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false
jobs:
  pipeline:
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '40 22 * * *' && vars.TBT_AUTO_HISTORY == 'true') || (github.event.schedule == '20 1,7,13,19 * * *' && vars.TBT_AUTO_REFRESH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      MODE: ${{ inputs.mode || (github.event.schedule == '40 22 * * *' && 'history' || 'refresh') }}
      START_DATE: ${{ inputs.start }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || 1095 }}
      END_DATE: ${{ inputs.end }}
      MAX_REQUESTS: ${{ inputs.max_requests || (github.event.schedule == '40 22 * * *' && 4000 || 750) }}
      MARKET_ODDS_MAX_EVENTS: ${{ inputs.market_odds_max_events || 120 }}
      BETTING_DAY_START_HOUR: ${{ inputs.betting_day_start_hour || 6 }}
      ACE_TARGET_SAMPLES: ${{ inputs.ace_target_samples || 18 }}
      ACE_LOOKBACK_DAYS: ${{ inputs.ace_lookback_days || 550 }}
      SG_TARGET_SAMPLES: ${{ inputs.sg_target_samples || 24 }}
      SG_LOOKBACK_DAYS: ${{ inputs.sg_lookback_days || 730 }}
      PROMOTE: ${{ inputs.promote }}
      TBT_WEATHER_RESEARCH: ${{ vars.TBT_WEATHER_RESEARCH }}
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: python -m pip install -r api/requirements-train.txt
      - name: Execute selected operation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" != provider-probe ]]; then
            test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          fi
          # Writer runs start from a physically clean canonical release. The repair
          # is a no-op when history is already clean and rewrites only affected years.
          if [[ "$MODE" == history || "$MODE" == statistics ]]; then
            python scripts/repair_history_data.py --data-repository "$TBT_DATA_REPOSITORY"
          fi
          if [[ "$MODE" == mega-data ]]; then
            args=(
              --data-repository "$TBT_DATA_REPOSITORY"
              --max-requests "$MAX_REQUESTS"
              --lookback-days "$LOOKBACK_DAYS"
              --ace-target-samples "$ACE_TARGET_SAMPLES"
              --ace-lookback-days "$ACE_LOOKBACK_DAYS"
              --sg-target-samples "$SG_TARGET_SAMPLES"
              --sg-lookback-days "$SG_LOOKBACK_DAYS"
            )
            if [[ -n "$START_DATE" ]]; then args+=(--start "$START_DATE"); fi
            if [[ -n "$END_DATE" ]]; then args+=(--end "$END_DATE"); fi
            python scripts/run_mega_data.py "${args[@]}"
          elif [[ "$MODE" == history || "$MODE" == statistics ]]; then
            args=(--publish --data-repository "$TBT_DATA_REPOSITORY" --mode "$MODE" --lookback-days "$LOOKBACK_DAYS" --max-requests "$MAX_REQUESTS")
            if [[ -n "$START_DATE" ]]; then args+=(--start "$START_DATE"); fi
            if [[ -n "$END_DATE" ]]; then args+=(--end "$END_DATE"); fi
            python scripts/download_tennis_history.py "${args[@]}"
          elif [[ "$MODE" == ace-statistics ]]; then
            python scripts/enrich_ace_history.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --lookback-days "$ACE_LOOKBACK_DAYS" \
              --target-samples "$ACE_TARGET_SAMPLES" \
              --max-requests "$MAX_REQUESTS"
          elif [[ "$MODE" == sg-scores ]]; then
            python scripts/enrich_sg_history.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --lookback-days "$SG_LOOKBACK_DAYS" \
              --target-samples "$SG_TARGET_SAMPLES" \
              --max-requests "$MAX_REQUESTS"
          elif [[ "$MODE" == sg-rebuild ]]; then
            # Explicit one-off verification sweep. This mode deliberately
            # bypasses the local event-detail cache so the operator can spend a
            # fresh quota window re-validating identity, score and BO3/BO5 facts.
            python scripts/enrich_sg_history.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --lookback-days "$SG_LOOKBACK_DAYS" \
              --target-samples "$SG_TARGET_SAMPLES" \
              --max-requests "$MAX_REQUESTS" \
              --rebuild-existing \
              --force-provider-refresh
          elif [[ "$MODE" == feature-audit ]]; then
            python scripts/download_production_preflight_inputs.py
            python scripts/audit_feature_v3_coverage.py \
              --history-dir .cache/tbt/history \
              --out .cache/tbt/feature-v3/coverage.json
          elif [[ "$MODE" == provider-probe ]]; then
            python scripts/probe_tennis_provider.py \
              --max-requests "$MAX_REQUESTS" \
              --days-back 3 --days-ahead 2 \
              --odds-samples 12 --stats-samples 8
          elif [[ "$MODE" == environment-static ]]; then
            end_date="$END_DATE"
            if [[ -z "$end_date" ]]; then end_date="$(date -u +%F)"; fi
            start_date="$START_DATE"
            if [[ -z "$start_date" ]]; then start_date="$(date -u -d "$end_date - $LOOKBACK_DAYS days" +%F)"; fi
            python scripts/enrich_environment_snapshot.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --start "$start_date" --end "$end_date" \
              --static-only --complete-static \
              --max-requests "$MAX_REQUESTS"
          elif [[ "$MODE" == history-audit ]]; then
            python scripts/audit_history_data.py --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == history-manifest-repair ]]; then
            python scripts/repair_missing_history_manifest.py --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == history-integrity-repair ]]; then
            python scripts/repair_history_bundle_integrity.py --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == history-repair ]]; then
            python scripts/repair_history_data.py --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == history-self-match-repair ]]; then
            python scripts/repair_history_self_match.py --data-repository "$TBT_DATA_REPOSITORY"
          elif [[ "$MODE" == production-preflight ]]; then
            python scripts/download_production_preflight_inputs.py
            profiles=()
            if [[ -s .cache/tbt/player-assets/player_profiles.json ]]; then
              profiles=(--profiles .cache/tbt/player-assets/player_profiles.json)
            fi
            python scripts/build_player_master.py \
              --history-dir .cache/tbt/history \
              "${profiles[@]}" \
              --out .cache/tbt/production/player_master.json \
              --csv .cache/tbt/production/player_master.csv \
              --report .cache/tbt/production/player_master_report.json
            python scripts/build_tournament_venue_master.py \
              --history-dir .cache/tbt/history \
              --tournaments-out .cache/tbt/production/tournament_master.json \
              --tournaments-csv .cache/tbt/production/tournament_master.csv \
              --venues-out .cache/tbt/production/venue_master.json \
              --venues-csv .cache/tbt/production/venue_master.csv \
              --report .cache/tbt/production/tournament_venue_report.json
            python scripts/build_production_training_table.py \
              --history-dir .cache/tbt/history \
              --out .cache/tbt/production/training_table.parquet \
              --report .cache/tbt/production/training_table_report.json
            python scripts/audit_training_leakage.py \
              --history-dir .cache/tbt/history \
              --report .cache/tbt/production/leakage_audit_report.json
            python scripts/audit_statistics_inventory.py \
              --history-dir .cache/tbt/history \
              --out .cache/tbt/production/statistics_inventory_report.json
            python scripts/build_production_readiness_report.py \
              --player-report .cache/tbt/production/player_master_report.json \
              --tournament-report .cache/tbt/production/tournament_venue_report.json \
              --training-report .cache/tbt/production/training_table_report.json \
              --leakage-report .cache/tbt/production/leakage_audit_report.json \
              --statistics-report .cache/tbt/production/statistics_inventory_report.json \
              --out .cache/tbt/production/readiness_report.json \
              --markdown .cache/tbt/production/readiness_report.md
          else
            args=(
              "$MODE"
              --max-requests "$MAX_REQUESTS"
              --market-odds-max-events "$MARKET_ODDS_MAX_EVENTS"
              --betting-day-start-hour "$BETTING_DAY_START_HOUR"
            )
            if [[ "$PROMOTE" == true ]]; then args+=(--promote); fi
            python scripts/pipeline.py "${args[@]}"
          fi

      - name: Upload mega-data report
        if: ${{ always() && env.MODE == 'mega-data' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-mega-data-${{ github.run_id }}
          path: |
            .cache/tbt/mega-data/mega_data_report.json
            .cache/tbt/mega-data/mega_data_report.md
            .cache/tbt/mega-data/statistics_inventory_before.json
            .cache/tbt/mega-data/statistics_inventory_after.json
            .cache/tbt/mega-data/history_download_report.json
            .cache/tbt/mega-data/statistics_primary_report.json
            .cache/tbt/mega-data/statistics_tail_report.json
            .cache/tbt/mega-data/refresh_report.json
            .cache/tbt/mega-data/history_audit_after.json
            .cache/tbt/mega-data/sg_run_summary.json
            .cache/tbt/sg-history/sg_projection_dry_run.json
            .cache/tbt/mega-data/ace_run_summary.json
            .cache/tbt/mega-data/feature_v3_coverage.json
            .cache/tbt/provider-probe/provider_probe_report.json
            .cache/tbt/provider-probe/provider_probe_report.md
            .cache/tbt/launch/launch_gate.json
            .cache/tbt/launch/launch_gate.md
            .cache/tbt/production/readiness_report.json
            .cache/tbt/production/readiness_report.md
          if-no-files-found: warn

      - name: Upload Data Model v3 feature audit
        if: ${{ always() && env.MODE == 'feature-audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-feature-v3-${{ github.run_id }}
          path: .cache/tbt/feature-v3/coverage.json
          if-no-files-found: error

      - name: Upload SG score enrichment report
        if: ${{ always() && (env.MODE == 'sg-scores' || env.MODE == 'sg-rebuild') }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-${{ env.MODE }}-${{ github.run_id }}
          path: |
            .cache/tbt/sg-history/sg_run_summary.json
            .cache/tbt/sg-history/sg_projection_dry_run.json
          if-no-files-found: warn

      - name: Upload ACE/DF enrichment report
        if: ${{ always() && env.MODE == 'ace-statistics' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-ace-statistics-${{ github.run_id }}
          path: .cache/tbt/ace-history/ace_run_summary.json
          if-no-files-found: warn

      - name: Upload provider capability probe
        if: ${{ always() && env.MODE == 'provider-probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-provider-probe-${{ github.run_id }}
          path: |
            .cache/tbt/provider-probe/provider_probe_report.json
            .cache/tbt/provider-probe/provider_probe_report.md
          if-no-files-found: error

      - name: Upload history manifest recovery report
        if: ${{ always() && env.MODE == 'history-manifest-repair' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-history-manifest-repair-${{ github.run_id }}
          path: .cache/tbt/history-manifest-repair/history_manifest_repair_report.json
          if-no-files-found: warn

      - name: Upload history repair diagnostics
        if: ${{ always() && env.MODE == 'history-repair' }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-history-repair-${{ github.run_id }}
          path: .cache/tbt/history-repair-all/history_repair_report.json
          if-no-files-found: ignore

      - name: Upload history/statistics run report
        if: ${{ always() && (env.MODE == 'history' || env.MODE == 'statistics') }}
        uses: actions/upload-artifact@v4
        with:
          name: blinq-${{ env.MODE }}-${{ github.run_id }}
          path: |
            .cache/tbt/history/download_report.json
            .cache/tbt/history/download_progress.json
          if-no-files-found: warn

      - name: Upload production preflight artifacts
        if: env.MODE == 'production-preflight'
        uses: actions/upload-artifact@v4
        with:
          name: blinq-production-preflight
          path: |
            .cache/tbt/production/player_master.json
            .cache/tbt/production/player_master.csv
            .cache/tbt/production/player_master_report.json
            .cache/tbt/production/tournament_master.json
            .cache/tbt/production/tournament_master.csv
            .cache/tbt/production/venue_master.json
            .cache/tbt/production/venue_master.csv
            .cache/tbt/production/tournament_venue_report.json
            .cache/tbt/production/training_table.parquet
            .cache/tbt/production/training_table_report.json
            .cache/tbt/production/leakage_audit_report.json
            .cache/tbt/production/statistics_inventory_report.json
            .cache/tbt/production/readiness_report.json
            .cache/tbt/production/readiness_report.md
          if-no-files-found: error

      - name: Refresh presentation metadata for current feed
        if: env.MODE == 'refresh'
        shell: bash
        run: |
          set -euo pipefail
          # The prediction candidate is already immutable in tbt-predictions-v1.
          # Refresh presentation-only metadata/assets before assembling the
          # serving feed so rank/country/photos/logos/profile details are always
          # available without requiring live RapidAPI access from Azure.
          python scripts/enrich_player_cards.py \
            --data-repository "$TBT_DATA_REPOSITORY" \
            --max-players 0 \
            --max-photo-requests 250 \
            --max-fallback-ranking-requests 120 \
            --max-player-detail-requests 250 \
            --max-tournament-logo-requests 120

      - name: Prepare refreshed serving feed and cached player assets
        if: env.MODE == 'refresh'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_feed.py
          test -s api/data/feed.json
          python scripts/verify_presentation_feed.py api/data/feed.json --summary

      - name: Guard against stale application deployment
        if: env.MODE == 'refresh'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          current="$(git rev-parse HEAD)"
          latest="$(git rev-parse origin/main)"
          if [[ "$current" != "$latest" ]]; then
            echo "BLINQ_SKIP_STALE_DEPLOY=true" >> "$GITHUB_ENV"
            echo "::warning::Skipping Static Web Apps deployment: this data run started on $current but main is now $latest. This prevents an older workflow from rolling back the frontend."
          else
            echo "BLINQ_SKIP_STALE_DEPLOY=false" >> "$GITHUB_ENV"
          fi

      - name: Deploy refreshed feed and application
        if: env.MODE == 'refresh' && env.BLINQ_SKIP_STALE_DEPLOY != 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          action: upload
          app_location: web
          api_location: api
          output_location: ''
          skip_app_build: true
      - name: Confirm deployed prediction publication
        if: env.MODE == 'refresh' && env.BLINQ_SKIP_STALE_DEPLOY != 'true'
        run: >-
          python scripts/confirm_prediction_publication.py
          --data-repository "$TBT_DATA_REPOSITORY"
          --deployed-feed api/data/feed.json
