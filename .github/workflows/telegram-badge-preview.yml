name: BlinQ Telegram badges one-time photo preview
on:
  push:
    branches: [main]
    paths: ['.github/telegram-badge-preview-tick.json']

permissions:
  contents: read

concurrency:
  group: blinq-telegram-ledger
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: telegram-bot-state
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: .private-telegram
          sparse-checkout: ops
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Reserve one-time badge preview without touching issued picks
        id: reserve
        shell: bash
        run: |
          set -euo pipefail
          test -s .private-telegram/ops/telegram-bot-state.json
          python - <<'PY'
          from pathlib import Path
          import json, os
          p=Path(".private-telegram/ops/telegram-bot-state.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          tests=d.setdefault("badge_tests",{})
          key="2026-10-31:top-value-aces-preview-v1"
          if key in tests:
              print("Preview was already reserved or sent; no duplicate")
              with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("ready=false\n")
          else:
              tests[key]={"status":"reserved","kind":"photo_preview_not_custom_emoji"}
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("ready=true\n")
          PY
          if [[ "$(grep -c 'ready=true' "$GITHUB_OUTPUT")" == "0" ]]; then exit 0; fi
          git -C .private-telegram config user.name "github-actions[bot]"
          git -C .private-telegram config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Reserve one-time Telegram badge artwork test [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual"
      - name: Draw badge photo and send exactly one visual test
        if: steps.reserve.outputs.ready == 'true'
        shell: bash
        env:
          TGB: ${{ secrets.TGB }}
          TGCH: ${{ secrets.TGCH }}
        run: |
          set -euo pipefail
          test -n "$TGB" && test -n "$TGCH"
          python -m pip install --quiet Pillow
          python scripts/telegram_badge_smoke_preview.py /tmp/blinq-telegram-badges.png
          file /tmp/blinq-telegram-badges.png
          caption="🧪 TEST BlinQ: TOP • VALUE • ACES štítky. Toto je iba vizuálny náhľad; inline custom emoji v textových riadkoch ešte nie sú aktivované. Denná ponuka sa nemení."
          curl --fail-with-body --silent --show-error \
            -F "chat_id=$TGCH" -F "photo=@/tmp/blinq-telegram-badges.png" \
            -F "caption=$caption" -F "disable_notification=true" \
            "https://api.telegram.org/bot$TGB/sendPhoto" -o /tmp/blinq-badge-receipt.json
          jq -e '.ok == true and (.result.message_id | type=="number" and . > 0)' /tmp/blinq-badge-receipt.json >/dev/null
          jq '{ok,message_id:.result.message_id}' /tmp/blinq-badge-receipt.json
      - name: Confirm actual Telegram photo receipt and read back private state
        if: steps.reserve.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          dpath=Path(".private-telegram/ops/telegram-bot-state.json")
          d=json.loads(dpath.read_text(encoding="utf-8"))
          response=json.loads(Path("/tmp/blinq-badge-receipt.json").read_text(encoding="utf-8"))
          if response.get("ok") is not True or not isinstance((response.get("result") or {}).get("message_id"),int):
              raise SystemExit("Telegram photo not confirmed")
          key="2026-10-31:top-value-aces-preview-v1"
          entry=d["badge_tests"][key]
          if entry.get("status")!="reserved":raise SystemExit("Badge reservation changed")
          entry.update(status="sent",message_id=response["result"]["message_id"])
          dpath.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Telegram badge preview message_id",entry["message_id"])
          PY
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Confirm Telegram badge photo preview receipt [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual"
