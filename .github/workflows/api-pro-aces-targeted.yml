name: API Pro targeted ACES quote verification
on:
  push:
    branches: [audit/api-pro-aces-targeted-20261101]
    paths:
      - .github/workflows/api-pro-aces-targeted.yml
      - scripts/probe_api_pro_aces_targeted.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: api-pro-aces-targeted-20261101
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      BLINQ_SHARED_API_BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
      BLINQ_SHARED_API_BUDGET_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      BLINQ_SHARED_API_BUDGET_PURPOSE: refresh
      BLINQ_PROVIDER_REQUEST_RESERVE: '500'
      BLINQ_REQUIRE_PROVIDER_RATE_LIMIT_HEADER: 'true'
      BLINQ_RAPIDAPI_MAX_RPS: '2'
      PYTHONPATH: api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/api-pro-aces-targeted-20261101
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API client requirements
        run: python -m pip install -r api/requirements.txt
      - name: Read current confirmed snapshot from private release
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          gh release download tbt-predictions-v1 --repo BackstageTalks/tbt-data --pattern daily_offer_snapshot.json --pattern _tbt_bundle_manifest.json --clobber
          python - <<'PY'
          import hashlib,json,pathlib
          data=pathlib.Path('daily_offer_snapshot.json').read_bytes()
          meta=json.loads(pathlib.Path('_tbt_bundle_manifest.json').read_text())['files']['daily_offer_snapshot.json']
          assert len(data)==meta['bytes']
          assert hashlib.sha256(data).hexdigest()==meta['sha256']
          assert json.loads(data)['confirmed_only'] is True
          print('Confirmed immutable snapshot digest matched.')
          PY
      - name: Read-only API Pro ACES quote check (maximum 5 charged calls)
        continue-on-error: true
        run: python scripts/probe_api_pro_aces_targeted.py
      - name: Persist sanitized diagnostic in audit branch
        if: always()
        run: |
          if test -s api_pro_aces_targeted_report.json; then
            cp api_pro_aces_targeted_report.json api_pro_aces_latest.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add api_pro_aces_latest.json
            git diff --cached --quiet || (git commit -m 'audit: save read-only API Pro ACES quote evidence' && git push origin HEAD:audit/api-pro-aces-targeted-20261101)
          fi
      - name: Keep provider audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-pro-aces-targeted
          path: api_pro_aces_targeted_report.json
          if-no-files-found: warn
          retention-days: 5
