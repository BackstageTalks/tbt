name: BlinQ PropLine evening odds archive (Drive + private recovery)

# External 23:00 Europe/Bratislava scheduler; old event type is a temporary alias.
# No second schedule is created. New scheduler may migrate to blinq-propline-odds-tick.
# No native GitHub cron and no dependency on the paid TennisAPI budget.
on:
  repository_dispatch:
    types: [blinq-fortuna-evening-odds-tick, blinq-propline-odds-tick]
  workflow_dispatch:
    inputs:
      target_day:
        description: "Bratislava betting day YYYY-MM-DD (blank = tomorrow)"
        required: false
        type: string
        default: ''
      max_events:
        description: "Maximum events parsed from one free PropLine API response (0=all)"
        required: false
        type: number
        default: 0
      allow_same_day:
        description: "Research only: capture still-upcoming matches on target betting day after 06:00"
        required: false
        type: boolean
        default: false
      candidate_cdb:
        description: "Explicit candidate-only CDB capture: one bulk request, zero match requests, verified CDB sidecar"
        required: false
        type: boolean
        default: false
      source_capture_run:
        description: "Candidate CDB retry: reuse this run's stored report, ZERO provider requests"
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: propline-nightly-closeout
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PROPL: ${{ secrets.PROPL }}
      DATA_REPO: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      MAX_EVENTS: ${{ inputs.max_events || 0 }}
      INPUT_TARGET_DAY: ${{ github.event.client_payload.target_day || inputs.target_day || '' }}
      INPUT_ALLOW_SAME_DAY: ${{ github.event.client_payload.allow_same_day || inputs.allow_same_day || false }}
      CANDIDATE_CDB: ${{ inputs.candidate_cdb || false }}
      PYTHONPATH: api:scripts
      SOURCE_CAPTURE_RUN: ${{ inputs.source_capture_run || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source/parser regressions (no provider requests)
        run: |
          python -m unittest discover -s tests -p 'test_propline_evening_*.py' -v
          python -m unittest discover -s tests -p 'test_propline_drive_archive.py' -v
      - name: Resolve next Bratislava betting day
        id: day
        shell: bash
        run: |
          set -euo pipefail
          target="$INPUT_TARGET_DAY"
          if [[ -z "$target" ]]; then
            # The 23:00 external dispatch may queue past local midnight.
            # Before 06:00 local, today is still the upcoming betting day.
            target="$(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Bratislava"))
          day = now.date() if now.hour < 6 else (now + timedelta(days=1)).date()
          print(day.isoformat())
          PY
          )"
          fi
          python - "$target" <<'PY'
          import datetime,sys
          datetime.date.fromisoformat(sys.argv[1])
          PY
          echo "date=$target" >> "$GITHUB_OUTPUT"
      - name: Restore an already captured report without calling PropLine again
        if: inputs.source_capture_run != ''
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_CDB" == "true" && "$SOURCE_CAPTURE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$SOURCE_CAPTURE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "blinq-propline-evening-research-$SOURCE_CAPTURE_RUN" --dir reports
          test -f reports/propline-evening/odds.json
      - name: Capture existing free PropLine bookmaker markets without CDB changes
        if: inputs.source_capture_run == ''
        env:
          BETTING_DAY: ${{ steps.day.outputs.date }}
        run: |
          set -euo pipefail
          args=(--target-day "$BETTING_DAY" --max-events "$MAX_EVENTS"
                --out reports/propline-evening/odds.json)
          if [[ "${INPUT_ALLOW_SAME_DAY,,}" == "true" ]]; then
            args+=(--allow-same-day)
          fi
          if [[ "$CANDIDATE_CDB" == "true" ]]; then
            args+=(--bulk-only)
          fi
          python scripts/propline_evening_odds.py "${args[@]}"
      - name: Persist authorized candidate offers under global CDB writer lock and verify read-back
        if: inputs.candidate_cdb
        run: |
          python scripts/stage_aces_offer_cdb.py --day '${{ steps.day.outputs.date }}' \
            --report reports/propline-evening/odds.json --out reports/aces-cdb --apply
      - name: Release candidate CDB lock after interrupted staging
        if: always() && inputs.candidate_cdb
        run: python scripts/cdb_global_writer_lock.py release --if-held
      - name: Validate audit and create-only store in separate private research path
        env:
          BETTING_DAY: ${{ steps.day.outputs.date }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          data = pathlib.Path("reports/propline-evening/odds.json").read_bytes()
          report = json.loads(data)
          assert report["schema"] == 1
          assert report["target_betting_day"] == os.environ["BETTING_DAY"]
          assert report["cdb_writes"] == 0 and report["published_picks_changed"] == 0
          assert report["provider_paid_calls"] == 0
          assert report["source"] == "propline_free"
          assert report["provider_requests"] == 1 + report["provider_event_requests"]
          assert 0 <= report["provider_event_requests"] <= len(report["events_in_target_window"])
          assert isinstance(report["provider_remaining"], int) and report["provider_remaining"] >= 150
          assert report["probed_events"] == report["probed_urls"] and report["probed_events"] <= report["candidate_events"]
          assert report["milestone_quotes"] == sum(
              len(m.get("verified_single_prices") or [])
              for e in report["events_in_target_window"] for m in e["aces_markets"])
          assert report["dfs_pairs"] == sum(
              len(m.get("research_pairs") or [])
              for e in report["events_in_target_window"] for m in e["aces_markets"])
          assert report["status"] in ("audited", "no_exact_aces_market_available")
          assert report["exact_aces_pairs"] == sum(
              len(m["verified_pairs"]) for e in report["events_in_target_window"]
              for m in e["aces_markets"])
          # Independently verify the complete priced pre-start research ledger.
          # It may contain quotes for other betting days, but the morning
          # publisher still reads only events_in_target_window.
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          observed = report["observed_prematch_priced_events"]
          assert isinstance(observed, list) and len(observed) <= report["probed_urls"] <= report["candidate_events"]
          total = outside = total_singles = outside_singles = 0
          for event in observed:
              captured = datetime.fromisoformat(event["captured_at"])
              scheduled = datetime.fromisoformat(event["scheduled_at"])
              assert captured.tzinfo and scheduled.tzinfo and captured < scheduled
              assert event["provider"] == "propline"
              assert str(event["event_id"]).isdigit()
              bulk_url = "https://api.prop-line.com/v1/sports/tennis/odds?markets=player_aces%2Ctotal_aces"
              detail_url = ("https://api.prop-line.com/v1/sports/tennis/events/"
                            + str(event["event_id"]) + "/odds?markets=player_aces%2Ctotal_aces")
              assert event["source_url"] in {bulk_url, detail_url}
              assert len(event["source_sha256"]) == 64
              raw_event = event.get("provider_raw_event")
              assert isinstance(raw_event, dict)
              assert str(raw_event.get("id")) == str(event["event_id"])
              digest = hashlib.sha256(json.dumps(
                  raw_event, ensure_ascii=False, sort_keys=True,
                  separators=(",", ":")).encode("utf-8")).hexdigest()
              assert digest == event["source_sha256"]
              local = scheduled.astimezone(ZoneInfo("Europe/Bratislava"))
              betting = (local - timedelta(days=1) if local.hour < 6 else local).date()
              assert event["event_betting_day"] == betting.isoformat()
              prices = sum(len(m["verified_pairs"]) for m in event["aces_markets"])
              assert all(m["kind"] in ("player_aces_ou", "most_aces_match",
                     "player_aces_milestone", "dfs_pickem_player_aces_ou")
                         for m in event["aces_markets"])
              singles = sum(len(m.get("verified_single_prices") or [])
                            for m in event["aces_markets"])
              assert prices + singles > 0
              for market in event["aces_markets"]:
                  assert market["bookmaker"]
                  assert all(q["bookmaker"] == market["bookmaker"]
                             and q["equivalent_over_line"] == q["threshold"] - .5
                             and 1.01 <= q["odds"] <= 100
                             for q in market.get("verified_single_prices") or [])
                  assert (market["kind"] == "player_aces_milestone" or
                          not market.get("verified_single_prices"))
                  if market["kind"] == "dfs_pickem_player_aces_ou":
                      assert not market["verified_pairs"]
              total += prices
              total_singles += singles
              if event["event_betting_day"] != report["target_betting_day"]:
                  outside += prices
                  outside_singles += singles
          assert report["observed_prematch_priced_pairs"] == total
          assert report["observed_priced_pairs_outside_target"] == outside
          assert report["observed_prematch_priced_singles"] == total_singles
          assert report["observed_priced_singles_outside_target"] == outside_singles
          repo = os.environ["DATA_REPO"]
          if repo != "BackstageTalks/tbt-data":
              raise SystemExit("Unexpected target repo; refuse research write")
          run_id = os.environ["GITHUB_RUN_ID"]
          path = f"research/propline-evening-odds/{report['target_betting_day']}/propline-{run_id}.json"
          api = f"repos/{repo}/contents/{path}"
          payload = {"message": f"research: immutable SKCZ evening quotes {run_id} [skip ci]",
                     "content": base64.b64encode(data).decode("ascii")}
          body = pathlib.Path("/tmp/propline-evening-odds-write.json")
          body.write_text(json.dumps(payload), encoding="utf-8")
          subprocess.run(["gh", "api", "-X", "PUT", api, "--input", str(body)],
                         check=True, capture_output=True)
          saved = json.loads(subprocess.check_output(["gh", "api", api], text=True))
          actual = base64.b64decode(saved["content"])
          assert hashlib.sha256(actual).digest() == hashlib.sha256(data).digest(), (
              "Independent persisted research read-back mismatch")
          print(json.dumps({"status": "PERSISTED_VERIFIED_READBACK",
                            "private_path": path,
                            "source": report["source"],
                            "milestone_quotes": report["milestone_quotes"],
                            "dfs_pairs": report["dfs_pairs"],
                            "provider_remaining": report["provider_remaining"],
                            "provider_requests": report["provider_requests"],
                            "provider_event_requests": report["provider_event_requests"],
                            "coverage_truncated": report["coverage_truncated"],
                            "exact_aces_pairs": report["exact_aces_pairs"],
                            "aces_market_groups": report["aces_market_groups"],
                            "archived_verified_prematch_pairs": total,
                            "archived_verified_outside_target": outside,
                            "source_errors": len(report["errors"]),
                            "cdb_writes": 0}, sort_keys=True))
          PY
      - name: Install scoped Google Drive authenticated client
        if: ${{ !inputs.candidate_cdb }}
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Archive to PropLine Google Drive folder and verify actual bytes
        if: ${{ !inputs.candidate_cdb }}
        env:
          BLINQ_DRIVE_WRITER_JSON: ${{ secrets.BLINQ_DRIVE_WRITER_JSON }}
          BLINQ_DRIVE_READER_JSON: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
          BETTING_DAY: ${{ steps.day.outputs.date }}
          PROPLINE_DRIVE_FOLDER_ID: "1C7_B2LB37IVTK9gBu2TT9dSj5XClIUKh"
        run: |
          set -euo pipefail
          python scripts/propline_drive_archive.py \
            --report reports/propline-evening/odds.json \
            --day "$BETTING_DAY" --run-id "$GITHUB_RUN_ID" \
            --folder "$PROPLINE_DRIVE_FOLDER_ID"
      - name: Keep local evidence even if provider access is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-propline-evening-research-${{ github.run_id }}
          path: |
            reports/propline-evening/odds.json
            reports/aces-cdb/*.json
          if-no-files-found: warn
          retention-days: 14
