name: BlinQ UI hotfix deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tbt-ui-hotfix-deploy
  # Only a newer explicit deployment may supersede an active upload.
  # Ordinary main commits have skipped deploy jobs and must not cancel it.
  cancel-in-progress: ${{ contains(github.event.head_commit.message, '[ui-hotfix-deploy]') }}

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[ui-hotfix-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard latest main revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          latest="$(git rev-parse origin/main)"
          current="$(git rev-parse HEAD)"
          test "$current" = "$latest"
          test "$GITHUB_SHA" = "$latest"

      - name: Prepare immutable serving feed
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python scripts/clean_generated_artifacts.py
          python scripts/prepare_feed.py
          test -s api/data/feed.json
          python scripts/verify_presentation_feed.py api/data/feed.json --summary

      # Preserve the same pinned, whitespace-only asset build as ci.yml.
      # Never let a UI hotfix silently replace optimized production files
      # with the larger raw Git sources.
      - name: Set up Node for pinned frontend optimization
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Optimize and validate exact hotfix assets before upload
        shell: bash
        run: |
          set -euo pipefail
          python scripts/optimize_web_assets.py --web web --output-dir /tmp/blinq-hotfix-optimized --apply
          node --check web/app.js
          node tests/live_aces_price_verification.cjs web/app.js
          python scripts/stamp_web_deployment.py --web web --sha "$GITHUB_SHA"

      - name: Deploy current UI/API to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: ''
          skip_app_build: true

      - name: Verify exact live revision and comparator UX
        if: ${{ vars.TBT_PRODUCTION_URL != '' }}
        env:
          TBT_PRODUCTION_URL: ${{ vars.TBT_PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          base="${TBT_PRODUCTION_URL%/}"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            bust="$GITHUB_SHA-$attempt"
            if curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache' "$base/deployment.json?__blinq_ui=$bust" -o /tmp/deployment.json &&
               curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache' "$base/app.js?__blinq_ui=$bust" -o /tmp/app.js &&
               curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache' "$base/?__blinq_ui=$bust" -o /tmp/blinq-index.html; then
              if python -c "import json,pathlib,sys; sha=sys.argv[1]; dep=json.loads(pathlib.Path('/tmp/deployment.json').read_text()); app=pathlib.Path('/tmp/app.js').read_text(); idx=pathlib.Path('/tmp/blinq-index.html').read_text(); assert dep.get('git_sha')==sha,(dep.get('git_sha'),sha); assert 'Max. počet setov' in app; assert 'function comparatorAutoPlayer' in app; assert 'comparatorDefaultBestOf' in app; assert 'ace-odds-sync=permanent-20261101-1' in idx, 'Stale ACES JS cache key'; assert 'function stableAceDisplayOdds' in app; assert 'function acePlaceholderOdds' in app; assert 'state.feed=normalizeFeedAceOdds(feed)' in app; assert 'Number(row?.statistical_ace_odds)' in app" "$GITHUB_SHA" &&
                 node tests/live_aces_price_verification.cjs /tmp/app.js; then
                ok=1
                break
              fi
            fi
            sleep 8
          done
          test "$ok" = 1

      - name: Read back all four production frontend hashes
        if: ${{ vars.TBT_PRODUCTION_URL != '' }}
        env:
          TBT_PRODUCTION_URL: ${{ vars.TBT_PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          base="${TBT_PRODUCTION_URL%/}"
          for attempt in 1 2 3 4 5 6 7 8; do
            mkdir -p /tmp/hotfix-readback
            fetched=1
            for name in deployment.json app.js blinq-app.css auth.js responsive.js; do
              curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache'                 "$base/$name?hotfix_sha=$GITHUB_SHA-$attempt"                 -o "/tmp/hotfix-readback/$name" || fetched=0
            done
            if [[ "$fetched" == "1" ]] && python - <<'PYREAD'
          import hashlib, json, os
          from pathlib import Path
          base = Path('/tmp/hotfix-readback')
          dep = json.loads((base / 'deployment.json').read_text(encoding='utf-8'))
          assert dep.get('git_sha') == os.environ['GITHUB_SHA'], 'Wrong production release SHA'
          digests = dep.get('files_sha256') or {}
          for name in ('app.js', 'blinq-app.css', 'auth.js', 'responsive.js'):
              actual = hashlib.sha256((base / name).read_bytes()).hexdigest()
              assert actual == digests.get(name), f'Live {name} hash mismatch'
          source = (base / 'app.js').read_text(encoding='utf-8')
          css = (base / 'blinq-app.css').read_text(encoding='utf-8')
          release = json.loads(Path('web/release.json').read_text(encoding='utf-8'))
          visual = release['visual_revision']
          assert f'BlinQ visual revision: {visual}' in source, 'JS visual revision missing'
          assert f'BlinQ visual revision {visual}' in css, 'CSS visual revision missing'
          print('Exact deployed SHA, four frontend SHA-256 hashes and both visual markers: PASS')
          PYREAD
            then
              exit 0
            fi
            [[ "$attempt" != "8" ]] || break
            sleep $((attempt * 2))
          done
          echo '::error::Production optimized frontend read-back did not converge'
          exit 1

      - name: Replay verified CLV archives for TOP/VALUE
        # Existing research data only. No extra provider requests.
        if: ${{ contains(github.event.head_commit.message, '[clv-detail]') }}
        timeout-minutes: 10
        env:
          TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
          BLINQ_PUBLIC_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          CLV_REPLAY_DAYS: "2"
        run: |
          set -euo pipefail
          python scripts/replay_clv_detail_archives.py

