name: Independent private ATP release checkpoint QA

on:
  pull_request:
    paths:
      - scripts/audit_atp_release_archive.py
      - scripts/test_audit_atp_release_archive.py
      - .github/workflows/verify-atp-release-checkpoints.yml
  push:
    branches: [main]
    paths:
      - scripts/audit_atp_release_archive.py
      - scripts/test_audit_atp_release_archive.py
      - .github/workflows/verify-atp-release-checkpoints.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source integrity tests (no provider network)
        run: |
          python -m py_compile scripts/audit_atp_release_archive.py scripts/test_audit_atp_release_archive.py
          python -u scripts/test_audit_atp_release_archive.py

  private-parser-selftest:
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve candidate private ATP parser by immutable commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api 'repos/BackstageTalks/tbt-data/contents/scripts/scrape_atptour_official.py?ref=d5f8bb18860d821eb0b4b04275fe9a9e09b96368' > /tmp/atp_source.json
          python - <<'PY'
          import base64,json
          from pathlib import Path
          data=json.loads(Path('/tmp/atp_source.json').read_text())
          if data.get('encoding')!='base64':
              raise SystemExit('Private parser not available for source QA')
          Path('/tmp/scrape_atptour_official.py').write_bytes(base64.b64decode(data['content']))
          PY
      - name: Run actual private parser offline completion contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          python -m py_compile /tmp/scrape_atptour_official.py
          python /tmp/scrape_atptour_official.py --mode selftest

  private-release-audit:
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      REPO: BackstageTalks/tbt-data
      RELEASE: blinq-cloud-atptour-20261009
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify metadata and actual bytes from four existing private assets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          mkdir -p /tmp/atp_release_qa
          while IFS='|' read -r YEAR ASSET EXPECT; do
            [[ -n "$YEAR" ]] || continue
            export ASSET
            DIGEST=$(gh api "repos/$REPO/releases/tags/$RELEASE" | python -c 'import json,os,sys; print(next((a.get("digest", "") for a in json.load(sys.stdin).get("assets", []) if a.get("name") == os.environ["ASSET"]), ""))')
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
              echo "Missing SHA-256 digest in private Release metadata: $ASSET" >&2
              exit 2
            fi
            gh release download "$RELEASE" --repo "$REPO" \
              --pattern "$ASSET" --dir /tmp/atp_release_qa
            python -u scripts/audit_atp_release_archive.py \
              --archive "/tmp/atp_release_qa/$ASSET" \
              --year "$YEAR" --expected-digest "$DIGEST" --expect "$EXPECT"
            rm "/tmp/atp_release_qa/$ASSET"
          done <<'CHECKPOINTS'
          2008|blinq-atp-archive-2008-37988671325-1.tar.gz|complete
          2021|blinq-atp-archive-2021-38070926249-1.tar.gz|complete
          2011|blinq-atp-archive-2011-37988671325-1.tar.gz|incomplete
          2018|blinq-atp-archive-2018-37988671325-1.tar.gz|incomplete
          CHECKPOINTS
          echo "Read-only private checkpoint QA finished; no provider calls, no CDB writes."
