name: BlinQ private Drive CDB audit - bounded free public runner

# No automatic schedule or push collection. No CDB writes or public artifacts.
'on':
  workflow_dispatch:
    inputs:
      batch_files:
        type: choice
        description: Maximum new or changed source files; verified cached files do not consume this budget
        required: true
        default: '200'
        options: ['10', '25', '50', '200', '500', '1000', '2000']
      download_mb:
        type: choice
        description: Maximum source download MiB for this batch (CDB snapshot excluded)
        required: true
        default: '2048'
        options: ['256', '512', '1024', '2048', '4096', '8192']
      force_scan:
        type: boolean
        description: Bootstrap a new folder-scoped source audit, or override cooldown with explicit authorization
        required: false
        default: false
      content_audit:
        type: boolean
        description: Explicit read-only content check; do not create a GitHub Release on every scheduler tick
        required: false
        default: false
  pull_request:
    paths:
      - .github/workflows/blinq-private-drive-cdb-audit-bridge.yml
      - scripts/drive_repo_source_sheet.py
      - tests/test_drive_repo_source_sheet.py
      - scripts/drive_cdb_private_bridge.py
      - tests/test_drive_cdb_private_bridge.py
      - scripts/drive_sort_prefolders.py
      - tests/test_drive_sort_prefolders.py
      - tests/test_drive_cron_bridge.py
      - .github/workflows/blinq-drive-content-audit.yml

permissions:
  contents: read

concurrency:
  # PR safety tests must not wait for a multi-hour read-only Drive batch;
  # dispatched scans retain the original single-run concurrency key.
  group: ${{ github.event_name == 'pull_request' && 'blinq-private-drive-audit-pr-ci' || 'blinq-private-drive-cdb-audit-bridge' }}
  cancel-in-progress: false

jobs:
  scan_budget:
    # External dispatch may arrive every 15 minutes. Only the lightweight
    # release-metadata check runs; do not download ~1 GB CDB for every tick.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Bound expensive Drive audit executions
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          FORCE_SCAN: ${{ inputs.force_scan }}
          PRIVATE_CACHE_RELEASE: blinq-drive-cdb-audit-cache-archive-20261016-v1
        run: |
          set -euo pipefail
          if [[ "$FORCE_SCAN" == "true" ]]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
            echo 'DRIVE_AUDIT_EXPLICIT_OVERRIDE'
            exit 0
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            echo 'DRIVE_AUDIT_BUDGET_BLOCKED_MISSING_PRIVATE_TOKEN'
            exit 0
          fi
          if ! release="$(gh api "repos/BackstageTalks/tbt-data/releases/tags/$PRIVATE_CACHE_RELEASE" 2>/dev/null)"; then
            # Fail closed on permission/rate-limit/network errors; never
            # interpret an unknown checkpoint as permission to spend.
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            echo 'DRIVE_AUDIT_BUDGET_BLOCKED_UNVERIFIED_CHECKPOINT'
            exit 0
          fi
          checkpoint="$(printf '%s' "$release" | jq -r '[.assets[]? | select(.name == "checkpoint.json") | .updated_at] | first // empty')"
          if [[ -z "$checkpoint" ]]; then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            echo 'DRIVE_AUDIT_BUDGET_BLOCKED_MISSING_CHECKPOINT_TIMESTAMP'
            exit 0
          fi
          last="$(date -u -d "$checkpoint" +%s)" || exit 1
          now="$(date -u +%s)"
          age=$((now - last))
          if (( age < 5400 )); then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            echo 'DRIVE_AUDIT_COOLDOWN_SKIP_90_MINUTES'
          else
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
            echo 'DRIVE_AUDIT_COOLDOWN_READY'
          fi

  safety-tests:
    needs: [scan_budget]
    # Run on PRs or only when an actual permitted source batch is due.
    # A 15-minute external tick must not trigger repeated full test jobs.
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && needs.scan_budget.outputs.proceed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test private report and checkpoint guards (no secrets)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_drive_cdb_private_bridge.py -v
          python -m unittest discover -s tests -p test_drive_sort_prefolders.py -v
          python -m unittest discover -s tests -p test_drive_cron_bridge.py -v
          python -m unittest discover -s tests -p test_drive_repo_source_sheet.py -v
          python -m compileall -q scripts/drive_sort_prefolders.py scripts/drive_repo_source_sheet.py

  private-drive-audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.scan_budget.outputs.proceed == 'true'
    needs: [safety-tests, scan_budget]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      DRIVE_ROOT: 1jzdzztz8cXquO8VDswqE19PHupQau-xM
      PRIVATE_CACHE_RELEASE: blinq-drive-cdb-audit-cache-archive-20261016-v1
      # A new folder requires a separate cache namespace. Do not restore the
      # old 17UCh... root checkpoint against this archive root.
      SOURCE_INVENTORY_TAG: blinq-drive-source-inventory-archive-20261016-v1
      # Immutable modern reader, explicitly validated against legacy checkpoint parser.
      SOURCE_REF: 10806400e536195890600c4256303697912ab95f
      LEGACY_SOURCE_REF: cf96b6085f93696eb7c319e9109a2040a04cfc4e
      # Independent immutable gate revision, not the checkpoint-bound scanner.
      NULL_GATE_REF: ef6b83d4b11157f41621e109a774fdc40a4095fe
      NULL_GATE_BLOB: f85f56d365c40f219ae56f87345faab60b33654a
      PYTHONPATH: api:scripts:private/scripts
    steps:
      - name: Preflight trust and private-only credentials
        id: preflight
        env:
          DRIVE_CREDENTIALS: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = BackstageTalks/tbt
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test -n "$GH_TOKEN" || { echo 'BLOCKED: missing private GitHub token'; exit 1; }
          test -n "$DRIVE_CREDENTIALS" || { echo 'BLOCKED: add BLINQ_DRIVE_READER_JSON secret to tbt'; exit 1; }
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .private)" = false
          echo 'PRIVATE_DESTINATION_AND_TRUST_GATES_PASS'

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        id: source_repo
        with:
          repository: BackstageTalks/tbt-data
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          # Pin the exact audited private commit, not an arbitrary depth-64
          # window of a fast-moving main branch. An old pin may leave that
          # window within hours and falsely block every authorized audit.
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1
          path: private
          persist-credentials: false

      - name: Verify immutable private source commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_REF"
          actual="$(git -C private rev-parse --verify HEAD)"
          test "$actual" = "$SOURCE_REF" || {
            echo 'BLOCKED: private source revision mismatch'
            exit 1
          }
          echo PINNED_PRIVATE_SOURCE_SHA_VERIFIED

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
          export_environment_variables: true

      - name: Install private audit read-only Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet google-auth requests 'pandas>=2,<3' pyarrow numpy pydantic pydantic-settings

      - name: Run pinned private audit synthetic tests without exposing logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if python -m unittest discover -s private/tests -p test_drive_cdb_audit.py >work/private-tests.log 2>&1; then
            echo PRIVATE_AUDIT_SYNTHETIC_TESTS_PASS
          else
            echo 'BLOCKED: private tests failed; details will stay private'
            exit 1
          fi

      - name: Confirm populated permitted Drive archive before downloading CDB
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import google.auth
          from google.auth.transport.requests import AuthorizedSession
          root = os.environ['DRIVE_ROOT']
          credentials, _ = google.auth.default(
              scopes=['https://www.googleapis.com/auth/drive.readonly'])
          session = AuthorizedSession(credentials)
          response = session.get(
              'https://www.googleapis.com/drive/v3/files',
              params={
                  'q': f"'{root}' in parents and trashed = false",
                  'pageSize': 1,
                  'fields': 'nextPageToken,files(id)',
                  'includeItemsFromAllDrives': 'true',
                  'supportsAllDrives': 'true',
              },
              timeout=30,
          )
          response.raise_for_status()
          if not response.json().get('files'):
              raise SystemExit('BLOCKED: DRIVE_ARCHIVE_ROOT_EMPTY_OR_INACCESSIBLE')
          print('DRIVE_ARCHIVE_ROOT_AUTHENTICATED_NONEMPTY')
          PY

      - name: Restore verified private checkpoint with historical-reader migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/cache work/cache-input
          if gh release view "$PRIVATE_CACHE_RELEASE" -R "$PRIVATE_REPO" >/dev/null 2>&1; then
            # An existing checkpoint must never be silently ignored.
            gh release download "$PRIVATE_CACHE_RELEASE" -R "$PRIVATE_REPO" -p checkpoint.json -D work/cache-input >/dev/null
            if ! gh release download "$PRIVATE_CACHE_RELEASE" -R "$PRIVATE_REPO" -p audit.sqlite.gz -D work/cache-input >/dev/null 2>&1; then
              gh release download "$PRIVATE_CACHE_RELEASE" -R "$PRIVATE_REPO" -p audit.sqlite -D work/cache-input >/dev/null
            fi
            if python scripts/drive_cdb_private_bridge.py restore-checkpoint --folder-id "$DRIVE_ROOT" --code-file private/scripts/drive_cdb_audit.py --source work/cache-input --dest work/cache/audit.sqlite; then
              echo VERIFIED_PRIVATE_CHECKPOINT_RESTORED
            else
              # The previous rolling checkpoint was created with the original
              # parser. Fetch that exact historical source solely to verify its
              # manifest binding, then prove the new parser differs ONLY in
              # how the next input files are ordered.
              gh api "repos/$PRIVATE_REPO/contents/scripts/drive_cdb_audit.py?ref=$LEGACY_SOURCE_REF" --jq .content | base64 --decode >work/legacy-drive-cdb-audit.py
              test -s work/legacy-drive-cdb-audit.py
              python scripts/drive_cdb_private_bridge.py verify-priority-reader --legacy-code work/legacy-drive-cdb-audit.py --priority-code private/scripts/drive_cdb_audit.py
              python scripts/drive_cdb_private_bridge.py restore-checkpoint --folder-id "$DRIVE_ROOT" --code-file work/legacy-drive-cdb-audit.py --source work/cache-input --dest work/cache/audit.sqlite
              echo VERIFIED_LEGACY_CHECKPOINT_MIGRATED_TO_PRIORITY_READER
            fi
            # Check SQLite itself; a valid gzip digest does not prove that
            # the historical database is readable or has expected tables.
            python - <<'PY'
          import sqlite3
          from pathlib import Path
          p = Path('work/cache/audit.sqlite')
          with sqlite3.connect(f'file:{p}?mode=ro', uri=True) as db:
              tables = {x[0] for x in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert {'files', 'profiles', 'failures', 'observations'} <= tables
              assert db.execute('PRAGMA quick_check').fetchone()[0] == 'ok'
              assert db.execute('SELECT COUNT(*) FROM files').fetchone()[0] > 0
          print('VERIFIED_PRIVATE_SQLITE_CACHE_INTEGRITY')
          PY
          else
            echo NO_PREVIOUS_PRIVATE_CHECKPOINT
          fi

      - name: Download and checksum-verify canonical CDB privately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/history
          python - <<'PY' >work/private-cdb.log 2>&1
          from pathlib import Path
          from release_store import ReleaseStore
          ReleaseStore('BackstageTalks/tbt-data', 'tbt-data-v1', Path('work/history')).download(require_bundle_manifest=True)
          PY
          echo CDB_BUNDLE_VERIFIED_PRIVATELY

      - name: Run bounded Drive versus CDB audit with private output only
        id: audit
        shell: bash
        env:
          BATCH_FILES: ${{ inputs.batch_files }}
          DOWNLOAD_MB: ${{ inputs.download_mb }}
        run: |
          set -euo pipefail
          case "$BATCH_FILES" in 10|25|50|200|500|1000|2000) ;; *) echo 'Invalid batch size'; exit 1;; esac
          case "$DOWNLOAD_MB" in 256|512|1024|2048|4096|8192) ;; *) echo 'Invalid download budget'; exit 1;; esac
          mkdir -p work/report work/cache
          set +e
          python -u private/scripts/drive_cdb_audit.py --prioritize-historical-stats --folder-id "$DRIVE_ROOT" --history-dir work/history --cache work/cache/audit.sqlite --out work/report --max-files "$BATCH_FILES" --max-download-mb "$DOWNLOAD_MB" >work/private-audit.log 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 0 ]]; then
            echo PRIVATE_AUDIT_FAILED_DETAILS_PRIVATE_ONLY
            exit "$code"
          fi
          python scripts/drive_cdb_private_bridge.py validate --report-dir work/report --folder-id "$DRIVE_ROOT"
          echo READ_ONLY_AUDIT_VALIDATED_NO_CANONICAL_WRITES

      - name: Restore verified previous source inventory
        if: steps.audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source-previous
          if gh release view $SOURCE_INVENTORY_TAG -R "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release download $SOURCE_INVENTORY_TAG -R "$PRIVATE_REPO" -p source-baseline.json -p source-baseline.sha256 -D work/source-previous >/dev/null
            (cd work/source-previous && sha256sum --status -c source-baseline.sha256)
            echo PREVIOUS_SOURCE_INVENTORY_SHA_VERIFIED
          else
            echo SOURCE_INVENTORY_BASELINE_NOT_YET_CREATED
          fi

      - name: Audit Drive and GitHub sources into private CSV sheets
        id: source_sheet
        if: steps.audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if test -s work/source-previous/source-baseline.json; then
            options+=(--previous work/source-previous/source-baseline.json)
          fi
          python scripts/drive_repo_source_sheet.py \
            --drive-inventory work/report/drive-inventory.json \
            --drive-files work/report/files.json \
            --cdb-report work/report/report.json \
            --out work/source-sheet "${options[@]}" \
            >work/source-sheet-counts.json
          test -s work/source-sheet/audit-zdrojov.csv
          test -s work/source-sheet/nove-a-zmenene-zdroje.csv
          test -s work/source-sheet/potencialne-datove-zdroje.csv
          (cd work/source-sheet && sha256sum --status -c source-baseline.sha256)
          echo PRIVATE_SOURCE_SHEETS_READ_ONLY_VALIDATED

      - name: Verify independently pinned read-only NULL reviewer
        if: steps.audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/sha-pinned-reviewer
          gh api "repos/$PRIVATE_REPO/contents/scripts/drive_cdb_current_null_gate.py?ref=$NULL_GATE_REF" --jq .content | base64 --decode > work/sha-pinned-reviewer/drive_cdb_current_null_gate.py
          test -s work/sha-pinned-reviewer/drive_cdb_current_null_gate.py
          actual="$(git hash-object work/sha-pinned-reviewer/drive_cdb_current_null_gate.py)"
          test "$actual" = "$NULL_GATE_BLOB" || {
            echo 'PRIVATE_NULL_REVIEWER_SHA_MISMATCH'
            exit 1
          }
          echo 'PINNED_CURRENT_NULL_REVIEWER_VERIFIED'

      - name: Recheck exact current CDB NULLs and source provenance privately
        id: current_null_review
        if: steps.audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/private-current-null-review
          # Never pass unverified license/identity files. Research-only
          # source links remain blocked. Source and CDB are SHA-bound.
          if python work/sha-pinned-reviewer/drive_cdb_current_null_gate.py \
            --source-audit work/report \
            --history-dir work/history \
            --out work/private-current-null-review >work/private-current-null.log 2>&1; then
            python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path('work/private-current-null-review/report.json').read_text())
          audit = json.loads(Path('work/report/report.json').read_text())
          assert gate['status'] == 'READ_ONLY_CURRENT_NULL_GATE'
          assert gate['production_mutated'] is False
          assert gate['write_authorized'] is False
          assert gate['ready_for_production_write'] == 0
          assert gate['canonical_rows'] == audit['canonical_rows']
          assert gate['source_candidates_checked'] == audit['comparison'].get('candidate_missing_fields', 0)
          PY
            echo PRIVATE_CURRENT_NULL_RECHECK_PASS_NO_WRITES
          else
            # Show only one stable, reviewed error category; never disclose
            # private match IDs, player names, source rows, or raw tracebacks.
            python - <<'PY'
          from pathlib import Path
          log = Path('work/private-current-null.log')
          text = log.read_text(errors='replace') if log.is_file() else ''
          reasons = (
              ('CANONICAL_SHA', ('Stale/invalid canonical year SHA', 'Different canonical year partition set')),
              ('CANDIDATE_COUNT', ('Candidate count and source report disagree',)),
              ('DUPLICATE_CELL', ('Duplicate/invalid canonical cell key',)),
              ('UNSUPPORTED_FIELD', ('Unsafe candidate authorization or field',)),
              ('SOURCE_PROVENANCE', ('Unpinned/ambiguous source provenance',)),
              ('INVALID_VALUE', ('Invalid candidate data type/value',)),
              ('SOURCE_INVENTORY', ('Incomplete original Drive file inventory',)),
              ('READ_ONLY_REPORT', ('Unsafe/incomplete source report',)),
              ('CANONICAL_ROW_COUNT', ('Canonical row count changed since original audit',)),
              ('SOURCE_REPORT', ('Missing validated read-only Drive report',)),
          )
          category = next((tag for tag, needles in reasons
                           if any(needle in text for needle in needles)), 'UNKNOWN_PRIVATE')
          print('PRIVATE_CURRENT_NULL_RECHECK_BLOCKED_' + category)
          PY
            exit 1
          fi

      - name: Publish private report and logs ONLY into private Release with readback
        id: private_report
        if: always() && steps.source_repo.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/private-output work/report-readback
          for file in work/private-tests.log work/private-cdb.log work/private-audit.log work/private-current-null.log; do
            if test -f "$file"; then cp "$file" work/private-output/; fi
          done
          for name in drive-inventory.json files.json candidate-fields.jsonl report.json; do
            if test -f "work/report/$name"; then cp "work/report/$name" work/private-output/; fi
          done
          if test -d work/source-sheet; then
            for name in audit-zdrojov.csv nove-a-zmenene-zdroje.csv potencialne-datove-zdroje.csv audit-zhrnutie.json source-baseline.json source-baseline.sha256; do
              test -s "work/source-sheet/$name" || exit 1
              cp "work/source-sheet/$name" work/private-output/
            done
          fi
          printf '%s\n' "source_ref=$SOURCE_REF" "source_sampling=historical_stats_priority" "drive_root=$DRIVE_ROOT" "run=$GITHUB_RUN_ID" "attempt=$GITHUB_RUN_ATTEMPT" "audit_outcome=${{ steps.audit.outcome }}" >work/private-output/run-evidence.txt
          if test -f work/private-current-null-review/report.json; then
            cp work/private-current-null-review/report.json work/private-output/current-null-review-report.json
            cp work/private-current-null-review/review-candidates.jsonl work/private-output/current-null-review-candidates.jsonl
          fi
          (cd work/private-output; sha256sum -- * > SHA256SUMS)
          # Upload one nonempty container: GitHub Release uploads reject
          # zero-byte candidate-fields.jsonl (HTTP 400 Bad Content-Length).
          # The tar preserves the exact empty file plus all source checksums.
          tar -czf work/drive-cdb-audit-bundle.tar.gz -C work/private-output .
          test -s work/drive-cdb-audit-bundle.tar.gz
          report_tag="blinq-drive-cdb-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$report_tag" -R "$PRIVATE_REPO" --target main --title 'Private bounded Drive/CDB read-only audit' --notes 'PRIVATE only. No canonical writes, scraping or training.' >/dev/null
          gh release upload "$report_tag" work/drive-cdb-audit-bundle.tar.gz -R "$PRIVATE_REPO" >/dev/null
          gh release download "$report_tag" -R "$PRIVATE_REPO" -p drive-cdb-audit-bundle.tar.gz -D work/report-readback >/dev/null
          cmp work/drive-cdb-audit-bundle.tar.gz work/report-readback/drive-cdb-audit-bundle.tar.gz
          mkdir -p work/report-readback/contents
          tar -xzf work/report-readback/drive-cdb-audit-bundle.tar.gz -C work/report-readback/contents
          (cd work/report-readback/contents; sha256sum -c SHA256SUMS >/dev/null)
          echo PRIVATE_AUDIT_REPORT_INDEPENDENT_SHA256_READBACK_PASS

      - name: Store private source inventory baseline with SHA256 readback
        if: steps.audit.outcome == 'success' && steps.source_sheet.outcome == 'success' && steps.private_report.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          tag=$SOURCE_INVENTORY_TAG
          if ! gh release view "$tag" -R "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release create "$tag" -R "$PRIVATE_REPO" --target main --title "Private Drive and Git source inventory baseline" --notes "Read-only observations; not a CDB import." >/dev/null
          fi
          gh release upload "$tag" work/source-sheet/source-baseline.json work/source-sheet/source-baseline.sha256 -R "$PRIVATE_REPO" --clobber >/dev/null
          mkdir -p work/source-baseline-readback
          gh release download "$tag" -R "$PRIVATE_REPO" -p source-baseline.json -p source-baseline.sha256 -D work/source-baseline-readback >/dev/null
          cmp work/source-sheet/source-baseline.json work/source-baseline-readback/source-baseline.json
          cmp work/source-sheet/source-baseline.sha256 work/source-baseline-readback/source-baseline.sha256
          (cd work/source-baseline-readback && sha256sum --status -c source-baseline.sha256)
          echo PRIVATE_SOURCE_BASELINE_SHA256_READBACK_PASS

      - name: Store verified private checkpoint only after success
        if: always() && steps.audit.outcome == 'success' && steps.private_report.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/cache-export work/cache-verify
          # The writer enforces 4 GiB raw and 1.8 GB gzip bounds.
          # Preserve immutable checkpoint and independent SHA-256 readback.
          python scripts/drive_cdb_private_bridge.py write-checkpoint --cache-file work/cache/audit.sqlite --code-file private/scripts/drive_cdb_audit.py --folder-id "$DRIVE_ROOT" --output work/cache-export
          # The previous rolling checkpoint was SHA-verified during restore.
          # If the exact bytes did not change, it is redundant to upload an
          # additional ~320 MiB immutable Release and rewrite the rolling tag.
          if test -s work/cache-input/audit.sqlite.gz \
            && test -s work/cache-input/checkpoint.json \
            && cmp -s work/cache-export/audit.sqlite.gz work/cache-input/audit.sqlite.gz \
            && cmp -s work/cache-export/checkpoint.json work/cache-input/checkpoint.json; then
            echo 'UNCHANGED_PRIVATE_CHECKPOINT_REUSED_NO_NEW_GITHUB_RELEASE'
            exit 0
          fi
          # Retain an immutable per-run checkpoint before updating the rolling
          # pointer. A partial pointer upload must not lose the completed batch.
          checkpoint_tag="blinq-drive-cdb-checkpoint-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$checkpoint_tag" -R "$PRIVATE_REPO" --target main --title 'Private Drive audit batch checkpoint' --notes 'Immutable source-observation checkpoint. No canonical writes.' >/dev/null
          gh release upload "$checkpoint_tag" work/cache-export/audit.sqlite.gz work/cache-export/checkpoint.json -R "$PRIVATE_REPO" >/dev/null
          gh release download "$checkpoint_tag" -R "$PRIVATE_REPO" -p audit.sqlite.gz -p checkpoint.json -D work/cache-verify >/dev/null
          python scripts/drive_cdb_private_bridge.py restore-checkpoint --folder-id "$DRIVE_ROOT" --code-file private/scripts/drive_cdb_audit.py --source work/cache-verify --dest work/cache/verified-persisted.sqlite
          if ! gh release view "$PRIVATE_CACHE_RELEASE" -R "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release create "$PRIVATE_CACHE_RELEASE" -R "$PRIVATE_REPO" --target main --title 'Private read-only Drive source checkpoint' --notes 'Cached observations only. Not an import.' >/dev/null
          fi
          gh release upload "$PRIVATE_CACHE_RELEASE" work/cache-export/audit.sqlite.gz work/cache-export/checkpoint.json -R "$PRIVATE_REPO" --clobber >/dev/null
          gh release download "$PRIVATE_CACHE_RELEASE" -R "$PRIVATE_REPO" -p audit.sqlite.gz -p checkpoint.json -D work/cache-verify --clobber >/dev/null
          python scripts/drive_cdb_private_bridge.py restore-checkpoint --folder-id "$DRIVE_ROOT" --code-file private/scripts/drive_cdb_audit.py --source work/cache-verify --dest work/cache/verified-persisted.sqlite
          echo PRIVATE_CHECKPOINT_INDEPENDENT_SHA256_READBACK_PASS

      - name: Record execution status without exposing private source data
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          REPORT_OUTCOME: ${{ steps.private_report.outcome }}
        run: |
          {
            echo '## Drive batch: read-only candidate discovery'
            echo "Audit step: $AUDIT_OUTCOME; private report: $REPORT_OUTCOME. Current NULL review must pass independently."
            echo 'Canonical imports: none. Candidate values require identity, rights, time and governed-writer gates.'
            echo 'Check the checkpoint step before claiming this batch can resume. Full evidence is in the private tbt-data releases.'
            echo 'Private CSV audit sheets: audit-zdrojov.csv, nove-a-zmenene-zdroje.csv, potencialne-datove-zdroje.csv in the paired private tbt-data Release.'
            echo 'No schedule is installed. External cron can invoke workflow_dispatch on main with batch_files and download_mb.'
          } >> "$GITHUB_STEP_SUMMARY"

  drive-folder-selection:
    # Only after successful private audit; originals are never moved.
    needs: [private-drive-audit]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.private-drive-audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test classifier and install metadata-only Drive dependencies
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_drive_sort_prefolders.py -v
          python -m pip install --disable-pip-version-check -q google-auth requests
      - name: Select sources into verified predefined folders
        shell: bash
        env:
          DRIVE_READER_JSON: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
          DRIVE_ORGANIZER_JSON: ${{ secrets.BLINQ_DRIVE_ORGANIZER_JSON }}
        run: |
          set -euo pipefail
          mkdir -p work/drive-folder-selection
          # Reader-only safe mode: neither source relocation nor shortcut
          # creation has passed the full dependency/content audit gate.
          # Never select writable organizer credentials in a nightly audit.
          mode=plan
          export BLINQ_DRIVE_SORT_CREDENTIALS="$DRIVE_READER_JSON"
          test -n "$BLINQ_DRIVE_SORT_CREDENTIALS"
          python scripts/drive_sort_prefolders.py --mode "$mode" \
            --max-files 10000 --max-folders 2000 --max-new 300 \
            --out work/drive-folder-selection/private-report.json \
            >work/drive-folder-selection/public-counts.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('work/drive-folder-selection/private-report.json').read_text())
          assert data['source_originals_moved']==0 and data['cdb_writes']==0
          assert data['source_file_count']==sum(data['category_counts'].values())
          assert len(data['details'])==data['source_file_count']
          assert data['new_shortcuts_verified']+data['already_linked']+data['pending_unlinked']==data['source_file_count']
          print('DRIVE_FOLDER_SELECTION_CONSISTENCY_PASS')
          PY
          echo DRIVE_FOLDER_SELECTION_COUNTS_ONLY
          cat work/drive-folder-selection/public-counts.json
      - name: Publish full manifest ONLY in verified private Release
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          tag="blinq-drive-cdb-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release view "$tag" -R "$PRIVATE_REPO" >/dev/null
          (cd work/drive-folder-selection && sha256sum private-report.json > SHA256SUMS)
          tar -czf work/drive-folder-selection.tar.gz -C work/drive-folder-selection private-report.json SHA256SUMS
          gh release upload "$tag" work/drive-folder-selection.tar.gz -R "$PRIVATE_REPO"
          mkdir -p work/drive-folder-readback
          gh release download "$tag" -R "$PRIVATE_REPO" -p drive-folder-selection.tar.gz -D work/drive-folder-readback
          cmp work/drive-folder-selection.tar.gz work/drive-folder-readback/drive-folder-selection.tar.gz
          (cd work/drive-folder-readback && tar -xzf drive-folder-selection.tar.gz && sha256sum -c SHA256SUMS)
          echo DRIVE_FOLDER_SELECTION_PRIVATE_SHA_READBACK_PASS
      - name: Publish counts-only classification status
        if: always()
        shell: bash
        run: |
          {
            echo '## Drive folder selection'
            if [[ -s work/drive-folder-selection/public-counts.json ]]; then
              echo 'Original sources remain untouched; no shortcuts or file moves were made (plan only).'
              cat work/drive-folder-selection/public-counts.json
            else
              echo 'Folder classification not verified. No success claim.'
            fi
            echo 'Full manifest stays in the paired PRIVATE tbt-data release.'
          } >> "$GITHUB_STEP_SUMMARY"

  drive-content-readonly:
    # Explicit opt-in: the caller should request this at most once per day.
    # Do not generate an immutable GitHub Release for every 15-minute tick.
    # Does not mutate Drive, CDB, repositories, model or production UI.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.content_audit == true
    uses: ./.github/workflows/blinq-drive-content-audit.yml
    with:
      download_mb: '512'
    secrets: inherit
