name: BlinQ 10 Nov ATP/WTA Telegram tour correction (one-shot)
# Explanatory notice only. Never cancels, reprices, republishes or settles bets.
on:
  push:
    branches: [main]
    paths:
      - '.github/telegram-20261110-tour-correction-request.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-telegram-ledger
  cancel-in-progress: false

jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: telegram-bot-state
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: .private-telegram
          sparse-checkout: ops
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Authorize exact one-shot correction and verify live website
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
          BLINQ_PRODUCTION_URL: ${{ vars.TBT_PRODUCTION_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$BLINQ_LIVE_WORKER_TOKEN"
          test -s .private-telegram/ops/telegram-bot-state.json
          test -s .github/telegram-20261110-tour-correction-request.json
          jq -e '.schema == 1 and .day == "2026-11-10"
            and .kind == "one-shot-confirmed-tour-scope-correction"
            and .original_daily_message_ids == [752,753]
            and .original_more_aces_message_ids == [754]
            and .paid_provider_requests == 0
            and .cdb_writes == false
            and .results_writes == false
            and .reprice == false
            and .new_bets == false' \
            .github/telegram-20261110-tour-correction-request.json >/dev/null
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            git cat-file -e "HEAD^"
            git diff-tree --no-commit-id --name-only -r HEAD^ HEAD |
              grep -Fxq '.github/telegram-20261110-tour-correction-request.json'
          fi
          python scripts/telegram_20261110_tour_correction.py prepare \
            --state .private-telegram/ops/telegram-bot-state.json \
            --api-url "$BLINQ_PRODUCTION_URL"
          if [[ -s /tmp/blinq-telegram/ready ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reserve correction in original private Telegram ledger
        if: steps.prepare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/blinq-telegram/state.json .private-telegram/ops/telegram-bot-state.json
          git -C .private-telegram config user.name "github-actions[bot]"
          git -C .private-telegram config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Reserve one-shot tour clarification [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual"
      - name: Send ONE correction message, without publishing new bets
        if: steps.prepare.outputs.ready == 'true'
        env:
          TGB: ${{ secrets.TGB }}
          TGCH: ${{ secrets.TGCH }}
        run: python scripts/telegram_offer_publisher.py send
      - name: Confirm Telegram ID and independently read back private ledger
        if: steps.prepare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/telegram_offer_publisher.py mark-sent
          cp /tmp/blinq-telegram/state.json .private-telegram/ops/telegram-bot-state.json
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Confirm one-shot tour clarification receipt [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual"
