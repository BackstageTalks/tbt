name: One-shot MoviOdds CDB guarded release-path verification

'on':
  push:
    branches: [main]
    paths:
      - ops/cdb-import-requests/moviodds-dispatch-once-20261101.json

permissions:
  contents: read
  actions: write

concurrency:
  group: blinq-moviodds-cdb-one-shot-verification
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'test(ops): dispatch MoviOdds CDB guarded smoke 2026-11-01')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source-only safe dispatch authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("ops/cdb-import-requests/moviodds-dispatch-once-20261101.json")
          data=json.loads(path.read_text())
          if data != {
              "schema":1,
              "source":"moviodds",
              "purpose":"single_existing_guarded_cdb_writer_integration",
              "sports_api_requests":0,
              "allow_stats_fields":["aces","double_faults"],
              "no_new_writer":True,
          }:
              raise SystemExit("MOVIODDS_ONE_SHOT_AUTHORIZATION_INVALID")
          print("AUTHORIZED_GUARDED_CDB_MOVIDDS_SMOKE")
          PY
      - name: Dispatch existing CDB importer in MoviOdds mode
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run cdb-drive-inbox.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f source_mode=moviodds -f moviodds_days_back=14 \
            -f request_id=moviodds-smoke-20261101
          echo 'EXISTING_CDB_GUARDED_WRITER_DISPATCHED_CHECK_TARGET_RUN_RESULT'
