name: Offline new-source coverage audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit-new-sources:
    if: ${{ github.head_ref == 'audit/library-gap-sources-20261001' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      PBP_SHA: 3d3bfc602ed0551352f9e984c1f51240811c8db6
      ATPWORLD_SHA: a92c6192c5e775df9d6be81d3ef978052b012cd9
    steps:
      - name: Checkout BlinQ audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install history reader dependencies
        run: python -m pip install -r api/requirements.txt -r api/requirements-train.txt

      - name: Download verified canonical history
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          out = Path(".cache/tbt/history")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", out).download()
          print("canonical partitions", len(list(out.glob("history-*.parquet"))))
          PY

      - name: Fetch pinned public source archives
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/sources
          git clone -q https://github.com/ppaulojr/tennis_pointbypoint.git .cache/tbt/sources/pbp
          git -C .cache/tbt/sources/pbp checkout -q "$PBP_SHA"
          git clone -q https://github.com/serve-and-volley/atp-world-tour-tennis-data.git .cache/tbt/sources/atpworld
          git -C .cache/tbt/sources/atpworld checkout -q "$ATPWORLD_SHA"
          test "$(git -C .cache/tbt/sources/pbp rev-parse HEAD)" = "$PBP_SHA"
          test "$(git -C .cache/tbt/sources/atpworld rev-parse HEAD)" = "$ATPWORLD_SHA"

      - name: Audit PBP serve-return against canonical history
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r f; do args+=(--pbp-csv "$f"); done < <(find .cache/tbt/sources/pbp -maxdepth 1 -name 'pbp_matches_*.csv' -type f | sort)
          test "${#args[@]}" -gt 0
          python scripts/link_sackmann_pbp_serve_return.py \
            --history-dir .cache/tbt/history \
            "${args[@]}" \
            --out-dir .cache/tbt/audit/pbp

      - name: Audit ATP official 1991-2018 against canonical history
        run: |
          set -euo pipefail
          root=.cache/tbt/sources/atpworld/csv
          targs=()
          sargs=()
          stargs=()
          while IFS= read -r f; do targs+=(--tournaments-csv "$f"); done < <(find "$root/1_tournaments" -maxdepth 1 -name 'tournaments_*.csv' -type f | sort)
          while IFS= read -r f; do sargs+=(--scores-csv "$f"); done < <(find "$root/2_match_scores" -maxdepth 1 -name 'match_scores_*.csv' -type f | sort)
          while IFS= read -r f; do stargs+=(--stats-csv "$f"); done < <(find "$root/3_match_stats" -maxdepth 1 -name 'match_stats_*.csv' ! -name 'match_stats_extended_*' -type f | sort)
          python scripts/link_atpworldtour_stats.py \
            --history-dir .cache/tbt/history \
            "${targs[@]}" "${sargs[@]}" "${stargs[@]}" \
            --min-year 1991 --max-year 2018 \
            --out-dir .cache/tbt/audit/atpworld

      - name: Publish audit summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("# New offline source coverage audit")
          for label, path in (
              ("PBP", Path(".cache/tbt/audit/pbp/report.json")),
              ("ATP official 1991-2018", Path(".cache/tbt/audit/atpworld/report.json")),
          ):
              r=json.loads(path.read_text())
              c=r.get("counts", {})
              print(f"## {label}")
              print(f"- canonical rows: {r.get('canonical_rows', 0):,}")
              print(f"- source usable: {c.get('usable_source_rows', c.get('usable_source_matches',0)):,}")
              print(f"- identity linked: {c.get('identity_linked', c.get('staged_matches',0)+c.get('already_present',0)):,}")
              print(f"- staged matches: {c.get('staged_matches',0):,}")
              print(f"- already present: {c.get('already_present',0):,}")
              print(f"- conflicts: {c.get('stat_conflict_matches',0):,}")
              print(f"- unmatched: {c.get('unmatched',0):,}")
              print(f"- ambiguous: {c.get('ambiguous',0):,}")
              print(f"- newly complete projected: {r.get('quality_ready_projected_added',0):,}")
              print(f"- projected complete total: {r.get('quality_ready_projected_after',0):,}")
              print(f"- production mutated: {r.get('production_mutated')}")
              print(f"- API requests: {r.get('api_requests')}")
          PY

      - name: Upload read-only audit reports
        uses: actions/upload-artifact@v4
        with:
          name: offline-new-source-audit-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            .cache/tbt/audit/pbp/report.json
            .cache/tbt/audit/pbp/review.jsonl
            .cache/tbt/audit/atpworld/report.json
            .cache/tbt/audit/atpworld/auto_linked.jsonl
            .cache/tbt/audit/atpworld/review.jsonl
            .cache/tbt/audit/atpworld/quarantine.jsonl
