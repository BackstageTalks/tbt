name: BlinQ manual serve-return 3000
on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: 'Hard cap on paid API requests (1–3000)'
        required: true
        default: '3000'
        type: choice
        options: ['3000', '2000', '1000', '500', '100']
permissions:
  contents: read
  actions: read
concurrency:
  group: tbt-manual-serve-return-paid
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      BLINQ_SHARED_API_BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
      BLINQ_SHARED_API_BUDGET_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      BLINQ_SHARED_API_BUDGET_PURPOSE: history
      TENNISAPI_RAPIDAPI_HOST: ${{ vars.TENNISAPI_RAPIDAPI_HOST }}
      TENNISAPI_STATS_URL_TEMPLATE: ${{ vars.TENNISAPI_STATS_URL_TEMPLATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install and validate configuration before paid calls
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q scripts/manual_serve_return_3000.py
          test -n "$GH_TOKEN"
          test -n "$RAPIDAPI_KEY"
          test -n "$TENNISAPI_RAPIDAPI_HOST"
          test -n "$TENNISAPI_STATS_URL_TEMPLATE"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = PRIVATE
      - name: Recover latest private staging artifact (deduplicate across runs)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/manual-serve-return/previous
          artifact_name=$(gh api "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name | startswith("manual-serve-return-")) | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].name // empty')
          if [ -n "$artifact_name" ]; then
            previous_run="${artifact_name#manual-serve-return-}"
            gh run download "$previous_run" --repo "$GH_REPO" --name "$artifact_name" --dir .cache/tbt/manual-serve-return/previous
            test -s .cache/tbt/manual-serve-return/previous/provider_responses.jsonl
            echo "Recovered previous staging: $artifact_name"
          else
            echo "No previous artifact found; refusing paid calls without recovery."
            exit 1
          fi
      - name: Stage provider statistics (no production writes)
        run: |
          set -euo pipefail
          python scripts/manual_serve_return_3000.py --limit "${{ inputs.max_requests }}"
      - name: Upload private staging and usage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-serve-return-${{ github.run_id }}
          path: .cache/tbt/manual-serve-return/output/
          if-no-files-found: warn
          retention-days: 7
