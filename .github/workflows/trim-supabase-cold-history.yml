name: V20.6 · Trim Supabase cold history

on:
  workflow_dispatch:
    inputs:
      execute_delete:
        description: "Actually delete matches before 2025-01-01 (false = preview only)"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "For delete, type exactly: DELETE PRE-2025 MATCHES"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: tbt-supabase-cold-trim
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1
      TBT_HISTORY_DIR: .cache/tbt/history
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          python -m compileall -q api scripts

      - name: Download GitHub partitions
        run: bash scripts/download_history_release.sh .cache/tbt

      - name: Download legacy GH snapshot for lossless comparison when available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/legacy
          if gh release view "$TBT_HISTORY_RELEASE_TAG" --repo "$TBT_DATA_REPOSITORY" --json assets -q '.assets[].name' | grep -qx 'training_snapshot.parquet'; then
            gh release download "$TBT_HISTORY_RELEASE_TAG" \
              --repo "$TBT_DATA_REPOSITORY" \
              --pattern 'training_snapshot.parquet' \
              --dir .cache/tbt/legacy \
              --clobber
          fi

      - name: Validate GH before any Supabase delete
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--history-dir "$TBT_HISTORY_DIR")
          if [[ -s .cache/tbt/legacy/training_snapshot.parquet ]]; then
            ARGS+=(--legacy-snapshot .cache/tbt/legacy/training_snapshot.parquet)
          fi
          python scripts/validate_history_partitions.py "${ARGS[@]}"

      - name: Enforce destructive confirmation
        if: ${{ inputs.execute_delete }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "DELETE PRE-2025 MATCHES" || {
            echo "Confirmation mismatch; refusing delete."
            exit 1
          }

      - name: Preview or trim Supabase cold tier
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ inputs.execute_delete }}" == "true" ]]; then
            ARGS+=(--execute --confirmation "${{ inputs.confirmation }}")
          fi
          python scripts/trim_supabase_cold_history.py "${ARGS[@]}"

      - name: Maintenance reminder
        if: ${{ inputs.execute_delete }}
        run: |
          echo "Cold rows are deleted. Optional physical-space reclamation remains a Supabase SQL maintenance step; do not VACUUM FULL during user traffic."
