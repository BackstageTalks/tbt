name: Retrain, evaluate and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: tbt-model-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONPATH: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install training dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt pytest

      - name: Compile
        run: |
          python -m compileall -q api scripts

      - name: Unit tests
        run: |
          pytest -q

      - name: Train challenger
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: tennisapi1.p.rapidapi.com
          RAPIDAPI_BASE_URL: https://tennisapi1.p.rapidapi.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TGBOT: ${{ secrets.TGBOT }}
          TGCHID: ${{ secrets.TGCHID }}
        run: |
          python scripts/train.py \
            --output api/artifacts/challenger.joblib

      - name: Resolve challenger version
        id: challenger
        run: |
          set -euo pipefail

          VERSION=$(python - <<'PY'
          import sys
          sys.path.insert(0, "api")
          from tbt.models.artifact import load_model
          print(load_model("api/artifacts/challenger.joblib").version)
          PY
          )

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Challenger: ${VERSION}"

      - name: Upload immutable challenger artifact
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/model_store.py upload \
            --file api/artifacts/challenger.joblib \
            --version "${{ steps.challenger.outputs.version }}"

      - name: Download current champion artifact
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/model_store.py download \
            --champion \
            --file api/artifacts/champion.joblib

      - name: Direct challenger versus champion evaluation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/evaluate_challenger.py \
            --challenger api/artifacts/challenger.joblib \
            --champion api/artifacts/champion.joblib

      - name: Walk-forward diagnostic backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/backtest.py

      - name: Download final champion after lifecycle decision
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          rm -f api/artifacts/model.joblib

          python scripts/model_store.py download \
            --champion \
            --file api/artifacts/model.joblib

      - name: Generate fresh champion predictions
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: tennisapi1.p.rapidapi.com
          RAPIDAPI_BASE_URL: https://tennisapi1.p.rapidapi.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/refresh_predictions.py

      - name: Reconcile recent results
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: tennisapi1.p.rapidapi.com
          RAPIDAPI_BASE_URL: https://tennisapi1.p.rapidapi.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/settle_results.py

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbt-evaluation
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove heavy models from Azure package
        run: |
          rm -f api/artifacts/*.joblib

      - name: Deploy lightweight BlinQ API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: ""
          skip_app_build: true
