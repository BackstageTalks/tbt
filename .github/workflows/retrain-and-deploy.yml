name: Retrain, backtest and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: tbt-model-training
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api
      TBT_HOT_RETENTION_DAYS: "60"
      TBT_CHECKPOINT_OVERLAP_DAYS: "14"
      TBT_HISTORY_DIR: .cache/tbt/history
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1
      TBT_MODEL_ARCHIVE_RELEASE_TAG: tbt-models-v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight private data repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TBT_DATA_REPOSITORY" || { echo "Missing TBT_DATA_REPOSITORY"; exit 1; }
          test -n "$TBT_DATA_GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing non-private data repo: $visibility"; exit 1; }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install training dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt pytest
          python -m compileall -q api scripts
          pytest -q

      - name: Download partitioned GitHub history
        shell: bash
        run: bash scripts/download_history_release.sh .cache/tbt

      - name: Validate history integrity before training
        run: python scripts/validate_history_partitions.py --history-dir "$TBT_HISTORY_DIR"

      - name: Train challenger from GitHub history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/train.py \
            --history-dir "$TBT_HISTORY_DIR" \
            --output api/artifacts/model.joblib

      - name: Walk-forward backtest from GitHub history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/backtest.py --history-dir "$TBT_HISTORY_DIR"

      - name: Resolve challenger version
        id: model
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          from tbt.models.artifact import load_model
          print(load_model('api/artifacts/model.joblib').version)
          PY
          )"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp api/artifacts/model.joblib ".cache/tbt/model-${VERSION}.joblib"
          ls -lh ".cache/tbt/model-${VERSION}.joblib"

      - name: Archive challenger artifact in private GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TBT_MODEL_ARCHIVE_RELEASE_TAG" --repo "$TBT_DATA_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TBT_MODEL_ARCHIVE_RELEASE_TAG" \
              --repo "$TBT_DATA_REPOSITORY" \
              --title 'TBT model archive v1' \
              --notes 'Versioned challenger/champion model artifacts. Production publication is separate.'
          gh release upload "$TBT_MODEL_ARCHIVE_RELEASE_TAG" \
            ".cache/tbt/model-${{ steps.model.outputs.version }}.joblib" \
            --repo "$TBT_DATA_REPOSITORY" \
            --clobber

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: tbt-evaluation-${{ steps.model.outputs.version }}
          path: reports/
          retention-days: 30

      - name: Production safety summary
        run: |
          echo "Challenger ${{ steps.model.outputs.version }} was trained/backtested from GitHub history."
          echo "It was NOT published as production and did NOT overwrite the current champion."
          echo "Promote only after evaluation, then run 'V20.5 · Publish champion model to private GitHub Release'."
