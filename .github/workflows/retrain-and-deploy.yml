name: Retrain, backtest and deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest
      - name: Unit tests
        run: pytest
      - name: Train production artifact
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: tennisapi1.p.rapidapi.com
          RAPIDAPI_BASE_URL: https://tennisapi1.p.rapidapi.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TGBOT: ${{ secrets.TGBOT }}
          TGCHID: ${{ secrets.TGCHID }}
        run: python scripts/train.py --output api/artifacts/model.joblib
      - name: Walk-forward backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/backtest.py
      - name: Verify trained model
        run: |
          set -euo pipefail
          test -s api/artifacts/model.joblib
          ls -lh api/artifacts/model.joblib
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: tbt-evaluation
          path: reports/
          retention-days: 30
      - name: Deploy tested model and API to Azure Static Web Apps Free
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: ""
          skip_app_build: true
