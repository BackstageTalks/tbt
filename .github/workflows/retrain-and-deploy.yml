name: Retrain, backtest and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r api/requirements.txt pytest
      - name: Unit tests
        env:
          PYTHONPATH: api
        run: pytest
      - name: Train production artifact
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TGBOT: ${{ secrets.TGBOT }}
          TGCHID: ${{ secrets.TGCHID }}
        run: python scripts/train.py --output api/artifacts/model.joblib
      - name: Walk-forward backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/backtest.py
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: tbt-v200-evaluation
          path: reports/
          retention-days: 30
      - name: Resolve Function App name from publish profile
        env:
          PROFILE: ${{ secrets.BLINQ_FUNCTION_PUBLISH_PROFILE }}
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          root = ET.fromstring(os.environ['PROFILE'])
          nodes = list(root) if root.tag.lower().endswith('publishdata') else [root]
          node = next((n for n in nodes if n.attrib.get('destinationAppUrl')), nodes[0])
          name = (urlparse(node.attrib.get('destinationAppUrl', '')).hostname or '').split('.')[0]
          if not name:
              name = node.attrib.get('msdeploySite') or node.attrib.get('userName', '').replace('$', '').split('\\')[-1]
          if not name:
              raise SystemExit('Could not derive Function App name')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'AZURE_FUNCTIONAPP_NAME={name}\n')
          PY
      - name: Deploy the exact tested model artifact
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: api
          publish-profile: ${{ secrets.BLINQ_FUNCTION_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
