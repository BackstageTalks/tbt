name: Environment bulk audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_environment_bulk.py"
      - ".github/workflows/environment-bulk-audit.yml"

permissions:
  contents: read

concurrency:
  group: tbt-history-data-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: api
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install requirements
        run: |
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q scripts/audit_environment_bulk.py
      - name: Confirm private data access
        run: |
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo 'Refusing non-private history'; exit 1; }
      - name: Analyze unique venues without external API calls
        run: python scripts/audit_environment_bulk.py
      - name: Publish aggregate report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blinq-environment-bulk-audit
          path: environment_bulk_audit.json
