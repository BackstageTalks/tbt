name: BlinQ Telegram linked footer smoke
on:
  push:
    branches: [feat/telegram-compact-top-value-aces-20261031]
    paths: ['.github/telegram-linked-footer-smoke-trigger.txt']
permissions:
  contents: read
concurrency:
  group: blinq-telegram-link-smoke
  cancel-in-progress: false
jobs:
  synthetic:
    if: contains(github.event.head_commit.message, '[tg-link-smoke-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/telegram-compact-top-value-aces-20261031
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send one synthetic TOP Value Aces preview and verify link entity
        env:
          TGB: ${{ secrets.TGB }}
          TGCH: ${{ secrets.TGCH }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          sys.path.insert(0, 'scripts')
          import telegram_offer_publisher as tg
          token=os.environ.get('TGB','').strip()
          target=os.environ.get('TGCH','').strip()
          if not token or not target:
              raise SystemExit('Missing Telegram smoke test secrets')
          sample='\n\n'.join([
              '🧪 TEST FORMÁTU — fiktívne tipy, neslúžia na stávkovanie',
              tg.HEADER,
              '📅 Ilustračná ponuka',
              '1️⃣ Novak | 12:30 | 72.4% | 1.75\n2️⃣ Kovac | 14:00 | 69.1% | 1.88\n3️⃣ Sinner | 15:00 | 68.3% | 2.05 | EV +10.2%\n4️⃣ Alcaraz | 16:00 | aces 8.2 | 73.0% | —',
              tg.branded_footer(),
          ])
          entities=tg.telegram_link_entities(sample)
          if len(entities)!=1 or entities[0]['url']!=tg.BRAND_URL:
              raise SystemExit('Telegram brand text_link not created')
          params={'chat_id':target,'text':sample,'entities':json.dumps(entities,ensure_ascii=False),
                  'disable_web_page_preview':'true'}
          req=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendMessage',
                  data=urllib.parse.urlencode(params).encode('utf-8'),method='POST')
          try:
              with urllib.request.urlopen(req,timeout=25) as response:
                  data=json.loads(response.read(32768))
          except Exception as err:
              raise SystemExit('Telegram smoke transport failed: '+type(err).__name__)
          item=data.get('result') or {}
          mid=item.get('message_id')
          received_entities=item.get('entities') or []
          valid_entity=any(e.get('type')=='text_link' and e.get('url')==tg.BRAND_URL
                           for e in received_entities)
          if not data.get('ok') or type(mid) is not int or not valid_entity:
              raise SystemExit('Telegram did not confirm the clickable brand link')
          print('TELEGRAM_BRAND_LINK_SMOKE_ACCEPTED message_id='+str(mid)+' entity_verified=true')
          PY
