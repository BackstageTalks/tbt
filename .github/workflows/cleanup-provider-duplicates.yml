name: Cleanup provider duplicates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Migration mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: provider-duplicate-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Canonical match migration
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONPATH: api
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt

      - name: Compile
        run: |
          python -m compileall -q api scripts

      - name: Run cleanup
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.mode }}" == "apply" ]]; then
            python scripts/cleanup_provider_duplicates.py --apply
          else
            python scripts/cleanup_provider_duplicates.py
          fi

      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-duplicate-cleanup-${{ inputs.mode }}
          path: reports/provider_duplicate_cleanup.json
          if-no-files-found: warn
          retention-days: 30
