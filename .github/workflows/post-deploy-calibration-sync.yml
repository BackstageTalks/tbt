name: Verify calibration after deploying its backend

on:
  workflow_run:
    workflows: ["Test and deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: model-calibration-postdeploy
  cancel-in-progress: false

jobs:
  dispatch-after-deploy:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dispatch private calibration re-read only after exact live release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "deploy") | .conclusion' | head -1)"
          if [[ "$deploy_result" != "success" ]]; then
            echo 'CALIBRATION_POSTDEPLOY_NO_SUCCESSFUL_DEPLOY'
            exit 0
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$latest" != "$DEPLOYED_SHA" ]]; then
            echo 'CALIBRATION_POSTDEPLOY_STALE_WORKFLOW_IGNORED'
            exit 0
          fi
          # Compare with the PREVIOUS ACTUALLY DEPLOYED revision, not only
          # the last commit. Rapid merges can cancel intervening deploys.
          previous_sha=""
          candidates="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=50")"
          while IFS= '^(api/function_app\.py|api/tbt/services/(admin_storage|model_calibration_status)\.py|scripts/publish_model_calibration_status\.py|\.github/workflows/(model-calibration-monitor|post-deploy-calibration-sync)\.yml)$' <<< "$changed"; then
            echo 'CALIBRATION_POSTDEPLOY_NO_RELEVANT_CHANGES'
            exit 0
          fi
          # The signed private worker will independently verify the CDB, model
          # pair, immutable release, CAS storage write and authenticated readback.
          correlation="postdeploy-${DEPLOYED_SHA:0:12}-${GITHUB_RUN_ID}"
          gh workflow run model-calibration-monitor.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f "request_id=$correlation"
          # Dispatch acknowledgment is NOT the result. Wait for the exact
          # correlated, private monitor run and require a successful readback.
          monitor_id=""
          for attempt in {1..20}; do
            monitor_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow model-calibration-monitor.yml --branch main \
              --event workflow_dispatch --limit 40 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"Model Lab tests $correlation\") | .databaseId" | head -1)"
            [[ -n "$monitor_id" ]] && break
            sleep 3
          done
          if [[ -z "$monitor_id" ]]; then
            echo "::error::CALIBRATION_POSTDEPLOY_NO_CORRELATED_MONITOR_RUN"
            exit 1
          fi
          gh run watch "$monitor_id" --repo "$GITHUB_REPOSITORY" \
            --exit-status --interval 15
          echo "CALIBRATION_POSTDEPLOY_VERIFIED monitor_run=$monitor_id"
\\t' read -r previous_id candidate_sha; do
            [[ -n "$previous_id" ]] || continue
            deployed_job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_id/jobs?per_page=100" \\
              --jq '.jobs[] | select(.name == "deploy" and .conclusion == "success") | .id' | head -1)"
            if [[ -n "$deployed_job" ]]; then
              previous_sha="$candidate_sha"
              break
            fi
          done < <(jq -r --argjson current "$SOURCE_RUN_ID" \\
            '.workflow_runs[] | select(.id < $current) | [.id, .head_sha] | @tsv' <<< "$candidates")
          if [[ -n "$previous_sha" ]]; then
            if ! changed="$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous_sha...$DEPLOYED_SHA" \\
              --jq '.files[].filename')"; then
              echo "::warning::Cannot compare prior verified deploy; run calibration readback conservatively"
              changed="api/function_app.py"
            fi
          else
            echo "::warning::No previous successful deploy found; run calibration readback conservatively"
            changed="api/function_app.py"
          fi
          if ! grep -Eq '^(api/function_app\.py|api/tbt/services/(admin_storage|model_calibration_status)\.py|scripts/publish_model_calibration_status\.py|\.github/workflows/(model-calibration-monitor|post-deploy-calibration-sync)\.yml)$' <<< "$changed"; then
            echo 'CALIBRATION_POSTDEPLOY_NO_RELEVANT_CHANGES'
            exit 0
          fi
          # The signed private worker will independently verify the CDB, model
          # pair, immutable release, CAS storage write and authenticated readback.
          correlation="postdeploy-${DEPLOYED_SHA:0:12}-${GITHUB_RUN_ID}"
          gh workflow run model-calibration-monitor.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f "request_id=$correlation"
          # Dispatch acknowledgment is NOT the result. Wait for the exact
          # correlated, private monitor run and require a successful readback.
          monitor_id=""
          for attempt in {1..20}; do
            monitor_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow model-calibration-monitor.yml --branch main \
              --event workflow_dispatch --limit 40 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"Model Lab tests $correlation\") | .databaseId" | head -1)"
            [[ -n "$monitor_id" ]] && break
            sleep 3
          done
          if [[ -z "$monitor_id" ]]; then
            echo "::error::CALIBRATION_POSTDEPLOY_NO_CORRELATED_MONITOR_RUN"
            exit 1
          fi
          gh run watch "$monitor_id" --repo "$GITHUB_REPOSITORY" \
            --exit-status --interval 15
          echo "CALIBRATION_POSTDEPLOY_VERIFIED monitor_run=$monitor_id"
