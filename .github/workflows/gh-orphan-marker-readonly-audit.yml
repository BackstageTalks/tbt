name: One-shot read-only GitHub orphan marker audit

on:
  push:
    branches: [maintenance/gh-cleanup-20261101-30d]
    paths: [.github/workflows/gh-orphan-marker-readonly-audit.yml]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Audit exact references in current main (read only)
        shell: bash
        run: |
          python3 - <<'PY'
          import collections,json,pathlib,re,subprocess
          root=pathlib.Path(".")
          tracked=subprocess.check_output(["git","ls-files","-z"]).decode().split("\0")
          tracked=[p for p in tracked if p]
          markers=[p for p in tracked if p.startswith(".github/") and "/workflows/" not in p and p!=".github/WORKFLOW_LIFECYCLE.md"]
          candidate=[]
          for marker in markers:
              basename=marker.split("/")[-1]
              refs=[]
              for p in tracked:
                  if p==marker:continue
                  # Static refs only. Never treat this audit as proof of no external references.
                  path=root/p
                  try:
                      if path.stat().st_size>750_000:continue
                      data=path.read_text("utf-8")
                  except (OSError,UnicodeError):continue
                  if basename in data or marker in data:
                      refs.append(p)
              category="possible_orphan" if not refs else "referenced"
              if "tick" in basename or "hourly" in basename:
                  category="active_or_external_tick_possible"
              if basename.startswith(("cdb","wta","atp","tennis","data","training","shadow","elo","research","kaggle","tml","usopen","wimbledon","wikidata","livetennis","uploaded","txe")):
                  category="protected_cdb_or_provider_request"
              candidate.append({"path":marker,"category":category,"reference_count":len(refs),"references":refs[:30]})
          summary=dict(collections.Counter(x["category"] for x in candidate))
          out={"schema":1,"source_head":subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip(),
               "tracked":len(tracked),"marker_count":len(markers),"summary":summary,"entries":candidate}
          pathlib.Path("gh-orphan-marker-audit.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("AUDIT "+json.dumps({"source_head":out["source_head"],"summary":summary,"candidate_names":[x["path"] for x in candidate if x["category"]=="possible_orphan"]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gh-orphan-marker-readonly-audit
          path: gh-orphan-marker-audit.json
          if-no-files-found: error
          retention-days: 30
