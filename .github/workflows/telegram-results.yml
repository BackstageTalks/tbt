name: BlinQ Telegram ELITE verified results after last pick
# Triggered by the existing 30-minute match-status worker, no new cron.
on:
  repository_dispatch:
    types: [telegram-results-tick]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blinq-telegram-ledger
  cancel-in-progress: false
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout private Telegram delivery ledger (not CDB)
        uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: telegram-bot-state
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: .private-telegram
          sparse-checkout: ops
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Verify private ledger is present
        run: |
          set -euo pipefail
          test -s .private-telegram/ops/telegram-bot-state.json
      - name: Build report only when ALL issued picks have verified results
        env:
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
          BLINQ_PRODUCTION_URL: ${{ vars.TBT_PRODUCTION_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          TGCH_ELITE: ${{ secrets.TGCH_ELITE }}
        run: |
          set -euo pipefail
          test -n "$BLINQ_LIVE_WORKER_TOKEN" || { echo "::error::BLINQ_LIVE_WORKER_TOKEN missing"; exit 1; }
          test -n "$TGCH_ELITE" || { echo "::error::TGCH_ELITE must be configured before any result reservation"; exit 1; }
          args=()
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then args+=(--external-tick); fi
          python scripts/telegram_daily_results.py prepare --api-url "$BLINQ_PRODUCTION_URL" --config-url "$BLINQ_PRODUCTION_URL/api/v1/ui-config" --state .private-telegram/ops/telegram-bot-state.json "${args[@]}"
      - name: Reserve results before Telegram requests
        id: reserve
        run: |
          set -euo pipefail
          if [ ! -f /tmp/blinq-telegram/ready ]; then echo "ready=false" >>"$GITHUB_OUTPUT"; exit 0; fi
          cp /tmp/blinq-telegram/state.json .private-telegram/ops/telegram-bot-state.json
          git -C .private-telegram config user.name "github-actions[bot]"
          git -C .private-telegram config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Reserve Telegram results [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected=$(git -C .private-telegram rev-parse HEAD)
          actual=$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')
          test "$expected" = "$actual" || { echo "::error::Results reservation read-back failed"; exit 1; }
          echo "ready=true" >>"$GITHUB_OUTPUT"
      - name: Send verified ELITE results (no FREE/premium fallback)
        if: steps.reserve.outputs.ready == 'true'
        env:
          TGB: ${{ secrets.TGB }}
          TGCH: ${{ secrets.TGCH }}
          TGCH_ELITE: ${{ secrets.TGCH_ELITE }}
        run: |
          python scripts/telegram_offer_publisher.py send
      - name: Confirm Telegram results receipts
        if: steps.reserve.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python scripts/telegram_offer_publisher.py mark-sent
          cp /tmp/blinq-telegram/state.json .private-telegram/ops/telegram-bot-state.json
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Confirm Telegram results [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected=$(git -C .private-telegram rev-parse HEAD)
          actual=$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')
          test "$expected" = "$actual" || { echo "::error::Results receipt read-back failed"; exit 1; }
