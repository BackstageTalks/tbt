name: Stage independent native-ID Serve Return BP CDB (READ ONLY)

on:
  pull_request:
    paths:
      - 'scripts/recover_cdb_sackmann_breakpoints.py'
      - 'tests/test_recover_cdb_sackmann_breakpoints.py'
      - '.github/workflows/audit-cdb-native-bp-fallback.yml'

permissions:
  contents: read

jobs:
  audited-native-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies, verify private CDB token and test both original and optional native fallback
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view BackstageTalks/tbt-data --json visibility -q .visibility)" = PRIVATE
          python -m pip install -q -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_recover_cdb_sackmann_breakpoints.py tests/test_cdb_global_writer_lock.py
      - uses: actions/checkout@v4
        with:
          repository: Aneeshers/tennis-sackmann-archive
          ref: 83733587353df8a41f2fd4f516147d5aa83f5a8d
          path: source
          persist-credentials: false
      - name: Pin original source commit and verify raw files
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "83733587353df8a41f2fd4f516147d5aa83f5a8d"
          test -s source/atp/atp_matches_2020.csv
      - name: Download coherent verified current canonical CDB
        run: |
          set -euo pipefail
          python scripts/download_stable_cdb.py --repository BackstageTalks/tbt-data --out .cache/native-bp/current --report .cache/native-bp/snapshot.json
      - name: Stage exact native-ID, full-metadata NULL-only BP candidates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recover_cdb_sackmann_breakpoints.py --mode stage --native-fallback --history-dir .cache/native-bp/current --source-dir source --out-dir .cache/native-bp/stage
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path(".cache/native-bp")
          s=json.loads((base/"snapshot.json").read_text())
          report=json.loads((base/"stage/report.json").read_text())
          counts=report["counts"]
          assert s["status"]=="verified" and report["production_mutated"] is False
          assert counts["matching_cdb_id"] > 400000
          assert counts["staged_matches"] <= counts["matching_cdb_id"]
          assert counts["new_stat_values"]<=2*counts["staged_matches"]
          assert len({x["match_id"] for line in (base/"stage/stage.jsonl").read_text().splitlines() if (x:=json.loads(line))})==counts["staged_matches"]
          print("NATIVE_BP_STRICT_METADATA_CANDIDATES",json.dumps({"manifest_sha":s["manifest_sha256"],"counts":counts,"changed_years":report["changed_years"],"writes":0},sort_keys=True),flush=True)
          PY
      - name: Publish aggregate audit only
        uses: actions/upload-artifact@v4
        with:
          name: native-bp-independent-proof-counts
          path: .cache/native-bp/stage/report.json
          retention-days: 20
