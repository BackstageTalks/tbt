name: Telegram ELITE simulated results layout smoke test
on:
  push:
    branches: [main]
    paths:
      - '.github/telegram-elite-results-preview-tick.json'
      - '.github/telegram-elite-results-preview-testchannel-tick.json'
permissions:
  contents: read
concurrency:
  group: blinq-telegram-ledger
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: telegram-bot-state
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: .private-telegram
          sparse-checkout: ops
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Verify already-configured isolated TG test channel and build synthetic preview
        shell: bash
        env:
          TGB: ${{ secrets.TGB }}
          TGCH: ${{ secrets.TGCH }}
          TGCH_ELITE: ${{ secrets.TGCH }}  # synthetic preview only; production ELITE workflow still requires TGCH_ELITE
        run: |
          set -euo pipefail
          test -n "$TGB" && test -n "$TGCH" && test -n "$TGCH_ELITE" || {
            echo "::error::TGB and existing TGCH test channel required for this synthetic-only preview"
            exit 1
          }
          python scripts/telegram_elite_results_preview.py
          test -s /tmp/blinq-telegram/messages.json
          test -s .private-telegram/ops/telegram-bot-state.json
      - name: Reserve once in private preview ledger
        id: reserve
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path(".private-telegram/ops/telegram-bot-state.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          tests=d.setdefault("badge_tests",{})
          key="2026-10-31:elite-results-simulated-layout-v1"
          messages=Path("/tmp/blinq-telegram/messages.json").read_bytes()
          data=json.loads(messages)
          if len(data)!=1 or data[0].get("audience")!="elite" or "🧪 TEST" not in data[0].get("text",""):
              raise SystemExit("Simulated-only ELITE test contract failed")
          ready=key not in tests
          if ready:
              tests[key]={"status":"reserved","kind":"simulated-results","sha256":hashlib.sha256(messages).hexdigest()}
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("ready="+("true" if ready else "false")+"\n")
          PY
          if [[ "$(grep -c '^ready=true$' "$GITHUB_OUTPUT")" -eq 0 ]]; then exit 0; fi
          git -C .private-telegram config user.name "github-actions[bot]"
          git -C .private-telegram config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Reserve one-off ELITE synthetic result layout preview [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual"
      - name: Send one synthetic results sample to existing isolated TGCH test channel
        if: steps.reserve.outputs.ready == 'true'
        env:
          TGB: ${{ secrets.TGB }}
          TGCH: ${{ secrets.TGCH }}
          TGCH_ELITE: ${{ secrets.TGCH }}  # synthetic preview only; production ELITE workflow still requires TGCH_ELITE
        run: |
          set -euo pipefail
          python scripts/telegram_offer_publisher.py send
          test -s /tmp/blinq-telegram/receipt.json
      - name: Confirm message ID and independently read back ledger
        if: steps.reserve.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path(".private-telegram/ops/telegram-bot-state.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          key="2026-10-31:elite-results-simulated-layout-v1"
          test=d.get("badge_tests",{}).get(key,{})
          receipts=json.loads(Path("/tmp/blinq-telegram/receipt.json").read_text(encoding="utf-8"))
          payload=Path("/tmp/blinq-telegram/messages.json").read_bytes()
          if test.get("status")!="reserved" or test.get("sha256")!=hashlib.sha256(payload).hexdigest():
              raise SystemExit("ELITE synthetic reservation mismatch")
          if len(receipts)!=1 or not isinstance(receipts[0],int) or receipts[0]<=0:
              raise SystemExit("Telegram message ID was not confirmed")
          test.update(status="sent",message_id=receipts[0])
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("ELITE synthetic Telegram accepted message_id="+str(receipts[0]))
          PY
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Confirm ELITE synthetic Telegram test receipt [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual"
