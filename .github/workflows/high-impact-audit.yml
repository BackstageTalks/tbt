name: BlinQ read-only high-impact audit
on:
  push:
    branches: [main]
    paths: ['.github/high-impact-audit-request']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blinq-high-impact-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: python -m pip install -r api/requirements-train.txt pytest
      - run: python -m pytest tests/test_high_impact_audit.py -q
      - name: Read production history and champion; no provider credentials supplied
        run: python scripts/audit_high_impact.py --data-repository "$TBT_DATA_REPOSITORY"
      - name: Audit real issued market results
        run: python scripts/audit_market_reliability.py --data-repository "$TBT_DATA_REPOSITORY" --window-days 365
      - name: Persist private aggregate evidence
        if: success()
        run: |
          python - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          repo = os.environ['TBT_DATA_REPOSITORY']
          for source, target in [('.cache/tbt/high-impact/report.json', 'audit/high-impact-latest.json'), ('.cache/tbt/market-quality/audit.json', 'audit/market-quality-latest.json')]:
              lookup = subprocess.run(['gh','api',f'repos/{repo}/contents/{target}'], capture_output=True, text=True)
              body = {'message': 'Read-only BlinQ high-impact audit evidence', 'content': base64.b64encode(Path(source).read_bytes()).decode()}
              if lookup.returncode == 0:
                  body['sha'] = json.loads(lookup.stdout)['sha']
              elif '404' not in lookup.stderr:
                  raise RuntimeError('Cannot safely inspect audit target')
              payload = Path('/tmp/blinq-audit-request.json')
              payload.write_text(json.dumps(body))
              subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{target}','--input',str(payload)],check=True,stdout=subprocess.DEVNULL)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinq-high-impact-${{ github.run_id }}
          path: |
            .cache/tbt/high-impact/report.json
            .cache/tbt/market-quality/audit.json
            .cache/tbt/market-quality/audit.md
          if-no-files-found: warn
