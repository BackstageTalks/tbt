name: One-shot frozen 7.2.1 prospective error segments

# Research-only one-shot after merging this workflow; no schedules and no APIs.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-frozen-721-segments.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-frozen-721-prospective-error-segments-readonly
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'BackstageTalks/tbt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      BLINQ_RAPIDAPI_MAX_RPS: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Verify read-only scoped private source
        shell: bash
        run: |
          set -euo pipefail
          test "$TBT_DATA_REPOSITORY" = BackstageTalks/tbt-data
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = PRIVATE
          test -z "${RAPIDAPI_KEY:-}"
          test -z "${PROPLINE_API_KEY:-}"
      - name: Install offline test and research runtime
        run: python -m pip install -r api/requirements-train.txt pytest
      - name: Reject biased or leaked cohort selection
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_audit_frozen_721_segments.py tests/test_frozen_721_research.py tests/test_settle_frozen_721_shadow.py
      - name: Score only genuine paired pre-match 7.2.1 results
        run: |
          set -euo pipefail
          python scripts/audit_frozen_721_segments.py \
            --data-repository "$TBT_DATA_REPOSITORY" \
            --out .cache/tbt/frozen-721-prospective-segments.json
          python - <<'PY'
          from pathlib import Path
          import json
          x = json.loads(Path('.cache/tbt/frozen-721-prospective-segments.json').read_text())
          assert x["production_mutated"] is False and x["provider_requests"] == 0
          assert x["historical_4544_rescoring_used"] is False
          assert x["calibrator_fit_performed"] is False
          assert x["automatic_model_selection"] is False
          assert x["automatic_promotion"] is False
          assert x["settled_total"] == x["eligible_settled"] + x["quarantined_capture_less_than_15m_before_start"]
          print(
              "FROZEN_721_SEGMENTS_VERIFIED",
              "total_settled", x["settled_total"],
              "eligible", x["eligible_settled"],
              "excluded_near_start", x["quarantined_capture_less_than_15m_before_start"],
              "champion_correct", x["overall"]["champion"]["correct"],
              "candidate_correct", x["overall"]["candidate_721"]["correct"],
              "by_tour", {k: v["n"] for k, v in x["by_tour"].items()}
          )
          PY
      - name: Upload aggregate research-only segments for Codex
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-721-prospective-error-segments-${{ github.run_id }}
          path: .cache/tbt/frozen-721-prospective-segments.json
          if-no-files-found: warn
          retention-days: 14
