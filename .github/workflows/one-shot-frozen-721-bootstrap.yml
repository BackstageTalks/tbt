name: One-shot frozen 7.2.1 zero-API prospective shadow bootstrap

# The sole main-branch push touching this new workflow starts the independent
# bootstrap once. Never request another paid tennis/provider refresh.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-frozen-721-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-frozen-721-one-shot-offline-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'BackstageTalks/tbt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      PYTHONPATH: api:scripts
      BLINQ_RAPIDAPI_MAX_RPS: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Verify private inputs and zero-provider research scope
        shell: bash
        run: |
          set -euo pipefail
          test "$TBT_DATA_REPOSITORY" = BackstageTalks/tbt-data
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility --jq '.visibility')" = PRIVATE
          test -z "${RAPIDAPI_KEY:-}"
          test -z "${PROPLINE_API_KEY:-}"
      - name: Install offline inference/test runtime
        run: python -m pip install -r api/requirements-train.txt pytest
      - name: Verify pre-match capture and leakage guards
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_bootstrap_frozen_721_shadow.py tests/test_frozen_721_research.py tests/test_frozen_721_shadow_capture.py
      - name: Bootstrap exact frozen candidate from already-issued future fixtures only
        run: |
          set -euo pipefail
          python scripts/bootstrap_frozen_721_shadow.py \
            --data-repository "$TBT_DATA_REPOSITORY" \
            --output .cache/tbt/frozen-721-offline-bootstrap-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('.cache/tbt/frozen-721-offline-bootstrap-status.json').read_text())
          assert report['provider_requests'] == 0 if 'provider_requests' in report else report['incremental_provider_requests'] == 0
          assert report.get('production_mutated') is not True
          if report.get('status') not in {
              'SKIPPED_EXISTING_PRIVATE_SHADOW',
              'NO_ELIGIBLE_ISSUED_FUTURE_FIXTURES',
          }:
              assert report.get('remote_readback') == 'VERIFIED'
              assert report.get('captured',0) >= 1
              assert report.get('candidate_version') == 'v7.2.1-v201-20261020T061347180376Z'
          print('Offline 7.2.1 first-snapshot report status:', report['status'])
          PY
      - name: Persist non-sensitive read-back status and explain evidence limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-frozen-721-offline-bootstrap-${{ github.run_id }}
          path: .cache/tbt/frozen-721-offline-bootstrap-status.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail-closed global lock release only when owned by this exact run
        if: always()
        run: |
          python scripts/cdb_global_writer_lock.py release \
            --state-file .cache/tbt/frozen-721-offline-bootstrap/research-global-lock.json \
            --if-held
