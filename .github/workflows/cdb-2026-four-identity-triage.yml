name: CDB 2026 four original identities — private native-source triage (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/cdb_2026_four_identity_triage.py'
      - 'tests/test_cdb_2026_four_identity_triage.py'
      - 'scripts/restore_cdb_2026_four_native_id.py'
      - 'tests/test_restore_cdb_2026_four_native_id.py'
      - '.github/workflows/cdb-2026-four-identity-triage.yml'
permissions:
  contents: read
concurrency:
  group: cdb-2026-four-identity-readonly-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  native-forensics:
    if: >-
      github.event.pull_request.head.repo.full_name == 'BackstageTalks/tbt' &&
      github.head_ref == 'fix/cdb-2026-four-native-identities-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify read-only permissions and private canonical source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/BackstageTalks/tbt-data --jq .private)" = true
      - name: Install existing original CDB reader dependencies
        run: python -m pip install --quiet -r api/requirements-train.txt pytest
      - name: Synthetic fail-closed identity checks; no writer
        run: |
          python -m py_compile scripts/cdb_2026_four_identity_triage.py scripts/restore_cdb_2026_four_native_id.py
          python -m pytest -q tests/test_cdb_2026_four_identity_triage.py tests/test_restore_cdb_2026_four_native_id.py
      - name: Pinned native-provider and original-vs-live four-case readback
        run: |
          set -euo pipefail
          python scripts/cdb_2026_four_identity_triage.py --out ".cache/tbt/four-ids-$GITHUB_RUN_ID"
      - name: Fail-closed 1-real-WTA-match candidate DRY-RUN (no CDB writer)
        run: |
          set -euo pipefail
          python scripts/restore_cdb_2026_four_native_id.py --mode dry-run --out ".cache/tbt/one-match-dry-$GITHUB_RUN_ID"
      - name: Preserve public event metadata only; exclude all private raw IDs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cdb-four-case-native-evidence-${{ github.run_id }}
          path: |
            .cache/tbt/four-ids-*/triage.json
            .cache/tbt/one-match-dry-*/report.json
          retention-days: 14
          if-no-files-found: warn
