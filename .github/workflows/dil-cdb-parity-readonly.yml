name: DIL CDB parity snapshot (read-only)

on:
  pull_request:
    paths:
      - '.github/workflows/dil-cdb-parity-readonly.yml'
      - 'scripts/dil_cdb_parity_readonly.py'

permissions:
  contents: read

jobs:
  parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install readers
        run: python -m pip install 'pyarrow>=17,<22' 'zstandard>=0.23,<1'
      - name: Export pinned CDB audit and match-level comparison index
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Private repository access missing"; exit 1; }
          python scripts/dil_cdb_parity_readonly.py --repo "$TBT_DATA_REPOSITORY" --out .cache/parity
      - name: Ephemeral output
        uses: actions/upload-artifact@v4
        with:
          name: blinq-dil-cdb-parity-20261024
          path: |
            .cache/parity/cdb_dil_parity_cdb_report.json
            .cache/parity/cdb_matchlevel_compare.sqlite.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
