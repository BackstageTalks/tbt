name: Read-only current CDB parity export for DIL

on:
  pull_request:
    paths:
      - 'scripts/cdb_dil_readonly_export.py'
      - '.github/workflows/dil-cdb-parity-readonly.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parquet and zstd
        run: python -m pip install 'pyarrow>=17,<22' 'zstandard>=0.23,<1'
      - name: Export canonical CDB from verified immutable private release
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python scripts/cdb_dil_readonly_export.py --repository BackstageTalks/tbt-data --out-dir .cache/dil-cdb-parity
      - name: Private temporary audit artifact, no canonical write
        uses: actions/upload-artifact@v4
        with:
          name: cdb-current-readonly-parity-20261024
          path: |
            .cache/dil-cdb-parity/current_cdb_compare.sqlite.zst
            .cache/dil-cdb-parity/cdb_compare_receipt.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
