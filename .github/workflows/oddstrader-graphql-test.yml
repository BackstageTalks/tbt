name: Test OddsTrader GraphQL
on:
  push:
    branches: [research/oddstrader-probe-20260901]
    paths: [".github/workflows/oddstrader-graphql-test.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          page="https://www.oddstrader.com/atp/?date=20260901&g=match&m=winner"
          req=urllib.request.Request(page,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30) as h: s=h.read().decode("utf-8","replace")
          cm="window.__config = "
          ci=s.index(cm)+len(cm)
          cfg,_=json.JSONDecoder().raw_decode(s[ci:])
          print("CONFIG_SERVICES",json.dumps(cfg.get("services"),indent=2))
          bases=[
            "https://ms.virginia.us-east-1.oddstrader.com/odds-v2/odds-v2-service",
            "https://ms.virginia.us-east-1.oddstrader.com/odds-v2/odds-v2-service/odds-v2-service",
            "https://www.oddstrader.com/odds-v2/odds-v2-service",
          ]
          query="{ openingLines(eid:[4808893],mtid:[126]) currentLines(eid:[4808893],mtid:[126]) }"
          for base in bases:
              url=base+"?"+urllib.parse.urlencode({"query":query})
              rq=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(rq,timeout=30) as h:
                      body=h.read().decode("utf-8","replace")
                      print("\nBASE",base,"STATUS",h.status,"CTYPE",h.headers.get("content-type"))
                      print(body[:12000])
              except Exception as e:
                  print("\nBASE",base,"ERROR",repr(e))
          PY
