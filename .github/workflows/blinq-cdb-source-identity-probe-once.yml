name: BlinQ CDB 2025 native provider ID and NULL opportunity probe (one shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/cdb-source-identity-probe-2025-request.json'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  readonly-cdb-identity-gap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      EXPECTED_2025_SHA: 3a929b356803af6b0f704d4d3066a053ecf995124ec8f4228487c54c0f534c58
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed if private identity or current CDB SHA differs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          expected="sha256:${EXPECTED_2025_SHA}"
          observed="$(gh api repos/$PRIVATE_REPO/releases/tags/tbt-data-v1 --jq '.assets[] | select(.name == "history-2025.parquet") | .digest')"
          test "$observed" = "$expected"
          mkdir -p work/private-cdb
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -p 'history-2025.parquet' -D work/private-cdb >/dev/null
          echo "${EXPECTED_2025_SHA}  work/private-cdb/history-2025.parquet" | sha256sum -c
      - name: Test fail-closed research-only guard and install Parquet reader
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/research -p test_audit_cdb_provider_namespace_2025.py -v
          python -m pip install --disable-pip-version-check --quiet 'pyarrow>=16,<23'
      - name: Inspect only 2025 CDB metadata and truly NULL ace/DF cells
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research/audit_cdb_provider_namespace_2025.py \
            --history work/private-cdb/history-2025.parquet \
            --expected-sha256 "$EXPECTED_2025_SHA" \
            --out work/private-report/cdb-provider-identity-2025.json
          python - <<'PY'
          import json
          p='work/private-report/cdb-provider-identity-2025.json'
          v=json.load(open(p))
          assert v['cdb_writes']==0 and v['new_cdb_fields_authorized']==0
          assert v['no_source_name_or_score_join'] is True
          assert v['canonical_2025_sha256']=='3a929b356803af6b0f704d4d3066a053ecf995124ec8f4228487c54c0f534c58'
          PY
      - name: Write read-only receipt to private Release and independently recheck bytes
        shell: bash
        run: |
          set -euo pipefail
          tag="blinq-cdb2025-sourceid-null-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          (cd work/private-report && sha256sum cdb-provider-identity-2025.json > SHA256SUMS)
          gh release create "$tag" -R "$PRIVATE_REPO" --target main --title 'Private CDB 2025 read-only provider identity / NULL cells diagnostic' --notes 'CDB source namespace and NULL gap only. No upstream event and both players ID proof, no source rights asserted, no CDB or model changes.' >/dev/null
          gh release upload "$tag" work/private-report/cdb-provider-identity-2025.json work/private-report/SHA256SUMS -R "$PRIVATE_REPO" >/dev/null
          mkdir -p work/readback
          gh release download "$tag" -R "$PRIVATE_REPO" -D work/readback >/dev/null
          (cd work/readback && sha256sum -c SHA256SUMS)
          cmp work/private-report/cdb-provider-identity-2025.json work/readback/cdb-provider-identity-2025.json
          echo "BLINQ_CDB2025_METADATA_ONLY_READBACK_PASS=$tag"
