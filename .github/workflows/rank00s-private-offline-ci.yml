name: BlinQ rank00s private source offline QA on public runner
'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-source-contract:
    # Never execute a ref controlled by an unreviewed PR while a private token is available.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATE_REPO: BackstageTalks/tbt-data
      SOURCE_COMMIT: c9a1b4df15bc87c955418d86467368339f47c8c7
    steps:
      - name: Checkout only public safety-contract tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline bridge never mutates private data
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -q -s tests -p 'test_rank00s_private_offline_ci_contract.py'
      - name: Authenticated pin-only read of two private Python files
        env:
          # Scope the private read token to this single step; never job-wide.
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'BLOCKED_MISSING_PRIVATE_READ_TOKEN'; exit 1; }
          mkdir -p private/scripts private/tests
          gh api "repos/$PRIVATE_REPO/contents/scripts/preflight_rank00s_cdb.py?ref=$SOURCE_COMMIT" --jq .content | base64 --decode >private/scripts/preflight_rank00s_cdb.py
          gh api "repos/$PRIVATE_REPO/contents/tests/test_preflight_rank00s_cdb.py?ref=$SOURCE_COMMIT" --jq .content | base64 --decode >private/tests/test_preflight_rank00s_cdb.py
          test "$(git hash-object private/scripts/preflight_rank00s_cdb.py)" = "2553a906fcd4ab74dafcd9995888d71da92e8233"
          test "$(git hash-object private/tests/test_preflight_rank00s_cdb.py)" = "508e54a39d0848c4b247d4d53503b66019c885d0"
          echo 'PRIVATE_SCRIPT_TEST_BLOB_SHA_VERIFIED'
      - name: Compile and execute private synthetic QA offline without secrets
        shell: bash
        env:
          GH_TOKEN: ''
        run: |
          set -euo pipefail
          python -m py_compile private/scripts/preflight_rank00s_cdb.py private/tests/test_preflight_rank00s_cdb.py
          # Never print private source rows, source code, traceback or logs in public job.
          if python -m unittest discover -q -s private/tests -p 'test_preflight_rank00s_cdb.py' >/tmp/private-offline-test.log 2>&1; then
            echo 'PINNED_RANK00S_21_SYNTHETIC_TESTS_PASSED'
          else
            echo 'PRIVATE_OFFLINE_QA_FAILED_DETAILS_REDACTED'
            exit 1
          fi
