name: Audit per-pair canonical Serve Return NULL completion

on:
  pull_request:
    paths:
      - 'scripts/recover_cdb_opponent_service_rates.py'
      - 'tests/test_recover_cdb_opponent_service_rates.py'
      - '.github/workflows/cdb-service-pairwise-preflight.yml'

permissions:
  contents: read

concurrency:
  group: cdb-serve-return-pairwise-${{ github.sha }}
  cancel-in-progress: false

jobs:
  current-cdb-pairwise:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts:.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test strict original and pairwise isolated additive writer
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view BackstageTalks/tbt-data --json visibility -q .visibility)" = PRIVATE
          python -m pip install --quiet -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_recover_cdb_opponent_service_rates.py tests/test_cdb_global_writer_lock.py
      - name: Download current SHA-verified canonical CDB
        run: |
          python scripts/download_stable_cdb.py --repository BackstageTalks/tbt-data --out .cache/cdb-pairwise/history --report .cache/cdb-pairwise/snapshot.json
      - name: Produce strictly read-only pairwise stage and audit counts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recover_cdb_opponent_service_rates.py --mode stage --pairwise --history-dir .cache/cdb-pairwise/history --out-dir .cache/cdb-pairwise/stage
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".cache/cdb-pairwise")
          snapshot=json.loads((root/"snapshot.json").read_text())
          report=json.loads((root/"stage/report.json").read_text())
          assert snapshot["status"]=="verified"
          assert report["production_mutated"] is False
          assert report["counts"]["examined"] >= 995610
          assert report["counts"].get("new_stat_values",0) >= report["counts"].get("staged_matches",0)
          assert report["changed_years"] == sorted(set(report["changed_years"]))
          print("PAIRWISE_CURRENT_CDB_CANDIDATES",json.dumps({"manifest_sha256":snapshot["manifest_sha256"],"counts":report["counts"],"years":report["changed_years"],"new_writes":0},sort_keys=True))
          PY
      - name: Publish counts only; never stage match IDs to external artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdb-pairwise-counts-only
          path: .cache/cdb-pairwise/stage/report.json
          retention-days: 30
