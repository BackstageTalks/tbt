name: BlinQ private paired sports TOP quote replay

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Exact preverified private frozen candidate release
        required: true
        type: string
  push:
    # One exact internal research execution before public review. No main trigger.
    branches: [research/721-paired-top-selection-20261116]
    paths: [.github/workflows/blinq-private-paired-top-replay.yml]

permissions:
  contents: read

concurrency:
  group: blinq-private-paired-top-quote-replay
  cancel-in-progress: false

jobs:
  replay:
    if: >-
      github.repository == 'BackstageTalks/tbt' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.ref == 'refs/heads/research/721-paired-top-selection-20261116' &&
        startsWith(github.event.head_commit.message, 'research(721): read-only paired TOP quote replay')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: api:scripts
      BLINQ_RAPIDAPI_MAX_RPS: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install read-only evaluation dependencies
        run: python -m pip install -r api/requirements-train.txt pytest
      - name: Validate isolated quote matcher against orientation and PIT regressions
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_paired_top_selection.py tests/test_paired_top_quote_linkage.py
      - name: Independently download exact private score and source bundles
        shell: bash
        env:
          USER_CANDIDATE_TAG: "${{ inputs.candidate_tag }}"
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="blinq-candidate-frozen-43872914492-1"
          else
            tag="$USER_CANDIDATE_TAG"
          fi
          [[ "$tag" =~ ^blinq-candidate-frozen-[0-9]+-[0-9]+$ ]] || exit 2
          python scripts/prepare_paired_top_quotes.py \
            --candidate-tag "$tag" \
            --work-dir .cache/tbt/paired-top-quote-research \
            --out .cache/tbt/paired-top-quote-research-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('.cache/tbt/paired-top-quote-research-report.json').read_text())
          assert report["status"] == "RESEARCH_ONLY_PREVIOUSLY_INSPECTED_HOLDOUT"
          assert report["production_swapped"] is False
          assert report["api_requests"] == 0
          assert report["quote_linkage"]["outcomes_used_for_quote_join"] is False
          assert report["replay"]["status"] == "RESEARCH_REPLAY_NOT_NATIVE_ISSUED_TOP"
          print('Exact private score/quote readback + aggregate-only replay verified')
          PY
      - name: Publish aggregate only - no raw scorer or price files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blinq-paired-top-quote-replay-${{ github.run_id }}
          path: .cache/tbt/paired-top-quote-research-report.json
          if-no-files-found: warn
          retention-days: 30

  archive-contract:
    # One-shot, read-only preflight: discover the actual private asset schema
    # before attempting a claimed same-fixture, price-qualified TOP replay.
    if: >-
      github.repository == 'BackstageTalks/tbt' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/research/721-paired-top-selection-20261116' &&
      startsWith(github.event.head_commit.message, 'research(721): inspect quote source contract')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
      BLINQ_RAPIDAPI_MAX_RPS: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read back private historic quote archives without revealing records
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          from release_store import ReleaseStore
          names=('selection_candidates_2026-10.json.gz','selection_candidates_2026-11.json.gz')
          work=Path('.cache/tbt/top-quote-contract')
          store=ReleaseStore('BackstageTalks/tbt-data','tbt-predictions-v1',work)
          store.download(required_names=names,require_bundle_manifest=True)
          evidence={}
          for name in names:
              with gzip.open(work/name,'rt',encoding='utf-8') as f:
                  obj=json.load(f)
              head=obj.get('snapshots') if isinstance(obj,dict) else None
              first=head[0] if isinstance(head,list) and head else None
              rows=first.get('rows') if isinstance(first,dict) else None
              row=rows[0] if isinstance(rows,list) and rows and isinstance(rows[0],dict) else None
              evidence[name]={
                  'root_type':type(obj).__name__,
                  'root_keys':sorted(obj)[:40] if isinstance(obj,dict) else None,
                  'schema':obj.get('schema') if isinstance(obj,dict) else None,
                  'snapshot_count':len(head) if isinstance(head,list) else None,
                  'snapshot_keys':sorted(first)[:45] if isinstance(first,dict) else None,
                  'snapshot_rows_type':type(rows).__name__,
                  'first_snapshot_row_count':len(rows) if isinstance(rows,list) else None,
                  'row_keys':sorted(row)[:60] if row else None,
                  'player1_type':type(row.get('player1')).__name__ if row else None,
                  'player1_keys':sorted(row['player1'])[:30] if row and isinstance(row.get('player1'),dict) else None,
                  'two_way_market_type':type(row.get('two_way_market')).__name__ if row else None,
                  'two_way_market_keys':sorted(row['two_way_market'])[:30] if row and isinstance(row.get('two_way_market'),dict) else None
              }
          print(json.dumps(evidence,indent=2,ensure_ascii=False))
          PY
