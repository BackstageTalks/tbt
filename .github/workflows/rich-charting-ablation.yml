name: BlinQ rich charting ablation

on:
  push:
    branches: [main]
    paths:
      - ".github/rich-charting-ablation-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-rich-charting-ablation-parallel
  cancel-in-progress: false

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        year: [2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install training dependencies
        run: python -m pip install -r api/requirements-train.txt

      - name: Validate controlled request
        run: |
          set -euo pipefail
          test "$(jq -r '.mode // ""' .github/rich-charting-ablation-request.json)" = "rich-ablation"
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }

      - name: Download canonical production history
        run: python scripts/download_production_preflight_inputs.py

      - name: Run paired rich ON vs OFF fold
        run: |
          set -euo pipefail
          python scripts/ablate_rich_charting.py             --history-dir .cache/tbt/history             --out ".cache/tbt/rich-ablation-${{ matrix.year }}.json"             --year "${{ matrix.year }}"
          test -s ".cache/tbt/rich-ablation-${{ matrix.year }}.json"

      - name: Upload fold evidence
        uses: actions/upload-artifact@v4
        with:
          name: blinq-rich-ablation-${{ matrix.year }}-${{ github.run_id }}
          path: .cache/tbt/rich-ablation-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      ABLATION_RUN_ID: ${{ github.run_id }}
      ABLATION_RUN_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install aggregation dependency
        run: python -m pip install scipy

      - name: Download fold evidence
        uses: actions/download-artifact@v4
        with:
          pattern: blinq-rich-ablation-*-${{ github.run_id }}
          path: .cache/tbt/rich-ablation-folds
          merge-multiple: true

      - name: Aggregate paired ablation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from scipy.stats import binomtest

          root = Path(".cache/tbt/rich-ablation-folds")
          reports = [json.loads(p.read_text(encoding="utf-8")) for p in sorted(root.glob("*.json"))]
          if len(reports) != 4:
              raise SystemExit(f"Expected 4 fold reports, got {len(reports)}")
          folds = [r["folds"][0] for r in reports]
          folds.sort(key=lambda f: int(f["year"]))

          metric_keys = ("accuracy", "log_loss", "brier_score")
          total_n = sum(int(f["test_rows"]) for f in folds)

          def weighted(arm, key):
              return sum(int(f["test_rows"]) * float(f[arm][key]) for f in folds) / total_n

          full_only = sum(int(f["paired_accuracy"]["full_only_correct"]) for f in folds)
          base_only = sum(int(f["paired_accuracy"]["base_only_correct"]) for f in folds)
          discordant = full_only + base_only
          paired_p = (
              float(binomtest(full_only, discordant, p=.5, alternative="two-sided").pvalue)
              if discordant else 1.0
          )

          overall = {
              "n": total_n,
              "full": {key: weighted("full", key) for key in metric_keys},
              "base_without_rich": {key: weighted("base_without_rich", key) for key in metric_keys},
              "paired_accuracy": {
                  "full_only_correct": full_only,
                  "base_only_correct": base_only,
                  "discordant": discordant,
                  "mcnemar_exact_p_value": paired_p,
              },
          }
          overall["delta_full_minus_base"] = {
              key: overall["full"][key] - overall["base_without_rich"][key]
              for key in metric_keys
          }

          subsets = {}
          for level in ("any", "majority", "full"):
              parts = [f.get("rich_subsets", {}).get(level) for f in folds]
              parts = [p for p in parts if p and int(p.get("n", 0)) > 0]
              if not parts:
                  subsets[level] = None
                  continue
              n = sum(int(p["n"]) for p in parts)
              def w(arm, key):
                  return sum(int(p["n"]) * float(p[arm][key]) for p in parts) / n
              fo = sum(int(p["paired_accuracy"]["full_only_correct"]) for p in parts)
              bo = sum(int(p["paired_accuracy"]["base_only_correct"]) for p in parts)
              dis = fo + bo
              pval = float(binomtest(fo, dis, p=.5, alternative="two-sided").pvalue) if dis else 1.0
              subsets[level] = {
                  "n": n,
                  "full": {key: w("full", key) for key in metric_keys},
                  "base_without_rich": {key: w("base", key) for key in metric_keys},
                  "delta_full_minus_base": {
                      key: w("full", key) - w("base", key)
                      for key in metric_keys
                  },
                  "paired_accuracy": {
                      "full_only_correct": fo,
                      "base_only_correct": bo,
                      "discordant": dis,
                      "mcnemar_exact_p_value": pval,
                  },
              }

          payload = {
              "schema": 1,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "run_id": os.environ["ABLATION_RUN_ID"],
              "run_sha": os.environ["ABLATION_RUN_SHA"],
              "api_requests": 0,
              "method": "parallel paired calendar-year walk-forward rich ON vs OFF; identical folds and only rich features removed from OFF arm",
              "rich_features": reports[0]["rich_features"],
              "overall": overall,
              "rich_subsets": subsets,
              "folds": folds,
          }
          out = Path("/tmp/rich-charting-ablation-latest.json")
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({
              "overall": overall,
              "rich_subsets": subsets,
              "folds": [
                  {
                      "year": f["year"],
                      "test_rows": f["test_rows"],
                      "rich_known_test_rows": f["rich_known_test_rows"],
                      "delta": f["delta_full_minus_base"],
                      "paired_accuracy": f["paired_accuracy"],
                  }
                  for f in folds
              ],
          }, indent=2))
          PY

      - name: Persist latest ablation audit
        run: |
          set -euo pipefail
          path="audit/rich-charting-ablation-latest.json"
          existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/rich-charting-ablation-latest.json)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit BlinQ parallel rich charting ablation run $ABLATION_RUN_ID"               -f content="$encoded" -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit BlinQ parallel rich charting ablation run $ABLATION_RUN_ID"               -f content="$encoded" >/dev/null
          fi

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: blinq-rich-ablation-aggregate-${{ github.run_id }}
          path: /tmp/rich-charting-ablation-latest.json
          if-no-files-found: error
          retention-days: 14
