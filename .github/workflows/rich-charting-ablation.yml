name: BlinQ rich charting ablation

on:
  push:
    branches: [main]
    paths:
      - ".github/rich-charting-ablation-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-rich-charting-ablation
  cancel-in-progress: false

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      ABLATION_RUN_ID: ${{ github.run_id }}
      ABLATION_RUN_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install training dependencies
        run: python -m pip install -r api/requirements-train.txt

      - name: Validate controlled request
        run: |
          set -euo pipefail
          test "$(jq -r '.mode // ""' .github/rich-charting-ablation-request.json)" = "rich-ablation"
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }

      - name: Download canonical production history
        run: python scripts/download_production_preflight_inputs.py

      - name: Run paired rich ON vs OFF walk-forward ablation
        run: |
          set -euo pipefail
          python scripts/ablate_rich_charting.py             --history-dir .cache/tbt/history             --out .cache/tbt/rich-ablation.json             --first-test-year 2023
          test -s .cache/tbt/rich-ablation.json

      - name: Persist ablation audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          report = json.loads(Path(".cache/tbt/rich-ablation.json").read_text(encoding="utf-8"))
          payload = {
              "schema": 1,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "run_id": os.environ["ABLATION_RUN_ID"],
              "run_sha": os.environ["ABLATION_RUN_SHA"],
              "api_requests": 0,
              "report": report,
          }
          Path("/tmp/rich-charting-ablation-latest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
          path="audit/rich-charting-ablation-latest.json"
          existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/rich-charting-ablation-latest.json)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit BlinQ rich charting ablation run $ABLATION_RUN_ID"               -f content="$encoded" -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit BlinQ rich charting ablation run $ABLATION_RUN_ID"               -f content="$encoded" >/dev/null
          fi

      - name: Upload ablation evidence
        uses: actions/upload-artifact@v4
        with:
          name: blinq-rich-charting-ablation-${{ github.run_id }}
          path: .cache/tbt/rich-ablation.json
          if-no-files-found: error
          retention-days: 14
