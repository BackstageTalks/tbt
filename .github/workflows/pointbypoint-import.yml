name: Integrate legacy tennis_pointbypoint serve-return

on:
  push:
    branches: [main]
    paths:
      - ".github/pointbypoint-import-request.json"

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      SOURCE_SHA: 3d3bfc602ed0551352f9e984c1f51240811c8db6
      MAX_AUDITED_STAGE_ROWS: "257"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: python -m pip install --retries 8 --timeout 60 -r api/requirements-train.txt

      - name: Verify controlled request and private destination
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".github/pointbypoint-import-request.json").read_text())
          expected={
            "schema":1,
            "mode":"write",
            "source":"jeff_sackmann_tennis_pointbypoint",
            "source_mirror":"ppaulojr/tennis_pointbypoint",
            "source_sha":"3d3bfc602ed0551352f9e984c1f51240811c8db6",
            "max_audited_stage_rows":257,
          }
          for k,v in expected.items():
              if r.get(k)!=v:
                  raise SystemExit(f"Request mismatch {k}: {r.get(k)!r} != {v!r}")
          print("controlled request verified")
          PY

      - name: Download current canonical history
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          ReleaseStore(
              os.environ["TBT_DATA_REPOSITORY"],
              "tbt-data-v1",
              Path(".cache/tbt/history"),
          ).download(require_bundle_manifest=True)
          PY

      - name: Record dynamic baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.audit_serve_return_gaps import analyze
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities

          matches,safety=sanitize_history_identities(load_partitions(".cache/tbt/history"))
          if safety.get("quarantined_rows"):
              raise SystemExit("Canonical identity quarantine is non-empty")
          report=analyze(matches)
          Path(".cache/tbt/baseline.json").write_text(
              json.dumps(report,indent=2), encoding="utf-8"
          )
          print(json.dumps(report["overall"],indent=2))
          PY

      - name: Fetch pinned legacy PBP source
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --no-checkout \
            https://github.com/ppaulojr/tennis_pointbypoint.git \
            .cache/tbt/pointbypoint-src
          git -C .cache/tbt/pointbypoint-src checkout -q "$SOURCE_SHA"
          test "$(git -C .cache/tbt/pointbypoint-src rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Re-link against current canonical state
        run: |
          set -euo pipefail
          python scripts/link_pointbypoint_serve_return.py \
            --history-dir .cache/tbt/history \
            --source-dir .cache/tbt/pointbypoint-src \
            --out-dir .cache/tbt/pointbypoint-link

          python - <<'PY'
          import json, os
          from pathlib import Path

          report=json.load(open(".cache/tbt/pointbypoint-link/report.json"))
          stage=Path(".cache/tbt/pointbypoint-link/auto_linked.jsonl")
          stage_rows=sum(1 for line in stage.open(encoding="utf-8") if line.strip())
          added=int(report.get("quality_ready_projected_added") or 0)
          max_rows=int(os.environ["MAX_AUDITED_STAGE_ROWS"])

          if report.get("production_mutated") is not False or report.get("api_requests") != 0:
              raise SystemExit("Linker safety contract violated")
          if stage_rows <= 0:
              raise SystemExit("No remaining net-new legacy PBP rows")
          if stage_rows > max_rows:
              raise SystemExit(f"Unexpected stage expansion: {stage_rows} > {max_rows}")
          if added != stage_rows:
              raise SystemExit(f"Projected gain mismatch: added={added}, stage_rows={stage_rows}")

          counts=report.get("counts") or {}
          print(json.dumps({
              "stage_rows":stage_rows,
              "projected_added":added,
              "ambiguous_quarantined":counts.get("ambiguous",0),
              "winner_mismatch_quarantined":counts.get("winner_mismatch",0),
              "duplicate_conflict_quarantined":counts.get("source_duplicate_conflict",0),
          },indent=2))
          PY

      - name: Dry-run strict importer
        run: |
          set -euo pipefail
          python scripts/import_offline_linked_serve_return.py \
            --stage .cache/tbt/pointbypoint-link/auto_linked.jsonl \
            --history-dir .cache/tbt/history \
            --out-dir .cache/tbt/pointbypoint-dry

          python - <<'PY'
          import json
          from pathlib import Path

          stage_rows=sum(
              1 for line in Path(".cache/tbt/pointbypoint-link/auto_linked.jsonl").open(encoding="utf-8")
              if line.strip()
          )
          report=json.load(open(".cache/tbt/pointbypoint-dry/report.json"))
          counts=report.get("counts") or {}
          checks={
              "stage_rows":(report.get("stage_rows"),stage_rows),
              "updated":(counts.get("updated",0),stage_rows),
              "quality_ready_added":(report.get("quality_ready_added"),stage_rows),
              "identity_missing":(counts.get("identity_missing",0),0),
              "identity_changed":(counts.get("identity_changed",0),0),
              "stat_conflicts":(counts.get("stat_conflicts",0),0),
              "invalid_stats":(counts.get("invalid_stats",0),0),
          }
          bad=[f"{k}:{actual}!={expected}" for k,(actual,expected) in checks.items() if actual!=expected]
          if bad:
              raise SystemExit("Dry-run contract failed: "+"; ".join(bad))
          print("dry-run verified")
          PY

      - name: Apply verified PBP stage locally
        run: |
          set -euo pipefail
          python scripts/import_offline_linked_serve_return.py \
            --stage .cache/tbt/pointbypoint-link/auto_linked.jsonl \
            --history-dir .cache/tbt/history \
            --out-dir .cache/tbt/pointbypoint-import \
            --write-partitions \
            --write-history-dir .cache/tbt/history

          python - <<'PY'
          import json
          from pathlib import Path

          stage_rows=sum(
              1 for line in Path(".cache/tbt/pointbypoint-link/auto_linked.jsonl").open(encoding="utf-8")
              if line.strip()
          )
          report=json.load(open(".cache/tbt/pointbypoint-import/report.json"))
          counts=report.get("counts") or {}
          if report.get("quality_ready_added") != stage_rows:
              raise SystemExit("Local import quality gain drifted")
          if counts.get("stat_conflicts",0) or counts.get("identity_changed",0) or counts.get("invalid_stats",0):
              raise SystemExit(f"Importer safety failure: {counts}")
          if not report.get("changed_years"):
              raise SystemExit("No changed years")
          print(json.dumps(report,indent=2))
          PY

      - name: Validate post-write history and leakage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.audit_serve_return_gaps import analyze
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities

          before=json.load(open(".cache/tbt/baseline.json"))
          stage_rows=sum(
              1 for line in Path(".cache/tbt/pointbypoint-link/auto_linked.jsonl").open(encoding="utf-8")
              if line.strip()
          )
          matches,safety=sanitize_history_identities(load_partitions(".cache/tbt/history"))
          if safety.get("quarantined_rows"):
              raise SystemExit("Post-write identity quarantine")
          after=analyze(matches)
          Path(".cache/tbt/pointbypoint-after.json").write_text(
              json.dumps(after,indent=2), encoding="utf-8"
          )
          if after["overall"]["completed"] != before["overall"]["completed"]:
              raise SystemExit("Canonical completed count changed")
          if after["overall"]["both_ready"] != before["overall"]["both_ready"] + stage_rows:
              raise SystemExit("Post-write serve/return count mismatch")
          print(json.dumps(after["overall"],indent=2))
          PY

          python scripts/audit_training_leakage.py \
            --history-dir .cache/tbt/history \
            --report .cache/tbt/pointbypoint-leakage.json

          python - <<'PY'
          import json
          report=json.load(open(".cache/tbt/pointbypoint-leakage.json"))
          if report.get("status") not in {"PASS","pass"} and report.get("passed") is not True:
              raise SystemExit("Leakage audit failed")
          PY

      - name: Publish changed canonical partitions
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.release_store import ReleaseStore

          report=json.load(open(".cache/tbt/pointbypoint-import/report.json"))
          years=[int(year) for year in report.get("changed_years") or []]
          root=Path(".cache/tbt/history")
          paths=[root/f"history-{year:04d}.parquet" for year in years] + [
              root/"history_manifest.json"
          ]
          for path in paths:
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"Missing publish asset {path}")
          ReleaseStore(
              os.environ["TBT_DATA_REPOSITORY"],
              "tbt-data-v1",
              root,
          ).upload_bundle(paths)
          print("published",years)
          PY

      - name: Verify committed private release
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          from scripts.audit_serve_return_gaps import analyze
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities

          ReleaseStore(
              os.environ["TBT_DATA_REPOSITORY"],
              "tbt-data-v1",
              Path(".cache/tbt/verify"),
          ).download(require_bundle_manifest=True)

          before=json.load(open(".cache/tbt/baseline.json"))
          stage_rows=sum(
              1 for line in Path(".cache/tbt/pointbypoint-link/auto_linked.jsonl").open(encoding="utf-8")
              if line.strip()
          )
          matches,safety=sanitize_history_identities(load_partitions(".cache/tbt/verify"))
          if safety.get("quarantined_rows"):
              raise SystemExit("Committed release identity quarantine")
          after=analyze(matches)
          if after["overall"]["completed"] != before["overall"]["completed"]:
              raise SystemExit("Committed canonical row count changed")
          if after["overall"]["both_ready"] != before["overall"]["both_ready"] + stage_rows:
              raise SystemExit("Committed serve/return verification failed")
          Path(".cache/tbt/verify-report.json").write_text(
              json.dumps(after,indent=2), encoding="utf-8"
          )
          print(json.dumps(after["overall"],indent=2))
          PY

      - name: Persist import audit privately
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          baseline=json.load(open(".cache/tbt/baseline.json"))
          link=json.load(open(".cache/tbt/pointbypoint-link/report.json"))
          imp=json.load(open(".cache/tbt/pointbypoint-import/report.json"))
          verify=json.load(open(".cache/tbt/verify-report.json"))
          stage_rows=sum(
              1 for line in Path(".cache/tbt/pointbypoint-link/auto_linked.jsonl").open(encoding="utf-8")
              if line.strip()
          )

          audit={
              "schema":1,
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "source":"jeff_sackmann_tennis_pointbypoint",
              "source_mirror":"ppaulojr/tennis_pointbypoint",
              "source_sha":"3d3bfc602ed0551352f9e984c1f51240811c8db6",
              "license":"CC BY-NC-SA 4.0",
              "license_evidence_note":"Original Sackmann tennis_pointbypoint corpus; non-commercial internal enrichment only, no raw redistribution.",
              "canonical_rows":verify["overall"]["completed"],
              "serve_return_before":baseline["overall"]["both_ready"],
              "serve_return_after":verify["overall"]["both_ready"],
              "serve_return_added":verify["overall"]["both_ready"]-baseline["overall"]["both_ready"],
              "stage_rows":stage_rows,
              "link_counts":link.get("counts"),
              "changed_years":imp.get("changed_years"),
              "provider_api_requests":0,
              "model_promoted":False,
          }
          Path(".cache/tbt/pointbypoint-import-audit.json").write_text(
              json.dumps(audit,indent=2), encoding="utf-8"
          )
          PY

          path="audit/pointbypoint-import-latest.json"
          encoded="$(base64 -w0 .cache/tbt/pointbypoint-import-audit.json)"
          sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" \
              -f message="Update legacy PBP import audit" \
              -f content="$encoded" \
              -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" \
              -f message="Add legacy PBP import audit" \
              -f content="$encoded" >/dev/null
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pointbypoint-import-${{ github.run_id }}
          retention-days: 14
          path: |
            .cache/tbt/baseline.json
            .cache/tbt/pointbypoint-link/report.json
            .cache/tbt/pointbypoint-link/review.jsonl
            .cache/tbt/pointbypoint-dry/report.json
            .cache/tbt/pointbypoint-import/report.json
            .cache/tbt/pointbypoint-after.json
            .cache/tbt/pointbypoint-leakage.json
            .cache/tbt/verify-report.json
            .cache/tbt/pointbypoint-import-audit.json
