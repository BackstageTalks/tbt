name: BlinQ SHA-verified private Drive candidate report summary

# One source-locked readback when this workflow is introduced/edited.
# No Drive API, no provider calls, no canonical writer or cron.
'on':
  pull_request:
    paths:
      - .github/workflows/blinq-private-drive-report-summary-once.yml
      - scripts/audit_private_drive_report_summary.py
      - tests/test_audit_private_drive_report_summary.py
  push:
    branches: [main]
    paths:
      - .github/workflows/blinq-private-drive-report-summary-once.yml
      - scripts/audit_private_drive_report_summary.py
      - tests/test_audit_private_drive_report_summary.py
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: blinq-private-drive-cdb-report-summary-once
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fail-closed SHA and report-only source summarizer
        run: python -m unittest discover -s tests -p test_audit_private_drive_report_summary.py -v

  summary-on-private-report:
    needs: unit-tests
    if: github.repository == 'BackstageTalks/tbt' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      PRIVATE_TAG: blinq-drive-cdb-audit-38161326646-1
      EXPECTED_SHA256: a5d43ac0a55cc0d0fa7bf79c8dac0135054d905434e2a642944f2353a3b71af4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read SHA-pinned PRIVATE archive, emit numeric metrics only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'BackstageTalks/tbt'
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "$GH_TOKEN" || { echo BLOCKED_MISSING_PRIVATE_READER; exit 1; }
          test "$(gh api "repos/$PRIVATE_REPO" --jq '.private')" = 'true'
          mkdir -p work/private-summary
          gh release download "$PRIVATE_TAG" -R "$PRIVATE_REPO" \
            -p drive-cdb-audit-bundle.tar.gz -D work/private-summary >/dev/null
          remote_asset_sha="$(gh api "repos/$PRIVATE_REPO/releases/tags/$PRIVATE_TAG" \
            --jq '.assets[] | select(.name=="drive-cdb-audit-bundle.tar.gz") | .digest')"
          test "$remote_asset_sha" = "sha256:$EXPECTED_SHA256"
          current_year_sha="$(gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" \
            --jq '.assets[] | select(.name=="history-2026.parquet") | .digest')"
          test "${current_year_sha#sha256:}" != "$current_year_sha"
          python scripts/audit_private_drive_report_summary.py \
            --bundle work/private-summary/drive-cdb-audit-bundle.tar.gz \
            --expected-bundle-sha256 "$EXPECTED_SHA256" \
            --current-year-sha256 "${current_year_sha#sha256:}" \
            > work/private-summary/safe-counts.json
          echo PRIVATE_AUDIT_REPORT_VERIFIED_COUNTS_ONLY
          cat work/private-summary/safe-counts.json
          {
            echo '### Private Drive audit — SHA-verified aggregate counts only'
            echo 'Source names, individual matches and values stay private.'
            echo '```json'
            cat work/private-summary/safe-counts.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -rf work/private-summary

  private-servestats-contract:
    # Private Actions jobs currently terminate before running any steps;
    # use the already functional PUBLIC app runner with trusted private checkout.
    # Never expose private source rows, create artifacts, modify CDB or deploy UI.
    if: ${{ github.repository == 'BackstageTalks/tbt' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Verify private checkout is authorized
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view BackstageTalks/tbt-data --json visibility -q .visibility)" = PRIVATE
      - name: Check out private audit code, no persisted credentials
        uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: main
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute isolated source-to-CDB gate regressions
        shell: bash
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_audit_manual_servestats_cdb.py -v
          python -m compileall -q scripts/audit_manual_servestats_cdb.py
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/audit_manual_servestats_cdb.py")
          code=p.read_text(encoding="utf-8")
          assert '"write_authorized": False' in code
          assert '"production_mutated": False' in code
          assert 'verify_player_orientation' in code
          for forbidden in ("gh release", "upload_bundle(", "write_snapshot(", "requests.post("):
              assert forbidden not in code, forbidden
          print("PRIVATE_CDB_SOURCE_GATE_READONLY_PASS")
          PY
      - name: Record counts-only CI result
        if: success()
        shell: bash
        run: |
          echo "Private manual serve/return CDB candidate audit: Python unit tests and read-only contract passed on public app runner. No source rows or artifacts published; CDB untouched." >> "$GITHUB_STEP_SUMMARY"

  private-drive-null-gate-contract:
    # One-off SHA-pinned synthetic verification of the private gate while
    # private Actions runners cannot start. Never expose private file content.
    if: ${{ github.repository == 'BackstageTalks/tbt' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - name: Verify trusted private checkout access
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view BackstageTalks/tbt-data --json visibility -q .visibility)" = PRIVATE
      - name: Read pinned private CDB gate branch, no source data download
        uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: 9b0766fcb9e911288e41337f2780de0548ac6616
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated current-null and identity/rights/PIT tests
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../private-test-results
          if python -m unittest discover -s tests -p test_drive_cdb_current_null_gate.py -v > ../private-test-results/tests.log 2>&1 &&
             python -m compileall -q scripts/drive_cdb_current_null_gate.py; then
            echo PRIVATE_DRIVE_CURRENT_NULL_GATE_SYNTHETIC_TESTS_PASS
          else
            echo PRIVATE_DRIVE_CURRENT_NULL_GATE_SYNTHETIC_TESTS_FAIL
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          s = Path("scripts/drive_cdb_current_null_gate.py").read_text()
          assert '"ready_for_production_write": 0' in s
          assert '"write_authorized": False' in s
          assert "upload_bundle(" not in s and "write_snapshot(" not in s
          assert "gh release" not in s
          print("PRIVATE_DRIVE_GATE_ZERO_WRITE_CONTRACT_PASS")
          PY
      - name: Publish status marker only
        if: success()
        run: |
          echo 'Private Drive CDB current-NULL gate: synthetic regressions PASS, no canonical write and no source bytes published.' >> "$GITHUB_STEP_SUMMARY"
