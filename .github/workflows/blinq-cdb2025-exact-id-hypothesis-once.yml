name: BlinQ CDB2025 source numeric ID exact-overlap hypothesis - one shot
on:
  push:
    branches: [main]
    paths:
      - '.github/cdb2025-exact-id-hypothesis-request.json'
permissions:
  contents: read
jobs:
  read-only-exact-id-overlap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      PINNED_PRIVATE_SHA: 1c9568bac90913cdda03c174db0f7b1b82bcc29a
      CURRENT_CDB_SHA: 3a929b356803af6b0f704d4d3066a053ecf995124ec8f4228487c54c0f534c58
      LEDGER_SHA: 90915bcb5174be1cad2a55ee87ed3dbc998b68b1b6934b4eba849f5aa4a17a00
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: 1c9568bac90913cdda03c174db0f7b1b82bcc29a
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          persist-credentials: false
          path: work/private
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require locked private source and exact current CDB bytes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          test "$(git -C work/private rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
          mkdir -p work/input work/cdb work/output
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" --pattern history-2025.parquet -D work/cdb >/dev/null
          echo "$CURRENT_CDB_SHA  work/cdb/history-2025.parquet" | sha256sum -c
          cat work/private/research/identity-gaps/source_2025_numeric_ledger_parts/part*.txt | base64 --decode | gzip -dc > work/input/source2025.jsonl
          echo "$LEDGER_SHA  work/input/source2025.jsonl" | sha256sum -c
          python - <<'PY'
          import json
          p=json.load(open('work/private/research/identity-gaps/source_2025_numeric_ledger_provenance.json'))
          assert p['ledger_uncompressed_sha256']=='90915bcb5174be1cad2a55ee87ed3dbc998b68b1b6934b4eba849f5aa4a17a00'
          assert p['rows_2025']==20732
          assert p['rows_by_tour']=={'atp':14620,'wta':6112}
          PY
      - name: Execute 12 fail-closed offline tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/research -p 'test_audit_exact_2025_id_namespace.py' -v
          python -m pip install --quiet 'pyarrow>=17,<25' 'pandas>=2,<3'
      - name: Compare exact event and player IDs without names or approximate dates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research/audit_exact_2025_id_namespace.py \
            --source work/input/source2025.jsonl \
            --cdb work/cdb/history-2025.parquet \
            --out work/output/report.json
          python - <<'PY'
          import json
          r=json.load(open('work/output/report.json'))
          assert r['counts']['source_total']==20732
          assert r['counts']['cdb_total']==90571
          assert r['CDB_writes']==0 and r['approved_CDB_NULL_fields']==0
          assert r['direct_source_to_cdb_event_and_players_authoritatively_attested'] is False
          assert r['source_license_cleared'] is False
          PY
      - name: Save private aggregate report and verify SHA readback
        shell: bash
        run: |
          set -euo pipefail
          tag="blinq-source2025-exact-id-overlap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          (cd work/output && sha256sum report.json > SHA256SUMS)
          gh release create "$tag" -R "$PRIVATE_REPO" --target "$PINNED_PRIVATE_SHA" \
            --title 'BlinQ CDB2025 numeric ID overlap - source-only hypothesis test' \
            --notes 'PRIVATE read-only exact-event+pair+time test. REcodeX=Sofascore assumed only as hypothesis; TennisData IDs independent. No source rights grant, no CDB import, no model changes.' >/dev/null
          gh release upload "$tag" work/output/report.json work/output/SHA256SUMS -R "$PRIVATE_REPO" >/dev/null
          mkdir -p work/readback
          gh release download "$tag" -R "$PRIVATE_REPO" -D work/readback >/dev/null
          (cd work/readback && sha256sum -c SHA256SUMS)
          cmp work/output/report.json work/readback/report.json
          echo "BLINQ_CDB2025_EXACT_ID_HYPOTHESIS_PRIVATE_READBACK=$tag"
