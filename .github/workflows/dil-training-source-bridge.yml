name: DIL training source bridge (ephemeral)

on:
  pull_request:
    paths:
      - '.github/workflows/dil-training-source-bridge.yml'
      - 'scripts/dil_training_source_bridge.py'
      - 'scripts/dil_training_full_export.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bridge:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install conversion dependencies
        run: python -m pip install 'pyarrow>=17,<22' 'zstandard>=0.23,<1'
      - name: Read SHA-verified private release and convert all rows/columns
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing private-release access'; exit 1; }
          mkdir -p .cache/dil-training-source .cache/dil-training-converted
          python scripts/dil_training_source_bridge.py --repository "$TBT_DATA_REPOSITORY" --out-dir .cache/dil-training-source
          python scripts/dil_training_full_export.py --source-dir .cache/dil-training-source --out-dir .cache/dil-training-converted
      - name: Temporary private handoff; no canonical database writes
        uses: actions/upload-artifact@v4
        with:
          name: blinq-dil-training-full-source-20261024
          path: |
            .cache/dil-training-converted/dil_training_all_source.sqlite.zst
            .cache/dil-training-converted/dil_training_source_export_receipt.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
