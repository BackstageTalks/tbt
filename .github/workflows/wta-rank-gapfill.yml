name: BlinQ WTA rank-points audit

on:
  pull_request:
    paths:
      - ".github/wta-rank-gapfill-request.json"
      - ".github/workflows/wta-rank-gapfill.yml"
      - "scripts/audit_offline_wta_rank_points.py"
      - "tests/test_wta_rank_gapfill_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/wta-rank-gapfill-request.json"
      - ".github/workflows/wta-rank-gapfill.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('wta-rank-audit-pr-{0}', github.ref) || 'wta-rank-audit' }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve controlled request
        run: |
          set -euo pipefail
          request=.github/wta-rank-gapfill-request.json
          test "$(jq -r '.mode' "$request")" = "audit"
          test "$(jq -r '.zero_provider_api_requests' "$request")" = "true"
          {
            echo "SOURCE_REF=$(jq -r '.source_ref' "$request")"
            echo "SOURCE_PREFIX=$(jq -r '.source_prefix' "$request")"
            echo "EXPECTED_SHA=$(jq -r '.expected_sha256' "$request")"
            echo "EXPECTED_LINES=$(jq -r '.expected_file_lines' "$request")"
            echo "SOURCE_LABEL=$(jq -r '.source_label' "$request")"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies and focused test
        run: |
          python -m pip install -r api/requirements-train.txt pytest
          python -m pytest tests/test_wta_rank_gapfill_contract.py -q

      - name: Reassemble pinned source
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/wta-rank/source
          source=.cache/tbt/wta-rank/source/wta.txt
          : > "$source"
          for part in 000 001 002 003 004 005; do
            gh api -H "Accept: application/vnd.github.raw+json"               "repos/$TBT_DATA_REPOSITORY/contents/$SOURCE_PREFIX/wta.txt.part$part?ref=$SOURCE_REF" >> "$source"
          done
          test "$(sha256sum "$source" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(wc -l < "$source" | tr -d ' ')" = "$EXPECTED_LINES"

      - name: Download canonical history
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore
          directory=Path(".cache/tbt/wta-rank/history")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", directory).download(require_bundle_manifest=True)
          PY

      - name: Audit point-in-time ranks and points
        run: |
          python scripts/audit_offline_wta_rank_points.py             --history-dir .cache/tbt/wta-rank/history             --source-csv .cache/tbt/wta-rank/source/wta.txt             --source-label "$SOURCE_LABEL"             --out-dir .cache/tbt/wta-rank/audit
          test -s .cache/tbt/wta-rank/audit/report.json

      - name: Validate audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".cache/tbt/wta-rank/audit/report.json").read_text())
          c=r.get("counts") or {}
          print(json.dumps(r, indent=2))
          if int(r.get("api_requests",-1)) != 0 or r.get("production_mutated") is not False:
              raise SystemExit("Unexpected side effect in WTA rank audit")
          if int(c.get("identity_linked") or 0) <= 0:
              raise SystemExit("No WTA rank rows linked")
          PY

      - name: Persist private rank-points sidecar and audit
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          gzip -c .cache/tbt/wta-rank/audit/rank-points-sidecar.jsonl > /tmp/wta-rank-points-2006-2026.jsonl.gz
          upload() {
            source="$1"; path="$2"; message="$3"
            sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
            SOURCE="$source" SHA="$sha" MESSAGE="$message" python - <<'PY'
          import base64,json,os
          from pathlib import Path
          payload={"message":os.environ["MESSAGE"],"content":base64.b64encode(Path(os.environ["SOURCE"]).read_bytes()).decode()}
          if os.environ.get("SHA"): payload["sha"]=os.environ["SHA"]
          Path("/tmp/wta-rank-upload.json").write_text(json.dumps(payload))
          PY
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" --input /tmp/wta-rank-upload.json >/dev/null
          }
          upload /tmp/wta-rank-points-2006-2026.jsonl.gz             research/rank_points/wta-rank-points-2006-2026.jsonl.gz             "Update WTA rank-points sidecar from run $GITHUB_RUN_ID"
          upload .cache/tbt/wta-rank/audit/report.json             audit/wta-rank-points-latest.json             "Audit WTA rank-points source run $GITHUB_RUN_ID"

      - name: Upload workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: blinq-wta-rank-audit-${{ github.run_id }}
          path: |
            .cache/tbt/wta-rank/audit/report.json
            .cache/tbt/wta-rank/audit/rank-fill-candidates.jsonl
          if-no-files-found: error
          retention-days: 14
