name: BlinQ WTA rank-points audit

on:
  pull_request:
    paths:
      - ".github/wta-rank-gapfill-request.json"
      - ".github/workflows/wta-rank-gapfill.yml"
      - "scripts/audit_offline_wta_rank_points.py"
      - "scripts/import_offline_wta_rank_fill.py"
      - "tests/test_wta_rank_gapfill_contract.py"
      - "scripts/audit_wta_official_2026_gaps.py"
      - "tests/test_wta_official_2026_gaps.py"
  push:
    branches: [main]
    paths:
      - ".github/wta-rank-gapfill-request.json"
      - ".github/workflows/wta-rank-gapfill.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Global Git tag owns write serialization; run-unique queue prevents pending eviction.
  group: tbt-crossrepo-writer-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve controlled request
        run: |
          set -euo pipefail
          request=.github/wta-rank-gapfill-request.json
          mode="$(jq -r '.mode' "$request")"
          [[ "$mode" == "write" || "$mode" == "dry-run" ]]
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then mode="dry-run"; fi
          echo "RANK_MODE=$mode" >> "$GITHUB_ENV"
          test "$(jq -r '.zero_provider_api_requests' "$request")" = "true"
          {
            echo "SOURCE_REF=$(jq -r '.source_ref' "$request")"
            echo "SOURCE_PREFIX=$(jq -r '.source_prefix' "$request")"
            echo "EXPECTED_SHA=$(jq -r '.expected_sha256' "$request")"
            echo "EXPECTED_LINES=$(jq -r '.expected_file_lines' "$request")"
            echo "SOURCE_LABEL=$(jq -r '.source_label' "$request")"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies and focused test
        run: |
          python -m pip install -r api/requirements-train.txt pytest
          python -m pytest tests/test_wta_rank_gapfill_contract.py tests/test_wta_official_2026_gaps.py -q

      - name: Reassemble pinned source
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/wta-rank/source
          source=.cache/tbt/wta-rank/source/wta.txt
          : > "$source"
          for part in 000 001 002 003 004 005; do
            gh api -H "Accept: application/vnd.github.raw+json" "repos/$TBT_DATA_REPOSITORY/contents/$SOURCE_PREFIX/wta.txt.part$part?ref=$SOURCE_REF" >> "$source"
          done
          test "$(sha256sum "$source" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(wc -l < "$source" | tr -d ' ')" = "$EXPECTED_LINES"

      - name: Acquire cross-repository canonical writer lock
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_global_writer_lock.py acquire --wait-seconds 1200

      - name: Download canonical history
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore
          directory=Path(".cache/tbt/wta-rank/history")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", directory).download(require_bundle_manifest=True)
          PY

      - name: Audit official WTA 2026 supplement against current CDB (PR/read-only)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/wta-rank/official-source .cache/tbt/wta-rank/official-audit
          source=.cache/tbt/wta-rank/official-source/wta_singles_2026.csv.gz
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$TBT_DATA_REPOSITORY/contents/research/wta-official-2026/wta_official_singles_2026_post_sackmann.csv.gz?ref=main" \
            > "$source"
          echo "4267e37ba6357eb11cfb0e9346c3c59eac8a17431e1f19deb5fffa9573a9bf03  $source" | sha256sum -c -
          gzip -t "$source"
          python scripts/audit_wta_official_2026_gaps.py \
            --source "$source" --history-dir .cache/tbt/wta-rank/history \
            --out-dir .cache/tbt/wta-rank/official-audit
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path(".cache/tbt/wta-rank/official-audit/report.json")
          data=json.loads(path.read_text())
          assert data["status"] == "read_only" and data["production_mutated"] is False
          assert data["write_authorized"] is False and data["api_requests"] == 0
          assert data["stage_rows"] == data["counts"].get("candidate_matches",0)
          print("OFFICIAL_WTA_2026_READONLY_AUDIT:",json.dumps(data,sort_keys=True))
          PY

      - name: Audit point-in-time ranks and points
        run: |
          python scripts/audit_offline_wta_rank_points.py --history-dir .cache/tbt/wta-rank/history --source-csv .cache/tbt/wta-rank/source/wta.txt --source-label "$SOURCE_LABEL" --out-dir .cache/tbt/wta-rank/audit
          test -s .cache/tbt/wta-rank/audit/report.json

      - name: Dry-run strict rank importer
        run: |
          python scripts/import_offline_wta_rank_fill.py \
            --stage .cache/tbt/wta-rank/audit/rank-fill-candidates.jsonl \
            --history-dir .cache/tbt/wta-rank/history \
            --out-dir .cache/tbt/wta-rank/dry
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(".cache/tbt/wta-rank/dry/report.json").read_text())
          c=r.get("counts") or {}
          print(json.dumps(r,indent=2))
          for key in ("identity_missing","identity_changed","invalid_incoming","point_in_time_rejected","duplicate_or_missing_match_id"):
              if int(c.get(key) or 0):
                  raise SystemExit(f"Strict WTA rank importer rejected rows: {key}={c.get(key)}")
          updated=int(c.get("updated") or 0)
          exhausted=updated <= 0
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write(f"RANK_GAP_EXHAUSTED={'true' if exhausted else 'false'}\n")
          if exhausted:
              print("No safe WTA rank fills remain; treating verified exhaustion as a successful no-op.")
          PY

      - name: Write verified WTA ranks into local history
        if: env.RANK_MODE == 'write' && env.RANK_GAP_EXHAUSTED != 'true'
        run: |
          python scripts/import_offline_wta_rank_fill.py \
            --stage .cache/tbt/wta-rank/audit/rank-fill-candidates.jsonl \
            --history-dir .cache/tbt/wta-rank/history \
            --out-dir .cache/tbt/wta-rank/write \
            --write-partitions \
            --write-history-dir .cache/tbt/wta-rank/history

      - name: Validate and publish changed canonical partitions
        if: env.RANK_MODE == 'write' && env.RANK_GAP_EXHAUSTED != 'true'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from release_store import ReleaseStore
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          from tbt.services.training import _enforce_rank_provenance

          directory=Path(".cache/tbt/wta-rank/history")
          report=json.loads(Path(".cache/tbt/wta-rank/write/report.json").read_text())
          c=report.get("counts") or {}
          for key in ("identity_missing","identity_changed","invalid_incoming","point_in_time_rejected","duplicate_or_missing_match_id"):
              if int(c.get(key) or 0):
                  raise SystemExit(f"Write rejected rows: {key}={c.get(key)}")
          years=[int(x) for x in report.get("changed_years") or []]
          if not years:
              raise SystemExit("No changed WTA rank partitions")

          matches,safety=sanitize_history_identities(load_partitions(directory))
          if safety.get("quarantined_rows"):
              raise SystemExit("Identity safety failed after WTA rank import")
          _,rank_report=_enforce_rank_provenance(matches)
          if int(rank_report.get("stripped_rows") or 0):
              raise SystemExit(f"Unverified ranks remain after import: {rank_report}")

          paths=[directory/f"history-{year:04d}.parquet" for year in years]
          paths.append(directory/"history_manifest.json")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",directory).upload_bundle(paths)
          print("Published WTA rank gap-fill years=",years,"rank_report=",rank_report)
          PY

      - name: Validate audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".cache/tbt/wta-rank/audit/report.json").read_text())
          c=r.get("counts") or {}
          print(json.dumps(r, indent=2))
          if int(r.get("api_requests",-1)) != 0 or r.get("production_mutated") is not False:
              raise SystemExit("Unexpected side effect in WTA rank audit")
          if int(c.get("identity_linked") or 0) <= 0:
              raise SystemExit("No WTA rank rows linked")
          PY

      - name: Persist private rank-points sidecar and audit
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          gzip -c .cache/tbt/wta-rank/audit/rank-points-sidecar.jsonl > /tmp/wta-rank-points-2006-2026.jsonl.gz
          upload() {
            source="$1"; path="$2"; message="$3"
            sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
            SOURCE="$source" SHA="$sha" MESSAGE="$message" python - <<'PY'
          import base64,json,os
          from pathlib import Path
          payload={"message":os.environ["MESSAGE"],"content":base64.b64encode(Path(os.environ["SOURCE"]).read_bytes()).decode()}
          if os.environ.get("SHA"): payload["sha"]=os.environ["SHA"]
          Path("/tmp/wta-rank-upload.json").write_text(json.dumps(payload))
          PY
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" --input /tmp/wta-rank-upload.json >/dev/null
          }
          upload /tmp/wta-rank-points-2006-2026.jsonl.gz research/rank_points/wta-rank-points-2006-2026.jsonl.gz "Update WTA rank-points sidecar from run $GITHUB_RUN_ID"
          upload .cache/tbt/wta-rank/audit/report.json audit/wta-rank-points-latest.json "Audit WTA rank-points source run $GITHUB_RUN_ID"

      - name: Upload workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: blinq-wta-rank-audit-${{ github.run_id }}
          path: |
            .cache/tbt/wta-rank/audit/report.json
            .cache/tbt/wta-rank/audit/rank-fill-candidates.jsonl
            .cache/tbt/wta-rank/dry/report.json
            .cache/tbt/wta-rank/write/report.json
            .cache/tbt/wta-rank/official-audit/report.json
            .cache/tbt/wta-rank/official-audit/candidates.jsonl
          if-no-files-found: warn
          retention-days: 14
      
      - name: Release cross-repository canonical writer lock
        if: always()
        shell: bash
        run: python scripts/cdb_global_writer_lock.py release --if-held
