name: One-shot verified recovery of abandoned CDB writer lock 39130345960

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-orphan-cdb-lock-39130345960-once.yml

permissions:
  contents: read

concurrency:
  group: blinq-orphan-writer-39130345960-once
  cancel-in-progress: false

jobs:
  safely-clear-exact-orphan:
    if: github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - name: Never delete a live, different, re-run or moved CDB writer
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python - <<'PY'
          import json, subprocess

          OWNER_REPO = "BackstageTalks/tbt"
          DATA_REPO = "BackstageTalks/tbt-data"
          RUN_ID = 39130345960
          ATTEMPT = 1
          EXPECTED_TAG_SHA = "a7be493019c0248178da9ca708df7dad8d8f89a1"
          EXPECTED_OWNER = f"{OWNER_REPO}/actions/runs/{RUN_ID}/attempts/{ATTEMPT}"
          REF = f"repos/{DATA_REPO}/git/ref/tags/blinq-cdb-global-writer"
          DELETE = f"repos/{DATA_REPO}/git/refs/tags/blinq-cdb-global-writer"

          def api(path, method="GET", missing_ok=False):
              p = subprocess.run(["gh", "api", "--method", method, path],
                                 capture_output=True, text=True)
              if p.returncode:
                  if missing_ok and "HTTP 404" in p.stderr:
                      return None
                  raise RuntimeError(f"GitHub {method} {path}: {p.stderr[-320:]}")
              return json.loads(p.stdout) if p.stdout.strip() else {}

          # Only a single specific failed run's exact old annotated tag is eligible.
          run = api(f"repos/{OWNER_REPO}/actions/runs/{RUN_ID}")
          assert (
              run.get("id") == RUN_ID
              and run.get("run_attempt") == ATTEMPT
              and run.get("status") == "completed"
              and run.get("conclusion") == "failure"
          ), "Owner run is active, re-run, or not terminal failure; FAIL CLOSED"
          jobs = api(f"repos/{OWNER_REPO}/actions/runs/{RUN_ID}/jobs?per_page=100")
          all_jobs = jobs.get("jobs", [])
          assert (
              all_jobs and len(all_jobs) == jobs.get("total_count")
              and all(j.get("status") == "completed" for j in all_jobs)
          ), "Owner jobs not all terminal; FAIL CLOSED"
          lock = api(REF, missing_ok=True)
          if lock is None:
              print("No lock exists; no mutation")
              raise SystemExit(0)
          sha = (lock.get("object") or {}).get("sha")
          if sha != EXPECTED_TAG_SHA:
              print("Another lock owner exists; nothing modified")
              raise SystemExit(0)
          tag = api(f"repos/{DATA_REPO}/git/tags/{EXPECTED_TAG_SHA}")
          assert (
              tag.get("message") == f"owner={EXPECTED_OWNER}"
              and tag.get("object", {}).get("type") == "commit"
          ), "Annotated tag ownership mismatched; FAIL CLOSED"
          lock_again = api(REF, missing_ok=True)
          assert lock_again is not None and (
              (lock_again.get("object") or {}).get("sha") == EXPECTED_TAG_SHA
          ), "Lock changed during preflight; FAIL CLOSED"
          api(DELETE, method="DELETE")
          after = api(REF, missing_ok=True)
          assert after is None or (
              (after.get("object") or {}).get("sha") != EXPECTED_TAG_SHA
          ), "Old lock still present"
          print("Exact orphan cleared; global atomic writer acquisition remains mandatory")
          print("This operation does NOT assert any CDB values written")
          PY
