name: Open-Meteo ECMWF coverage probe

on:
  push:
    branches:
      - research/openmeteo-ecmwf-probe-20261006
    paths:
      - ".github/workflows/openmeteo-ecmwf-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe Open-Meteo archived ECMWF paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error

          def get(base, params):
              url = base + "?" + urllib.parse.urlencode(params, safe=",:")
              req = urllib.request.Request(url, headers={"User-Agent":"BlinQ-OpenMeteo-Probe/1.1"})
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      body = r.read().decode("utf-8")
                      status = r.status
                  data = json.loads(body)
                  return url, status, data, None
              except Exception as exc:
                  return url, None, None, repr(exc)

          variables = [
              "temperature_2m","relative_humidity_2m","precipitation",
              "pressure_msl","cloud_cover","wind_speed_10m",
              "wind_direction_10m","wind_gusts_10m"
          ]
          result = {"single_runs": [], "previous_runs": [], "historical_forecast": []}

          single_cases = [
              ("Wimbledon","51.4343","-0.2145","2025-07-01T00:00"),
              ("Madrid","40.4168","-3.7038","2025-04-20T00:00"),
              ("Melbourne","-37.8136","144.9631","2025-01-10T00:00"),
          ]
          for name, lat, lon, run in single_cases:
              url, status, data, error = get("https://single-runs-api.open-meteo.com/v1/forecast", {
                  "latitude":lat, "longitude":lon, "run":run,
                  "models":"ecmwf_ifs", "hourly":",".join(variables),
                  "forecast_hours":"72", "timezone":"GMT"
              })
              hourly = (data or {}).get("hourly") or {}
              checks = {v:{"count":len(hourly.get(v) or []),"non_null":sum(x is not None for x in (hourly.get(v) or []))} for v in variables}
              ok = error is None and all(v["non_null"] >= 24 for v in checks.values())
              result["single_runs"].append({"case":name,"run":run,"status":status,"ok":ok,"error":error,"checks":checks,"url":url})

          prev_vars = []
          for base in ["temperature_2m","relative_humidity_2m","precipitation","pressure_msl","cloud_cover","wind_speed_10m","wind_direction_10m"]:
              prev_vars += [f"{base}_previous_day1", f"{base}_previous_day2"]

          for model in ["ecmwf_ifs","ecmwf_ifs025","best_match"]:
              url, status, data, error = get("https://previous-runs-api.open-meteo.com/v1/forecast", {
                  "latitude":"51.4343", "longitude":"-0.2145",
                  "models":model, "hourly":",".join(prev_vars),
                  "start_date":"2025-07-01", "end_date":"2025-07-03",
                  "timezone":"GMT"
              })
              hourly = (data or {}).get("hourly") or {}
              checks = {v:{"count":len(hourly.get(v) or []),"non_null":sum(x is not None for x in (hourly.get(v) or []))} for v in prev_vars}
              ok = error is None and all(v["non_null"] >= 24 for v in checks.values())
              result["previous_runs"].append({"case":"Wimbledon-2025-fixed-lead-24h-48h","model":model,"status":status,"ok":ok,"error":error,"checks":checks,"url":url})

          # Older stitched historical forecast sanity check (not fixed-lead leakage-safe).
          for model in ["ecmwf_ifs","ecmwf_ifs025","best_match"]:
              url, status, data, error = get("https://historical-forecast-api.open-meteo.com/v1/forecast", {
                  "latitude":"51.4343", "longitude":"-0.2145",
                  "models":model, "hourly":",".join(variables),
                  "start_date":"2023-07-01", "end_date":"2023-07-03",
                  "timezone":"GMT"
              })
              hourly = (data or {}).get("hourly") or {}
              checks = {v:{"count":len(hourly.get(v) or []),"non_null":sum(x is not None for x in (hourly.get(v) or []))} for v in variables}
              ok = error is None and all(v["non_null"] >= 24 for v in checks.values())
              result["historical_forecast"].append({"case":"Wimbledon-2023-stitched","model":model,"status":status,"ok":ok,"error":error,"checks":checks,"url":url})

          summary = {
              "single_runs_all_three_ok": all(x["ok"] for x in result["single_runs"]),
              "previous_runs_any_model_ok": any(x["ok"] for x in result["previous_runs"]),
              "historical_2023_any_model_ok": any(x["ok"] for x in result["historical_forecast"]),
          }
          result["summary"] = summary
          with open("openmeteo-ecmwf-probe.json","w",encoding="utf-8") as f:
              json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))

          if not summary["single_runs_all_three_ok"]:
              raise SystemExit("Single-run ECMWF archive failed one or more sample locations")
          if not summary["previous_runs_any_model_ok"]:
              raise SystemExit("No Previous Runs model supplied non-null 24/48h fixed-lead data")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmeteo-ecmwf-probe
          path: openmeteo-ecmwf-probe.json
          retention-days: 14
