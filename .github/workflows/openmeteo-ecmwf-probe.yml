name: Open-Meteo ECMWF coverage probe

on:
  push:
    branches:
      - research/openmeteo-ecmwf-probe-20261006
    paths:
      - ".github/workflows/openmeteo-ecmwf-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe Open-Meteo archived ECMWF paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request

          def get(base, params):
              url = base + "?" + urllib.parse.urlencode(params, safe=",:")
              req = urllib.request.Request(url, headers={"User-Agent":"BlinQ-OpenMeteo-Probe/1.0"})
              with urllib.request.urlopen(req, timeout=90) as r:
                  body = r.read().decode("utf-8")
                  status = r.status
              data = json.loads(body)
              if "error" in data and data.get("error"):
                  raise RuntimeError(f"API error {url}: {data}")
              return url, status, data

          variables = [
              "temperature_2m","relative_humidity_2m","precipitation",
              "pressure_msl","cloud_cover","wind_speed_10m",
              "wind_direction_10m","wind_gusts_10m"
          ]

          result = {"single_runs": [], "previous_runs": [], "historical_forecast": []}

          single_cases = [
              ("Wimbledon","51.4343","-0.2145","2025-07-01T00:00"),
              ("Madrid","40.4168","-3.7038","2025-04-20T00:00"),
              ("Melbourne","-37.8136","144.9631","2025-01-10T00:00"),
          ]
          for name, lat, lon, run in single_cases:
              url, status, data = get("https://single-runs-api.open-meteo.com/v1/forecast", {
                  "latitude":lat, "longitude":lon, "run":run,
                  "models":"ecmwf_ifs", "hourly":",".join(variables),
                  "forecast_hours":"72", "timezone":"GMT"
              })
              hourly = data.get("hourly") or {}
              checks = {}
              for v in variables:
                  vals = hourly.get(v) or []
                  checks[v] = {
                      "count": len(vals),
                      "non_null": sum(x is not None for x in vals)
                  }
              ok = all(v["non_null"] >= 24 for v in checks.values())
              result["single_runs"].append({"case":name,"run":run,"status":status,"ok":ok,"checks":checks,"url":url})
              if not ok:
                  raise RuntimeError(f"Single Runs probe insufficient for {name}: {checks}")

          prev_vars = []
          for base in ["temperature_2m","relative_humidity_2m","precipitation","pressure_msl","cloud_cover","wind_speed_10m","wind_direction_10m"]:
              prev_vars += [f"{base}_previous_day1", f"{base}_previous_day2"]

          url, status, data = get("https://previous-runs-api.open-meteo.com/v1/forecast", {
              "latitude":"51.4343", "longitude":"-0.2145",
              "models":"ecmwf_ifs", "hourly":",".join(prev_vars),
              "start_date":"2025-07-01", "end_date":"2025-07-03",
              "timezone":"GMT"
          })
          hourly = data.get("hourly") or {}
          checks = {v:{"count":len(hourly.get(v) or []),"non_null":sum(x is not None for x in (hourly.get(v) or []))} for v in prev_vars}
          ok = all(v["non_null"] >= 24 for v in checks.values())
          result["previous_runs"].append({"case":"Wimbledon-2025-fixed-lead-24h-48h","status":status,"ok":ok,"checks":checks,"url":url})
          if not ok:
              raise RuntimeError(f"Previous Runs probe insufficient: {checks}")

          # Older coverage sanity check. This is NOT a leakage-safe fixed-lead forecast;
          # it only verifies that Open-Meteo has a historical stitched forecast series.
          url, status, data = get("https://historical-forecast-api.open-meteo.com/v1/forecast", {
              "latitude":"51.4343", "longitude":"-0.2145",
              "models":"ecmwf_ifs", "hourly":",".join(variables),
              "start_date":"2023-07-01", "end_date":"2023-07-03",
              "timezone":"GMT"
          })
          hourly = data.get("hourly") or {}
          checks = {v:{"count":len(hourly.get(v) or []),"non_null":sum(x is not None for x in (hourly.get(v) or []))} for v in variables}
          result["historical_forecast"].append({"case":"Wimbledon-2023-stitched","status":status,"checks":checks,"url":url})

          with open("openmeteo-ecmwf-probe.json","w",encoding="utf-8") as f:
              json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: openmeteo-ecmwf-probe
          path: openmeteo-ecmwf-probe.json
          retention-days: 14
