name: Audit historical season staging vs authoritative CDB (read only)

on:
  pull_request:
    paths:
      - ".github/workflows/audit-test-branch-season-cdb-delta.yml"
      - "scripts/audit_legacy_season_against_current_cdb.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: blinq-season-cdb-readonly-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Exact overlap and conflict audit, no CDB write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      SOURCE_REF: d48bd300b1bc42534571ebbe5af3b8d1b02481ad
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install pinned project dependencies and check audit script
        run: |
          set -euo pipefail
          python -m pip install --retries 5 --timeout 60 -r api/requirements.txt -r api/requirements-train.txt
          python -m compileall -q scripts/audit_legacy_season_against_current_cdb.py
      - name: Verify immutable private source stage and manifest
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"
          mkdir -p .cache/tbt/season-branch/source
          for name in manifest.json season_compact.csv; do
            gh api -H "Accept: application/vnd.github.raw"               "repos/$TBT_DATA_REPOSITORY/contents/staging/season-2021-2026/$name?ref=$SOURCE_REF"               > ".cache/tbt/season-branch/source/$name"
            test -s ".cache/tbt/season-branch/source/$name"
          done
      - name: Download authoritative checksum-verified CDB
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",
                       Path(".cache/tbt/season-branch/history")).download(
                       require_bundle_manifest=True)
          PY
      - name: Compare every stage ID and every observed field without canonical writes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_legacy_season_against_current_cdb.py             --history-dir .cache/tbt/season-branch/history             --stage-csv .cache/tbt/season-branch/source/season_compact.csv             --manifest .cache/tbt/season-branch/source/manifest.json             --output .cache/tbt/season-branch/read-only-report.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(".cache/tbt/season-branch/read-only-report.json").read_text())
          assert r["status"]=="verified_read_only_no_write"
          assert r["source_rows"]==11689
          assert not r["canonical_write_authorized"] and not r["canonical_mutated"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Archived season 2021–2026 source vs CDB\n\n")
              f.write("Read-only, no writer lock or production model changes.\n")
              f.write(f"Canonical rows: {r['canonical_matches']}; staged rows: {r['source_rows']}\n")
              for key,value in r["counts"].items():
                  f.write(f"- {key}: {value}\n")
              f.write("\nSource identity and legal/provenance gates are still required before any import.\n")
          PY
      - name: Upload counts-only QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-season-stage-current-cdb-audit-${{ github.run_id }}
          path: .cache/tbt/season-branch/read-only-report.json
          if-no-files-found: warn
          retention-days: 30
