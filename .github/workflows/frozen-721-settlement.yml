name: Frozen 7.2.1 private shadow settlement from canonical CDB

# One-shot on installation, then dispatched by existing external match-status
# clock once every two UTC hours. No new Github cron, no paid sports API calls.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/frozen-721-settlement.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-frozen-721-private-settlement
  cancel-in-progress: false

jobs:
  settle:
    if: github.repository == 'BackstageTalks/tbt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      PYTHONPATH: api:scripts
      PYTHONUNBUFFERED: '1'
      BLINQ_RAPIDAPI_MAX_RPS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Require private repository, canonical budget and no provider credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$TBT_DATA_REPOSITORY" = 'BackstageTalks/tbt-data'
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility --jq '.visibility')" = PRIVATE
          test -z "${RAPIDAPI_KEY:-}"
          test -z "${PROPLINE_API_KEY:-}"
      - name: Install offline audited runtime
        run: python -m pip install -r api/requirements-train.txt pytest
      - name: Check paired result settlement and checksum guards
        run: |
          python -m pytest -q \
            tests/test_settle_frozen_721_shadow.py \
            tests/test_frozen_721_research.py \
            tests/test_frozen_721_shadow_capture.py
      - name: Settle original 7.2.1 predictions from independently verified canonical results
        run: |
          set -euo pipefail
          python scripts/settle_frozen_721_shadow.py \
            --data-repository "$TBT_DATA_REPOSITORY" \
            --out .cache/tbt/frozen-721-settlement-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('.cache/tbt/frozen-721-settlement-status.json').read_text())
          assert value['status'] in {
              'NO_PENDING_SHADOW_MATCHES',
              'WAITING_FOR_VERIFIED_CANONICAL_RESULTS',
              'NO_NEW_VERIFIED_SETTLEMENTS',
              'VERIFIED_SETTLEMENT_PUBLISHED',
          }
          assert value.get('provider_requests') == 0
          assert value.get('production_mutated') is False
          if value['status'] == 'VERIFIED_SETTLEMENT_PUBLISHED':
              assert value['remote_readback'] == 'VERIFIED'
              assert value['new_settled'] + value['new_void'] + value['new_excluded'] > 0
          print('Frozen 7.2.1 post-issue settlement:', value['status'])
          PY
      - name: Save non-sensitive settlement audit counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-721-settlement-${{ github.run_id }}
          path: .cache/tbt/frozen-721-settlement-status.json
          if-no-files-found: warn
          retention-days: 14
      - name: Always release own global writer lock, never touch other owner's lock
        if: always()
        run: |
          python scripts/cdb_global_writer_lock.py release \
            --state-file .cache/tbt/frozen-721-settlement/research-global-lock.json \
            --if-held
