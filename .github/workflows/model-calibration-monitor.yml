name: BlinQ private model calibration monitor

# Read-only GitHub evidence, signed durable Admin status. Never train/promote.
on:
  workflow_dispatch:

# External scheduler owns the Match Status cadence. The existing status job
# dispatches this read-only monitor every six hours; repository cron is banned.

permissions:
  contents: read

concurrency:
  group: blinq-model-calibration-status
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
      BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify private read-only monitor credentials
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Data repository read token missing'; exit 1; }
          test -n "$BLINQ_LIVE_WORKER_TOKEN" || { echo 'Worker token missing'; exit 1; }
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = PRIVATE
      - name: Install offline read-only canonical scanner
        run: python -m pip install -r api/requirements-train.txt
      - name: Validate model-pair snapshot invariants
        run: python -m unittest discover -s tests -p test_model_calibration_status.py -v
      - name: Count fresh unseen settled canonical matches (no provider calls)
        run: |
          set -euo pipefail
          python scripts/model_promotion_readiness.py --data-repository "$TBT_DATA_REPOSITORY" --out /tmp/fresh-model-readiness.json
          test -s /tmp/fresh-model-readiness.json
      - name: Synchronize current model-pair progress to private Azure Admin
        run: |
          set -euo pipefail
          python scripts/publish_model_calibration_status.py --readiness-file /tmp/fresh-model-readiness.json --output /tmp/calibration-status.json
          # Read-back confirmation is returned by authenticated Azure backend.
          test -s /tmp/calibration-status.json
