name: One-time guarded TennisExplorer ATP 2025 source resume

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/blinq-once-retry-txe-2025.yml

permissions:
  actions: write
  contents: read

concurrency:
  # Coordinate with the real recovery collect job; never run concurrently.
  group: blinq-cdb-shard-txe-atp-single-2025
  cancel-in-progress: false

jobs:
  dispatch:
    if: startsWith(github.event.head_commit.message, 'One-time safe resume TennisExplorer ATP singles 2025')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify failure and absence of an active duplicate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/BackstageTalks/tbt/actions/runs/38072165397 --jq .conclusion)" = failure
          ACTIVE_ORIGINAL=$(gh api 'repos/BackstageTalks/tbt/actions/runs/37987229156/jobs?per_page=100' --jq '[.jobs[] | select(.status == "in_progress" and (.name | contains("atp-single, 2025")))] | length')
          if [[ "$ACTIVE_ORIGINAL" != "0" ]]; then
            echo 'Original 2025 single shard is active; refusing duplicate collection'
            exit 2
          fi
          ACTIVE_RECOVERY=$(gh api 'repos/BackstageTalks/tbt/actions/runs?status=in_progress&per_page=100' --jq '[.workflow_runs[] | select(.workflow_id == 380516645)] | length')
          if [[ "$ACTIVE_RECOVERY" != "0" ]]; then
            echo 'A recovery run is already active; refusing duplicate dispatch'
            exit 2
          fi
      - name: Require existing private source checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          ASSETS=$(gh api repos/BackstageTalks/tbt-data/releases/tags/blinq-tennisexplorer-cloud-20261009 --jq '[.assets[] | select(.name == "txe-retry-atp-single-2025-38053522176-1.tar.gz" and .size > 1000000 and (.digest | startswith("sha256:")))] | length')
          if [[ "$ASSETS" != "1" ]]; then
            echo 'Missing expected private checkpoint / SHA-256 metadata; refusing restart'
            exit 2
          fi
      - name: Dispatch exactly one 60-minute bounded 2025 source resume
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run blinq-cdb-shard-autorecovery.yml --repo BackstageTalks/tbt --ref main -f task=txe-atp-single-2025 -f iteration=3
          echo 'Requested one checkpoint-based source-only resume: txe-atp-single-2025 iteration 3; no CDB / training / model changes'
