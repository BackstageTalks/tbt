name: Complete 2026-10-14 morning prediction publication

on:
  workflow_run:
    workflows: ["Tennis data and predictions"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  deploy-verified-morning-candidate:
    # One-shot incident recovery. Never deploy unrelated workflows or retries.
    if: >-
      github.event.workflow_run.id == 38511038538 &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == '37b855994d2788c001faf08c95de1011cd5d800d'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
    steps:
      - name: Independently verify refreshed private release
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATA_TOKEN" || { echo '::error::Private data token missing'; exit 1; }
          api="repos/$TBT_DATA_REPOSITORY/releases/tags/tbt-predictions-v1"
          updated="$(GH_TOKEN="$DATA_TOKEN" gh api "$api" --jq '.assets[] | select(.name=="feed.json") | .updated_at')"
          test -n "$updated" || { echo '::error::Published feed missing'; exit 1; }
          updated_epoch="$(date -u -d "$updated" +%s)"
          child_start="$(date -u -d '2026-10-14T04:22:19Z' +%s)"
          if (( updated_epoch < child_start )); then
            echo "::error::No post-recovery feed was published ($updated)."; exit 1
          fi
          mkdir -p /tmp/morning-recovery
          GH_TOKEN="$DATA_TOKEN" gh release download tbt-predictions-v1 -R "$TBT_DATA_REPOSITORY" -p feed.json -D /tmp/morning-recovery
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p=json.loads(Path('/tmp/morning-recovery/feed.json').read_text(encoding='utf-8'))
          generated=datetime.fromisoformat(str(p['generated_at']).replace('Z','+00:00'))
          zone=ZoneInfo('Europe/Bratislava')
          def betting_day(t):
              local=t.astimezone(zone)
              return (local.date()-timedelta(days=1)).isoformat() if local.hour<6 else local.date().isoformat()
          today='2026-10-14'
          assert betting_day(generated)==today, 'Candidate timestamp belongs to a different betting day'
          keys=('top_daily_picks','prime_picks','value_picks','doubles_picks','ace_picks','sg_picks')
          counts={}
          for key in keys:
              n=0
              for row in p.get(key,[]):
                  if not isinstance(row,dict): continue
                  explicit=str(row.get('betting_day') or (row.get('betting') or {}).get('betting_day') or '')
                  day=explicit
                  if not day:
                      raw=row.get('scheduled_at') or row.get('start_at') or row.get('start_time') or row.get('date')
                      if raw:
                          day=betting_day(datetime.fromisoformat(str(raw).replace('Z','+00:00')))
                  if day==today: n+=1
              counts[key]=n
          print('VERIFIED_RELEASE_FEED',json.dumps({
              'generated_at':p['generated_at'],'daily_offer_day':today,
              'counts':counts,'current_day_total':sum(counts.values())
          },sort_keys=True))
          PY
      - name: Dispatch existing no-provider deploy-current on freshest main
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run data.yml --repo BackstageTalks/tbt --ref main \
            -f mode=deploy-current -f max_requests=1 -f promote=false
          echo 'Guarded deploy-current dispatched from current main; no provider requests or model promotion.'
