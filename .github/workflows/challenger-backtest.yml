name: Challenger backtest

on:
  workflow_dispatch:

jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt

      - name: Compile
        run: |
          python -m compileall -q api scripts

      - name: Run challenger backtest
        env:
          PYTHONPATH: api
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/challenger_backtest.py

      - name: Upload challenger report
        uses: actions/upload-artifact@v4
        with:
          name: challenger-backtest-report
          path: reports/challenger_backtest.json
          if-no-files-found: error
