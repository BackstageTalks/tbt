name: Manual TennisAPI statistics backfill (3000 cap)
on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Maximum billable HTTP attempts (hard cap 3000)"
        required: true
        default: "3000"
        type: choice
        options: ["500", "1000", "2000", "3000"]
      max_runtime_minutes:
        description: "Stop before quota reset; maximum 105 minutes"
        required: true
        default: "105"
        type: choice
        options: ["30", "60", "90", "105"]
permissions:
  contents: read
concurrency:
  group: tbt-tennisapi-statistics-backfill
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install dependencies and validate
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q scripts/manual_statistics_backfill.py
          test -n "$GH_TOKEN" && test -n "$RAPIDAPI_KEY"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = PRIVATE
      - name: Fetch missing statistics with hard request cap
        env:
          MAX_REQUESTS: ${{ inputs.max_requests }}
          MAX_RUNTIME: ${{ inputs.max_runtime_minutes }}
        run: |
          python scripts/manual_statistics_backfill.py --max-requests "$MAX_REQUESTS" --max-runtime-minutes "$MAX_RUNTIME"
      - name: Summary
        if: always()
        run: |
          if test -f .cache/tbt/manual-statistics/report.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d=json.loads(Path(".cache/tbt/manual-statistics/report.json").read_text())
          print("# TennisAPI statistics backfill")
          for k,v in d.items(): print(f"- {k}: {v}")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-statistics-backfill-${{ github.run_id }}
          path: |
            .cache/tbt/manual-statistics/report.json
            .cache/tbt/manual-statistics/responses.jsonl
          if-no-files-found: warn
          retention-days: 3
