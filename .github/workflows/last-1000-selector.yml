name: BlinQ last-1000 selector research

on:
  push:
    branches: ['research/last-1000-selection-optimization']
    paths:
      - 'scripts/audit_last_1000_selector.py'
      - '.github/workflows/last-1000-selector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run read-only chronological selector research
        run: python -u scripts/audit_last_1000_selector.py --data-repository "$TBT_DATA_REPOSITORY"
      - name: Preserve research evidence
        if: always()
        run: |
          python - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          source=Path('.cache/tbt/last-1000-selector/report.json')
          if not source.exists():
              raise SystemExit(0)
          repo=os.environ['TBT_DATA_REPOSITORY']
          target='audit/last-1000-selector-latest.json'
          lookup=subprocess.run(['gh','api',f'repos/{repo}/contents/{target}'],capture_output=True,text=True)
          body={'message':'Read-only last-1000 selector optimization evidence',
                'content':base64.b64encode(source.read_bytes()).decode()}
          if lookup.returncode==0:
              body['sha']=json.loads(lookup.stdout)['sha']
          elif '404' not in lookup.stderr:
              raise RuntimeError('Cannot safely inspect audit target')
          payload=Path('/tmp/last-1000-selector.json')
          payload.write_text(json.dumps(body))
          subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{target}','--input',str(payload)],check=True,stdout=subprocess.DEVNULL)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinq-last-1000-selector-${{ github.run_id }}
          path: .cache/tbt/last-1000-selector/report.json
          if-no-files-found: warn
