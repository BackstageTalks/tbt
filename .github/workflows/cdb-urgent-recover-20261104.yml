name: One-shot guarded CDB recovery and pre-reset statistics 2026-11-04
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cdb-urgent-recover-20261104.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: tbt-emergency-cdb-integrity-20261104
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing history audit dependencies
        run: python -m pip install -r api/requirements-train.txt
      - name: Acquire canonical cross-repository single writer
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python scripts/cdb_global_writer_lock.py acquire --wait-seconds 900
      - name: Repair only independently verified 2022 release metadata under canonical writer lock
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, uuid
          from pathlib import Path
          from release_store import ReleaseStore
          from repair_history_bundle_integrity import repair_bundle_manifest
          from repair_missing_history_manifest import _partition_meta
          from audit_history_data import audit_partition, _duplicate_details
          from tbt.data.history_snapshot import write_manifest
          from cdb_global_writer_lock import verify

          verify("BackstageTalks/tbt-data", Path(".cdb-global-writer-lock.json"))
          root = Path(".cache/tbt/emergency-integrity-20261104")
          root.mkdir(parents=True, exist_ok=True)
          store = ReleaseStore("BackstageTalks/tbt-data", "tbt-data-v1", root)
          inventory = store._release_asset_inventory()
          rollback = [n for n in inventory if n.startswith(("blinq-rollback-", "blinq-candidate-"))]
          journals = [n for n in inventory if re.fullmatch(r"blinq-txn-[0-9a-f]{32}\.json", n)]
          if rollback or len(journals) > 1:
              raise SystemExit(f"Unresolved CDB transaction assets: {rollback}, journals={journals}")
          for name in journals:
              store._download_asset(name)
              if not store._verified_asset(inventory, name, root/name):
                  raise SystemExit("Journal digest mismatch")
              j = json.loads((root/name).read_text())
              if j.get("created") != [] or not re.fullmatch(r"[0-9a-f]{64}", str(j.get("target_bundle_sha256",""))):
                  raise SystemExit("Unrecognized transaction journal: manual review required")
          trusted = {
              "history-2022.parquet": "3062e6c58ef779791326b26b2ba1634c4f2c487493c5f7af4dbbfb1cc6fafe84",
              "history-2026.parquet": "8198d6f5e2c1938bdbda11e1216d1cf828ee38ea0e2ce392dd1142a62bb492a3",
          }
          for asset, sha in trusted.items():
              if inventory.get(asset, {}).get("digest") != "sha256:" + sha:
                  raise SystemExit("Unrecognized changed partition: " + asset)
          store._download_asset("history_manifest.json")
          store._download_asset(store.BUNDLE_MANIFEST)
          manifest_path = root/"history_manifest.json"
          bundle_path = root/store.BUNDLE_MANIFEST
          if not store._verified_asset(inventory, "history_manifest.json", manifest_path):
              raise SystemExit("Manifest not independently verified")
          if not store._verified_asset(inventory, store.BUNDLE_MANIFEST, bundle_path):
              raise SystemExit("Checksum inventory not independently verified")
          old = json.loads(manifest_path.read_text())
          years = old.get("years")
          if not isinstance(years, dict) or not {"2022","2026"}.issubset(years):
              raise SystemExit("Missing authoritative 2022 or 2026 year")
          bundle = json.loads(bundle_path.read_text()).get("files")
          if not isinstance(bundle, dict):
              raise SystemExit("Invalid existing checksum inventory")
          expected = set()
          year_mismatches = []
          for year, meta in years.items():
              if not isinstance(meta, dict):
                  raise SystemExit("Invalid year metadata")
              asset = str(meta.get("asset") or f"history-{int(year):04d}.parquet")
              if not re.fullmatch(r"history-\d{4}\.parquet",asset) or asset not in inventory:
                  raise SystemExit("Missing or invalid history asset "+asset)
              expected.add(asset)
              if inventory[asset].get("digest") != "sha256:"+str(meta.get("sha256","")) or int(inventory[asset].get("size") or -1) != int(meta.get("bytes") or -1):
                  year_mismatches.append(asset)
          if set(year_mismatches) != set(trusted):
              raise SystemExit("Unexpected year mismatches: " + ",".join(sorted(year_mismatches)))
          actual = {n for n in inventory if re.fullmatch(r"history-\d{4}\.parquet", n)}
          if actual != expected:
              raise SystemExit("Missing or extra history years")
          bundle_mismatches = []
          for asset, meta in bundle.items():
              if not isinstance(meta, dict) or asset not in inventory:
                  raise SystemExit("Unrelated checksum inventory missing asset: "+asset)
              if inventory[asset].get("digest") != "sha256:"+str(meta.get("sha256","")) or int(inventory[asset].get("size") or -1) != int(meta.get("bytes") or -1):
                  bundle_mismatches.append(asset)
          if set(bundle_mismatches) != set(trusted):
              raise SystemExit("Unexpected checksum mismatches: " + ",".join(sorted(bundle_mismatches)))
          verified_rows = {}
          identities = []
          # Both changed partitions must pass full row validity and identity audits.
          for name, sha in trusted.items():
              store._download_asset(name)
              file_path = root/name
              if store._sha256(file_path) != sha or file_path.stat().st_size != int(inventory[name]["size"]):
                  raise SystemExit("Actual bytes failed independent SHA/size: "+name)
              summary, issues, partition_identities = audit_partition(file_path)
              if summary.get("fatal") or issues:
                  raise SystemExit("Partition identity/schema audit failed: "+name)
              identities.extend(partition_identities)
              year = int(name.split("-")[1].split(".")[0])
              meta = _partition_meta(file_path, year)
              prior = years[str(year)]
              if type(prior.get("rows")) is not int or meta["rows"] < prior["rows"]:
                  raise SystemExit("Year row regression: "+name)
              if meta["history_start"] > str(prior.get("history_start", meta["history_start"])) or meta["history_end"] < str(prior.get("history_end", meta["history_end"])):
                  raise SystemExit("Year coverage regression: "+name)
              years[str(year)] = {**prior, **{k:meta[k] for k in ("rows","history_start","history_end","sha256","bytes")}}
              verified_rows[str(year)] = {"before":prior["rows"],"after":meta["rows"],"sha256":sha}
          if _duplicate_details(identities, "match_id", "duplicate_match_id") or _duplicate_details(identities, "provider_event_id", "duplicate_provider_event_id"):
              raise SystemExit("Duplicate identity in changed partitions")
          prior_path = root/"pre-repair-history_manifest.json"
          prior_path.write_bytes(manifest_path.read_bytes())
          old["years"] = years
          write_manifest(root, old)
          (root/"preflight.json").write_text(json.dumps({"status":"validated","year_count":len(years),"changed_years":verified_rows,"journal_count":len(journals)},indent=2))
          swap = None
          bundle_published = False
          try:
              swap = store._guarded_publish(manifest_path, uuid.uuid4().hex)
              repair_bundle_manifest(store)
              bundle_published = True
              # A fresh independent download must verify all current history assets.
              from tempfile import TemporaryDirectory
              with TemporaryDirectory() as temp:
                  reader = ReleaseStore(store.repository, store.tag, Path(temp))
                  reader.download(require_bundle_manifest=True)
          except Exception:
              # A committed checksum bundle and its published manifest must stay paired.
              if swap is not None and not bundle_published:
                  store._rollback_guarded([swap])
              raise
          if swap is not None:
              store._cleanup_guarded([swap])
          # Only a verified committed generation can retire an old empty journal.
          if journals:
              recovery = store.recover_interrupted_swaps()
              if recovery.get("pending_transactions") != 1:
                  raise SystemExit("Unexpected journal recovery result")
          # Drop checksum references to old rollback aliases and retired journal.
          repair_bundle_manifest(store)
          print("CDB_METADATA_REPAIRED_AND_VERIFIED",verified_rows,flush=True)
          PY
      - name: Independent strict full CDB readback before any paid API dispatch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from release_store import ReleaseStore
          from cdb_global_writer_lock import verify
          verify("BackstageTalks/tbt-data", Path(".cdb-global-writer-lock.json"))
          store=ReleaseStore("BackstageTalks/tbt-data","tbt-data-v1",Path(".cache/tbt/emergency-independent-readback"))
          chosen=store.download(require_bundle_manifest=True)
          active=store._release_asset_inventory()
          if any(n.startswith(("blinq-txn-","blinq-rollback-","blinq-candidate-")) for n in active):
              raise SystemExit("Transaction debris remains: no API dispatch")
          print("CDB_STRICT_READBACK_PASS",len(chosen),flush=True)
          PY
      - name: Preserve minimal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdb-urgent-integrity-preflight-20261104
          path: .cache/tbt/emergency-integrity-20261104/preflight.json
          if-no-files-found: warn
      - name: Release only this run's exact canonical writer lock
        if: always()
        run: python scripts/cdb_global_writer_lock.py release --if-held
      - name: Read authoritative shared budget and dispatch one existing provider-native import
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
          WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys, urllib.request
          from datetime import datetime, timezone
          cutoff=datetime(2026,11,4,17,7,tzinfo=timezone.utc)
          if datetime.now(timezone.utc)>=cutoff:
              print("CUTOFF_REACHED no paid dispatch"); sys.exit(0)
          url=os.environ["BUDGET_URL"]; token=os.environ["WORKER_TOKEN"]
          if not url.startswith("https://") or not token:
              raise SystemExit("Budget endpoint unavailable: fail closed")
          req=urllib.request.Request(url,headers={"X-Blinq-Worker-Token":token},method="GET")
          with urllib.request.urlopen(req,timeout=15) as response: result=json.load(response)
          b=result.get("budget")
          if result.get("ok") is not True or not isinstance(b,dict) or b.get("global_limit")!=14500 or b.get("provider_plan_limit")!=15000 or b.get("reserved_provider_headroom")!=500 or b.get("window")!="provider_day_17_09_utc":
              raise SystemExit("Shared budget contract failed")
          spent=int(b["global_spent"])
          allowed=max(0,min(5000,14250-spent,int(b["global_remaining"]),int(b["remaining"]["history"])))
          print(f"QUOTA_CHECK spent={spent} target=14250 available_for_one_run={allowed}",flush=True)
          if allowed<=0: sys.exit(0)
          args=["gh","workflow","run","data.yml","-R","BackstageTalks/tbt","--ref","main",
                "-f","mode=statistics","-f",f"max_requests={allowed}",
                "-f","hourly_autofill=true","-f","autofill_stop_at_utc=2026-11-04T17:07:00Z",
                "-f","promote=false","-f","propline_max_events=0"]
          subprocess.run(args,check=True)
          print(f"EXISTING_GUARDED_CDB_STATISTICS_DISPATCHED max_requests={allowed} 95pct_target=14250",flush=True)
          PY
