name: BlinQ read-only champion vs challenger shadow audit
run-name: "Model Lab audit ${{ inputs.request_id || github.run_id }}"
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/model-shadow-evaluation-readonly.yml
      - scripts/audit_model_shadow_readonly.py
      - scripts/audit_frozen_721_segments.py
      - tests/test_audit_frozen_721_segments.py
      - api/tbt/services/shadow_calibration_research.py
      - tests/test_audit_model_shadow_readonly.py
      - tests/test_shadow_calibration_research.py
  workflow_dispatch:
    inputs:
      request_id:
        description: Admin Model Lab correlation (optional)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: blinq-model-shadow-readonly
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing model dependencies
        run: python -m pip install -r api/requirements-train.txt pytest
      - name: Run read-only shadow integrity and evaluation unit tests
        run: python -m pytest tests/test_audit_model_shadow_readonly.py tests/test_shadow_calibration_research.py tests/test_shadow_evaluation.py tests/test_audit_721_top_market.py tests/test_audit_711_top_value_shadow.py tests/test_audit_frozen_721_segments.py -q
      - name: Independently read current champion, challenger and private issued shadow ledger
        run: python scripts/audit_model_shadow_readonly.py --out .cache/tbt/model-shadow-audit/report.json
      - name: Independently validate model-only gate and report exact immutable pair
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          path=Path('.cache/tbt/model-shadow-audit/report.json')
          r=json.loads(path.read_text())
          source=r['sources']
          for field in ('champion_sha256', 'challenger_sha256', 'shadow_ledger_sha256'):
              if not re.fullmatch(r'[0-9a-f]{64}', str(source.get(field) or '')):
                  raise ValueError('Model audit missing exact evidence digest: '+field)
          if source['champion_sha256']==source['challenger_sha256']:
              raise ValueError('Champion and challenger have identical artifact digests')
          metrics=r['overall']
          n=r['cohort']['settled']
          if r['status']!='EVALUATED' or n < 200:
              raise ValueError('Current same-event shadow evaluation lacks model-quality sample')
          for field in ('champion','challenger'):
              if metrics[field]['n']!=n:
                  raise ValueError('Shadow models do not have identical settled population')
          quality_pass=r['gate'].get('ready_for_promotion_review') is True
          # Even a passing shadow is only model-quality evidence, not permission to
          # bypass Elo, fresh PIT, operator approval or atomic release controller.
          decision={
              'schema': 1, 'kind': 'READ_ONLY_MODEL_QUALITY_DECISION',
              'status': 'REVIEW_ONLY_SHADOW_QUALITY_PASS' if quality_pass else 'NO_GO_SHADOW_QUALITY',
              'candidate_promoted': False, 'production_mutated': False,
              'provider_requests': 0,
              'production_version': r['production_model_version'],
              'candidate_version': r['challenger_model_version'],
              'settled_same_event': n, 'captured':r['cohort']['captured'],
              'settled_utc_days':r['cohort']['settled_utc_days'],
              'champion':metrics['champion'], 'candidate':metrics['challenger'],
              'gate':r['gate'], 'release_screen':r['release_screen'],
              'uncertainty':r['paired_uncertainty'], 'sources':source,
              'blockers':[
                  'same_event_shadow_quality_not_better' if not quality_pass else
                  'independent_canonical_Elo_and_operator_release_gates_not_evaluated',
                  'prospective_asof_15m_and_current_serving_readback_not_independently_verified',
              ],
          }
          output=Path('.cache/tbt/model-shadow-audit/model-quality-decision.json')
          output.write_text(json.dumps(decision,indent=2,sort_keys=True,allow_nan=False)+'\n')
          lines=[
              '### Immutable champion/challenger model-quality checkpoint',
              f"Decision: {decision['status']}; promotion: NEVER by research workflow",
              f"Champion: {decision['production_version']} ({source['champion_sha256']})",
              f"Challenger: {decision['candidate_version']} ({source['challenger_sha256']})",
              f"Same-event settled: {n}/{decision['captured']} across {decision['settled_utc_days']} UTC days",
              f"Champion: {metrics['champion']}",
              f"Challenger: {metrics['challenger']}",
              f"Model-only shadow gate: {r['gate']}",
              f"ATP/WTA paired uncertainty: {r['paired_uncertainty']}",
              'Market TOP/PRIME/value research intentionally separate: no price/odds/EV promotion gate.',
              'No CDB write, model fit, provider call, candidate/champion promotion or deploy.',
          ]
          print('\n'.join(lines))
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n')
          PY
      - name: Keep verified private-only aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-model-shadow-audit-${{ github.run_id }}
          path: |
            .cache/tbt/model-shadow-audit/report.json
            .cache/tbt/model-shadow-audit/model-quality-decision.json
          if-no-files-found: warn
          retention-days: 14
