name: Temporary verify deployed Results runtime

on:
  push:
    branches:
      - ops/verify-results-live-4648c345

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      BLINQ_BASE_URL: ${{ vars.TBT_PRODUCTION_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
      BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the exact serving feed used by production deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python scripts/prepare_feed.py
          test -s api/data/feed.json

      - name: Fetch exact live deployment and fresh status snapshot
        shell: bash
        run: |
          set -euo pipefail
          base="${BLINQ_BASE_URL%/}"
          curl -fsSL -H 'Cache-Control: no-cache' "$base/deployment.json?verify=$GITHUB_SHA" -o /tmp/deployment.json
          curl -fsSL -H 'Cache-Control: no-cache' "$base/api/v1/ui-config?verify=$GITHUB_SHA" -o /tmp/ui.json
          curl -fsSL --max-time 120 -X POST \
            -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN" \
            "$base/api/v1/internal/match-status-worker" -o /tmp/status.json

      - name: Assert live Results overlay is nonzero on exact deployed feed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from tbt.services.feed import read_feed, visible_feed
          from tbt.services.entitlements import filter_feed_for_access
          from tbt.services.match_status import event_ids_from_feed, runtime_settled_results

          expected='4648c34520fe3628d699744db842b5ed8a0cf8c4'
          deployment=json.load(open('/tmp/deployment.json',encoding='utf-8'))
          assert deployment.get('git_sha') == expected, deployment
          ui_doc=json.load(open('/tmp/ui.json',encoding='utf-8'))
          ui=ui_doc.get('config') or {}
          snapshot=json.load(open('/tmp/status.json',encoding='utf-8'))
          statuses=snapshot.get('statuses') or {}
          feed=visible_feed(read_feed('api/data/feed.json'),now=datetime.now(timezone.utc))
          access={'id':'prod-verify','status':'active','plan':'admin','is_admin':True,'role':'admin'}
          data,ent=filter_feed_for_access(feed,access,ui)
          allowed=event_ids_from_feed(data)
          selected={str(k):v for k,v in statuses.items() if str(k) in allowed and isinstance(v,dict)}
          data['results']=runtime_settled_results(data,selected)
          runtime=[
              r for r in data.get('results',[])
              if isinstance(r,dict) and r.get('runtime_result_overlay')
          ]
          settled=sum(
              1 for row in runtime
              for pub in (row.get('market_publications') or [])
              if isinstance(pub,dict)
              and isinstance(pub.get('result'),dict)
              and pub['result'].get('runtime_source')=='match_status_snapshot'
          )
          summary={
              'deployment_sha':deployment.get('git_sha'),
              'daily_pick_count':ent.get('daily_pick_count'),
              'worker_tracked':snapshot.get('tracked'),
              'worker_terminal':snapshot.get('terminal'),
              'matched_terminal_statuses':len(selected),
              'runtime_rows':len(runtime),
              'runtime_settled_publications':settled,
          }
          print('LIVE_RESULTS_VERIFY',json.dumps(summary,sort_keys=True))
          assert ent.get('daily_pick_count') == 64, summary
          assert len(selected) >= 31, summary
          assert len(runtime) >= 31, summary
          assert settled >= 31, summary
          PY
