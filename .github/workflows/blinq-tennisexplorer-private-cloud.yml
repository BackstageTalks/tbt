name: BlinQ TennisExplorer cloud collector (private checkpoint release)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/blinq-tennisexplorer-private-cloud.yml
  workflow_dispatch:
    inputs:
      coverage:
        description: "future = years beyond local PC progress; all = 1998-2026"
        type: choice
        required: true
        default: future
        options: [future, all]

permissions:
  contents: read

concurrency:
  group: blinq-tennisexplorer-private-cloud
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      DATA_REPO: BackstageTalks/tbt-data
      RELEASE: blinq-tennisexplorer-cloud-20261009
      COVERAGE: ${{ github.event_name == 'push' && 'future' || inputs.coverage }}
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Verify private destination and create durable checkpoint release
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "TBT_DATA_GH_TOKEN secret missing"; exit 1; }
          test "$(gh api "repos/$DATA_REPO" --jq .private)" = "true"
          if gh release view "$RELEASE" --repo "$DATA_REPO" > /dev/null 2>&1; then
            echo "PRIVATE RELEASE EXISTS $RELEASE"
          else
            gh release create "$RELEASE" --repo "$DATA_REPO" --target main \
              --title "BlinQ raw TennisExplorer cloud checkpoints (NOT CDB)" \
              --notes "Source-only year/category checkpoints. These are not production CDB or training data. Validate identities and timing before use."
          fi
      - id: build
        name: Disjoint years, newest first, bounded concurrency
        run: |
          python - <<'PY'
          import json,os
          # Current 2026-10-09 desktop: singles ATP 2001, doubles ATP 2004,
          # singles WTA 2002, doubles WTA 2012. Avoid those in-progress years.
          starts={"atp-single":2004,"atp-double":2007,
                  "wta-single":2005,"wta-double":2015}
          if os.environ["COVERAGE"]=="all":
              starts={k:1998 for k in starts}
          if os.environ["COVERAGE"] not in ("future","all"):
              raise SystemExit("Unsupported coverage")
          shards=[{"category":c,"year":y}
                  for y in range(2026,1997,-1)
                  for c,first in starts.items() if y>=first]
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("matrix="+json.dumps({"include":shards},separators=(",",":"))+"\n")
          print("PLANNED_SHARDS",len(shards),"BOUNDS",starts)
          PY

  probe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Check source reachable from GitHub-hosted runner
        working-directory: source
        run: |
          python - <<'PY'
          import datetime,requests
          from scripts.scrape_tennisexplorer_results_by_category import build_url
          u=build_url("atp-single",datetime.date(2018,1,5))
          r=requests.get(u,timeout=35,headers={
            "User-Agent":"Mozilla/5.0 (compatible; BlinQResearch/1.0; +https://github.com/BackstageTalks/tbt-data)"})
          print("TENNISEXPLORER CLOUD PROBE",r.status_code,len(r.content))
          if r.status_code!=200 or "TennisExplorer" not in r.text:
              raise SystemExit("Upstream unreachable from runner; no shards launched")
          PY

  collect:
    needs: [plan, probe]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      DATA_REPO: BackstageTalks/tbt-data
      RELEASE: blinq-tennisexplorer-cloud-20261009
      CATEGORY: ${{ matrix.category }}
      YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4

      - name: Restore previous private category/year checkpoint
        shell: bash
        run: |
          set -euo pipefail
          asset="txe-$CATEGORY-$YEAR.tar.gz"
          mkdir -p /tmp/checkpoints
          if gh release view "$RELEASE" --repo "$DATA_REPO" --json assets \
               --jq '.assets[].name' | grep -Fx "$asset"; then
            gh release download "$RELEASE" --repo "$DATA_REPO" \
              --pattern "$asset" --dir /tmp/checkpoints
            tar -xzf "/tmp/checkpoints/$asset" -C source
            echo "CHECKPOINT RESUMED $asset"
          else
            echo "NEW CLOUD SHARD $CATEGORY $YEAR"
          fi

      - name: Continue result listings, skipping checkpointed days
        id: results
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          timeout --signal=INT --kill-after=30s 35m python -u scripts/scrape_tennisexplorer_results_by_category.py \
            --category "$CATEGORY" --from-year "$YEAR" --to-year "$YEAR" \
            --delay 1.25 --retries 3 --stop-after-failures 3

      - name: Continue detail data, skipping checkpointed matches
        id: details
        if: steps.results.outcome == 'success'
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          timeout --signal=INT --kill-after=30s 290m python -u scripts/scrape_tennisexplorer_details.py \
            --category "$CATEGORY" --from-year "$YEAR" --to-year "$YEAR" \
            --delay 1.25 --retries 3 --max-consecutive-failures 3

      - name: Package private checkpoint even after collector errors
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import os,tarfile
          from pathlib import Path
          c=os.environ["CATEGORY"]; y=os.environ["YEAR"]
          root=Path("source")
          paths=[]
          for family in ("results","enrichment"):
              paths.extend((root/"data"/"tennisexplorer"/family/c).glob(f"{y}.*"))
          paths=[p for p in sorted(paths) if p.is_file()]
          if not paths:
              raise SystemExit("No source files captured; refusing empty artifact")
          dst=Path("/tmp")/f"txe-{c}-{y}.tar.gz"
          with tarfile.open(dst,"w:gz") as f:
              for p in paths:
                  f.add(p,arcname=p.relative_to(root).as_posix())
          print("CHECKPOINT",dst,"files",len(paths),"bytes",dst.stat().st_size)
          PY
      - name: Publish only into PRIVATE tbt-data release
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          asset="/tmp/txe-$CATEGORY-$YEAR.tar.gz"
          test -s "$asset"
          for attempt in 1 2 3; do
            if gh release upload "$RELEASE" "$asset" --repo "$DATA_REPO" --clobber; then
              echo "PRIVATE CHECKPOINT UPLOADED $CATEGORY $YEAR"
              exit 0
            fi
            sleep $((attempt*15))
          done
          exit 1
      - name: Honest outcome status
        if: always()
        shell: bash
        run: |
          echo "Raw source $CATEGORY $YEAR; private checkpoint release $RELEASE" >> "$GITHUB_STEP_SUMMARY"
          echo "Listings: ${{ steps.results.outcome }}, details: ${{ steps.details.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No production CDB import; no Training DB run." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.results.outcome }}" != "success" || "${{ steps.details.outcome }}" != "success" ]]; then
            echo "UNFINISHED SHARD: future dispatch restores its checkpoint"
            exit 2
          fi
