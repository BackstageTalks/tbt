name: BlinQ Model Factory source preflight

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Durable Admin Model Factory request marker (24 hex chars)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: blinq-model-factory-readonly-preflight
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      PYTHONDONTWRITEBYTECODE: '1'
      BLINQ_RAPIDAPI_MAX_RPS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Verify report contracts without network
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_model_factory_preflight.py
      - name: Verify idle canonical writer and private source access
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          [[ "${{ inputs.request_id }}" =~ ^[0-9a-f]{24}$ ]]
          python scripts/wait_for_cdb_writer_idle.py --max-seconds 7200 --interval-seconds 30
          test "$(gh repo view BackstageTalks/tbt-data --json visibility --jq '.visibility')" = PRIVATE
      - name: Audit canonical ATP/WTA inputs and produce read-only report
        run: python scripts/model_factory_preflight.py
      - name: Save verifiable non-sensitive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-factory-preflight-${{ github.run_id }}
          path: .cache/tbt/model-factory-preflight/report.json
          retention-days: 30
          if-no-files-found: warn
