name: BlinQ alimoh89 license-gated preparation

on:
  pull_request:
    paths:
      - ".github/alimoh89-preparation-request.json"
      - ".github/workflows/alimoh89-preparation.yml"
      - "scripts/prepare_alimoh89_markets.py"
      - "tests/test_alimoh89_preparation.py"
  push:
    branches: [main]
    paths:
      - ".github/alimoh89-preparation-request.json"
      - ".github/workflows/alimoh89-preparation.yml"
      - "scripts/prepare_alimoh89_markets.py"
      - "tests/test_alimoh89_preparation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: blinq-alimoh89-preparation-v2
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      REQUEST_FILE: .github/alimoh89-preparation-request.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Validate license gate and safety
        run: |
          set -euo pipefail
          test "$(jq -r '.mode' "$REQUEST_FILE")" = "prepare-license-gated"
          test "$(jq -r '.source.license_status' "$REQUEST_FILE")" = "review_required_other"
          test "$(jq -r '.safety.canonical_mutation' "$REQUEST_FILE")" = "false"
          test "$(jq -r '.safety.provider_api_requests' "$REQUEST_FILE")" = "0"
          test "$(jq -r '.safety.model_promotion' "$REQUEST_FILE")" = "false"
          test "$(jq -r '.safety.persist_row_level_output' "$REQUEST_FILE")" = "false"

      - name: Install and test preparation adapter
        run: |
          set -euo pipefail
          python -m pip install --retries 8 --timeout 60 -r api/requirements.txt
          python -m pip install --retries 8 --timeout 60 -r api/requirements-train.txt pytest
          python -m compileall -q scripts/prepare_alimoh89_markets.py
          python -m pytest tests/test_alimoh89_preparation.py -q

      - name: Verify private data destination
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"

      - name: Download and verify exact Kaggle source
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/alimoh/source
          slug="$(jq -r '.source.slug' "$REQUEST_FILE")"
          curl --fail --location --retry 6 --retry-delay 3             "https://www.kaggle.com/api/v1/datasets/download/$slug"             -o .cache/tbt/alimoh/source.zip
          test "$(sha256sum .cache/tbt/alimoh/source.zip | awk '{print $1}')" = "$(jq -r '.source.expected_archive_sha256' "$REQUEST_FILE")"
          unzip -q .cache/tbt/alimoh/source.zip -d .cache/tbt/alimoh/source
          SOURCE_FILE=".cache/tbt/alimoh/source/$(jq -r '.source.file' "$REQUEST_FILE")"
          test -s "$SOURCE_FILE"
          test "$(sha256sum "$SOURCE_FILE" | awk '{print $1}')" = "$(jq -r '.source.expected_file_sha256' "$REQUEST_FILE")"
          rows="$(python -c 'import csv,sys; f=open(sys.argv[1],encoding="utf-8-sig",newline=""); print(sum(1 for _ in csv.DictReader(f)))' "$SOURCE_FILE")"
          test "$rows" = "$(jq -r '.source.expected_rows' "$REQUEST_FILE")"
          echo "SOURCE_FILE=$SOURCE_FILE" >> "$GITHUB_ENV"

      - name: Download checksum-verified canonical history
        run: |
          set -euo pipefail
          python -c 'import os; from pathlib import Path; from release_store import ReleaseStore; ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",Path(".cache/tbt/alimoh/history")).download(require_bundle_manifest=True)'

      - name: Build license-gated staging and dry-run audit
        run: |
          set -euo pipefail
          python scripts/prepare_alimoh89_markets.py             --history-dir .cache/tbt/alimoh/history             --source-csv "$SOURCE_FILE"             --out-dir .cache/tbt/alimoh/out
          test "$(jq -r '.canonical_mutated' .cache/tbt/alimoh/out/report.json)" = "false"
          test "$(jq -r '.provider_api_requests' .cache/tbt/alimoh/out/report.json)" = "0"
          test "$(jq -r '.model_promoted' .cache/tbt/alimoh/out/report.json)" = "false"
          test "$(jq -r '.license_gate' .cache/tbt/alimoh/out/report.json)" = "blocked_pending_rights_confirmation"
          test "$(jq -r '.counts.source_rows' .cache/tbt/alimoh/out/report.json)" = "300059"
          test "$(jq -r '.staged_rows' .cache/tbt/alimoh/out/report.json)" -gt 0
          test "$(jq -r '.counts.duplicate_canonical_links // 0' .cache/tbt/alimoh/out/report.json)" = "0"

      - name: Persist summary audit only
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          path="$(jq -r '.output.audit_path' "$REQUEST_FILE")"
          sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 .cache/tbt/alimoh/out/report.json)"
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Prepare license-gated alimoh89 market data run $GITHUB_RUN_ID"               -f content="$encoded" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Prepare license-gated alimoh89 market data run $GITHUB_RUN_ID"               -f content="$encoded" >/dev/null
          fi

      - name: Upload summary evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-alimoh89-preparation-${{ github.run_id }}
          path: .cache/tbt/alimoh/out/report.json
          if-no-files-found: warn
          retention-days: 30
