name: BlinQ feature v3 audit request

on:
  push:
    branches: [main]
    paths:
      - ".github/feature-v3-audit-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-feature-v3-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      AUDIT_RUN_ID: ${{ github.run_id }}
      AUDIT_RUN_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install audit dependencies
        run: python -m pip install -r api/requirements-train.txt

      - name: Validate request
        run: |
          set -euo pipefail
          test -s .github/feature-v3-audit-request.json
          test "$(jq -r '.mode // ""' .github/feature-v3-audit-request.json)" = "feature-audit"
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }

      - name: Download canonical production history
        run: python scripts/download_production_preflight_inputs.py

      - name: Run zero-request feature coverage audit
        run: |
          set -euo pipefail
          python scripts/audit_feature_v3_coverage.py             --history-dir .cache/tbt/history             --out .cache/tbt/feature-v3/coverage.json

      - name: Persist latest audit in private data repo
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          source = json.loads(Path(".cache/tbt/feature-v3/coverage.json").read_text(encoding="utf-8"))
          payload = {
              "schema": 1,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "run_id": os.environ["AUDIT_RUN_ID"],
              "run_sha": os.environ["AUDIT_RUN_SHA"],
              "api_requests": 0,
              **source,
          }
          Path("/tmp/feature-v3-latest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
          path="audit/feature-v3-latest.json"
          existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/feature-v3-latest.json)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit BlinQ feature v3 coverage run $AUDIT_RUN_ID"               -f content="$encoded"               -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit BlinQ feature v3 coverage run $AUDIT_RUN_ID"               -f content="$encoded" >/dev/null
          fi

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: blinq-feature-v3-${{ github.run_id }}
          path: .cache/tbt/feature-v3/coverage.json
          if-no-files-found: error
          retention-days: 14
