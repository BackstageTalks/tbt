name: Integrate ATP official historical serve-return

on:
  push:
    branches: [main]
    paths:
      - ".github/offline-atpworld-import-request.json"

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      ATPWORLD_SHA: a92c6192c5e775df9d6be81d3ef978052b012cd9
      EXPECTED_STAGE_ROWS: "5650"
      EXPECTED_QUALITY_ADDED: "5650"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-train.txt

      - name: Verify controlled request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".github/offline-atpworld-import-request.json")
          r=json.loads(p.read_text())
          expected={
            "schema":1,
            "mode":"write",
            "source":"atpworld_official_1991_2018",
            "source_commit":"a92c6192c5e775df9d6be81d3ef978052b012cd9",
            "expected_newly_complete":5650,
          }
          for k,v in expected.items():
              if r.get(k)!=v:
                  raise SystemExit(f"Controlled request mismatch for {k}: {r.get(k)!r} != {v!r}")
          print("controlled request verified")
          PY

      - name: Install dependencies
        run: python -m pip install --retries 8 --timeout 60 -r api/requirements.txt -r api/requirements-train.txt

      - name: Verify private history destination
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"

      - name: Download checksum-verified canonical history
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          out=Path(".cache/tbt/history")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",out).download(require_bundle_manifest=True)
          print("partitions",len(list(out.glob("history-*.parquet"))))
          PY

      - name: Verify canonical baseline before linking
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.audit_serve_return_gaps import analyze
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          matches,safety=sanitize_history_identities(load_partitions(Path(".cache/tbt/history")))
          if safety.get("quarantined_rows"):
              raise SystemExit("Canonical identity quarantine is non-empty")
          r=analyze(matches)
          Path(".cache/tbt/baseline.json").write_text(json.dumps(r,indent=2),encoding="utf-8")
          c=r["overall"]
          if c["completed"] <= 0 or c["both_ready"] <= 0:
              raise SystemExit("Canonical baseline missing")
          print("dynamic baseline verified", c)
          PY

      - name: Fetch pinned ATP official source
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/sources
          git clone -q https://github.com/serve-and-volley/atp-world-tour-tennis-data.git .cache/tbt/sources/atpworld
          git -C .cache/tbt/sources/atpworld checkout -q "$ATPWORLD_SHA"
          test "$(git -C .cache/tbt/sources/atpworld rev-parse HEAD)" = "$ATPWORLD_SHA"

      - name: Link ATP official 1991-2018 fail-closed
        run: |
          set -euo pipefail
          root=.cache/tbt/sources/atpworld/csv
          targs=()
          sargs=()
          stargs=()
          while IFS= read -r f; do targs+=(--tournaments-csv "$f"); done < <(find "$root/1_tournaments" -maxdepth 1 -name 'tournaments_*.csv' -type f | sort)
          while IFS= read -r f; do sargs+=(--scores-csv "$f"); done < <(find "$root/2_match_scores" -maxdepth 1 -name 'match_scores_*.csv' -type f | sort)
          while IFS= read -r f; do stargs+=(--stats-csv "$f"); done < <(find "$root/3_match_stats" -maxdepth 1 -name 'match_stats_*.csv' ! -name 'match_stats_extended_*' -type f | sort)
          python scripts/link_atpworldtour_stats.py             --history-dir .cache/tbt/history             "${targs[@]}" "${sargs[@]}" "${stargs[@]}"             --min-year 1991 --max-year 2018             --out-dir .cache/tbt/link

      - name: Enforce audited linker contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          r=json.load(open(".cache/tbt/link/report.json"))
          c=r.get("counts") or {}
          checks={
            "staged_matches": (c.get("staged_matches",0), int(os.environ["EXPECTED_STAGE_ROWS"])),
            "quality_ready_projected_added": (r.get("quality_ready_projected_added"), int(os.environ["EXPECTED_QUALITY_ADDED"])),
            "stat_conflict_matches": (c.get("stat_conflict_matches",0), 517),
            "ambiguous": (c.get("ambiguous",0), 9),
            "unmatched": (c.get("unmatched",0), 2844),
          }
          bad=[]
          for k,(got,expected) in checks.items():
              if got!=expected:
                  bad.append(f"{k}: {got} != {expected}")
          if r.get("production_mutated") is not False or r.get("api_requests") != 0:
              bad.append("linker safety contract violated")
          if bad:
              raise SystemExit("Audit drift; refusing write: " + "; ".join(bad))
          print("linker contract verified")
          PY

      - name: Apply verified stage to local canonical history
        run: |
          set -euo pipefail
          python scripts/import_offline_linked_serve_return.py             --stage .cache/tbt/link/auto_linked.jsonl             --history-dir .cache/tbt/history             --out-dir .cache/tbt/import             --write-partitions             --write-history-dir .cache/tbt/history
          python - <<'PY'
          import json, os
          r=json.load(open(".cache/tbt/import/report.json"))
          expected=int(os.environ["EXPECTED_QUALITY_ADDED"])
          if r.get("quality_ready_added") != expected:
              raise SystemExit(f"Importer added {r.get('quality_ready_added')} != {expected}")
          if (r.get("counts") or {}).get("stat_conflicts",0):
              raise SystemExit("Importer found stat conflicts after verified linking")
          if (r.get("counts") or {}).get("identity_changed",0):
              raise SystemExit("Canonical identity changed between link and import")
          if not r.get("changed_years"):
              raise SystemExit("No changed partitions")
          print("import verified",r)
          PY

      - name: Validate full history after local write
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.audit_serve_return_gaps import analyze
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          matches,safety=sanitize_history_identities(load_partitions(Path(".cache/tbt/history")))
          if safety.get("quarantined_rows"):
              raise SystemExit("Post-write identity quarantine is non-empty")
          r=analyze(matches)
          Path(".cache/tbt/after.json").write_text(json.dumps(r,indent=2),encoding="utf-8")
          c=r["overall"]
          before=json.load(open(".cache/tbt/baseline.json"))["overall"]
          expected=before["both_ready"]+int(os.environ["EXPECTED_QUALITY_ADDED"])
          if c["completed"] != before["completed"]:
              raise SystemExit("Canonical row count changed")
          if c["both_ready"] != expected:
              raise SystemExit(f"Post-write ready count {c['both_ready']} != {expected}")
          print("post-write coverage verified", c)
          PY

      - name: Publish only changed canonical partitions
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          report=json.load(open(".cache/tbt/import/report.json"))
          years=[int(y) for y in report.get("changed_years") or []]
          root=Path(".cache/tbt/history")
          paths=[root/f"history-{y:04d}.parquet" for y in years]
          paths.append(root/"history_manifest.json")
          for p in paths:
              if not p.is_file() or p.stat().st_size <= 0:
                  raise SystemExit(f"Missing changed bundle asset: {p}")
          store=ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",root)
          store.upload_bundle(paths)
          print("published years", years)
          PY

      - name: Re-download and verify committed private release
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .cache/tbt/verify
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          out=Path(".cache/tbt/verify")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",out).download(require_bundle_manifest=True)
          PY
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.audit_serve_return_gaps import analyze
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          matches,safety=sanitize_history_identities(load_partitions(Path(".cache/tbt/verify")))
          if safety.get("quarantined_rows"):
              raise SystemExit("Committed release identity quarantine is non-empty")
          r=analyze(matches)
          Path(".cache/tbt/verify_report.json").write_text(json.dumps(r,indent=2),encoding="utf-8")
          c=r["overall"]
          before=json.load(open(".cache/tbt/baseline.json"))["overall"]
          expected=before["both_ready"]+int(os.environ["EXPECTED_QUALITY_ADDED"])
          if c["completed"] != before["completed"] or c["both_ready"] != expected:
              raise SystemExit(f"Committed release verification failed: {c}")
          print("committed release verified", c)
          PY

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atp-official-history-import-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            .cache/tbt/baseline.json
            .cache/tbt/link/report.json
            .cache/tbt/link/review.jsonl
            .cache/tbt/link/quarantine.jsonl
            .cache/tbt/import/report.json
            .cache/tbt/import/review.jsonl
            .cache/tbt/after.json
            .cache/tbt/verify_report.json
