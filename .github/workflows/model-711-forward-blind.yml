name: BlinQ 7.1.1 TOP VALUE prospective blind (private evidence)
on:
  push:
    branches: [main]
    paths:
      - scripts/blind_711_forward.py
      - tests/test_blind_711_forward.py
      - .github/workflows/model-711-forward-blind.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-711-forward-blind-single-audit
  cancel-in-progress: false

jobs:
  freeze-and-grade:
    if: github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline anti-leakage tests
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest -q tests/test_blind_711_forward.py
      - name: Verify private source and strictly no provider calls
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view BackstageTalks/tbt-data --json visibility -q .visibility)" = PRIVATE
      - name: Seal future TOP VALUE shadow pairs and score only after results
        run: |
          set -euo pipefail
          python scripts/blind_711_forward.py \
            --data-repository BackstageTalks/tbt-data \
            --out .cache/tbt/711-blind/report.json
      - name: Verify guardrails and show aggregate only
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path('.cache/tbt/711-blind/report.json').read_text())
          assert r['provider_requests'] == 0
          assert r['CDB_mutated'] is False
          assert r['production_mutated'] is False
          assert r['model_promoted'] is False
          lines = [
             '### Forward-blind 7.1.1 versus champion on published TOP/VALUE winner odds >=1.50',
             f"Status: {r['status']}",
             f"Exact pair still active: {r['model_pair_ok']}",
             f"New pre-result frozen picks: {r['new_frozen']}",
             f"Private frozen picks (rolling 22 days): {r['frozen_rolling_22d']}",
             f"Verified settled blind picks: {r['graded']}",
             f"ATP and WTA results: {r['metrics']}",
             f"Rejected reasons: {r['freeze_rejections']} | {r['grade_rejections']}",
             'No model change, no API provider requests, no CDB writes or production promotion.'
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinq-model-711-forward-blind-${{ github.run_id }}
          path: .cache/tbt/711-blind/report.json
          if-no-files-found: warn
          retention-days: 30
