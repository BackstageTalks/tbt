name: BlinQ Oct12 status -> canonical CDB exact crosswalk audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blinq-oct12-cdb-exact-crosswalk.yml'
permissions:
  contents: read
  actions: read
jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r api/requirements.txt -r api/requirements-train.txt
      - name: Retrieve frozen provider evidence and source feed without writes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/oct12-stage /tmp/oct12-feed
          gh run download 38311389071 --repo BackstageTalks/tbt --name match-status-20261012-cdb-evidence --dir /tmp/oct12-stage
          test -s /tmp/oct12-stage/match-status-20261012-cdb-evidence.json
      - name: Fetch exact current canonical 2026 SHA-bounded snapshot
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh release download tbt-predictions-v1 --repo BackstageTalks/tbt-data --pattern feed.json --dir /tmp/oct12-feed --clobber
          python - <<'PY'
          import json,hashlib
          from collections import defaultdict,Counter
          from datetime import datetime,timezone
          from pathlib import Path
          from propline_nightly_cdb import fetch_current
          from tbt.data.offline_odds import norm_text
          from tbt.services.match_status import prediction_rows
          stage=json.loads(Path('/tmp/oct12-stage/match-status-20261012-cdb-evidence.json').read_text())
          raw=Path('/tmp/oct12-feed/feed.json').read_bytes()
          feed=json.loads(raw)
          if stage['feed_sha256'] != hashlib.sha256(raw).hexdigest():
              raise SystemExit('Private source feed changed since staging; fail closed')
          assert stage.get('cdb_canonical_rows_written')==0
          before, digest=fetch_current(Path('/tmp/oct12-canonical'))
          day='2026-10-12'
          current=prediction_rows(feed,now=datetime(2026,10,12,21,30,tzinfo=timezone.utc))
          by_provider=defaultdict(list)
          by_pair=defaultdict(list)
          day_count=0
          for m in before:
              if m.scheduled_at.date().isoformat()!=day:continue
              day_count+=1
              payload=m.provider_payload if isinstance(m.provider_payload,dict) else {}
              pid=next((str(payload[k]) for k in ('_tbt_provider_event_id','provider_event_id','event_id','eventId') if payload.get(k)),None)
              if pid:by_provider[pid].append(m)
              pair=tuple(sorted((norm_text(m.player1_name),norm_text(m.player2_name))))
              by_pair[(str(m.tour).lower(),pair)].append(m)
          summary=Counter()
          rows=[]
          for evidence in stage['candidates']:
              eid=evidence['provider_event_id']
              row=current.get(eid)
              if not row:
                  summary['source_row_missing']+=1
                  rows.append({'event_id':eid,'state':'SOURCE_ROW_MISSING'});continue
              names=(str((row.get('player1') or {}).get('name') or ''),str((row.get('player2') or {}).get('name') or ''))
              ids=(str((row.get('player1') or {}).get('id') or ''),str((row.get('player2') or {}).get('id') or ''))
              if len(set(ids))!=2 or len(set(map(norm_text,names)))!=2 or not all(names):
                  summary['source_identity_incomplete']+=1;continue
              provider=[m for m in by_provider.get(eid,[]) if str(m.tour).lower()==evidence['tour']]
              pair=by_pair.get((evidence['tour'],tuple(sorted(map(norm_text,names)))),[])
              confirmed=[m for m in pair if m in provider]
              exact_ids=set(ids)=={evidence['player1_provider_id'],evidence['player2_provider_id']}
              winner=evidence['winner_provider_id']
              source_winner=names[ids.index(winner)] if winner in ids else ''
              if not exact_ids or not source_winner:
                  summary['evidence_source_conflict']+=1;continue
              if len(confirmed)==1 and len(provider)==1 and len(pair)==1:
                  m=confirmed[0]
                  cw=m.player1_id if norm_text(m.player1_name)==norm_text(source_winner) else (m.player2_id if norm_text(m.player2_name)==norm_text(source_winner) else None)
                  if not cw:
                      summary['winner_name_identity_conflict']+=1;continue
                  if m.winner_id and str(m.winner_id)!=str(cw):
                      state='CANONICAL_WINNER_CONFLICT'
                  elif m.status in {'completed','finished','ended'} and m.winner_id==cw:
                      state='ALREADY_COMPLETE'
                  elif (not m.winner_id) and str(m.status or '').strip().lower() in ('','scheduled','notstarted','started','inprogress','unknown','pending'):
                      state='EXACT_SAFE_OUTCOME_ENRICHMENT_CANDIDATE'
                  else:
                      state='CANONICAL_STATUS_REVIEW'
                  summary[state]+=1
                  rows.append({'event_id':eid,'canonical_match_id':str(m.match_id),'state':state,'tour':m.tour,'winner_is_existing':bool(m.winner_id),'canonical_status':m.status})
              else:
                  state=('UNMATCHED_CANONICAL_MATCH' if not pair and not provider else 'AMBIGUOUS_OR_MISSING_PROVIDER_ID')
                  summary[state]+=1
                  rows.append({'event_id':eid,'state':state,'canonical_pair_candidates':len(pair),'canonical_provider_candidates':len(provider)})
          player_name_to_ids=defaultdict(set)
          provider_id_to_canonical_name=defaultdict(set)
          for m in before:
              for canonical_player_id,player_name in ((m.player1_id,m.player1_name),(m.player2_id,m.player2_name)):
                  key=(str(m.tour).lower(),norm_text(player_name))
                  if key[1]: player_name_to_ids[key].add(str(canonical_player_id))
                  if str(canonical_player_id).isdigit():
                      provider_id_to_canonical_name[(str(m.tour).lower(),str(canonical_player_id))].add(norm_text(player_name))
          new_match_identity=[]
          for evidence in stage['candidates']:
              eid=evidence['provider_event_id'];row=current.get(eid)
              if not row:continue
              names=[str((row.get(k) or {}).get('name') or '') for k in ('player1','player2')]
              ids=[str((row.get(k) or {}).get('id') or '') for k in ('player1','player2')]
              sides=[]
              for name,pid in zip(names,ids):
                  mapped=sorted(player_name_to_ids.get((evidence['tour'],norm_text(name)),set()))
                  direct_identity=(pid in mapped)
                  sides.append({'provider_id':pid,'source_name':name,'canonical_ids_by_exact_name':mapped[:5],
                                'canonical_identity_unique':len(mapped)==1,'provider_id_direct_match':direct_identity})
              new_match_identity.append({'event_id':eid,'sides':sides,'tour':evidence['tour'],
                                         'tournament':str(row.get('tournament') or '')[:110],
                                         'source_scheduled':str(row.get('scheduled_at') or '')[:60],
                                         'source_surface':str(row.get('surface') or '')[:50]})
          day_examples=[{'match_id':str(m.match_id),'tour':m.tour,
                         'name_pair':[m.player1_name,m.player2_name],
                         'player_ids':[str(m.player1_id),str(m.player2_id)],
                         'winner_id':str(m.winner_id or ''),'status':m.status,
                         'source_event':str((m.provider_payload or {}).get('_tbt_provider_event_id') or '')}
                        for m in before if m.scheduled_at.date().isoformat()==day][:9]
          output={'schema':1,'status':'CDB_EXACT_CROSSWALK_AUDIT','canonical_partition_sha256':digest,'canonical_2026_day_matches':day_count,'source_feed_sha256':stage['feed_sha256'],'source_feed_fixtures':len(current),'production_tracked_reference':26,'original_stage_candidates':len(stage['candidates']),'summary':dict(summary),'rows':rows,'canonical_mutated':False,'new_match_identity':new_match_identity,'canonical_day_examples':day_examples}
          Path('blinq-oct12-canonical-crosswalk.json').write_text(json.dumps(output,ensure_ascii=False,indent=2)+'\n')
          print('OCT12_CANONICAL_CROSSWALK '+json.dumps(output,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blinq-oct12-canonical-crosswalk
          path: blinq-oct12-canonical-crosswalk.json
          if-no-files-found: error
          retention-days: 30
