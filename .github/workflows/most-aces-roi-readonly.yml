name: VIAC ES issued Results accounting (read-only)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: most-aces-roi-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test accounting audit
        run: |
          python -m pip install -r api/requirements.txt pytest
          python -m pytest tests/test_audit_most_aces_roi.py -q
      - name: Read and independently verify exact private feed asset
        run: |
          set -euo pipefail
          mkdir -p .cache/most-aces
          gh release view tbt-predictions-v1 -R BackstageTalks/tbt-data --json assets > .cache/most-aces/before.json
          gh release download tbt-predictions-v1 -R BackstageTalks/tbt-data --pattern feed.json --dir .cache/most-aces
          gh release view tbt-predictions-v1 -R BackstageTalks/tbt-data --json assets > .cache/most-aces/after.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.cache/most-aces')
          def asset(name):
              items = [a for a in json.loads((root/name).read_text())['assets'] if a['name']=='feed.json']
              assert len(items)==1, 'Ambiguous feed asset'
              return items[0]
          before, after = asset('before.json'), asset('after.json')
          assert before == after, 'Feed changed during download; rerun on stable snapshot'
          digest = 'sha256:'+hashlib.sha256((root/'feed.json').read_bytes()).hexdigest()
          assert before.get('digest') == digest, 'Independent feed digest unavailable or mismatched'
          PY
      - name: Measure accounting without claiming profitability or member UI verification
        run: python scripts/audit_most_aces_roi.py --feed .cache/most-aces/feed.json --out .cache/most-aces/report.json
      - name: Preserve aggregate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: most-aces-roi-${{ github.run_id }}
          path: .cache/most-aces/report.json
          retention-days: 14
          if-no-files-found: warn
