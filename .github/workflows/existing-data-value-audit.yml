name: BlinQ existing-data recovery and market audit
# Strict post-fitting evaluation excludes later calibration and model selection.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/existing-data-value-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blinq-existing-data-value-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: python -m pip install -r api/requirements-train.txt pytest
      - run: python -m pytest tests/test_existing_data_value_audit.py -q
      - name: Measure raw recovery and matched post-training markets without provider credentials
        run: python -u scripts/audit_existing_data_value.py --data-repository "$TBT_DATA_REPOSITORY"
      - name: Preserve private complete evidence or partial raw inventory
        if: always()
        run: |
          python - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          source = Path('.cache/tbt/existing-data-value/report.json')
          if not source.exists():
              raise SystemExit(0)
          report = json.loads(source.read_text())
          target = 'audit/existing-data-value-latest.json' if report.get('phase') == 'complete' else 'audit/existing-data-recovery-latest.json'
          repo = os.environ['TBT_DATA_REPOSITORY']
          lookup = subprocess.run(['gh','api',f'repos/{repo}/contents/{target}'], capture_output=True, text=True)
          body = {'message': 'Zero-provider-call BlinQ recovery and market audit evidence', 'content': base64.b64encode(source.read_bytes()).decode()}
          if lookup.returncode == 0:
              body['sha'] = json.loads(lookup.stdout)['sha']
          elif '404' not in lookup.stderr:
              raise RuntimeError('Cannot safely inspect evidence target')
          payload = Path('/tmp/blinq-existing-data-audit.json')
          payload.write_text(json.dumps(body))
          subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{target}','--input',str(payload)],check=True,stdout=subprocess.DEVNULL)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinq-existing-data-value-${{ github.run_id }}
          path: .cache/tbt/existing-data-value/report.json
          if-no-files-found: warn
