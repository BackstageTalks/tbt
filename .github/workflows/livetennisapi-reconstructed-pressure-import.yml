name: Integrate restricted LiveTennisAPI WTA 2025 pressure

on:
  push:
    branches: [main]
    paths:
      - ".github/livetennisapi-reconstructed-pressure-request.json"

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      STAGE_BRANCH: staging/livetennisapi-wta-2025-reconstructed-20261002
      STAGE_PATH: staging/livetennisapi-wta-2025-reconstructed/pressure.csv
      MANIFEST_PATH: staging/livetennisapi-wta-2025-reconstructed/manifest.json
      EXPECTED_STAGE_ROWS: "3899"
      EXPECTED_STAGE_SHA256: eeab2226d202748a6f47f87c45d4a61afca80a603e20bb9b481d73a218b3614f
      SOURCE_TAR_SHA256: 0bc3385d2f9aa860b5945a485a7cf27a64b6075cf0908844a92d47cb86dd3c58

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: python -m pip install --retries 8 --timeout 60 -r api/requirements-train.txt

      - name: Verify code and controlled request
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"
          python -m py_compile scripts/link_offline_serve_return.py scripts/import_offline_linked_serve_return.py
          python - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path(".github/livetennisapi-reconstructed-pressure-request.json").read_text())
          expected={
              "schema":1,
              "mode":"write",
              "source":"livetennisapi_reconstructed_wta_2025_singles",
              "stage_branch":"staging/livetennisapi-wta-2025-reconstructed-20261002",
              "expected_stage_rows":3899,
              "raw_redistributed":False,
              "model_promoted":False,
          }
          for key,value in expected.items():
              if request.get(key)!=value:
                  raise SystemExit(f"Request mismatch {key}: {request.get(key)!r} != {value!r}")
          PY

      - name: Download current canonical history
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          ReleaseStore(
              os.environ["TBT_DATA_REPOSITORY"],
              "tbt-data-v1",
              Path(".cache/tbt/history"),
          ).download(require_bundle_manifest=True)
          PY

      - name: Fetch and verify private derived stage
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/livetennisapi-reconstructed
          gh api -H "Accept: application/vnd.github.raw+json"             "repos/$TBT_DATA_REPOSITORY/contents/$STAGE_PATH?ref=$STAGE_BRANCH"             > .cache/tbt/livetennisapi-reconstructed/pressure.csv
          gh api -H "Accept: application/vnd.github.raw+json"             "repos/$TBT_DATA_REPOSITORY/contents/$MANIFEST_PATH?ref=$STAGE_BRANCH"             > .cache/tbt/livetennisapi-reconstructed/manifest.json
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          stage=Path(".cache/tbt/livetennisapi-reconstructed/pressure.csv")
          manifest=json.loads(Path(".cache/tbt/livetennisapi-reconstructed/manifest.json").read_text())
          digest=hashlib.sha256(stage.read_bytes()).hexdigest()
          rows=sum(1 for _ in csv.DictReader(stage.open(encoding="utf-8")))
          checks={
              "manifest_schema":(manifest.get("schema"),1),
              "source":(manifest.get("source"),"livetennisapi_reconstructed_wta_2025_singles"),
              "source_tar_sha256":(manifest.get("source_tar_sha256"),os.environ["SOURCE_TAR_SHA256"]),
              "manifest_stage_sha256":(manifest.get("derived_stage_sha256"),os.environ["EXPECTED_STAGE_SHA256"]),
              "actual_stage_sha256":(digest,os.environ["EXPECTED_STAGE_SHA256"]),
              "manifest_rows":(manifest.get("rows"),int(os.environ["EXPECTED_STAGE_ROWS"])),
              "actual_rows":(rows,int(os.environ["EXPECTED_STAGE_ROWS"])),
              "raw_redistributed":(manifest.get("raw_redistributed"),False),
              "storage_policy":(manifest.get("storage_policy"),"private_internal_derived_stage_only"),
          }
          bad=[f"{k}:{a!r}!={b!r}" for k,(a,b) in checks.items() if a!=b]
          if bad:
              raise SystemExit("Restricted stage contract failed: "+"; ".join(bad))
          print(json.dumps({"rows":rows,"sha256":digest},indent=2))
          PY

      - name: Record baseline specialist coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          fields=(
              "p1_break_point_serve_win","p1_break_point_return_win",
              "p2_break_point_serve_win","p2_break_point_return_win",
          )
          matches,safety=sanitize_history_identities(load_partitions(".cache/tbt/history"))
          if safety.get("quarantined_rows"):
              raise SystemExit("Canonical identity quarantine before restricted import")
          counts={field:sum(1 for m in matches if (m.stats or {}).get(field) is not None) for field in fields}
          all_four=sum(1 for m in matches if all((m.stats or {}).get(field) is not None for field in fields))
          payload={"canonical_rows":len(matches),"field_counts":counts,"all_four":all_four}
          Path(".cache/tbt/livetennisapi-reconstructed/baseline.json").write_text(
              json.dumps(payload,indent=2),encoding="utf-8"
          )
          print(json.dumps(payload,indent=2))
          PY

      - name: Strict-link private pressure stage
        run: |
          set -euo pipefail
          python scripts/link_offline_serve_return.py             --history-dir .cache/tbt/history             --livetennisapi-reconstructed-csv .cache/tbt/livetennisapi-reconstructed/pressure.csv             --out-dir .cache/tbt/livetennisapi-reconstructed/link
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.load(open(".cache/tbt/livetennisapi-reconstructed/link/report.json"))
          stage=Path(".cache/tbt/livetennisapi-reconstructed/link/auto_linked.jsonl")
          staged=sum(1 for line in stage.open(encoding="utf-8") if line.strip())
          if report.get("production_mutated") is not False or report.get("api_requests") != 0:
              raise SystemExit("Linker safety contract violated")
          if report.get("source_rows") != int(os.environ["EXPECTED_STAGE_ROWS"]):
              raise SystemExit(f"Source row drift: {report.get('source_rows')}")
          if staged <= 0:
              raise SystemExit("No restricted pressure rows linked safely")
          if staged > int(os.environ["EXPECTED_STAGE_ROWS"]):
              raise SystemExit("Restricted stage expanded unexpectedly")
          counts=report.get("counts") or {}
          if int(counts.get("staged_matches") or 0) != staged:
              raise SystemExit("Staged row count mismatch")
          print(json.dumps({
              "source_rows":report.get("source_rows"),
              "identity_linked":counts.get("identity_linked",0),
              "staged_matches":staged,
              "unmatched":counts.get("unmatched",0),
              "ambiguous":counts.get("ambiguous",0),
              "weak_evidence":counts.get("weak_evidence",0),
              "stat_conflict_matches":counts.get("stat_conflict_matches",0),
              "staged_field_counts":report.get("staged_field_counts"),
          },indent=2))
          PY

      - name: Dry-run strict importer
        run: |
          set -euo pipefail
          python scripts/import_offline_linked_serve_return.py             --stage .cache/tbt/livetennisapi-reconstructed/link/auto_linked.jsonl             --history-dir .cache/tbt/history             --out-dir .cache/tbt/livetennisapi-reconstructed/dry
          python - <<'PY'
          import json
          from pathlib import Path
          staged=sum(
              1 for line in Path(".cache/tbt/livetennisapi-reconstructed/link/auto_linked.jsonl").open(encoding="utf-8")
              if line.strip()
          )
          report=json.load(open(".cache/tbt/livetennisapi-reconstructed/dry/report.json"))
          counts=report.get("counts") or {}
          checks={
              "stage_rows":(report.get("stage_rows"),staged),
              "updated":(counts.get("updated",0),staged),
              "identity_missing":(counts.get("identity_missing",0),0),
              "identity_changed":(counts.get("identity_changed",0),0),
              "stat_conflicts":(counts.get("stat_conflicts",0),0),
              "invalid_stats":(counts.get("invalid_stats",0),0),
          }
          bad=[f"{k}:{a}!={b}" for k,(a,b) in checks.items() if a!=b]
          if bad:
              raise SystemExit("Restricted dry-run failed: "+"; ".join(bad))
          PY

      - name: Apply verified pressure stage locally
        run: |
          set -euo pipefail
          python scripts/import_offline_linked_serve_return.py             --stage .cache/tbt/livetennisapi-reconstructed/link/auto_linked.jsonl             --history-dir .cache/tbt/history             --out-dir .cache/tbt/livetennisapi-reconstructed/import             --write-partitions             --write-history-dir .cache/tbt/history
          python - <<'PY'
          import json
          report=json.load(open(".cache/tbt/livetennisapi-reconstructed/import/report.json"))
          counts=report.get("counts") or {}
          if counts.get("identity_missing",0) or counts.get("identity_changed",0) or counts.get("stat_conflicts",0) or counts.get("invalid_stats",0):
              raise SystemExit(f"Restricted importer safety failure: {counts}")
          years=set(report.get("changed_years") or [])
          if not years or not years.issubset({2024,2025}):
              raise SystemExit(f"Unexpected changed years: {sorted(years)}")
          print(json.dumps(report,indent=2))
          PY

      - name: Validate coverage and leakage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          fields=(
              "p1_break_point_serve_win","p1_break_point_return_win",
              "p2_break_point_serve_win","p2_break_point_return_win",
          )
          before=json.load(open(".cache/tbt/livetennisapi-reconstructed/baseline.json"))
          matches,safety=sanitize_history_identities(load_partitions(".cache/tbt/history"))
          if safety.get("quarantined_rows"):
              raise SystemExit("Post-import canonical identity quarantine")
          if len(matches) != before["canonical_rows"]:
              raise SystemExit("Canonical row count changed")
          counts={field:sum(1 for m in matches if (m.stats or {}).get(field) is not None) for field in fields}
          all_four=sum(1 for m in matches if all((m.stats or {}).get(field) is not None for field in fields))
          after={"canonical_rows":len(matches),"field_counts":counts,"all_four":all_four}
          if not any(counts[f] > before["field_counts"][f] for f in fields):
              raise SystemExit("Restricted pressure import produced no specialist coverage gain")
          Path(".cache/tbt/livetennisapi-reconstructed/after.json").write_text(
              json.dumps(after,indent=2),encoding="utf-8"
          )
          print(json.dumps({"before":before,"after":after},indent=2))
          PY
          python scripts/audit_training_leakage.py             --history-dir .cache/tbt/history             --report .cache/tbt/livetennisapi-reconstructed/leakage.json
          python scripts/audit_feature_v3_coverage.py             --history-dir .cache/tbt/history             --out .cache/tbt/livetennisapi-reconstructed/feature-coverage.json
          python - <<'PY'
          import json
          report=json.load(open(".cache/tbt/livetennisapi-reconstructed/leakage.json"))
          if report.get("status") not in {"PASS","pass"} and report.get("passed") is not True:
              raise SystemExit("Leakage audit failed")
          PY

      - name: Publish changed canonical partitions
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          report=json.load(open(".cache/tbt/livetennisapi-reconstructed/import/report.json"))
          years=[int(year) for year in report.get("changed_years") or []]
          root=Path(".cache/tbt/history")
          paths=[root/f"history-{year:04d}.parquet" for year in years] + [root/"history_manifest.json"]
          for path in paths:
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"Missing publish asset {path}")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",root).upload_bundle(paths)
          print("published",years)
          PY

      - name: Verify committed private release
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          fields=(
              "p1_break_point_serve_win","p1_break_point_return_win",
              "p2_break_point_serve_win","p2_break_point_return_win",
          )
          root=Path(".cache/tbt/verify-livetennisapi-reconstructed")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",root).download(require_bundle_manifest=True)
          expected=json.load(open(".cache/tbt/livetennisapi-reconstructed/after.json"))
          matches,safety=sanitize_history_identities(load_partitions(root))
          if safety.get("quarantined_rows"):
              raise SystemExit("Committed release identity quarantine")
          actual={
              "canonical_rows":len(matches),
              "field_counts":{field:sum(1 for m in matches if (m.stats or {}).get(field) is not None) for field in fields},
              "all_four":sum(1 for m in matches if all((m.stats or {}).get(field) is not None for field in fields)),
          }
          if actual != expected:
              raise SystemExit(f"Committed release verification drift: {actual} != {expected}")
          Path(".cache/tbt/livetennisapi-reconstructed/verify.json").write_text(
              json.dumps(actual,indent=2),encoding="utf-8"
          )
          print(json.dumps(actual,indent=2))
          PY

      - name: Persist restricted import audit privately
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          manifest=json.load(open(".cache/tbt/livetennisapi-reconstructed/manifest.json"))
          baseline=json.load(open(".cache/tbt/livetennisapi-reconstructed/baseline.json"))
          link=json.load(open(".cache/tbt/livetennisapi-reconstructed/link/report.json"))
          imp=json.load(open(".cache/tbt/livetennisapi-reconstructed/import/report.json"))
          verify=json.load(open(".cache/tbt/livetennisapi-reconstructed/verify.json"))
          audit={
              "schema":1,
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "source":"livetennisapi_reconstructed_wta_2025_singles",
              "source_tar_sha256":manifest["source_tar_sha256"],
              "derived_stage_sha256":manifest["derived_stage_sha256"],
              "source_rows":manifest["rows"],
              "citation_doi":manifest["citation_doi"],
              "usage_conditions":manifest["usage_conditions"],
              "raw_redistributed":False,
              "canonical_rows":verify["canonical_rows"],
              "pressure_coverage_before":baseline,
              "pressure_coverage_after":verify,
              "link_counts":link.get("counts"),
              "staged_field_counts":link.get("staged_field_counts"),
              "import_counts":imp.get("counts"),
              "changed_years":imp.get("changed_years"),
              "provider_api_requests":0,
              "model_promoted":False,
          }
          Path(".cache/tbt/livetennisapi-reconstructed/audit.json").write_text(
              json.dumps(audit,indent=2),encoding="utf-8"
          )
          PY
          path="audit/livetennisapi-wta-2025-reconstructed-pressure-latest.json"
          encoded="$(base64 -w0 .cache/tbt/livetennisapi-reconstructed/audit.json)"
          sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Update restricted LiveTennisAPI WTA 2025 pressure audit"               -f content="$encoded" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Add restricted LiveTennisAPI WTA 2025 pressure audit"               -f content="$encoded" >/dev/null
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livetennisapi-wta-2025-reconstructed-pressure-${{ github.run_id }}
          retention-days: 14
          path: |
            .cache/tbt/livetennisapi-reconstructed/manifest.json
            .cache/tbt/livetennisapi-reconstructed/baseline.json
            .cache/tbt/livetennisapi-reconstructed/link/report.json
            .cache/tbt/livetennisapi-reconstructed/link/review.jsonl
            .cache/tbt/livetennisapi-reconstructed/link/quarantine.jsonl
            .cache/tbt/livetennisapi-reconstructed/dry/report.json
            .cache/tbt/livetennisapi-reconstructed/import/report.json
            .cache/tbt/livetennisapi-reconstructed/after.json
            .cache/tbt/livetennisapi-reconstructed/leakage.json
            .cache/tbt/livetennisapi-reconstructed/feature-coverage.json
            .cache/tbt/livetennisapi-reconstructed/verify.json
            .cache/tbt/livetennisapi-reconstructed/audit.json
