name: Evaluate model and Prime Picks

on:
  workflow_dispatch:
    inputs:
      tune_year:
        description: "Prime weight tuning year"
        required: true
        default: "2025"
      validation_year:
        description: "Untouched Prime validation year"
        required: true
        default: "2026"
      top_n:
        description: "Prime Picks shown per day"
        required: true
        default: "10"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt pytest

      - name: Compile and test Prime calculations
        run: |
          set -euo pipefail
          python -m compileall -q api scripts
          pytest -q api/tests/test_prime.py

      - name: Run model walk-forward backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/backtest.py \
            --first-test-year "${{ inputs.tune_year }}" \
            --report reports/backtest_current.json

      - name: Tune and validate Prime Picks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/prime_backtest.py \
            --tune-year "${{ inputs.tune_year }}" \
            --validation-year "${{ inputs.validation_year }}" \
            --top-n "${{ inputs.top_n }}" \
            --report reports/prime_backtest.json

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-model-prime-evaluation
          path: |
            reports/backtest_current.json
            reports/prime_backtest.json
          if-no-files-found: warn
          retention-days: 30
