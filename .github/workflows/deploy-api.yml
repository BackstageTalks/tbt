name: Deploy TBT API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONPATH: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install and test
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest
          python -m compileall -q api scripts
          pytest

      - name: Validate Azure Function configuration
        env:
          FUNCTION_APP_NAME: ${{ vars.BLINQ_FUNCTION_APP_NAME }}
          PUBLISH_PROFILE: ${{ secrets.BLINQ_FUNCTION_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail
          test -n "${FUNCTION_APP_NAME:-}" || { echo "::error::Missing repository variable BLINQ_FUNCTION_APP_NAME"; exit 1; }
          test -n "${PUBLISH_PROFILE:-}" || { echo "::error::Missing secret BLINQ_FUNCTION_PUBLISH_PROFILE"; exit 1; }
          echo "Deploy target: ${FUNCTION_APP_NAME}"

      - name: Deploy TBT API to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.BLINQ_FUNCTION_APP_NAME }}
          package: api
          publish-profile: ${{ secrets.BLINQ_FUNCTION_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
