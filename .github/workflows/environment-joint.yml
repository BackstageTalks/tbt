name: Environment joint run - cache, coverage, preflight, ablation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cache-write = verified cache-only backfill before audits; audit-only = no writes"
        type: choice
        options: [cache-write, audit-only]
        default: cache-write
        required: true
      start:
        description: "Inclusive start for optional cache-only backfill"
        type: string
        default: "2021-01-01"
        required: true
      end:
        description: "Exclusive end for optional cache-only backfill (blank = today UTC)"
        type: string
        default: ""
        required: false

permissions:
  contents: read

# Cache-only writes may not overlap MegaData/Statistics/Environment writers.
concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  joint:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      PYTHONPATH: api:scripts
      BLINQ_MODE: ${{ inputs.mode }}
      BLINQ_START: ${{ inputs.start }}
      BLINQ_END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install, compile, and test safe Environment research pipeline
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
          python -m unittest discover -s scripts/tests -p "test_environment_ablation.py" -v
          python -m unittest discover -s scripts/tests -p "test_environment_bulk_modes.py" -v

      - name: Verify private history release access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing non-private training data repository"; exit 1; }

      - name: Optional verified history cache backfill (zero geocoder calls)
        if: ${{ inputs.mode == 'cache-write' }}
        shell: bash
        run: |
          set -euo pipefail
          END_VALUE="${BLINQ_END:-$(date -u +%F)}"
          python scripts/enrich_environment_snapshot.py \
            --start "$BLINQ_START" --end "$END_VALUE" \
            --limit 0 --cache-only --static-only --complete-static \
            --max-requests 1 --max-runtime-minutes 150 \
            --data-repository "$TBT_DATA_REPOSITORY"
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('.cache/tbt/history/environment_enrichment_report.json').read_text())
          assert report['open_meteo_requests'] == 0, "Cache-only made Open-Meteo calls"
          assert report['updated'] == report['resolved'], "Nonpositive Environment write"
          print('Verified cache-only updated:', report['updated'])
          PY

      - name: Full read-only Environment coverage audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/environment-joint
          python scripts/audit_environment_release.py \
            --data-repository "$TBT_DATA_REPOSITORY" \
            --report .cache/tbt/environment-joint/environment_audit.json \
            | tee .cache/tbt/environment-joint/environment_audit.log

      - name: Full Production Preflight on latest committed history
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_production_preflight.py

      - name: Matched chronological static Environment ablation (no promotion)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_static_environment_ablation.py \
            --table .cache/tbt/production/training_table.parquet \
            --out .cache/tbt/environment-joint/ablation.json

      - name: Publish one joint summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root = Path(".cache/tbt")
          def load(path):
              p = root / path
              return json.loads(p.read_text()) if p.exists() else {}
          audit = load("environment-joint/environment_audit.json")
          readiness = load("production/readiness_report.json")
          ablation = load("environment-joint/ablation.json")
          enrichment = load("history/environment_enrichment_report.json")
          print("# BlinQ combined Environment research")
          print("")
          print("**This workflow never promotes or deploys a model.**")
          if enrichment and "${{ inputs.mode }}" == "cache-write":
              print(f"- Verified cache-only matches updated: {enrichment.get('updated', 0):,}; Open-Meteo requests: {enrichment.get('open_meteo_requests')}")
          if audit:
              overall = audit["overall"]
              print(f"- Canonical completed matches: {overall['total']:,}")
              print(f"- Static venue coverage: {overall['coverage']['venue_resolved']:.2%}")
              print(f"- Unresolved venues: {overall['unresolved']:,}")
              print(f"- Unknown indoor/outdoor: {overall.get('indoor_unknown', 0):,}")
              print("")
              print("## Leading unresolved tournament groups (diagnostics only)")
              for name, count in overall.get("top_unresolved_tournaments", [])[:15]:
                  print(f"- {name}: {count:,}")
          if readiness:
              print("")
              print(f"## Preflight: {readiness.get('status')}")
              print(f"- Data blockers: {readiness.get('blockers')}")
              print(f"- Static Environment eligible for candidate evaluation: {readiness.get('candidate_training', {}).get('static_environment')}")
              print(f"- Event statistics eligible: {readiness.get('candidate_training', {}).get('event_statistics')}")
          if ablation:
              print("")
              print("## Matched chronological diagnostic ablation (NOT production model)")
              print(f"- Holdout: {ablation['holdout_rows']:,} matches")
              for name, values in ablation["models"].items():
                  metrics = values["all_holdout"]
                  print(f"- {name}: accuracy {metrics['accuracy']:.2%}, Brier {metrics['brier']:.4f}, log loss {metrics['log_loss']:.4f}")
              print(f"- Difference (Environment − baseline): {ablation['environment_minus_baseline']['all_holdout']}")
              print("- Research-only. Run the separate production ensemble chronological backtest before any promotion.")
          PY

      - name: Upload combined audit and preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-environment-joint-${{ github.run_id }}
          path: |
            .cache/tbt/environment-joint/
            .cache/tbt/history/environment_enrichment_report.json
            .cache/tbt/production/player_master_report.json
            .cache/tbt/production/tournament_venue_report.json
            .cache/tbt/production/training_table_report.json
            .cache/tbt/production/leakage_audit_report.json
            .cache/tbt/production/statistics_inventory_report.json
            .cache/tbt/production/readiness_report.json
            .cache/tbt/production/readiness_report.md
          if-no-files-found: warn
          retention-days: 30
