name: PropLine ACES isolated live quote smoke
on:
  push:
    branches:
      - audit/propline-aces-50calls-20261101
    paths:
      - .github/workflows/propline-aces-quote-live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: propline-aces-quote-live-smoke
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PROPL: ${{ secrets.PROPL }}
      PYTHONPATH: api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline fixture test
        run: python scripts/propline_aces_quote_probe.py --self-test
      - name: Read-only PropLine live ACES odds (5 calls maximum, no production writes)
        run: python scripts/propline_aces_quote_probe.py --live --max-calls 5 --event-fallback 3
      - name: Save exact read-only provider results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propline-aces-quote-live-smoke
          path: propline_aces_live_probe.json
          if-no-files-found: warn
          retention-days: 5
