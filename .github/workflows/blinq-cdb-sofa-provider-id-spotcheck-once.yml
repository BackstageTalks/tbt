name: BlinQ 2025 CDB official Sofascore player ID namespace spotcheck (one shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/cdb-sofa-provider-id-probe-2025-request.json'
permissions:
  contents: read
jobs:
  provider-original-namespace-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      EXPECTED_2025_SHA: 3a929b356803af6b0f704d4d3066a053ecf995124ec8f4228487c54c0f534c58
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Private source and immutable original 2025 CDB partition guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          observed="$(gh api repos/$PRIVATE_REPO/releases/tags/tbt-data-v1 --jq '.assets[] | select(.name == "history-2025.parquet") | .digest')"
          test "$observed" = "sha256:${EXPECTED_2025_SHA}"
          mkdir -p work/private
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -p history-2025.parquet -D work/private >/dev/null
          echo "$EXPECTED_2025_SHA  work/private/history-2025.parquet" | sha256sum -c
      - name: Run 8 source provider ID safety tests
        run: |
          python -m unittest discover -s scripts/research -p test_check_2025_provider_public_ids.py -v
          python -m pip install --disable-pip-version-check --quiet 'pyarrow>=16,<23'
      - name: Test only official player ID namespace (NOT event equivalence)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research/check_2025_provider_public_ids.py \
            --history work/private/history-2025.parquet \
            --expected-sha256 "$EXPECTED_2025_SHA" \
            --out work/result/sofascore-provider-id-research.json
          python - <<'PY'
          import json
          r=json.load(open('work/result/sofascore-provider-id-research.json'))
          assert r['new_CDB_cells_written']==0 and r['new_CDB_stat_cells_authorized']==0
          assert r['cross_provider_player_link_authorized'] is False
          assert r['source_match_bridge_authorized'] is False
          PY
      - name: Store private SHA-checked results with full byte readback
        shell: bash
        run: |
          set -euo pipefail
          tag="blinq-cdb2025-provider-sofa-id-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          (cd work/result && sha256sum sofascore-provider-id-research.json > SHA256SUMS)
          gh release create "$tag" -R "$PRIVATE_REPO" --target main --title 'Private 2025 CDB provider vs public Sofascore player IDs read-only spotcheck' --notes 'Two public ID namespace challenges only. No original cross-provider player/event link, source license, CDB writes, model changes.' >/dev/null
          gh release upload "$tag" work/result/sofascore-provider-id-research.json work/result/SHA256SUMS -R "$PRIVATE_REPO" >/dev/null
          mkdir -p work/readback
          gh release download "$tag" -R "$PRIVATE_REPO" -D work/readback >/dev/null
          (cd work/readback && sha256sum -c SHA256SUMS)
          cmp work/result/sofascore-provider-id-research.json work/readback/sofascore-provider-id-research.json
          echo "BLINQ_SOFA_PROVIDER_SPOTCHECK_SHA_READBACK_PASS=$tag"
