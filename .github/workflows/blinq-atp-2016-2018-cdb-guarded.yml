name: BlinQ ATP 2016-2022 exact-CDB NULL audit (read-only)
'on':
  pull_request:
    paths:
      - scripts/link_atpworldtour_stats.py
      - tests/test_atpworldtour_stats_strict.py
      - .github/workflows/blinq-atp-2016-2018-cdb-guarded.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/blinq-atp-2016-2018-cdb-guarded.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blinq-atp-2016-2018-pinned-readonly
  cancel-in-progress: false
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test strict linker and existing defaults
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas pyarrow pydantic numpy pytest
          python -m pytest -q tests/test_atpworldtour_stats_linker.py tests/test_atpworldtour_stats_strict.py tests/test_offline_exact_cdb_write.py tests/test_offline_linked_serve_return_importer.py tests/test_cdb_global_writer_lock.py

  source-to-current-CDB:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: regressions
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: .:api:scripts
      CDB_REPO: BackstageTalks/tbt-data
      ATP_SHA: a92c6192c5e775df9d6be81d3ef978052b012cd9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only CDB dependencies
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$CDB_REPO" --jq .private)" = true
          python -m pip install --disable-pip-version-check pandas pyarrow pydantic numpy
          mkdir -p work/source/csv/1_tournaments work/source/csv/2_match_scores work/source/csv/3_match_stats work/audit
      - name: Acquire pinned public ATP 2016-2022 CSVs and verify 11 source hashes
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/serve-and-volley/atp-world-tour-tennis-data/$ATP_SHA"
          for path in csv/1_tournaments/tournaments_2010-2019.csv csv/1_tournaments/tournaments_2020-2022.csv csv/2_match_scores/match_scores_2010-2019.csv csv/2_match_scores/match_scores_2020-2022.csv csv/3_match_stats/match_stats_2016.csv csv/3_match_stats/match_stats_2017.csv csv/3_match_stats/match_stats_2018.csv csv/3_match_stats/match_stats_2019.csv csv/3_match_stats/match_stats_2020.csv csv/3_match_stats/match_stats_2021.csv csv/3_match_stats/match_stats_2022.csv; do
            curl --fail --silent --show-error --location --retry 3 --max-time 180 "$base/$path" -o "work/source/$path"
          done
          cd work/source
          sha256sum -c <<'SHA256'
          8f9ffbeaf169d88cee77874410cc524669f2e5a23d0da663a7b663ff62c9ef74  csv/1_tournaments/tournaments_2010-2019.csv
          edf70cff7f21024fa7b12d1792ad2740fcc8c5f92cf684d550cdc5ace13e5ad0  csv/1_tournaments/tournaments_2020-2022.csv
          3b89a81ea3a19c7bf14a03c8392350b04708ef5b672bd5f54074a99d1271dfa0  csv/2_match_scores/match_scores_2010-2019.csv
          a971f1165bd30b1e8765aaa2f86aba35ae7fa08d0ac0c34cb1aaec42af548072  csv/2_match_scores/match_scores_2020-2022.csv
          75c06a344a39b53645b237941f5b17c7d4a136c920633a34ba94f8549ee86bd0  csv/3_match_stats/match_stats_2016.csv
          9716c5caf02c92f678ecaa1b589aad31599aebb11077ff5a8c5ca09627139968  csv/3_match_stats/match_stats_2017.csv
          886757b4bc0a1cdd9f82e20a488029adba471a1772e75a54f9afe2455b362d5c  csv/3_match_stats/match_stats_2018.csv
          d59dbec207a2d289f2a90de43d14f5c0a35c75a1b628dca831b9ed24a39df789  csv/3_match_stats/match_stats_2019.csv
          b4dbad8d0bbe16ec457d4f2a123afbd091cc5eeb3faaec1bd23f7384b62fb952  csv/3_match_stats/match_stats_2020.csv
          0db0782d48e6cc880127c686b58d287a9041f853fbdd96d9a23481944bb92b53  csv/3_match_stats/match_stats_2021.csv
          c7098f76a704da7738ae5147f8c0f99817ef8bc972ca9634a0886a6c118964d4  csv/3_match_stats/match_stats_2022.csv
          SHA256
          echo ATP_PINNED_BYTES_VERIFIED
      - name: Wait bounded for active daily CDB writer before authoritative snapshot
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            if python - <<'PY'
          from cdb_global_writer_lock import _remote_lock
          import sys
          if _remote_lock("BackstageTalks/tbt-data"):
              print("CDB_WRITER_BUSY_WAITING_FOR_OWNER_TO_RELEASE", flush=True)
              sys.exit(1)
          print("CDB_WRITER_LOCK_ABSENT", flush=True)
          PY
            then
              exit 0
            fi
            sleep 15
          done
          echo CDB_WRITER_STILL_BUSY__NO_RETRY_OR_FORCE
          exit 1
      - name: Download one stable SHA-verified current 78-year CDB snapshot
        run: |
          set -euo pipefail
          python scripts/download_stable_cdb.py --repository "$CDB_REPO" --tag tbt-data-v1 --out work/cdb --report work/audit/source-snapshot.json
          test "$(find work/cdb -maxdepth 1 -name 'history-*.parquet' | wc -l)" -eq 78
      - name: Link and quarantine ATP 2016-2022 with exact provider isolation
        run: |
          set -euo pipefail
          python scripts/link_atpworldtour_stats.py \
            --history-dir work/cdb \
            --tournaments-csv work/source/csv/1_tournaments/tournaments_2010-2019.csv \
            --tournaments-csv work/source/csv/1_tournaments/tournaments_2020-2022.csv \
            --scores-csv work/source/csv/2_match_scores/match_scores_2010-2019.csv \
            --scores-csv work/source/csv/2_match_scores/match_scores_2020-2022.csv \
            --stats-csv work/source/csv/3_match_stats/match_stats_2016.csv \
            --stats-csv work/source/csv/3_match_stats/match_stats_2017.csv \
            --stats-csv work/source/csv/3_match_stats/match_stats_2018.csv \
            --stats-csv work/source/csv/3_match_stats/match_stats_2019.csv \
            --stats-csv work/source/csv/3_match_stats/match_stats_2020.csv \
            --stats-csv work/source/csv/3_match_stats/match_stats_2021.csv \
            --stats-csv work/source/csv/3_match_stats/match_stats_2022.csv \
            --min-year 2016 --max-year 2022 \
            --include-break-points --require-reciprocal-consistency \
            --expected-provider-quarantine 0 --out-dir work/audit/link
          python - <<'PY'
          import json
          r=json.load(open('work/audit/link/report.json'))
          if (r.get('production_mutated') is not False or r.get('api_requests') != 0
              or r.get('protected_provider_quarantine') != 0
              or r.get('strict_reciprocal_stats') is not True
              or r.get('includes_break_point_rates') is not True
              or r['counts'].get('stat_rows') != 25249
              or r['counts'].get('stat_bad_width',0)):
              raise SystemExit('LINKER_SOURCE_EVIDENCE_CONTRACT_FAILED')
          print('ATP_CDB_LINKER_REPORT',r['counts'])
          PY
      - name: Native provider-safe NULL-only DRY-RUN (NO PRODUCTION WRITES)
        run: |
          set -euo pipefail
          python scripts/import_offline_linked_serve_return.py --stage work/audit/link/auto_linked.jsonl --history-dir work/cdb --out-dir work/audit/native-dry --expected-provider-quarantine 0
          python - <<'PY'
          import json
          from pathlib import Path
          stage=[json.loads(x) for x in Path('work/audit/link/auto_linked.jsonl').read_text().splitlines() if x.strip()]
          r=json.loads(Path('work/audit/native-dry/report.json').read_text())
          c=r['counts']; expected=sum(len(x['incoming_stats']) for x in stage)
          if r.get('production_mutated') is not False or r.get('local_partitions_written') is not False:
              raise SystemExit('DRYRUN_UNEXPECTED_WRITE')
          if c.get('stat_fields_added',0)!=expected or c.get('updated',0)!=len(stage):
              raise SystemExit('NATIVE_DRYRUN_DELTA_MISMATCH')
          if any(c.get(k,0) for k in ('identity_missing','identity_changed','invalid_stats','stat_conflicts')):
              raise SystemExit('NATIVE_DRYRUN_REJECTED')
          link=json.loads(Path('work/audit/link/report.json').read_text())
          summary={'schema':1,'status':'CURRENT_PRODUCTION_CDB_NATIVE_DRYRUN_ONLY',
                   'matches':len(stage),'new_nullable_fields':expected,
                   'source_stat_rows':link['counts'].get('stat_rows',0),
                   'linked_source_matches':link['counts'].get('identity_linked',0),
                   'quarantined_source_conflicts':link['counts'].get('stat_conflict_matches',0),
                   'field_counts':link.get('staged_field_counts',{}),
                   'production_mutated':False,'api_calls':0,'native_counts':c}
          Path('work/audit/summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('ATP_NATIVE_CDB_NULL_DELTA_DRYRUN',json.dumps(summary,sort_keys=True))
          PY

      - name: Gate exact prior-audited positive NULL-only scope
        id: source_gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('work/audit/link/auto_linked.jsonl')
          stage=[json.loads(v) for v in p.read_text().splitlines() if v.strip()]
          report=json.loads(Path('work/audit/summary.json').read_text())
          cells=sum(len(row['incoming_stats']) for row in stage)
          if (report['matches']!=len(stage)
                  or report['new_nullable_fields']!=cells
                  or len(stage)>930 or cells>3410
                  or (len(stage)==0)!=(cells==0)):
              raise SystemExit('SOURCE_SCOPE_CHANGED__WRITER_DISABLED')
          allowed={p+'_'+k for p in ('p1','p2')
                   for k in ('aces','double_faults','first_serve_win','second_serve_win',
                             'service_points_won','return_points_won',
                             'break_point_serve_win','break_point_return_win')}
          if any(row.get('schema')!=1 or row.get('import_ready') is not True
                 or not row.get('sources')
                 or not set(row.get('incoming_stats',{})).issubset(allowed)
                 for row in stage):
              raise SystemExit('SOURCE_STAGE_NOT_IMPORTABLE')
          if cells and not any('break_point' in key
                 for row in stage for key in row['incoming_stats']):
              raise SystemExit('SOURCE_BP_SCOPE_MISSING')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('positive='+('true' if cells else 'false')+'\n')
          print('ATP_GUARDED_SCOPE_CHECK',len(stage),cells,'positive',bool(cells))
          PY

      - name: Private immutable backup, existing CDB writer, CAS and independent remote readback
        if: steps.source_gate.outputs.positive == 'true'
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            python scripts/cdb_global_writer_lock.py release --if-held
          }
          trap cleanup EXIT
          python scripts/cdb_global_writer_lock.py acquire --wait-seconds 1200
          python scripts/cdb_global_writer_lock.py verify

          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          from release_store import ReleaseStore
          from cdb_global_writer_lock import verify
          verify(os.environ['CDB_REPO'],Path('.cdb-global-writer-lock.json'))
          source=Path('work/cdb')
          baseline=json.loads((source/'_tbt_bundle_manifest.json').read_text())['files']
          if ReleaseStore(os.environ['CDB_REPO'],'tbt-data-v1',source)._remote_bundle_files()!=baseline:
              raise SystemExit('CDB_CAS_DRIFT_AFTER_LOCK__NO_WRITE')
          stage=[json.loads(x) for x in Path('work/audit/link/auto_linked.jsonl').read_text().splitlines() if x.strip()]
          years=sorted({int(x['canonical']['scheduled_date_utc'][:4]) for x in stage})
          if not years or not set(years).issubset(set(range(2016,2023))):
              raise SystemExit('STAGED_CDB_YEAR_OUT_OF_SCOPE')
          Path('work/audit/changed-years.json').write_text(json.dumps(years))
          shutil.copytree(source,'work/before')
          shutil.copytree(source,'work/after')
          backup=Path('work/backup'); backup.mkdir(parents=True)
          for name in ['history_manifest.json','_tbt_bundle_manifest.json',*(f'history-{y}.parquet' for y in years)]:
              shutil.copy2(source/name,backup/name)
          print('ATP_PRIVATE_BACKUP_PREPARED',years)
          PY

          tar -czf work/backup/atp-source-sha-pinned-2016-2022.tar.gz -C work/source csv
          cp work/audit/link/auto_linked.jsonl work/backup/
          cp work/audit/link/report.json work/backup/
          cp work/audit/link/quarantine.jsonl work/backup/
          cp work/audit/summary.json work/backup/
          cp work/audit/source-snapshot.json work/backup/
          (cd work/backup && sha256sum -- * > SHA256SUMS && sha256sum -c SHA256SUMS)
          tag="blinq-atp-native-prewrite-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" work/backup/* -R "$CDB_REPO" --target main \
            --title "ATP 2016-2022 verified CDB NULL-only prewrite backup $GITHUB_RUN_ID" \
            --notes "Private immutable original CDB years and manifests, pinned public source bytes, full stage and QA. Restore only with an independent integrity/CAS review."
          mkdir -p work/backup-readback
          gh release download "$tag" -R "$CDB_REPO" -D work/backup-readback
          (cd work/backup-readback && sha256sum --check SHA256SUMS)
          echo ATP_CDB_PRIVATE_SOURCE_AND_BACKUP_SHA_READBACK_VERIFIED

          python scripts/cdb_global_writer_lock.py verify
          python scripts/import_offline_linked_serve_return.py \
            --stage work/audit/link/auto_linked.jsonl --history-dir work/after \
            --out-dir work/audit/local-write --write-partitions --write-history-dir work/after \
            --exact-stats-only --expected-provider-quarantine 0

          python - <<'PY'
          import json
          from pathlib import Path
          from offline_exact_cdb_write import verify_persisted
          stage=[json.loads(x) for x in Path('work/audit/link/auto_linked.jsonl').read_text().splitlines() if x.strip()]
          dry=json.loads(Path('work/audit/native-dry/report.json').read_text())
          write=json.loads(Path('work/audit/local-write/report.json').read_text())
          years=json.loads(Path('work/audit/changed-years.json').read_text())
          actual=verify_persisted(Path('work/before'),Path('work/after'),stage,years)
          expected=sum(len(x['incoming_stats']) for x in stage)
          if (actual['added_values']!=expected or actual['enriched_matches']!=len(stage)
                  or actual['existing_values_overwritten']!=0
                  or write['counts'].get('stat_fields_added')!=expected
                  or write['counts'].get('updated')!=len(stage)
                  or dry['counts'].get('stat_fields_added')!=expected
                  or sorted(map(int,write.get('changed_years') or []))!=years):
              raise SystemExit('NATIVE_LOCAL_WRITE_READBACK_DELTA_MISMATCH')
          Path('work/audit/local-readback.json').write_text(json.dumps(actual,indent=2))
          print('ATP_NATIVE_LOCAL_FULL_YEAR_READBACK_VERIFIED',len(stage),expected)
          PY

          python - <<'PY'
          import json, os
          from pathlib import Path
          from cdb_global_writer_lock import verify
          from release_store import ReleaseStore
          repo=os.environ['CDB_REPO']
          before=Path('work/before'); after=Path('work/after')
          baseline=json.loads((before/'_tbt_bundle_manifest.json').read_text())['files']
          years=json.loads(Path('work/audit/changed-years.json').read_text())
          store=ReleaseStore(repo,'tbt-data-v1',after)
          def cas():
              verify(repo,Path('.cdb-global-writer-lock.json'))
              if store._remote_bundle_files()!=baseline:
                  raise ValueError('CDB_MANIFEST_CAS_CHANGED_BEFORE_UPLOAD')
          cas()
          store.upload_bundle([*(after/f'history-{y}.parquet' for y in years),
                               after/'history_manifest.json'],before_upload=cas)
          print('ATP_CANONICAL_MANIFEST_CAS_PUBLICATION',years)
          PY

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from release_store import ReleaseStore
          from cdb_global_writer_lock import verify
          from offline_exact_cdb_write import verify_persisted
          verify(os.environ['CDB_REPO'],Path('.cdb-global-writer-lock.json'))
          before=Path('work/before')
          after=Path('work/after')
          remote=Path('work/remote-readback')
          ReleaseStore(os.environ['CDB_REPO'],'tbt-data-v1',remote).download(require_bundle_manifest=True)
          years=json.loads(Path('work/audit/changed-years.json').read_text())
          stage=[json.loads(x) for x in Path('work/audit/link/auto_linked.jsonl').read_text().splitlines() if x.strip()]
          verified=verify_persisted(before,remote,stage,years)
          expected=sum(len(x['incoming_stats']) for x in stage)
          if (verified['added_values']!=expected or verified['enriched_matches']!=len(stage)
                  or verified['existing_values_overwritten']!=0):
              raise SystemExit('CDB_REMOTE_VALUES_DIFFER_EXPECTED')
          for year in years:
              file=f'history-{year}.parquet'
              if hashlib.sha256((after/file).read_bytes()).digest()!=hashlib.sha256((remote/file).read_bytes()).digest():
                  raise SystemExit('CDB_REMOTE_YEAR_SHA_DIFFERENT '+file)
          result={'schema':1,'status':'PRODUCTION_CDB_INDEPENDENT_REMOTE_READBACK_VERIFIED',
                  'added_values':verified['added_values'],'enriched_matches':verified['enriched_matches'],
                  'existing_values_overwritten':verified['existing_values_overwritten'],
                  'affected_years':years,'backup_release_tag':'blinq-atp-native-prewrite-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],
                  'source':'serve-and-volley pinned ATP 2016-2022','provider_api_requests':0}
          Path('work/audit/production-verified.json').write_text(json.dumps(result,indent=2)+'\n')
          print('ATP_CDB_PRODUCTION_READBACK_VERIFIED',json.dumps(result,sort_keys=True))
          PY

          python scripts/import_offline_linked_serve_return.py \
            --stage work/audit/link/auto_linked.jsonl --history-dir work/remote-readback \
            --out-dir work/audit/idempotence --expected-provider-quarantine 0
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('work/audit/idempotence/report.json').read_text())
          counts=result.get('counts') or {}
          if (result.get('production_mutated') is not False
                  or result.get('local_partitions_written') is not False
                  or counts.get('updated',0)!=0
                  or counts.get('stat_fields_added',0)!=0):
              raise SystemExit('POSTWRITE_IDEMPOTENCE_FAILED')
          print('ATP_CDB_POSTWRITE_IDEMPOTENCE_ZERO_DELTA')
          PY
          gh release upload "$tag" work/audit/production-verified.json -R "$CDB_REPO"
          echo ATP_CDB_GUARDED_WRITE_COMPLETE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atp-2016-18-pinned-current-cdb-readonly
          path: |
            work/audit/source-snapshot.json
            work/audit/summary.json
            work/audit/link/report.json
            work/audit/link/review.jsonl
            work/audit/link/quarantine.jsonl
            work/audit/native-dry/report.json
          if-no-files-found: ignore
          retention-days: 14
