name: BlinQ Drive content QA to 50 percent - one shot

on:
  pull_request:
    paths:
      - '.github/workflows/blinq-drive-qa50-once.yml'
      - '.github/drive-qa50-request.json'
  push:
    branches: [main]
    paths:
      - '.github/drive-qa50-request.json'

permissions:
  contents: read

concurrency:
  group: blinq-drive-qa50-once-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: b14281432c1ae2c204da14dbc41b4535b409ed6f
          path: private
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q google-auth requests pyarrow
      - name: Verify private 3736 inventory snapshot and safe audit manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('private/research/audit50-20261018/target-manifest.json')
          m=json.loads(p.read_text())
          assert m['schema']==1 and m['read_only'] is True
          assert m['inventory_total']==3736 and m['inventory_content_qa_baseline']==1257
          assert m['content_qa_threshold_50pct']==1868
          assert len(m['targets'])>=2000
          assert len({x['id'] for x in m['targets']})==len(m['targets'])
          assert len({x['sheet_row'] for x in m['targets']})==len(m['targets'])
          assert all(x['status']=='ONLY_METADATA_NOT_CONTENT_CDB_DIFF'
                     for x in m['targets'])
          print("PRIVATE_DRIVE_AUDIT_TARGET_MANIFEST_VALID",len(m['targets']))
          PY
      - name: Synthetic full-data parser tests (no Drive access)
        run: |
          python - <<'PY'
          import sys, io, zipfile, gzip, json
          from pathlib import Path
          sys.path.insert(0,'private/scripts')
          from audit_drive_50pct_content_once import csv_profile,json_profile,jsonl_profile,zipped_content,inspect
          p=csv_profile(b'a,b\n1,2\n3,\n')
          assert p['rows']==2 and p['columns']==2
          assert p['nonempty_by_column']==[2,1] and p['blank_by_column']==[0,1]
          assert csv_profile(b'a,b\n1\n')['physical_width_mismatches']==1
          assert json_profile(b'{"a":1}')['type']=='dict'
          assert jsonl_profile(b'{"a":1}\n{"a":2}\n')['rows']==2
          raw=io.BytesIO()
          with zipfile.ZipFile(raw,'w') as z:z.writestr('source.csv','a,b\n1,2\n')
          result=zipped_content(raw.getvalue(),'.zip')
          assert result['archive_crc_verified'] and result['tabular_profiles'][0]['rows']==1
          import tempfile
          with tempfile.TemporaryDirectory() as temp:
              f=Path(temp)/'data.gz'
              f.write_bytes(gzip.compress(b'{"a":1}\n{"a":2}\n'))
              r=inspect(f,'.gz')
              assert r['gzip'] is True and r['rows']==2
          print("AUDIT50_SOURCE_PARSER_TESTS_PASS")
          PY

  audit:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message,'[drive-qa50-run]') }}
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      BLINQ_DRIVE_READER_JSON: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
      SHARD: ${{ matrix.shard }}
      PRIVATE_REF: b14281432c1ae2c204da14dbc41b4535b409ed6f
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: ${{ env.PRIVATE_REF }}
          path: private
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q google-auth requests pyarrow
      - name: Verify private reader and absence of mutation modes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$BLINQ_DRIVE_READER_JSON"
          test "$(gh api repos/BackstageTalks/tbt-data --jq .private)" = true
          test "$(git -C private rev-parse HEAD)" = "$PRIVATE_REF"
          if grep -En 'DELETE|files/.*(patch|delete)|--write|release upload|release delete' private/scripts/audit_drive_50pct_content_once.py; then
            echo 'BLOCKED: unexpected mutator in the read-only source auditor'
            exit 1
          fi
      - name: Profile actual bytes of up to 180 previously metadata-only files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          python -u private/scripts/audit_drive_50pct_content_once.py \
            --manifest private/research/audit50-20261018/target-manifest.json \
            --out "work/content-qa50-shard-$SHARD.json" \
            --shard "$SHARD" --shards 4 --max-success 180
          python - <<'PY'
          import glob,json
          a=json.load(open(glob.glob('work/content-qa50-shard-*.json')[0]))
          assert a['cdb_mutations']==a['drive_mutations']==0 and a['not_net_new_cdb']
          assert len(a['verified_files'])==a['verified_content_files']
          assert len({x['id'] for x in a['verified_files']})==len(a['verified_files'])
          assert all(len(x['sha256'])==64 for x in a['verified_files'])
          print('FULL_SOURCE_BYTE_QA_PROOF_VALID',a['verified_content_files'])
          PY
      - name: Persist PRIVATE audited evidence, verify remote readback SHA
        shell: bash
        run: |
          set -euo pipefail
          dest="research/audit50-20261018/results/run-$GITHUB_RUN_ID-shard-$SHARD.json"
          branch="audit50-run-$GITHUB_RUN_ID-shard-$SHARD"
          gh api --method POST repos/BackstageTalks/tbt-data/git/refs \
            -f ref="refs/heads/$branch" -f sha="$PRIVATE_REF" >/dev/null
          # A report may exceed Linux' single-argv cap. Post the complete
          # private byte payload through stdin instead of a command argument.
          python - <<'PY' >work/private-api-payload.json
          import os,base64,json
          p='work/content-qa50-shard-'+os.environ['SHARD']+'.json'
          print(json.dumps({
              'message':'audit: verified Drive content QA shard '+os.environ['SHARD']+' run '+os.environ['GITHUB_RUN_ID'],
              'branch':'audit50-run-'+os.environ['GITHUB_RUN_ID']+'-shard-'+os.environ['SHARD'],
              'content':base64.b64encode(open(p,'rb').read()).decode('ascii')}))
          PY
          gh api --method PUT "repos/BackstageTalks/tbt-data/contents/$dest" \
            --input work/private-api-payload.json >/dev/null
          gh api "repos/BackstageTalks/tbt-data/contents/$dest?ref=$branch" \
            --jq .content | base64 --decode >work/readback.json
          cmp "work/content-qa50-shard-$SHARD.json" work/readback.json
          echo "PRIVATE_QA50_SHARD_READBACK_VERIFIED $SHARD"
