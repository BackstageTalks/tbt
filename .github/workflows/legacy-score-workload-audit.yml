name: BlinQ legacy score workload dry-run

on:
  pull_request:
    paths:
      - ".github/workflows/legacy-score-workload-audit.yml"
      - "scripts/dryrun_import_legacy_scores.py"
      - "api/tbt/providers/score.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-legacy-score-workload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install
        run: python -m pip install -r api/requirements-train.txt pytest

      - name: Validate strict score parser
        run: python -m pytest tests/test_score.py -q

      - name: Download checksum-verified canonical history
        run: python scripts/download_production_preflight_inputs.py

      - name: Fetch legacy previous-match cache
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/BackstageTalks/tbt-pro.git .cache/tbt-pro
          test -d .cache/tbt-pro/blinq/data/form/previous_matches

      - name: Zero-API workload gapfill dry-run
        run: |
          python -u scripts/dryrun_import_legacy_scores.py             --history-dir .cache/tbt/history             --legacy-dir .cache/tbt-pro             --out-dir .cache/tbt/legacy-score-dryrun

      - name: Guard read-only mode
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.cache/tbt/legacy-score-dryrun/report.json').read_text())
          assert p.get('zero_provider_api_requests') is True, p
          assert p.get('write_mode') is False, p
          assert p.get('local_partitions_written') is False, p
          print(json.dumps({
              'canonical_rows': p.get('canonical_rows'),
              'stage_rows': p.get('stage_rows'),
              'coverage_before': p.get('coverage_before'),
              'coverage_projected_add': p.get('coverage_projected_add'),
              'coverage_projected_after': p.get('coverage_projected_after'),
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinq-legacy-score-workload-${{ github.run_id }}
          path: |
            .cache/tbt/legacy-score-dryrun/report.json
            .cache/tbt/legacy-score-dryrun/stage.jsonl.gz
            .cache/tbt/legacy-score-dryrun/rejections_sample.jsonl.gz
          if-no-files-found: error
