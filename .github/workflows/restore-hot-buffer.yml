name: V20.7 · Restore rolling Supabase hot buffer from GitHub

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Rolling hot buffer in days (default 60)"
        required: false
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: api
      TBT_HISTORY_DIR: .cache/tbt/history
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TBT_HOT_RETENTION_DAYS: ${{ inputs.retention_days || '60' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
      - name: Download private GH history partitions
        run: bash scripts/download_history_release.sh .cache/tbt
      - name: Restore rolling hot buffer only
        run: |
          python scripts/restore_hot_buffer.py \
            --history-dir "$TBT_HISTORY_DIR" \
            --retention-days "$TBT_HOT_RETENTION_DAYS"
