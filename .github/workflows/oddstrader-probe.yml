name: Probe OddsTrader ATP 20260901

on:
  push:
    branches:
      - research/oddstrader-probe-20260901
    paths:
      - ".github/workflows/oddstrader-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public pages and inspect response
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/oddstrader
          python - <<'PY'
          import json, re, urllib.request, urllib.parse
          from pathlib import Path

          base="https://www.oddstrader.com/atp/"
          cases=[
            ("match-merged", {"date":"20260901","g":"match","m":"merged"}),
            ("match-winner", {"date":"20260901","eid":"","g":"match","m":"winner"}),
            ("match-total", {"date":"20260901","eid":"0","g":"match","m":"total"}),
            ("match-spread", {"date":"20260901","eid":"0","g":"match","m":"spread"}),
            ("1st-set-spread", {"date":"20260901","eid":"0","g":"1st-set","m":"spread"}),
            ("1st-set-winner", {"date":"20260901","eid":"0","g":"1st-set","m":"winner"}),
            ("1st-set-total", {"date":"20260901","eid":"0","g":"1st-set","m":"total"}),
            ("1st-set-merged", {"date":"20260901","eid":"0","g":"1st-set","m":"merged"}),
          ]
          report=[]
          for name,params in cases:
              query=urllib.parse.urlencode(params)
              url=base+"?"+query
              req=urllib.request.Request(url, headers={
                  "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
                  "Accept":"text/html,application/xhtml+xml",
                  "Accept-Language":"en-US,en;q=0.9",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body=r.read()
                      status=r.status
                      ctype=r.headers.get("content-type","")
                  text=body.decode("utf-8","replace")
                  Path(f".cache/oddstrader/{name}.html").write_text(text,encoding="utf-8")
                  report.append({
                      "name":name,"url":url,"status":status,"bytes":len(body),"content_type":ctype,
                      "has_next_data":"__NEXT_DATA__" in text,
                      "has_dom_thiem":"Dominic Thiem" in text,
                      "has_tsitsipas":"Stefanos Tsitsipas" in text,
                      "api_strings":sorted(set(re.findall(r'https?://[^\"\'<> ]+|/api/[A-Za-z0-9_?&=./%-]+', text)))[:80],
                      "script_srcs":re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',text)[:80],
                  })
              except Exception as e:
                  report.append({"name":name,"url":url,"error":repr(e)})
          Path(".cache/oddstrader/report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY

      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddstrader-probe
          path: .cache/oddstrader
          retention-days: 7
