name: BlinQ read-only selector reliability replay
on:
  push:
    branches: [analysis/selection-reliability-replay-20261103, main, fix/top-quality-no-forced-fill-20261107]
    paths:
      - scripts/replay_selection_reliability.py
      - scripts/replay_top_strategy.py
      - scripts/audit_issued_top_categories.py
      - tests/test_selection_reliability_replay.py
      - tests/test_top_strategy_replay.py
      - tests/test_issued_top_categories.py
      - .github/workflows/selection-replay-readonly.yml
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'  # Daily, read-only; UTC; no provider quota

permissions:
  contents: read

concurrency:
  group: blinq-selection-replay-readonly
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install replay-only dependencies
        run: python -m pip install pytest pandas pyarrow
      - name: Run isolated safety regression tests
        run: python -m pytest tests/test_selection_reliability_replay.py tests/test_top_strategy_replay.py tests/test_issued_top_categories.py -q
      - name: Read-only download from existing private releases with pre/post inventory pin
        shell: bash
        run: |
          set -euo pipefail
          : "### Verify token without printing it"
          test -n "$GH_TOKEN"
          mkdir -p .cache/tbt/selection-replay/{pred,history}
          work=".cache/tbt/selection-replay"
          gh api "repos/$TBT_DATA_REPOSITORY/releases/tags/tbt-predictions-v1" > "$work/pred-before.json"
          gh api "repos/$TBT_DATA_REPOSITORY/releases/tags/tbt-data-v1" > "$work/history-before.json"
          gh release download tbt-predictions-v1 --repo "$TBT_DATA_REPOSITORY" \
            --pattern 'selection_candidates_2026-1*.json.gz' \
            --pattern 'ledger.json' \
            --pattern 'feed.json' \
            --pattern '_tbt_bundle_manifest.json' --dir "$work/pred"
          gh release download tbt-data-v1 --repo "$TBT_DATA_REPOSITORY" \
            --pattern 'history-2026.parquet' \
            --pattern 'history_manifest.json' \
            --pattern '_tbt_bundle_manifest.json' --dir "$work/history"
          gh api "repos/$TBT_DATA_REPOSITORY/releases/tags/tbt-predictions-v1" > "$work/pred-after.json"
          gh api "repos/$TBT_DATA_REPOSITORY/releases/tags/tbt-data-v1" > "$work/history-after.json"
      - name: Chronological current-vs-proposed equal-capacity replay
        shell: bash
        run: |
          set -euo pipefail
          work=".cache/tbt/selection-replay"
          python scripts/replay_selection_reliability.py \
            --snapshots "$work"/pred/selection_candidates_2026-1*.json.gz \
            --canonical "$work/history/history-2026.parquet" \
            --prediction-before "$work/pred-before.json" \
            --prediction-after "$work/pred-after.json" \
            --history-before "$work/history-before.json" \
            --history-after "$work/history-after.json" \
            --out "$work/report.json" \
            --forward-out "$work/forward-report.json" \
            --forward-from 2026-11-04
      - name: Full-slate frozen strict TOP and ATP/WTA main-tier shadow (read-only)
        shell: bash
        run: |
          set -euo pipefail
          work=".cache/tbt/selection-replay"
          python scripts/replay_top_strategy.py \
            --snapshots "$work"/pred/selection_candidates_2026-1*.json.gz \
            --canonical "$work/history/history-2026.parquet" \
            --out "$work/top-strategy-report.json"
      - name: Independently grade actually issued TOP and VALUE from full ledger (read-only)
        shell: bash
        run: |
          set -euo pipefail
          work=".cache/tbt/selection-replay"
          python scripts/audit_issued_top_categories.py \
            --ledger "$work/pred/ledger.json" \
            --canonical "$work/history/history-2026.parquet" \
            --prediction-before "$work/pred-before.json" \
            --prediction-after "$work/pred-after.json" \
            --out "$work/issued-top-categories.json"
      - name: Compare current public Results overlay with frozen private ledger (optional, read-only)
        shell: bash
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
        run: |
          set -euo pipefail
          work=".cache/tbt/selection-replay"
          code="$(curl --silent --show-error --compressed --retry 0 --max-time 60 \
            --max-filesize 35000000 -H 'Accept: application/json' \
            --write-out '%{http_code}' --output "$work/live-public-feed.json" \
            "${BLINQ_BASE_URL%/}/api/v1/feed" || true)"
          if [[ "$code" != "200" ]]; then
            python - "$work/live-results-access.json" "$code" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "status":"BLOCKED_OR_UNAVAILABLE","http_status":sys.argv[2],
              "is_full_archive":False,"provider_requests":0,"production_mutated":False
          })+"\n")
          PY
            rm -f "$work/live-public-feed.json"
            echo "LIVE_RESULTS_NOT_ACCESSIBLE HTTP=$code; no claim of current Results coverage"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          work=Path(".cache/tbt/selection-replay")
          feed=json.loads((work/"live-public-feed.json").read_text(encoding="utf-8"))
          if not isinstance(feed,dict) or not isinstance(feed.get("results"),list):
              raise SystemExit("HTTP200 but no results[]; fail closed")
          rows=feed["results"]
          overlay=[row for row in rows if isinstance(row,dict)
              and row.get("runtime_result_overlay") is True
              and row.get("archive_source")=="verified_match_status_snapshot"]
          (work/"live-visible-overlays.json").write_text(json.dumps(overlay))
          (work/"live-results-access.json").write_text(json.dumps({
              "status":"LIVE_PUBLIC_FEED_READ","feed_result_rows":len(rows),
              "verified_visible_overlay_rows":len(overlay),
              "is_full_archive":False,"provider_requests":0,"production_mutated":False
          })+"\n")
          PY
          python scripts/audit_settled_archive_reconciled.py \
            --ledger "$work/pred/ledger.json" \
            --feed "$work/live-public-feed.json" \
            --archive "$work/live-visible-overlays.json" \
            --out "$work/live-results-reconciliation.json"
          python - <<'PY'
          import json
          from pathlib import Path
          work=Path(".cache/tbt/selection-replay")
          r=json.loads((work/"live-results-reconciliation.json").read_text())
          if r.get("production_mutated") is not False or r.get("complete_issued_history_verified") is not False:
              raise SystemExit("unexpected live Results audit status")
          print("LIVE_READONLY_PARITY",json.dumps({
              "total":r["total"],"input_counters":r["input_counters"],
              "complete_archive":False,"strategies_certified":0
          }))
          PY
          rm -f "$work/live-public-feed.json" "$work/live-visible-overlays.json"
      - name: Private evidence summary and interpretation limits
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(".cache/tbt/selection-replay/report.json").read_text())
          forward=json.loads(Path(".cache/tbt/selection-replay/forward-report.json").read_text())
          top=json.loads(Path(".cache/tbt/selection-replay/top-strategy-report.json").read_text())
          issued=json.loads(Path(".cache/tbt/selection-replay/issued-top-categories.json").read_text())
          live_access_path=Path(".cache/tbt/selection-replay/live-results-access.json")
          live_access=json.loads(live_access_path.read_text()) if live_access_path.exists() else {"status":"NOT_CHECKED"}
          summary=[
            "### Read-only BlinQ selection replay (private evidence)",
            f"Status: {report['status']}",
            f"Anchored days: {report['anchored_days']}; exact model-event rows: {report['evaluated_unique_model_events']}",
            "A (per frozen model version):",
            f"Forward frozen since {forward['prospective_from_betting_day']}: {forward['anchored_days']} days / {forward['evaluated_unique_model_events']} candidate rows",
            f"Forward readiness: {forward['operational_readiness']}; no automatic promotion.",
          ]
          for version, item in report["model_quality_A"].items():
              m=item["all_candidates_raw"]
              summary.append(f"- {version}: candidates={m['selected']}; settled={m['settled']}; raw hit={m['hit_rate']}; raw Brier={m['brier']}")
          summary.append("Strict TOP quality (candidate replay, not issued-bet results):")
          for version, v in top["models"].items():
              for key in ("original_candidate_top", "strict_80_all_tours", "strict_80_verified_atp_wta_only"):
                  m=v[key]
                  summary.append(f"- {version}/{key}: settled={m['settled']}/{m['candidate_count']}; wins={m['wins']}; losses={m['losses']}; hit={m['hit_rate']}; hypothetical_roi={m['hypothetical_roi']}")
              summary.append(f"- {version}: missing pre-match competition={v['pre_match_competition_unknown']}; category breakdown in artifact")
          summary.append("Independently verified REAL issued TOP/VALUE (not unissued candidates):")
          summary.append(f"- raw issued={issued['raw_issued_publication_rows']}; exact verified={issued['exact_canonical_settled_unique']}; proven quote time={issued['quote_time_proven_issued_unique']}")
          for label, cohort in (("canonical", issued["canonical_verified"]), ("PIT_quote_proven", issued["pit_quote_proven"])):
              summary.append(f"- {label} overall: {cohort['overall']}")
              for category, result in cohort["by_category"].items():
                  summary.append(f"  {category}: {result}")
          summary.append(f"- issued audit exclusions (nonexclusive): {issued['rejected_or_unverified_counts_nonexclusive']}")
          summary.append(f"Public live Results readback (NOT full archive): {live_access}")
          summary.append("B (per model and section; not issued-bet outcomes):")
          for scope, variants in report["selector_comparison_B"].items():
              core=variants["baseline_assignment"]
              summary.append(f"- {scope}: baseline n={core['settled']}/{core['selected']}, hit={core['hit_rate']}; comparison={variants['comparison_readiness']}")
          summary.extend([
            f"Exclusions: {report['diagnostics']}",
            "Pre-match frozen candidate assignments are not issued public bets.",
            "Serve/return observation and rank freshness are unavailable in the frozen snapshot schema.",
            "No provider/API requests, CDB mutation, model fitting, selector promotion or live deploy.",
          ])
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary)+"\n")
          print("\n".join(summary))
          PY
      - name: Preserve aggregate research report (not raw private data)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinq-selection-replay-${{ github.run_id }}
          path: |
            .cache/tbt/selection-replay/report.json
            .cache/tbt/selection-replay/forward-report.json
            .cache/tbt/selection-replay/top-strategy-report.json
            .cache/tbt/selection-replay/issued-top-categories.json
            .cache/tbt/selection-replay/live-results-access.json
            .cache/tbt/selection-replay/live-results-reconciliation.json
          if-no-files-found: warn
          retention-days: 14
