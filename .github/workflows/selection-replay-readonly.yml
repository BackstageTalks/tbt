name: BlinQ read-only selector reliability replay
on:
  push:
    branches: [analysis/selection-reliability-replay-20261103, main]
    paths:
      - scripts/replay_selection_reliability.py
      - tests/test_selection_reliability_replay.py
      - .github/workflows/selection-replay-readonly.yml
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'  # Daily, read-only; UTC; no provider quota

permissions:
  contents: read

concurrency:
  group: blinq-selection-replay-readonly
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install replay-only dependencies
        run: python -m pip install pytest pandas pyarrow
      - name: Run isolated safety regression tests
        run: python -m pytest tests/test_selection_reliability_replay.py -q
      - name: Read-only download from existing private releases with pre/post inventory pin
        shell: bash
        run: |
          set -euo pipefail
          : "### Verify token without printing it"
          test -n "$GH_TOKEN"
          mkdir -p .cache/tbt/selection-replay/{pred,history}
          work=".cache/tbt/selection-replay"
          gh api "repos/$TBT_DATA_REPOSITORY/releases/tags/tbt-predictions-v1" > "$work/pred-before.json"
          gh api "repos/$TBT_DATA_REPOSITORY/releases/tags/tbt-data-v1" > "$work/history-before.json"
          gh release download tbt-predictions-v1 --repo "$TBT_DATA_REPOSITORY" \
            --pattern 'selection_candidates_2026-1*.json.gz' \
            --pattern '_tbt_bundle_manifest.json' --dir "$work/pred"
          gh release download tbt-data-v1 --repo "$TBT_DATA_REPOSITORY" \
            --pattern 'history-2026.parquet' \
            --pattern 'history_manifest.json' \
            --pattern '_tbt_bundle_manifest.json' --dir "$work/history"
          gh api "repos/$TBT_DATA_REPOSITORY/releases/tags/tbt-predictions-v1" > "$work/pred-after.json"
          gh api "repos/$TBT_DATA_REPOSITORY/releases/tags/tbt-data-v1" > "$work/history-after.json"
      - name: Chronological current-vs-proposed equal-capacity replay
        shell: bash
        run: |
          set -euo pipefail
          work=".cache/tbt/selection-replay"
          python scripts/replay_selection_reliability.py \
            --snapshots "$work"/pred/selection_candidates_2026-1*.json.gz \
            --canonical "$work/history/history-2026.parquet" \
            --prediction-before "$work/pred-before.json" \
            --prediction-after "$work/pred-after.json" \
            --history-before "$work/history-before.json" \
            --history-after "$work/history-after.json" \
            --out "$work/report.json" \
            --forward-out "$work/forward-report.json" \
            --forward-from 2026-11-04
      - name: Private evidence summary and interpretation limits
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(".cache/tbt/selection-replay/report.json").read_text())
          forward=json.loads(Path(".cache/tbt/selection-replay/forward-report.json").read_text())
          summary=[
            "### Read-only BlinQ selection replay (private evidence)",
            f"Status: {report['status']}",
            f"Anchored days: {report['anchored_days']}; exact model-event rows: {report['evaluated_unique_model_events']}",
            "A (per frozen model version):",
            f"Forward frozen since {forward['prospective_from_betting_day']}: {forward['anchored_days']} days / {forward['evaluated_unique_model_events']} candidate rows",
            f"Forward readiness: {forward['operational_readiness']}; no automatic promotion.",
          ]
          for version, item in report["model_quality_A"].items():
              m=item["all_candidates_raw"]
              summary.append(f"- {version}: candidates={m['selected']}; settled={m['settled']}; raw hit={m['hit_rate']}; raw Brier={m['brier']}")
          summary.append("B (per model and section; not issued-bet outcomes):")
          for scope, variants in report["selector_comparison_B"].items():
              core=variants["baseline_assignment"]
              summary.append(f"- {scope}: baseline n={core['settled']}/{core['selected']}, hit={core['hit_rate']}; comparison={variants['comparison_readiness']}")
          summary.extend([
            f"Exclusions: {report['diagnostics']}",
            "Pre-match frozen candidate assignments are not issued public bets.",
            "Serve/return observation and rank freshness are unavailable in the frozen snapshot schema.",
            "No provider/API requests, CDB mutation, model fitting, selector promotion or live deploy.",
          ])
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary)+"\n")
          print("\n".join(summary))
          PY
      - name: Preserve aggregate research report (not raw private data)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinq-selection-replay-${{ github.run_id }}
          path: |
            .cache/tbt/selection-replay/report.json
            .cache/tbt/selection-replay/forward-report.json
          if-no-files-found: warn
          retention-days: 14
