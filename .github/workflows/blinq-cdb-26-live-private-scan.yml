name: BlinQ 26 CDB private read-only matching
'on':
  push:
    branches: [main]
    paths: ['scripts/cdb_26_live_candidate_scan.py', 'tests/test_cdb_26_live_candidate_scan.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blinq-cdb-26-private-readonly
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_REPO: BackstageTalks/tbt-data
      PRIVATE_SOURCE_COMMIT: 75aa98c4aba43777077838b8ae9c4a4ea9b7e092
      PRIVATE_REPORT_BRANCH: audit/l2-cdb-26-live-canonical-20261017
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test candidate matching on public synthetic data
        run: |
          python -m py_compile scripts/cdb_26_live_candidate_scan.py
          python -m unittest discover -q -s tests -p 'test_cdb_26_live_candidate_scan.py'
      - name: Fetch private source and six CURRENT release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          test -n "$GH_TOKEN" || { echo 'NO_PRIVATE_TOKEN'; exit 1; }
          mkdir -p "$RUNNER_TEMP/blinq26/cdb" "$RUNNER_TEMP/blinq26/results"
          gh api "repos/$PRIVATE_REPO/contents/audit/l2_cdb_26_source_index_20261017.psv?ref=$PRIVATE_SOURCE_COMMIT" --jq .content | base64 --decode >"$RUNNER_TEMP/blinq26/source.psv"
          test "$(git hash-object "$RUNNER_TEMP/blinq26/source.psv")" = cfb4496f891edfeaad35ac481b0fefde5f201049 || { echo 'SOURCE_HASH_DRIFT'; exit 1; }
          gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" >"$RUNNER_TEMP/blinq26/release.json"
          for y in 2021 2022 2023 2024 2025; do
            gh release download tbt-data-v1 -R "$PRIVATE_REPO" -p "history-$y.parquet" -D "$RUNNER_TEMP/blinq26/cdb" >/dev/null
          done
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -p history_manifest.json -D "$RUNNER_TEMP/blinq26/cdb" >/dev/null
          gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" >"$RUNNER_TEMP/blinq26/release_after.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'blinq26'
          a=json.loads((p/'release.json').read_text());b=json.loads((p/'release_after.json').read_text())
          names=[f'history-{y}.parquet' for y in range(2021,2026)]+['history_manifest.json']
          def snapshot(r):
              assets={x['name']:(x['id'],x['size'],x.get('digest')) for x in r['assets']}
              return r['id'],tuple(assets[k] for k in names)
          assert snapshot(a)==snapshot(b),'canonical release changed during fetch'
          print('SIX_CURRENT_PRIVATE_ASSETS_STABLE')
          PY
      - name: SHA-verified private-only identity candidate audit
        shell: bash
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check pyarrow cryptography
          python scripts/cdb_26_live_candidate_scan.py --cdb-dir "$RUNNER_TEMP/blinq26/cdb" --source "$RUNNER_TEMP/blinq26/source.psv" --release-json "$RUNNER_TEMP/blinq26/release.json" --output "$RUNNER_TEMP/blinq26/results/report.json" >"$RUNNER_TEMP/blinq26/scan.log" 2>&1 || { echo 'PRIVATE_SCAN_FAILED_REDACTED'; exit 1; }
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'blinq26/results/report.json').read_text())
          assert r['source_count']==26 and r['cdb_writes']==0 and r['bulk_import_authorized'] is False
          print('CDB26_RESEARCH_ONLY',json.dumps(r['counts'],sort_keys=True))
          PY
      - name: Emit compressed encrypted per-ID audit (no plaintext in public logs)
        shell: bash
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,json,os,pathlib
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          pub=serialization.load_der_public_key(base64.b64decode(""))
          raw=(pathlib.Path(os.environ['RUNNER_TEMP'])/'blinq26/results/report.json').read_bytes()
          key=os.urandom(32);nonce=os.urandom(12)
          data=AESGCM(key).encrypt(nonce,gzip.compress(raw),None)
          wrap=pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          envelope={'v':1,'key':base64.b64encode(wrap).decode(),'nonce':base64.b64encode(nonce).decode(),'ciphertext':base64.b64encode(data).decode()}
          print('BLINQ26_ENCRYPTED_REPORT_V1='+base64.b64encode(json.dumps(envelope,separators=(',',':')).encode()).decode())
          PY
      - name: Store sensitive report exclusively in private audit branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          DATA="$(base64 -w0 "$RUNNER_TEMP/blinq26/results/report.json")"
          gh api -X PUT "repos/$PRIVATE_REPO/contents/audit/l2_cdb_26_current_release_winner_checked_candidates.json" -f message="audit(cdb): private read-only 26-case context results" -f branch="$PRIVATE_REPORT_BRANCH" -f content="$DATA" >/dev/null 2>"$RUNNER_TEMP/blinq26/private-upload.err" || { echo 'PRIVATE_REPORT_WRITE_SCOPE_BLOCKED'; exit 1; }
          echo 'PRIVATE_CDB26_AUDIT_RESULT_PERSISTED_ZERO_CDB_WRITES'
