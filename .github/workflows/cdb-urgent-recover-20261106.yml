name: One-shot 2026-11-06 guarded CDB integrity recovery and picks refresh
on:
  push:
    branches: [main]
    paths:
      - scripts/recover_cdb_stalled_release_20261106.py
      - .github/workflows/cdb-urgent-recover-20261106.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: tbt-emergency-cdb-integrity-20261106
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install existing CDB history validation dependencies
        run: python -m pip install -r api/requirements-train.txt pytest
      - name: Offline recovery contract tests - fail before lock on regression
        run: python -m pytest -q tests/test_recover_cdb_stalled_release_20261106.py tests/test_release_store_guarded_publish.py
      - name: Acquire authoritative cross-repository CDB writer
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python scripts/cdb_global_writer_lock.py acquire --wait-seconds 1200
      - name: Read-only audit of exact failed bundle with no provider calls
        run: |
          set -euo pipefail
          python scripts/recover_cdb_stalled_release_20261106.py
      - name: Metadata-only repair through existing guarded CDB writer
        run: |
          set -euo pipefail
          python scripts/recover_cdb_stalled_release_20261106.py --apply
      - name: Preserve counts-only private integrity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cdb-20261106-recovery-evidence-${{ github.run_id }}
          path: .cache/tbt/cdb-recovery-20261106/report.json
          retention-days: 14
          if-no-files-found: warn
      - name: Release only own CDB global lock
        if: always()
        run: python scripts/cdb_global_writer_lock.py release --if-held
      - name: Dispatch one current-day refresh only after verified CDB readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
          WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.getenv("WORKER_TOKEN", "")
          url=os.environ.get("BUDGET_URL", "")
          if not token or not url.startswith("https://"):
              raise SystemExit("Shared provider budget unavailable; no refresh dispatched")
          req=urllib.request.Request(url, headers={"X-Blinq-Worker-Token":token}, method="GET")
          with urllib.request.urlopen(req, timeout=20) as response:
              payload=json.load(response)
          budget=payload.get("budget")
          if (payload.get("ok") is not True or not isinstance(budget,dict)
                  or budget.get("global_limit")!=14500
                  or budget.get("provider_plan_limit")!=15000
                  or budget.get("reserved_provider_headroom")!=500
                  or budget.get("window")!="provider_day_17_09_utc"):
              raise SystemExit("Shared provider budget contract unverified")
          spent=int(budget["global_spent"])
          available=min(int(budget["global_remaining"]), 14500-spent)
          if available<=0:
              raise SystemExit("No verified provider-day capacity; CDB repaired, picks refresh blocked")
          for state in ("queued","in_progress","waiting","pending"):
              raw=subprocess.check_output(
                  ["gh","api",f"repos/{repo}/actions/workflows/data.yml/runs?status={state}&per_page=100"],text=True)
              listing=json.loads(raw)
              if int(listing.get("total_count",0))>100:
                  raise SystemExit("Active refresh run pagination unknown; stop")
              for item in listing.get("workflow_runs",[]):
                  if item.get("head_branch")=="main":
                      print("Existing data pipeline active; do not dispatch duplicate",item.get("html_url"))
                      raise SystemExit(0)
          command=["gh","workflow","run","data.yml","--repo",repo,"--ref","main",
                   "-f","mode=current-refresh","-f","morning_refresh=true",
                   "-f","promote=false","-f",f"max_requests={available}",
                   "-f","betting_day_start_hour=6"]
          subprocess.run(command,check=True)
          print("RECOVERY_REFRESH_DISPATCHED",json.dumps({
              "mode":"current-refresh","max_requests":available,
              "shared_spent_before":spent,"no_model_promotion":True,
          }),flush=True)
          PY
