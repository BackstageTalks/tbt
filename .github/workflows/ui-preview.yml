name: UI preview capture
run-name: "UI preview · ${{ github.sha }}"

on:
  push:
    branches:
      - preview/real-ui-screenshot-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install chromium
      - run: python tests/capture_ui_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: artifacts/ui-preview/*.png
          if-no-files-found: error
