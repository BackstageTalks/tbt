name: V20.6 · Migrate existing GH snapshot to yearly partitions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbt-history-release-v1
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: api
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1
      TBT_HISTORY_DIR: .cache/tbt/history

    steps:
      - uses: actions/checkout@v4

      - name: Verify private data repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TBT_DATA_REPOSITORY"
          test -n "$TBT_DATA_GH_TOKEN"
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing non-private data repo: $visibility"; exit 1; }
          echo "Supabase is intentionally not configured in this migration job."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          python -m compileall -q api scripts

      - name: Download existing monolithic GitHub snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt
          gh release download "$TBT_HISTORY_RELEASE_TAG" \
            --repo "$TBT_DATA_REPOSITORY" \
            --pattern 'training_snapshot.parquet' \
            --pattern 'training_snapshot.meta.json' \
            --dir .cache/tbt \
            --clobber
          test -s .cache/tbt/training_snapshot.parquet
          test -s .cache/tbt/training_snapshot.meta.json

      - name: Merge legacy snapshot into yearly partitions
        run: |
          python scripts/migrate_legacy_history.py \
            --legacy-snapshot .cache/tbt/training_snapshot.parquet \
            --legacy-meta .cache/tbt/training_snapshot.meta.json \
            --history-dir "$TBT_HISTORY_DIR"

      - name: Prove lossless legacy coverage
        run: |
          python scripts/validate_history_partitions.py \
            --history-dir "$TBT_HISTORY_DIR" \
            --legacy-snapshot .cache/tbt/training_snapshot.parquet

      - name: Publish yearly partitions and manifest
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TBT_HISTORY_RELEASE_TAG" \
            "$TBT_HISTORY_DIR"/history-*.parquet \
            "$TBT_HISTORY_DIR"/history_manifest.json \
            --repo "$TBT_DATA_REPOSITORY" \
            --clobber
          echo "Legacy training_snapshot.* assets are intentionally retained as rollback backup."
