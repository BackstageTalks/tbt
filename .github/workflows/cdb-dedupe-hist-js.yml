name: BlinQ guarded hist-js exact duplicate removal

on:
  pull_request:
    paths:
      - '.github/workflows/cdb-dedupe-hist-js.yml'
      - 'scripts/cdb_dedupe_hist_js.py'
      - '.github/cdb-dedupe-request.json'
  push:
    branches: [main]
    paths: ['.github/cdb-dedupe-request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Run-unique waiting slot: the private global Git tag serializes writes.
  group: tbt-crossrepo-dedupe-hist-js-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Resolve fail-closed request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            mode=dry-run
          else
            mode="$(jq -r '.mode // "dry-run"' .github/cdb-dedupe-request.json)"
          fi
          [[ "$mode" == "dry-run" || "$mode" == "write" ]]
          if [[ "$mode" == "write" ]]; then
            test "$(jq -r '.approved_by_operator // false' .github/cdb-dedupe-request.json)" = true
            test "$(jq -r '.workflow // empty' .github/cdb-dedupe-request.json)" = "cdb-dedupe-hist-js.yml"
          fi
          test "$TBT_DATA_REPOSITORY" = "BackstageTalks/tbt-data"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Staged stats import mode: $mode"

      - name: Install and run exact-source breakpoint recovery tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = PRIVATE
          python -m pip install -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_cdb_global_writer_lock.py tests/test_cdb_writer_workflow_coverage.py
          python -m compileall -q scripts/cdb_dedupe_hist_js.py scripts/download_stable_cdb.py

      - name: Acquire global canonical writer lock
        if: ${{ steps.request.outputs.mode == 'write' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_global_writer_lock.py acquire --wait-seconds 1200



      - name: Download one coherent checksum-verified canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_stable_cdb.py \
            --repository "$TBT_DATA_REPOSITORY" \
            --out .cache/tbt/cdb-dedupe/history \
            --report .cache/tbt/cdb-dedupe/source-snapshot.json

      - name: Stage NULL-only additions from committed staging file
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_dedupe_hist_js.py \
            --mode stage \
            --history-dir .cache/tbt/cdb-dedupe/history \
            --out-dir .cache/tbt/cdb-dedupe/stage
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(".cache/tbt/cdb-dedupe")
          report=json.loads((root/"stage/report.json").read_text())
          counts=report["counts"]
          assert report["production_mutated"] is False and report["provider_requests"] == 0
          if os.environ.get("GITHUB_EVENT_NAME") == "push" and json.loads(Path(".github/cdb-dedupe-request.json").read_text()).get("mode") == "write":
            request=json.loads(Path(".github/cdb-dedupe-request.json").read_text())
            snap=json.loads((root/"source-snapshot.json").read_text())
            assert snap["status"]=="verified"  # hourly pipeline changes the manifest; publish step does the CAS under the global lock
            assert request.get("mode")=="write" and request.get("approved_by_operator") is True
            assert counts.get("removed_matches",0)==request.get("expected_removed_matches"), "Removal count drift"
            assert counts.get("moved_stat_values",0)==request.get("expected_moved_stat_values"), "Moved stats drift"
            assert report["changed_years"]==request.get("expected_changed_years"), "Year scope drift"
            assert report["removals_by_year"]==request.get("expected_removals_by_year"), "Per-year removal drift"
            assert counts.get("removed_matches",0)>0, "Nothing to remove"
          assert counts.get("invalid_stats_json",0)==0, "Invalid stats_json"
          valid_years=set(map(int,json.loads((root/"history/history_manifest.json").read_text())["years"]))
          assert report["changed_years"]==sorted(set(report["changed_years"]))
          assert all(int(y) in valid_years for y in report["changed_years"]), "Staged year absent from canonical snapshot"
          stage=[json.loads(x) for x in (root/"stage/stage.jsonl").read_text().splitlines() if x.strip()]
          assert len(stage)==counts.get("removed_matches",0)
          assert len({row["remove_id"] for row in stage})==len(stage)
          assert len({row["keep_id"] for row in stage})==len(stage)
          assert all(row["remove_id"].startswith("hist-js") and not row["keep_id"].startswith("hist-js") for row in stage)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
            f.write("changes="+("true" if stage else "false")+"\n")
          print("Strict native count stage:", counts, flush=True)
          PY

      - name: Rehearse exact staged stats writes with complete CDB diff (dry-run only)
        if: ${{ steps.request.outputs.mode == 'dry-run' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/tbt/cdb-dedupe
          cp -a "$root/history" "$root/rehearsal-before"
          python scripts/cdb_dedupe_hist_js.py \
            --mode write --history-dir "$root/history" \
            --stage-file "$root/stage/stage.jsonl" \
            --out-dir "$root/rehearsal"
          python scripts/cdb_dedupe_hist_js.py \
            --mode verify --history-dir "$root/history" \
            --before-dir "$root/rehearsal-before" \
            --stage-file "$root/stage/stage.jsonl" \
            --out-dir "$root/rehearsal-readback"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".cache/tbt/cdb-dedupe")
          staged=json.loads((root/"stage/report.json").read_text())["counts"]
          write=json.loads((root/"rehearsal/report.json").read_text())
          checked=json.loads((root/"rehearsal-readback/report.json").read_text())
          assert write["removed"]==staged["removed_matches"]
          assert checked["status"]=="verified" and checked["unplanned_changes"]==0
          assert checked["removed_matches"]==staged["removed_matches"]
          assert checked["moved_stat_values"]==staged["moved_stat_values"]
          print("DRY-RUN duplicate removal, full before/after readback verified, no remote publication.")
          PY

      - name: Create immutable prewrite backup and independently verify checksum
        if: ${{ steps.request.outputs.mode == 'write' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/tbt/cdb-dedupe
          mkdir -p "$root/backup" "$root/backup-readback"
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path(".cache/tbt/cdb-dedupe")
          years=json.loads((root/"stage/report.json").read_text())["changed_years"]
          names=["history_manifest.json","_tbt_bundle_manifest.json"] + [f"history-{year:04d}.parquet" for year in years]
          assert years and all((root/"history"/n).is_file() for n in names)
          for n in names:
            shutil.copyfile(root/"history"/n,root/"backup"/n)
          print("Backup assets:",len(names))
          PY
          (cd "$root/backup" && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
          tag="blinq-cdb-dedupe-prewrite-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$root/backup/"* -R "$TBT_DATA_REPOSITORY" \
            --title "Immutable hist-js dedupe prewrite backup" \
            --notes "Exact original changed year partitions and both source manifests. Never overwrite. Restore before another writer if readback fails."
          gh release download "$tag" -R "$TBT_DATA_REPOSITORY" -D "$root/backup-readback"
          (cd "$root/backup-readback" && sha256sum -c SHA256SUMS)
          cp -a "$root/history" "$root/before"

      - name: Persist exact prewrite batch evidence in private data release
        if: ${{ steps.request.outputs.mode == 'write' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/tbt/cdb-dedupe
          mkdir -p "$root/evidence" "$root/evidence-readback"
          cp "$root/stage/stage.jsonl" "$root/evidence/stage.jsonl"
          cp "$root/stage/report.json" "$root/evidence/report.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(".cache/tbt/cdb-dedupe")
          snap=json.loads((root/"source-snapshot.json").read_text())
          report=json.loads((root/"stage/report.json").read_text())
          data=(root/"evidence/stage.jsonl").read_bytes()
          record={"batch_id":f"blinq-cdb-dedupe-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
                  "prewrite_manifest_sha256":snap["manifest_sha256"],
                  "stage_sha256":hashlib.sha256(data).hexdigest(),
                  "removed_rows":report["counts"]["removed_matches"],
                  "moved_stat_values":report["counts"]["moved_stat_values"],
                  "policy":"hist_js_exact_duplicate_removal_v1",
                  "overwriting_preexisting":False,
                  "model_promotion":False}
          (root/"evidence/batch.json").write_text(json.dumps(record,sort_keys=True,indent=2))
          PY
          (cd "$root/evidence" && sha256sum stage.jsonl report.json batch.json > SHA256SUMS)
          tag="blinq-cdb-dedupe-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$root/evidence/"* -R "$TBT_DATA_REPOSITORY" --target main \
            --title "Private hist-js dedupe evidence" \
            --notes "Exact duplicate list (week+players+winner), stats moved NULL-only to native twin"
          gh release download "$tag" -R "$TBT_DATA_REPOSITORY" -D "$root/evidence-readback"
          (cd "$root/evidence-readback" && sha256sum -c SHA256SUMS)
          echo "PRIVATE_COUNT_BATCH_READBACK_PASS:$tag"

      - name: Apply verified local year partitions and compare full before/after CDB
        if: ${{ steps.request.outputs.mode == 'write' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/tbt/cdb-dedupe
          python scripts/cdb_dedupe_hist_js.py \
            --mode write --history-dir "$root/history" \
            --stage-file "$root/stage/stage.jsonl" --out-dir "$root/write"
          python scripts/cdb_dedupe_hist_js.py \
            --mode verify --history-dir "$root/history" --before-dir "$root/before" \
            --stage-file "$root/stage/stage.jsonl" --out-dir "$root/local-readback"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".cache/tbt/cdb-dedupe")
          stage=json.loads((root/"stage/report.json").read_text())
          write=json.loads((root/"write/report.json").read_text())
          gate=json.loads((root/"local-readback/report.json").read_text())
          assert write["changed_years"]==stage["changed_years"]
          assert write["removed"]==stage["counts"]["removed_matches"]
          assert gate["status"]=="verified" and gate["unplanned_changes"]==0
          assert gate["removed_matches"]==write["removed"]
          PY

      - name: Publish audited changes only if base manifest remains identical
        if: ${{ steps.request.outputs.mode == 'write' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_global_writer_lock.py verify
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from release_store import ReleaseStore
          root=Path(".cache/tbt/cdb-dedupe")
          hist=root/"history"
          current=root/"fresh-remote-manifest"
          current.mkdir(exist_ok=True)
          repo=os.environ["TBT_DATA_REPOSITORY"]
          store=ReleaseStore(repo,"tbt-data-v1",current)
          store._download_asset("_tbt_bundle_manifest.json")
          saved=(root/"backup/_tbt_bundle_manifest.json").read_bytes()
          latest=(current/"_tbt_bundle_manifest.json").read_bytes()
          if hashlib.sha256(saved).digest()!=hashlib.sha256(latest).digest():
            raise SystemExit("Source canonical manifest changed; abort CDB complement publication")
          years=json.loads((root/"stage/report.json").read_text())["changed_years"]
          changed=[hist/f"history-{year:04d}.parquet" for year in years]
          assert all(p.is_file() and p.stat().st_size>0 for p in changed)
          approved={}
          for line in (root/"stage/stage.jsonl").read_text().splitlines():
            if line.strip():
              r=json.loads(line); approved.setdefault(int(r["utc_year"]),set()).add(r["remove_id"])
          store=ReleaseStore(repo,"tbt-data-v1",hist)
          store.upload_bundle(changed+[hist/"history_manifest.json"],approved_removals=approved)
          print("Published canonical partitions:",[p.name for p in changed],flush=True)
          PY

      - name: Independently re-download and verify every canonical match
        if: ${{ steps.request.outputs.mode == 'write' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/tbt/cdb-dedupe
          python scripts/download_stable_cdb.py --repository "$TBT_DATA_REPOSITORY" \
            --out "$root/persisted" --report "$root/persisted-download.json"
          python scripts/cdb_dedupe_hist_js.py \
            --mode verify --history-dir "$root/persisted" --before-dir "$root/before" \
            --stage-file "$root/stage/stage.jsonl" --out-dir "$root/persisted-readback"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".cache/tbt/cdb-dedupe")
          r=json.loads((root/"persisted-readback/report.json").read_text())
          s=json.loads((root/"stage/report.json").read_text())["counts"]
          assert r["status"]=="verified" and r["unplanned_changes"]==0
          assert r["removed_matches"]==s["removed_matches"]
          assert r["moved_stat_values"]==s["moved_stat_values"]
          print("COMMITTED CDB INTEGER BP COUNTS VERIFIED:",r,flush=True)
          PY

      - name: Confirm second run is ZERO for the same fixed shard
        if: ${{ steps.request.outputs.mode == 'write' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/tbt/cdb-dedupe
          python scripts/cdb_dedupe_hist_js.py \
            --mode stage \
            --history-dir "$root/persisted" --out-dir "$root/idempotence"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".cache/tbt/cdb-dedupe/idempotence/report.json").read_text())
          assert r["counts"].get("removed_matches",0)==0
          assert r["counts"].get("moved_stat_values",0)==0
          assert r["production_mutated"] is False
          print("BP_INTEGER_COUNTS_REMOTE_SECOND_RUN_ZERO_DELTA_PASS",r["counts"],flush=True)
          PY

      - name: Retain provenance and independent readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdb-dedupe-${{ github.run_id }}
          path: |
            .cache/tbt/cdb-dedupe/source-snapshot.json
            .cache/tbt/cdb-dedupe/stage/report.json
            .cache/tbt/cdb-dedupe/write/report.json
            .cache/tbt/cdb-dedupe/local-readback/report.json
            .cache/tbt/cdb-dedupe/persisted-download.json
            .cache/tbt/cdb-dedupe/persisted-readback/report.json
            .cache/tbt/cdb-dedupe/idempotence/report.json
          if-no-files-found: warn
          retention-days: 45

      - name: Release global canonical writer lock
        if: always()
        shell: bash
        run: python scripts/cdb_global_writer_lock.py release --if-held
