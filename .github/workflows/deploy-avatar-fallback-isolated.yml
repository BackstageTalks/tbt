name: One-shot isolated player fallback production release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tbt-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      contains(github.event.head_commit.message, '[avatar-fallback-deploy]') &&
      contains(github.event.head_commit.message, '[audit-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: ccf3ccd970eeef56f602465b24f997205a97bab5
      RELEASE_SHA: 5b4946704007b905f4ad01d5b14a0dbf27340d1d
      BLINQ_PUBLIC_URL: https://agreeable-sky-011a7fe10.7.azurestaticapps.net
    steps:
      - name: Checkout exact release with original production API
        uses: actions/checkout@v4
        with:
          ref: 5b4946704007b905f4ad01d5b14a0dbf27340d1d
          fetch-depth: 4
          persist-credentials: false

      - name: Preflight pinned tree, allowed changes and live baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          files="$(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' tests/test_player_avatar_fallback.cjs web/app.js web/blinq-app.css | LC_ALL=C sort)"
          test "$files" = "$expected"
          test "$(git hash-object web/app.js)" = 7dc40a911d02c3faa98f0c78f9a5899de1b2ad05
          test "$(git hash-object web/blinq-app.css)" = 6ae9867d08bee8a7e80b3a0e21db08e328323477
          test "$(git hash-object tests/test_player_avatar_fallback.cjs)" = 4f7898c8c3f74889f45037bfcde62c99ec7c9a9d
          test -z "$(git status --porcelain)"
          curl -fsSL -H 'Cache-Control: no-cache' --connect-timeout 5 --max-time 20 \
            "$BLINQ_PUBLIC_URL/deployment.json?avatar_before=$GITHUB_SHA" -o /tmp/avatar-before.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('/tmp/avatar-before.json').read_text())
          assert m.get('git_sha')=='ccf3ccd970eeef56f602465b24f997205a97bab5',m.get('git_sha')
          for file in ('auth.js','responsive.js'):
              assert m.get('files_sha256',{}).get(file)==hashlib.sha256((Path('web')/file).read_bytes()).hexdigest(),file
          for sex in ('m','w'):
              assert (Path('web/assets')/f'missing_foto_{sex}.webp').stat().st_size>1000
          print('Isolated tree and current production base: PASS')
          PY

      - name: Install Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Full baseline regression suite including avatar fix
        shell: bash
        env:
          PYTHONPATH: api:scripts
        run: |
          set -euo pipefail
          python scripts/clean_generated_artifacts.py
          python scripts/audit_repo_contract.py
          python -m pip install -r api/requirements.txt -r api/requirements-train.txt pytest
          python -m compileall -q api scripts
          python -m pytest tests --ignore=tests/legacy
          node --check web/app.js
          node --check web/auth.js
          node --check web/responsive.js
          node tests/test_player_avatar_fallback.cjs
          node tests/test_projection_display.cjs
          node tests/test_frontend_runtime_contract.js
          node tests/test_auth_refresh_race.js
          node tests/test_firebase_web_auth.js
          node tests/test_firebase_email_verification.js
          node tests/test_auth_init_resilience_r35.js
          node tests/test_v736_ui_regression_contract.js
          node tests/test_banner_editor_contract.js
          node tests/test_admin_diagnostics_view.js

      - name: Browser regression from pinned release
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
          python tests/browser_comparator_search.py
          python tests/browser_runtime_r43.py
          python tests/browser_access_odds.py
          python tests/browser_preproduction_r61.py
          python tests/browser_banner_editor_r62.py
          python tests/browser_admin_account_filters.py
          python tests/browser_admin_dashboard_setting.py
          python tests/browser_info_sg_detail.py
          python tests/browser_admin_live_delete.py
          python tests/browser_results_financial_audit.py
          python tests/browser_results_multiselect.py
          python tests/browser_admin_test_results.py
          python tests/browser_mobile_results_layout.py
          python tests/browser_mobile_header.py
          python tests/browser_mobile_dashboard_audit.py
          python tests/browser_results_betting_day.py
          python tests/browser_profile_chip_fit.py

      - name: Build serving feed, then stamp isolated commit SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python scripts/prepare_feed.py
          test -s api/data/feed.json
          python scripts/verify_presentation_feed.py api/data/feed.json --summary
          python scripts/stamp_web_deployment.py --web web --sha "$RELEASE_SHA"

      - name: Recheck unchanged production and main before upload
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current_main" = "$GITHUB_SHA" || { echo 'Main changed since trigger'; exit 42; }
          curl -fsSL -H 'Cache-Control: no-cache' --connect-timeout 5 --max-time 20 \
            "$BLINQ_PUBLIC_URL/deployment.json?avatar_preupload=$GITHUB_SHA" -o /tmp/avatar-preupload.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/avatar-before.json'))==json.load(open('/tmp/avatar-preupload.json')), 'Production changed; abort'
          print('Production unchanged before upload: PASS')
          PY

      - name: Publish isolated UI with original production API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: ''
          skip_app_build: true
          production_branch: main

      - name: Verify exact production bytes, fallback assets and API health
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            fetched=1
            for name in deployment.json app.js blinq-app.css auth.js responsive.js; do
              curl -fsSL --connect-timeout 5 --max-time 20 -H 'Cache-Control: no-cache' \
                "$BLINQ_PUBLIC_URL/$name?avatar_readback=$RELEASE_SHA-$attempt" -o "/tmp/avatar-$name" || fetched=0
            done
            if [[ "$fetched" == 1 ]] && python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp')
          m=json.loads((root/'avatar-deployment.json').read_text())
          assert m.get('git_sha')=='5b4946704007b905f4ad01d5b14a0dbf27340d1d'
          for name in ('app.js','blinq-app.css','auth.js','responsive.js'):
              data=(root/('avatar-'+name)).read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              assert digest==m['files_sha256'][name],name
              assert digest==hashlib.sha256((Path('web')/name).read_bytes()).hexdigest(),name
          app=(root/'avatar-app.js').read_text()
          css=(root/'avatar-blinq-app.css').read_text()
          assert "img.src=versionedPlayerAsset(localFallback)+'&retry=1'" in app
          assert "document.addEventListener('load',handleAssetImageLoad,true)" in app
          for sex in ('m','w'):
              assert f"background-image:url('/assets/missing_foto_{sex}.webp')!important" in css
          print('Exact production UI byte hashes & fallback markers: PASS')
          PY
            then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" = 1 || { echo 'Independent remote readback NOT verified'; exit 1; }
          for sex in m w; do
            curl -fsSL -D "/tmp/headers-$sex" \
              "$BLINQ_PUBLIC_URL/assets/missing_foto_$sex.webp?avatar_readback=$RELEASE_SHA" -o "/tmp/fallback-$sex.webp"
            grep -Eiq '^content-type:[[:space:]]*image/webp' "/tmp/headers-$sex"
            test "$(wc -c < "/tmp/fallback-$sex.webp")" -gt 1000
          done
          curl -fsSL "$BLINQ_PUBLIC_URL/api/health?avatar_readback=$RELEASE_SHA" -o /tmp/health.json
          curl -fsSL "$BLINQ_PUBLIC_URL/api/v1/auth/config?avatar_readback=$RELEASE_SHA" -o /tmp/auth.json
          python - <<'PY'
          import json
          health=json.load(open('/tmp/health.json'))
          auth=json.load(open('/tmp/auth.json'))
          assert health.get('ok') is True and health.get('release')=='7.3.6'
          assert auth.get('enabled') is True and auth.get('provider')=='firebase' and auth.get('server_ready') is True
          print('Production API, authentication and fallback image content: PASS')
          PY
