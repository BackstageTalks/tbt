name: BlinQ CDB opponent BP NULL candidates (read-only)
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-cdb-bp-opponent-null-current.yml'
      - 'scripts/audit_cdb_bp_opponent_nulls.py'
      - 'tests/test_audit_cdb_bp_opponent_nulls.py'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: blinq-cdb-bp-opponent-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts:.
      CDB_REPO: BackstageTalks/tbt-data
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pure rate identity and quarantine tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_audit_cdb_bp_opponent_nulls.py' -v
          python -m compileall -q scripts/audit_cdb_bp_opponent_nulls.py
      - name: Verify private source and download stable full CDB snapshot
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$CDB_REPO" --json visibility -q .visibility)" = PRIVATE
          python -m pip install --disable-pip-version-check pyarrow pandas pydantic numpy
          mkdir -p work/audit
          python scripts/download_stable_cdb.py --repository "$CDB_REPO" --tag tbt-data-v1 --out work/history --report work/audit/snapshot.json
          test "$(find work/history -maxdepth 1 -name 'history-*.parquet' | wc -l)" -eq 78
      - name: Exact completed-match BP opponent complement read-only inventory
        run: |
          set -euo pipefail
          python scripts/audit_cdb_bp_opponent_nulls.py --history-dir work/history --out work/audit/bp-complements.json
          python - <<'PY'
          import json
          s=json.load(open("work/audit/snapshot.json"))
          r=json.load(open("work/audit/bp-complements.json"))
          n=r["totals"]
          if s["status"]!="verified" or s["provider_api_requests"]!=0 or r["write_authorized"] or r["production_mutated"] or r["provider_requests"]!=0:
              raise SystemExit("UNSAFE_CDB_BP_AUDIT")
          print("CDB_BP_OPPONENT_POTENTIAL_NULLS", json.dumps({
              "candidate_matches":n.get("interior_null_complement_candidate",0),
              "candidate_cells":n.get("possible_new_null_bp_values",0),
              "conflicts":n.get("contradictory_bp_pair",0),
              "boundary_review":n.get("boundary_pairs_to_review",0)
          },sort_keys=True))
          PY
          gh api "repos/$CDB_REPO/releases/tags/tbt-data-v1" > work/audit/release-after.json
          python - <<'PY'
          import json
          s=json.load(open("work/audit/snapshot.json"))
          a=json.load(open("work/audit/release-after.json"))["assets"]
          m=[x for x in a if x["name"]=="_tbt_bundle_manifest.json"]
          if len(m)!=1 or m[0].get("digest")!="sha256:"+s["manifest_sha256"]:
              raise SystemExit("CDB_MANIFEST_DRIFT_DURING_READONLY_BP_AUDIT")
          print("CDB_BP_CURRENT_RELEASE_MANIFEST_STABLE")
          PY
      - name: Preserve aggregate-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdb-bp-opponent-current-audit
          path: |
            work/audit/bp-complements.json
            work/audit/snapshot.json
          if-no-files-found: ignore
          retention-days: 14
