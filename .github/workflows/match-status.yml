name: Prediction fixture schedule and match status

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: blinq-hourly-match-status
  cancel-in-progress: true

jobs:
  match-status:
    # Recurring 30-minute cadence is owned by the external scheduler. A tagged
    # main push provides a safe one-shot catch-up without bypassing budget guards.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.BLINQ_NATIVE_SCHEDULES_ENABLED == 'true') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[match-status-now]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The weekly CDB retry gate reads scripts/moviodds_cdb_retry.py from this
      # checkout. Without it the external clock falsely reported green.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile upcoming match times and settled outcomes
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLINQ_LIVE_WORKER_TOKEN" || { echo 'Missing BLINQ_LIVE_WORKER_TOKEN GitHub secret'; exit 1; }
          base="${BLINQ_BASE_URL%/}"
          curl --fail-with-body --silent --show-error             --retry 0 --max-time 120             -X POST             -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN"             "$base/api/v1/internal/match-status-worker"
          echo
          # A 503 with provider_errors now fails this job rather than reporting an empty PASS.

      - name: Capture finalized MoviOdds tennis statistics in DB
        # Reuse the existing 30-minute external status clock; API Pro is separate.
        continue-on-error: true
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLINQ_LIVE_WORKER_TOKEN"
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN" \
            "${BLINQ_BASE_URL%/}/api/v1/internal/moviodds-stats-worker?mode=final" \
            -o /tmp/moviodds-final.json
          python - <<'PY'
          import json
          report=json.load(open("/tmp/moviodds-final.json"))
          if not report.get("ok") or report.get("errors"):
              raise SystemExit("MoviOdds FINAL durable collection failed")
          print("MOVIODDS_FINAL_DB", report.get("final"))
          PY

      - name: Dispatch completed Telegram ELITE results check after settlement
        # Reuse the existing externally scheduled 30-minute match-status clock.
        # Result evaluation is read-only; no second provider/API budget.
        # Only dispatch after a successful match-status worker read-back.
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run telegram-results.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'ELITE_RESULTS_CHECK_QUEUED; publication only when ALL issued picks settle'

      - name: Dispatch hourly selected-match CLV snapshot
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Match status runs every 30 minutes; CLV remains hourly.
          if [[ "$(date -u +%M)" != "00" ]]; then
            echo "Skipping CLV on the half-hour match-status pass."
            exit 0
          fi
          gh workflow run propline-clv-pilot.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f events_per_run=12

      - name: Dispatch hourly consensus Match Winner CLV snapshot
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Match status runs every 30 minutes; CLV remains hourly.
          if [[ "$(date -u +%M)" != "00" ]]; then
            echo "Skipping CLV on the half-hour match-status pass."
            exit 0
          fi
          gh workflow run the-odds-clv.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f reason=hourly


      - name: Dispatch private calibration monitor every six hours
        # External scheduler already drives Match Status. Reuse its cadence
        # instead of adding a forbidden GitHub cron schedule.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          hour="$(date -u +%H)"
          minute="$(date -u +%M)"
          if (( 10#$hour % 6 != 0 || 10#$minute >= 30 )); then
            echo "Calibration monitor not due at this UTC hour."
            exit 0
          fi
          gh workflow run model-calibration-monitor.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched private model calibration snapshot updater."

      - name: Dispatch prospective frozen 7.2.1 settlement every two UTC hours
        # Reuse the existing external match-status clock. No paid provider
        # requests or duplicate CDB writers; settlement uses the same lock.
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          hour="$(date -u +%H)"
          minute="$(date -u +%M)"
          if (( 10#$hour % 2 != 0 || 10#$minute >= 30 )); then
            echo 'FROZEN_721_SETTLEMENT_NOT_DUE'
            exit 0
          fi
          slot="$(date -u +%Y-%m-%dT%H):"
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/frozen-721-settlement.yml/runs" -f event=workflow_dispatch -f per_page=50)"
          if printf '%s' "$runs" | jq -e --arg slot "$slot" '.workflow_runs | any(.created_at | startswith($slot))' >/dev/null; then
            echo 'FROZEN_721_SETTLEMENT_ALREADY_DISPATCHED'
            exit 0
          fi
          gh workflow run frozen-721-settlement.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'FROZEN_721_SETTLEMENT_DISPATCH_SUBMITTED_NOT_VERIFIED'

      - name: Dispatch hourly 7.1.1 TOP VALUE forward blind audit
        # Research-only: neither the model nor production feed is modified.
        # Reuse the existing externally scheduled match-status cadence.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          minute="$(date -u +%M)"
          if (( 10#$minute >= 30 )); then
            echo "Blind trial not due on the half-hour pass."
            exit 0
          fi
          gh workflow run model-711-forward-blind.yml \
            --repo "$GITHUB_REPOSITORY" --ref main
          echo "Queued research-only frozen 7.1.1 TOP/VALUE cohort."

      - name: Dispatch CDB Drive Inbox at UTC 02 and 14 from active external clock
        # Reuse the verified 30-minute external Match Status scheduler.
        # No internal GitHub cron, sports API calls or canonical CDB writes here.
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H)"
          hour="${now:11:2}"
          minute="$(date -u +%M)"
          if [[ "$hour" != "02" && "$hour" != "14" ]] || (( 10#$minute >= 30 )); then
            echo 'CDB_INBOX_NOT_DUE'
            exit 0
          fi
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/cdb-drive-inbox.yml/runs" -f event=workflow_dispatch -f per_page=50)"
          if printf '%s' "$runs" | jq -e --arg slot "$now:" '.workflow_runs | any(.created_at | startswith($slot))' >/dev/null; then
            echo 'CDB_INBOX_ALREADY_DISPATCHED_IN_SLOT'
            exit 0
          fi
          gh workflow run cdb-drive-inbox.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'CDB_INBOX_DISPATCH_SUBMITTED_NOT_IMPORT_VERIFIED'

      - name: Dispatch or retry guarded weekly MoviOdds CDB import after Sunday 06 UTC
        # Keep existing external Match Status 30-minute cron unchanged.
        # Retry failure including BUSY writer after two-hour cooldown.
        # A verified successful run closes the week; no duplicate writer.
        # QUALITY HOLD 2026-11-01: 410 source rows, 0 verified CDB additions,
        # 5 conflicts and unresolved identity quarantine. Do not automatically
        # dispatch canonical MoviOdds writes until a new source QA authorizes it.
        # LIVE/final DB capture and read-only staging stay active.
        if: ${{ false }}
        # A failed dispatch must fail this job, not a green workflow.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          day_of_week="$(date -u +%u)"
          sunday="$(date -u -d "$(date -u +%F) -$((day_of_week % 7)) days" +%F)"
          next_sunday="$(date -u -d "$sunday +7 days" +%F)"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/cdb-drive-inbox.yml/runs" \
            -f event=workflow_dispatch -f per_page=100 \
            -f created="$sunday..$next_sunday" > "$RUNNER_TEMP/moviodds-week-runs.json"
          python scripts/moviodds_cdb_retry.py \
            --runs-file "$RUNNER_TEMP/moviodds-week-runs.json" \
            --output "$GITHUB_OUTPUT"
          if ! grep -qx 'dispatch=true' "$GITHUB_OUTPUT"; then
            echo 'MOVIODDS_WEEKLY_CDB_NOT_DUE_OR_ALREADY_HANDLED'
            exit 0
          fi
          request_id="$(sed -n 's/^request_id=//p' "$GITHUB_OUTPUT" | tail -1)"
          [[ "$request_id" =~ ^moviodds-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo 'MOVIODDS_WEEKLY_CDB_INVALID_REQUEST_ID'
            exit 1
          }
          gh workflow run cdb-drive-inbox.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f source_mode=moviodds -f moviodds_days_back=7 -f request_id="$request_id"
          echo 'MOVIODDS_WEEKLY_CDB_GUARDED_WRITER_DISPATCHED_READBACK_REQUIRED'

      - name: Dispatch read-only production UI revision watchdog
        # Reuse the governed external 30-minute clock, even when match-status
        # reconciliation fails. Never consume tennis API quota or write to CDB.
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run blinq-ui-production-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'BLINQ_UI_WATCHDOG_DISPATCH_SUBMITTED'

      - name: Dispatch autonomous MoviOdds CDB candidate preparation once daily
        # Existing external half-hour clock already runs. The new workflow is
        # strictly read-only and NEVER acquires the global CDB writer lock.
        # Source is the protected Azure DB final archive; Drive upload
        # availability does not block CDB-ready candidate preparation.
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          hour="$(date -u +%H)"
          minute="$(date -u +%M)"
          if [[ "$hour" != "05" ]] || (( 10#$minute >= 30 )); then
            echo 'MOVIODDS_CDB_STAGE_NOT_DUE'
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/moviodds-cdb-stage.yml/runs" -f event=workflow_dispatch -f per_page=40)"
          if printf '%s' "$runs" | jq -e --arg day "$today" '.workflow_runs | any(.created_at | startswith($day))' >/dev/null; then
            echo 'MOVIODDS_CDB_STAGE_ALREADY_DISPATCHED_TODAY'
            exit 0
          fi
          gh workflow run moviodds-cdb-stage.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f days_back=3
          echo 'MOVIODDS_CDB_STAGE_DISPATCHED_VERIFY_DRY_RUN_AND_ARTIFACT'

      - name: Archive completed MoviOdds source JSON to the user's Drive once daily
        # Existing externally driven half-hour clock; CDB imports remain manual.
        # Automatically attempts once at UTC 04:00. Missing folder Editor
        # permission fails only this archive job, never the match-status job.
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          hour="$(date -u +%H)"
          minute="$(date -u +%M)"
          if [[ "$hour" != "04" ]] || (( 10#$minute >= 30 )); then
            echo 'MOVIODDS_DRIVE_ARCHIVE_NOT_DUE'
            exit 0
          fi
          yesterday="$(date -u -d 'yesterday' +%F)"
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/moviodds-drive-archive.yml/runs" -f event=workflow_dispatch -f per_page=30)"
          if printf '%s' "$runs" | jq -e --arg d "$(date -u +%Y-%m-%d)" '.workflow_runs | any(.created_at | startswith($d))' >/dev/null; then
            echo 'MOVIODDS_DRIVE_ARCHIVE_ALREADY_DISPATCHED_TODAY'
            exit 0
          fi
          gh workflow run moviodds-drive-archive.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f date="$yesterday"
          echo 'MOVIODDS_DRIVE_ARCHIVE_DISPATCH_ONLY_VERIFY_WORKFLOW_READBACK'
