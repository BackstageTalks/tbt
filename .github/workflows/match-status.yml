name: Hourly prediction match status

on:
  schedule:
    # Every hour, 24/7; time zones do not affect hourly cadence.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-hourly-match-status
  cancel-in-progress: true

jobs:
  match-status:
    # Hourly worker may call the Tennis provider: only enable after explicit approval.
    if: github.event_name == 'workflow_dispatch' || vars.TBT_MATCH_STATUS_AUTO_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh already-started prediction outcomes
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLINQ_LIVE_WORKER_TOKEN" || { echo 'Missing BLINQ_LIVE_WORKER_TOKEN GitHub secret'; exit 1; }
          base="${BLINQ_BASE_URL%/}"
          curl --fail-with-body --silent --show-error             --retry 0 --max-time 120             -X POST             -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN"             "$base/api/v1/internal/match-status-worker"
          echo
          # A 503 with provider_errors now fails this job rather than reporting an empty PASS.
