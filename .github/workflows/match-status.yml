name: Prediction fixture schedule and match status

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: blinq-hourly-match-status
  cancel-in-progress: true

jobs:
  match-status:
    # Recurring 30-minute cadence is owned by the external scheduler. A tagged
    # main push provides a safe one-shot catch-up without bypassing budget guards.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[match-status-now]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile upcoming match times and settled outcomes
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLINQ_LIVE_WORKER_TOKEN" || { echo 'Missing BLINQ_LIVE_WORKER_TOKEN GitHub secret'; exit 1; }
          base="${BLINQ_BASE_URL%/}"
          curl --fail-with-body --silent --show-error             --retry 0 --max-time 120             -X POST             -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN"             "$base/api/v1/internal/match-status-worker"
          echo
          # A 503 with provider_errors now fails this job rather than reporting an empty PASS.

      - name: Dispatch hourly selected-match CLV snapshot
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Match status runs every 30 minutes; CLV remains hourly.
          if [[ "$(date -u +%M)" != "00" ]]; then
            echo "Skipping CLV on the half-hour match-status pass."
            exit 0
          fi
          gh workflow run propline-clv-pilot.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f events_per_run=12

      - name: Dispatch hourly consensus Match Winner CLV snapshot
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Match status runs every 30 minutes; CLV remains hourly.
          if [[ "$(date -u +%M)" != "00" ]]; then
            echo "Skipping CLV on the half-hour match-status pass."
            exit 0
          fi
          gh workflow run the-odds-clv.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f reason=hourly


      - name: Dispatch private calibration monitor every six hours
        # External scheduler already drives Match Status. Reuse its cadence
        # instead of adding a forbidden GitHub cron schedule.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          hour="$(date -u +%H)"
          minute="$(date -u +%M)"
          if (( 10#$hour % 6 != 0 || 10#$minute >= 30 )); then
            echo "Calibration monitor not due at this UTC hour."
            exit 0
          fi
          gh workflow run model-calibration-monitor.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched private model calibration snapshot updater."

      - name: Dispatch prospective frozen 7.2.1 settlement every two UTC hours
        # Reuse the existing external match-status clock. No paid provider
        # requests or duplicate CDB writers; settlement uses the same lock.
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          hour="$(date -u +%H)"
          minute="$(date -u +%M)"
          if (( 10#$hour % 2 != 0 || 10#$minute >= 30 )); then
            echo 'FROZEN_721_SETTLEMENT_NOT_DUE'
            exit 0
          fi
          slot="$(date -u +%Y-%m-%dT%H):"
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/frozen-721-settlement.yml/runs" -f event=workflow_dispatch -f per_page=50)"
          if printf '%s' "$runs" | jq -e --arg slot "$slot" '.workflow_runs | any(.created_at | startswith($slot))' >/dev/null; then
            echo 'FROZEN_721_SETTLEMENT_ALREADY_DISPATCHED'
            exit 0
          fi
          gh workflow run frozen-721-settlement.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'FROZEN_721_SETTLEMENT_DISPATCH_SUBMITTED_NOT_VERIFIED'

      - name: Dispatch hourly 7.1.1 TOP VALUE forward blind audit
        # Research-only: neither the model nor production feed is modified.
        # Reuse the existing externally scheduled match-status cadence.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          minute="$(date -u +%M)"
          if (( 10#$minute >= 30 )); then
            echo "Blind trial not due on the half-hour pass."
            exit 0
          fi
          gh workflow run model-711-forward-blind.yml \
            --repo "$GITHUB_REPOSITORY" --ref main
          echo "Queued research-only frozen 7.1.1 TOP/VALUE cohort."

      - name: Dispatch CDB Drive Inbox at UTC 02 and 14 from active external clock
        # Reuse the verified 30-minute external Match Status scheduler.
        # No internal GitHub cron, sports API calls or canonical CDB writes here.
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H)"
          hour="${now:11:2}"
          minute="$(date -u +%M)"
          if [[ "$hour" != "02" && "$hour" != "14" ]] || (( 10#$minute >= 30 )); then
            echo 'CDB_INBOX_NOT_DUE'
            exit 0
          fi
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/cdb-drive-inbox.yml/runs" -f event=workflow_dispatch -f per_page=50)"
          if printf '%s' "$runs" | jq -e --arg slot "$now:" '.workflow_runs | any(.created_at | startswith($slot))' >/dev/null; then
            echo 'CDB_INBOX_ALREADY_DISPATCHED_IN_SLOT'
            exit 0
          fi
          gh workflow run cdb-drive-inbox.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'CDB_INBOX_DISPATCH_SUBMITTED_NOT_IMPORT_VERIFIED'
