name: Prediction fixture schedule and match status

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: blinq-hourly-match-status
  cancel-in-progress: true

jobs:
  match-status:
    # Recurring 30-minute cadence is owned by the external scheduler. A tagged
    # main push provides a safe one-shot catch-up without bypassing budget guards.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.BLINQ_NATIVE_SCHEDULES_ENABLED == 'true') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[match-status-now]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile upcoming match times and settled outcomes
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLINQ_LIVE_WORKER_TOKEN" || { echo 'Missing BLINQ_LIVE_WORKER_TOKEN GitHub secret'; exit 1; }
          base="${BLINQ_BASE_URL%/}"
          curl --fail-with-body --silent --show-error             --retry 0 --max-time 120             -X POST             -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN"             "$base/api/v1/internal/match-status-worker"
          echo
          # A 503 with provider_errors now fails this job rather than reporting an empty PASS.

      - name: Dispatch completed Telegram ELITE results check after settlement
        # Reuse the existing externally scheduled 30-minute match-status clock.
        # Result evaluation is read-only; no second provider/API budget.
        # Only dispatch after a successful match-status worker read-back.
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run telegram-results.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'ELITE_RESULTS_CHECK_QUEUED; publication only when ALL issued picks settle'

      - name: Dispatch hourly selected-match CLV snapshot
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Match status runs every 30 minutes; CLV remains hourly.
          if [[ "$(date -u +%M)" != "00" ]]; then
            echo "Skipping CLV on the half-hour match-status pass."
            exit 0
          fi
          gh workflow run propline-clv-pilot.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f events_per_run=12

      - name: Dispatch hourly consensus Match Winner CLV snapshot
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Match status runs every 30 minutes; CLV remains hourly.
          if [[ "$(date -u +%M)" != "00" ]]; then
            echo "Skipping CLV on the half-hour match-status pass."
            exit 0
          fi
          gh workflow run the-odds-clv.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f reason=hourly


      - name: Dispatch morning offer alarm at 06:30 Bratislava
        # Native cron is disabled; reuse the external 10/15-minute clock (deduped per day).
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now="$(TZ=Europe/Bratislava date +%H%M)"
          if (( 10#$now < 630 || 10#$now >= 645 )); then
            echo "Morning offer alarm not due ($now Bratislava)."
            exit 0
          fi
          # 10- or 15-minute external clock: dispatch once per Bratislava day.
          today="$(TZ=Europe/Bratislava date +%Y-%m-%d)"
          since="$(date -u -d "TZ=\"Europe/Bratislava\" $today 06:00" +%Y-%m-%dT%H:%M:%SZ)"
          if gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/morning-offer-alarm.yml/runs" -f per_page=20 \
              | jq -e --arg since "$since" '.workflow_runs | any(.created_at >= $since)' >/dev/null; then
            echo "Morning offer alarm already dispatched today."
            exit 0
          fi
          gh workflow run morning-offer-alarm.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched morning offer alarm."

      - name: Dispatch private calibration monitor every six hours
        # External scheduler already drives Match Status. Reuse its cadence
        # instead of adding a forbidden GitHub cron schedule.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          hour="$(date -u +%H)"
          minute="$(date -u +%M)"
          if (( 10#$hour % 6 != 0 || 10#$minute >= 30 )); then
            echo "Calibration monitor not due at this UTC hour."
            exit 0
          fi
          slot="$(date -u +%Y-%m-%dT%H):"
          if gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/model-calibration-monitor.yml/runs" -f per_page=20 \
              | jq -e --arg slot "$slot" '.workflow_runs | any(.created_at | startswith($slot))' >/dev/null; then
            echo "Calibration monitor already dispatched in this slot."
            exit 0
          fi
          gh workflow run model-calibration-monitor.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched private model calibration snapshot updater."

      - name: Dispatch prospective frozen 7.2.1 settlement every two UTC hours
        # Reuse the existing external match-status clock. No paid provider
        # requests or duplicate CDB writers; settlement uses the same lock.
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          hour="$(date -u +%H)"
          minute="$(date -u +%M)"
          if (( 10#$hour % 2 != 0 || 10#$minute >= 30 )); then
            echo 'FROZEN_721_SETTLEMENT_NOT_DUE'
            exit 0
          fi
          slot="$(date -u +%Y-%m-%dT%H):"
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/frozen-721-settlement.yml/runs" -f event=workflow_dispatch -f per_page=50)"
          if printf '%s' "$runs" | jq -e --arg slot "$slot" '.workflow_runs | any(.created_at | startswith($slot))' >/dev/null; then
            echo 'FROZEN_721_SETTLEMENT_ALREADY_DISPATCHED'
            exit 0
          fi
          gh workflow run frozen-721-settlement.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'FROZEN_721_SETTLEMENT_DISPATCH_SUBMITTED_NOT_VERIFIED'

      - name: Dispatch CDB Drive Inbox at UTC 02 and 14 from active external clock
        # Reuse the verified 30-minute external Match Status scheduler.
        # No internal GitHub cron, sports API calls or canonical CDB writes here.
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H)"
          hour="${now:11:2}"
          minute="$(date -u +%M)"
          if [[ "$hour" != "02" && "$hour" != "14" ]] || (( 10#$minute >= 30 )); then
            echo 'CDB_INBOX_NOT_DUE'
            exit 0
          fi
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/cdb-drive-inbox.yml/runs" -f event=workflow_dispatch -f per_page=50)"
          if printf '%s' "$runs" | jq -e --arg slot "$now:" '.workflow_runs | any(.created_at | startswith($slot))' >/dev/null; then
            echo 'CDB_INBOX_ALREADY_DISPATCHED_IN_SLOT'
            exit 0
          fi
          gh workflow run cdb-drive-inbox.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'CDB_INBOX_DISPATCH_SUBMITTED_NOT_IMPORT_VERIFIED'

      - name: Dispatch read-only production UI revision watchdog
        # Reuse the governed external 30-minute clock, even when match-status
        # reconciliation fails. Never consume tennis API quota or write to CDB.
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run blinq-ui-production-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'BLINQ_UI_WATCHDOG_DISPATCH_SUBMITTED'

      - name: Dispatch guarded CDB API gapfill from existing external clock
        # The external match-status clock already runs every 15 minutes.
        # Native GitHub cron stays DISABLED. Only the pre-existing API
        # orchestrator may decide whether provider/CDB writes are safe.
        # This step does not fetch paid data or touch the private CDB.
        # A failure is visible as a failed run instead of a false green tick.
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          start="$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          end="$(date -u -d '2 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/data-hourly-quota-gapfill.yml/runs" \
            -f event=workflow_dispatch -f per_page=100 -f created="$start..$end" \
            > "$RUNNER_TEMP/api-gapfill-before.json"
          # Never make a dispatch decision from a truncated run listing.
          jq -e '.total_count <= 100 and (.workflow_runs | type == "array")' \
            "$RUNNER_TEMP/api-gapfill-before.json" >/dev/null
          decision="$(python - <<'PY'
          import json
          from datetime import datetime, timezone
          from scripts.api_hourly_evening import external_clock_gapfill_decision

          with open(__import__("os").environ["RUNNER_TEMP"] +
                    "/api-gapfill-before.json", encoding="utf-8") as fh:
              runs = json.load(fh)["workflow_runs"]
          allowed, reason, slot = external_clock_gapfill_decision(
              datetime.now(timezone.utc), runs)
          print(json.dumps({"dispatch": allowed, "reason": reason, "slot": slot}))
          PY
          )"
          echo "CDB_API_EXTERNAL_CLOCK_GATE $decision"
          if [[ "$(jq -r '.dispatch' <<< "$decision")" != true ]]; then
            exit 0
          fi
          gh workflow run data-hourly-quota-gapfill.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
          # Workflow-dispatch submission is not proof of execution. Require
          # an independently visible new orchestrator run (not CDB success).
          for i in $(seq 1 8); do
            sleep 2
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/data-hourly-quota-gapfill.yml/runs" \
              -f event=workflow_dispatch -f per_page=100 -f created="$start..$end" \
              > "$RUNNER_TEMP/api-gapfill-after.json"
            if jq -e --slurpfile before "$RUNNER_TEMP/api-gapfill-before.json" \
              '([.workflow_runs[].id] - [$before[0].workflow_runs[].id]) | length > 0' \
              "$RUNNER_TEMP/api-gapfill-after.json" >/dev/null; then
              echo 'CDB_API_GAPFILL_ORCHESTRATOR_DISPATCH_VERIFIED; CDB read-back pending'
              exit 0
            fi
          done
          echo '::error::API gapfill dispatched but no new orchestrator run was independently visible'
          exit 1

      - name: Dispatch 16:50 budget-underuse admin notice from external clock
        # Existing active external quarter-hour tick owns scheduling, including DST.
        # 16:45 prepares the alert to evaluate at 16:50; 17:00 is a catch-up.
        # Azure durable create-only claim makes repeated dispatches harmless.
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          hour="$(TZ=Europe/Bratislava date +%H)"
          minute="$(TZ=Europe/Bratislava date +%M)"
          if ! (( (10#$hour == 16 && 10#$minute >= 45) ||
                  (10#$hour == 17 && 10#$minute <= 5) )); then
            echo "API_1650_ALERT_NOT_DUE"
            exit 0
          fi
          gh workflow run api-budget-underuse-notify.yml \
            --repo "$GITHUB_REPOSITORY" --ref main
          echo "API_1650_ALERT_DISPATCH_SUBMITTED; Azure claim controls at-most-once delivery"
