name: Prune old cancelled PR CI runs without artifacts

on:
  push:
    branches: [maintenance/gh-cleanup-20261101-30d]
    paths: [.github/workflows/gh-cleanup-cancelled-pr-ci.yml]

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: blinq-safe-old-cancelled-pr-ci-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: "true"
      LIMIT: "90"
      CUTOFF: "2026-10-02T00:00:00Z"
    steps:
      - name: Check exact stale cancelled PR CI runs and no artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt,json,os,pathlib,re,urllib.parse,urllib.request
          base="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          hdr={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=hdr),timeout=25) as response:return json.load(response)
          cutoff=dt.datetime.fromisoformat(os.environ["CUTOFF"].replace("Z","+00:00"))
          limit=int(os.environ["LIMIT"])
          assert 1<=limit<=100
          active=set()
          for p in range(1,10):
              prs=api(f"/pulls?state=open&per_page=100&page={p}")
              active.update(x["head"]["ref"] for x in prs)
              if len(prs)<100:break
          candidates=[]
          for page in range(1,9):
              q=urllib.parse.urlencode({"event":"pull_request","status":"cancelled","created":"<2026-10-02","per_page":100,"page":page})
              rows=api("/actions/runs?"+q).get("workflow_runs",[])
              for r in rows:
                  if r["event"]!="pull_request" or r["conclusion"]!="cancelled":continue
                  if not re.fullmatch(r"BlinQ CI · [a-f0-9]{40}",r["name"]):continue
                  if r.get("head_branch") in active or r.get("head_branch") in {"main","master"}:continue
                  when=dt.datetime.fromisoformat(r["created_at"].replace("Z","+00:00"))
                  if when>=cutoff:continue
                  arts=api(f"/actions/runs/{r['id']}/artifacts")
                  if arts["total_count"]!=0:continue
                  candidates.append({"id":r["id"],"name":r["name"],"date":r["created_at"],"head_branch":r["head_branch"],"head_sha":r["head_sha"],"url":r["html_url"],"artifacts":0})
                  if len(candidates)>=limit:break
              if len(rows)<100 or len(candidates)>=limit:break
          assert len({x["id"] for x in candidates})==len(candidates)
          record={"repo":os.environ["GITHUB_REPOSITORY"],"schema":1,"dry_run":os.environ["DRY_RUN"]=="true","count":len(candidates),"date_cutoff":os.environ["CUTOFF"],"allowed_type":"cancelled PR CI no artifacts","candidates":candidates}
          pathlib.Path("cancelled-pr-ci-manifest.json").write_text(json.dumps(record,indent=2,sort_keys=True)+"\n")
          print("CANDIDATES "+json.dumps({"count":len(candidates),"dry_run":record["dry_run"],"ids":[x["id"] for x in candidates]}))
          PY
      - name: Save 30-day immutable removal inventory
        uses: actions/upload-artifact@v4
        with:
          name: gh-old-cancelled-pr-ci-inventory-20261101
          path: cancelled-pr-ci-manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Revalidate and delete only vetted cancelled PR runs
        if: env.DRY_RUN == 'false'
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt,json,os,re,urllib.error,urllib.parse,urllib.request
          m=json.load(open("cancelled-pr-ci-manifest.json"))
          base="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          hdr={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def api(method,path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,method=method,headers=hdr),timeout=25) as response:
                      raw=response.read()
                      return response.status,json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  if e.code==404:return 404,None
                  raise
          assert m["repo"]==os.environ["GITHUB_REPOSITORY"] and m["count"]<=100
          assert len(m["candidates"])==m["count"]
          open_heads=set()
          for page in range(1,10):
              st,rows=api("GET",f"/pulls?state=open&per_page=100&page={page}")
              assert st==200
              open_heads.update(x["head"]["ref"] for x in rows)
              if len(rows)<100:break
          checked=[]
          cutoff=dt.datetime.fromisoformat(m["date_cutoff"].replace("Z","+00:00"))
          for x in m["candidates"]:
              st,r=api("GET",f"/actions/runs/{x['id']}")
              assert st==200 and r["event"]=="pull_request" and r["conclusion"]=="cancelled"
              assert re.fullmatch(r"BlinQ CI · [a-f0-9]{40}",r["name"])
              assert r["head_sha"]==x["head_sha"] and r["head_branch"]==x["head_branch"]
              assert r["head_branch"] not in open_heads and r["head_branch"] not in {"main","master"}
              assert dt.datetime.fromisoformat(r["created_at"].replace("Z","+00:00"))<cutoff
              st,arts=api("GET",f"/actions/runs/{x['id']}/artifacts")
              assert st==200 and arts["total_count"]==0
              checked.append(x["id"])
          deleted=[]
          for id in checked:
              st,_=api("DELETE",f"/actions/runs/{id}")
              assert st==204,(id,st)
              deleted.append(id)
          for id in deleted:
              st,_=api("GET",f"/actions/runs/{id}")
              assert st==404,(id,st)
          print("VERIFIED_DELETIONS "+json.dumps({"deleted":len(deleted),"readback_404":len(deleted),"model_CDB_DIL_runs_deleted":0,"manifest_retention_days":30}))
          PY
