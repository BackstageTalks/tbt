name: BlinQ Telegram offer
# Reuse the existing external hourly tick; optional 10-minute
# repository_dispatch gives finer timing. Native GitHub cron is forbidden.
on:
  schedule:
    - cron: '12,42 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/hourly-api-gapfill-tick.json'
  repository_dispatch:
    types: [telegram-offer-tick]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-telegram-ledger
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout private Telegram delivery ledger (not CDB)
        uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: telegram-bot-state
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: .private-telegram
          sparse-checkout: ops
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Verify private ledger is present
        run: |
          set -euo pipefail
          test -s .private-telegram/ops/telegram-bot-state.json
      - name: Prepare only confirmed and eligible daily picks
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          BLINQ_TG_CONFIG_URL: ${{ vars.TBT_PRODUCTION_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::TBT_DATA_GH_TOKEN required to read the private confirmed offer"; exit 1; }
          python scripts/telegram_offer_publisher.py prepare \
            --config-url "$BLINQ_TG_CONFIG_URL/api/v1/ui-config" \
            --state .private-telegram/ops/telegram-bot-state.json
      - name: Reserve send before any Telegram request
        id: reserve
        run: |
          set -euo pipefail
          if [ ! -f /tmp/blinq-telegram/ready ]; then
            echo "ready=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          cp /tmp/blinq-telegram/state.json .private-telegram/ops/telegram-bot-state.json
          git -C .private-telegram config user.name "github-actions[bot]"
          git -C .private-telegram config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Reserve BlinQ Telegram daily send [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected=$(git -C .private-telegram rev-parse HEAD)
          actual=$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')
          test "$expected" = "$actual" || { echo "::error::Telegram reservation read-back failed"; exit 1; }
          echo "ready=true" >>"$GITHUB_OUTPUT"
      - name: Send reserved Telegram offer
        if: steps.reserve.outputs.ready == 'true'
        env:
          TGB: ${{ secrets.TGB }}
          TGCH: ${{ secrets.TGCH }}
        run: |
          set -euo pipefail
          python scripts/telegram_offer_publisher.py send
      - name: Record confirmed Telegram delivery
        if: steps.reserve.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python scripts/telegram_offer_publisher.py mark-sent
          cp /tmp/blinq-telegram/state.json .private-telegram/ops/telegram-bot-state.json
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Confirm Telegram send receipts [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected=$(git -C .private-telegram rev-parse HEAD)
          actual=$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')
          test "$expected" = "$actual" || { echo "::error::Telegram receipt read-back failed"; exit 1; }
