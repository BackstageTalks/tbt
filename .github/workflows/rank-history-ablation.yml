name: BlinQ ranking history ablation

on:
  pull_request:
    paths:
      - "scripts/evaluate_rank_history_ablation.py"
      - ".github/workflows/rank-history-ablation.yml"

permissions:
  contents: read

concurrency:
  group: rank-history-ablation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      WTA_SOURCE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      ATP_SOURCE_COMMIT: 247f2f5e86b9e142a7ead7b0e8b3dfb5ee6abb28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install training dependencies
        run: python -m pip install -r api/requirements-train.txt

      - name: Download stable canonical history
        run: |
          python - <<'PY'
          import os, shutil, time
          from pathlib import Path
          from release_store import ReleaseStore
          directory=Path(".cache/tbt/rank-ablation/history")
          for attempt in range(1,5):
              shutil.rmtree(directory,ignore_errors=True)
              directory.mkdir(parents=True,exist_ok=True)
              try:
                  ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",directory).download(require_bundle_manifest=True)
                  print("verified canonical snapshot",attempt)
                  break
              except RuntimeError:
                  if attempt==4: raise
                  time.sleep(10)
          PY

      - name: Download pinned ATP ranking history
        run: |
          mkdir -p .cache/tbt/rank-ablation/atp
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Jupiterian/ATP-Rankings-API/$ATP_SOURCE_COMMIT/rankings.db" \
            -o .cache/tbt/rank-ablation/atp/rankings.db

      - name: Download pinned WTA ranking history
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/rank-ablation/wta
          base="https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/$WTA_SOURCE_COMMIT/wta"
          curl --fail --location --retry 3 "$base/wta_players.csv" -o .cache/tbt/rank-ablation/wta/wta_players.csv
          for file in wta_rankings_80s.csv wta_rankings_90s.csv wta_rankings_00s.csv wta_rankings_10s.csv wta_rankings_20s.csv wta_rankings_current.csv; do
            curl --fail --location --retry 3 "$base/$file" -o ".cache/tbt/rank-ablation/wta/$file"
          done

      - name: Run chronological ablation
        run: |
          args=()
          for file in .cache/tbt/rank-ablation/wta/wta_rankings_*.csv; do
            args+=(--wta-ranking-csv "$file")
          done
          python scripts/evaluate_rank_history_ablation.py \
            --history-dir .cache/tbt/rank-ablation/history \
            --atp-sqlite .cache/tbt/rank-ablation/atp/rankings.db \
            --wta-players .cache/tbt/rank-ablation/wta/wta_players.csv \
            "${args[@]}" \
            --out .cache/tbt/rank-ablation/report.json

      - name: Validate research-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(".cache/tbt/rank-ablation/report.json").read_text())
          assert report["production_mutated"] is False
          assert report["rapidapi_requests"] == 0
          assert report["baseline"]
          assert report["candidate"]
          print(json.dumps(report,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: blinq-rank-history-ablation-${{ github.run_id }}
          path: .cache/tbt/rank-ablation/report.json
          retention-days: 14
