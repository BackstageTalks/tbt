name: BlinQ ATP WTA rank-history ablation

on:
  pull_request:
    paths:
      - "scripts/audit_rank_history_ablation.py"
      - "tests/test_rank_history_ablation.py"
      - ".github/workflows/rank-history-ablation.yml"
      - "api/tbt/data/atp_rank_history.py"
      - "api/tbt/data/wta_rank_history.py"
      - "scripts/build_production_training_table.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-rank-history-ablation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      WTA_SOURCE_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install and focused tests
        run: |
          python -m pip install -r api/requirements-train.txt pytest
          python -m pytest tests/test_rank_history_ablation.py tests/test_atp_rank_history_contract.py tests/test_wta_rank_history.py -q

      - name: Download checksum-verified canonical history
        run: python scripts/download_production_preflight_inputs.py

      - name: Download pinned ATP and WTA rank histories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/rank-ablation/source/atp .cache/tbt/rank-ablation/source/wta
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/Jupiterian/ATP-Rankings-API/247f2f5e86b9e142a7ead7b0e8b3dfb5ee6abb28/rankings.db"             --output .cache/tbt/rank-ablation/source/atp/rankings.db
          base="https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/$WTA_SOURCE_COMMIT/wta"
          curl --fail --location --retry 3 "$base/wta_players.csv" -o .cache/tbt/rank-ablation/source/wta/wta_players.csv
          for file in wta_rankings_80s.csv wta_rankings_90s.csv wta_rankings_00s.csv wta_rankings_10s.csv wta_rankings_20s.csv wta_rankings_current.csv; do
            curl --fail --location --retry 3 "$base/$file" -o ".cache/tbt/rank-ablation/source/wta/$file"
          done

      - name: Build current point-in-time table with rank-history features
        shell: bash
        run: |
          set -euo pipefail
          wta_args=()
          for f in .cache/tbt/rank-ablation/source/wta/wta_rankings_*.csv; do
            wta_args+=(--wta-rank-history-csv "$f")
          done
          python -u scripts/build_production_training_table.py             --history-dir .cache/tbt/history             --atp-rank-history-sqlite .cache/tbt/rank-ablation/source/atp/rankings.db             --wta-rank-history-players-csv .cache/tbt/rank-ablation/source/wta/wta_players.csv             "${wta_args[@]}"             --out .cache/tbt/rank-ablation/training_table.parquet             --report .cache/tbt/rank-ablation/training_table_report.json

      - name: Fit matched baseline and rank-history arms
        run: |
          python -u scripts/audit_rank_history_ablation.py             --training-table .cache/tbt/rank-ablation/training_table.parquet             --training-report .cache/tbt/rank-ablation/training_table_report.json             --data-repository "$TBT_DATA_REPOSITORY"             --out .cache/tbt/rank-ablation/report.json

      - name: Validate read-only research contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.cache/tbt/rank-ablation/report.json').read_text())
          assert r['phase']=='complete', r.get('phase')
          assert r['provider_requests']==0
          assert r['production_mutated'] is False
          assert int(r['partitions']['test']['n']) > 0
          print(json.dumps({
              'rank_coverage': r['rank_coverage'],
              'delta': r['rank_history_minus_baseline'],
              'by_tour': r['by_tour_delta'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinq-rank-history-ablation-${{ github.run_id }}
          path: |
            .cache/tbt/rank-ablation/report.json
            .cache/tbt/rank-ablation/training_table_report.json
          if-no-files-found: warn
          retention-days: 14
