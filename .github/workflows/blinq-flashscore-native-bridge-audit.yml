name: BlinQ Flashscore native event bridge (read-only one-shot)
'on':
  pull_request:
    paths:
      - .github/workflows/blinq-flashscore-native-bridge-audit.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/blinq-flashscore-native-bridge-audit.yml
permissions:
  contents: read
concurrency:
  group: blinq-flashscore-id-bridge-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  source-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      DRIVE_READER_JSON: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
      CDB_REPO: BackstageTalks/tbt-data
      SOURCE_DRIVE_ID: 1MQJhldmHcVgiDXyK234oqagnXGjdO9ah
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only PR compilation and scope check
        run: |
          python - <<'PY'
          import re
          assert re.fullmatch(r'[A-Za-z0-9_-]{12,128}', '1MQJhldmHcVgiDXyK234oqagnXGjdO9ah')
          print('FLASH_NATIVE_BRIDGE_PR_CONTRACT_PASS')
          PY
      - name: Private identity-only crosswalk audit
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$DRIVE_READER_JSON"
          test "$(gh repo view "$CDB_REPO" --json visibility -q .visibility)" = PRIVATE
          mkdir -p work
          gh release download tbt-data-v1 -R "$CDB_REPO" \
            -p blinq-flashscore-event-index-2026.jsonl.gz -D work
          python -m pip install --quiet google-auth requests
          gh release download tbt-data-v1 -R "$CDB_REPO" \
            -p history-2024.parquet -p history-2025.parquet -p history-2026.parquet \
            -p history_manifest.json -p _tbt_bundle_manifest.json -D work
          python -m pip install --quiet pandas pyarrow
          python - <<'PY'
          import gzip,hashlib,io,json,os,re,zipfile
          from collections import Counter
          from pathlib import Path
          from google.oauth2.service_account import Credentials
          from google.auth.transport.requests import AuthorizedSession
          p=Path('work/blinq-flashscore-event-index-2026.jsonl.gz')
          if hashlib.sha256(p.read_bytes()).hexdigest()!='328f9c36c0f4021c745ca7119ea904a4ae7cadb66cee17cc63f2ca6f5774a952':
              raise SystemExit('Private Flashscore index digest mismatch')
          cred=Credentials.from_service_account_info(json.loads(os.environ["DRIVE_READER_JSON"]),
               scopes=["https://www.googleapis.com/auth/drive.readonly"])
          r=AuthorizedSession(cred).get("https://www.googleapis.com/drive/v3/files/"+
                 os.environ['SOURCE_DRIVE_ID'],params={'alt':'media'},timeout=90)
          r.raise_for_status()
          payload=r.content
          if hashlib.sha256(payload).hexdigest()!='ae52fb03322a0265a181c07fdb948f9fe2cab8fb3b15de462380c4bba0517612':
              raise SystemExit('Source Drive ZIP changed')
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              src=z.read('cdb_oriented_source_candidates.jsonl.gz')
          if hashlib.sha256(src).hexdigest()!='e66e6de58d70801fe2dca7b049f75f442237516a7e5042947b892d63daa1dae8':
              raise SystemExit('Source candidate stage digest changed')
          original=[json.loads(l) for l in gzip.decompress(src).splitlines() if l.strip()]
          keys={(x['source_tour'],str(x['source_match_id'])) for x in original}
          by_id={str(x['source_match_id']) for x in original}
          stats=Counter(); names=Counter(); example_keys=Counter(); direct=set(); many=set()
          potential=[]
          def candidates(row):
              vals=[]
              def walk(obj, path=''):
                  if isinstance(obj,dict):
                      for k,v in obj.items():
                          if len(path.split('.'))>=4:continue
                          clean=k.lower().replace('_','')
                          next_path=(path+'.'+k).strip('.')
                          if isinstance(v,str) and re.fullmatch(r'[A-Za-z0-9]{8}',v) and (
                              clean in ('id','matchid','eventid','flashscoreid','sourceeventid','flashscorematchid')
                              or ('match' in clean and 'id' in clean)):
                              vals.append((next_path,v))
                          elif isinstance(v,(dict,list)):walk(v,next_path)
                  elif isinstance(obj,list):
                      for x in obj[:5]:walk(x,path)
              walk(row)
              return vals
          with gzip.open(p,'rt',encoding='utf-8') as f:
              for line in f:
                  if not line.strip():continue
                  item=json.loads(line);stats['index_rows']+=1
                  if not isinstance(item,dict):continue
                  for k in item:example_keys[k]+=1
                  for path,val in candidates(item):
                      names[path]+=1
                      if val in by_id:
                          stats['matched_id_occurrences']+=1
                          many.add(val)
                          if path.split('.')[-1].lower().replace('_','') in ('matchid','eventid','flashscorematchid','sourceeventid'):
                              direct.add(val)
                              if len(potential)<10:potential.append(path)
                  if item.get('canonical_match_id') or item.get('canonical_provider_event_id'):
                      stats['index_rows_with_explicit_canonical_bridge']+=1
          strict=Counter(); link_types=Counter(); link_fields=Counter(); player_fields=Counter(); link_status=Counter()
          sources={str(x['source_match_id']):x for x in original}
          from datetime import datetime,timezone
          def clock(value):
              try:
                  d=datetime.fromisoformat(str(value).replace('Z','+00:00'))
                  return d.astimezone(timezone.utc) if d.tzinfo else None
              except (TypeError,ValueError):return None
          with gzip.open(p,'rt',encoding='utf8') as f:
              for line in f:
                  if not line.strip():continue
                  item=json.loads(line)
                  if not isinstance(item,dict):continue
                  eid=str(item.get('event_id') or '')
                  if eid not in sources:continue
                  srcrow=sources[eid]
                  strict['source_index_id_match']+=1
                  if item.get('canonical_match_id'):strict['with_canonical_match_id']+=1
                  if str(item.get('tour') or '').upper()==srcrow['source_tour']:
                      strict['same_tour']+=1
                      if clock(item.get('start_utc'))==clock(srcrow['scheduled_at_utc']):
                          strict['same_tour_and_exact_utc']+=1
                          if item.get('canonical_match_id'):
                              strict['same_tour_utc_with_canonical_match_id']+=1
                  for field in ('link','player1_source','player2_source'):
                      obj=item.get(field)
                      link_types[field+':'+type(obj).__name__]+=1
                      if isinstance(obj,dict):
                          for key in obj:
                              (link_fields if field=='link' else player_fields)[field+'.'+key]+=1
                          if field=='link':
                              for k in ('status','strategy','method','quality','evidence'):
                                  if k in obj and isinstance(obj[k],(str,int,bool)):
                                      link_status[k+':'+str(obj[k])[:35]]+=1
          exact_proof=Counter(); score_types=Counter(); orient_values=Counter(); evidence_types=Counter()
          def compact_text(x):
              return ' '.join(str(x or '').lower().split())
          with gzip.open(p,'rt',encoding='utf8') as f:
              for line in f:
                  if not line.strip():continue
                  item=json.loads(line)
                  if not isinstance(item,dict):continue
                  srcrow=sources.get(str(item.get('event_id') or ''))
                  if not srcrow or str(item.get('tour') or '').upper()!=srcrow['source_tour'] or clock(item.get('start_utc'))!=clock(srcrow['scheduled_at_utc']):
                      continue
                  exact_proof['same_tour_utc']+=1
                  if not item.get('canonical_match_id'):continue
                  exact_proof['with_canonical_id']+=1
                  link=item.get('link') or {}
                  if isinstance(link,dict):
                      score_types[type(link.get('score')).__name__]+=1
                      orient_values[str(link.get('orientation'))[:25]]+=1
                      evidence_types[type(link.get('tournament_evidence')).__name__]+=1
                      if link.get('accepted') is True:exact_proof['link_accepted_true']+=1
                  src_ids={str(srcrow['source_winner_id']),str(srcrow['source_loser_id'])}
                  index_sides={str(item.get('player1_source')),str(item.get('player2_source'))}
                  if index_sides==src_ids:exact_proof['index_source_sides_are_native_ids']+=1
                  src_names={compact_text(srcrow['source_winner_name']),compact_text(srcrow['source_loser_name'])}
                  index_names={compact_text(item.get('player1_source')),compact_text(item.get('player2_source'))}
                  if src_names==index_names:exact_proof['index_source_sides_equal_names']+=1
          # Physical current canonical NULL check: SHA-pinned all three years,
          # no fuzzy joins, no write. A linked Flashscore event is not by itself
          # a proof that source/canonical players or result are identical.
          import pandas as pd
          bundle=json.loads(Path('work/_tbt_bundle_manifest.json').read_text())['files']
          hm=json.loads(Path('work/history_manifest.json').read_text())['years']
          canids={}
          for yr in (2024,2025,2026):
              name=f'history-{yr}.parquet'; file=Path('work')/name
              digest=hashlib.sha256(file.read_bytes()).hexdigest()
              if digest!=bundle[name]['sha256'] or digest!=hm[str(yr)]['sha256']:
                  raise SystemExit('Canonical physical digest mismatch')
              cols=['match_id','tour','scheduled_at','player1_id','player1_name','player2_id','player2_name',
                    'winner_id','status','surface','tournament','best_of','stats_json','provider_context_json']
              df=pd.read_parquet(file,columns=cols)
              for values in df.itertuples(index=False,name=None):
                  row=dict(zip(cols,values))
                  if str(row['match_id']) in canids:
                      raise SystemExit('Duplicate canonical ID across partitions')
                  canids[str(row['match_id'])]=row
          audit=Counter(); gap=Counter()
          with gzip.open(p,'rt',encoding='utf-8') as stream:
              for line in stream:
                  if not line.strip():continue
                  item=json.loads(line)
                  if not isinstance(item,dict):continue
                  srcrow=sources.get(str(item.get('event_id') or ''))
                  if not srcrow or not item.get('canonical_match_id'):continue
                  if str(item.get('tour') or '').upper()!=srcrow['source_tour']:continue
                  if clock(item.get('start_utc'))!=clock(srcrow['scheduled_at_utc']):continue
                  audit['native_event_exact_clock_canonical_id']+=1
                  link=item.get('link') or {}
                  if not isinstance(link,dict) or link.get('accepted') is not True or link.get('orientation') not in ('direct','swapped'):
                      audit['link_unverified']+=1;continue
                  m=canids.get(str(item['canonical_match_id']))
                  if m is None:audit['canonical_id_missing']+=1;continue
                  if str(m['tour']).upper()!=srcrow['source_tour'] or clock(m['scheduled_at'])!=clock(srcrow['scheduled_at_utc']):
                      audit['canonical_tour_or_exact_utc_mismatch']+=1;continue
                  audit['three_way_source_index_cdb_clock']+=1
                  if str(m['status']).lower() not in ('finished','completed','ended'):
                      audit['canonical_nonfinished']+=1;continue
                  left,right=compact_text(item.get('player1_source')),compact_text(item.get('player2_source'))
                  sw,sl=compact_text(srcrow['source_winner_name']),compact_text(srcrow['source_loser_name'])
                  if left==sw and right==sl: winner_source_first=True
                  elif left==sl and right==sw:winner_source_first=False
                  else:audit['source_pair_names_not_same']+=1;continue
                  # Index link orientation is only a proposal; independent
                  # match stats below must corroborate both player sides.
                  winner_p1=winner_source_first if link['orientation']=='direct' else not winner_source_first
                  expected_winner=str(m['player1_id'] if winner_p1 else m['player2_id'])
                  if str(m['winner_id'])!=expected_winner:
                      audit['canonical_winner_conflict']+=1;continue
                  audit['full_proposed_winner_orientation']+=1
                  try:
                      existing=json.loads(m['stats_json'] or '{}')
                      if not isinstance(existing,dict):raise ValueError()
                  except (TypeError,ValueError):
                      audit['malformed_canonical_stats']+=1;continue
                  observed={}
                  for label,fields in (('winner',srcrow['winner_stats']),('loser',srcrow['loser_stats'])):
                      pref='p1' if (label=='winner')==winner_p1 else 'p2'
                      observed.update({pref+'_'+k:v for k,v in fields.items()})
                  four=('p1_aces','p2_aces','p1_double_faults','p2_double_faults')
                  if not all(key in observed and isinstance(existing.get(key),(int,float))
                             and not isinstance(existing.get(key),bool)
                             and float(existing[key])==float(observed[key]) for key in four):
                      audit['missing_or_disagreeing_four_independent_counts']+=1;continue
                  audit['four_original_count_cells_corroborated']+=1
                  vals=[]
                  for text_score in str(srcrow.get('source_score') or '').split():
                      match=re.fullmatch(r'(\d+)-(\d+)',text_score)
                      if match:vals.append((int(match[1]),int(match[2])))
                  has_score=False
                  if len(vals)>=2:
                      has_score=all(
                          all(isinstance(existing.get('p'+str(side)+'_set'+str(n)+'_games'),(int,float))
                              and float(existing['p'+str(side)+'_set'+str(n)+'_games'])==float(games)
                              for side,games in ((1,(a if winner_p1 else b)),(2,(b if winner_p1 else a))))
                          for n,(a,b) in enumerate(vals[:2],1))
                  if has_score:audit['independent_first_two_sets_score_verified']+=1
                  mismatches=[k for k,v in observed.items() if existing.get(k) is not None and
                              (not isinstance(existing[k],(int,float)) or abs(float(existing[k])-float(v))>0.000001)]
                  if mismatches:
                      audit['other_existing_stats_conflicts']+=1;continue
                  missing=[k for k in observed if existing.get(k) is None]
                  if missing:
                      audit['four_count_context_positive_null_delta']+=1
                      gap.update(missing)
                      if has_score:audit['four_count_and_score_positive_null_delta_matches']+=1
                  else:audit['already_complete_source_stats']+=1
          print('FLASH_NATIVE_CDB_STRICT_GAP',json.dumps({
             'counts':dict(audit),
             'missing_cell_counts_context_candidates_only':dict(gap),
             'write_authorized':False,'canonical_written':False,
             'requires_independent_player_identity':True
          },sort_keys=True))
          print('FLASH_NATIVE_EXACT75_PROOF',json.dumps({
             'counts':dict(exact_proof),
             'link_score_types':dict(score_types),
             'link_orientation_categories':dict(orient_values),
             'tournament_evidence_types':dict(evidence_types)
          },sort_keys=True))
          print('FLASH_NATIVE_BRIDGE_LINK_SCHEMA',json.dumps({
             'strict':dict(strict),
             'link_value_types':dict(link_types),
             'link_keys':dict(link_fields.most_common(55)),
             'player_source_keys':dict(player_fields.most_common(50)),
             'link_categorical':dict(link_status.most_common(25))
          },sort_keys=True))
          print('FLASH_NATIVE_BRIDGE_REPORT',json.dumps({
              'source_rows':len(original),'source_distinct_events':len(keys),
              'index_rows':stats['index_rows'],
              'index_field_names':sorted(example_keys)[:50],
              'observed_8char_id_field_paths':dict(names.most_common(20)),
              'any_matching_event_identifiers':len(many),
              'matching_explicit_match_event_identifiers':len(direct),
              'bridge_explicit_canonical_fields':stats['index_rows_with_explicit_canonical_bridge'],
              'sample_matching_field_paths':sorted(set(potential)),
              'production_mutated':False,'model_changed':False
          },sort_keys=True))
          PY
