name: One-time free tennis ace quotes live audit (read-only)
# Probe only the existing PROPL key and the free provider's tennis markets.
# This branch-specific workflow is never a scheduled production writer.
on:
  push:
    branches:
      - audit/free-tennis-aces-quote-20261117

permissions:
  contents: read

concurrency:
  group: free-tennis-aces-quote-probe-20261117
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PROPL: ${{ secrets.PROPL }}
    steps:
      - name: Check authenticated tennis aces market with one capped free request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.getenv("PROPL", "")
          if not key:
              print("FREE_ACES_PROBE=" + json.dumps({"status": "missing_existing_propline_key"}))
              raise SystemExit(2)
          endpoint = "https://api.prop-line.com/v1/sports/tennis/odds?markets=player_aces,total_aces"
          req = urllib.request.Request(endpoint, headers={
              "X-API-Key": key, "Accept": "application/json",
              "User-Agent": "BlinQ-free-quote-readonly-audit/1.0"
          })
          try:
              with urllib.request.urlopen(req, timeout=35) as response:
                  remain = response.headers.get("X-Daily-Remaining")
                  raw = response.read(30000001)
                  code = response.status
          except urllib.error.HTTPError as exc:
              print("FREE_ACES_PROBE=" + json.dumps({
                  "status": "provider_http_error", "http_code": exc.code,
                  "remaining": exc.headers.get("X-Daily-Remaining"),
              }))
              raise SystemExit(2)
          except (OSError, TimeoutError) as exc:
              print("FREE_ACES_PROBE=" + json.dumps({"status": "provider_network_error",
                       "error_type": type(exc).__name__}))
              raise SystemExit(2)
          if len(raw) > 30000000:
              raise SystemExit("Provider response larger than 30 MB")
          if remain is None:
              print("FREE_ACES_PROBE=" + json.dumps({
                  "status": "no_quota_header", "http_code": code, "bytes": len(raw)}))
              raise SystemExit(2)
          if int(remain) < 150:
              print("FREE_ACES_PROBE=" + json.dumps({
                  "status": "quota_reserve_reached_no_further_calls",
                  "remaining": int(remain)}))
              raise SystemExit(2)

          payload = json.loads(raw)
          if isinstance(payload, list):
              events = payload
          elif isinstance(payload, dict):
              events = next((payload[k] for k in ("events", "data", "results")
                             if isinstance(payload.get(k), list)), [])
          else:
              events = []
          if not isinstance(events, list):
              raise SystemExit("Unexpected events format")

          now = dt.datetime.now(dt.timezone.utc)
          markets = collections.Counter()
          ace_markets_by_book = collections.Counter()
          pairs = []
          inplay = 0
          start_missing = 0
          for event in events:
              if not isinstance(event, dict):
                  continue
              if event.get("live") or event.get("in_play"):
                  inplay += 1
                  continue
              start = str(event.get("commence_time") or event.get("start_time") or "")
              try:
                  start_dt = dt.datetime.fromisoformat(start.replace("Z", "+00:00"))
                  if start_dt.tzinfo is None or start_dt <= now:
                      continue
              except ValueError:
                  start_missing += 1
                  continue
              ident = str(event.get("id") or event.get("event_id") or "")
              title = " - ".join(str(event.get(k) or "") for k in ("home_team", "away_team"))
              for book in event.get("bookmakers") or []:
                  if not isinstance(book, dict):
                      continue
                  bookname = str(book.get("key") or book.get("title") or "")
                  for market in book.get("markets") or []:
                      if not isinstance(market, dict):
                          continue
                      mk = str(market.get("key") or "")
                      if "ace" in mk:
                          markets[mk] += 1
                          ace_markets_by_book[bookname] += 1
                      if mk != "player_aces":
                          continue
                      if market.get("suspended_at") or market.get("suspended") is True:
                          continue
                      groups = collections.defaultdict(list)
                      for outcome in market.get("outcomes") or []:
                          if not isinstance(outcome, dict):
                              continue
                          side = str(outcome.get("name") or "").strip().lower()
                          person = str(outcome.get("description") or "").strip()
                          line = outcome.get("point")
                          odds = outcome.get("price")
                          if side in ("over", "under") and person and line is not None:
                              try:
                                  val = float(odds)
                                  if val <= -100 or val >= 100 or 1 < val <= 30:
                                      groups[(person, float(line))].append((side, val))
                              except (ValueError, TypeError):
                                  pass
                      for (person, line), rows in groups.items():
                          if len(rows) == 2 and {x[0] for x in rows} == {"over", "under"}:
                              pairs.append({
                                  "event": title, "event_id": ident, "start": start,
                                  "bookmaker": bookname, "player": person,
                                  "line": line, "over_price_raw": next(x[1] for x in rows if x[0] == "over"),
                                  "under_price_raw": next(x[1] for x in rows if x[0] == "under"),
                              })
          print("FREE_ACES_PROBE=" + json.dumps({
              "status": "live_api_read_completed",
              "utc_captured_at": now.isoformat(),
              "provider": "propline",
              "request_count": 1,
              "quota_remaining": int(remain),
              "raw_event_count": len(events),
              "skipped_inplay_events": inplay,
              "missing_start_events": start_missing,
              "ace_market_keys_observed": dict(markets),
              "ace_market_counts_by_book": dict(ace_markets_by_book),
              "conventional_book_aces_market_count": sum(count for book, count in ace_markets_by_book.items() if book not in ("dabble", "sleeper", "prizepicks", "underdog", "parlayplay", "draftkings_pick6")),
              "validated_prematch_player_aces_pairs": len(pairs),
              "sample_verified_pairs": pairs[:5],
              "most_aces_contract_status": "not_verifiable_from_player_aces_bulk",
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Check advertised VIAC ES market keys for two real ATP matches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.getenv("PROPL", "")
          if not key:
              raise SystemExit("Existing free PropLine key unavailable")
          base = "https://api.prop-line.com/v1/sports/tennis/events"
          examples = [
              ("Fils-Jodar", "781937"),
              ("Zverev-Shelton", "733579"),
          ]
          summary = {"requests": 0, "events": [], "quote_verified": False}
          for label, event_id in examples:
              path = f"{base}/{event_id}/markets"
              req = urllib.request.Request(path, headers={"X-API-Key": key,
                  "Accept": "application/json", "User-Agent": "BlinQ-free-market-audit/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      remaining = res.headers.get("X-Daily-Remaining")
                      payload = json.load(res)
              except urllib.error.HTTPError as exc:
                  summary["events"].append({"event": label, "error_http": exc.code})
                  continue
              summary["requests"] += 1
              if remaining is None or int(remaining) <= 150:
                  summary["status"] = "quota_unverified_or_reserve"
                  break
              if isinstance(payload, dict):
                  rows = payload.get("markets") or payload.get("data") or payload.get("results") or []
              elif isinstance(payload, list):
                  rows = payload
              else:
                  rows = []
              keys = sorted(set(str(x.get("key")) for x in rows if isinstance(x, dict) and x.get("key")))
              ace_keys = [x for x in keys if "ace" in x.lower()]
              more_keys = [x for x in ace_keys if any(t in x.lower() for t in
                          ("most", "more", "winner", "superiority", "higher"))]
              summary["events"].append({
                  "event": label, "advertised_aces_keys": ace_keys,
                  "advertised_most_aces_keys": more_keys,
                  "all_market_keys_count": len(keys),
                  "quota_remaining": int(remaining)
              })
              # Read only one unambiguously advertised VIAC ES market, if present.
              if more_keys and not summary["quote_verified"]:
                  from urllib.parse import urlencode
                  odds_url = f"{base}/{event_id}/odds?" + urlencode({"markets": more_keys[0]})
                  req2 = urllib.request.Request(odds_url, headers={"X-API-Key": key,
                      "Accept": "application/json", "User-Agent": "BlinQ-free-market-audit/1.0"})
                  try:
                      with urllib.request.urlopen(req2, timeout=20) as res:
                          quota = res.headers.get("X-Daily-Remaining")
                          prices = json.load(res)
                      summary["requests"] += 1
                      if quota is not None:
                          summary["quota_remaining"] = int(quota)
                      summaries = []
                      for book in prices.get("bookmakers") or []:
                          for m in book.get("markets") or []:
                              if m.get("key") == more_keys[0]:
                                  summaries.append({"book": book.get("key"),
                                                    "outcomes": [{"name": o.get("name"), "price": o.get("price")}
                                                                 for o in (m.get("outcomes") or [])[:3]]})
                      summary["events"][-1]["most_aces_market_price_samples"] = summaries[:3]
                      summary["quote_verified"] = bool(summaries)
                  except (urllib.error.HTTPError, OSError, ValueError) as exc:
                      summary["events"][-1]["market_price_error"] = type(exc).__name__
          print("FREE_MORE_ACES_PROBE=" + json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY
