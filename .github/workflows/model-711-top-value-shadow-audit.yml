name: BlinQ 7.1.1 issued TOP VALUE comparison (read-only)
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_711_top_value_shadow.py
      - tests/test_audit_711_top_value_shadow.py
      - .github/workflows/model-711-top-value-shadow-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-711-issued-top-value-readonly
  cancel-in-progress: false

jobs:
  test-real-issued:
    if: github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline contract tests
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest -q tests/test_audit_711_top_value_shadow.py
      - name: Verify private source access without mutation
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view BackstageTalks/tbt-data --json visibility -q .visibility)" = PRIVATE
      - name: Compare confirmed issued priced TOP/VALUE with pre-issued shadow
        run: |
          set -euo pipefail
          python scripts/audit_711_top_value_shadow.py \
            --data-repository BackstageTalks/tbt-data \
            --out .cache/tbt/model-711-top-value/report.json
      - name: Publish aggregate only
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('.cache/tbt/model-711-top-value/report.json').read_text())
          assert report['production_mutated'] is False
          assert report['provider_requests'] == 0
          assert report['model_promoted'] is False
          lines=['### BlinQ 7.1.1 vs production on truly pre-issued TOP/VALUE',
                 f"Status: {report['status']}",
                 f"Eligible published selection records: {report['source_issued']}",
                 f"Uniquely matched exact pre-issued pairs: {report['matched_unique']}",
                 f"Tour matching: {report['matched_by_tour']}",
                 f"Unmatched diagnostics: {report['unmatched_reasons']}",
                 f"Matched metrics: {report['groups']}",
                 'Cannot retroactively score missing shadow predictions. No production activation.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as handle:
              handle.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinq-711-issued-top-value-${{ github.run_id }}
          path: .cache/tbt/model-711-top-value/report.json
          if-no-files-found: warn
          retention-days: 30
