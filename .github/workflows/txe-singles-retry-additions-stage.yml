name: BlinQ ATP WTA archive retry score field delta after current CDB write
on:
  pull_request:
    paths:
      - scripts/stage_txe_wta2024_scores.py
      - scripts/import_txe_wta2024_scores_exact.py
      - tests/test_txe_generic_score_semantics.py
      - .github/workflows/txe-singles-retry-additions-stage.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: blinq-singles-retry-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tour: atp, year: 2025, archive: txe-retry-atp-single-2025-38113629706-1.tar.gz, hash: "8c2eede289a871fd269cddc669faf16a45cc872ddfc2d011188452f52da48130"}
          - {tour: atp, year: 2026, archive: txe-retry-atp-single-2026-38039406462-1.tar.gz, hash: "cbaf89c1fc987718e06decc5a43b65179881e0072c29052ed16f28112fd9af6c"}
          - {tour: wta, year: 2026, archive: txe-retry-wta-single-2026-38039406462-1.tar.gz, hash: "2845c31bd9d01d4f1fc12468f209c5635e810dad9559e964dc9c24db39088f83"}
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      BLINQ_SCORE_YEAR: ${{ matrix.year }}
      BLINQ_SCORE_TOUR: ${{ matrix.tour }}
      BLINQ_SCORE_SOURCE_SHA: ${{ matrix.hash }}
      SOURCE_ARCHIVE: ${{ matrix.archive }}
      ROOT: .cache/tbt/retry-singles-${{ matrix.tour }}-${{ matrix.year }}
      DATA_REPO: BackstageTalks/tbt-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regression and generic ATP/WTA score consistency
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements.txt -r api/requirements-train.txt pytest
          (
            export BLINQ_SCORE_YEAR=2024 BLINQ_SCORE_TOUR=wta BLINQ_SCORE_SOURCE_SHA=27c779c73bcfaf089e362f3480c4201f032e15fefbc3a0fadaa39bfce9f5956b
            python -m pytest -q tests/test_txe_wta2024_scores_exact.py
          )
          python -m pytest -q tests/test_txe_generic_score_semantics.py
          python -m compileall -q scripts/stage_txe_wta2024_scores.py scripts/import_txe_wta2024_scores_exact.py
      - name: Independently retrieve pinned source and current CDB year
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$DATA_REPO" --json visibility -q .visibility)" = PRIVATE
          mkdir -p "$ROOT/source" "$ROOT/history" "$ROOT/stage" "$ROOT/local"
          gh release download blinq-tennisexplorer-cloud-20261009 -R "$DATA_REPO" -p "$SOURCE_ARCHIVE" -D "$ROOT/source"
          echo "$BLINQ_SCORE_SOURCE_SHA  $ROOT/source/$SOURCE_ARCHIVE" | sha256sum -c -
          gh release download tbt-data-v1 -R "$DATA_REPO" -p "history-$BLINQ_SCORE_YEAR.parquet" -p history_manifest.json -p _tbt_bundle_manifest.json -D "$ROOT/history"
          gh api "repos/$DATA_REPO/releases/tags/tbt-data-v1" > "$ROOT/history/release.json"
      - name: Actual provider source and canonical identity/score delta
        run: |
          set -euo pipefail
          python scripts/stage_txe_wta2024_scores.py --source "$ROOT/source/$SOURCE_ARCHIVE" --history "$ROOT/history/history-$BLINQ_SCORE_YEAR.parquet" --manifest "$ROOT/history/history_manifest.json" --release "$ROOT/history/release.json" --out "$ROOT/stage"
          jq '.counts' "$ROOT/stage/report.json"
          test "$(jq -r .production_mutated "$ROOT/stage/report.json")" = false
          test "$(jq -r .counts.source_rows "$ROOT/stage/report.json")" -gt 0
      - name: Full affected-year strictly add-only local patch and reread
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/dry" "$ROOT/local-write" "$ROOT/local-verify"
          for f in "history-$BLINQ_SCORE_YEAR.parquet" history_manifest.json _tbt_bundle_manifest.json; do cp "$ROOT/history/$f" "$ROOT/local/$f"; done
          python scripts/import_txe_wta2024_scores_exact.py --mode dry-run --before-dir "$ROOT/history" --after-dir "$ROOT/local" --stage-file "$ROOT/stage/stage.jsonl" --stage-report "$ROOT/stage/report.json" --out "$ROOT/dry/report.json"
          delta="$(jq -r .added_values "$ROOT/dry/report.json")"
          if [[ "$delta" -gt 0 ]]; then
            python scripts/import_txe_wta2024_scores_exact.py --mode write --before-dir "$ROOT/history" --after-dir "$ROOT/local" --stage-file "$ROOT/stage/stage.jsonl" --stage-report "$ROOT/stage/report.json" --out "$ROOT/local-write/report.json"
            python scripts/import_txe_wta2024_scores_exact.py --mode verify --before-dir "$ROOT/history" --after-dir "$ROOT/local" --stage-file "$ROOT/stage/stage.jsonl" --stage-report "$ROOT/stage/report.json" --out "$ROOT/local-verify/report.json"
            test "$(jq -r .existing_values_overwritten "$ROOT/local-verify/report.json")" = 0
            test "$(jq -r .added_values "$ROOT/local-verify/report.json")" = "$delta"
          fi
          echo "POSITIVE_EXACT_SCORE_CELLS: $delta"
      - name: Aggregate-only artifact, no source identities or private rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-singles-${{ matrix.tour }}-${{ matrix.year }}-${{ github.run_id }}
          path: |
            .cache/tbt/retry-singles-${{ matrix.tour }}-${{ matrix.year }}/stage/report.json
            .cache/tbt/retry-singles-${{ matrix.tour }}-${{ matrix.year }}/dry/report.json
            .cache/tbt/retry-singles-${{ matrix.tour }}-${{ matrix.year }}/local-write/report.json
            .cache/tbt/retry-singles-${{ matrix.tour }}-${{ matrix.year }}/local-verify/report.json
          retention-days: 35
          if-no-files-found: warn
