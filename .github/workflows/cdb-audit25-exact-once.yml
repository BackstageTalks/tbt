name: Import audit 25 percent exact CDB sources (one shot)

on:
  pull_request:
    paths:
      - '.github/workflows/cdb-audit25-exact-once.yml'
      - '.github/cdb-audit25-exact-request.json'
  push:
    branches: [main]
    paths:
      - '.github/cdb-audit25-exact-request.json'

permissions:
  contents: read

concurrency:
  group: blinq-cdb-audit25-once-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: a845e855ca7cfcb9ec48cd441e58250a1f1fd6e6
          path: source
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas pyarrow pytest
      - name: Validate all operator-approved source stages against committed source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          expected=[
            ('r5-source-exact-20261016',95,366),
            ('manual-leaderboard-20261015',96,372),
            ('drive-pbp-20261015',103,688),
            ('tml-zip-20261015',276,4141),
            ('sackmann-bp-max-20261015',88161,176257),
          ]
          request=json.loads(Path('.github/cdb-audit25-exact-request.json').read_text())
          assert request=={
            'schema':1,'mode':'exact-reconcile-null-only',
            'source':'original_drive_cdb_audit_prepared_20261015_16',
            'batches':[x[0] for x in expected],
            'no_nonnull_overwrite':True,'single_writer':True,
            'model_training':False,'model_promotion':False,
          }
          for name,matches,fields in expected:
            p=Path('source/research')/name
            manifest=json.loads((p/'import-manifest.json').read_text())
            assert manifest['matches']==matches and manifest['fields']==fields,name
            assert manifest['source_release'].startswith('blinq-'),name
            assert len(manifest['source_archive_sha256'])==64,name
            assert hashlib.sha256((p/'stage.json.gz').read_bytes()).hexdigest()==manifest['stage_sha256'],name
            print(name, 'staging-byte-SHA-pass')
          print('Gross staged candidate fields (NOT live NULLs):',sum(x[2] for x in expected))
          PY
      - name: Run five exact importer unit test suites
        working-directory: source
        env:
          PYTHONPATH: scripts:../scripts
        run: python -m pytest -q tests/test_import_*_exact.py

  import:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[audit25-cdb-import]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: scripts:../scripts
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: a845e855ca7cfcb9ec48cd441e58250a1f1fd6e6
          path: source
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified release writer dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow
      - name: Require private canonical repository and no model operation
        run: |
          set -euo pipefail
          test "$(gh api repos/BackstageTalks/tbt-data --jq .private)" = true
          python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('../.github/cdb-audit25-exact-request.json').read_text())
          assert req['no_nonnull_overwrite'] is True
          assert req['single_writer'] is True
          assert req['model_training'] is False
          assert req['model_promotion'] is False
          PY
      - name: Wait for and acquire exclusive CDB writer
        run: python scripts/cdb_global_writer_lock.py acquire --wait-seconds 10800
      - name: Refresh R5 2026 and write only current missing native cells
        run: python scripts/import_r5_source_exact.py --write
      - name: Refresh manual leaderboard and write only current missing cells
        run: python scripts/import_manual_leaderboard_exact.py --write
      - name: Refresh Drive point by point and write only current missing cells
        run: python scripts/import_drive_pbp_exact.py --write
      - name: Refresh TennisMyLife and write only current missing cells
        run: python scripts/import_tml_zip_exact.py --write
      - name: Refresh historical BP and write only current missing count cells
        run: python scripts/import_sackmann_bp_max_exact.py --write
      - name: Preserve reconciliation, exact additions, immutable backup and remote readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdb-audit25-exact-readbacks-${{ github.run_id }}
          path: |
            source/work/r5-source-exact/report.json
            source/work/manual-leaderboard/report.json
            source/work/drive-pbp/report.json
            source/work/tml-zip/report.json
            source/work/sackmann-bp-max/report.json
            source/work/r5-source-exact/backup-inventory.json
            source/work/manual-leaderboard/backup-inventory.json
            source/work/drive-pbp/backup-inventory.json
            source/work/tml-zip/backup-inventory.json
            source/work/sackmann-bp-max/backup-inventory.json
          if-no-files-found: warn
          retention-days: 30
      - name: Release only our verified canonical writer lock
        if: always()
        run: python scripts/cdb_global_writer_lock.py release --if-held
