name: BlinQ private TML current-CDB metadata reviewer temporary
'on':
  pull_request:
    paths:
      - '.github/workflows/blinq-private-tml-event-review-temp-20261012.yml'
permissions:
  contents: read
jobs:
  private-current-match-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'BackstageTalks'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      DATA_REPO: BackstageTalks/tbt-data
      PRIVATE_SHA: 24f9836f308c25685e7ad8a480354130263fdc92
      REVIEW_SHA: ea2a6ebc405104a9afa862ed2a3f30ce92121673cd307946a6ce18eaee8dd30d
      OBS_SHA: 3cdf94b55a19d065cf01141839585245d85d59597c1fe6a7a5ffff96e121a89a
      LEGACY_SHA: ae61e871a59c9960f00c20cb061bd6d1a90e222dc58b126438d27a14aeedd192
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          ref: 24f9836f308c25685e7ad8a480354130263fdc92
          fetch-depth: 1
          path: private
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private access and synthetic safety tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(git -C private rev-parse HEAD)" = "$PRIVATE_SHA"
          test "$(gh api repos/$DATA_REPO --jq .private)" = true
          python -m unittest discover -s tests -p test_review_tml_cc0_current_cdb_events.py > "$RUNNER_TEMP/fixture-tests.log" 2>&1 || {
            echo 'PRIVATE_CDB_EVENT_FIXTURE_TESTS_FAILED'
            exit 1
          }
          echo PRIVATE_CDB_EVENT_REVIEW_SYNTHETIC_SAFETY_PASS
      - name: Download only 2022-2025 canonical years and pinned source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/history" "$RUNNER_TEMP/remote-manifest" "$RUNNER_TEMP/output"
          gh release download tbt-data-v1 -R "$DATA_REPO" -p _tbt_bundle_manifest.json \
            -p history-2022.parquet -p history-2023.parquet \
            -p history-2024.parquet -p history-2025.parquet \
            -D "$RUNNER_TEMP/history" >/dev/null
          test -s "$RUNNER_TEMP/history/_tbt_bundle_manifest.json"
          gh release download blinq-atp-gap-cc0-review-38244862038-1 -R "$DATA_REPO" \
            -p atp-gap-cc0-review-private.jsonl -D "$RUNNER_TEMP/inputs" >/dev/null
          gh release download blinq-source-evidence-tml-2022-2025-38241050051-1 -R "$DATA_REPO" \
            -p source-observations.jsonl.gz -D "$RUNNER_TEMP/inputs" >/dev/null
          gh release download tbt-canonical-identity-links-v1 -R "$DATA_REPO" \
            -p player-identity-crosswalk.jsonl -D "$RUNNER_TEMP/inputs" >/dev/null
          test "$(sha256sum "$RUNNER_TEMP/inputs/atp-gap-cc0-review-private.jsonl" | cut -d' ' -f1)" = "$REVIEW_SHA"
          test "$(sha256sum "$RUNNER_TEMP/inputs/source-observations.jsonl.gz" | cut -d' ' -f1)" = "$OBS_SHA"
          test "$(sha256sum "$RUNNER_TEMP/inputs/player-identity-crosswalk.jsonl" | cut -d' ' -f1)" = "$LEGACY_SHA"
          echo PINNED_PRIVATE_TML_SOURCE_AND_CANONICAL_BUNDLE_ACQUIRED
      - name: Compare current CDB identities and event contexts; zero canonical writes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check 'pandas>=2,<3' pyarrow
          wiki=private/research/player_identity/wikidata-canonical-links.jsonl.gz
          test -s "$wiki"
          wiki_sha="$(sha256sum "$wiki" | cut -d' ' -f1)"
          python scripts/review_tml_cc0_current_cdb_events.py \
            --gaps "$RUNNER_TEMP/inputs/atp-gap-cc0-review-private.jsonl" --gaps-sha256 "$REVIEW_SHA" \
            --legacy "$RUNNER_TEMP/inputs/player-identity-crosswalk.jsonl" --legacy-sha256 "$LEGACY_SHA" \
            --cc0 "$wiki" --cc0-sha256 "$wiki_sha" \
            --observations "$RUNNER_TEMP/inputs/source-observations.jsonl.gz" --observations-sha256 "$OBS_SHA" \
            --history-dir "$RUNNER_TEMP/history" --out "$RUNNER_TEMP/output"
          gh release download tbt-data-v1 -R "$DATA_REPO" -p _tbt_bundle_manifest.json \
            -D "$RUNNER_TEMP/remote-manifest" >/dev/null
          cmp "$RUNNER_TEMP/history/_tbt_bundle_manifest.json" \
            "$RUNNER_TEMP/remote-manifest/_tbt_bundle_manifest.json" || {
            echo STALE_CANONICAL_CDB_SNAPSHOT_ABORT
            exit 1
          }
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'output'/'report.json').read_text())
          assert r['status']=='READ_ONLY_CURRENT_CDB_SOURCE_EVENT_REVIEW'
          assert r['ready_for_cdb_write']==0
          assert r['canonical_mutated'] is False
          assert r['native_event_identity_verified'] is False
          assert r['score_corroborated'] is False
          assert r['provider_api_requests']==0
          print('CURRENT_CDB_MULTI_ID_AND_METADATA_REVIEW_NO_WRITE_PASS')
          PY
      - name: Archive review only to PRIVATE release with independent SHA readback
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/output"
          # GitHub Releases reject zero-byte asset uploads. Keep empty event
          # candidate lists intact inside a non-empty immutable archive.
          sha256sum report.json current-cdb-event-review-private.jsonl > SHA256SUMS
          tar -czf event-review-evidence.tar.gz report.json current-cdb-event-review-private.jsonl SHA256SUMS
          sha256sum event-review-evidence.tar.gz > ARCHIVE_SHA256SUMS
          tag="blinq-cc0-current-event-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" -R "$DATA_REPO" --target main \
            --title 'BlinQ private current CDB event candidate audit' \
            --notes 'Read-only metadata review, not event ID proof or canonical import.' >/dev/null
          gh release upload "$tag" event-review-evidence.tar.gz ARCHIVE_SHA256SUMS -R "$DATA_REPO" >/dev/null
          mkdir -p "$RUNNER_TEMP/readback/extracted"
          gh release download "$tag" -R "$DATA_REPO" \
            -p event-review-evidence.tar.gz -p ARCHIVE_SHA256SUMS -D "$RUNNER_TEMP/readback" >/dev/null
          (cd "$RUNNER_TEMP/readback" && sha256sum -c ARCHIVE_SHA256SUMS >/dev/null)
          tar -xzf "$RUNNER_TEMP/readback/event-review-evidence.tar.gz" \
            -C "$RUNNER_TEMP/readback/extracted" --no-same-owner
          (cd "$RUNNER_TEMP/readback/extracted" && sha256sum -c SHA256SUMS >/dev/null)
          cmp report.json "$RUNNER_TEMP/readback/extracted/report.json"
          cmp current-cdb-event-review-private.jsonl "$RUNNER_TEMP/readback/extracted/current-cdb-event-review-private.jsonl"
          echo PRIVATE_CURRENT_CDB_EVENT_REVIEW_SHA_READBACK_PASS
