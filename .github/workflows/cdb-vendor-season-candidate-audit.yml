name: Tennis seasonal per-match data - alias candidate audit only

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/cdb_vendor_season_candidate_audit.py
      - tests/test_cdb_vendor_season_candidate_audit.py
      - .github/workflows/cdb-vendor-season-candidate-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/cdb_vendor_season_candidate_audit.py
      - .github/workflows/cdb-vendor-season-candidate-audit.yml

permissions:
  contents: read

concurrency:
  group: blinq-season-alias-audit-${{ github.event_name == 'pull_request' && 'ci' || 'production-readonly' }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-alias and CDB safety invariants
        env:
          PYTHONPATH: .:api:scripts
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m compileall -q scripts/cdb_vendor_season_candidate_audit.py
          python -m pytest tests/test_cdb_vendor_season_candidate_audit.py -q

  private-research:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      BLINQ_DRIVE_READER_JSON: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
      CDB_REPO: BackstageTalks/tbt-data
      CDB_TAG: tbt-data-v1
      PYTHONPATH: .:api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install private readonly source/snapshot readers
        run: python -m pip install --disable-pip-version-check google-auth requests pandas pyarrow pydantic numpy
      - name: Fetch 2023/2024 WTA and 2024 ATP seasonal match sources with pinned bytes
        run: |
          test -n "$GH_TOKEN" || { echo PRIVATE_TOKEN_UNAVAILABLE; exit 1; }
          test -n "$BLINQ_DRIVE_READER_JSON" || { echo DRIVE_READER_UNAVAILABLE; exit 1; }
          python - <<'PY'
          from pathlib import Path
          from cdb_wta_pinned_preflight import fetch_pinned
          files=(
              ("season-wta-2023.csv","1P9c_2DHfStYBKRn71T3HICDTWvuNvNQ5",
               "6025591c5c1a5a1fbbfa0b9bbbf3bf4cb5d7e86a8da47c115c0a795b866c4859",1342242),
              ("season-wta-2024.csv","11yOL2LBaohSSw-GYFg1TGrttU1IkWaUm",
               "70f5b7e26c0ff5d88d1492bdbaa1ae5c362bf0ff91d7b14f1f8a9e1adc3b198a",1413144),
              ("season-atp-2024.csv","1Q_Mo1kJezi5ViOudFgns9Pa_pLq9VOyK",
               "d2bafc5d528029b8e207e63e2ccf9421525fc0bda1489ef3a8a0a6acf86291ab",3815737),
          )
          for name,file_id,digest,size in files:
              amount=fetch_pinned(Path("work/season")/name,file_id=file_id,expected_sha256=digest)
              if amount!=size:
                  raise SystemExit("Pinned seasonal file size mismatch: "+name)
          print("SEASON_SOURCE_SHA_VERIFIED",len(files))
          PY
      - name: SHA-verify private canonical 2022–2024 CDB snapshot
        run: |
          mkdir -p work/release
          gh api "repos/$CDB_REPO/releases/tags/$CDB_TAG" > work/release-metadata.json
          gh release download "$CDB_TAG" -R "$CDB_REPO" \
            -p history_manifest.json -p _tbt_bundle_manifest.json \
            -p 'history-2022.parquet' -p 'history-2023.parquet' \
            -p 'history-2024.parquet' -D work/release
          python - <<'PY'
          from pathlib import Path
          from cdb_wta_verified_window import verified_window
          info=verified_window(Path("work/release"),Path("work/release-metadata.json"),
                               Path("work/local-view"),years=(2022,2023,2024))
          if info["production_mutated"] is not False or len(info["partitions"])!=3:
              raise SystemExit("Private canonical snapshot failed immutable verification")
          print("SEASON_CDB_PARTITIONS_SHA_VERIFIED",len(info["partitions"]))
          PY
      - name: Candidate audit only - abbreviated names are NOT verified identities
        run: |
          python scripts/cdb_vendor_season_candidate_audit.py \
            --history-dir work/local-view \
            --source work/season/season-wta-2023.csv wta 6025591c5c1a5a1fbbfa0b9bbbf3bf4cb5d7e86a8da47c115c0a795b866c4859 \
            --source work/season/season-wta-2024.csv wta 70f5b7e26c0ff5d88d1492bdbaa1ae5c362bf0ff91d7b14f1f8a9e1adc3b198a \
            --source work/season/season-atp-2024.csv atp d2bafc5d528029b8e207e63e2ccf9421525fc0bda1489ef3a8a0a6acf86291ab \
            --output season-alias-candidate-summary.json
      - name: Enforce non-importable report contract
        run: |
          python - <<'PY'
          import json
          result=json.load(open("season-alias-candidate-summary.json"))
          if (result.get("production_mutated") is not False
                  or result.get("api_requests") != 0
                  or result.get("import_ready") is not False
                  or result.get("canonical_matches_confirmed") != 0):
              raise SystemExit("Season alias candidates must NEVER be import-ready")
          print("UNVERIFIED_ALIAS_RESEARCH_CANDIDATES",
                result["counts"].get("research_candidates_same_day_pair_winner_surface_tournament",0))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-seasonal-alias-research-summary-only
          path: season-alias-candidate-summary.json
          if-no-files-found: ignore
          retention-days: 14
