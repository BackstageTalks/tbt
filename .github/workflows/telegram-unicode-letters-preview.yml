name: BlinQ Telegram Unicode letters text preview (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/telegram-unicode-letters-preview-tick.json'
permissions:
  contents: read
concurrency:
  group: blinq-telegram-ledger
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: telegram-bot-state
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: .private-telegram
          sparse-checkout: ops
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Reserve one text-only, non-prediction glyph test
        id: reserve
        shell: bash
        run: |
          set -euo pipefail
          test -s .private-telegram/ops/telegram-bot-state.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(".private-telegram/ops/telegram-bot-state.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          key="2026-10-31:unicode-enclosed-letter-preview-v1"
          tests=d.setdefault("badge_tests",{})
          ready=key not in tests
          if ready:
              tests[key]={"status":"reserved","kind":"telegram-native-unicode-text-not-custom-emoji"}
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("ready="+("true" if ready else "false")+"\n")
          print("reserved" if ready else "already reserved/sent: no duplicate")
          PY
          if [[ "$(grep -c '^ready=true$' "$GITHUB_OUTPUT")" == "0" ]]; then exit 0; fi
          git -C .private-telegram config user.name "github-actions[bot]"
          git -C .private-telegram config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Reserve one-off Unicode letter preview [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual"
      - name: Send one text-only preview to configured Telegram channel
        if: steps.reserve.outputs.ready == 'true'
        shell: bash
        env:
          TGB: ${{ secrets.TGB }}
          TGCH: ${{ secrets.TGCH }}
        run: |
          set -euo pipefail
          test -n "$TGB" && test -n "$TGCH"
          python - <<'PY'
          from pathlib import Path
          body=(
            "🧪 TEST – natívne Unicode písmená v Telegrame\n"
            "Nie je to denná ponuka ani obrázok.\n\n"
            "Štvorčeky:\n"
            "🆃 | TOP\n"
            "🆅 | VALUE\n"
            "🅰︎ | ACES\n\n"
            "Krúžky:\n"
            "🅣 | TOP\n"
            "🅥 | VALUE\n"
            "🅐 | ACES\n\n"
            "🆓 | FREE (referencia)\n"
            "ℹ️ Skontroluj, ako sa písmená vykreslia v aplikácii."
          )
          assert len(body) < 1000 and all(c in body for c in ("🆃","🆅","🅰︎","🅣","🅥","🅐"))
          Path("/tmp/blinq-unicode-test.txt").write_text(body,encoding="utf-8")
          PY
          curl --fail-with-body --silent --show-error \
            --data-urlencode "chat_id=$TGCH" \
            --data-urlencode "text@/tmp/blinq-unicode-test.txt" \
            --data-urlencode "disable_notification=true" \
            "https://api.telegram.org/bot$TGB/sendMessage" \
            -o /tmp/blinq-unicode-receipt.json
          jq -e '.ok==true and (.result.message_id|type=="number" and .>0)' /tmp/blinq-unicode-receipt.json >/dev/null
          jq '{ok,message_id:.result.message_id}' /tmp/blinq-unicode-receipt.json
      - name: Independently verify Telegram message ID and state read-back
        if: steps.reserve.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          f=Path(".private-telegram/ops/telegram-bot-state.json")
          d=json.loads(f.read_text(encoding="utf-8"))
          receipt=json.loads(Path("/tmp/blinq-unicode-receipt.json").read_text(encoding="utf-8"))
          mid=(receipt.get("result") or {}).get("message_id")
          key="2026-10-31:unicode-enclosed-letter-preview-v1"
          if receipt.get("ok") is not True or not isinstance(mid,int) or mid<=0:
              raise SystemExit("Missing Telegram acknowledgement")
          if d["badge_tests"][key].get("status")!="reserved":
              raise SystemExit("Reservation missing")
          d["badge_tests"][key].update(status="sent",message_id=mid)
          f.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("confirmed message_id",mid)
          PY
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Confirm Telegram Unicode text preview receipt [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual"
