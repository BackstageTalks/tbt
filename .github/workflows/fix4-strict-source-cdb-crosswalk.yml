name: FIX4 independently verified ATP source to canonical CDB (read-only)
'on':
  pull_request:
    paths:
      - scripts/research/fix4_strict_cdb_crosswalk.py
      - tests/test_fix4_strict_cdb_crosswalk.py
      - .github/workflows/fix4-strict-source-cdb-crosswalk.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/fix4-strict-source-cdb-crosswalk.yml
permissions:
  contents: read
concurrency:
  group: fix4-strict-crosswalk-20261015-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and prove no native CDB writes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/research/fix4_strict_cdb_crosswalk.py
          PYTHONPATH=scripts/research python -m unittest discover -s tests -p test_fix4_strict_cdb_crosswalk.py -v
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/research/fix4_strict_cdb_crosswalk.py').read_text()
          assert "'cdb_writes':0" in s and "'write_authorized':False" in s
          assert 'upload_bundle(' not in s and 'write_partition(' not in s
          print('FIX4_SOURCE_CROSSWALK_FAIL_CLOSED_CONTRACT_PASS')
          PY
  current-cdb:
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      DRIVE_READER_JSON: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
      SOURCE_STAGE_DRIVE_ID: 1sVhAw9rR06XtHCzr1AHyRXy-g2kncHhB
      BRIDGE_DRIVE_ID: 1Knf6bzFlfdFr1lEbhk_xy0FPgSGSv-Oh
      PRIVATE_REPO: BackstageTalks/tbt-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all credentials and private repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$DRIVE_READER_JSON"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check -q google-auth requests 'pyarrow>=17,<25'
      - name: Fetch pinned original source bundles from authorized private Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/fix4/source work/fix4/history work/fix4/identity work/fix4/report work/fix4/check
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from google.oauth2.service_account import Credentials
          from google.auth.transport.requests import AuthorizedSession
          creds=Credentials.from_service_account_info(json.loads(os.environ['DRIVE_READER_JSON']),scopes=['https://www.googleapis.com/auth/drive.readonly'])
          sess=AuthorizedSession(creds)
          for env,name,digest in (
           ('SOURCE_STAGE_DRIVE_ID','stage.zip','39e62b87455ebd34b9451e5ddf4a752fe30d648f8f3f02603f5e078096bc61ea'),
           ('BRIDGE_DRIVE_ID','bridge.zip','da4854ca582a0baae488f9874e608894b8757dcdf72c1379f9a1e2d53c37dff2')):
           r=sess.get('https://www.googleapis.com/drive/v3/files/'+os.environ[env],params={'alt':'media'},timeout=180)
           r.raise_for_status()
           if hashlib.sha256(r.content).hexdigest()!=digest:raise SystemExit('FIX4_SOURCE_DIGEST_MISMATCH:'+name)
           Path('work/fix4/source',name).write_bytes(r.content)
           print('PINNED_FIX4_SOURCE_READBACK',name,len(r.content))
          PY
      - name: Download pinned private player crosswalk and current canonical partitions
        shell: bash
        run: |
          set -euo pipefail
          gh release download tbt-canonical-identity-links-v1 -R "$PRIVATE_REPO" -D work/fix4/identity \
            -p player-identity-crosswalk.jsonl -p _tbt_bundle_manifest.json
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -D work/fix4/history \
            -p history-2015.parquet -p history-2016.parquet -p history-2017.parquet -p history-2019.parquet \
            -p history_manifest.json -p _tbt_bundle_manifest.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('work/fix4/identity')
          manifest=json.loads((root/'_tbt_bundle_manifest.json').read_text())
          files=manifest.get('files',{})
          for name in ('player-identity-crosswalk.jsonl',):
           expected=(files.get(name) or {}).get('sha256')
           if not expected or hashlib.sha256((root/name).read_bytes()).hexdigest()!=expected:
            raise SystemExit('PLAYER_CROSSWALK_RELEASE_SHA_MISMATCH')
          print('VERIFIED_CDB_PLAYER_CROSSWALK_RELEASE_SHA')
          PY
      - name: Strict independent two-player and complete set tape CDB witness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research/fix4_strict_cdb_crosswalk.py \
            --stage work/fix4/source/stage.zip --bridge work/fix4/source/bridge.zip \
            --crosswalk work/fix4/identity/player-identity-crosswalk.jsonl \
            --cdb work/fix4/history --out work/fix4/report
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('work/fix4/report/report.json')
          r=json.loads(p.read_text())
          assert r['cdb_writes']==0 and r['provider_api_calls']==0 and r['write_authorized'] is False
          assert r['verified_unique_match_links']<=r['counts']['source_scores_valid']<=15790
          print('FIX4_FULL_PROOF_READ_ONLY_COUNT',r['verified_unique_match_links'])
          PY
      - name: Independently verify current CDB and release did not drift
        shell: bash
        run: |
          set -euo pipefail
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -D work/fix4/check \
            -p history-2015.parquet -p history-2016.parquet -p history-2017.parquet -p history-2019.parquet \
            -p history_manifest.json -p _tbt_bundle_manifest.json
          for f in history-2015.parquet history-2016.parquet history-2017.parquet history-2019.parquet history_manifest.json _tbt_bundle_manifest.json; do
            cmp "work/fix4/history/$f" "work/fix4/check/$f" || { echo 'CDB_CHANGED_DURING_FIX4_LINKAGE'; exit 1; }
          done
      - name: Preserve strictly matched source links in private release with SHA readback
        shell: bash
        run: |
          set -euo pipefail
          (cd work/fix4/report && sha256sum report.json private_verified_links.jsonl.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
          tag="blinq-fix4-independent-cdb-links-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" -R "$PRIVATE_REPO" --target main \
            --title 'BlinQ FIX4 strict independently verified source-to-CDB event links' \
            --notes 'Private immutable research identity evidence; no source/CDB writer or model activation. Link by independently verified ATP player IDs, exact tournament window/round/winner/full set tape.' \
            --latest=false work/fix4/report/report.json work/fix4/report/private_verified_links.jsonl.gz work/fix4/report/SHA256SUMS
          mkdir -p work/fix4/readback
          gh release download "$tag" -R "$PRIVATE_REPO" -D work/fix4/readback
          (cd work/fix4/readback && sha256sum -c SHA256SUMS)
          cmp work/fix4/report/report.json work/fix4/readback/report.json
          echo "FIX4_STRICT_PRIVATE_RELEASE=$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate-only report (no private event-level rows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix4-independent-cdb-aggregate-${{ github.run_id }}
          path: work/fix4/report/report.json
          retention-days: 30
          if-no-files-found: warn