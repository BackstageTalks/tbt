name: Refresh TBT predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: tbt-prediction-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: api
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || github.repository }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN || github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install prediction dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt

      - name: Download current champion from GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p api/artifacts
          gh release download tbt-models \
            --repo "$TBT_DATA_REPOSITORY" \
            --pattern 'champion-model.joblib' \
            --dir api/artifacts \
            --clobber
          mv -f api/artifacts/champion-model.joblib api/artifacts/model.joblib
          test -s api/artifacts/model.joblib
          ls -lh api/artifacts/model.joblib

      - name: Refresh upcoming champion predictions
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: tennisapi1.p.rapidapi.com
          RAPIDAPI_BASE_URL: https://tennisapi1.p.rapidapi.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/refresh_predictions.py

      - name: Reconcile recent results
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: tennisapi1.p.rapidapi.com
          RAPIDAPI_BASE_URL: https://tennisapi1.p.rapidapi.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/settle_results.py
