name: Refresh TBT predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: tbt-prediction-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: api
      TBT_HOT_RETENTION_DAYS: "60"
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_MODEL_PRODUCTION_RELEASE_TAG: tbt-model-production-v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight private model repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TBT_DATA_REPOSITORY" || exit 1
          test -n "$TBT_DATA_GH_TOKEN" || exit 1
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing non-private data repo"; exit 1; }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install prediction dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          python -m compileall -q api scripts

      - name: Download V3 production champion from private GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p api/artifacts
          rm -f api/artifacts/model.joblib
          gh release download "$TBT_MODEL_PRODUCTION_RELEASE_TAG" \
            --repo "$TBT_DATA_REPOSITORY" \
            --pattern 'model.joblib' \
            --dir api/artifacts \
            --clobber
          test -s api/artifacts/model.joblib

      - name: Verify production artifact and replay checkpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/verify_champion_artifact.py --file api/artifacts/model.joblib --require-state

      - name: Refresh upcoming predictions without full Supabase history read
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: tennisapi1.p.rapidapi.com
          RAPIDAPI_BASE_URL: https://tennisapi1.p.rapidapi.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/refresh_predictions.py

      - name: Reconcile recent results
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: tennisapi1.p.rapidapi.com
          RAPIDAPI_BASE_URL: https://tennisapi1.p.rapidapi.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/settle_results.py
