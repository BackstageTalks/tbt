name: BlinQ ATP Futures exact current-CDB read-only field delta
on:
  pull_request:
    paths:
      - scripts/audit_atp_futures_current_cdb.py
      - tests/test_atp_futures_current_cdb.py
      - .github/workflows/blinq-atp-futures-current-cdb-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/audit_atp_futures_current_cdb.py
      - tests/test_atp_futures_current_cdb.py
      - .github/workflows/blinq-atp-futures-current-cdb-audit.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: atp-futures-current-cdb-delta-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read-only-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Verify strict nonwriting linker and fresh-data contract
        run: |
          set -euo pipefail
          python -m pip install -q -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_atp_futures_source_sha.py tests/test_atp_futures_current_cdb.py
          python -m compileall -q scripts/audit_atp_futures_current_cdb.py
      - name: Privately reconstruct SHA-pinned source and entire manifest-verified CDB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/BackstageTalks/tbt-data --jq .private)" = true
          python scripts/audit_atp_futures_current_cdb.py --out-dir .cache/tbt/atp-futures-cdb-delta
          jq -e '.source_to_current_cdb_write_authorized==false and .production_cdb_mutated==false and .provider_requests==0' .cache/tbt/atp-futures-cdb-delta/source-cdb-delta-report.json
      - name: Publish only aggregates, no private source or player rows
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: atp-futures-current-cdb-summary-${{ github.run_id }}
          path: .cache/tbt/atp-futures-cdb-delta/source-cdb-delta-report.json
          retention-days: 30
          if-no-files-found: warn
