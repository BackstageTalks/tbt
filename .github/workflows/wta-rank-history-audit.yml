name: BlinQ WTA rank history audit

on:
  pull_request:
    paths:
      - "api/tbt/data/wta_rank_history.py"
      - "api/tbt/models/feature_builder.py"
      - "api/tbt/services/training.py"
      - "scripts/build_production_training_table.py"
      - "scripts/audit_wta_sackmann_rank_history.py"
      - "tests/test_wta_rank_history.py"
      - ".github/workflows/wta-rank-history-audit.yml"

permissions:
  contents: read

concurrency:
  group: wta-rank-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      SACKMANN_COMMIT: 83733587353df8a41f2fd4f516147d5aa83f5a8d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install and test
        run: |
          python -m pip install -r api/requirements-train.txt pytest
          python -m pytest tests/test_wta_rank_history.py -q

      - name: Download stable canonical history
        run: |
          python - <<'PY'
          import os, shutil, time
          from pathlib import Path
          from release_store import ReleaseStore
          directory=Path(".cache/tbt/wta-rank/history")
          for attempt in range(1,5):
              shutil.rmtree(directory,ignore_errors=True)
              directory.mkdir(parents=True,exist_ok=True)
              try:
                  ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",directory).download(require_bundle_manifest=True)
                  print("verified canonical snapshot",attempt)
                  break
              except RuntimeError:
                  if attempt==4: raise
                  time.sleep(10)
          PY

      - name: Download pinned Sackmann WTA rankings
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/wta-rank/source
          base="https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/$SACKMANN_COMMIT/wta"
          curl --fail --location --retry 3 "$base/wta_players.csv" -o .cache/tbt/wta-rank/source/wta_players.csv
          for file in wta_rankings_80s.csv wta_rankings_90s.csv wta_rankings_00s.csv wta_rankings_10s.csv wta_rankings_20s.csv wta_rankings_current.csv; do
            curl --fail --location --retry 3 "$base/$file" -o ".cache/tbt/wta-rank/source/$file"
          done

      - name: Audit WTA rank-history coverage
        run: |
          args=()
          for file in .cache/tbt/wta-rank/source/wta_rankings_*.csv; do
            args+=(--ranking-csv "$file")
          done
          python scripts/audit_wta_sackmann_rank_history.py \
            --history-dir .cache/tbt/wta-rank/history \
            --players-csv .cache/tbt/wta-rank/source/wta_players.csv \
            "${args[@]}" \
            --out .cache/tbt/wta-rank/report.json

      - name: Validate audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(".cache/tbt/wta-rank/report.json").read_text())
          print(json.dumps(report,indent=2))
          assert report["production_mutated"] is False
          assert report["rapidapi_requests"] == 0
          assert int((report.get("counts") or {}).get("linked_both") or 0) > 1000
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: blinq-wta-rank-history-${{ github.run_id }}
          path: .cache/tbt/wta-rank/report.json
          retention-days: 14
