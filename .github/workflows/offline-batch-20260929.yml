name: BlinQ offline batch 2026-09-29

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run or write verified offline enrichment"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, write]
  pull_request:
    paths:
      - ".github/offline-batch-20260929-request.json"
      - ".github/workflows/offline-batch-20260929.yml"
      - "api/tbt/data/offline_market_history.py"
      - "scripts/link_atpworldtour_stats.py"
      - "scripts/link_valuebetennis_market_history.py"
      - "scripts/import_offline_market_history.py"
      - "tests/test_atpworldtour_stats_linker.py"
      - "tests/test_offline_market_history_v2.py"
  push:
    branches: [main]
    paths:
      - ".github/offline-batch-20260929-request.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tbt-offline-batch-dry-run-{0}', github.ref) || 'tbt-history-data-writer' }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve controlled request
        id: request
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          request=".github/offline-batch-20260929-request.json"
          test -s "$request"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${DISPATCH_MODE:-dry-run}"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            mode="dry-run"
          else
            mode="$(jq -r '.mode // "dry-run"' "$request")"
          fi
          case "$mode" in dry-run|write) ;; *) echo "Invalid mode: $mode"; exit 1;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "BATCH_MODE=$mode" >> "$GITHUB_ENV"
          echo "ATP_REPO=$(jq -r '.atp_repository' "$request")" >> "$GITHUB_ENV"
          echo "ATP_SHA=$(jq -r '.atp_commit' "$request")" >> "$GITHUB_ENV"
          echo "VALUEBET_INDEX=$(jq -r '.valuebetennis_index' "$request")" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install and test
        run: |
          set -euo pipefail
          python -m pip install --retries 8 --timeout 60 -r api/requirements.txt
          python -m pip install --retries 8 --timeout 60 -r api/requirements-train.txt pytest
          python -m compileall -q             api/tbt/data/offline_market_history.py             scripts/link_atpworldtour_stats.py             scripts/link_valuebetennis_market_history.py             scripts/import_offline_market_history.py
          python -m pytest             tests/test_atpworldtour_stats_linker.py             tests/test_offline_market_history_v2.py             tests/test_offline_linked_serve_return_importer.py -q

      - name: Verify private history destination
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"

      - name: Download pinned ATP World Tour source
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/$ATP_REPO/$ATP_SHA"
          root=".cache/tbt/offline-batch/atp"
          mkdir -p "$root/tournaments" "$root/scores" "$root/stats"
          curl --fail --location --retry 5 "$base/csv/1_tournaments/tournaments_2010-2019.csv" -o "$root/tournaments/tournaments_2010-2019.csv"
          curl --fail --location --retry 5 "$base/csv/1_tournaments/tournaments_2020-2022.csv" -o "$root/tournaments/tournaments_2020-2022.csv"
          curl --fail --location --retry 5 "$base/csv/2_match_scores/match_scores_2010-2019.csv" -o "$root/scores/match_scores_2010-2019.csv"
          curl --fail --location --retry 5 "$base/csv/2_match_scores/match_scores_2020-2022.csv" -o "$root/scores/match_scores_2020-2022.csv"
          for year in 2019 2020 2021 2022; do
            curl --fail --location --retry 5               "$base/csv/3_match_stats/match_stats_$year.csv"               -o "$root/stats/match_stats_$year.csv"
          done

          check_blob() {
            local path="$1" expected="$2" actual
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "Pinned ATP source mismatch: $path expected=$expected actual=$actual"
              exit 1
            }
          }
          check_blob "$root/tournaments/tournaments_2010-2019.csv" "932dc7042aaaa6d6b87cad8f8c7c57d07bac3ef6"
          check_blob "$root/tournaments/tournaments_2020-2022.csv" "7b07e3a4bc91bff81aae453b9bee9689dc6eae58"
          check_blob "$root/scores/match_scores_2010-2019.csv" "4c1e7f3849504aeff8e1f09ffd9740bb3ee6622e"
          check_blob "$root/scores/match_scores_2020-2022.csv" "706a9ca96bc19f956c28a980763db54a9fc39a6d"
          check_blob "$root/stats/match_stats_2019.csv" "4e5c912b1300cb6d9a65948443fda551a5c6640c"
          check_blob "$root/stats/match_stats_2020.csv" "658b2b1178797ac07c541ec8a1e141f96e930e3a"
          check_blob "$root/stats/match_stats_2021.csv" "dfac9370d8f941c8405a635df50f204f3f609182"
          check_blob "$root/stats/match_stats_2022.csv" "54596d6967972b69095c4ba555abd8a745a6eafb"

      - name: Download current Valuebetennis CC BY 4.0 snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/offline-batch/valuebet
          python - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          request = json.loads(Path(".github/offline-batch-20260929-request.json").read_text())
          index = request["valuebetennis_index"]
          years = [int(y) for y in request["valuebetennis_years"]]
          req = urllib.request.Request(index, headers={"User-Agent": "BlinQ-offline-audit/1.0"})
          html = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
          hrefs = re.findall(
              r'''href=["']([^"']*valuebetennis-matchs-(20\d{2})\.csv[^"']*)["']''',
              html,
              flags=re.I,
          )
          found = {}
          for href, year in hrefs:
              found[int(year)] = urllib.parse.urljoin(index, href)
          missing = [year for year in years if year not in found]
          if missing:
              raise SystemExit(f"Valuebetennis download links not found for years: {missing}")

          out = Path(".cache/tbt/offline-batch/valuebet")
          for year in years:
              target = out / f"valuebetennis-matchs-{year}.csv"
              req = urllib.request.Request(found[year], headers={"User-Agent": "BlinQ-offline-audit/1.0"})
              data = urllib.request.urlopen(req, timeout=120).read()
              if len(data) < 10000:
                  raise SystemExit(f"Unexpectedly small Valuebetennis file for {year}: {len(data)}")
              target.write_bytes(data)
              print(year, len(data), found[year])
          PY

      - name: Audit Valuebetennis source shape
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          rows = complete = 0
          files = []
          required = {
              "match_id", "date", "tournoi", "genre", "surface", "tour",
              "joueur1", "joueur1_id", "joueur2", "joueur2_id",
              "cote1_ouverture", "cote2_ouverture",
              "cote1_cloture", "cote2_cloture", "vainqueur_id",
          }
          for path in sorted(Path(".cache/tbt/offline-batch/valuebet").glob("*.csv")):
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              with path.open(encoding="utf-8-sig", newline="") as handle:
                  reader = csv.DictReader(handle, delimiter=";")
                  if not required <= set(reader.fieldnames or []):
                      raise SystemExit(f"Missing Valuebetennis columns in {path.name}")
                  n = c = 0
                  for row in reader:
                      n += 1
                      if all(row.get(k) for k in (
                          "cote1_ouverture", "cote2_ouverture",
                          "cote1_cloture", "cote2_cloture",
                      )):
                          c += 1
              rows += n
              complete += c
              files.append({"file": path.name, "rows": n, "complete_open_close": c, "sha256": sha})
          if rows < 400000:
              raise SystemExit(f"Unexpectedly small Valuebetennis corpus: {rows}")
          if complete < 150000:
              raise SystemExit(f"Unexpectedly small opening+closing coverage: {complete}")
          report = {
              "schema": 1,
              "rows": rows,
              "complete_open_close": complete,
              "files": files,
              "license": "CC BY 4.0",
              "source": "https://www.valuebetennis.com/en/donnees.htm",
          }
          Path(".cache/tbt/offline-batch/valuebet-source-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Download checksum-verified private history
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore
          directory = Path(".cache/tbt/offline-batch/history")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", directory).download(
              require_bundle_manifest=True
          )
          PY

      - name: Link ATP 2019-2022 serve-return stats
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/offline-batch/atp-link
          python scripts/link_atpworldtour_stats.py             --history-dir .cache/tbt/offline-batch/history             --tournaments-csv .cache/tbt/offline-batch/atp/tournaments/tournaments_2010-2019.csv             --tournaments-csv .cache/tbt/offline-batch/atp/tournaments/tournaments_2020-2022.csv             --scores-csv .cache/tbt/offline-batch/atp/scores/match_scores_2010-2019.csv             --scores-csv .cache/tbt/offline-batch/atp/scores/match_scores_2020-2022.csv             --stats-csv .cache/tbt/offline-batch/atp/stats/match_stats_2019.csv             --stats-csv .cache/tbt/offline-batch/atp/stats/match_stats_2020.csv             --stats-csv .cache/tbt/offline-batch/atp/stats/match_stats_2021.csv             --stats-csv .cache/tbt/offline-batch/atp/stats/match_stats_2022.csv             --out-dir .cache/tbt/offline-batch/atp-link
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path(".cache/tbt/offline-batch/atp-link/report.json").read_text())
          c = r.get("counts") or {}
          if int(c.get("usable_source_matches") or 0) < 13000:
              raise SystemExit(f"Unexpectedly small ATP stats source: {c.get('usable_source_matches')}")
          if int(r.get("api_requests", -1)) != 0:
              raise SystemExit("ATP offline linker used provider API")
          if int(c.get("staged_matches") or 0) <= 0 and int(c.get("already_present") or 0) <= 0:
              raise SystemExit("ATP linker produced no safe enrichment")
          print(json.dumps(r, indent=2))
          PY

      - name: Dry-run ATP strict importer
        run: |
          set -euo pipefail
          python scripts/import_offline_linked_serve_return.py             --stage .cache/tbt/offline-batch/atp-link/auto_linked.jsonl             --history-dir .cache/tbt/offline-batch/history             --out-dir .cache/tbt/offline-batch/atp-dry-run
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path(".cache/tbt/offline-batch/atp-dry-run/report.json").read_text())
          c = r.get("counts") or {}
          for key in ("identity_missing", "identity_changed", "invalid_stats", "stat_conflicts"):
              if int(c.get(key) or 0):
                  raise SystemExit(f"ATP strict importer rejected rows: {key}={c.get(key)}")
          PY

      - name: Link Valuebetennis opening/closing history
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/offline-batch/market-link
          args=()
          for f in .cache/tbt/offline-batch/valuebet/valuebetennis-matchs-*.csv; do
            args+=(--source-csv "$f")
          done
          python scripts/link_valuebetennis_market_history.py             --history-dir .cache/tbt/offline-batch/history             "${args[@]}"             --source-label valuebetennis_cc_by_4             --out-dir .cache/tbt/offline-batch/market-link
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path(".cache/tbt/offline-batch/market-link/report.json").read_text())
          c = r.get("counts") or {}
          if int(r.get("api_requests", -1)) != 0:
              raise SystemExit("Market linker used provider API")
          if int(c.get("staged_matches") or 0) <= 0 and int(c.get("already_present") or 0) <= 0:
              raise SystemExit("Market linker produced no safe links")
          if r.get("model_feature_policy") != "closing_validation_only":
              raise SystemExit("Closing-odds leakage guard missing")
          print(json.dumps(r, indent=2))
          PY

      - name: Dry-run market strict importer
        run: |
          set -euo pipefail
          python scripts/import_offline_market_history.py             --stage .cache/tbt/offline-batch/market-link/auto_linked.jsonl             --history-dir .cache/tbt/offline-batch/history             --out-dir .cache/tbt/offline-batch/market-dry-run
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path(".cache/tbt/offline-batch/market-dry-run/report.json").read_text())
          c = r.get("counts") or {}
          for key in ("identity_missing", "identity_changed", "invalid_market_history", "market_conflicts"):
              if int(c.get(key) or 0):
                  raise SystemExit(f"Market strict importer rejected rows: {key}={c.get(key)}")
          PY

      - name: Apply verified ATP stats locally
        if: ${{ steps.request.outputs.mode == 'write' }}
        run: |
          set -euo pipefail
          python scripts/import_offline_linked_serve_return.py             --stage .cache/tbt/offline-batch/atp-link/auto_linked.jsonl             --history-dir .cache/tbt/offline-batch/history             --out-dir .cache/tbt/offline-batch/atp-write             --write-partitions             --write-history-dir .cache/tbt/offline-batch/history

      - name: Apply verified market history locally
        if: ${{ steps.request.outputs.mode == 'write' }}
        run: |
          set -euo pipefail
          python scripts/import_offline_market_history.py             --stage .cache/tbt/offline-batch/market-link/auto_linked.jsonl             --history-dir .cache/tbt/offline-batch/history             --out-dir .cache/tbt/offline-batch/market-write             --write-partitions             --write-history-dir .cache/tbt/offline-batch/history

      - name: Validate and publish combined private history
        if: ${{ steps.request.outputs.mode == 'write' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from release_store import ReleaseStore
          from tbt.data.history_safety import sanitize_history_identities
          from tbt.data.history_snapshot import load_partitions

          root = Path(".cache/tbt/offline-batch")
          history = root / "history"
          years = set()
          for report_path in (root / "atp-write/report.json", root / "market-write/report.json"):
              if report_path.is_file():
                  report = json.loads(report_path.read_text())
                  years.update(int(y) for y in report.get("changed_years") or [])
          if not years:
              print("No changed partitions; nothing to publish.")
              raise SystemExit(0)

          matches, safety = sanitize_history_identities(load_partitions(history))
          if safety.get("quarantined_rows"):
              raise SystemExit("Combined offline batch failed identity safety")
          paths = [history / f"history-{year:04d}.parquet" for year in sorted(years)]
          paths.append(history / "history_manifest.json")
          if any(not path.is_file() or path.stat().st_size <= 0 for path in paths):
              raise SystemExit("Combined history bundle is incomplete")

          store = ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", history)
          store.upload_bundle(paths)
          print(f"Published combined offline batch for years: {sorted(years)}")
          PY

      - name: Verify committed private release
        if: ${{ steps.request.outputs.mode == 'write' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore
          from tbt.data.history_safety import sanitize_history_identities
          from tbt.data.history_snapshot import load_partitions
          directory = Path(".cache/tbt/offline-batch/verify")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", directory).download(
              require_bundle_manifest=True
          )
          matches, safety = sanitize_history_identities(load_partitions(directory))
          if safety.get("quarantined_rows"):
              raise SystemExit("Committed history identity verification failed")
          print(f"Verified private history: {len(matches)} rows")
          PY

      - name: Persist batch audit in private data repo
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def read(path):
              p = Path(path)
              if not p.is_file():
                  return None
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  return {"read_error": str(exc)}

          audit = {
              "schema": 1,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "job_status": os.environ.get("JOB_STATUS"),
              "mode": os.environ.get("BATCH_MODE"),
              "run_id": os.environ.get("RUN_ID"),
              "run_sha": os.environ.get("RUN_SHA"),
              "api_requests": 0,
              "atp_source": {
                  "repository": os.environ.get("ATP_REPO"),
                  "commit": os.environ.get("ATP_SHA"),
              },
              "valuebet_source": read(".cache/tbt/offline-batch/valuebet-source-audit.json"),
              "atp_link": read(".cache/tbt/offline-batch/atp-link/report.json"),
              "atp_dry_run": read(".cache/tbt/offline-batch/atp-dry-run/report.json"),
              "atp_write": read(".cache/tbt/offline-batch/atp-write/report.json"),
              "market_link": read(".cache/tbt/offline-batch/market-link/report.json"),
              "market_dry_run": read(".cache/tbt/offline-batch/market-dry-run/report.json"),
              "market_write": read(".cache/tbt/offline-batch/market-write/report.json"),
              "leakage_guard": "closing_validation_only",
          }
          Path("/tmp/offline-batch-audit.json").write_text(
              json.dumps(audit, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
          path="audit/offline-batch-20260929-latest.json"
          existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/offline-batch-audit.json)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit offline batch run $RUN_ID"               -f content="$encoded"               -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit offline batch run $RUN_ID"               -f content="$encoded" >/dev/null
          fi

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-offline-batch-${{ github.run_id }}
          path: |
            .cache/tbt/offline-batch/valuebet-source-audit.json
            .cache/tbt/offline-batch/atp-link/report.json
            .cache/tbt/offline-batch/atp-link/review.jsonl
            .cache/tbt/offline-batch/atp-link/quarantine.jsonl
            .cache/tbt/offline-batch/atp-dry-run/report.json
            .cache/tbt/offline-batch/market-link/report.json
            .cache/tbt/offline-batch/market-link/review.jsonl
            .cache/tbt/offline-batch/market-link/quarantine.jsonl
            .cache/tbt/offline-batch/market-dry-run/report.json
            .cache/tbt/offline-batch/atp-write/report.json
            .cache/tbt/offline-batch/market-write/report.json
          if-no-files-found: warn
          retention-days: 14
