name: Audit Kashavkin ATP WTA corpus
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_kashavkin_dataset.py"
      - ".github/workflows/audit-kashavkin-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install
        run: python -m pip install -r api/requirements-train.txt
      - name: Download canonical history
        run: python scripts/download_production_preflight_inputs.py
      - name: Download and verify public source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/kashavkin/source
          curl -fL --retry 3 --retry-delay 2             https://www.kaggle.com/api/v1/datasets/download/hwaitt/tennis-20112019             -o .cache/tbt/kashavkin/source.zip
          unzip -q .cache/tbt/kashavkin/source.zip -d .cache/tbt/kashavkin/source
          echo "c2d0b8545443dee0e143f293a3c80f54bd9b3c87e5eae0b49739f51c1d62b507  .cache/tbt/kashavkin/source/atp.csv" | sha256sum -c -
          echo "1467b2efd02288502f518662fe3ad3e1c9121e7e59a0e65f690f6ec779591548  .cache/tbt/kashavkin/source/wta.csv" | sha256sum -c -
      - name: Audit against canonical DB
        run: |
          python scripts/audit_kashavkin_dataset.py             --history-dir .cache/tbt/history             --atp-csv .cache/tbt/kashavkin/source/atp.csv             --wta-csv .cache/tbt/kashavkin/source/wta.csv             --out .cache/tbt/kashavkin/audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: kashavkin-canonical-audit
          path: .cache/tbt/kashavkin/audit.json
          if-no-files-found: error
