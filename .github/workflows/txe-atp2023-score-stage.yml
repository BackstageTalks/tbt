name: BlinQ ATP 2023 score and game fields exact CDB delta
on:
  pull_request:
    paths:
      - "scripts/stage_txe_wta2024_scores.py"
      - "tests/test_txe_generic_score_semantics.py"
      - ".github/workflows/txe-atp2023-score-stage.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/txe-atp2023-score-stage.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: blinq-atp2023-stage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      PYTHONPATH: api:scripts
      BLINQ_SCORE_TOUR: atp
      BLINQ_SCORE_YEAR: "2023"
      BLINQ_SCORE_SOURCE_SHA: 90185eec963889ac144f3179cf937063cad45873a1bbfe8af95a39bb53db93d7
      ARCHIVE: txe-atp-single-2023.tar.gz
      ROOT: .cache/tbt/txe-atp2023-stage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run strict ATP score and provenance regressions
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements.txt -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_txe_generic_score_semantics.py tests/test_txe_wta2024_scores_exact.py
          python -m compileall -q scripts/stage_txe_wta2024_scores.py scripts/import_txe_wta2024_scores_exact.py
      - name: Retrieve SHA-pinned 2023 ATP original archive and canonical year
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$PRIVATE_REPO" --json visibility -q .visibility)" = PRIVATE
          mkdir -p "$ROOT/source" "$ROOT/history" "$ROOT/stage" "$ROOT/local" "$ROOT/dry" "$ROOT/write" "$ROOT/verify"
          gh release download blinq-tennisexplorer-cloud-20261009 -R "$PRIVATE_REPO" -p "$ARCHIVE" -D "$ROOT/source"
          echo "$BLINQ_SCORE_SOURCE_SHA  $ROOT/source/$ARCHIVE" | sha256sum -c -
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -p history-2023.parquet -p history_manifest.json -p _tbt_bundle_manifest.json -D "$ROOT/history"
          gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" > "$ROOT/history/release.json"
      - name: Match original player slugs and check actual missing score/game fields
        run: |
          set -euo pipefail
          python scripts/stage_txe_wta2024_scores.py \
            --source "$ROOT/source/$ARCHIVE" --history "$ROOT/history/history-2023.parquet" \
            --manifest "$ROOT/history/history_manifest.json" --release "$ROOT/history/release.json" \
            --out "$ROOT/stage"
          test "$(jq -r .production_mutated "$ROOT/stage/report.json")" = false
          test "$(jq -r .model_trained "$ROOT/stage/report.json")" = false
          test "$(jq -r .counts.source_rows "$ROOT/stage/report.json")" -gt 0
      - name: Enforce null-only isolated 2023 year replay and full readback
        run: |
          set -euo pipefail
          for f in history-2023.parquet history_manifest.json _tbt_bundle_manifest.json; do cp "$ROOT/history/$f" "$ROOT/local/$f"; done
          python scripts/import_txe_wta2024_scores_exact.py --mode dry-run \
            --before-dir "$ROOT/history" --after-dir "$ROOT/local" \
            --stage-file "$ROOT/stage/stage.jsonl" --stage-report "$ROOT/stage/report.json" --out "$ROOT/dry/report.json"
          delta="$(jq -r .added_values "$ROOT/dry/report.json")"
          if [[ "$delta" -gt 0 ]]; then
            python scripts/import_txe_wta2024_scores_exact.py --mode write \
              --before-dir "$ROOT/history" --after-dir "$ROOT/local" \
              --stage-file "$ROOT/stage/stage.jsonl" --stage-report "$ROOT/stage/report.json" --out "$ROOT/write/report.json"
            python scripts/import_txe_wta2024_scores_exact.py --mode verify \
              --before-dir "$ROOT/history" --after-dir "$ROOT/local" \
              --stage-file "$ROOT/stage/stage.jsonl" --stage-report "$ROOT/stage/report.json" --out "$ROOT/verify/report.json"
            test "$(jq -r .existing_values_overwritten "$ROOT/verify/report.json")" = 0
            test "$(jq -r .added_values "$ROOT/verify/report.json")" = "$delta"
          fi
          echo "ATP_2023_SAFE_MISSING_SCORE_VALUES=$delta"
      - name: Preserve aggregate result and local full-year validation only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-txe-atp2023-stage-${{ github.run_id }}
          path: |
            .cache/tbt/txe-atp2023-stage/stage/report.json
            .cache/tbt/txe-atp2023-stage/dry/report.json
            .cache/tbt/txe-atp2023-stage/write/report.json
            .cache/tbt/txe-atp2023-stage/verify/report.json
          retention-days: 35
          if-no-files-found: warn
