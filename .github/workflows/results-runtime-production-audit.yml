name: Temporary Results runtime production audit

on:
  push:
    branches:
      - fix/results-runtime-production-20261002

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download exact private prediction release
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          mkdir -p /tmp/blinq-predictions
          gh release download tbt-predictions-v1 --repo "$TBT_DATA_REPOSITORY" \
            --pattern feed.json --pattern ledger.json --dir /tmp/blinq-predictions

      - name: Capture live public config and current match snapshot
        env:
          BLINQ_BASE_URL: ${{ vars.TBT_PRODUCTION_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="${BLINQ_BASE_URL%/}"
          curl -fsSL -H 'Cache-Control: no-cache' "$base/api/v1/ui-config?results_runtime_audit=$GITHUB_SHA" -o /tmp/live-ui.json
          curl -fsSL -H 'Cache-Control: no-cache' "$base/api/health?results_runtime_audit=$GITHUB_SHA" -o /tmp/live-health.json
          curl -fsSL -H 'Cache-Control: no-cache' "$base/deployment.json?results_runtime_audit=$GITHUB_SHA" -o /tmp/live-deployment.json
          test -n "$BLINQ_LIVE_WORKER_TOKEN"
          curl -fsSL --max-time 120 -X POST \
            -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN" \
            "$base/api/v1/internal/match-status-worker" -o /tmp/match-status.json

      - name: Audit runtime Results path using production data
        env:
          PYTHONPATH: api
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          from tbt.services.feed import visible_feed
          from tbt.services.entitlements import filter_feed_for_access
          from tbt.services.match_status import event_ids_from_feed, runtime_settled_results

          feed=json.load(open('/tmp/blinq-predictions/feed.json',encoding='utf-8'))
          ledger=json.load(open('/tmp/blinq-predictions/ledger.json',encoding='utf-8'))
          ui_doc=json.load(open('/tmp/live-ui.json',encoding='utf-8'))
          ui=ui_doc.get('config') or {}
          health=json.load(open('/tmp/live-health.json',encoding='utf-8'))
          deployment=json.load(open('/tmp/live-deployment.json',encoding='utf-8'))
          snapshot=json.load(open('/tmp/match-status.json',encoding='utf-8'))
          statuses=snapshot.get('statuses') or {}

          print('LIVE', json.dumps({
              'health_release': health.get('release'),
              'api_version': health.get('version'),
              'deployment_sha': deployment.get('git_sha'),
              'deployment_patch': deployment.get('patch'),
              'ui_runtime_configured': ui_doc.get('runtime_configured'),
              'ui_storage_available': ui_doc.get('storage_available'),
              'results_access': ((ui.get('elements') or {}).get('SIDEBAR_RESULTS') or {}).get('access'),
              'results_windows': (ui.get('dashboard') or {}).get('results_history_window'),
          }, sort_keys=True))
          print('SNAPSHOT', json.dumps({
              k:snapshot.get(k) for k in (
                  'updated_at','tracked','terminal','pending_count','due','checked',
                  'newly_resolved','provider_requests','budget_paused','degraded'
              )
          }, sort_keys=True))

          sources=('top200_picks','top_daily_picks','prime_picks','value_picks','doubles_picks','ace_picks','sg_picks')
          section={}
          for key in sources:
              rows=feed.get(key) if isinstance(feed.get(key),list) else []
              with_pubs=sum(bool(r.get('market_publications')) for r in rows if isinstance(r,dict))
              issued=sum(
                  1 for r in rows if isinstance(r,dict)
                  for p in (r.get('market_publications') or [])
                  if isinstance(p,dict) and p.get('issued_at') and not p.get('excluded_reason')
              )
              section[key]={'rows':len(rows),'rows_with_market_publications':with_pubs,'issued_publications':issued}
          print('RELEASE_SECTIONS', json.dumps(section, sort_keys=True))
          print('RAW_RESULTS', json.dumps({
              'rows':len(feed.get('results') or []),
              'rows_with_market_publications':sum(bool(r.get('market_publications')) for r in (feed.get('results') or []) if isinstance(r,dict)),
          }, sort_keys=True))

          ledger_pubs=sum(
              len(r.get('market_publications') or [])
              for r in ledger if isinstance(r,dict) and isinstance(r.get('market_publications'),list)
          )
          ledger_issued=sum(
              1 for r in ledger if isinstance(r,dict)
              for p in (r.get('market_publications') or [])
              if isinstance(p,dict) and p.get('issued_at') and str(p.get('publication_status') or '').lower()=='published'
          )
          print('LEDGER', json.dumps({'rows':len(ledger),'publications':ledger_pubs,'issued_publications':ledger_issued}, sort_keys=True))

          now=datetime.now(timezone.utc)
          visible=visible_feed(feed,now=now)
          for plan in ('admin','goat','legend','elite','pro','rookie'):
              access={'id':'runtime-audit','status':'active','plan':plan}
              if plan=='admin':
                  access.update({'is_admin':True,'role':'admin'})
              data, ent=filter_feed_for_access(visible,access,ui)
              allowed=event_ids_from_feed(data)
              selected={str(k):v for k,v in statuses.items() if str(k) in allowed and isinstance(v,dict)}
              before=len(data.get('results') or [])
              after=runtime_settled_results(data,selected) if ent.get('results') else list(data.get('results') or [])
              runtime=[r for r in after if isinstance(r,dict) and r.get('runtime_result_overlay')]
              settled_pubs=sum(
                  1 for r in runtime
                  for p in (r.get('market_publications') or [])
                  if isinstance(p,dict) and isinstance(p.get('result'),dict)
                  and p['result'].get('status') in {'hit','miss','retired','void'}
              )
              print('PLAN', json.dumps({
                  'plan':plan,
                  'results_entitlement':ent.get('results'),
                  'results_history_hours':ent.get('results_history_hours'),
                  'daily_pick_count':ent.get('daily_pick_count'),
                  'allowed_match_winner_events':len(allowed),
                  'matched_terminal_statuses':len(selected),
                  'results_before_runtime':before,
                  'results_after_runtime':len(after),
                  'runtime_rows':len(runtime),
                  'runtime_settled_publications':settled_pubs,
              }, sort_keys=True))
          PY
