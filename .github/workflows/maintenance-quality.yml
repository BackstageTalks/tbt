name: Maintenance quality and pinned dependencies
on:
  pull_request:
    paths:
      - api/requirements.txt
      - api/requirements-train.txt
      - api/requirements-runtime.lock
      - api/requirements-train.lock
      - scripts/web_deploy_contract.py
      - scripts/optimize_web_assets.py
      - scripts/stamp_web_deployment.py
      - tests/test_web_deploy_contract.py
      - tests/test_dependency_locks.py
      - tools/requirements-quality.lock
      - .github/workflows/maintenance-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned quality tools
        run: python -m pip install -r tools/requirements-quality.lock -c api/requirements-train.lock
      - name: Scoped Ruff lint for extracted deploy modules
        run: |
          ruff check --select E4,E7,E9,F63,F7,F82 \
            scripts/web_deploy_contract.py \
            scripts/optimize_web_assets.py \
            scripts/stamp_web_deployment.py \
            tests/test_web_deploy_contract.py \
            tests/test_dependency_locks.py
      - name: Isolated lock and deployment contract regressions
        env:
          PYTHONPATH: api:scripts
        run: python -m pytest -q tests/test_web_deploy_contract.py tests/test_dependency_locks.py
