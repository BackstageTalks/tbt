name: Autonomous LIVE comeback radar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-live-radar-worker
  cancel-in-progress: true

jobs:
  live-radar:
    if: github.event_name == 'workflow_dispatch' || vars.TBT_LIVE_RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan LIVE tennis roughly every 50 seconds
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLINQ_LIVE_WORKER_TOKEN" || { echo 'Missing BLINQ_LIVE_WORKER_TOKEN GitHub secret'; exit 1; }
          base="${BLINQ_BASE_URL%/}"
          for scan in 1 2 3 4 5 6; do
            echo "LIVE radar scan $scan/6"
            curl --fail-with-body --silent --show-error \
              --retry 2 --retry-delay 2 --retry-all-errors --max-time 45 \
              -X POST \
              -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN" \
              "$base/api/v1/internal/live-radar-worker"
            echo
            if [[ "$scan" != "6" ]]; then sleep 50; fi
          done
