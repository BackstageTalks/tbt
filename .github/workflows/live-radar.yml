name: Autonomous LIVE comeback radar

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: blinq-live-radar-worker
  cancel-in-progress: true

jobs:
  live-radar:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan LIVE tennis roughly every 50 seconds
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLINQ_LIVE_WORKER_TOKEN" || { echo 'Missing BLINQ_LIVE_WORKER_TOKEN GitHub secret'; exit 1; }
          base="${BLINQ_BASE_URL%/}"
          for scan in 1 2 3 4 5 6; do
            echo "LIVE radar scan $scan/6"
            curl --fail-with-body --silent --show-error \
              --retry 2 --retry-delay 2 --retry-all-errors --max-time 45 \
              -X POST \
              -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN" \
              "$base/api/v1/internal/live-radar-worker"
            echo
            if [[ "$scan" != "6" ]]; then sleep 50; fi
          done
          # Independent Azure storage/ledger GET: the POST acknowledgment alone
          # does not prove the heartbeat can be read back or quota is healthy.
          curl --fail-with-body --silent --show-error --max-time 15 \
            -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN" \
            "$base/api/v1/internal/live-radar-status" \
            -o /tmp/blinq-live-status.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          row=json.loads(Path('/tmp/blinq-live-status.json').read_text())
          assert row.get('ok') is True, 'LIVE readback failed'
          heartbeat=row['heartbeat']; budget=row['budget']
          assert heartbeat.get('fresh') is True, 'LIVE heartbeat stale'
          assert not heartbeat.get('last_error'), 'LIVE worker error'
          assert 0 <= budget['global_spent'] <= 14500 == budget['global_limit']
          assert 0 <= budget['live_spent'] <= 3000 == budget['live_limit']
          assert budget['provider_plan_limit'] == 15000
          assert budget['reserved_provider_headroom'] == 500
          print(json.dumps({'readback':'PASS','heartbeat':heartbeat.get('last_success_at'),
                            'global_spent':budget['global_spent'],
                            'live_spent':budget['live_spent']},sort_keys=True))
          PY

      - name: Capture MoviOdds LIVE tennis statistics to durable DB
        # Reuse the externally driven LIVE clock, without RapidAPI calls.
        continue-on-error: true
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLINQ_LIVE_WORKER_TOKEN"
          curl --fail-with-body --silent --show-error --max-time 45 \
            -X POST -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN" \
            "${BLINQ_BASE_URL%/}/api/v1/internal/moviodds-stats-worker?mode=live" \
            -o /tmp/moviodds-live.json
          python - <<'PY'
          import json
          report=json.load(open("/tmp/moviodds-live.json"))
          if not report.get("ok") or report.get("errors"):
              raise SystemExit("MoviOdds LIVE durable collection failed")
          print("MOVIODDS_LIVE_DB", report.get("live"))
          PY

      - name: Retire expired INFO and LIVE history (six-hour server lease)
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLINQ_LIVE_WORKER_TOKEN"
          curl --fail-with-body --silent --show-error --max-time 240 \
            -X POST -H "X-Blinq-Worker-Token: $BLINQ_LIVE_WORKER_TOKEN" \
            "${BLINQ_BASE_URL%/}/api/v1/internal/history-retention-worker" \
            -o /tmp/blinq-history-cleanup.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/blinq-history-cleanup.json').read_text())
          assert result.get('ok') is True, result
          print(json.dumps({
            'history_readback':'PASS',
            'bucket':result.get('bucket'),
            'skipped':result.get('skipped',False),
            'deleted':sum(row.get('deleted',0) for row in result.get('results',{}).values()),
          }, sort_keys=True))
          PY
