name: CDB Import - operator one-shot dispatcher

# Operator entrypoint. Changes to unrelated files never trigger this workflow.
# One-shot operator request: process up to 5 safe 100-file batches, starting 2026-10-20.
# This changes no global cron; future operator dispatch remains bounded.
# Production data may only be changed by the separate guarded CDB importer.
# Operator request 2026-10-20 20:58 Europe/Bratislava: next checkpointed Drive batch, existing guarded importer only.
# Operator request 2026-10-20 19:55 Europe/Bratislava: guarded pending Drive CDB retry; no gate bypass.
# Operator request 2026-10-20: retry SHA-pinned pending Drive batch through guarded importer; no safety gate bypass.
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cdb-import-operator-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-cdb:
    if: >-
      github.repository == 'BackstageTalks/tbt' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        contains(github.event.head_commit.message, '[cdb-import-now]')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit guarded CDB Drive import on current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'BackstageTalks/tbt'
          test "$GITHUB_REF" = 'refs/heads/main'
          gh workflow run cdb-drive-inbox.yml -R "$GITHUB_REPOSITORY" --ref main -f catchup_remaining=4
          echo 'CDB_OPERATOR_DISPATCH_SUBMITTED_NOT_IMPORT_VERIFIED'
