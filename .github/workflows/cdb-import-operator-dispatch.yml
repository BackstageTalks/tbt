            # NULL-only dry-run, lock/CAS, backup and independent readback.
            # No new writer, no provider API spend, no private checkpoint reset.
            # Only a push containing [cdb-import-now] can take this path.
            gh workflow run cdb-drive-inbox.yml -R "$GITHUB_REPOSITORY" --ref main \
              -f catchup_remaining=0 \
              -f replay_drive_ids="1ku0BYVuAHBLWEe5jqw5lMDzwCMdvNe_Z,1ALec1ikv1PQdAkJOsl3fdj20xrolggF5,1GKr_lIOHXEnM2Dk8Orh_Yp2DD6jeKHb7,1M6c_r4d7ts07pGAZarcimQWTzC6LbH03,1dR_YLGN1sfoxiqtVAjh61yaVXJJkKvD3,1JKQ5iMQnkoUyzlS9HThRbYAbLiCA2Ibu,1SKno-fJOIqp_fjUoRnJbxJNTG7BQliuY,1M1KFDerpPBQ-pBcgF6uP0cDA6cMJEkvJ,1OxjASdoF45yBNxMBD_WeXcDVwBb0Tzhs,1RuO53cvXWd_WdaLwcFWa_PYmQZ9TYT-G,15SxTALy5nFxObsKczqTn0a8NPW0UlICE"
            echo 'CDB_OPERATOR_TARGETED_REPLAY_DISPATCH_SUBMITTED_NOT_IMPORT_VERIFIED'
          else
            gh workflow run cdb-drive-inbox.yml -R "$GITHUB_REPOSITORY" --ref main -f catchup_remaining=4
            echo 'CDB_OPERATOR_DISPATCH_SUBMITTED_NOT_IMPORT_VERIFIED'
          fi

