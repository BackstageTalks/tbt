name: CDB Import - operator one-shot dispatcher
# Operator-approved replay 2026-10-23: bounded four Drive files from verified inventory; no quota spend, do not reset checkpoint.
# Operator request 2026-10-21: SHA-verified ATP/WTA Drive folder provenance salvage; existing guarded importer only; 0 paid API calls.

# Operator entrypoint. Changes to unrelated files never trigger this workflow.
# Operator request 2026-10-21: owner-authorized checkpointed Drive CDB import; 5 bounded batches, no gate bypass, zero paid provider calls.
# One-shot operator request: process up to 5 safe 100-file batches, starting 2026-10-20.
# This changes no global cron; future operator dispatch remains bounded.
# Production data may only be changed by the separate guarded CDB importer.
# Operator request 2026-10-20 20:58 Europe/Bratislava: next checkpointed Drive batch, existing guarded importer only.
# Operator request 2026-10-20 19:55 Europe/Bratislava: guarded pending Drive CDB retry; no gate bypass.
# Operator request 2026-10-20: retry SHA-pinned pending Drive batch through guarded importer; no safety gate bypass.
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cdb-import-operator-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-cdb:
    if: >-
      github.repository == 'BackstageTalks/tbt' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (contains(github.event.head_commit.message, '[cdb-import-now]') ||
        contains(github.event.head_commit.message, '[cdb-drive-continue-20261024]')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit guarded CDB Drive import on current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'BackstageTalks/tbt'
          test "$GITHUB_REF" = 'refs/heads/main'
          if [[ "$GITHUB_EVENT_NAME" == "push" && "${{ github.event.head_commit.message }}" == *"[cdb-drive-continue-20261024]"* ]]; then
            # One-shot fresh checkpointed Drive inventory. Existing guarded
            # importer alone owns source QA, NULL-only CDB write, CAS and readback.
            # No exact-ID replay of four previously rejected source files.
            gh workflow run cdb-drive-inbox.yml -R "$GITHUB_REPOSITORY" --ref main -f catchup_remaining=4
            echo 'CDB_20261024_FRESH_CHECKPOINT_IMPORT_DISPATCHED_NOT_VERIFIED'
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # One-shot, exact-ID replay of 2025/26 ATP match rows and WTA season
            # serve/return rows. Do not reset the private 2047-file checkpoint.
            # Only a push containing [cdb-import-now] can take this path.
            gh workflow run cdb-drive-inbox.yml -R "$GITHUB_REPOSITORY" --ref main \
              -f catchup_remaining=0 \
              -f replay_drive_ids="109Be-erkHMKxCA8wRoU_wl63luE9Yrhw,1jrOw7Rza4H1JOaZUyCz29Kd9rZNNhTj2,1-bVW6bb3rdFQw2nScTzcMcrxoph_6TY4,1i9CXB16lHFu9pP6vVWORoelaJyqbqQsR"
            echo 'CDB_OPERATOR_TARGETED_REPLAY_DISPATCH_SUBMITTED_NOT_IMPORT_VERIFIED'
          else
            gh workflow run cdb-drive-inbox.yml -R "$GITHUB_REPOSITORY" --ref main -f catchup_remaining=4
            echo 'CDB_OPERATOR_DISPATCH_SUBMITTED_NOT_IMPORT_VERIFIED'
          fi

# One-shot owner-authorized 2026-10-22 metadata/date QA replay after PR #953/#955.
# Existing guarded Drive importer exclusively; source IDs are not CDB identities.
