name: CDB Import - operator one-shot dispatcher
# Operator-approved replay 2026-10-23: bounded four Drive files from verified inventory; no quota spend, do not reset checkpoint.
# Operator request 2026-10-21: SHA-verified ATP/WTA Drive folder provenance salvage; existing guarded importer only; 0 paid API calls.

# 2026-11-02: authorized fresh checkpointed Drive batch, reusing the existing CDB writer and current quarantine evidence.
# Operator entrypoint. Changes to unrelated files never trigger this workflow.
# Operator request 2026-10-21: owner-authorized checkpointed Drive CDB import; 5 bounded batches, no gate bypass, zero paid provider calls.
# One-shot operator request: process up to 5 safe 100-file batches, starting 2026-10-20.
# This changes no global cron; future operator dispatch remains bounded.
# Production data may only be changed by the separate guarded CDB importer.
# Operator request 2026-10-20 20:58 Europe/Bratislava: next checkpointed Drive batch, existing guarded importer only.
# Operator request 2026-10-20 19:55 Europe/Bratislava: guarded pending Drive CDB retry; no gate bypass.
# Operator request 2026-10-20: retry SHA-pinned pending Drive batch through guarded importer; no safety gate bypass.
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cdb-import-operator-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-cdb:
    if: >-
      github.repository == 'BackstageTalks/tbt' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (contains(github.event.head_commit.message, '[cdb-import-now]') ||
        contains(github.event.head_commit.message, '[cdb-drive-continue-20261024]') ||
        contains(github.event.head_commit.message, '[cdb-tennisdata-20261116]') ||
        contains(github.event.head_commit.message, '[cdb-tennisdata-alias-20261116]') ||
        contains(github.event.head_commit.message, '[cdb-tennisdata-event-alias-20261116]') ||
        contains(github.event.head_commit.message, '[cdb-tml-full-archive-20261116]'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit guarded CDB Drive import on current main
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'BackstageTalks/tbt'
          test "$GITHUB_REF" = 'refs/heads/main'
          # One-shot, only the 12 user-uploaded ATP/WTA 2021-2026 match CSVs.
          # Existing Drive inbox owns all QA, lock, NULL-only CAS and remote readback.
          # Never reset checkpoint or escalate to paid providers.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$PUSH_MESSAGE" == *"[cdb-tml-full-archive-20261116]"* ]]; then
            # Exact operator-uploaded private ZIP. The existing CDB Drive
            # native single-writer still owns dry-run, CAS, backup and readback.
            gh workflow run cdb-drive-inbox.yml -R "$GITHUB_REPOSITORY" --ref main \
              -f request_id=tml-upload-20261116 \
              -f catchup_remaining=0 \
              -f replay_drive_ids="1WG00xLC6DaaiCI4U6n6ceqp6vcWRI-aq"
            echo 'TML_USER_44_SOURCE_ARCHIVE_GUARDED_DISPATCHED_NOT_IMPORT_VERIFIED'
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$PUSH_MESSAGE" == *"[cdb-tennisdata-event-alias-20261116]"* ]]; then
            # Same original SHA-bound twelve CSVs. The optional event alias
            # translator only reconciles 12 independently corroborated ATP/WTA
            # tournament display names; canonical matching is unchanged.
            gh workflow run cdb-drive-inbox.yml -R "$GITHUB_REPOSITORY" --ref main \
              -f request_id=tennisdata-verified-event-aliases-20261116 \
              -f catchup_remaining=0 \
              -f replay_drive_ids="1LqiYRtVeNgcCUq71em5ILmzbe_rksZj3,1v-hyb3kzyYjA5NYBV_6Rw0pDzIUMpcgK,1OQDvg7Xu16lfV29BWpL7jssBm-f9IzOw,15Uhy3qKzikP4lNsRXpm1fx_gW6B4LM14,1iVCT0ngvXgAfP9gqQvJJ3cMXPi_wBpsX,1Q0CI6YGySNzCUmvw4DmvSLesG6R0u1Ga,1IUsW7OqA4HTE9pmogZyWpuP_U076U7f_,1WWh5NexicqX7oA05YwuWseeJB7E6cE7u,1tgwu-4TCvcew3CwjDT3S6pV15bs8i1A4,1DtYRJsrLX9FBMtROru0qytvfl0xGlI12,1TlrRKXqCv_GIGvATjB-ow82W9LLCeZxA,1tbgeDIEBt251imJJ_dPKtvKfI_Pci7xD"
            echo 'TENNISDATA_VERIFIED_EVENT_SYNONYM_SOURCE_REPLAY_DISPATCHED_NOT_VERIFIED'
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$PUSH_MESSAGE" == *"[cdb-tennisdata-alias-20261116]"* ]]; then
            # Same twelve raw CSV SHA-pinned inputs, with source-native full
            # player names recovered only from private, independently checked
            # performance-file local IDs. Canonical pair/event checks unchanged.
            gh workflow run cdb-drive-inbox.yml -R "$GITHUB_REPOSITORY" --ref main \
              -f request_id=tennisdata-aliases-20261116 \
              -f catchup_remaining=0 \
              -f replay_drive_ids="1LqiYRtVeNgcCUq71em5ILmzbe_rksZj3,1v-hyb3kzyYjA5NYBV_6Rw0pDzIUMpcgK,1OQDvg7Xu16lfV29BWpL7jssBm-f9IzOw,15Uhy3qKzikP4lNsRXpm1fx_gW6B4LM14,1iVCT0ngvXgAfP9gqQvJJ3cMXPi_wBpsX,1Q0CI6YGySNzCUmvw4DmvSLesG6R0u1Ga,1IUsW7OqA4HTE9pmogZyWpuP_U076U7f_,1WWh5NexicqX7oA05YwuWseeJB7E6cE7u,1tgwu-4TCvcew3CwjDT3S6pV15bs8i1A4,1DtYRJsrLX9FBMtROru0qytvfl0xGlI12,1TlrRKXqCv_GIGvATjB-ow82W9LLCeZxA,1tbgeDIEBt251imJJ_dPKtvKfI_Pci7xD"
            echo 'TENNISDATA_SHA_PINNED_ALIAS_SOURCE_ONLY_GUARDED_DISPATCHED_NOT_VERIFIED'
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$PUSH_MESSAGE" == *"[cdb-tennisdata-20261116]"* ]]; then
            gh workflow run cdb-drive-inbox.yml -R "$GITHUB_REPOSITORY" --ref main \
              -f catchup_remaining=0 \
              -f replay_drive_ids="1LqiYRtVeNgcCUq71em5ILmzbe_rksZj3,1v-hyb3kzyYjA5NYBV_6Rw0pDzIUMpcgK,1OQDvg7Xu16lfV29BWpL7jssBm-f9IzOw,15Uhy3qKzikP4lNsRXpm1fx_gW6B4LM14,1iVCT0ngvXgAfP9gqQvJJ3cMXPi_wBpsX,1Q0CI6YGySNzCUmvw4DmvSLesG6R0u1Ga,1IUsW7OqA4HTE9pmogZyWpuP_U076U7f_,1WWh5NexicqX7oA05YwuWseeJB7E6cE7u,1tgwu-4TCvcew3CwjDT3S6pV15bs8i1A4,1DtYRJsrLX9FBMtROru0qytvfl0xGlI12,1TlrRKXqCv_GIGvATjB-ow82W9LLCeZxA,1tbgeDIEBt251imJJ_dPKtvKfI_Pci7xD"
            echo 'TENNISDATA_12_EXACT_DRIVE_IDS_GUARDED_DISPATCHED_NOT_VERIFIED'
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$PUSH_MESSAGE" == *"[cdb-drive-continue-20261024]"* ]]; then
            # One-shot fresh checkpointed Drive inventory. Existing guarded
            # importer alone owns source QA, NULL-only CDB write, CAS and readback.
            # No exact-ID replay of four previously rejected source files.
            gh workflow run cdb-drive-inbox.yml -R "$GITHUB_REPOSITORY" --ref main -f catchup_remaining=4
            echo 'CDB_20261024_FRESH_CHECKPOINT_IMPORT_DISPATCHED_NOT_VERIFIED'
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # One-shot, exact-ID replay of SHA-pinned TML ATP 2016-2026 match-level
