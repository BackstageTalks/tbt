name: BlinQ WTA 2026 ranked ID source rebase and add-only full year dry-run
on:
  pull_request:
    paths:
      - "scripts/import_wta2026_verified_rank_exact.py"
      - "tests/test_wta2026_verified_rank_exact.py"
      - ".github/workflows/wta2026-verified-rank-rebase.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: wta2026-exact-rebase-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      ROOT: .cache/tbt/wta2026-rank-rebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test exact WTA identity, no-overwrite and full-row rebase
        run: |
          set -euo pipefail
          python -m pip install --quiet -r api/requirements.txt -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_wta2026_verified_rank_exact.py tests/test_wta2026_verified_rank_gaps.py
          python -m compileall -q scripts/import_wta2026_verified_rank_exact.py
      - name: Read SHA-pinned 2026 source, prior immutable backup and current year
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          mkdir -p "$ROOT/stage" "$ROOT/old" "$ROOT/before" "$ROOT/local" "$ROOT/reports"
          gh release download blinq-wta2026-id-ranked-null-audit-38124637314 -R "$PRIVATE_REPO" -D "$ROOT/stage"
          (cd "$ROOT/stage" && sha256sum -c SHA256SUMS)
          gh release download blinq-atp-weekly-rank-prewrite-38124799583-1 -R "$PRIVATE_REPO" \
            -D "$ROOT/old" -p history-2026.parquet -p history_manifest.json
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -D "$ROOT/before" \
            -p history-2026.parquet -p history_manifest.json -p _tbt_bundle_manifest.json
          gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" > "$ROOT/before/release.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ["ROOT"])/"before"
          h=hashlib.sha256((d/"history-2026.parquet").read_bytes()).hexdigest()
          assert json.loads((d/"history_manifest.json").read_text())["years"]["2026"]["sha256"]==h
          assert json.loads((d/"_tbt_bundle_manifest.json").read_text())["files"]["history-2026.parquet"]["sha256"]==h
          assert {a["name"]:a["digest"] for a in json.loads((d/"release.json").read_text())["assets"]}["history-2026.parquet"]=="sha256:"+h
          print("PINNED_CURRENT_2026",h)
          PY
      - name: Prove stage 9844 identities untouched by ATP publication, simulate 19688 null fields
        run: |
          set -euo pipefail
          src="$ROOT/stage/wta2026-rank-null-candidates.jsonl.gz"
          audit="$ROOT/stage/report.json"
          for mode in dry-run write verify; do
            python scripts/import_wta2026_verified_rank_exact.py --mode "$mode" \
              --old-dir "$ROOT/old" --before-dir "$ROOT/before" --after-dir "$ROOT/local" \
              --stage-file "$src" --report-file "$audit" --out "$ROOT/reports/$mode.json"
          done
          test "$(jq -r .status "$ROOT/reports/verify.json")" = verified_exact_full_year
          test "$(jq -r .counts.changed_matches "$ROOT/reports/verify.json")" = 9844
          test "$(jq -r '.counts.player1_rank_filled+.counts.player2_rank_filled' "$ROOT/reports/verify.json")" = 19688
          test "$(jq -r .overwrite_existing_rank_values "$ROOT/reports/verify.json")" = 0
          test "$(jq -r .canonical_rows_rechecked "$ROOT/reports/verify.json")" = 92677
      - name: Publish count-only proof, no production or model writes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-wta2026-rank-rebase-${{ github.run_id }}
          path: .cache/tbt/wta2026-rank-rebase/reports/
          if-no-files-found: warn
          retention-days: 30
