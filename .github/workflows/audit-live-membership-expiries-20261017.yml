name: Check live BlinQ membership terms (temporary read-only)
on:
  push:
    paths:
      - '.github/workflows/audit-live-membership-expiries-20261017.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read production runtime membership durations
        env:
          BASE: ${{ vars.TBT_PRODUCTION_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          url=os.environ['BASE'].rstrip('/')+'/api/v1/ui-config?membership_term_check=20261017'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as res: payload=json.load(res)
          plans=(payload.get('config') or {}).get('plans') or {}
          keys=['rookie','pro','elite','legend','goat']
          print('LIVE_MEMBERSHIP_TERMS='+json.dumps({'source':payload.get('source'),'runtime_configured':payload.get('runtime_configured'),'storage_available':payload.get('storage_available'),'terms':{key:{'days':(plans.get(key) or {}).get('duration_days'),'unlimited':(plans.get(key) or {}).get('unlimited')} for key in keys},'inactivity':(payload.get('config') or {}).get('account_inactivity')},sort_keys=True))
          assert payload.get('runtime_configured') is True and payload.get('storage_available') is True
          PY
