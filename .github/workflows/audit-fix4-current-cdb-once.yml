name: FIX4 current CDB native identity read-only audit

'on':
  pull_request:
    paths:
      - scripts/research/audit_fix4_cdb_native.py
      - tests/test_audit_fix4_cdb_native.py
      - .github/workflows/audit-fix4-current-cdb-once.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-fix4-current-cdb-once.yml

permissions:
  contents: read
  actions: read
concurrency:
  group: audit-fix4-native-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test strict native key matching
        run: |
          python -m py_compile scripts/research/audit_fix4_cdb_native.py
          PYTHONPATH=scripts/research python -m unittest discover -s tests -p test_audit_fix4_cdb_native.py -v
      - name: Disallow writes in this audit tool
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/research/audit_fix4_cdb_native.py').read_text()
          for x in ('upload_bundle(', 'write_partition(', 'gh release upload', 'canonical_write_approved\':1', 'model.train('):
              assert x not in s,x
          PY

  current-cdb-audit:
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      DRIVE_READER_JSON: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
      REPO: BackstageTalks/tbt-data
      DRIVE_FILE_ID: 1Knf6bzFlfdFr1lEbhk_xy0FPgSGSv-Oh
      EXPECTED_ZIP_SHA: da4854ca582a0baae488f9874e608894b8757dcdf72c1379f9a1e2d53c37dff2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check credentials and read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$DRIVE_READER_JSON"
          test "$(gh api repos/$REPO --jq .private)" = true
          python -m pip install --disable-pip-version-check -q 'pyarrow>=17,<25' google-auth requests
          mkdir -p work/source work/cdb work/after work/result
      - name: Fetch original private source and check exact immutable SHA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from google.oauth2.service_account import Credentials
          from google.auth.transport.requests import AuthorizedSession
          cr=Credentials.from_service_account_info(json.loads(os.environ['DRIVE_READER_JSON']),scopes=['https://www.googleapis.com/auth/drive.readonly'])
          r=AuthorizedSession(cr).get('https://www.googleapis.com/drive/v3/files/'+os.environ['DRIVE_FILE_ID'],params={'alt':'media'},timeout=100)
          r.raise_for_status()
          if hashlib.sha256(r.content).hexdigest()!=os.environ['EXPECTED_ZIP_SHA']:
              raise SystemExit('FIX4_SOURCE_ZIP_DIGEST_MISMATCH')
          Path('work/source/bridge.zip').write_bytes(r.content)
          print('FIX4_SOURCE_INPUT_HASH_PASS')
          PY
      - name: Fetch only CDB partitions relevant to 2015-2025 and manifests
        shell: bash
        run: |
          set -euo pipefail
          gh release download tbt-data-v1 -R "$REPO" --dir work/cdb \
            -p history_manifest.json -p _tbt_bundle_manifest.json \
            $(seq -f '-p history-%g.parquet' 2015 2025)
      - name: Deterministic read-only actual CDB native-event overlap measurement
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research/audit_fix4_cdb_native.py \
            --bridge-zip work/source/bridge.zip \
            --cdb-dir work/cdb \
            --out work/result/fix4_cdb_native_gap_report.json
      - name: Reject data drift since first canonical read
        shell: bash
        run: |
          set -euo pipefail
          gh release download tbt-data-v1 -R "$REPO" --dir work/after \
            -p history_manifest.json -p _tbt_bundle_manifest.json \
            $(seq -f '-p history-%g.parquet' 2015 2025)
          for f in work/cdb/*; do cmp "$f" "work/after/$(basename "$f")"; done
          sha256sum work/result/fix4_cdb_native_gap_report.json | tee work/result/SHA256SUMS
          python - <<'PY'
          import json
          r=json.load(open('work/result/fix4_cdb_native_gap_report.json'))
          assert r['source_strict_link_rows']==15790
          assert r['cdb_cells_written']==0 and r['canonical_write_approved']==0
          assert r['model_changed'] is False and r['provider_requests']==0
          print('FIX4_CURRENT_CDB_READ_ONLY_REPORT_PASS',r['counts'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fix4-cdb-native-overlap-${{ github.run_id }}
          path: work/result/*
          if-no-files-found: warn
          retention-days: 90