name: BlinQ PbP compound candidate vs current CDB NULL gap audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/blinq-pbp-source-vs-current-cdb.yml
      - scripts/audit_pbp_source_vs_current_cdb.py
  workflow_dispatch:
    inputs:
      alias_research:
        type: boolean
        default: false
        description: "Enable conservative alias candidates (research-only, zero CDB writes)"
permissions:
  contents: read
concurrency:
  group: blinq-pbp-vs-cdb-read-only
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Aneeshers/tennis-sackmann-archive
          ref: 83733587353df8a41f2fd4f516147d5aa83f5a8d
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download current canonical production snapshot privately
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          mkdir -p /tmp/blinq-pbp-gap/cdb /tmp/blinq-pbp-gap/report
          gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" > /tmp/blinq-pbp-gap/release.json
          python app/scripts/download_stable_cdb.py \
            --repository "$PRIVATE_REPO" --tag tbt-data-v1 \
            --out /tmp/blinq-pbp-gap/cdb \
            --report /tmp/blinq-pbp-gap/report/verified-current-snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/blinq-pbp-gap/report/verified-current-snapshot.json').read_text())
          assert s['status']=='verified' and s['provider_api_requests']==0
          assert len(s['manifest_sha256'])==64
          PY
          python -m pip install --quiet "pandas>=2,<3" pyarrow
      - name: Test candidate safety and compare verified source bytes with 78 CDB parts
        timeout-minutes: 40
        run: |
          set -euo pipefail
          python -m unittest discover -s app/tests -p test_pbp_candidate_audit.py -v
          flags=()
          if [[ "${{ inputs.alias_research || 'false' }}" == "true" ]]; then
            flags+=(--alias-research)
          fi
          python app/scripts/audit_pbp_source_vs_current_cdb.py \
            --source source --cdb /tmp/blinq-pbp-gap/cdb \
            --release /tmp/blinq-pbp-gap/release.json \
            --out /tmp/blinq-pbp-gap/report/pbp-current-cdb-gap.json \
            --candidates /tmp/blinq-pbp-gap/report/pbp-candidates-private.jsonl.gz "${flags[@]}"
      - name: Publish private candidate ledger and aggregate report with SHA readback
        if: success()
        run: |
          set -euo pipefail
          cd /tmp/blinq-pbp-gap/report
          python - <<'PY'
          import json
          j=json.load(open('pbp-current-cdb-gap.json'))
          assert j['canonical_writes']==0 and j['training'] is False
          assert j['schema']==2 and j['approved_cdb_cells']==0
          assert j['independent_identity_verified'] is False
          assert 'verified_safe_additive_null_cells' not in j['counts']
          assert j['counts']['source_files_byte_identical_to_zip']==262
          assert j['counts']['cdb_rows']>=995143
          assert j['candidate_ledger_rows']==j['counts']['compound_candidates_without_stat_conflict']
          assert j['candidate_ledger_rows']>0
          import gzip,hashlib
          p='pbp-candidates-private.jsonl.gz'
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()==j['candidate_ledger_sha256']
          seen=set();total=0
          with gzip.open(p,'rt',encoding='utf-8') as f:
            for line in f:
              row=json.loads(line)
              if j.get('alias_research_enabled') is True:
                assert row['identity_evidence'] in ('compound_metadata_only','alias_metadata_research_only')
              else:
                assert row['identity_evidence']=='compound_metadata_only'
              assert row['independent_identity_verified'] is False and row['write_authorized'] is False
              assert row['canonical_match_id_candidate'] not in seen
              seen.add(row['canonical_match_id_candidate'])
              assert all(row['source_native_key']) and len(set(row['source_player_ids']))==2
              assert all(v is not None for v in row['missing_candidate_cells'].values())
              total+=1
          assert total==j['candidate_ledger_rows']
          PY
          sha256sum pbp-current-cdb-gap.json pbp-candidates-private.jsonl.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          TAG="blinq-pbp-cdb-gap-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$TAG" -R "$PRIVATE_REPO" \
            --title "BlinQ read-only PbP source/current CDB gap ${{ github.run_id }}" \
            --notes "Private research-only per-candidate ledger and aggregate report. Zero canonical writes; no provider identity attested."
          gh release upload "$TAG" pbp-current-cdb-gap.json pbp-candidates-private.jsonl.gz SHA256SUMS -R "$PRIVATE_REPO"
          mkdir readback
          gh release download "$TAG" -R "$PRIVATE_REPO" \
            -p 'pbp-current-cdb-gap.json' -p 'pbp-candidates-private.jsonl.gz' -p SHA256SUMS -D readback
          (cd readback && sha256sum -c SHA256SUMS)
          echo "PRIVATE_AGGREGATE_READBACK_SHA256_VERIFIED"
