name: CDB 2016–2026 serve/return gaps - private read-only audit

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/cdb_canonical_gap_audit.py
      - tests/test_cdb_canonical_gap_audit.py
      - .github/workflows/cdb-canonical-gap-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/cdb_canonical_gap_audit.py

permissions:
  contents: read

concurrency:
  group: blinq-cdb-gap-audit-${{ github.event_name == 'pull_request' && 'ci' || 'production' }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure safety tests
        env:
          PYTHONPATH: .:api:scripts
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m compileall -q scripts/cdb_canonical_gap_audit.py
          python -m pytest tests/test_cdb_canonical_gap_audit.py -q

  private-gap-report:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      CDB_REPO: BackstageTalks/tbt-data
      CDB_TAG: tbt-data-v1
      PYTHONPATH: .:api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical snapshot reader
        run: python -m pip install --disable-pip-version-check pandas pyarrow pydantic numpy
      - name: Fetch bounded private canonical partitions and manifests
        run: |
          test -n "$GH_TOKEN" || { echo MISSING_PRIVATE_CDB_TOKEN; exit 1; }
          mkdir -p work/release
          gh api "repos/$CDB_REPO/releases/tags/$CDB_TAG" > work/release-metadata.json
          patterns=(-p history_manifest.json -p _tbt_bundle_manifest.json)
          for year in {2016..2026}; do patterns+=(-p "history-$year.parquet"); done
          gh release download "$CDB_TAG" -R "$CDB_REPO" "${patterns[@]}" -D work/release
      - name: SHA and canonical manifest verification; isolated local view
        run: |
          python - <<'PY'
          from pathlib import Path
          from cdb_wta_verified_window import verified_window
          report=verified_window(
              Path("work/release"),
              Path("work/release-metadata.json"),
              Path("work/local-view"),
              years=tuple(range(2016,2027)),
          )
          print("CDB_VERIFIED_PARTITIONS",len(report["partitions"]),
                "production_mutated",report["production_mutated"])
          PY
      - name: Count exact canonical missing stats without exposing private rows
        run: |
          python scripts/cdb_canonical_gap_audit.py \
            --history-dir work/local-view --output cdb-gap-audit.json
          python - <<'PY'
          import json
          report=json.load(open("cdb-gap-audit.json"))
          if report.get("production_mutated") is not False or report.get("api_requests") != 0:
              raise SystemExit("Unsafe gap audit contract")
          for row in report["year_tour"]:
              if row["matches"] < 0 or row["core_complete_matches"] > row["matches"]:
                  raise SystemExit("Invalid canonical gap report count")
              for field, value in row["fields"].items():
                  if value["missing_cells"]+value["present_cells"]!=2*row["matches"]:
                      raise SystemExit("Gap report cell conservation violated: "+field)
          print("CDB_PRIVATE_GAP_GROUPS",len(report["year_tour"]),
                "CANONICAL_ROWS",report["canonical_rows"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdb-2016-2026-gap-audit-aggregate-only
          path: cdb-gap-audit.json
          if-no-files-found: ignore
          retention-days: 14
