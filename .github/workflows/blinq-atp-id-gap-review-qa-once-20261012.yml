name: BlinQ ATP gap CC0 review QA once (temporary)
'on':
  pull_request:
    paths:
      - .github/workflows/blinq-atp-id-gap-review-qa-once-20261012.yml
permissions:
  contents: read
jobs:
  pinned-private-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'BackstageTalks'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_$: ${{ secrets.TBT_DATA_GH_$ }}
      PRIVATE_SHA: 24f9836f308c25685e7ad8a480354130263fdc92
      PRIORITY_SHA: 95fbc94e47cc0e6f664018829ed10b80a76ff96a600dbe563177ad688244bccd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          token: ${{ secrets.TBT_DATA_GH_$ }}
          ref: 24f9836f308c25685e7ad8a480354130263fdc92
          fetch-depth: 1
          path: private
          persist-credentials: false
      - name: Verify and compare existing PRIVATE source evidence, never CDB
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_$"
          test "$(git -C private rev-parse HEAD)" = "$PRIVATE_SHA"
          test "$(gh api repos/BackstageTalks/tbt-data --jq .private)" = true
          mkdir -p "$RUNNER_TEMP/input" "$RUNNER_TEMP/output"
          gh release download blinq-source-evidence-tml-2022-2025-38241050051-1 \
            -R BackstageTalks/tbt-data \
            -p identity-crosswalk-priority-private.jsonl -D "$RUNNER_TEMP/input" >/dev/null
          test "$(sha256sum "$RUNNER_TEMP/input/identity-crosswalk-priority-private.jsonl" | cut -d' ' -f1)" = "$PRIORITY_SHA"
          test -s private/research/player_identity/wikidata-canonical-links.jsonl.gz
          canonical_sha="$(sha256sum private/research/player_identity/wikidata-canonical-links.jsonl.gz | cut -d' ' -f1)"
          python -m unittest discover -s tests -p test_review_wikidata_atp_gap_bridge.py >"$RUNNER_TEMP/private-tests.log" 2>&1 || {
            echo 'BLOCKED_PRIVATE_CC0_REVIEW_TESTS'
            exit 1
          }
          python scripts/review_wikidata_atp_gap_bridge.py \
            --gaps "$RUNNER_TEMP/input/identity-crosswalk-priority-private.jsonl" \
            --gaps-sha256 "$PRIORITY_SHA" \
            --canonical-wikidata private/research/player_identity/wikidata-canonical-links.jsonl.gz \
            --canonical-sha256 "$canonical_sha" \
            --out "$RUNNER_TEMP/output"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'output'/'report.json'
          r=json.loads(p.read_text())
          assert r['ready_for_cdb_write']==0
          assert r['cdb_writes']==0
          assert r['sports_api_requests']==0
          assert r['gap_player_ids_scanned']==606
          assert r['event_identity_attested'] is False
          print('PINNED_606_ATP_GAP_CC0_REVIEW_NO_WRITE_PASS')
          PY
