name: BlinQ Sackmann 2025 versus pinned CDB (read only once)
on:
  push:
    branches: [main]
    paths:
      - '.github/sackmann-cdb2025-readonly-request.json'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sackmann-cdb2025-compare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      PINNED_MIRROR_SHA: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      EXPECTED_CDB2025_SHA: 3a929b356803af6b0f704d4d3066a053ecf995124ec8f4228487c54c0f534c58
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only safety regression (never the CDB writer)
        run: python -m unittest discover -s scripts/research -p test_sackmann_2025_vs_cdb.py -v
      - name: Verify private destination and download exact CDB part
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          mkdir -p work/cdb
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -p 'history-2025.parquet' -D work/cdb
          echo "$EXPECTED_CDB2025_SHA  work/cdb/history-2025.parquet" | sha256sum -c
      - name: Retrieve EXACT user-library Sackmann 2025 bytes from SHA-pinned public mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/src/atp work/src/wta
          base="https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/$PINNED_MIRROR_SHA"
          for path in \
            atp/atp_matches_2025.csv \
            atp/atp_matches_futures_2025.csv \
            atp/atp_matches_qual_chall_2025.csv \
            wta/wta_matches_2025.csv \
            wta/wta_matches_qual_itf_2025.csv; do
            curl --fail --silent --show-error --location --retry 2 --max-time 150 "$base/$path" -o "work/src/$path"
          done
          cat <<'EOF' | (cd work/src && sha256sum -c)
          78c356ef9328b89ae58a17564d61c02cdad2a3a007f6b8af5cfc17992b11bb2d  atp/atp_matches_2025.csv
          54dd4611505feccd4976e42564f4d9d0796ebd86f64ad195a3ffc0ae0e9da294  atp/atp_matches_futures_2025.csv
          7690c576689d9cafc28d1b9f3293173e87220573db5fd2c47e3097f2ab505ec0  atp/atp_matches_qual_chall_2025.csv
          e4eb002bc6d828b0bd21e04ed286e68722ddc8ccbbb27ea980bf62e938377f96  wta/wta_matches_2025.csv
          af1b439684a55ae0f7cb42ed5da2b11985f08dac50ac68c06da4faa3ffe19da7  wta/wta_matches_qual_itf_2025.csv
          EOF
      - name: Compare Sackmann against CDB without mutating either source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas pyarrow
          python scripts/research/audit_sackmann_2025_vs_cdb.py \
            --source-dir work/src --cdb-parquet work/cdb/history-2025.parquet \
            --out work/report
          python - <<'PY'
          import json
          r=json.load(open('work/report/report.json'))
          assert r['source_counts']['source_rows']==56889
          assert r['canonical_rows']==90571
          assert r['source_to_canonical_event_ids_attested']==0
          assert r['cdb_write_authorized'] is False
          assert r['safe_import_ready_fields']==0 and r['cdb_rows_written']==0
          PY
      - name: Persist aggregate report only in private tbt-data with SHA readback
        shell: bash
        run: |
          set -euo pipefail
          tag="blinq-sackmann2025-cdb-research-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          (cd work/report && sha256sum report.json > SHA256SUMS)
          gh release create "$tag" -R "$PRIVATE_REPO" --title 'Private Sackmann 2025 vs CDB audit (read only)' --notes 'Exact SHA-matched user PbP.zip source clone and 2025 CDB. Metadata+score comparisons are NOT independent provider event ID proof or CDB import permission. Zero CDB writes.' >/dev/null
          gh release upload "$tag" work/report/report.json work/report/SHA256SUMS -R "$PRIVATE_REPO" >/dev/null
          mkdir -p work/readback
          gh release download "$tag" -R "$PRIVATE_REPO" -D work/readback >/dev/null
          (cd work/readback && sha256sum -c SHA256SUMS)
          cmp work/report/report.json work/readback/report.json
          echo "BLINQ_SACKMANN2025_REPORT_PRIVATE_VERIFIED=$tag"
