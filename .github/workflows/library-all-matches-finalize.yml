name: Finalize library all_matches training DB

on:
  push:
    branches:
      - library-all-matches-enrichment
    paths:
      - '.github/workflows/library-all-matches-finalize.yml'

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }

      - name: Download and verify enriched canonical history
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_production_preflight_inputs.py
          python - <<'PY'
          from pathlib import Path
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          from tbt.models.feature_builder import FeatureBuilder
          matches=load_partitions(Path(".cache/tbt/history"))
          safe,safety=sanitize_history_identities(matches)
          quality=sum(1 for m in safe if all(
              FeatureBuilder._extract_quality(m.stats or {},side)[0] is not None and
              FeatureBuilder._extract_quality(m.stats or {},side)[1] is not None
              for side in ("p1","p2")
          ))
          if len(safe)!=740121 or safety.get("quarantined_rows"):
              raise SystemExit(f"Canonical integrity failed: rows={len(safe)} safety={safety}")
          if quality != 281254:
              raise SystemExit(f"Unexpected quality_ready after library enrichment: {quality}")
          print({"rows":len(safe),"quality_ready":quality,"quarantined_rows":safety.get("quarantined_rows",0)})
          PY

      - name: Download verified ATP and WTA priors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cache/tbt/library-finalize
          mkdir -p .cache/tbt/library-finalize/atp .cache/tbt/library-finalize/wta .cache/tbt/library-finalize/training
          gh release download tbt-atp-leaderboards-v1 --repo "$TBT_DATA_REPOSITORY" --pattern atp_leaderboards_1991_2026_52week_career.csv --dir .cache/tbt/library-finalize/atp --clobber
          gh release download tbt-wta-season-stats-v1 --repo "$TBT_DATA_REPOSITORY" --pattern wta_stats_2010_2026_serving_returning.csv --dir .cache/tbt/library-finalize/wta --clobber

      - name: Build training table and audit leakage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_production_training_table.py \
            --history-dir .cache/tbt/history \
            --atp-leaderboards-csv .cache/tbt/library-finalize/atp/atp_leaderboards_1991_2026_52week_career.csv \
            --wta-season-stats-csv .cache/tbt/library-finalize/wta/wta_stats_2010_2026_serving_returning.csv \
            --out .cache/tbt/library-finalize/training/training_table.parquet \
            --report .cache/tbt/library-finalize/training/training_table_report.json
          python scripts/audit_training_leakage.py \
            --history-dir .cache/tbt/history \
            --report .cache/tbt/library-finalize/training/leakage_audit_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          leak=json.loads(Path(".cache/tbt/library-finalize/training/leakage_audit_report.json").read_text())
          status=str(leak.get("status") or "").lower()
          if status not in {"pass","passed","ok"}:
              raise SystemExit(f"Leakage audit failed: {leak}")
          print(json.dumps(leak,indent=2))
          PY

      - name: Write library enrichment verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path(".cache/tbt/library-finalize/training")
          frame=pd.read_parquet(root/"training_table.parquet")
          report=json.loads((root/"training_table_report.json").read_text())
          leakage=json.loads((root/"leakage_audit_report.json").read_text())
          verification={
              "schema":1,
              "status":"verified",
              "source":"ChatGPT Library all_matches 1991-2018",
              "canonical_rows":740121,
              "library_stage_rows":10198,
              "library_quality_ready_before":275766,
              "library_quality_ready_after":281254,
              "library_quality_ready_added":5488,
              "identity_quarantined_rows":0,
              "training_rows":int(len(frame)),
              "training_columns":int(len(frame.columns)),
              "date_range":report.get("date_range"),
              "leakage_status":leakage.get("status"),
          }
          (root/"library_enrichment_verification.json").write_text(json.dumps(verification,indent=2),encoding="utf-8")
          print(json.dumps(verification,indent=2))
          PY

      - name: Publish training DB bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore
          root=Path(".cache/tbt/library-finalize/training")
          required=[
              root/"training_table.parquet",
              root/"training_table_report.json",
              root/"leakage_audit_report.json",
              root/"library_enrichment_verification.json",
          ]
          if any(not p.is_file() or p.stat().st_size<=0 for p in required):
              raise SystemExit("Refusing incomplete training DB publication")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-training-table-v1",root).upload_bundle(required)
          PY

      - name: Persisted readback verification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cache/tbt/library-finalize/readback
          mkdir -p .cache/tbt/library-finalize/readback
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          from release_store import ReleaseStore
          root=Path(".cache/tbt/library-finalize/readback")
          required=("training_table.parquet","training_table_report.json","leakage_audit_report.json","library_enrichment_verification.json")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-training-table-v1",root).download(
              extra_names=required,
              required_names=required,
              require_bundle_manifest=True,
          )
          frame=pd.read_parquet(root/"training_table.parquet")
          verification=json.loads((root/"library_enrichment_verification.json").read_text())
          leakage=json.loads((root/"leakage_audit_report.json").read_text())
          if verification.get("status")!="verified":
              raise SystemExit("Persisted library enrichment verification invalid")
          if int(verification.get("library_quality_ready_after") or 0)!=281254:
              raise SystemExit("Persisted quality_ready mismatch")
          if str(leakage.get("status") or "").lower() not in {"pass","passed","ok"}:
              raise SystemExit("Persisted leakage audit failed")
          if len(frame)!=int(verification.get("training_rows") or -1):
              raise SystemExit("Persisted training row count mismatch")
          print(json.dumps({
              "status":"verified",
              "training_rows":int(len(frame)),
              "training_columns":int(len(frame.columns)),
              "quality_ready":verification.get("library_quality_ready_after"),
              "quality_ready_added":verification.get("library_quality_ready_added"),
              "leakage_status":leakage.get("status"),
          },indent=2))
          PY
