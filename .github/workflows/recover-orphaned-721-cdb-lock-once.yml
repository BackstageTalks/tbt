name: One-shot verified recovery of orphaned 7.2.1 CDB lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-orphaned-721-cdb-lock-once.yml

permissions:
  contents: read

concurrency:
  group: blinq-721-stale-lock-recovery-once
  cancel-in-progress: false

jobs:
  verified-recovery:
    if: github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - name: Recover only the verified orphan of failed training run 39115897871
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python - <<'PY'
          import json
          import subprocess

          owner = "BackstageTalks/tbt/actions/runs/39115897871/attempts/1"
          expected_tag_sha = "723b20fc33916708bf8a79303caa08953ddb9dc0"
          run_path = "repos/BackstageTalks/tbt/actions/runs/39115897871"
          lock_path = "repos/BackstageTalks/tbt-data/git/ref/tags/blinq-cdb-global-writer"

          def api(path, method="GET", missing_ok=False):
              response = subprocess.run(
                  ["gh", "api", "--method", method, path],
                  capture_output=True, text=True,
              )
              if response.returncode:
                  if missing_ok and "HTTP 404" in response.stderr:
                      return None
                  raise RuntimeError(f"GitHub {method} request failed: {path}: {response.stderr[:250]}")
              return json.loads(response.stdout) if response.stdout.strip() else {}

          # A stale tag is NEVER recovered on age alone: the exact owner must
          # have a finished failed run with no still-running workflow jobs.
          run = api(run_path)
          assert run.get("status") == "completed" and run.get("conclusion") == "failure", (
              "Original CDB lock owner is not verified as terminated and failed"
          )
          jobs = api(run_path + "/jobs?per_page=100").get("jobs", [])
          assert jobs and all(job.get("status") == "completed" for job in jobs), (
              "Original run has an incomplete job: refusing lock deletion"
          )
          remote = api(lock_path, missing_ok=True)
          if remote is None:
              print("No orphaned CDB lock remains; no change made", flush=True)
              raise SystemExit(0)
          actual_sha = (remote.get("object") or {}).get("sha")
          assert actual_sha == expected_tag_sha, (
              f"CDB lock changed owner (SHA {actual_sha}); refusing removal"
          )
          tag = api(f"repos/BackstageTalks/tbt-data/git/tags/{actual_sha}")
          assert tag.get("message") == f"owner={owner}", (
              "CDB lock owner tag does not match terminated training run"
          )

          # Delete only the exactly observed orphan; another writer may claim
          # a NEW tag immediately afterwards, which must never be removed.
          api(lock_path.replace("/git/ref/", "/git/refs/"), method="DELETE")
          after = api(lock_path, missing_ok=True)
          assert after is None or (after.get("object") or {}).get("sha") != expected_tag_sha, (
              "Failed to clear orphaned tag"
          )
          print("Verified orphaned lock from completed failed run removed once", flush=True)
          print("Subsequent lock ownership belongs to the existing single-writer protocol", flush=True)
          PY
