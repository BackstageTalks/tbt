name: Test OddsTrader line history
on:
  push:
    branches: [research/oddstrader-probe-20260901]
    paths: [".github/workflows/oddstrader-linehistory-test.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request, time

          page="https://www.oddstrader.com/atp/?date=20260901&g=match&m=winner"
          req=urllib.request.Request(page,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html"})
          with urllib.request.urlopen(req,timeout=30) as h:
              html=h.read().decode("utf-8","replace")
          marker="window.__INITIAL_STATE__="
          i=html.index(marker)+len(marker)
          st,_=json.JSONDecoder().raw_decode(html[i:])
          events=(st.get("events") or {}).get("events") or {}
          eid=sorted(events,key=int)[0]
          books=[]
          for b in (st.get("sportsbooks") or {}).get("sportsbooks") or []:
              if isinstance(b,dict) and b.get("paid") is not None:
                  books.append({"name":b.get("nam"),"paid":int(b["paid"]),"sbid":b.get("sbid")})
          print("EVENT",eid,json.dumps(events[eid],ensure_ascii=False)[:3000])
          print("BOOKS",json.dumps(books,ensure_ascii=False))

          base="https://ms.virginia.us-east-1.oddstrader.com/odds-v2/odds-v2-service"
          for b in books:
              paid=b["paid"]
              q=f'{{ lineHistory(eid:{eid},mtid:126,paid:{paid}) {{ tim lines }} openingLines(eid:[{eid}],mtid:[126],paid:[{paid}]) currentLines(eid:[{eid}],mtid:[126],paid:[{paid}]) }}'
              url=base+"?"+urllib.parse.urlencode({"query":q})
              rq=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json","Referer":page})
              try:
                  with urllib.request.urlopen(rq,timeout=30) as h:
                      body=h.read().decode("utf-8","replace")
                  data=json.loads(body)
              except Exception as e:
                  print("ERR",b,repr(e)); continue
              print("\nBOOK",json.dumps(b,ensure_ascii=False))
              print(json.dumps(data,ensure_ascii=False)[:20000])
              time.sleep(.2)
          PY
