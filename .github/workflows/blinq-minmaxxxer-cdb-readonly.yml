name: BlinQ pinned MinMaxxxer current CDB importability (read only)
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/blinq-minmaxxxer-cdb-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-minmaxxxer-cdb-readonly
  cancel-in-progress: false

jobs:
  source-vs-cdb:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      DATA_REPO: BackstageTalks/tbt-data
      SOURCE_COMMIT: e5c7471f73cb54d06a7ecc2455b7fbb78a0bf77a
      PYTHONPATH: .:api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse existing strict Flashscore/source stat safety regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas pyarrow pydantic numpy
          python -m compileall -q scripts/audit_minmaxxxer_cdb_importability.py scripts/link_uploaded_flashscore_verified.py scripts/verify_uploaded_2025_2026_raw_parity.py
          python -m unittest discover -s tests -p 'test_link_uploaded_flashscore_verified.py' -v
      - name: Download exactly four source CSVs by immutable public commit
        shell: bash
        run: |
          set -euo pipefail
          test "${SOURCE_COMMIT}" = e5c7471f73cb54d06a7ecc2455b7fbb78a0bf77a
          mkdir -p work/source
          for name in atp_matches_2025.csv wta_matches_2025.csv atp_matches_2026.csv wta_matches_2026.csv; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --max-time 120 \
              "https://huggingface.co/datasets/minmaxxxer/atp-wta-matches-with-odds/resolve/${SOURCE_COMMIT}/${name}" \
              --output "work/source/${name}"
            test -s "work/source/${name}"
          done
          (cd work/source && sha256sum *.csv)
          echo "HF_PINNED_FOUR_SOURCE_FILES_DOWNLOADED"
      - name: Obtain one SHA-verified private canonical 2024–2026 snapshot and independent event index
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}" || { echo "PRIVATE_TOKEN_MISSING"; exit 1; }
          test "$(gh repo view "$DATA_REPO" --json visibility -q .visibility)" = PRIVATE
          mkdir -p work/cdb
          gh api "repos/$DATA_REPO/releases/tags/tbt-data-v1" > work/release.json
          gh release download tbt-data-v1 -R "$DATA_REPO" -D work/cdb \
            -p history-2024.parquet -p history-2025.parquet -p history-2026.parquet \
            -p history_manifest.json -p _tbt_bundle_manifest.json \
            -p blinq-flashscore-event-index-2026.jsonl.gz
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("work/cdb")
          assets = {x["name"]: x for x in json.load(open("work/release.json"))["assets"]}
          for file in root.iterdir():
              if file.is_file():
                  h = hashlib.sha256(file.read_bytes()).hexdigest()
                  if assets[file.name].get("digest") != "sha256:" + h:
                      raise SystemExit("PRIVATE_CDB_DIGEST_DRIFT " + file.name)
          print("CURRENT_CDB_AND_FLASH_INDEX_SHA_VERIFIED",len(list(root.iterdir())))
          PY
      - name: Check precise event, UTC, two names, winner, full score, stat witnesses and NULL-only delta
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_minmaxxxer_cdb_importability.py \
            --source-dir work/source \
            --index work/cdb/blinq-flashscore-event-index-2026.jsonl.gz \
            --history-dir work/cdb \
            --out work/qa
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("work/qa/aggregate-report.json").read_text())
          if (r.get("production_mutated") is not False or
              r.get("writer_executed") is not False or
              r.get("paid_api_requests") != 0 or r.get("odds_imported") != 0 or
              r["counts"].get("source_rows") != 11364 or
              len(r.get("pinned_source_sha256", {})) != 4):
              raise SystemExit("HF_SOURCE_QA_AUDIT_CONTRACT_FAILED")
          print("HF_PRIVATE_READONLY_CDB_LINK_REPORT",json.dumps(r["counts"],sort_keys=True))
          PY
      - name: Compare NULL-only candidate stage against the existing native importer in dry-run
        shell: bash
        run: |
          set -euo pipefail
          count="$(python -c 'import json;print(json.load(open("work/qa/aggregate-report.json"))["stage_rows"])')"
          if [[ "$count" -eq 0 ]]; then
            echo "HF_CURRENT_CDB_EXACT_DRYRUN_ZERO_DELTA_NO_PRODUCTION_WRITE"
          else
            # The native importer conservatively requires ALL 78 partitions
            # declared in the authoritative manifest. A three-year subset is
            # enough for read-only identity QA but not a native safety dry-run.
            gh release download tbt-data-v1 -R "$DATA_REPO" -D work/cdb \
              -p 'history-*.parquet' --clobber
            python - <<'PY'
          import hashlib,json
          from pathlib import Path
          folder=Path("work/cdb")
          data=json.load(open("work/release.json"))
          assets={x["name"]:x for x in data["assets"]}
          years=json.loads((folder/"history_manifest.json").read_text())["years"]
          bundle=json.loads((folder/"_tbt_bundle_manifest.json").read_text())["files"]
          count=0
          for year,entry in years.items():
              name=f"history-{year}.parquet"
              path=folder/name
              if not path.exists():
                  raise SystemExit("MISSING_DECLARED_CDB_YEAR "+name)
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              if (entry["sha256"]!=digest or bundle[name]["sha256"]!=digest
                      or assets[name].get("digest")!="sha256:"+digest):
                  raise SystemExit("FULL_NATIVE_CDB_SHA_MISMATCH "+name)
              count+=1
          if count!=78:
              raise SystemExit("CDB_YEAR_COUNT_DRIFT")
          print("CDB_ALL_78_PARTITIONS_SHA_VERIFIED")
          PY
            python scripts/import_offline_linked_serve_return.py \
              --stage work/qa/eligible-private.jsonl \
              --history-dir work/cdb --out-dir work/qa/native-dryrun
            python - <<'PY'
          import json
          a=json.load(open("work/qa/aggregate-report.json"))
          b=json.load(open("work/qa/native-dryrun/report.json"))
          if b["counts"].get("stat_fields_added") != a["counts"].get("eligible_new_cells"):
              raise SystemExit("NATIVE_DRYRUN_FIELDS_DIFFER_SOURCE_QA")
          if b.get("production_mutated") is not False:
              raise SystemExit("NATIVE_DRYRUN_UNEXPECTED_WRITE")
          print("HF_POSITIVE_NATIVE_NULL_ONLY_DRYRUN",b["counts"])
          PY
          fi
      - name: Persist only aggregate QA to private data repo with source SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          report=work/qa/aggregate-report.json
          file=research/source-acquisition/minmaxxxer-20261116-current-cdb-importability.json
          encoded="$(base64 -w0 "$report")"
          sha="$(gh api "repos/$DATA_REPO/contents/$file" --jq .sha 2> work/content-error.txt)" || {
            if ! grep -Fq 'HTTP 404' work/content-error.txt; then
              cat work/content-error.txt
              exit 1
            fi
            sha=""
          }
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$DATA_REPO/contents/$file" \
              -f message="Audit pinned HF ATP/WTA current CDB cross-source importability" \
              -f content="$encoded" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$DATA_REPO/contents/$file" \
              -f message="Record pinned HF ATP/WTA current CDB importability" \
              -f content="$encoded" >/dev/null
          fi
          gh api "repos/$DATA_REPO/contents/$file" --jq .sha > work/qa/private-report-blob-sha.txt
          test -s work/qa/private-report-blob-sha.txt
          echo "HF_CDB_PRIVATE_AGGREGATE_AUDIT_PERSISTED"
      - name: Expose counts only, never source rows, CDB rows or raw stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-cdb-independent-importability-aggregate
          path: work/qa/aggregate-report.json
          if-no-files-found: ignore
          retention-days: 21
# 2026-11-16 repeat READ-ONLY audit: separate calendar-day/actual-clock mismatches; no CDB import permission changed.
# 2026-11-16 additional READ-ONLY proof: bounded 24-hour clock with full score, native event and four count corroboration; no publisher.
