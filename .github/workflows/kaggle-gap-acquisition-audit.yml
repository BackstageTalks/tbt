name: BlinQ Kaggle gap acquisition audit

on:
  pull_request:
    paths:
      - ".github/kaggle-gap-acquisition-request.json"
      - ".github/workflows/kaggle-gap-acquisition-audit.yml"
      - "scripts/audit_kaggle_gap_candidates.py"
  push:
    branches: [main]
    paths:
      - ".github/kaggle-gap-acquisition-request.json"
      - ".github/workflows/kaggle-gap-acquisition-audit.yml"
      - "scripts/audit_kaggle_gap_candidates.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: blinq-kaggle-gap-acquisition-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      REQUEST_FILE: .github/kaggle-gap-acquisition-request.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate fail-closed safety contract
        run: |
          set -euo pipefail
          test "$(jq -r '.mode' "$REQUEST_FILE")" = "audit-backup-only"
          test "$(jq -r '.safety.canonical_mutation' "$REQUEST_FILE")" = "false"
          test "$(jq -r '.safety.provider_api_requests' "$REQUEST_FILE")" = "0"
          test "$(jq -r '.safety.model_promotion' "$REQUEST_FILE")" = "false"
          python -m compileall -q scripts/audit_kaggle_gap_candidates.py

      - name: Verify private destination
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"

      - name: Download exact public Kaggle archives
        run: |
          set -u
          mkdir -p .cache/tbt/kaggle-gap/downloads .cache/tbt/kaggle-gap/unpacked
          : > .cache/tbt/kaggle-gap/download-status.ndjson

          while IFS= read -r slug; do
            safe="$(printf '%s' "$slug" | tr '/:' '__')"
            archive=".cache/tbt/kaggle-gap/downloads/${safe}.zip"
            dest=".cache/tbt/kaggle-gap/unpacked/${safe}"
            mkdir -p "$dest"
            ok=false
            err=""

            if curl --fail --location --retry 6 --retry-delay 3 \
              "https://www.kaggle.com/api/v1/datasets/download/$slug" \
              -o "$archive"; then
              if unzip -q "$archive" -d "$dest"; then
                ok=true
              else
                err="unzip_failed"
              fi
            else
              err="download_failed"
            fi

            bytes=0
            sha=""
            if [[ -s "$archive" ]]; then
              bytes="$(stat -c%s "$archive")"
              sha="$(sha256sum "$archive" | awk '{print $1}')"
            fi

            jq -cn \
              --arg slug "$slug" \
              --arg safe "$safe" \
              --arg err "$err" \
              --arg sha "$sha" \
              --argjson ok "$ok" \
              --argjson bytes "$bytes" \
              '{slug:$slug,safe_name:$safe,download_ok:$ok,download_error:(if $err=="" then null else $err end),archive_bytes:$bytes,archive_sha256:(if $sha=="" then null else $sha end)}' \
              >> .cache/tbt/kaggle-gap/download-status.ndjson
          done < <(jq -r '.sources[].slug' "$REQUEST_FILE")

          jq -s '{sources:.}' .cache/tbt/kaggle-gap/download-status.ndjson \
            > .cache/tbt/kaggle-gap/download-status.json
          cat .cache/tbt/kaggle-gap/download-status.json

      - name: Audit file inventory schemas nulls and leakage fields
        run: |
          set -euo pipefail
          python scripts/audit_kaggle_gap_candidates.py \
            --request "$REQUEST_FILE" \
            --root .cache/tbt/kaggle-gap/unpacked \
            --download-status .cache/tbt/kaggle-gap/download-status.json \
            --out .cache/tbt/kaggle-gap/audit.json

      - name: Persist permanent backup manifests
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          root="$(jq -r '.backup.root' "$REQUEST_FILE")"
          run_id="$GITHUB_RUN_ID"
          audit=".cache/tbt/kaggle-gap/audit.json"

          upload_json() {
            local source="$1"
            local path="$2"
            local message="$3"
            local existing_sha
            local encoded
            existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
            encoded="$(base64 -w0 "$source")"
            if [[ -n "$existing_sha" ]]; then
              gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" \
                -f message="$message" -f content="$encoded" -f sha="$existing_sha" >/dev/null
            else
              gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" \
                -f message="$message" -f content="$encoded" >/dev/null
            fi
          }

          tag="blinq-kaggle-backup-2026-10-07"
          if ! gh release view "$tag" -R "$TBT_DATA_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$TBT_DATA_REPOSITORY" \
              --title "BlinQ Kaggle backup 2026-10-07" \
              --notes "Permanent raw-source backup assets. Canonical DB promotion is separate and fail-closed."
          fi

          while IFS= read -r slug; do
            safe="$(printf '%s' "$slug" | tr '/:' '__')"
            archive=".cache/tbt/kaggle-gap/downloads/${safe}.zip"
            download_ok="$(jq -r --arg s "$slug" '.sources[] | select(.slug==$s) | .download_ok' .cache/tbt/kaggle-gap/download-status.json)"
            license="$(jq -r --arg s "$slug" '.sources[] | select(.slug==$s) | .license_status' "$REQUEST_FILE")"
            sha="$(jq -r --arg s "$slug" '.sources[] | select(.slug==$s) | .archive_sha256 // ""' .cache/tbt/kaggle-gap/download-status.json)"
            bytes="$(jq -r --arg s "$slug" '.sources[] | select(.slug==$s) | .archive_bytes // 0' .cache/tbt/kaggle-gap/download-status.json)"
            asset_name=""
            raw_backup="not_uploaded"

            if [[ "$download_ok" == "true" && -s "$archive" && "$license" != "review_required_other" ]]; then
              asset_name="${safe}-${sha:0:12}.zip"
              cp "$archive" "/tmp/$asset_name"
              gh release upload "$tag" "/tmp/$asset_name" -R "$TBT_DATA_REPOSITORY" --clobber
              raw_backup="release_asset"
            elif [[ "$license" == "review_required_other" ]]; then
              raw_backup="withheld_pending_license_review"
            fi

            manifest="/tmp/${safe}-manifest.json"
            jq \
              --arg slug "$slug" \
              --arg license "$license" \
              --arg sha "$sha" \
              --arg download_ok "$download_ok" \
              --arg raw_backup "$raw_backup" \
              --arg asset_name "$asset_name" \
              --arg release_tag "$tag" \
              --arg run_id "$run_id" \
              --argjson bytes "$bytes" \
              '
              .sources[] | select(.slug == $slug) as $src |
              {
                schema:1,
                project:"BlinQ",
                source:{
                  platform:"Kaggle",
                  slug:$slug,
                  url:("https://www.kaggle.com/datasets/" + $slug),
                  license_status:$license
                },
                acquired_at_utc:"2026-10-07",
                github_run_id:$run_id,
                download_ok:($download_ok == "true"),
                raw_archive:{
                  sha256:(if $sha=="" then null else $sha end),
                  bytes:$bytes,
                  backup_kind:$raw_backup,
                  release_tag:(if $asset_name=="" then null else $release_tag end),
                  asset_name:(if $asset_name=="" then null else $asset_name end)
                },
                audit:$src,
                canonical_mutated:false,
                provider_api_requests:0,
                model_promoted:false,
                promotion_status:"not_evaluated_for_canonical_import"
              }
              ' "$audit" > "$manifest"

            upload_json "$manifest" "$root/$safe/manifest.json" \
              "Backup Kaggle $slug manifest from run $run_id"
          done < <(jq -r '.sources[].slug' "$REQUEST_FILE")

          upload_json "$audit" "$root/_audit.json" \
            "Backup Kaggle acquisition audit from run $run_id"

      - name: Persist latest acquisition audit
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s .cache/tbt/kaggle-gap/audit.json || exit 0
          path="audit/kaggle-gap-download-audit-latest.json"
          existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 .cache/tbt/kaggle-gap/audit.json)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" \
              -f message="Audit Kaggle gap downloads run $GITHUB_RUN_ID" \
              -f content="$encoded" -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" \
              -f message="Audit Kaggle gap downloads run $GITHUB_RUN_ID" \
              -f content="$encoded" >/dev/null
          fi

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-kaggle-gap-audit-${{ github.run_id }}
          path: |
            .cache/tbt/kaggle-gap/download-status.json
            .cache/tbt/kaggle-gap/audit.json
          if-no-files-found: warn
          retention-days: 30
