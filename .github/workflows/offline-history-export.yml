name: Offline canonical history export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export-wta-stats:
    if: ${{ github.head_ref == 'data/wta-stats-2010-2026-export' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install requests

      - name: Export WTA Stats Zone 2010-2026
        run: python scripts/export_wta_stats_2010_2026.py

      - name: Validate CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('artifacts/wta_stats_2010_2026.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          years=sorted({int(r['season']) for r in rows})
          assert years == list(range(2010, 2027)), years
          assert rows
          print({'rows':len(rows),'years':years,'columns':len(rows[0])})
          PY

      - name: Upload WTA CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: wta-stats-2010-2026
          path: |
            artifacts/wta_stats_2010_2026.csv
            artifacts/wta_stats_2010_2026_summary.csv
          if-no-files-found: error
          retention-days: 7
