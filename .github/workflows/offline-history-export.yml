name: Offline canonical history export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export-history:
    if: ${{ github.head_ref == 'audit/library-gap-sources-20261001' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download verified canonical history
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.release_store import ReleaseStore

          out = Path(".cache/tbt/history")
          store = ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", out)
          store.download()
          for year in range(2021, 2027):
              path = out / f"history-{year}.parquet"
              if not path.is_file():
                  raise SystemExit(f"Missing canonical partition: {path}")
              print(path, path.stat().st_size)
          PY

      - name: Upload full canonical history
        uses: actions/upload-artifact@v4
        with:
          name: canonical-history-full
          retention-days: 1
          if-no-files-found: error
          path: |
            .cache/tbt/history/history-*.parquet
            .cache/tbt/history/history_manifest.json
            .cache/tbt/history/_tbt_bundle_manifest.json
