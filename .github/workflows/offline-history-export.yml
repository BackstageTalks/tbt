name: Offline canonical history export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export-history:
    if: ${{ github.head_ref == 'audit/library-gap-sources-20261001' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install history reader dependencies
        run: python -m pip install -r api/requirements.txt -r api/requirements-train.txt

      - name: Download verified canonical history
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.release_store import ReleaseStore

          out = Path(".cache/tbt/history")
          store = ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", out)
          store.download()
          for year in range(2021, 2027):
              path = out / f"history-{year}.parquet"
              if not path.is_file():
                  raise SystemExit(f"Missing canonical partition: {path}")
              print(path, path.stat().st_size)
          PY

      - name: Export canonical audit JSONL
        env:
          PYTHONPATH: api
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities

          matches, safety = sanitize_history_identities(load_partitions(".cache/tbt/history"))
          if safety.get("quarantined_rows"):
              raise SystemExit("Canonical history identity quarantine is non-empty")
          target = Path(".cache/tbt/history/canonical_audit.jsonl.gz")
          with gzip.open(target, "wt", encoding="utf-8") as handle:
              for m in matches:
                  row = {
                      "match_id": str(m.match_id),
                      "tour": str(m.tour or "").lower(),
                      "scheduled_at": m.scheduled_at.isoformat(),
                      "player1_id": str(m.player1_id or ""),
                      "player1_name": str(m.player1_name or ""),
                      "player2_id": str(m.player2_id or ""),
                      "player2_name": str(m.player2_name or ""),
                      "winner_id": str(m.winner_id or ""),
                      "surface": str(m.surface or ""),
                      "tournament": str(m.tournament or ""),
                      "round_name": str(m.round_name or ""),
                      "stats": dict(m.stats or {}),
                  }
                  handle.write(json.dumps(row, ensure_ascii=False, separators=(",", ":")) + "\n")
          print(json.dumps({"rows": len(matches), "bytes": target.stat().st_size, "identity_safety": safety}, indent=2))
          PY

      - name: Upload full canonical history
        uses: actions/upload-artifact@v4
        with:
          name: canonical-history-full
          retention-days: 1
          if-no-files-found: error
          path: |
            .cache/tbt/history/history-*.parquet
            .cache/tbt/history/history_manifest.json
            .cache/tbt/history/_tbt_bundle_manifest.json
            .cache/tbt/history/canonical_audit.jsonl.gz
