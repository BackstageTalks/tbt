name: Read-only CDB 2026 row regression root cause audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cdb-2026-repair-loss-root-cause.yml

permissions:
  contents: read

concurrency:
  group: blinq-cdb-2026-loss-root-cause-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      CDB_REPO: BackstageTalks/tbt-data
      CDB_TAG: tbt-data-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing CDB parser and data safety runtime
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python -m pip install --disable-pip-version-check pandas pyarrow numpy pydantic
      - name: Download checksum verified current CDB 2026 only
        run: |
          set -euo pipefail
          mkdir -p work/current work/view
          python - <<'PY'
          from cdb_global_writer_lock import _remote_lock
          if _remote_lock("BackstageTalks/tbt-data"):
              raise SystemExit("CDB writer active; refuse moving snapshot")
          PY
          gh api "repos/$CDB_REPO/releases/tags/$CDB_TAG" > work/release-before.json
          gh release download "$CDB_TAG" -R "$CDB_REPO" \
            -p history_manifest.json -p _tbt_bundle_manifest.json \
            -p history-2026.parquet -D work/current
          python - <<'PY'
          import json
          from pathlib import Path
          from cdb_wta_verified_window import verified_window
          report=verified_window(Path("work/current"),Path("work/release-before.json"),
                                 Path("work/view"),years=(2026,))
          Path("work/snapshot.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("CDB_2026_SNAPSHOT_SHA",report["partitions"]["2026"]["sha256"])
          PY
      - name: Reproduce raw invalid and deterministic identity shrink without any writes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, tempfile
          from collections import Counter
          from pathlib import Path
          import pandas as pd
          from repair_history_data import invalid_reason
          from tbt.data.history_snapshot import load_snapshot
          from tbt.data.history_safety import sanitize_history_identities
          frame=pd.read_parquet("work/view/history-2026.parquet",engine="pyarrow")
          reasons=Counter()
          bad_rows=[]
          good=[]
          for ix, row in frame.iterrows():
              reason=invalid_reason(row)
              if reason:
                  reasons[reason]+=1
                  bad_rows.append(ix)
              else:
                  good.append(ix)
          with tempfile.TemporaryDirectory() as td:
              staged=Path(td)/"history-2026.parquet"
              frame.loc[good].to_parquet(staged,engine="pyarrow",compression="zstd",index=False)
              parsed=load_snapshot(staged) if good else []
          safe,identity=sanitize_history_identities(parsed)
          report={
              "schema":1, "status":"CDB_2026_REPAIR_LOSS_DIAGNOSTIC_ONLY",
              "canonical_2026_rows":len(frame), "raw_invalid_rows":len(bad_rows),
              "raw_invalid_reasons":dict(sorted(reasons.items())),
              "parseable_rows":len(parsed),"safe_rows_2026_only":len(safe),
              "candidate_row_decrease_2026_only":len(frame)-len(safe),
              "proven_merges_2026_only":identity["merged_rows_removed"],
              "ambiguous_identity_quarantine_2026_only":identity["quarantined_rows"],
              "ambiguous_duplicate_match_ids_count":len(identity["duplicate_match_ids"]),
              "ambiguous_duplicate_provider_ids_count":len(identity["duplicate_provider_event_ids"]),
              "expected_blocked_previous":100663,
              "expected_blocked_proposed":100657,
              "matches_production_block_delta":len(frame)-len(safe)==6,
              "identity_cross_year_not_audited":True,
              "canonical_data_modified":False,"paid_api_calls":0,
              "import_allowed":False,
              "canonical_sha256":json.loads(Path("work/snapshot.json").read_text())["partitions"]["2026"]["sha256"]
          }
          # The three raw provider-ID collisions are metadata only; never promote
          # a conflicting event ID to a new canonical match or erase either row.
          from tbt.data.history_snapshot import _provider_event_id
          from collections import defaultdict
          import hashlib
          groups=defaultdict(list)
          for m in parsed:
              eid=_provider_event_id(m)
              if eid and eid in identity["duplicate_provider_event_ids"]:
                  groups[eid].append(m)
          if len(groups)!=3 or sorted(map(len,groups.values())) != [2,2,2]:
              raise SystemExit("Unexpected collision shape; preserve current CDB")
          def digest(value):
              return hashlib.sha256(str(value).encode()).hexdigest()[:16]
          collision_groups=[]
          for eid, matches in sorted(groups.items()):
              tour={str(m.tour).lower() for m in matches}
              pairs={tuple(sorted(map(str,(m.player1_id,m.player2_id)))) for m in matches}
              timestamps={m.scheduled_at.isoformat() for m in matches}
              tournaments={str(m.tournament).casefold().strip() for m in matches}
              entries=[]
              for m in matches:
                  c=m.provider_payload if isinstance(m.provider_payload,dict) else {}
                  witness=c.get("_tbt_event_identity")
                  witness=witness if isinstance(witness,dict) else {}
                  entries.append({
                      "match_id_sha16":digest(m.match_id),
                      "tour":str(m.tour).lower(),
                      "date_utc":m.scheduled_at.isoformat(),
                      "tournament":str(m.tournament)[:100],
                      "tournament_id":str(m.tournament_id or ""),
                      "round":str(m.round_name or ""),
                      "source_category_id":c.get("_tbt_source_category_id"),
                      "provider_claim_keys":sorted(key for key in (
                          "_tbt_provider_event_id","provider_event_id","event_id","eventId","id")
                          if c.get(key) not in (None,"")),
                      "explicit_native_claim":bool(c.get("_tbt_provider_event_id")),
                      "witness_present":bool(witness),
                      "witness_status":str(witness.get("status") or ""),
                      "witness_event_id_agrees":str(witness.get("event_id") or "")==eid,
                      "witness_player_ids_agree":set(map(str,(
                          witness.get("home"),witness.get("away")))) ==
                          set(map(str,(m.player1_id,m.player2_id))),
                      "player_pair_sha16":digest(tuple(sorted(map(str,(m.player1_id,m.player2_id))))),
                      "winner_is_player":str(m.winner_id) in set(map(str,(
                          m.player1_id,m.player2_id))),
                      "stats_cells":sum(v is not None for v in (m.stats or {}).values()),
                  })
              collision_groups.append({
                  "native_id_sha16":digest(eid),
                  "rows":len(matches),
                  "cross_tour":len(tour)>1,
                  "different_players":len(pairs)>1,
                  "different_start_time":len(timestamps)>1,
                  "different_tournament":len(tournaments)>1,
                  "entries":entries,
              })
          context={
              "schema":1,"state":"CDB_2026_DUPLICATE_ID_CONTEXT_REVIEW",
              "groups":collision_groups,"rows":6,
              "source_identity_unverified":True,
              "cdb_writes":0,"paid_api_requests":0,
              "live_sha256":report["canonical_sha256"],
          }
          Path("work/collision-context.json").write_text(
              json.dumps(context,ensure_ascii=False,indent=2,sort_keys=True)+"\\n")
          print("CDB_COLLISION_PAIR_SHAPES",
                json.dumps([{"rows":x["rows"],"cross_tour":x["cross_tour"],
                 "different_players":x["different_players"],
                 "different_start_time":x["different_start_time"],
                 "different_tournament":x["different_tournament"]}
                 for x in collision_groups],sort_keys=True))
          Path("work/root-cause.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True))
          if len(frame)!=100663:
              raise SystemExit("Expected CDB 2026 snapshot moved; do not infer root cause")
          PY
      - name: Independently verify stable CDB year release and report digest
        run: |
          set -euo pipefail
          gh api "repos/$CDB_REPO/releases/tags/$CDB_TAG" > work/release-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          from cdb_global_writer_lock import _remote_lock
          if _remote_lock("BackstageTalks/tbt-data"):
              raise SystemExit("CDB writer became active; audit cannot be attributed")
          a=json.loads(Path("work/release-before.json").read_text())
          b=json.loads(Path("work/release-after.json").read_text())
          names={"history-2026.parquet","history_manifest.json","_tbt_bundle_manifest.json"}
          def pins(x):
              return {v["name"]:(v["id"],v["digest"]) for v in x["assets"] if v["name"] in names}
          if len(pins(a))!=3 or pins(a)!=pins(b):
              raise SystemExit("CDB release moved during analysis")
          print("CDB_RELEASE_STABLE_AND_LOCK_FREE")
          PY
          (cd work && sha256sum snapshot.json root-cause.json collision-context.json > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Keep aggregate root-cause report (no CDB parquet)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdb-2026-repair-root-cause-${{ github.run_id }}
          path: |
            work/snapshot.json
            work/root-cause.json
            work/collision-context.json
            work/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
