name: Audit library all_matches enrichment

on:
  push:
    branches:
      - library-all-matches-enrichment
    paths:
      - '.github/workflows/library-all-matches-audit.yml'
      - 'scripts/link_offline_serve_return.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }

      - name: Download canonical history and library enrichment asset
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_production_preflight_inputs.py
          mkdir -p .cache/tbt/library-all-matches
          gh release download tbt-training-table-v1 \
            --repo "$TBT_DATA_REPOSITORY" \
            --pattern all_matches_matchlevel_1991_2018.csv.gz \
            --dir .cache/tbt/library-all-matches \
            --clobber
          gzip -dc .cache/tbt/library-all-matches/all_matches_matchlevel_1991_2018.csv.gz \
            > .cache/tbt/library-all-matches/all_matches_matchlevel_1991_2018.csv
          test -s .cache/tbt/library-all-matches/all_matches_matchlevel_1991_2018.csv

      - name: Link only - no canonical mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/library-all-matches/link
          python scripts/link_offline_serve_return.py \
            --history-dir .cache/tbt/history \
            --all-matches-csv .cache/tbt/library-all-matches/all_matches_matchlevel_1991_2018.csv \
            --out-dir .cache/tbt/library-all-matches/link
          cat .cache/tbt/library-all-matches/link/report.json

      - name: Assert safe audit contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".cache/tbt/library-all-matches/link/report.json")
          r=json.loads(p.read_text())
          counts=r.get("counts") or {}
          if r.get("canonical_rows",0) < 1000:
              raise SystemExit("canonical history unexpectedly small")
          if counts.get("stat_conflict_matches",0) > 0:
              print("Stat conflicts detected; audit remains fail-closed")
          print(json.dumps({
              "canonical_rows": r.get("canonical_rows"),
              "source_rows": r.get("source_rows"),
              "counts": counts,
              "quality_ready_before": r.get("quality_ready_before"),
              "projected_quality_ready": r.get("projected_quality_ready"),
              "projected_quality_ready_added": r.get("projected_quality_ready_added"),
          }, indent=2))
          PY
