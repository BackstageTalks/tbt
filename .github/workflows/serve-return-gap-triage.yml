name: BlinQ serve-return gap triage (offline)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/serve-return-gap-triage.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tbt-serve-return-readonly-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      RAPIDAPI_KEY: ''
      PROPL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install dependencies and verify private release
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q scripts/audit_serve_return_gaps.py
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = PRIVATE
      - name: Download committed history and classify missing quality
        run: |
          set -euo pipefail
          python scripts/audit_serve_return_gaps.py
      - name: Publish measured gap
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('.cache/tbt/serve-return-triage/report.json').read_text())
          c=r['overall']
          print('# Serve+return gap audit — read-only, 0 provider requests')
          print(f"- Completed: {c['completed']:,}")
          print(f"- Any statistics: {c['any_stats']:,} ({r['any_stats_rate']:.2%})")
          print(f"- Both players ready: {c.get('both_ready',0):,} ({r['both_ready_rate']:.2%})")
          print(f"- One player ready: {c.get('one_player_ready',0):,}")
          print(f"- Partial without complete player: {c.get('partial_no_player_ready',0):,}")
          print(f"- No statistics: {c.get('no_statistics',0):,}")
          print(f"- Additional matches for 30%: {r['gap_to_30pct']:,}")
          print(f"- Additional matches for 40%: {r['gap_to_40pct']:,}")
          print('## Breakdown by tour')
          for k,v in r['by_tour'].items():
              print(f"- {k}: {v}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serve-return-gap-triage-${{ github.run_id }}
          path: .cache/tbt/serve-return-triage/report.json
          if-no-files-found: warn
          retention-days: 14
