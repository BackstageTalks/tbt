name: BlinQ uploaded 2025-26 direct native event clock discrepancy audit
'on':
  pull_request:
    paths:
      - scripts/audit_uploaded_clock_bridge.py
      - tests/test_audit_uploaded_clock_bridge.py
      - .github/workflows/blinq-uploaded-2025-26-clock-bridge-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blinq-upload-clock-proof-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify read-only script and temporal regression tests
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python -m compileall -q scripts/audit_uploaded_clock_bridge.py
          python -m unittest discover -s tests -p test_audit_uploaded_clock_bridge.py -v
