name: BlinQ uploaded 2025-26 direct native event clock discrepancy audit
'on':
  pull_request:
    paths:
      - scripts/audit_uploaded_clock_bridge.py
      - tests/test_audit_uploaded_clock_bridge.py
      - .github/workflows/blinq-uploaded-2025-26-clock-bridge-probe.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/blinq-uploaded-2025-26-clock-bridge-probe.yml
permissions:
  contents: read
concurrency:
  group: blinq-upload-clock-proof-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify read-only script and temporal regression tests
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python -m compileall -q scripts/audit_uploaded_clock_bridge.py
          python -m unittest discover -s tests -p test_audit_uploaded_clock_bridge.py -v
  independent-proof:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      REPO: BackstageTalks/tbt-data
      TAG: tbt-data-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check private source and canonical repository
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/$REPO --jq .private)" = true
          python -m pip install -q 'pyarrow>=17,<25' 'pandas>=2,<3'
          mkdir -p work/probe-current work/probe-source work/probe-result
      - name: Retrieve private SHA-pinned source/index and current CDB years
        run: |
          set -euo pipefail
          gh release download blinq-uploaded-2025-26-source-layer-8202ff4b4854-v1 \
            -R "$REPO" -p source-statistics-validated-stage.jsonl.gz -D work/probe-source
          gh release download "$TAG" -R "$REPO" \
            -p 'blinq-flashscore-event-index-2026.jsonl.gz' \
            -D work/probe-source
          gh release download "$TAG" -R "$REPO" \
            -p 'history-2024.parquet' -p 'history-2025.parquet' -p 'history-2026.parquet' \
            -p 'history_manifest.json' -p '_tbt_bundle_manifest.json' -D work/probe-current
          echo 'e66e6de58d70801fe2dca7b049f75f442237516a7e5042947b892d63daa1dae8  work/probe-source/source-statistics-validated-stage.jsonl.gz' | sha256sum -c
          echo '328f9c36c0f4021c745ca7119ea904a4ae7cadb66cee17cc63f2ca6f5774a952  work/probe-source/blinq-flashscore-event-index-2026.jsonl.gz' | sha256sum -c
      - name: Reconcile native event and exact player/score/4-count proof with clock distributions
        env:
          PYTHONPATH: api:scripts
        run: |
          set -euo pipefail
          python scripts/audit_uploaded_clock_bridge.py \
            --source work/probe-source/source-statistics-validated-stage.jsonl.gz \
            --index work/probe-source/blinq-flashscore-event-index-2026.jsonl.gz \
            --history work/probe-current --out work/probe-result
          python - <<'PY'
          import json
          r=json.load(open('work/probe-result/report.json'))
          assert r['counts']['source_rows']==9741
          assert r['canonical_cells_written']==0
          assert r['model_training'] is False
          assert r['potential_candidates_not_import_ready']>=0
          print('NATIVE_ID_CLOCK_AUDIT',json.dumps({'counts':r['counts'], 'clock_buckets':r['clock_discrepancy_buckets']}))
          PY
      - name: Store independent report only in private research release and read back
        run: |
          set -euo pipefail
          (cd work/probe-result && sha256sum report.json private-candidates.jsonl.gz private-conflicts.jsonl.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
          audit_tag="blinq-uploaded-clock-bridge-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$audit_tag" work/probe-result/* -R "$REPO" \
            --title 'Private uploaded native-event/clock discrepancy audit' \
            --notes 'Read-only current canonical 2024-2026 read, SHA pinned. No import or new training; candidate links require protected writer.'
          mkdir -p work/probe-readback
          gh release download "$audit_tag" -R "$REPO" -D work/probe-readback
          (cd work/probe-readback && sha256sum -c SHA256SUMS)
          cmp work/probe-result/report.json work/probe-readback/report.json
          echo "PRIVATE_CANONICAL_CLOCK_READBACK_VERIFIED=$audit_tag"