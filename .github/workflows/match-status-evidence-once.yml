name: BlinQ six unresolved status evidence (read-only once)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-status-evidence-once.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blinq-match-status-evidence-six
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      BLINQ_SHARED_API_BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
      BLINQ_SHARED_API_BUDGET_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      BLINQ_SHARED_API_BUDGET_PURPOSE: match
      PYTHONPATH: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r api/requirements.txt
      - name: Probe exact six event state with shared budget and no writes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAPIDAPI_KEY"
          test -n "$BLINQ_SHARED_API_BUDGET_TOKEN"
          python - <<'PY'
          import json
          from datetime import date, datetime, timezone
          from tbt.providers.rapidapi import RapidTennisClient
          from tbt.services.match_status import classify_finished_event, _provider_rows, _provider_event_id, _status_text, _explicitly_nonterminal_status
          from tbt.config import settings
          expected = {
              "17306129": ("145008","157302","157302"),
              "17305888": ("326246","79223","326246"),
              "17305722": ("223513","79467","223513"),
              "17304964": ("302567","232059","302567"),
              "17301355": ("163438","201681","163438"),
              "17302006": ("417196","342909","342909"),
          }
          client = RapidTennisClient(settings)
          client.request_limit = 10
          client.retry_attempts = 1
          client.client.timeout = 6
          try:
              payload = client.events_for_status_day(date(2026,10,12), target_event_ids=set(expected), max_category_requests=8)
              all_rows = _provider_rows(payload)
              from pathlib import Path
              Path('/tmp/blinq-status-daily.json').write_text(json.dumps({'events':all_rows}), encoding='utf-8')
              report = []
              for eid,(p1,p2,selection) in expected.items():
                  candidates=[r for r in all_rows if _provider_event_id(r)==eid]
                  observations=[]
                  for event in candidates[:3]:
                      home=event.get("homeTeam") if isinstance(event.get("homeTeam"),dict) else {}
                      away=event.get("awayTeam") if isinstance(event.get("awayTeam"),dict) else {}
                      actual={str(home.get("id") or ""),str(away.get("id") or "")}
                      status=_status_text(event)
                      raw_wc=event.get("winnerCode")
                      raw_wid=event.get("winnerId") or event.get("winner_id") or event.get("winnerTeamId")
                      hs=event.get("homeScore") if isinstance(event.get("homeScore"),dict) else {}
                      as_=event.get("awayScore") if isinstance(event.get("awayScore"),dict) else {}
                      row={"event_id":eid,"player1":{"id":p1},"player2":{"id":p2},"betting":{"selection_id":selection}}
                      outcome=classify_finished_event(row,event,checked_at=datetime.now(timezone.utc))
                      observations.append({
                         "provider_id":_provider_event_id(event), "status":status[:85],
                         "nonterminal":_explicitly_nonterminal_status(status),
                         "identity_exact":actual=={p1,p2},"provider_players":sorted(actual),
                         "winner_code":str(raw_wc)[:18], "winner_id":str(raw_wid)[:20],
                         "score_home":[hs.get("period"+str(i)) for i in range(1,6)],
                         "score_away":[as_.get("period"+str(i)) for i in range(1,6)],
                         "has_status_object":isinstance(event.get("status"),dict),
                         "classified":(outcome or {}).get("status"),
                         "field_names":sorted(k for k in event.keys() if k in {"status","winnerCode","winnerId","winner_id","winnerTeamId","homeScore","awayScore","homeTeam","awayTeam","id","eventId"}),
                      })
                  report.append({"event_id":eid,"seen":len(candidates),"observations":observations})
              print("STATUS_EVIDENCE_ONLY "+json.dumps({
                "schema":1,"date":"2026-10-12","requested":len(expected),
                "events_in_bounded_daily_list":len(all_rows),
                "provider_requests":client.request_count,
                "no_cdb_writes":True,"no_prediction_writes":True,
                "events":report,
              },sort_keys=True))
          finally:
              client.close()
          PY
      - name: Stage only verified full-score CDB evidence; no canonical writes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          mkdir -p /tmp/blinq-private-feed
          gh release download tbt-predictions-v1 --repo BackstageTalks/tbt-data --pattern feed.json --dir /tmp/blinq-private-feed --clobber
          test -s /tmp/blinq-private-feed/feed.json
          python - <<'PY'
          import hashlib, json
          from collections import defaultdict, Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from tbt.services.match_status import (
              prediction_rows, classify_finished_event, _provider_event_id,
              _status_text, _explicitly_nonterminal_status, _verified_final_score_stats,
              _player_id, _selection_id
          )
          feed_path=Path('/tmp/blinq-private-feed/feed.json')
          feed=json.loads(feed_path.read_text(encoding='utf-8'))
          source=json.loads(Path('/tmp/blinq-status-daily.json').read_text(encoding='utf-8'))
          events=defaultdict(list)
          for event in source.get('events',[]):
              if isinstance(event,dict) and _provider_event_id(event):
                  events[_provider_event_id(event)].append(event)
          now=datetime(2026,10,12,21,30,tzinfo=timezone.utc)
          rows=prediction_rows(feed,now=now)
          candidates=[]
          quarantined=[]
          reasons=Counter()
          for eid,row in sorted(rows.items()):
              def reject(reason):
                  reasons[reason]+=1
                  quarantined.append({'event_id':eid,'reason':reason})
              scheduled=str(row.get('scheduled_at') or row.get('date') or '')
              if not scheduled.startswith('2026-10-12'):
                  reject('outside_target_day');continue
              provider_events=events.get(eid,[])
              if len(provider_events)!=1:
                  reject('missing_or_duplicate_provider_event');continue
              event=provider_events[0]
              status=_status_text(event)
              if _explicitly_nonterminal_status(status):
                  reject('provider_nonterminal_'+str(status.split(' ')[0])[:26]);continue
              home=event.get('homeTeam') if isinstance(event.get('homeTeam'),dict) else {}
              away=event.get('awayTeam') if isinstance(event.get('awayTeam'),dict) else {}
              home_id=str(home.get('id') or '').strip()
              away_id=str(away.get('id') or '').strip()
              p1,p2=_player_id(row,'player1'),_player_id(row,'player2')
              if not p1 or not p2 or p1==p2 or {home_id,away_id}!={p1,p2}:
                  reject('unverified_player_identity');continue
              tour=str(row.get('tour') or '').lower().strip()
              names=[str((row.get(k) or {}).get('name') or '') for k in ('player1','player2')]
              if tour not in {'atp','wta'} or any('/' in name for name in names) or str(row.get('format') or '').lower()=='doubles':
                  reject('tour_or_singles_unverified');continue
              outcome=classify_finished_event(row,event,checked_at=now)
              if not outcome or outcome.get('status') not in {'win','loss'}:
                  reject('not_verified_final_winner');continue
              stats=_verified_final_score_stats(row,event)
              if not stats or stats.get('total_sets') not in (2,3,4,5) or stats.get('total_games',0)<12:
                  reject('complete_set_scores_unverified');continue
              winner=str(outcome.get('winner_id') or '')
              if winner not in {home_id,away_id}:
                  reject('winner_identity_invalid');continue
              # Strictly validated final sets, no inference from total games alone.
              hs=event.get('homeScore') if isinstance(event.get('homeScore'),dict) else {}
              as_=event.get('awayScore') if isinstance(event.get('awayScore'),dict) else {}
              sets=[]
              for i in range(1,1+stats['total_sets']):
                  sets.append([int(hs['period'+str(i)]),int(as_['period'+str(i)])])
              candidates.append({
                  'source':'rapidapi_tennisapi_daily_event',
                  'provider_event_id':eid,
                  'scheduled_at':scheduled,
                  'tour':tour,
                  'player1_provider_id':p1,
                  'player2_provider_id':p2,
                  'provider_home_id':home_id,
                  'provider_away_id':away_id,
                  'winner_provider_id':winner,
                  'provider_status':status,
                  'set_scores_home_away':sets,
                  'total_sets':stats['total_sets'],
                  'total_games':stats['total_games'],
                  'canonical_match_id':None,
                  'cdb_import_allowed':False,
                  'reason':'requires_exact_canonical_identity_and_partition_readback',
              })
          counts=Counter(v['provider_event_id'] for v in candidates)
          if any(n!=1 for n in counts.values()):
              raise SystemExit('Duplicate provider event in verified candidates')
          # The production status worker proves 26 tracked fixtures for this
          # day. A different private release is NOT a verified deployed cohort.
          # Retain factual sidecar rows for audit, but quarantine canonical
          # import eligibility until the exact production feed SHA is available.
          production_cohort_count=26
          feed_cohort_matches_production=len(rows)==production_cohort_count
          stage={
             'schema':1,'source_date':'2026-10-12',
             'status':'SOURCE_AUDIT_ONLY' if feed_cohort_matches_production else 'SOURCE_COHORT_DRIFT_QUARANTINED',
             'source_release_fixtures':len(rows),
             'production_worker_tracked_fixtures':production_cohort_count,
             'source_cohort_matches_production':feed_cohort_matches_production,
             'canonical_import_candidate_count':0,
             'feed_sha256':hashlib.sha256(feed_path.read_bytes()).hexdigest(),
             'source_event_count':len(source.get('events',[])),
             'published_fixtures':len(rows),
             'verified_final_score_candidates':len(candidates),
             'quarantined':len(quarantined),
             'quarantine_reasons':dict(sorted(reasons.items())),
             'cdb_canonical_rows_written':0,
             'cdb_import_authorized':False,
             'point_in_time_model_inputs_unchanged':True,
             'requires':['current canonical 2026 partition SHA256','exact event+player identity crosswalk','unique canonical match ID or verified missing-new-match gate','single-writer lock','dry-run and whole-partition readback'],
             'candidates':candidates,
             'quarantine':quarantined,
          }
          out=Path('match-status-20261012-cdb-evidence.json')
          out.write_text(json.dumps(stage,sort_keys=True,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('CDB_SAFE_EVIDENCE_STAGE '+json.dumps({
            k:stage[k] for k in ('published_fixtures','verified_final_score_candidates','quarantined','quarantine_reasons','cdb_canonical_rows_written','feed_sha256')
          },sort_keys=True))
          PY
      - name: Save immutable, quarantined CDB evidence stage
        uses: actions/upload-artifact@v4
        with:
          name: match-status-20261012-cdb-evidence
          path: match-status-20261012-cdb-evidence.json
          retention-days: 30
          if-no-files-found: error
