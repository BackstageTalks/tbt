name: BlinQ governed historical facts integration — all current sources
on:
  push:
    branches: [ops/blinq-canonical-snapshot-20261009]
    paths: [.github/workflows/blinq-canonical-safe-facts-20261009.yml]
  workflow_dispatch:

permissions:
  contents: read

# Share the canonical single-writer lock with every existing production history writer.
concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  enrich_missing_canonical_facts:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Validate script syntax and private destination
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/research/promote_verified_missing_match_facts.py scripts/research/nightly_private_canonical_gap_scan.py scripts/import_blinq_offline_bundle.py scripts/link_pointbypoint_serve_return.py scripts/import_offline_linked_serve_return.py
          test -n "$GH_TOKEN" || exit 1
          test "$(gh repo view BackstageTalks/tbt-data --json visibility -q .visibility)" = "PRIVATE" || exit 1
      - name: Install existing deterministic history/schema dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements-train.txt
      - name: Execute fact-only staging, strict proof gates, private canonical publish and SHA readback
        run: python -u scripts/research/promote_verified_missing_match_facts.py
      # Never upload canonical data or generated audit into the PUBLIC app repository.
