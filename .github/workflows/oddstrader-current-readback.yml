name: Read-only current OddsTrader canonical marker reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/oddstrader-current-readback.yml"
      - "scripts/audit_oddstrader_current_cdb.py"
      - "tests/test_audit_oddstrader_current_cdb.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  current-cdb-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
      ROOT: .cache/tbt/oddstrader-current-readback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Focused no-write and corruption-regression tests
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_audit_oddstrader_current_cdb.py
          python -m compileall -q scripts/audit_oddstrader_current_cdb.py
      - name: Download independently hashed current private CDB bundle
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = PRIVATE
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore
          root=Path(os.environ["ROOT"])/"history"
          files=ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",
                             root).download(require_bundle_manifest=True)
          print("CDB_HASH_VERIFIED_ASSETS",len(files))
          PY
      - name: Verify persisted 2015-2026 market markers against prior import
        run: |
          set -euo pipefail
          python scripts/audit_oddstrader_current_cdb.py \
             --history-dir "$ROOT/history" --report "$ROOT/oddstrader-readback.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["ROOT"])/"oddstrader-readback.json").read_text())
          assert r["status"]=="VERIFIED_CURRENT_CDB_MARKERS_READ_ONLY"
          assert r["current_markers_oddstrader"]["_tbt_market_history"]>=11935
          assert r["current_markers_oddstrader"]["_tbt_match_winner_odds"]>=283
          assert len(r["year_partitions"])==12
          assert r["production_cdb_mutated"] is False
          assert r["model_promoted"] is False
          assert r["provider_api_requests"]==0
          print("CURRENT_MARKET_HISTORY_READBACK",json.dumps(r,sort_keys=True))
          PY
      - name: Retain immutable per-run source reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-oddstrader-current-readback-${{ github.run_id }}
          path: .cache/tbt/oddstrader-current-readback/oddstrader-readback.json
          if-no-files-found: warn
          retention-days: 45
