name: BlinQ Wimbledon 2023 isolated canonical field audit

on:
  pull_request:
    paths:
      - ".github/workflows/wimbledon-2023-cdb-stage.yml"
      - "scripts/audit_wimbledon_2023_cdb_stage.py"
      - "tests/test_wimbledon_2023_cdb_stage.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Focused source integrity and classification contract tests
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt pytest jsonschema openpyxl
          python -m pytest -q tests/test_wimbledon_2023_cdb_stage.py
          python -m compileall -q scripts/audit_wimbledon_2023_cdb_stage.py

      - name: Read-only acquire private source, prior sidecar, current 2023 CDB and schema
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"
          mkdir -p .cache/wimbledon-pilot/raw .cache/wimbledon-pilot/cdb .cache/wimbledon-pilot/out
          gh release download tbt-research-sources-v1 -R "$TBT_DATA_REPOSITORY" -p figshare-wimbledon-2023-ccby4.xlsx -D .cache/wimbledon-pilot/raw
          gh release download tbt-research-sources-v1 -R "$TBT_DATA_REPOSITORY" -p figshare-wimbledon-2023-LICENSE-NOTE.txt -D .cache/wimbledon-pilot/raw
          gh release download tbt-research-sources-v1 -R "$TBT_DATA_REPOSITORY" -p wimbledon-2023-advanced-points.jsonl.gz -D .cache/wimbledon-pilot/raw
          (
            cd .cache/wimbledon-pilot/raw
            printf '%s  %s\n' 19507e156e6ff307027d39e44000ac446a564f87b3c8d59a5225dc6d1674c512 figshare-wimbledon-2023-ccby4.xlsx \
              4b1a12b70abaaa9536dc0e371c177549863d131db3bc273e6768354f3b1e1df9 figshare-wimbledon-2023-LICENSE-NOTE.txt \
              8c9b00eb96582cb5bfe3449b0bdb2dffbfb11d3fc387e54e142d645e6d43e316 wimbledon-2023-advanced-points.jsonl.gz | sha256sum -c -
          )
          gh release download tbt-data-v1 -R "$TBT_DATA_REPOSITORY" -p history-2023.parquet -D .cache/wimbledon-pilot/cdb
          gh release download tbt-data-v1 -R "$TBT_DATA_REPOSITORY" -p history_manifest.json -D .cache/wimbledon-pilot/cdb
          gh api "repos/$TBT_DATA_REPOSITORY/releases/tags/tbt-data-v1" > .cache/wimbledon-pilot/cdb/release.json
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$TBT_DATA_REPOSITORY/contents/audit/import-preparation/observation.schema.json?ref=main" \
            > .cache/wimbledon-pilot/observation.schema.json

      - name: Strict one-year replay and four-state source classification
        run: |
          set -euo pipefail
          python scripts/audit_wimbledon_2023_cdb_stage.py \
            --workbook .cache/wimbledon-pilot/raw/figshare-wimbledon-2023-ccby4.xlsx \
            --license-note .cache/wimbledon-pilot/raw/figshare-wimbledon-2023-LICENSE-NOTE.txt \
            --sidecar .cache/wimbledon-pilot/raw/wimbledon-2023-advanced-points.jsonl.gz \
            --year-file .cache/wimbledon-pilot/cdb/history-2023.parquet \
            --manifest .cache/wimbledon-pilot/cdb/history_manifest.json \
            --release-metadata .cache/wimbledon-pilot/cdb/release.json \
            --schema-file .cache/wimbledon-pilot/observation.schema.json \
            --out-dir .cache/wimbledon-pilot/out
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path(".cache/wimbledon-pilot/out")
          report=json.loads((out/"report.json").read_text())
          rows=[json.loads(line) for line in (out/"observations.jsonl").read_text().splitlines() if line.strip()]
          assert report["status"]=="read_only_classified"
          assert report["production_mutated"] is False and report["write_authorized"] is False
          assert report["model_promoted"] is False and report["model_training_performed"] is False
          assert report["api_requests"]==0
          assert report["counts"]["raw_matches"]==report["counts"]["linked_matches_compared"]==5
          assert report["counts"]["raw_points"]==774
          assert report["observation_rows"]==len(rows)==20
          assert sum(report["counts"].get(x,0) for x in
                     ("READY_MISSING","ALREADY_PRESENT","CONFLICT","UNRESOLVED"))==20
          print("WIMBLEDON_READONLY_CLASSIFICATION:",json.dumps(report,sort_keys=True))
          PY

      - name: Retain immutable run evidence without altering CDB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-wimbledon-2023-cdb-stage-${{ github.run_id }}
          path: |
            .cache/wimbledon-pilot/out/report.json
            .cache/wimbledon-pilot/out/observations.jsonl
            .cache/wimbledon-pilot/out/quarantine.jsonl
          if-no-files-found: warn
          retention-days: 45
