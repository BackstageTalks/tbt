name: One-time cleanup of stale skipped PR checks

on:
  push:
    branches:
      - maintenance/gh-cleanup-20261101-30d
    paths:
      - .github/workflows/gh-cleanup-skipped-pr-runs.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: blinq-one-time-gh-skipped-pr-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: "false"
      CUTOFF_UTC: "2026-10-02T00:00:00Z"
    steps:
      - name: Inventory only two retired no-op PR check types
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          repo=os.environ["GITHUB_REPOSITORY"]
          base=f"https://api.github.com/repos/{repo}"
          cutoff=dt.datetime.fromisoformat(os.environ["CUTOFF_UTC"].replace("Z","+00:00"))
          allowed={"Offline canonical history export","Offline new-source coverage audit"}

          def api(path):
              request=urllib.request.Request(base+path, headers={
                  "Authorization": "Bearer "+os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "BlinQ-safe-GH-housekeeping"
              })
              with urllib.request.urlopen(request,timeout=25) as response:
                  return json.loads(response.read())

          candidate=[]
          for page in range(1,8):
              query=urllib.parse.urlencode({
                  "event":"pull_request","status":"skipped","created":"<2026-10-02",
                  "per_page":100,"page":page})
              runs=api("/actions/runs?"+query).get("workflow_runs",[])
              for run in runs:
                  stamp=dt.datetime.fromisoformat(run["created_at"].replace("Z","+00:00"))
                  if run["name"] not in allowed or run["event"]!="pull_request" or run["conclusion"]!="skipped" or stamp>=cutoff:
                      continue
                  if run["head_branch"] in {"main","master"}:
                      continue
                  art=api(f"/actions/runs/{run['id']}/artifacts")
                  if art.get("total_count") != 0:
                      continue
                  candidate.append({
                      "id":run["id"],"name":run["name"],"event":run["event"],
                      "conclusion":run["conclusion"],"created_at":run["created_at"],
                      "head_branch":run["head_branch"],"head_sha":run["head_sha"],
                      "html_url":run["html_url"],"artifacts":0})
              if len(runs)<100:
                  break
          assert len(candidate)<=50, f"Candidate count above audited safety bound: {len(candidate)}"
          assert len({x["id"] for x in candidate})==len(candidate)
          record={"schema":1,"repo":repo,"dry_run":os.environ["DRY_RUN"]=="true",
                  "cutoff_utc":os.environ["CUTOFF_UTC"],"allowed_names":sorted(allowed),
                  "candidate_count":len(candidate),"candidates":candidate}
          data=(json.dumps(record,indent=2,sort_keys=True)+"\n").encode()
          pathlib.Path("gh-cleanup-manifest.json").write_bytes(data)
          print("Candidates:",len(candidate),"SHA256 manifest:",hashlib.sha256(data).hexdigest())
          print("Protected: all CDB/DIL/data/model/import/deploy workflows and all artifacts")
          PY
      - name: Preserve read-only audit manifest for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: gh-skipped-pr-cleanup-manifest
          path: gh-cleanup-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Delete vetted runs, then independently read back
        if: env.DRY_RUN == 'false'
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.request

          base=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          manifest=json.load(open("gh-cleanup-manifest.json"))
          allowed={"Offline canonical history export","Offline new-source coverage audit"}
          cutoff=dt.datetime.fromisoformat(os.environ["CUTOFF_UTC"].replace("Z","+00:00"))

          def api(method,path):
              req=urllib.request.Request(base+path,method=method,headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"BlinQ-safe-GH-housekeeping"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      body=response.read()
                      return response.status,json.loads(body) if body else None
              except urllib.error.HTTPError as e:
                  if e.code==404:
                      return 404,None
                  raise

          assert 0<=manifest["candidate_count"]<=50
          verified=[]
          for item in manifest["candidates"]:
              status,run=api("GET",f"/actions/runs/{item['id']}")
              assert status==200
              stamp=dt.datetime.fromisoformat(run["created_at"].replace("Z","+00:00"))
              assert run["event"]=="pull_request" and run["conclusion"]=="skipped"
              assert run["name"] in allowed and stamp<cutoff
              assert run["head_branch"] not in {"main","master"}
              assert run["head_sha"]==item["head_sha"]
              status,arts=api("GET",f"/actions/runs/{item['id']}/artifacts")
              assert status==200 and arts["total_count"]==0
              verified.append(item["id"])
          deleted=[]
          for run_id in verified:
              status,_=api("DELETE",f"/actions/runs/{run_id}")
              assert status==204, (run_id,status)
              deleted.append(run_id)
          for run_id in deleted:
              status,_=api("GET",f"/actions/runs/{run_id}")
              assert status==404, (run_id,status)
          print(json.dumps({"deleted":len(deleted),"readback_404":len(deleted),
                            "protected":"CDB/DIL/import/model/source/assets and all unskipped runs"},
                           sort_keys=True))
          PY
