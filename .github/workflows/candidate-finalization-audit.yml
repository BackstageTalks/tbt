name: Candidate finalization audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/candidate-finalization-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install training dependencies
        run: python -m pip install --retries 8 --timeout 60 -r api/requirements-train.txt
      - name: Inspect exact candidate and champion governance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          from tbt.models.artifact import load_model
          from pipeline import _promotion_metric_gate

          repo=os.environ["TBT_DATA_REPOSITORY"]
          root=Path(".cache/tbt/finalization-audit")
          cdir=root/"candidate"
          pdir=root/"production"

          candidate=ReleaseStore(repo,"tbt-model-candidate-v1",cdir)
          production=ReleaseStore(repo,"tbt-model-production-v1",pdir)
          candidate.download(
              extra_names=("model.joblib","training_report.json","promotion_history.json"),
              required_names=("model.joblib","training_report.json","promotion_history.json"),
          )
          production_assets=production._asset_names()
          production.download(
              extra_names=("model.joblib","training_report.json","promotion_history.json"),
              required_names=("model.joblib","training_report.json") + (
                  ("promotion_history.json",) if "promotion_history.json" in production_assets else ()
              ),
          )

          cm=load_model(str(cdir/"model.joblib"))
          pm=load_model(str(pdir/"model.joblib"))
          cr=json.loads((cdir/"training_report.json").read_text())
          ch=json.loads((cdir/"promotion_history.json").read_text())
          ph=(json.loads((pdir/"promotion_history.json").read_text())
              if (pdir/"promotion_history.json").exists() else [])

          decision=cr.get("promotion_decision") or {}
          gate_ok, gate_reasons=_promotion_metric_gate(cr)
          fp=str((cr.get("evaluation_governance") or {}).get("holdout_fingerprint") or "")
          matching=[row for row in ch if isinstance(row,dict) and row.get("holdout_fingerprint")==fp]
          already_prod=[row for row in ph if isinstance(row,dict) and row.get("holdout_fingerprint")==fp]

          summary={
              "candidate_model_version":getattr(cm,"version",None),
              "production_model_version":getattr(pm,"version",None),
              "candidate_metadata":getattr(cm,"metadata",{}) or {},
              "production_metadata":getattr(pm,"metadata",{}) or {},
              "data":cr.get("data"),
              "periods":cr.get("periods"),
              "holdout":cr.get("holdout"),
              "elo_baseline_holdout":cr.get("elo_baseline_holdout"),
              "production_holdout":cr.get("production_holdout"),
              "delta_vs_elo":cr.get("delta_vs_elo"),
              "delta_vs_production":cr.get("delta_vs_production"),
              "evaluation_governance":cr.get("evaluation_governance"),
              "promotion_decision":decision,
              "metric_gate_recheck":{"ok":gate_ok,"reasons":gate_reasons},
              "candidate_history_matching_fingerprint":matching,
              "production_history_matching_fingerprint":already_prod,
          }
          print("FINALIZATION_AUDIT_JSON="+json.dumps(summary,sort_keys=True))
          if decision.get("candidate_version") != getattr(cm,"version",None):
              raise SystemExit("Candidate training report/version mismatch")
          if decision.get("production_version") != getattr(pm,"version",None):
              raise SystemExit("Candidate was evaluated against a different production champion")
          if not fp:
              raise SystemExit("Candidate holdout fingerprint missing")
          if len(matching) != 1:
              raise SystemExit(f"Expected exactly one candidate decision for fingerprint, got {len(matching)}")
          if already_prod:
              raise SystemExit("Holdout already appears in production promotion history")
          PY
