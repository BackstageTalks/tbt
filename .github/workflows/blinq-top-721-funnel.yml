name: BlinQ 7.2.1 read-only TOP selection funnel
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_top_721_funnel.py
      - tests/test_audit_top_721_funnel.py
      - .github/workflows/blinq-top-721-funnel.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: scripts
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -p test_audit_top_721_funnel.py -v
      - name: Verify committed private snapshot and audit 2026-11-16
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python scripts/audit_top_721_funnel.py --day 2026-11-16 --out .cache/tbt/top-721-funnel-report.json
      - name: Upload aggregate-only audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blinq-top-721-funnel-${{ github.run_id }}
          path: .cache/tbt/top-721-funnel-report.json
          if-no-files-found: warn
          retention-days: 30
