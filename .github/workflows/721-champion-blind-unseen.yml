name: 7.2.1 vs champion strict blind 9796 check

on:
  pull_request:
    paths:
      - 'scripts/audit_721_blind_champion_unseen.py'
      - 'tests/test_audit_721_blind_champion_unseen.py'
      - '.github/workflows/721-champion-blind-unseen.yml'

permissions:
  contents: read

jobs:
  blind-audit:
    if: github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
      BLINQ_RAPIDAPI_MAX_RPS: '0'
      PYTHONPATH: api:scripts
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install existing offline dependencies
        run: python -m pip install -r api/requirements-train.txt pytest
      - name: Verify blind-test and source integrity contracts
        run: |
          python -m pytest -q \
            tests/test_audit_721_blind_champion_unseen.py \
            tests/test_audit_frozen_721_unseen_overlap.py \
            tests/test_audit_frozen_721_segments.py
      - name: Independently reconcile champion-unseen CDB against pinned candidate history
        run: |
          test -n "$GH_TOKEN"
          test "$TBT_DATA_REPOSITORY" = 'BackstageTalks/tbt-data'
          test -z "${RAPIDAPI_KEY:-}"
          test -z "${PROPLINE_API_KEY:-}"
          python scripts/audit_721_blind_champion_unseen.py \
            --out /tmp/721-champion-strict-blind/result.json
      - name: Assert blind evidence and write aggregate-only step summary
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('/tmp/721-champion-strict-blind/result.json').read_text())
          assert r['no_retraining'] and r['no_model_promotion']
          assert r['provider_requests']==0 and r['production_mutated'] is False
          c=r['cohort']
          assert c['champion_unseen_original']==c['consumed_by_frozen_721_or_its_evaluation']+c['fresh_after_frozen_721_consumption']
          assert c['fresh_and_actually_issued_and_settled']<=c['fresh_after_frozen_721_consumption']
          text=[
            '### 7.2.1 vs champion — genuinely issued same-fixture blind audit',
            'No retrain, no retroactive predictions, no market ROI promotion',
            'Champion-unseen canonical cohort: '+str(c['champion_unseen_original']),
            'Already consumed/evaluated by frozen 7.2.1: '+str(c['consumed_by_frozen_721_or_its_evaluation']),
            'Newly eligible after candidate last consumed UTC day: '+str(c['fresh_after_frozen_721_consumption']),
            'Genuine settled originally issued pairs in eligible cohort: '+str(c['fresh_and_actually_issued_and_settled']),
            'Versions: '+str(r['model_version']),
            'Champion/candidate metrics on same genuinely blind subset: '+str(r['fresh_paired']),
            'ATP/WTA: '+str(r['fresh_by_tour']),
            'Only existing issued predictions count. No champion/CDB changes.'
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(text)+'\n')
          print('\n'.join(text))
          PY
      - name: Save only private aggregate diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-721-champion-strict-blind-${{ github.run_id }}
          path: /tmp/721-champion-strict-blind/result.json
          if-no-files-found: error
          retention-days: 14
