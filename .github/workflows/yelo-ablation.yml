name: BlinQ yElo one-shot ablation

on:
  pull_request:
    branches: [main]
    paths:
      - "api/tbt/models/feature_builder.py"
      - "api/tbt/models/symmetry.py"
      - "tests/test_features.py"
      - ".github/workflows/yelo-ablation.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install training dependencies
        run: python -m pip install -r api/requirements-train.txt
      - name: Run full canonical walk-forward backtest
        run: |
          set -euo pipefail
          python scripts/pipeline.py backtest --max-requests 1
          test -s .cache/tbt/backtest.json
      - name: Summarize yElo candidate
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path(".cache/tbt/backtest.json").read_text())
          o=r.get("overall") or {}
          print("# BlinQ yElo candidate")
          print(f"- tested_matches: {r.get('tested_matches')}")
          for key in ("accuracy","roc_auc","log_loss","brier_score","ece_10"):
              print(f"- {key}: {o.get(key)}")
          print(f"- delta_vs_elo: {r.get('delta_vs_elo')}")
          print("- baseline_accuracy_reference: 0.6905756509500351")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blinq-yelo-ablation-${{ github.run_id }}
          path: .cache/tbt/backtest.json
          if-no-files-found: error
          retention-days: 7
