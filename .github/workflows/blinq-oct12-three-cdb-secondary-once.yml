name: BlinQ Oct12 three-match CDB + private secondary layer once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blinq-oct12-three-cdb-secondary-once.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: blinq-oct12-user-approved-three-fixture-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      BLINQ_SHARED_API_BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
      BLINQ_SHARED_API_BUDGET_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      BLINQ_SHARED_API_BUDGET_PURPOSE: match
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser / canonical storage dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements.txt -r api/requirements-train.txt
          python -m compileall -q scripts/import_oct12_three_cdb_and_sidecar.py
      - name: Fetch fixed historical source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/blinq-three-stage /tmp/blinq-three-feed
          gh run download 38311389071 --repo BackstageTalks/tbt --name match-status-20261012-cdb-evidence --dir /tmp/blinq-three-stage
          test -s /tmp/blinq-three-stage/match-status-20261012-cdb-evidence.json
      - name: Persist all remaining source evidence in private second layer
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          src=Path('/tmp/blinq-three-stage/match-status-20261012-cdb-evidence.json')
          raw=src.read_bytes()
          stage=json.loads(raw)
          expected={'17305574','17307573','17307734'}
          source_ids={str(x.get('provider_event_id') or '') for x in stage.get('candidates',[]) if isinstance(x,dict)}
          if (stage.get('schema')!=1 or stage.get('source_date')!='2026-10-12'
              or stage.get('cdb_canonical_rows_written')!=0
              or stage.get('cdb_import_authorized') is not False
              or not expected.issubset(source_ids)):
              raise SystemExit('Frozen evidence source invalid; nothing uploaded or imported.')
          evidence={
             'schema':1,'storage_layer':'private_research_secondary',
             'source_day':'2026-10-12',
             'source_snapshot_sha256':hashlib.sha256(raw).hexdigest(),
             'approved_for_cdb':sorted(expected),
             'all_other_source_ids_research_only':sorted(source_ids-expected),
             'original_unmodified_audit':stage,
             'automatic_training_allowed':False,
             'automatic_canonical_promotion_allowed':False,
          }
          contents=(json.dumps(evidence,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode()
          location='audit/import-preparation/blinq-20261012-three-matches-secondary-20261013.json'
          api='repos/BackstageTalks/tbt-data/contents/'+location
          probe=subprocess.run(['gh','api',api],capture_output=True,text=True)
          if probe.returncode==0:
              previous=base64.b64decode(json.loads(probe.stdout)['content'])
              if previous!=contents:raise SystemExit('Private immutable sidecar conflict; refusing overwrite')
              print('SECOND_LAYER_ALREADY_VERIFIED '+location)
          else:
              if 'HTTP 404' not in probe.stderr:raise SystemExit('Cannot verify secondary path: '+probe.stderr[:180])
              payload=json.dumps({'message':'research: preserve all noncanonical Oct12 tennis evidence in second layer',
                'content':base64.b64encode(contents).decode()})
              result=subprocess.run(['gh','api','--method','PUT',api,'--input','-'],
                 input=payload,text=True,capture_output=True)
              if result.returncode:raise SystemExit('Secondary-layer write blocked: '+result.stderr[:180])
              print('SECOND_LAYER_PRIVATE_COMMITTED '+location)
          Path('/tmp/blinq-three-secondary-report.json').write_text(json.dumps({
            'status':'VERIFIED_PRIVATE_SECOND_LAYER','path':location,
            'original_candidates':len(stage.get('candidates',[])),
            'original_quarantined':len(stage.get('quarantine',[])),
            'approved_scope':sorted(expected),
            'other_candidates_research_only':sorted(source_ids-expected),
            'source_sha256':hashlib.sha256(raw).hexdigest(),
          },indent=2))
          PY
      - name: Fetch the latest serving feed (checked against old evidence)
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download tbt-predictions-v1 --repo BackstageTalks/tbt-data --pattern feed.json --dir /tmp/blinq-three-feed --clobber
          test -s /tmp/blinq-three-feed/feed.json
      - name: Exact approved CDB append under global lock, independent full-year readback
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$RAPIDAPI_KEY" && test -n "$BLINQ_SHARED_API_BUDGET_TOKEN"
          python -u scripts/import_oct12_three_cdb_and_sidecar.py \
            --stage /tmp/blinq-three-stage/match-status-20261012-cdb-evidence.json \
            --feed /tmp/blinq-three-feed/feed.json \
            --report /tmp/blinq-three-final-report.json
      - name: Retain verified report and secondary layer witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-three-approved-cdb-and-secondary-layer
          path: |
            /tmp/blinq-three-secondary-report.json
            /tmp/blinq-three-final-report.json
          retention-days: 30
          if-no-files-found: warn
