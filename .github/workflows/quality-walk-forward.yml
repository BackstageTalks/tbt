name: BlinQ annual quality walk-forward research
# Annual folds select blends and calibration only on their own past data.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/quality-walk-forward.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blinq-quality-walk-forward-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: python -m pip install -r api/requirements-train.txt pytest
      - run: python -m pytest tests/test_quality_walk_forward.py -q
      - name: Fit annual matched quality arms on past training and calibration days
        run: python -u scripts/audit_quality_walk_forward.py --data-repository "$TBT_DATA_REPOSITORY"
      - name: Preserve private complete evidence or partial raw inventory
        if: always()
        run: |
          python - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          source = Path('.cache/tbt/quality-walk-forward/report.json')
          if not source.exists():
              raise SystemExit(0)
          report = json.loads(source.read_text())
          target = 'audit/quality-walk-forward-latest.json' if report.get('phase') == 'complete' else 'audit/quality-walk-forward-partial.json'
          repo = os.environ['TBT_DATA_REPOSITORY']
          lookup = subprocess.run(['gh','api',f'repos/{repo}/contents/{target}'], capture_output=True, text=True)
          body = {'message': 'Read-only matched BlinQ quality feature research evidence', 'content': base64.b64encode(source.read_bytes()).decode()}
          if lookup.returncode == 0:
              body['sha'] = json.loads(lookup.stdout)['sha']
          elif '404' not in lookup.stderr:
              raise RuntimeError('Cannot safely inspect evidence target')
          payload = Path('/tmp/blinq-existing-data-audit.json')
          payload.write_text(json.dumps(body))
          subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{target}','--input',str(payload)],check=True,stdout=subprocess.DEVNULL)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blinq-quality-walk-forward-${{ github.run_id }}
          path: .cache/tbt/quality-walk-forward/report.json
          if-no-files-found: warn
