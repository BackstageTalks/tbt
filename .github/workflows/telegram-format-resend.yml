name: BlinQ Telegram one-time confirmed format reissue
# Operator-approved O/U reissue: freeze TOP VALUE FREE, replace legacy Most Aces only.
# A private ledger reservation prevents a second send on retries.
on:
  push:
    branches: [main]
    paths:
      - '.github/telegram-format-resend-tick.json'
      - '.github/telegram-tva-resend-tick.json'
      - '.github/telegram-square-resend-tick.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-telegram-ledger
  cancel-in-progress: false

jobs:
  reissue:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: telegram-bot-state
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: .private-telegram
          sparse-checkout: ops
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Resend verified ACES O/U while freezing TOP VALUE FREE
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          BLINQ_URL: ${{ vars.TBT_PRODUCTION_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -s .private-telegram/ops/telegram-bot-state.json
          if [[ "$(TZ=Europe/Bratislava date +%F)" != "2026-11-02" ]]; then
            echo "::notice::2 Nov O/U reissue expired; no backdated or next-day send."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".github/telegram-format-resend-tick.json")
          request=json.loads(p.read_text(encoding="utf-8"))
          assert request.get("betting_day")=="2026-11-02"
          assert request.get("revision")=="aces-player-ou-20261102-v1"
          assert request.get("preserve_original_confirmed_picks") is True
          assert request.get("aces_contract")=="player_total_ou"
          assert request.get("replace_original_aces") is True
          print("Approved Nov 2 verified ACES O/U replacement trigger verified")
          PY
          # Count available already-issued player O/U evidence before the guarded send.
          python - <<'PY'
          import json, sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"scripts"))
          import telegram_offer_publisher as tg
          snap=tg.snapshot(Path("/tmp/blinq-telegram-inspect"))
          rows=[r for r in snap.get("ace_picks",[]) if isinstance(r,dict) and r.get("market")=="aces"]
          grouped=Counter((str(r.get("price_contract") or "none"),str(r.get("price_status") or "none")) for r in rows)
          print(json.dumps({"diagnostic":"confirmed_aces_contracts","date":snap.get("betting_day"),
              "total":len(rows),"types":dict((str(k),v) for k,v in grouped.items()),
              "explicit_line":sum(r.get("market_line") is not None for r in rows),
              "explicit_side":sum(str(r.get("ou_side") or "").lower() in ("over","under") for r in rows),
              "provider_verified":sum(tg.verified_ace_odds(r) is not None for r in rows)},sort_keys=True))
          PY
          python scripts/telegram_offer_publisher.py prepare --preview-format --preview-revision aces-player-ou-20261102-v1 \
            --state .private-telegram/ops/telegram-bot-state.json \
            --config-url "$BLINQ_URL/api/v1/ui-config"
          if [[ -s /tmp/blinq-telegram/ready ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reserve once in private ledger before Telegram calls
        if: steps.prepare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/blinq-telegram/state.json .private-telegram/ops/telegram-bot-state.json
          git -C .private-telegram config user.name "github-actions[bot]"
          git -C .private-telegram config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Reserve one-time Telegram format revision [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual" || { echo "::error::Resend reservation read-back mismatch"; exit 1; }
      - name: Send regular TOP VALUE verified ACES O/U and original FREE TOP
        if: steps.prepare.outputs.ready == 'true'
        env:
          TGB: ${{ secrets.TGB }}
          TGCH: ${{ secrets.TGCH }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/telegram_offer_publisher.py send
      - name: Confirm Telegram IDs and private ledger read-back
        if: steps.prepare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/telegram_offer_publisher.py mark-sent
          cp /tmp/blinq-telegram/state.json .private-telegram/ops/telegram-bot-state.json
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Confirm revised Telegram message IDs [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual" || { echo "::error::Revised message receipt read-back mismatch"; exit 1; }
