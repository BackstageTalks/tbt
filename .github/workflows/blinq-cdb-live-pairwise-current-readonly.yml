name: BlinQ live 2022-2026 Serve Return NULL audit (private receipt)
# Restricted to trusted main, no public artifacts or canonical writer.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/blinq-cdb-live-pairwise-current-readonly.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: blinq-cdb-live-pairwise-readonly
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'BackstageTalks/tbt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      DATA_REPO: BackstageTalks/tbt-data
      ROOT: .cache/live-pairwise-fiveyear
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the guarded five-year Parquet reader
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$DATA_REPO" --jq .private)" = true
          python -m pip install --disable-pip-version-check 'pyarrow==18.1.0' pytest
          python -m pytest -q tests/test_audit_live_five_year_serve_return.py
      - name: Snapshot and recheck five actual CDB years, retry on release drift
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          ok=0
          for attempt in 1 2 3 4; do
            rm -rf "$ROOT/history" "$ROOT/report.json" "$ROOT/after.json"
            mkdir -p "$ROOT/history"
            gh api "repos/$DATA_REPO/releases/tags/tbt-data-v1" > "$ROOT/before.json"
            for year in 2022 2023 2024 2025 2026; do
              gh release download tbt-data-v1 -R "$DATA_REPO" -p "history-$year.parquet" -D "$ROOT/history" >/dev/null 2>&1
            done
            gh release download tbt-data-v1 -R "$DATA_REPO" -p history_manifest.json -p _tbt_bundle_manifest.json -D "$ROOT/history" >/dev/null 2>&1
            if ! python scripts/audit_live_five_year_serve_return.py --history-dir "$ROOT/history" \
                --release-json "$ROOT/before.json" --out "$ROOT/report.json" > "$ROOT/quiet.log" 2>&1; then
              echo "AUDIT_SOURCE_CHANGED_OR_INVALID retry=$attempt"
              continue
            fi
            gh api "repos/$DATA_REPO/releases/tags/tbt-data-v1" > "$ROOT/after.json"
            if PYTHONPATH=scripts python - <<'PY'
          import json,os
          from pathlib import Path
          from audit_live_five_year_serve_return import release_assets
          p=Path(os.environ['ROOT'])
          a=json.loads((p/'before.json').read_text())
          b=json.loads((p/'after.json').read_text())
          assert a['tag_name']==b['tag_name']=='tbt-data-v1'
          assert release_assets(a)==release_assets(b), 'release drift'
          report=json.loads((p/'report.json').read_text())
          assert report['state']=='READ_ONLY_CURRENT_SNAPSHOT_NOT_WRITE_AUTHORIZATION'
          assert report['production_writes']==0
          print('FIVE_YEAR_CURRENT_SNAPSHOT_COHERENT')
          PY
            then
              ok=1
              break
            fi
            echo "RELEASE_DRIFT_RETRY attempt=$attempt"
          done
          test "$ok" = 1
      - name: Save only private aggregate report, re-download byte-identical
        run: |
          set -euo pipefail
          tag="blinq-cdb-fiveyear-live-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$ROOT/report.json" -R "$DATA_REPO" --target main \
            --title 'Five-year CDB Serve Return read-only NULL audit' \
            --notes 'Private counts/digests only. No player IDs, no CDB data writes, no training.' >/dev/null
          mkdir -p "$ROOT/readback"
          gh release download "$tag" -R "$DATA_REPO" -p report.json -D "$ROOT/readback" >/dev/null 2>&1
          cmp "$ROOT/report.json" "$ROOT/readback/report.json"
          echo "PRIVATE_FIVE_YEAR_NULL_AUDIT_READBACK_PASS"
          echo "Private receipt: $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Erase canonical source from ephemeral public runner
        if: always()
        run: rm -rf .cache/live-pairwise-fiveyear
