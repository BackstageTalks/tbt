name: Import Valuebetennis market history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/valuebet-market-history-request.json'

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  import-market-history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install and verify private destination
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"

      - name: Download canonical history
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_production_preflight_inputs.py
          rm -rf .cache/tbt/valuebet
          mkdir -p .cache/tbt/valuebet/source .cache/tbt/valuebet/link .cache/tbt/valuebet/dryrun .cache/tbt/valuebet/import
          cp -a .cache/tbt/history .cache/tbt/valuebet/history-enriched

      - name: Download and validate Valuebetennis 2021-2026
        shell: bash
        run: |
          set -euo pipefail
          for year in 2021 2022 2023 2024 2025 2026; do
            curl -fsSL --retry 4 --retry-delay 3               "https://www.valuebetennis.com/datasets/valuebetennis-matchs-${year}.csv"               -o ".cache/tbt/valuebet/source/valuebetennis-matchs-${year}.csv"
            test -s ".cache/tbt/valuebet/source/valuebetennis-matchs-${year}.csv"
          done

          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          required = {
              "match_id", "date", "tournoi", "tournoi_id", "categorie", "genre",
              "surface", "tour", "joueur1", "joueur1_id", "joueur2", "joueur2_id",
              "cote1_ouverture", "cote2_ouverture", "cote1_cloture", "cote2_cloture",
              "vainqueur_id", "score", "duree_min",
          }
          out = {"schema": 1, "source": "Valuebetennis", "license": "CC BY 4.0", "files": []}
          for path in sorted(Path(".cache/tbt/valuebet/source").glob("valuebetennis-matchs-*.csv")):
              with path.open("r", encoding="utf-8-sig", newline="") as handle:
                  reader = csv.reader(handle, delimiter=";")
                  header = next(reader)
                  rows = sum(1 for _ in reader)
              missing = sorted(required - set(header))
              if missing:
                  raise SystemExit(f"{path.name}: missing columns: {missing}")
              if rows < 1000:
                  raise SystemExit(f"{path.name}: unexpectedly small dataset: {rows}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              out["files"].append({"name": path.name, "rows": rows, "sha256": digest})
          if len(out["files"]) != 6:
              raise SystemExit("Expected six Valuebetennis season files")
          Path(".cache/tbt/valuebet/source-manifest.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Link Valuebetennis markets fail-closed
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in .cache/tbt/valuebet/source/valuebetennis-matchs-*.csv; do
            args+=(--source-csv "$f")
          done
          python scripts/link_valuebetennis_market_history.py             --history-dir .cache/tbt/valuebet/history-enriched             "${args[@]}"             --out-dir .cache/tbt/valuebet/link             --source-label valuebetennis_cc_by_4

      - name: Dry-run strict import and enforce safety gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import_offline_market_history.py             --stage .cache/tbt/valuebet/link/auto_linked.jsonl             --history-dir .cache/tbt/valuebet/history-enriched             --out-dir .cache/tbt/valuebet/dryrun

          python - <<'PY'
          import json
          from pathlib import Path
          link = json.loads(Path(".cache/tbt/valuebet/link/report.json").read_text())
          imp = json.loads(Path(".cache/tbt/valuebet/dryrun/report.json").read_text())
          lc = link.get("counts") or {}
          ic = imp.get("counts") or {}
          forbidden = {
              "identity_missing": ic.get("identity_missing", 0),
              "identity_changed": ic.get("identity_changed", 0),
              "invalid_market_history": ic.get("invalid_market_history", 0),
              "market_conflicts": ic.get("market_conflicts", 0),
          }
          if any(int(v or 0) for v in forbidden.values()):
              raise SystemExit(f"Valuebet dry-run failed safety gates: {forbidden}")
          staged = int(lc.get("staged_matches") or 0)
          if staged <= 0 and int(lc.get("already_present") or 0) <= 0:
              raise SystemExit("Valuebet linker produced neither staged nor already-present markets")
          print(json.dumps({"staged": staged, "already_present": lc.get("already_present", 0), "safety": forbidden}, indent=2))
          PY

      - name: Write enriched local history
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import_offline_market_history.py             --stage .cache/tbt/valuebet/link/auto_linked.jsonl             --history-dir .cache/tbt/valuebet/history-enriched             --out-dir .cache/tbt/valuebet/import             --write-partitions             --write-history-dir .cache/tbt/valuebet/history-enriched

      - name: Validate identity and market-feature isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          from tbt.data.offline_market_history import clean_market_history_marker
          from tbt.models.feature_builder import FEATURE_NAMES

          matches = load_partitions(".cache/tbt/valuebet/history-enriched")
          safe, safety = sanitize_history_identities(matches)
          failed = []

          if safety.get("quarantined_rows") or len(safe) != len(matches):
              failed.append("canonical_identity_safety")

          feature_builder_source = Path("api/tbt/models/feature_builder.py").read_text(encoding="utf-8")
          market_feature_names = []
          if "_tbt_market_history" in feature_builder_source:
              market_feature_names.append("_tbt_market_history")
              failed.append("market_data_exposed_as_model_features")

          markers = 0
          invalid_markers = 0
          closing_policy_violations = 0
          for match in safe:
              payload = match.provider_payload if isinstance(match.provider_payload, dict) else {}
              raw = payload.get("_tbt_market_history")
              if raw is None:
                  continue
              markers += 1
              cleaned = clean_market_history_marker(raw)
              if cleaned is None:
                  invalid_markers += 1
                  continue
              if str(cleaned.get("closing_semantics") or "") != "last_recorded_before_match":
                  closing_policy_violations += 1

          if invalid_markers:
              failed.append("invalid_market_history_markers")
          if closing_policy_violations:
              failed.append("closing_semantics_policy")

          imp = json.loads(Path(".cache/tbt/valuebet/import/report.json").read_text())
          counts = imp.get("counts") or {}
          forbidden = {
              "identity_missing": int(counts.get("identity_missing") or 0),
              "identity_changed": int(counts.get("identity_changed") or 0),
              "invalid_market_history": int(counts.get("invalid_market_history") or 0),
              "market_conflicts": int(counts.get("market_conflicts") or 0),
          }
          if any(forbidden.values()):
              failed.append("strict_import_safety_gates")

          report = {
              "schema": 1,
              "status": "pass" if not failed else "fail",
              "audit_scope": "valuebet_market_metadata_only",
              "canonical_rows": len(safe),
              "market_history_rows": markers,
              "identity_safety": safety,
              "invalid_market_history_markers": invalid_markers,
              "closing_policy_violations": closing_policy_violations,
              "market_feature_names": market_feature_names,
              "strict_import_safety": forbidden,
              "failed_checks": failed,
              "policy": {
                  "opening": "stored_metadata_only_candidate_not_promoted",
                  "closing": "validation_and_clv_only",
                  "model_promotion": False,
              },
          }
          Path(".cache/tbt/valuebet/leakage-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          Path(".cache/tbt/valuebet/validated-counts.json").write_text(
              json.dumps({"canonical_rows": len(safe), "market_history_rows_local": markers}, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if failed:
              raise SystemExit("Valuebet targeted safety audit failed: " + ", ".join(failed))
          PY

      - name: Publish changed canonical history partitions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from release_store import ReleaseStore

          root = Path(".cache/tbt/valuebet/history-enriched")
          report = json.loads(Path(".cache/tbt/valuebet/import/report.json").read_text())
          years = sorted({int(y) for y in report.get("changed_years") or []})
          if not years:
              print("Verified no-op: no new Valuebet market-history rows to publish")
              raise SystemExit(0)
          paths = [root / f"history-{year:04d}.parquet" for year in years] + [root / "history_manifest.json"]
          if any(not p.is_file() or p.stat().st_size <= 0 for p in paths):
              raise SystemExit("Missing enriched history asset")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", root).upload_bundle(paths)
          print("Published changed years:", years)
          PY

      - name: Read back and verify persisted history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cache/tbt/valuebet/readback
          python - <<'PY'
          import json, os
          from pathlib import Path
          from release_store import ReleaseStore
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities

          root = Path(".cache/tbt/valuebet/readback")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", root).download()
          matches = load_partitions(root)
          safe, safety = sanitize_history_identities(matches)
          if safety.get("quarantined_rows") or len(safe) != len(matches):
              raise SystemExit("Persisted identity safety failed")
          persisted = sum(
              1 for m in safe
              if isinstance(m.provider_payload, dict)
              and isinstance(m.provider_payload.get("_tbt_market_history"), dict)
          )
          local = json.loads(Path(".cache/tbt/valuebet/validated-counts.json").read_text())
          if persisted != int(local["market_history_rows_local"]):
              raise SystemExit(f"Persisted market history mismatch: {persisted} != {local['market_history_rows_local']}")
          summary = {
              "schema": 1,
              "status": "verified",
              "source": "Valuebetennis",
              "license": "CC BY 4.0",
              "canonical_rows": len(safe),
              "market_history_rows": persisted,
              "source_manifest": json.loads(Path(".cache/tbt/valuebet/source-manifest.json").read_text()),
              "link_report": json.loads(Path(".cache/tbt/valuebet/link/report.json").read_text()),
              "import_report": json.loads(Path(".cache/tbt/valuebet/import/report.json").read_text()),
              "leakage_report": json.loads(Path(".cache/tbt/valuebet/leakage-audit.json").read_text()),
              "model_feature_policy": "opening_only_candidate; closing_validation_only",
              "production_mutated": bool((json.loads(Path(".cache/tbt/valuebet/import/report.json").read_text()).get("changed_years") or [])),
              "api_requests": 0,
          }
          Path(".cache/tbt/valuebet/valuebet-market-history-verification.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "status": summary["status"],
              "canonical_rows": summary["canonical_rows"],
              "market_history_rows": summary["market_history_rows"],
              "updated": (summary["import_report"].get("counts") or {}).get("updated", 0),
          }, indent=2))
          PY

      - name: Persist Valuebet audit
        shell: bash
        run: |
          set -euo pipefail
          file=.cache/tbt/valuebet/valuebet-market-history-verification.json
          encoded="$(base64 -w0 "$file")"
          path="audit/valuebet-market-history-latest.json"
          sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Verify Valuebetennis market history" -f content="$encoded" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Verify Valuebetennis market history" -f content="$encoded" >/dev/null
          fi

      - name: Upload integration audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valuebet-market-history-${{ github.run_id }}
          path: |
            .cache/tbt/valuebet/source-manifest.json
            .cache/tbt/valuebet/link/report.json
            .cache/tbt/valuebet/link/review.jsonl
            .cache/tbt/valuebet/link/quarantine.jsonl
            .cache/tbt/valuebet/dryrun/report.json
            .cache/tbt/valuebet/import/report.json
            .cache/tbt/valuebet/leakage-audit.json
            .cache/tbt/valuebet/valuebet-market-history-verification.json
          if-no-files-found: warn
