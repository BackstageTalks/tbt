name: Audit Grand Slam PBP enrichment

on:
  push:
    branches: [main]
    paths:
      - ".github/slam-pbp-audit-request.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      SOURCE_SHA: 83733587353df8a41f2fd4f516147d5aa83f5a8d

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: python -m pip install --retries 8 --timeout 60 -r api/requirements-train.txt

      - name: Download checksum-verified canonical history
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          out=Path(".cache/tbt/history")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",out).download(require_bundle_manifest=True)
          PY

      - name: Fetch pinned Grand Slam PBP source
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --no-checkout https://github.com/AngieXuAU/tennis-point-by-point-archive.git .cache/tbt/slam-src
          git -C .cache/tbt/slam-src checkout -q "$SOURCE_SHA" -- slam_pointbypoint
          test "$(git -C .cache/tbt/slam-src rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Audit strict PBP linkage
        run: |
          set -euo pipefail
          python scripts/link_slam_pbp_serve_return.py             --history-dir .cache/tbt/history             --source-dir .cache/tbt/slam-src/slam_pointbypoint             --out-dir .cache/tbt/slam-audit

      - name: Validate audit contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open(".cache/tbt/slam-audit/report.json"))
          if r.get("production_mutated") is not False or r.get("api_requests") != 0:
              raise SystemExit("Safety contract violated")
          if int(r.get("canonical_rows") or 0) <= 0:
              raise SystemExit("Canonical history missing")
          if int(r.get("quality_ready_before") or 0) <= 0:
              raise SystemExit("Canonical serve/return baseline missing")
          print(json.dumps(r,indent=2))
          PY

      - name: Persist latest audit privately
        run: |
          set -euo pipefail
          path="audit/slam-pbp-coverage-latest.json"
          encoded="$(base64 -w0 .cache/tbt/slam-audit/report.json)"
          sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Update Grand Slam PBP coverage audit"               -f content="$encoded" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Add Grand Slam PBP coverage audit"               -f content="$encoded" >/dev/null
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slam-pbp-audit-${{ github.run_id }}
          retention-days: 14
          path: .cache/tbt/slam-audit/
