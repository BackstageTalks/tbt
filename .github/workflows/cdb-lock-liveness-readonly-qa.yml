name: BlinQ CDB lock liveness read-only QA
on:
  pull_request:
    paths:
      - 'scripts/audit_cdb_lock_liveness.py'
      - 'tests/test_audit_cdb_lock_liveness.py'
      - '.github/workflows/cdb-lock-liveness-readonly-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-readonly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test without token, remote writes or paid calls
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_cdb_lock_liveness.py tests/test_audit_cdb_lock_liveness.py
          python -m unittest discover -v -s tests -p 'test_audit_cdb_lock_liveness.py'
