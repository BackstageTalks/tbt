name: BlinQ exact audited uploaded-source cell delta vs CURRENT CDB

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/blinq-current-source-field-delta.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-source-actual-match-field-audit
  cancel-in-progress: false

jobs:
  compare-exact-source-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      PRIVATE_TAG: blinq-audited-source-cell-delta-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          ref: main
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check source and private permissions, syntax, small dependencies
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          python -m pip install --quiet "pandas>=2,<3" pyarrow
          python -m py_compile app/scripts/audit_actual_uploaded_source_field_delta.py
      - name: Download and SHA-pin current canonical 78 years and exact source sidecars
        run: |
          set -euo pipefail
          mkdir -p /tmp/blinq-cell-gap/years /tmp/blinq-cell-gap/sources /tmp/blinq-cell-gap/market /tmp/blinq-cell-gap/results
          gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" > /tmp/blinq-cell-gap/release.json
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -D /tmp/blinq-cell-gap/years \
            -p 'history-*.parquet' -p 'history_manifest.json'
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -D /tmp/blinq-cell-gap/sources \
            -p 'blinq-uploaded-match-enrichment-*.jsonl.gz' -p 'blinq-uploaded-td-atp-2025-enrichment.jsonl.gz'
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -D /tmp/blinq-cell-gap/market \
            -p 'market-sidecar-*.jsonl.gz'
      - name: Field-by-field compare 12,807 linked source rows and CDB 994,101 matches
        run: |
          set -euo pipefail
          python -u app/scripts/audit_actual_uploaded_source_field_delta.py \
            --history /tmp/blinq-cell-gap/years \
            --release-json /tmp/blinq-cell-gap/release.json \
            --uploaded /tmp/blinq-cell-gap/sources \
            --market /tmp/blinq-cell-gap/market \
            --source source \
            --output /tmp/blinq-cell-gap/results/source-to-cdb-cell-delta.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/blinq-cell-gap/results/source-to-cdb-cell-delta.json'))
          assert r['canonical']['rows']>=994101
          assert 10288 <= r['canonical']['exact_id_matched'] <= 12807
          assert r['sources']['source_record_overlap']['all_source_rows']==12807
          assert r['safety']['no_cdb_writes']
          assert r['safety']['no_provider_requests']
          assert r['canonical']['year_partitions']==78
          print("BLINQ_CDB_FIELD_DELTA_VERIFIED",r['canonical'],
                "CORE_MISSING",r['core_missing_cells_by_field'],
                "SCORE_MISSING",r['completed_match_score_comparison'])
          PY
      - name: Independently persist the SOURCE-versus-CDB evidence in private release
        if: always()
        run: |
          set -euo pipefail
          cd /tmp/blinq-cell-gap/results
          test -s source-to-cdb-cell-delta.json
          sha256sum source-to-cdb-cell-delta.json > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$PRIVATE_TAG" -R "$PRIVATE_REPO" --target main \
            --title "Field-level current CDB vs audited operator raw sources" \
            --notes "78 manifest-verified years and 12,807 exact source-to-CDB match ID links. Read-only source field delta, no model train, no CDB writes."
          gh release upload "$PRIVATE_TAG" source-to-cdb-cell-delta.json SHA256SUMS -R "$PRIVATE_REPO"
          mkdir -p readback
          gh release download "$PRIVATE_TAG" -R "$PRIVATE_REPO" -D readback
          (cd readback && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          r=json.load(open('readback/source-to-cdb-cell-delta.json'))
          assert r['safety']['no_cdb_writes'] and r['safety']['no_provider_requests']
          print("BLINQ_SOURCE_FIELD_DELTA_INDEPENDENT_PERSISTED_READBACK",r['canonical']['exact_id_matched'],r['score_missing_cells_by_field'])
          PY
