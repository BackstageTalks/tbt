name: BlinQ offline calibration resource checks

on:
  pull_request:
    paths:
      - api/tbt/models/feature_builder.py
      - api/tbt/models/ensemble.py
      - api/tbt/services/training.py
      - tests/test_calibration_memory_bounded.py
      - .github/workflows/calibration-resource-checks.yml
      - .github/workflows/one-shot-20261020-post-morning-calibration.yml
  push:
    branches: [main]
    paths:
      - api/tbt/models/feature_builder.py
      - api/tbt/models/ensemble.py
      - api/tbt/services/training.py
      - tests/test_calibration_memory_bounded.py
      - .github/workflows/calibration-resource-checks.yml
      - .github/workflows/one-shot-20261020-post-morning-calibration.yml

permissions:
  contents: read

concurrency:
  group: blinq-calibration-resource-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: api:scripts
      PYTHONDONTWRITEBYTECODE: '1'
      BLINQ_RAPIDAPI_MAX_RPS: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: python -m pip install -r api/requirements-train.txt pytest PyYAML
      - name: Check workflow YAML syntax
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for name in (
              ".github/workflows/calibration-resource-checks.yml",
              ".github/workflows/protected-frozen-cdb-candidate.yml",
              ".github/workflows/one-shot-20261020-post-morning-calibration.yml",
          ):
              data = yaml.safe_load(Path(name).read_text(encoding="utf-8"))
              assert isinstance(data.get("jobs"), dict)
          PY
      - name: Run offline memory, full-history and candidate model regressions
        run: |
          python -m pytest -q             tests/test_calibration_memory_bounded.py             tests/test_training_pipeline.py             tests/test_training_inputs.py             tests/test_immutable_training_backup.py             tests/test_immutable_backup_upload_recovery.py             tests/test_champion_rollback_rehearsal.py
