name: BlinQ rich Charting exact CDB NULL field review once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/blinq-rich-charting-cdb-null-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blinq-rich-charting-cdb-null-audit
  cancel-in-progress: false
jobs:
  rich-check:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: main
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: private-data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify private access, compile auditor, install parquet
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          python -m pip install -q pyarrow
          python -m py_compile app/scripts/charting_rich_cdb_null_audit.py
      - name: Readback verified 662 basic identity and field witnesses
        run: |
          set -euo pipefail
          root=.cache/blinq-charting-rich
          mkdir -p "$root/basic-gate"
          gh release download blinq-charting-field-gate-38305309436-1 -R "$PRIVATE_REPO" -D "$root/basic-gate" \
            -p report.json -p already_present_verified.jsonl -p SHA256SUMS
          (cd "$root/basic-gate" && sha256sum -c SHA256SUMS)
      - name: Download checksum-verified CURRENT CDB without mutation
        run: |
          set -euo pipefail
          (cd app && PYTHONPATH=api:scripts python scripts/download_stable_cdb.py \
            --repository "$PRIVATE_REPO" --tag tbt-data-v1 \
            --out ../.cache/blinq-charting-rich/history \
            --report ../.cache/blinq-charting-rich/snapshot.json)
      - name: Compare rich source statistics and NULL-only exact fields
        run: |
          set -euo pipefail
          python app/scripts/charting_rich_cdb_null_audit.py \
            --project .cache/blinq-charting-rich --out .cache/blinq-charting-rich/audit
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.cache/blinq-charting-rich/audit/report.json').read_text())
          assert r['consistent_basic_match_candidates']==662
          assert r['approved_production_rows']==0 and r['written_production_cells']==0
          print('RICH_NULL_FIELD_COUNTS',r['counts'],flush=True)
          PY
      - name: Publish immutable PRIVATE rich audit and independently read back
        run: |
          set -euo pipefail
          root=.cache/blinq-charting-rich
          tag="blinq-rich-charting-null-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          files=("$root/audit/report.json")
          if [[ -s "$root/audit/proposals.jsonl" ]]; then files+=("$root/audit/proposals.jsonl"); fi
          (cd "$root/audit" && sha256sum report.json $( [[ -s proposals.jsonl ]] && echo proposals.jsonl ) > SHA256SUMS && sha256sum -c SHA256SUMS)
          files+=("$root/audit/SHA256SUMS")
          gh release create "$tag" "${files[@]}" -R "$PRIVATE_REPO" \
            --title 'BlinQ rich Charting current CDB field-gap review' \
            --notes 'READ-ONLY. Candidate NULL stats are NOT production authorized without independent event identity and full-match provenance.'
          mkdir -p "$root/readback"
          gh release download "$tag" -R "$PRIVATE_REPO" -D "$root/readback" -p report.json -p SHA256SUMS
          if [[ -s "$root/audit/proposals.jsonl" ]]; then
            gh release download "$tag" -R "$PRIVATE_REPO" -D "$root/readback" -p proposals.jsonl
          fi
          (cd "$root/readback" && sha256sum -c SHA256SUMS)
          echo "RICH_PRIVATE_READBACK_VERIFIED $tag"
