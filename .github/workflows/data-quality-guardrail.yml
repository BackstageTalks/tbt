name: Data Quality Guardrail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: api
      TBT_HISTORY_DIR: .cache/tbt/history
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
      - name: Verify private repository
        run: |
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE"
      - name: Download partitioned history
        run: bash scripts/download_history_release.sh .cache/tbt
      - name: Validate manifest and partitions
        run: python scripts/validate_history_partitions.py --history-dir "$TBT_HISTORY_DIR"
      - name: Run data quality guardrail without Supabase history read
        run: python scripts/data_quality_guardrail.py
      - name: Upload data quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-guardrail-report
          path: reports/data_quality_guardrail.json
          if-no-files-found: warn
