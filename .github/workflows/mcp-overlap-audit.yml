name: MCP overlap audit (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mcp-overlap-audit.yml', 'scripts/audit_mcp_overlap.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tbt-mcp-overlap-readonly
  cancel-in-progress: true
jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      RAPIDAPI_KEY: ''
      PROPL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install and check private history access
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q scripts/audit_mcp_overlap.py
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = PRIVATE
      - name: Measure exact MCP overlap without changing history
        run: python scripts/audit_mcp_overlap.py
      - name: Summary
        if: success()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('.cache/tbt/mcp-overlap/report.json').read_text())
          c=r['counts']
          print('# MCP overlap — research only')
          for key in ('mcp_matches','matched_complete_overview','already_ready','potential_new_complete','no_unique_history_match','ambiguous_history_match','matched_without_complete_overview'):
              print(f"- {key}: {c.get(key,0):,}")
          print('No production changes, no paid provider calls. Source CC BY-NC-SA 4.0.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-overlap-${{ github.run_id }}
          path: |
            .cache/tbt/mcp-overlap/report.json
            .cache/tbt/mcp-overlap/mcp_staged_candidates.json
          if-no-files-found: warn
          retention-days: 14
