name: BlinQ guarded per-pair canonical Serve Return NULL completion

on:
  pull_request:
    paths:
      - '.github/workflows/cdb-service-pairwise-guarded.yml'
      - 'scripts/recover_cdb_opponent_service_rates.py'
      - 'tests/test_recover_cdb_opponent_service_rates.py'
      - '.github/cdb-service-pairwise-request.json'
  push:
    branches: [main]
    paths: ['.github/cdb-service-pairwise-request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Run-unique waiting slot: the private global Git tag serializes writes.
  group: tbt-crossrepo-writer-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Resolve fail-closed request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            mode=dry-run
          else
            mode="$(jq -r '.mode // "dry-run"' .github/cdb-service-pairwise-request.json)"
          fi
          [[ "$mode" == "dry-run" || "$mode" == "write" ]]
          test "$TBT_DATA_REPOSITORY" = "BackstageTalks/tbt-data"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "CDB pairwise Serve Return mode: $mode"

      - name: Install and run exact-rate recovery tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = PRIVATE
          python -m pip install -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_recover_cdb_opponent_service_rates.py tests/test_cdb_global_writer_lock.py tests/test_cdb_writer_workflow_coverage.py
          python -m compileall -q scripts/recover_cdb_opponent_service_rates.py scripts/download_stable_cdb.py

      - name: Acquire global canonical writer lock
        if: ${{ steps.request.outputs.mode == 'write' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_global_writer_lock.py acquire --wait-seconds 1200

      - name: Download one coherent checksum-verified canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_stable_cdb.py \
            --repository "$TBT_DATA_REPOSITORY" \
            --out .cache/tbt/cdb-pairwise-write/history \
            --report .cache/tbt/cdb-pairwise-write/source-snapshot.json

      - name: Stage only reproducible opposite-player service complements
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recover_cdb_opponent_service_rates.py \
            --mode stage --pairwise \
            --history-dir .cache/tbt/cdb-pairwise-write/history \
            --out-dir .cache/tbt/cdb-pairwise-write/stage
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(".cache/tbt/cdb-pairwise-write")
          report=json.loads((root/"stage/report.json").read_text())
          counts=report["counts"]
          assert report["production_mutated"] is False and report["provider_requests"] == 0
          # A reviewed, single-use request pins BOTH current source manifest and
          # exact eligible delta. Never widen scope silently after PR dry-run.
          request_path=Path(".github/cdb-service-pairwise-request.json")
          request=json.loads(request_path.read_text()) if request_path.is_file() else {}
          snapshot=json.loads((root/"source-snapshot.json").read_text())
          if os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
            assert snapshot["status"] == "verified"
            assert counts.get("new_stat_values",0) >= counts.get("staged_matches",0)
            assert len({r["match_id"] for r in [json.loads(x) for x in (root/"stage/stage.jsonl").read_text().splitlines() if x.strip()]}) == counts.get("staged_matches",0)
            print("PAIRWISE_PROTECTED_PR_READ_ONLY_TESTS_AND_STAGE_PASS", counts, flush=True)
            with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("changes="+("true" if counts.get("staged_matches",0)>0 else "false")+"\n")
            raise SystemExit(0)
          assert request.get("approved_by_operator") is True, "Explicit writer approval missing"
          assert request.get("mode") == "write", "No explicit write request"
          assert snapshot["status"] == "verified" and snapshot["provider_api_requests"] == 0
          assert snapshot["manifest_sha256"] == request.get("expected_cdb_bundle_sha256"), "Current CDB manifest changed; rerun audit before import"
          assert counts["staged_matches"] == request.get("expected_staged_matches"), "CDB staged match count drift"
          assert counts["new_stat_values"] == request.get("expected_new_stat_values"), "CDB staged value count drift"
          assert counts["examined"] == request.get("expected_canonical_matches"), "CDB history size drift"
          assert counts.get("conflicting_rate_pairs_quarantined",0) == request.get("expected_quarantined_conflicting_pairs"), "Quarantine count drift"
          assert set(map(int,report["changed_years"])) <= set(map(int,request["expected_changed_years"])), "Staged years widened unexpectedly"
          assert counts["examined"] >= 993759, "CDB row-count regression"
          assert counts.get("conflicting_rate_pairs_quarantined",0) >= 0
          assert counts.get("new_stat_values",0) >= counts.get("staged_matches",0)
          assert counts.get("staged_matches",0) < counts["examined"]
          assert counts["staged_matches"] > 0, "No exact NULL-only pairwise import delta; refuse needless writer"
          valid_years=set(map(int,json.loads((root/"history/history_manifest.json").read_text())["years"]))
          assert report["changed_years"]==sorted(set(report["changed_years"]))
          assert all(int(y) in valid_years for y in report["changed_years"]), "Staged year absent from canonical snapshot"
          stage=[json.loads(x) for x in (root/"stage/stage.jsonl").read_text().splitlines() if x.strip()]
          assert len(stage)==counts.get("staged_matches",0)
          assert len({row["match_id"] for row in stage})==len(stage)
          assert sorted(set(int(row["utc_year"]) for row in stage))==report["changed_years"]
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
            f.write("changes="+("true" if stage else "false")+"\n")
          print("Verified deterministic pairwise staged rows:", counts, flush=True)
          PY

      - name: Rehearse exact staged stats writes with complete CDB diff (dry-run only)
        if: ${{ steps.request.outputs.mode == 'dry-run' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/tbt/cdb-pairwise-write
          cp -a "$root/history" "$root/rehearsal-before"
          python scripts/recover_cdb_opponent_service_rates.py \
            --mode write --history-dir "$root/history" \
            --stage-file "$root/stage/stage.jsonl" \
            --out-dir "$root/rehearsal"
          python scripts/recover_cdb_opponent_service_rates.py \
            --mode verify --history-dir "$root/history" \
            --before-dir "$root/rehearsal-before" \
            --stage-file "$root/stage/stage.jsonl" \
            --out-dir "$root/rehearsal-readback"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".cache/tbt/cdb-pairwise-write")
          staged=json.loads((root/"stage/report.json").read_text())["counts"]
          write=json.loads((root/"rehearsal/report.json").read_text())
          checked=json.loads((root/"rehearsal-readback/report.json").read_text())
          assert write["updated"]==staged["staged_matches"]
          assert checked["status"]=="verified"
          assert checked["enriched_matches"]==staged["staged_matches"]
          assert checked["new_stat_values"]==staged["new_stat_values"]
          assert checked["existing_values_overwritten"]==0
          print("Dry-run exact stats mutation, complete readback verified without remote publication.")
          PY

      - name: Create immutable prewrite backup and independently verify checksum
        if: ${{ steps.request.outputs.mode == 'write' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/tbt/cdb-pairwise-write
          mkdir -p "$root/backup" "$root/backup-readback"
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path(".cache/tbt/cdb-pairwise-write")
          years=json.loads((root/"stage/report.json").read_text())["changed_years"]
          names=["history_manifest.json","_tbt_bundle_manifest.json"] + [f"history-{year:04d}.parquet" for year in years]
          assert years and all((root/"history"/n).is_file() for n in names)
          for n in names:
            shutil.copyfile(root/"history"/n,root/"backup"/n)
          print("Backup assets:",len(names))
          PY
          (cd "$root/backup" && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
          tag="blinq-cdb-pairwise-prewrite-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$root/backup/"* -R "$TBT_DATA_REPOSITORY" \
            --title "Immutable CDB pairwise rate-complement prewrite backup" \
            --notes "Exact original changed year partitions and both source manifests. Never overwrite. Restore before another writer if readback fails."
          gh release download "$tag" -R "$TBT_DATA_REPOSITORY" -D "$root/backup-readback"
          (cd "$root/backup-readback" && sha256sum -c SHA256SUMS)
          cp -a "$root/history" "$root/before"

      - name: Apply verified local year partitions and compare full before/after CDB
        if: ${{ steps.request.outputs.mode == 'write' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/tbt/cdb-pairwise-write
          python scripts/recover_cdb_opponent_service_rates.py \
            --mode write --history-dir "$root/history" \
            --stage-file "$root/stage/stage.jsonl" --out-dir "$root/write"
          python scripts/recover_cdb_opponent_service_rates.py \
            --mode verify --history-dir "$root/history" --before-dir "$root/before" \
            --stage-file "$root/stage/stage.jsonl" --out-dir "$root/local-readback"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".cache/tbt/cdb-pairwise-write")
          stage=json.loads((root/"stage/report.json").read_text())
          write=json.loads((root/"write/report.json").read_text())
          gate=json.loads((root/"local-readback/report.json").read_text())
          assert write["changed_years"]==stage["changed_years"]
          assert write["updated"]==stage["counts"]["staged_matches"]
          assert gate["status"]=="verified" and gate["existing_values_overwritten"]==0
          assert gate["enriched_matches"]==write["updated"]
          PY

      - name: Publish audited changes only if base manifest remains identical
        if: ${{ steps.request.outputs.mode == 'write' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_global_writer_lock.py verify
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from release_store import ReleaseStore
          root=Path(".cache/tbt/cdb-pairwise-write")
          hist=root/"history"
          current=root/"fresh-remote-manifest"
          current.mkdir(exist_ok=True)
          repo=os.environ["TBT_DATA_REPOSITORY"]
          store=ReleaseStore(repo,"tbt-data-v1",current)
          store._download_asset("_tbt_bundle_manifest.json")
          saved=(root/"backup/_tbt_bundle_manifest.json").read_bytes()
          latest=(current/"_tbt_bundle_manifest.json").read_bytes()
          if hashlib.sha256(saved).digest()!=hashlib.sha256(latest).digest():
            raise SystemExit("Source canonical manifest changed; abort CDB complement publication")
          years=json.loads((root/"stage/report.json").read_text())["changed_years"]
          changed=[hist/f"history-{year:04d}.parquet" for year in years]
          assert all(p.is_file() and p.stat().st_size>0 for p in changed)
          store=ReleaseStore(repo,"tbt-data-v1",hist)
          store.upload_bundle(changed+[hist/"history_manifest.json"])
          print("Published canonical partitions:",[p.name for p in changed],flush=True)
          PY

      - name: Independently re-download and verify every canonical match
        if: ${{ steps.request.outputs.mode == 'write' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/tbt/cdb-pairwise-write
          python scripts/download_stable_cdb.py --repository "$TBT_DATA_REPOSITORY" \
            --out "$root/persisted" --report "$root/persisted-download.json"
          python scripts/recover_cdb_opponent_service_rates.py \
            --mode verify --history-dir "$root/persisted" --before-dir "$root/before" \
            --stage-file "$root/stage/stage.jsonl" --out-dir "$root/persisted-readback"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".cache/tbt/cdb-pairwise-write")
          r=json.loads((root/"persisted-readback/report.json").read_text())
          s=json.loads((root/"stage/report.json").read_text())["counts"]
          assert r["status"]=="verified" and r["unverified_identities"]==0
          assert r["existing_values_overwritten"]==0
          assert r["enriched_matches"]==s["staged_matches"]
          assert r["new_stat_values"]==s["new_stat_values"]
          print("COMMITTED CDB COMPLEMENTS VERIFIED:",r,flush=True)
          PY

      - name: Verify second full CDB stage is idempotent after remote publication
        if: ${{ steps.request.outputs.mode == 'write' && steps.gate.outputs.changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/tbt/cdb-pairwise-write
          python scripts/recover_cdb_opponent_service_rates.py --mode stage --pairwise --history-dir "$root/persisted" --out-dir "$root/idempotence"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".cache/tbt/cdb-pairwise-write/idempotence/report.json")
          r=json.loads(p.read_text())
          assert r["counts"].get("staged_matches",0)==0
          assert r["counts"].get("new_stat_values",0)==0
          assert r["production_mutated"] is False
          print("PAIRWISE_REMOTE_IDEMPOTENCE_PASS",r["counts"],flush=True)
          PY

      - name: Retain provenance and independent readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdb-pairwise-${{ github.run_id }}
          path: |
            .cache/tbt/cdb-pairwise-write/source-snapshot.json
            .cache/tbt/cdb-pairwise-write/stage/report.json
            .cache/tbt/cdb-pairwise-write/stage/stage.jsonl
            .cache/tbt/cdb-pairwise-write/write/report.json
            .cache/tbt/cdb-pairwise-write/local-readback/report.json
            .cache/tbt/cdb-pairwise-write/persisted-download.json
            .cache/tbt/cdb-pairwise-write/persisted-readback/report.json
            .cache/tbt/cdb-pairwise-write/idempotence/report.json
          if-no-files-found: warn
          retention-days: 45

      - name: Release global canonical writer lock
        if: always()
        shell: bash
        run: python scripts/cdb_global_writer_lock.py release --if-held
