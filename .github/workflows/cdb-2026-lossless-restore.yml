name: Restore 2026 CDB backup-only match IDs (guarded, lossless)
'on':
  pull_request:
    paths:
      - scripts/restore_cdb_2026_lossless.py
      - tests/test_restore_cdb_2026_lossless.py
      - .github/workflows/cdb-2026-lossless-restore.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/cdb-2026-lossless-restore.yml
      - .github/cdb-2026-lossless-restore-request.json
permissions:
  contents: read
concurrency:
  group: blinq-cdb-2026-lossless-recovery
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed union/identity tests
        env:
          PYTHONPATH: api:scripts
        run: |
          set -euo pipefail
          python -m pip install --quiet pyarrow pytest
          python -m py_compile scripts/restore_cdb_2026_lossless.py
          python -m pytest -q tests/test_restore_cdb_2026_lossless.py tests/test_cdb_history_row_guard.py

  private-recovery:
    needs: offline-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact private request, source and no model/API side-effects
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/BackstageTalks/tbt-data --jq .private)" = true
          file=.github/cdb-2026-lossless-restore-request.json
          jq -e '
            .schema == 1 and
            .source_tag == "blinq-full-training-backup-40554915730-1" and
            .source_2026_sha256 == "b1d91433808b3c5c6bc0fec36098a92c68a17f7b25da582e462d67f9a8d97d7c" and
            .expected_old_only == 97736 and
            .provider_requests == 0 and
            .model_changes == false and
            (.mode == "dry-run" or .mode == "write") and
            (if .mode == "write" then .approved_by_operator == true else .approved_by_operator == false end)
          ' "$file" >/dev/null
          mode="$(jq -r .mode "$file")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "CDB 2026 recovery mode: $mode"
      - name: Install existing canonical dependencies
        run: python -m pip install --quiet -r api/requirements-train.txt pytest
      - name: Acquire existing cross-repository writer only for verified restoration
        if: steps.request.outputs.mode == 'write'
        run: python scripts/cdb_global_writer_lock.py acquire --wait-seconds 1200
      - name: Stage missing original backup-only rows and preserve all current data
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          python scripts/restore_cdb_2026_lossless.py \
            --mode "${{ steps.request.outputs.mode }}" \
            --expected-old-only 97736 \
            --out ".cache/tbt/cdb2026-restore-${GITHUB_RUN_ID}"
      - name: Retain aggregated results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-cdb2026-lossless-${{ github.run_id }}
          path: .cache/tbt/cdb2026-restore-*/report.json
          if-no-files-found: warn
          retention-days: 45
      - name: Release only this run's exact global writer lock
        if: always()
        run: python scripts/cdb_global_writer_lock.py release --if-held
