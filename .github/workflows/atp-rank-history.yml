name: BlinQ ATP weekly rank history audit

on:
  pull_request:
    paths:
      - ".github/atp-rank-history-request.json"
      - ".github/workflows/atp-rank-history.yml"
      - "scripts/audit_atp_weekly_rank_history.py"
      - "scripts/import_atp_weekly_rank_fill.py"
      - "scripts/validate_atp_weekly_rank_source.py"
      - "tests/test_atp_rank_history_contract.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: atp-rank-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Focused contract tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_atp_rank_history_contract.py -q

      - name: Resolve controlled request
        run: |
          set -euo pipefail
          request=.github/atp-rank-history-request.json
          test "$(jq -r '.mode' "$request")" = "dry-run"
          test "$(jq -r '.rapidapi_requests' "$request")" = "0"
          test "$(jq -r '.source_mode' "$request")" = "pinned_sqlite"

      - name: Download pinned upstream ATP rankings database
        run: |
          mkdir -p .cache/tbt/atp-rank/source
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Jupiterian/ATP-Rankings-API/247f2f5e86b9e142a7ead7b0e8b3dfb5ee6abb28/rankings.db" \
            --output .cache/tbt/atp-rank/source/rankings.db
          test -s .cache/tbt/atp-rank/source/rankings.db

      - name: Download independent ATP benchmark
        run: |
          mkdir -p .cache/tbt/atp-rank/benchmark
          for year in 2024 2025 2026; do
            gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/BackstageTalks/tbt-pro/contents/data/history/sackmann_archive/atp/$year/atp_matches_$year.csv" \
              > ".cache/tbt/atp-rank/benchmark/atp_matches_$year.csv"
          done

      - name: Validate weekly rankings against Sackmann match ranks
        run: |
          python scripts/validate_atp_weekly_rank_source.py \
            --sqlite-db .cache/tbt/atp-rank/source/rankings.db \
            --csv .cache/tbt/atp-rank/benchmark/atp_matches_2024.csv \
            --csv .cache/tbt/atp-rank/benchmark/atp_matches_2025.csv \
            --csv .cache/tbt/atp-rank/benchmark/atp_matches_2026.csv \
            --out .cache/tbt/atp-rank/source-validation.json

      - name: Validate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(".cache/tbt/atp-rank/source-validation.json").read_text())
          print(json.dumps(report, indent=2))
          counts=report.get("counts") or {}
          if report.get("production_mutated") is not False:
              raise SystemExit("Validation unexpectedly mutated production")
          if int(report.get("rapidapi_requests",-1)) != 0:
              raise SystemExit("RapidAPI budget was touched")
          if int(counts.get("source_player_linked") or 0) < 1000:
              raise SystemExit("Too few ATP ranking rows linked to independent benchmark")
          if float(report.get("within5_rate") or 0) < 0.90:
              raise SystemExit("ATP weekly ranking source disagrees too often with benchmark")
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: blinq-atp-rank-history-${{ github.run_id }}
          path: .cache/tbt/atp-rank/source-validation.json
          retention-days: 14
