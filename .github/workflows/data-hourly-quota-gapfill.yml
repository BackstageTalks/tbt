name: BlinQ targeted CDB API gapfill (UTC 17:09 reset, 98% closeout)

# GitHub cron is intentionally forbidden by the repository contract.
# Manual workflow_dispatch is intended for an external hourly schedule with
# progressive hourly caps, 14,700-call closeout 35–7 minutes before the fixed 17:09 UTC
# reset (18:09 winter / 19:09 summer), and 17:10–17:13 UTC new-day start.
# A single canonical writer runs at once.
on:
  push:
    branches: [main]
    paths:
      - '.github/hourly-api-gapfill-smoke.json'
      - '.github/hourly-api-gapfill-tick.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check only (true) or actually start safe statistics ingestion (false).
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: tbt-hourly-api-gapfill-orchestrator
  cancel-in-progress: false

jobs:
  guard-plan-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
      WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      CDB_READ_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      DRY_RUN: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[api-autofill-tick]')) || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify budget, reserve hourly capacity, and dispatch governed pipeline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, time, timedelta, timezone
          from time import sleep
          from zoneinfo import ZoneInfo

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.getenv("GH_TOKEN", "")
          CDB_READ_TOKEN = os.getenv("CDB_READ_TOKEN", "")
          WORKER = os.getenv("WORKER_TOKEN", "")
          BUDGET_URL = os.getenv("BUDGET_URL", "")
          DRY_RUN = os.getenv("DRY_RUN", "false").lower() == "true"
          ZONE = ZoneInfo("Europe/Bratislava")
          now = datetime.now(timezone.utc)
          local = now.astimezone(ZONE)

          # Fixed UTC provider reset survives DST. Source budget is checked
          # independently after this scheduling preflight.
          caps = {12: 5700, 13: 6900, 14: 8100, 15: 9300,
                  16: 10500, 17: 12000, 18: 13500}
          def next_provider_reset(instant):
              reset_at = instant.replace(hour=17, minute=9, second=0, microsecond=0)
              if instant >= reset_at:
                  reset_at += timedelta(days=1)
              return reset_at

          expected_reset = next_provider_reset(now)
          stage_hour = local.hour + (19 - expected_reset.astimezone(ZONE).hour)
          until_reset = (expected_reset - now).total_seconds()
          # Runner start and writer resumption both recompute UTC-relative slots.
          final_topup = 7 * 60 <= until_reset <= 35 * 60 + 59
          new_day_start = now.hour == 17 and 10 <= now.minute <= 13
          reset_local = expected_reset.astimezone(ZONE)
          print(f"Bratislava time: {local.isoformat()}; next API reset: "
                f"{reset_local.strftime('%Y-%m-%d %H:%M %Z')} "
                f"(UTC {expected_reset.isoformat()}); dry_run={DRY_RUN}", flush=True)
          if stage_hour not in caps and not final_topup and not new_day_start and not DRY_RUN:
              print("Outside permitted API dispatch slots; skipping.")
              sys.exit(0)
          if not TOKEN or not WORKER or not CDB_READ_TOKEN or not BUDGET_URL.startswith("https://"):
              raise SystemExit("Required GitHub / shared-budget credentials missing; fail closed")

          def get_json(url, token, worker=False):
              headers = ({"X-Blinq-Worker-Token": token} if worker else {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              request = urllib.request.Request(url, headers=headers, method="GET")
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          def check_writers():
              # Also inspect the authoritative private CDB tag: some writers
              # run outside this repo or have workflow names not in this list.
              # Never remove or time-expire a lock in this scheduler.
              from scripts.api_writer_wait import read_cdb_writer_lock
              active = read_cdb_writer_lock(get_json, CDB_READ_TOKEN)
              # Check all concurrent and pending runs, not just this scheduler.
              writer_paths = {
                  "data.yml", "training-data-enrichment.yml",
                  "training-db-rebuild.yml", "nightly-data-maintenance.yml",
                  "environment-enrichment.yml", "valuebet-market-history.yml",
                  "offline-uploaded-history-enrichment.yml",
                  "kaggle-wta-2016-2017-odds.yml", "atp-rank-history.yml",
                  "wta-rank-gapfill.yml", "wta-rank-history-audit.yml",
                  "livetennisapi-public-sample.yml", "kaggle-hwaitt-history-enrichment.yml",
                  "tennis-data-historical-odds.yml", "rank-input-readback-closeout.yml",
              }
              for status in ("queued", "pending", "in_progress", "waiting", "requested"):
                  url = f"https://api.github.com/repos/{REPO}/actions/runs?status={status}&per_page=100"
                  result = get_json(url, TOKEN)
                  if int(result.get("total_count", 0)) > 100:
                      raise RuntimeError("Active workflow results paginated; fail closed")
                  for run in result.get("workflow_runs", []):
                      path = str(run.get("path") or "").split("@", 1)[0].rsplit("/", 1)[-1]
                      if path in writer_paths:
                          active.append(f"{path} run={run.get('id')} status={status}")
              return active

          # A missing/unavailable ledger must never be interpreted as zero usage.
          budget_response = get_json(BUDGET_URL, WORKER, worker=True)
          if budget_response.get("ok") is not True:
              raise SystemExit("Shared budget did not confirm status; no dispatch")
          budget = budget_response.get("budget")
          if not isinstance(budget, dict) or (
              budget.get("window") != "provider_day_17_09_utc"
              or budget.get("provider_plan_limit") != 15000
              or budget.get("global_limit") != 14700
              or budget.get("reserved_provider_headroom") != 300
          ):
              raise SystemExit("Unrecognized budget contract; no dispatch")

          spent = int(budget["global_spent"])
          remaining = int(budget["global_remaining"])
          history_remaining = int(budget["remaining"]["history"])
          if stage_hour not in caps and not final_topup and not new_day_start:
              print(f"No new job outside guarded hours Europe/Bratislava; "
                    f"shared ledger {spent}/15000, remaining to shared ceiling={remaining}.")
              if DRY_RUN:
                  print("DRY RUN active writer check: " + str(check_writers()))
              sys.exit(0)
          if spent < 0 or remaining != max(0, 14700-spent):
              raise SystemExit("Shared budget inconsistency; no dispatch")
          reset = datetime.fromisoformat(str(budget["next_reset_utc"]).replace("Z", "+00:00"))
          if (reset.tzinfo is None or reset.astimezone(timezone.utc) != expected_reset
                  or budget.get("schema") != 2):
              raise SystemExit("Provider UTC reset/schema inconsistent; no dispatch")

          limit = 3000 if new_day_start else (14500 if final_topup else caps[stage_hour])
          # At most 3000 per job; the provider rechecks the 300-remaining
          # header and the shared ETag ledger before every billable attempt.
          # Two bounded DAILY slots collect provider-1 market IDs and PBP.
          # The extras downloader consumes 2026 first, then 2025, then older
          # seasons as verified/cooldown-covered events leave the queue.
          # Other hourly ticks retain high-yield whole-match/per-set statistics.
          # Never run extras in final closeout/reset.
          extras_slot = stage_hour in (14, 17) and not final_topup and not new_day_start
          proposed = min(3000, limit-spent, 14500-spent, remaining, history_remaining)
          if extras_slot:
              proposed = min(proposed, 450)  # <= 150 events at 3 calls each
          print(f"API budget: {spent}/15000 used; hourly ceiling={limit}; "
                f"global remaining={remaining}; proposed max={proposed}", flush=True)

          if proposed < 1:
              print("No request allowance left beneath the applicable staged/98% ceiling.")
              sys.exit(0)


          # A busy canonical writer *or its authoritative private tag* is
          # deferred, not silently skipped. An unobservable tag fails closed.
          # Leave the Git tag lock untouched while waiting. Keep the
          # window bounded below the 6-hour GitHub Actions job maximum.
          run_day = local.date()
          window_end_utc = (expected_reset - timedelta(days=1) + timedelta(minutes=5)
                            if new_day_start else expected_reset - timedelta(minutes=7))
          retry_deadline = min(now + timedelta(hours=5, minutes=40), window_end_utc)
          if DRY_RUN:
              active = check_writers()
              if active:
                  print("DRY RUN canonical writer busy; no dispatch: " + "; ".join(active))
                  sys.exit(0)
              waited = False
          else:
              from scripts.api_writer_wait import wait_for_writer
              try:
                  waited = wait_for_writer(check_writers, retry_deadline)
              except TimeoutError as exc:
                  raise SystemExit(str(exc)) from exc

          if waited:
              # The clock, staged hourly allowance and shared ledger can all
              # change while a writer is active. Never reuse the old allowance.
              now = datetime.now(timezone.utc)
              local = now.astimezone(ZONE)
              expected_reset = next_provider_reset(now)
              stage_hour = local.hour + (19 - expected_reset.astimezone(ZONE).hour)
              until_reset = (expected_reset - now).total_seconds()
              final_topup = 7 * 60 <= until_reset <= 35 * 60 + 59
              new_day_start = now.hour == 17 and 10 <= now.minute <= 13
              if (
                  local.date() != run_day
                  or (stage_hour not in caps and not final_topup and not new_day_start)
              ):
                  raise SystemExit("Canonical writer released outside a permitted dispatch window")

              budget_response = get_json(BUDGET_URL, WORKER, worker=True)
              if budget_response.get("ok") is not True:
                  raise SystemExit("Shared budget unavailable after writer wait; no dispatch")
              budget = budget_response.get("budget")
              if not isinstance(budget, dict) or (
                  budget.get("window") != "provider_day_17_09_utc"
                  or budget.get("provider_plan_limit") != 15000
                  or budget.get("global_limit") != 14700
                  or budget.get("reserved_provider_headroom") != 300
              ):
                  raise SystemExit("Unrecognized budget contract after writer wait; no dispatch")
              spent = int(budget["global_spent"])
              remaining = int(budget["global_remaining"])
              history_remaining = int(budget["remaining"]["history"])
              if spent < 0 or remaining != max(0, 14700-spent):
                  raise SystemExit("Shared budget inconsistency after writer wait; no dispatch")
              reset = datetime.fromisoformat(str(budget["next_reset_utc"]).replace("Z", "+00:00"))
              if (
                  reset.tzinfo is None
                  or reset.astimezone(timezone.utc) != expected_reset
                  or budget.get("schema") != 2
              ):
                  raise SystemExit("Provider reset inconsistent after writer wait; no dispatch")
              limit = 3000 if new_day_start else (14500 if final_topup else caps[stage_hour])
              extras_slot = stage_hour in (14, 17) and not final_topup and not new_day_start
              proposed = min(3000, limit-spent, remaining, history_remaining)
              if extras_slot:
                  proposed = min(proposed, 450)
              print(f"Post-wait API budget: {spent}/15000; staged ceiling={limit}; "
                    f"global remaining={remaining}; proposed max={proposed}", flush=True)
              if proposed < 1:
                  print("No quota allowance remains after writer wait; no dispatch.")
                  sys.exit(0)

          # hourly_autofill enables a missing-field queue in data.yml:
          # canonical event identity, retry cooldown, recent-year priority,
          # and ace/DF gaps even when serve/return rates are already present.
          # Statistics mode uses canonical identity, missing-field skip logic,
          # and fail-closed provider-header quota checks. Stop well BEFORE the
          # verified 17:09 UTC reset; do not borrow the next provider day.
          cutoff = expected_reset - timedelta(minutes=2)
          if now >= cutoff - timedelta(minutes=4):
              print("Less than 4 minutes until provider cutoff; no dispatch")
              sys.exit(0)
          last_complete = local.date() - timedelta(days=1)
          payload = {
              "ref": "main",
              "inputs": {
                  "mode": "statistics",
                  "start": "2022-01-01",
                  "end": last_complete.isoformat(),
                  "max_requests": str(proposed),
                  "lookback_days": "1095",
                  "promote": "false",
                  "hourly_autofill": "true",
                  "autofill_stop_at_utc": cutoff.isoformat(),
              },
          }
          if extras_slot:
              payload["inputs"]["mode"] = "extras"
          print("Guarded statistics/extras plan: " + json.dumps(payload, sort_keys=True))
          if DRY_RUN:
              print("DRY RUN - no GitHub workflow dispatched.")
              sys.exit(0)

          request = urllib.request.Request(
              f"https://api.github.com/repos/{REPO}/actions/workflows/data.yml/dispatches",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise RuntimeError(f"Unexpected GitHub dispatch HTTP {response.status}")
          print("GitHub accepted guarded statistics dispatch. This is not proof of completed ingestion.")
          PY
