name: BlinQ hourly API gapfill (90% staged, 97% closeout)

# GitHub cron is intentionally forbidden by the repository contract.
# Manual workflow_dispatch is intended for an external hourly schedule with
# a 90% 18:45 launch, optional 97% 18:55 closeout, and 19:11 new-day start.
# remain compatible but are not required. A single canonical writer runs at once.
on:
  push:
    branches: [main]
    paths:
      - '.github/hourly-api-gapfill-smoke.json'
      - '.github/hourly-api-gapfill-tick.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check only (true) or actually start safe statistics ingestion (false).
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: tbt-hourly-api-gapfill-orchestrator
  cancel-in-progress: false

jobs:
  guard-plan-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
      WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[api-autofill-tick]')) || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Verify budget, reserve hourly capacity, and dispatch governed pipeline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, time, timedelta, timezone
          from zoneinfo import ZoneInfo

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.getenv("GH_TOKEN", "")
          WORKER = os.getenv("WORKER_TOKEN", "")
          BUDGET_URL = os.getenv("BUDGET_URL", "")
          DRY_RUN = os.getenv("DRY_RUN", "false").lower() == "true"
          ZONE = ZoneInfo("Europe/Bratislava")
          now = datetime.now(timezone.utc)
          local = now.astimezone(ZONE)

          # Progressive cumulative caps across all purposes, including LIVE,
          # Match Status, refresh and history, plus committed reservations.
          # The provider-day shared ledger enforces the absolute 97% cap.
          # The 18:00 cap also applies to the operator's final 18:45 launch.
          caps = {12: 5700, 13: 6900, 14: 8100, 15: 9300,
                  16: 10500, 17: 12000, 18: 13500}
          print(f"Bratislava time: {local.isoformat()}; dry_run={DRY_RUN}", flush=True)
          final_topup = local.hour == 18 and 55 <= local.minute <= 57
          new_day_start = local.hour == 19 and local.minute == 11
          if local.hour not in caps and not final_topup and not new_day_start and not DRY_RUN:
              print("Outside permitted API dispatch slots; skipping.")
              sys.exit(0)
          if local.hour == 19 and not new_day_start:
              print("No provider dispatch near the 19:10 reset except at 19:11.")
              sys.exit(0)
          if not TOKEN or not WORKER or not BUDGET_URL.startswith("https://"):
              raise SystemExit("Required GitHub / shared-budget credentials missing; fail closed")

          def get_json(url, token, worker=False):
              headers = ({"X-Blinq-Worker-Token": token} if worker else {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              request = urllib.request.Request(url, headers=headers, method="GET")
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          def check_writers():
              # Check all concurrent and pending runs, not just this scheduler.
              writer_paths = {
                  "data.yml", "training-data-enrichment.yml",
                  "training-db-rebuild.yml", "nightly-data-maintenance.yml",
                  "environment-enrichment.yml", "valuebet-market-history.yml",
                  "offline-uploaded-history-enrichment.yml",
                  "kaggle-wta-2016-2017-odds.yml", "atp-rank-history.yml",
                  "wta-rank-gapfill.yml", "wta-rank-history-audit.yml",
                  "livetennisapi-public-sample.yml", "kaggle-hwaitt-history-enrichment.yml",
                  "tennis-data-historical-odds.yml", "rank-input-readback-closeout.yml",
              }
              active = []
              for status in ("queued", "pending", "in_progress", "waiting", "requested"):
                  url = f"https://api.github.com/repos/{REPO}/actions/runs?status={status}&per_page=100"
                  result = get_json(url, TOKEN)
                  if int(result.get("total_count", 0)) > 100:
                      raise RuntimeError("Active workflow results paginated; fail closed")
                  for run in result.get("workflow_runs", []):
                      path = str(run.get("path") or "").split("@", 1)[0].rsplit("/", 1)[-1]
                      if path in writer_paths:
                          active.append(f"{path} run={run.get('id')} status={status}")
              return active

          # A missing/unavailable ledger must never be interpreted as zero usage.
          budget_response = get_json(BUDGET_URL, WORKER, worker=True)
          if budget_response.get("ok") is not True:
              raise SystemExit("Shared budget did not confirm status; no dispatch")
          budget = budget_response.get("budget")
          if not isinstance(budget, dict) or (
              budget.get("window") != "provider_day_19_10_europe_bratislava"
              or budget.get("provider_plan_limit") != 15000
              or budget.get("global_limit") != 14550
              or budget.get("reserved_provider_headroom") != 450
          ):
              raise SystemExit("Unrecognized budget contract; no dispatch")

          spent = int(budget["global_spent"])
          remaining = int(budget["global_remaining"])
          history_remaining = int(budget["remaining"]["history"])
          if local.hour not in caps and not final_topup and not new_day_start:
              print(f"No new job outside guarded hours Europe/Bratislava; "
                    f"shared ledger {spent}/15000, remaining to 97%={remaining}.")
              if DRY_RUN:
                  print("DRY RUN active writer check: " + str(check_writers()))
              sys.exit(0)
          if spent < 0 or remaining != max(0, 14550-spent):
              raise SystemExit("Shared budget inconsistency; no dispatch")
          reset = datetime.fromisoformat(str(budget["next_reset_utc"]).replace("Z", "+00:00"))
          expected_reset_date = local.date() + timedelta(days=1) if new_day_start else local.date()
          if reset.tzinfo is None or reset.astimezone(ZONE).date() != expected_reset_date or reset.astimezone(ZONE).hour != 19 or reset.astimezone(ZONE).minute != 10:
              raise SystemExit("Provider reset time inconsistent; no dispatch")

          limit = 3000 if new_day_start else (14550 if final_topup else caps[local.hour])
          # At most 3000 per job; the provider rechecks the 450-remaining
          # header and the shared ETag ledger before every billable attempt.
          proposed = min(3000, limit-spent, remaining, history_remaining)
          print(f"API budget: {spent}/15000 used; hourly ceiling={limit}; "
                f"global remaining={remaining}; proposed max={proposed}", flush=True)

          if proposed < 1:
              print("No request allowance left beneath the applicable staged/97% ceiling.")
              sys.exit(0)

          active = check_writers()
          if active:
              print("Canonical writer active/queued; no dispatch: " + "; ".join(active))
              sys.exit(0)

          # Statistics mode uses canonical identity, quality-ready skip logic,
          # and fail-closed provider-header quota checks. Stop well BEFORE the
          # verified 19:10 provider reset; do not use old-day quota after 19:08.
          cutoff_date = local.date() + timedelta(days=1) if new_day_start else local.date()
          cutoff_local = datetime.combine(cutoff_date, time(19, 8), tzinfo=ZONE)
          cutoff = cutoff_local.astimezone(timezone.utc)
          if now >= cutoff - timedelta(minutes=4):
              print("Less than 4 minutes until provider cutoff; no dispatch")
              sys.exit(0)
          last_complete = local.date() - timedelta(days=1)
          payload = {
              "ref": "main",
              "inputs": {
                  "mode": "statistics",
                  "start": "2022-01-01",
                  "end": last_complete.isoformat(),
                  "max_requests": str(proposed),
                  "lookback_days": "1095",
                  "promote": "false",
                  "hourly_autofill": "true",
                  "autofill_stop_at_utc": cutoff.isoformat(),
              },
          }
          print("Guarded statistics plan: " + json.dumps(payload, sort_keys=True))
          if DRY_RUN:
              print("DRY RUN - no GitHub workflow dispatched.")
              sys.exit(0)

          request = urllib.request.Request(
              f"https://api.github.com/repos/{REPO}/actions/workflows/data.yml/dispatches",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise RuntimeError(f"Unexpected GitHub dispatch HTTP {response.status}")
          print("GitHub accepted guarded statistics dispatch. This is not proof of completed ingestion.")
          PY
