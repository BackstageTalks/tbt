name: BlinQ Charting context recovery and CDB gaps once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blinq-charting-cdb-context-recovery-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-charting-context-recovery-readonly
  cancel-in-progress: false

jobs:
  recovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: main
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: private-data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify read-only source and local regression tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          python -m pip install --disable-pip-version-check --quiet pyarrow 'pandas>=2,<3'
          (cd app && python -m unittest discover -s tests -p test_charting_cdb_field_gap_review.py -v)
          (cd private-data && PYTHONPATH=scripts python -m unittest discover -s tests -p test_charting_cdb_context_recovery.py -v)
          (cd private-data && PYTHONPATH=scripts python -m unittest discover -s tests -p test_charting_cdb_safe_bridge.py -v)
      - name: Download stable SHA-verified current CDB
        shell: bash
        working-directory: app
        env:
          PYTHONPATH: api:scripts
        run: |
          set -euo pipefail
          python scripts/download_stable_cdb.py \
            --repository "$PRIVATE_REPO" --tag tbt-data-v1 \
            --out "$GITHUB_WORKSPACE/.cache/charting-recovery/history" \
            --report "$GITHUB_WORKSPACE/.cache/charting-recovery/snapshot.json"
      - name: Independently pin current CDB partition digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.cache/charting-recovery')
          h=root/'history'
          mf=json.loads((h/'history_manifest.json').read_text())
          bundle=json.loads((h/'_tbt_bundle_manifest.json').read_text())
          pins={}
          for y,entry in mf['years'].items():
              filename=f'history-{int(y):04d}.parquet'
              assert entry['asset']==filename
              assert bundle['files'][filename]['sha256']==entry['sha256']
              assert (h/filename).is_file()
              pins[filename]=entry['sha256']
          assert pins and set(pins)=={p.name for p in h.glob('history-*.parquet')}
          (root/'pins.json').write_text(json.dumps(pins,indent=2))
          print('VERIFIED_YEAR_PARTITIONS',len(pins))
          PY
      - name: Reconcile exact source event metadata in pinned CDB
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/charting-recovery
          python private-data/scripts/charting_cdb_safe_bridge.py \
            --charting private-data/tennis/charting/matches.json.gz \
            --cdb "$root"/history/history-*.parquet \
            --expected-shas "$root/pins.json" \
            --output "$root/exact"
      - name: Categorize context discrepancies and one-day date offsets
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/charting-recovery
          python private-data/scripts/charting_cdb_context_recovery.py \
            --charting private-data/tennis/charting/matches.json.gz \
            --crosswalk "$root/exact/crosswalk_candidates.jsonl.gz" \
            --cdb "$root"/history/history-*.parquet \
            --pins "$root/pins.json" \
            --output "$root/context"
      - name: Compare recovery candidates to existing canonical stats (no writes)
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/charting-recovery
          python app/scripts/charting_cdb_field_gap_review.py \
            --charting private-data/tennis/charting/matches.json.gz \
            --players private-data/tennis/charting/players.json \
            --profiles-root private-data/tennis/charting \
            --crosswalk "$root/context/context_recovery_research_only.jsonl.gz" \
            --cdb "$root"/history/history-*.parquet \
            --expected-shas "$root/pins.json" \
            --output "$root/gaps"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.cache/charting-recovery')
          context=json.loads((root/'context/context_recovery_report.json').read_text())
          gaps=json.loads((root/'gaps/field_gap_report.json').read_text())
          assert gaps['canonical_cdb_writes']==0 and gaps['approved_cdb_cells']==0
          assert context['canonical_cdb_writes']==0
          assert gaps['counts']['context_review_candidate_rows']==sum(context['counts'].get(k,0)
              for k in ('RESEARCH_TOURNAMENT_ALIAS_ONLY','RESEARCH_ONE_DAY_UTC_SHIFT_ONLY'))
          assert gaps['counts']['compound_candidate_rows']==0
          print('RECOVERED_CONTEXT_CANDIDATES',json.dumps(context['counts'],sort_keys=True))
          print('RECOVERED_FIELD_GAP_COUNTS',json.dumps(gaps['counts'],sort_keys=True))
          PY
      - name: Immutable PRIVATE findings with SHA/readback
        shell: bash
        run: |
          set -euo pipefail
          root=.cache/charting-recovery
          tag="blinq-charting-context-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$root/private" "$root/readback"
          cp "$root/context/context_recovery_report.json" "$root/private/"
          cp "$root/context/context_recovery_research_only.jsonl.gz" "$root/private/"
          cp "$root/gaps/field_gap_report.json" "$root/private/"
          cp "$root/gaps/field_gap_research_only.jsonl.gz" "$root/private/"
          cp "$root/exact/crosswalk_report.json" "$root/private/"
          cp "$root/snapshot.json" "$root/private/"
          (cd "$root/private" && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
          python - "$root" <<'PY'
          import json,sys
          from pathlib import Path
          base=Path(sys.argv[1])
          c=json.loads((base/'context/context_recovery_report.json').read_text())
          g=json.loads((base/'gaps/field_gap_report.json').read_text())
          summary=[
            'Read-only Charting versus pinned current CDB context reconciliation.',
            'No canonical CDB change, no model training, no source deletion.',
            'Event identity remains research-only until independently attested.',
            '',
            'CONTEXT_COUNTS='+json.dumps(c['counts'],sort_keys=True),
            'FIELD_GAP_COUNTS='+json.dumps(g['counts'],sort_keys=True),
            'TOP_ALIASES='+json.dumps(c['top_tournament_alias_pairs'][:12],sort_keys=True)]
          (base/'private/summary.md').write_text('\n'.join(summary)+'\n')
          PY
          gh release create "$tag" "$root/private/"* -R "$PRIVATE_REPO" \
            --title 'BlinQ Charting context and CDB field-gap research (read only)' \
            --notes-file "$root/private/summary.md"
          gh release download "$tag" -R "$PRIVATE_REPO" -D "$root/readback"
          (cd "$root/readback" && sha256sum --check SHA256SUMS)
          cmp "$root/private/context_recovery_report.json" "$root/readback/context_recovery_report.json"
          echo "PRIVATE_CONTEXT_REPORT_READBACK_VERIFIED: $tag; CDB_WRITES=0"