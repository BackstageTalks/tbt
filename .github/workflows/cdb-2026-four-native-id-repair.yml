name: One-shot CDB 2026 source-native single-match restoration (guarded)
'on':
  push:
    branches: [main]
    paths:
      - '.github/cdb-2026-four-native-id-repair-request.json'
permissions:
  contents: read
concurrency:
  group: tbt-cdb-2026-one-match-restoration-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  restore-one-real-match:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Require explicit exactly pinned one-WTA-match write request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/BackstageTalks/tbt-data --jq .private)" = true
          jq -e '
            .schema == 1 and
            .mode == "write" and
            .approved_by_operator == true and
            .source_live_bundle_sha256 == "5396eb560146a92094c92d2d14fd52917f4e7ac176c8e4eed048e9b93cdba46c" and
            .expected_source_original_missing_ids == 4 and
            .expected_existing_event_aliases == 3 and
            .expected_real_net_new_matches == 1 and
            .expected_wta_nonnull_stats == 33 and
            .cdb_write_limit == 1 and
            .provider_requests == 0 and
            .model_changes == false
          ' .github/cdb-2026-four-native-id-repair-request.json >/dev/null
      - name: Install existing canonical CDB dependencies
        run: python -m pip install --quiet -r api/requirements-train.txt pytest
      - name: Run synthetic safety tests before any writer lock
        run: |
          python -m py_compile scripts/cdb_2026_four_identity_triage.py scripts/restore_cdb_2026_four_native_id.py
          python -m pytest -q tests/test_cdb_2026_four_identity_triage.py tests/test_restore_cdb_2026_four_native_id.py tests/test_cdb_history_row_guard.py
      - name: Acquire existing global cross-repository single-writer lock
        run: python scripts/cdb_global_writer_lock.py acquire --wait-seconds 1200
      - name: Dry-run exact original and prewrite native identity with NO write
        shell: bash
        run: |
          set -euo pipefail
          python scripts/restore_cdb_2026_four_native_id.py --mode dry-run --out ".cache/tbt/cdb-four-native-dry-$GITHUB_RUN_ID"
      - name: Repair exactly one missing WTA match via existing guarded ReleaseStore
        shell: bash
        run: |
          set -euo pipefail
          python scripts/restore_cdb_2026_four_native_id.py --mode write --out ".cache/tbt/cdb-four-native-write-$GITHUB_RUN_ID"
      - name: Preserve counts-only dry-run and persisted readback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cdb-2026-one-real-fixture-repair-${{ github.run_id }}
          path: |
            .cache/tbt/cdb-four-native-dry-*/report.json
            .cache/tbt/cdb-four-native-write-*/report.json
          if-no-files-found: warn
          retention-days: 45
      - name: Release only this run's existing CDB lock
        if: always()
        run: python scripts/cdb_global_writer_lock.py release --if-held
