name: Segment backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segment-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: api
      TBT_HISTORY_DIR: .cache/tbt/history
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
      - name: Verify private data repository
        run: |
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE"
      - name: Download partitioned GitHub history
        run: bash scripts/download_history_release.sh .cache/tbt
      - name: Validate history integrity
        run: python scripts/validate_history_partitions.py --history-dir "$TBT_HISTORY_DIR"
      - name: Run analysis from GitHub history
        run: python scripts/segment_backtest.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: segment-backtest-report
          path: reports/segment_backtest.json
          if-no-files-found: error
