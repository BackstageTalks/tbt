name: BlinQ Hwaitt verified facts (private canonical only)
on:
  push:
    branches: [ops/blinq-canonical-snapshot-20261009]
    paths: [.github/workflows/blinq-hwaitt-safe-facts-20261009.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  hwaitt_governed_enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Validate isolated private destination and script syntax
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || exit 1
          test "$(gh repo view BackstageTalks/tbt-data --json visibility -q .visibility)" = "PRIVATE" || exit 1
          python -m py_compile scripts/research/promote_verified_hwaitt_facts.py scripts/research/private_canonical_snapshot_v2.py scripts/research/promote_verified_missing_match_facts.py scripts/research/nightly_private_canonical_gap_scan.py scripts/link_offline_serve_return.py scripts/import_offline_linked_serve_return.py
      - name: Install deterministic history dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements-train.txt
      - name: Reconcile Hwaitt source with CURRENT canonical, back up and promote only null-to-valid historical facts with SHA readback
        run: python -u scripts/research/promote_verified_hwaitt_facts.py
      # Raw data and generated private audits must NEVER become PUBLIC actions artifacts.
