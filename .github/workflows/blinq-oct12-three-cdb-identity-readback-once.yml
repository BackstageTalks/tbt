name: BlinQ Oct12 three CDB persisted identity readback once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blinq-oct12-three-cdb-identity-readback-once.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r api/requirements.txt -r api/requirements-train.txt
      - name: Retrieve original verified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oct12-verified-evidence
          gh run download 38311389071 --repo BackstageTalks/tbt --name match-status-20261012-cdb-evidence --dir /tmp/oct12-verified-evidence
          test -s /tmp/oct12-verified-evidence/match-status-20261012-cdb-evidence.json
      - name: Independently verify actual persisted CDB identities, winners and results
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import defaultdict,Counter
          from propline_nightly_cdb import fetch_current
          from tbt.data.offline_odds import norm_text
          expected_names={
             "17305574":{"291733":"Janice Tjen","297194":"Aoi Ito"},
             "17307573":{"489272":"Jakub Vrba","318585":"Daniel Siniakov"},
             "17307734":{"200777":"Ugo Blanchet","200185":"Daniel De Jonge"},
          }
          stage=json.loads(Path('/tmp/oct12-verified-evidence/match-status-20261012-cdb-evidence.json').read_text())
          candidates={str(x.get('provider_event_id')):x for x in stage.get('candidates',[]) if isinstance(x,dict)}
          matches,digest=fetch_current(Path('/tmp/blinq-three-readback'))
          by_id=defaultdict(list)
          for m in matches:
              raw=m.provider_payload or {}
              eid=next((str(raw[k]) for k in ('_tbt_provider_event_id','provider_event_id','event_id','eventId') if raw.get(k)),None)
              if eid in expected_names:by_id[eid].append(m)
          rows=[]
          for eid,people in expected_names.items():
              source=candidates.get(eid,{})
              found=by_id.get(eid,[])
              state='VERIFIED' if len(found)==1 else 'MISSING_OR_AMBIGUOUS'
              record={'event_id':eid,'matches':len(found),'state':state}
              if len(found)==1:
                  m=found[0]
                  observed={str(m.player1_id):norm_text(m.player1_name),str(m.player2_id):norm_text(m.player2_name)}
                  expected={k:norm_text(v) for k,v in people.items()}
                  winner=str(source.get('winner_provider_id') or '')
                  pair_exact=observed==expected
                  final=bool(m.is_completed and str(m.winner_id or '')==winner and m.status.lower() in {'finished','completed','ended','ft'})
                  day_exact=m.scheduled_at.date().isoformat()=='2026-10-12'
                  tour_exact=m.tour.lower()==str(source.get('tour') or '').lower()
                  record.update({
                     'match_id':str(m.match_id),'player_ids_and_names_match':pair_exact,
                     'winner_matches_frozen_verified_provider':final,'scheduled_day_matches':day_exact,
                     'tour_matches':tour_exact,'canonical_status':m.status,
                     'canonical_stats_keys':sorted(str(k) for k,v in (m.stats or {}).items() if v is not None)[:50],
                     'stats_populated':sum(v is not None for v in (m.stats or {}).values()),
                  })
                  record['state']='VERIFIED_CANONICAL_OUTCOME' if all((pair_exact,final,day_exact,tour_exact)) else 'REVIEW_EXISTING_CONFLICT'
              rows.append(record)
          report={'schema':1,'status':'ALL_THREE_VERIFIED' if all(x['state']=='VERIFIED_CANONICAL_OUTCOME' for x in rows) else 'PARTIAL_REVIEW_REQUIRED','canonical_partition_sha256':digest,'verified_count':sum(x['state']=='VERIFIED_CANONICAL_OUTCOME' for x in rows),'checked_count':len(rows),'canonical_mutated':False,'rows':rows}
          Path('blinq-three-cdb-independent-readback.json').write_text(json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          print('OCT12_CDB_INDEPENDENT_READBACK '+json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blinq-three-cdb-independent-readback
          path: blinq-three-cdb-independent-readback.json
          retention-days: 30
          if-no-files-found: error
