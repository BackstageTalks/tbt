name: Set BlinQ Admin

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Email Firebase účtu, ktorý má byť ADMIN"
        required: true
        type: string

permissions:
  contents: read

jobs:
  set-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Firebase Admin
        run: python -m pip install firebase-admin

      - name: Set BlinQ admin claims
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}

        run: |
          python - <<'PY'
          import json
          import os

          import firebase_admin
          from firebase_admin import auth, credentials


          # =========================================================
          # LOAD CONFIG
          # =========================================================

          service_account_json = (
              os.environ.get("FIREBASE_SERVICE_ACCOUNT") or ""
          ).strip()

          admin_email = (
              os.environ.get("ADMIN_EMAIL") or ""
          ).strip().lower()


          # =========================================================
          # VALIDATION
          # =========================================================

          if not service_account_json:
              raise RuntimeError(
                  "Missing FIREBASE_SERVICE_ACCOUNT GitHub secret."
              )

          if not admin_email:
              raise RuntimeError(
                  "Admin email was not provided."
              )

          if "@" not in admin_email:
              raise RuntimeError(
                  "ADMIN_EMAIL does not look like a valid email address."
              )


          # =========================================================
          # LOAD FIREBASE SERVICE ACCOUNT
          # =========================================================

          try:
              service_account = json.loads(
                  service_account_json
              )
          except json.JSONDecodeError as exc:
              raise RuntimeError(
                  "FIREBASE_SERVICE_ACCOUNT is not valid JSON."
              ) from exc


          # Basic protection against accidentally using wrong JSON
          required_keys = {
              "type",
              "project_id",
              "private_key",
              "client_email"
          }

          missing_keys = required_keys - set(service_account.keys())

          if missing_keys:
              raise RuntimeError(
                  "Firebase service account JSON is missing keys: "
                  + ", ".join(sorted(missing_keys))
              )


          # =========================================================
          # INITIALIZE FIREBASE ADMIN
          # =========================================================

          firebase_admin.initialize_app(
              credentials.Certificate(service_account)
          )

          print("Firebase Admin initialized.")
          print("Project:", service_account.get("project_id"))


          # =========================================================
          # FIND USER BY EMAIL
          # =========================================================

          print("")
          print("Looking for Firebase user:")
          print(admin_email)

          try:
              user = auth.get_user_by_email(admin_email)
          except auth.UserNotFoundError as exc:
              raise RuntimeError(
                  f"No Firebase Authentication user found for: "
                  f"{admin_email}"
              ) from exc

          print("Firebase user found.")
          print("Email:", user.email)
          print("UID:", user.uid)


          # =========================================================
          # PRESERVE EXISTING CUSTOM CLAIMS
          # =========================================================

          existing_claims = dict(
              user.custom_claims or {}
          )

          print("")
          print("Existing claims:", existing_claims)


          # =========================================================
          # SET BLINQ ADMIN CLAIMS
          # =========================================================

          new_claims = dict(existing_claims)

          new_claims.update({
              "admin": True,
              "role": "admin",
              "tier": "goat"
          })

          auth.set_custom_user_claims(
              user.uid,
              new_claims
          )


          # =========================================================
          # VERIFY FIREBASE SAVED THEM
          # =========================================================

          updated_user = auth.get_user(
              user.uid
          )

          updated_claims = dict(
              updated_user.custom_claims or {}
          )

          if updated_claims.get("admin") is not True:
              raise RuntimeError(
                  "Firebase did not save admin=true."
              )

          if updated_claims.get("role") != "admin":
              raise RuntimeError(
                  "Firebase did not save role=admin."
              )

          if updated_claims.get("tier") != "goat":
              raise RuntimeError(
                  "Firebase did not save tier=goat."
              )


          # =========================================================
          # SUCCESS
          # =========================================================

          print("")
          print("==========================================")
          print("✅ BLINQ ADMIN SUCCESSFULLY SET")
          print("==========================================")
          print("Email:", updated_user.email)
          print("UID:", updated_user.uid)
          print("")
          print("Claims:")
          print(updated_claims)
          print("")
          print("admin = true")
          print("role  = admin")
          print("tier  = goat")
          print("")
          print("Odhlas sa z BlinQ a znovu sa prihlas.")
          print("==========================================")
          PY
