name: Read-only current CDB Serve Return coverage (audited)
on:
  pull_request:
    paths:
      - 'scripts/audit_cdb_serve_return_coverage.py'
      - 'tests/test_audit_cdb_serve_return_coverage.py'
      - '.github/workflows/audit-cdb-serve-return-current.yml'

permissions:
  contents: read

concurrency:
  group: cdb-serve-return-current-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  current-cdb:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts:.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify private canonical repository and test deterministic audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view BackstageTalks/tbt-data --json visibility -q .visibility)" = PRIVATE
          python -m unittest discover -s tests -p 'test_audit_cdb_serve_return_coverage.py' -v
      - name: Install Parquet reader
        run: python -m pip install --quiet pyarrow
      - name: Download one coherent immutable-hash-verified current CDB snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_stable_cdb.py --repository BackstageTalks/tbt-data --out .cache/cdb-serve-return/current --report .cache/cdb-serve-return/source-report.json
      - name: Measure current CDB Serve/Return missing cells and origin markers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_cdb_serve_return_coverage.py --history-dir .cache/cdb-serve-return/current --snapshot-report .cache/cdb-serve-return/source-report.json --out .cache/cdb-serve-return/current-coverage.json
      - name: Stage existing canonical-only exact complements with established full-integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_recover_cdb_opponent_service_rates.py tests/test_cdb_global_writer_lock.py
          python scripts/recover_cdb_opponent_service_rates.py --mode stage --history-dir .cache/cdb-serve-return/current --out-dir .cache/cdb-serve-return/stage
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".cache/cdb-serve-return/stage/report.json").read_text())
          print("VERIFIED_CDB_SERVE_RETURN_STAGE_COUNTS",json.dumps({"counts":r["counts"],"changed_years":r["changed_years"],"production_mutated":r["production_mutated"]},sort_keys=True))
          assert r["production_mutated"] is False
          PY
      - name: Checkout exact upstream Sackmann data snapshot for verified native-ID historical matches
        uses: actions/checkout@v4
        with:
          repository: Aneeshers/tennis-sackmann-archive
          ref: 83733587353df8a41f2fd4f516147d5aa83f5a8d
          path: source
          persist-credentials: false
      - name: Stage original source-native break-point return rates only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = 83733587353df8a41f2fd4f516147d5aa83f5a8d
          test -f source/atp/atp_matches_2020.csv
          python -m pytest -q tests/test_recover_cdb_sackmann_breakpoints.py
          python scripts/recover_cdb_sackmann_breakpoints.py --mode stage --source-dir source --history-dir .cache/cdb-serve-return/current --out-dir .cache/cdb-serve-return/native-bp
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".cache/cdb-serve-return/native-bp/report.json").read_text())
          print("VERIFIED_SACKMANN_ORIGINAL_NATIVE_BP_STAGE",json.dumps({"counts":r["counts"],"changed_years":r["changed_years"],"production_mutated":r["production_mutated"]},sort_keys=True))
          assert r["production_mutated"] is False
          PY
      - name: Explain all source-native breakpoint match lineage exclusions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_cdb_sackmann_native_bp_lineage.py --history-dir .cache/cdb-serve-return/current --source-dir source --out .cache/cdb-serve-return/native-bp-lineage.json
      - name: Upload read-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: cdb-serve-return-coverage
          path: |
            .cache/cdb-serve-return/current-coverage.json
            .cache/cdb-serve-return/stage/report.json
            .cache/cdb-serve-return/native-bp/report.json
            .cache/cdb-serve-return/native-bp-lineage.json
          retention-days: 30
