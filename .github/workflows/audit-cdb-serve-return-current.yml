name: Read-only current CDB Serve Return coverage (audited)
on:
  pull_request:
    paths:
      - 'scripts/audit_cdb_serve_return_coverage.py'
      - 'tests/test_audit_cdb_serve_return_coverage.py'
      - '.github/workflows/audit-cdb-serve-return-current.yml'

permissions:
  contents: read

concurrency:
  group: cdb-serve-return-current-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  current-cdb:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts:.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify private canonical repository and test deterministic audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view BackstageTalks/tbt-data --json visibility -q .visibility)" = PRIVATE
          python -m unittest discover -s tests -p 'test_audit_cdb_serve_return_coverage.py' -v
      - name: Install Parquet reader
        run: python -m pip install --quiet pyarrow
      - name: Download one coherent immutable-hash-verified current CDB snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_stable_cdb.py --repository BackstageTalks/tbt-data --out .cache/cdb-serve-return/current --report .cache/cdb-serve-return/source-report.json
      - name: Measure current CDB Serve/Return missing cells and origin markers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_cdb_serve_return_coverage.py --history-dir .cache/cdb-serve-return/current --snapshot-report .cache/cdb-serve-return/source-report.json --out .cache/cdb-serve-return/current-coverage.json
      - name: Upload read-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: cdb-serve-return-coverage
          path: .cache/cdb-serve-return/current-coverage.json
          retention-days: 30
