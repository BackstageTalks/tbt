name: DIL review replay independent QA
on:
  push:
    branches: [test/dil-review-fix-20261024]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  review-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout reviewed DIL fix branch (private)
        uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: fix/dil-review-replay-20261024
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: data
          persist-credentials: false
      - name: Run exact checked-in tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/data/dil_rebuild"
          python -m unittest discover -s data/dil_rebuild/tests -p test_rebuild.py -v
          python -m unittest discover -s data/dil_rebuild/tests -p test_review_replay.py -v
          python -m unittest discover -s data/dil_rebuild/tests -p test_converted_intake.py -v
      - name: Record tested commit
        shell: bash
        run: |
          cd data
          echo "TESTED_DIL_COMMIT=$(git rev-parse HEAD)"
