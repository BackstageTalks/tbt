name: Rebuild verified training DB

on:
  push:
    branches: [main]
    paths:
      - '.github/training-db-rebuild-request.json'

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install and verify private destination
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"

      - name: Download canonical history and verified priors
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_production_preflight_inputs.py
          mkdir -p .cache/tbt/atp-leaderboards .cache/tbt/wta-season-stats .cache/tbt/training-db
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore

          repo=os.environ["TBT_DATA_REPOSITORY"]

          atp=Path(".cache/tbt/atp-leaderboards")
          ReleaseStore(repo, "tbt-atp-leaderboards-v1", atp).download(
              extra_names=("atp_leaderboards_1991_2026_52week_career.csv",),
              required_names=("atp_leaderboards_1991_2026_52week_career.csv",),
              require_bundle_manifest=True,
          )

          PY
          gh release download tbt-wta-season-stats-v1 \
            --repo "$TBT_DATA_REPOSITORY" \
            --pattern wta_stats_2010_2026_serving_returning.csv \
            --dir .cache/tbt/wta-season-stats --clobber
          echo "023849319985801b1ab0065f77ff70f7d51a4fada6db0827c22d0b84659cba02  .cache/tbt/wta-season-stats/wta_stats_2010_2026_serving_returning.csv" | sha256sum -c -

      - name: Build leakage-safe ATP+WTA training DB
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_production_training_table.py             --history-dir .cache/tbt/history             --atp-leaderboards-csv .cache/tbt/atp-leaderboards/atp_leaderboards_1991_2026_52week_career.csv             --wta-season-stats-csv .cache/tbt/wta-season-stats/wta_stats_2010_2026_serving_returning.csv             --out .cache/tbt/training-db/training_table.parquet             --report .cache/tbt/training-db/training_table_report.json
          python scripts/audit_training_leakage.py             --history-dir .cache/tbt/history             --report .cache/tbt/training-db/leakage_audit_report.json

      - name: Publish training DB bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore
          root=Path(".cache/tbt/training-db")
          required=[
              root/"training_table.parquet",
              root/"training_table_report.json",
              root/"leakage_audit_report.json",
          ]
          if any(not p.is_file() or p.stat().st_size <= 0 for p in required):
              raise SystemExit("Refusing incomplete training DB publication")
          import json
          leakage=json.loads((root/"leakage_audit_report.json").read_text(encoding="utf-8"))
          if leakage.get("status") not in ("pass", "PASS", "passed", "verified"):
              raise SystemExit("Refusing training publication: leakage audit has no explicit PASS status")
          ReleaseStore(
              os.environ["TBT_DATA_REPOSITORY"],
              "tbt-training-table-v1",
              root,
          ).upload_bundle(required)
          PY

      - name: Read back and verify persisted training DB
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cache/tbt/training-db-readback
          mkdir -p .cache/tbt/training-db-readback
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          from release_store import ReleaseStore

          root=Path(".cache/tbt/training-db-readback")
          store=ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-training-table-v1", root)
          store.download(
              extra_names=("training_table.parquet","training_table_report.json","leakage_audit_report.json"),
              required_names=("training_table.parquet","training_table_report.json","leakage_audit_report.json"),
              require_bundle_manifest=True,
          )
          frame=pd.read_parquet(root/"training_table.parquet")
          report=json.loads((root/"training_table_report.json").read_text(encoding="utf-8"))
          leakage=json.loads((root/"leakage_audit_report.json").read_text(encoding="utf-8"))

          required_cols=[
              "atp_serve_rating_diff",
              "atp_return_rating_diff",
              "atp_pressure_rating_diff",
              "wta_first_serve_pct_diff",
              "wta_return_games_won_pct_diff",
              "wta_aces_per_match_diff",
          ]
          missing=[c for c in required_cols if c not in frame.columns]
          if missing:
              raise SystemExit("Missing persisted training features: "+", ".join(missing))
          if len(frame) < 1000:
              raise SystemExit(f"Unexpectedly small training DB: {len(frame)} rows")
          atp=report.get("atp_leaderboards") or {}
          wta=report.get("wta_season_stats") or {}
          if float(atp.get("known_both_rate") or 0) <= 0:
              raise SystemExit("ATP priors have zero persisted training coverage")
          if float(wta.get("known_both_rate") or 0) <= 0:
              raise SystemExit("WTA priors have zero persisted training coverage")

          verification={
              "schema":1,
              "status":"verified",
              "rows":int(len(frame)),
              "columns":int(len(frame.columns)),
              "atp_known_both_rate":float(atp.get("known_both_rate") or 0),
              "atp_surface_known_both_rate":float(atp.get("surface_known_both_rate") or 0),
              "wta_known_both_rate":float(wta.get("known_both_rate") or 0),
              "date_range":report.get("date_range"),
              "required_features_present":required_cols,
              "leakage_report":leakage,
          }
          out=Path(".cache/tbt/training-db-verification.json")
          out.write_text(json.dumps(verification,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(verification,ensure_ascii=False,indent=2))
          PY
          encoded="$(base64 -w0 .cache/tbt/training-db-verification.json)"
          path="audit/training-db-latest.json"
          sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Verify ATP+WTA training DB" -f content="$encoded" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Verify ATP+WTA training DB" -f content="$encoded" >/dev/null
          fi
