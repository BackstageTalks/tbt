# .github/workflows/audit-provider-duplicates.yml

name: Audit provider duplicates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt

      - name: Compile
        run: |
          python -m compileall -q api scripts

      - name: Audit provider duplicates
        env:
          PYTHONPATH: api
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/audit_provider_duplicates.py

      - name: Upload duplicate audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-duplicate-audit
          path: reports/provider_duplicate_audit.json
          if-no-files-found: warn
          retention-days: 14
