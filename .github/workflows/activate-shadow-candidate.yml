name: Activate verified frozen shadow candidate
run-name: "Model Lab activate shadow ${{ inputs.request_id || github.run_id }}"
on:
  # One-shot explicitly authorized research-only 7.2.2 activation.
  # The exact merge title and frozen digests guard this push; future edits do not activate.
  push:
    branches: [main]
    paths: [".github/workflows/activate-shadow-candidate.yml"]
  workflow_dispatch:
    inputs:
      request_id:
        description: Admin Model Lab correlation (optional)
        type: string
        required: false
        default: ''
      source_tag:
        description: Immutable protected candidate release
        required: true
        default: blinq-candidate-frozen-39368300257-1
        type: string
      expected_candidate_sha256:
        description: SHA-256 of candidate currently occupying the shadow slot
        required: true
        type: string
      prospective_only:
        description: Explicit research observation only, without claiming offline quality
        type: boolean
        default: false
      expected_source_sha256:
        description: Exact new model SHA-256, required for prospective research
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: blinq-model-backup-single-writer
  cancel-in-progress: false
jobs:
  activate:
    if: >-
      github.repository == 'BackstageTalks/tbt' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        startsWith(github.event.head_commit.message, 'chore(722): one-shot verified prospective shadow activation 20261112-run-42284691497')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      PYTHONUNBUFFERED: '1'
      SOURCE_TAG: ${{ github.event_name == 'push' && 'blinq-candidate-frozen-42284691497-1' || inputs.source_tag || 'blinq-candidate-frozen-39368300257-1' }}
      EXPECTED_SHA: ${{ github.event_name == 'push' && 'aa0f0ab10f08ef76f1bb793e431e460448ff7c645fb8528ba452957700215da8' || inputs.expected_candidate_sha256 || '7ac60b0b671091a7f620cca80a7c558b417e20c9448f577878625447e565c141' }}
      PROSPECTIVE_ONLY: ${{ github.event_name == 'push' && 'true' || inputs.prospective_only || false }}
      SOURCE_SHA: ${{ github.event_name == 'push' && '131a4dd71994f082bf5c041c5f7a785d581421170a44ace39de9e27c61f1de3f' || inputs.expected_source_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: python -m pip install -r api/requirements-train.txt pytest
      - run: python -m pytest -q tests/test_activate_shadow_candidate.py
      - run: python scripts/cdb_global_writer_lock.py acquire --wait-seconds 1800
      - name: Replace candidate and verify both remote bundles
        run: |
          args=()
          if [ "$PROSPECTIVE_ONLY" = "true" ]; then
            args+=(--prospective-only --expected-source-sha256 "$SOURCE_SHA")
          fi
          python scripts/activate_shadow_candidate.py --source-tag "$SOURCE_TAG" --expected-candidate-sha256 "$EXPECTED_SHA" "${args[@]}"
      # Admin visibility is best-effort; failure does not undo a fully
      # read-back verified candidate activation. The failed step remains
      # visible in Actions, without falsely marking model activation failed.
      - name: Update Admin comparison (best effort)
        continue-on-error: true
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        run: python scripts/publish_model_calibration_status.py --output .cache/tbt/activation-admin-snapshot.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-activation-${{ github.run_id }}
          path: .cache/tbt/candidate-activation-status.json
      - if: always()
        run: python scripts/cdb_global_writer_lock.py release --if-held
