name: Activate verified 7.2.1 shadow candidate
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Immutable protected candidate release
        required: true
        default: blinq-candidate-frozen-39368300257-1
        type: string
      expected_candidate_sha256:
        description: SHA-256 of candidate currently occupying the shadow slot
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: blinq-model-backup-single-writer
  cancel-in-progress: false
jobs:
  activate:
    if: github.repository == 'BackstageTalks/tbt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      PYTHONUNBUFFERED: '1'
      SOURCE_TAG: ${{ inputs.source_tag }}
      EXPECTED_SHA: ${{ inputs.expected_candidate_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: python -m pip install -r api/requirements-train.txt pytest
      - run: python -m pytest -q tests/test_activate_shadow_candidate.py
      - run: python scripts/cdb_global_writer_lock.py acquire --wait-seconds 1800
      - name: Replace candidate and verify both remote bundles
        run: python scripts/activate_shadow_candidate.py --source-tag "$SOURCE_TAG" --expected-candidate-sha256 "$EXPECTED_SHA"
      - name: Update Admin comparison
        env:
          BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
        run: python scripts/publish_model_calibration_status.py --output .cache/tbt/activation-admin-snapshot.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-activation-${{ github.run_id }}
          path: .cache/tbt/candidate-activation-status.json
      - if: always()
        run: python scripts/cdb_global_writer_lock.py release --if-held
