name: Bootstrap tennis history

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First historical year"
        required: true
        default: "2021"

      end_year:
        description: "Last historical year"
        required: true
        default: "2023"

jobs:
  bootstrap-history:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt

      - name: Compile
        run: |
          python -m compileall -q api scripts

      - name: Download and store historical tennis matches
        env:
          PYTHONPATH: api

          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}

        run: |
          set -euo pipefail

          echo "Bootstrap period: ${START_YEAR}-${END_YEAR}"
          echo "Bulk bootstrap uses real event results only; no odds/statistics enrichment."

          python scripts/bootstrap_history.py \
            --start-year "${START_YEAR}" \
            --end-year "${END_YEAR}"
