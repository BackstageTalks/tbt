name: Bootstrap tennis history

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First historical year
        required: true
        default: '2021'
      end_year:
        description: Last historical year (blank = current)
        required: false
        default: ''

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r api/requirements.txt
      - name: Download and store historical tennis matches
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          END="${{ inputs.end_year }}"
          if [ -z "$END" ]; then END=$(date -u +%Y); fi
          python scripts/bootstrap_history.py --start-year "${{ inputs.start_year }}" --end-year "$END"
