name: Bootstrap tennis history

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First cold-history year (2024 or older)"
        required: true
        default: "2024"
        type: string
      end_year:
        description: "Last cold-history year (2024 or older)"
        required: true
        default: "2024"
        type: string
      force:
        description: "Re-fetch months already marked complete in snapshot metadata"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tbt-history-release-v1
  cancel-in-progress: false

jobs:
  bootstrap-history:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: api
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight private data repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TBT_DATA_REPOSITORY" || { echo "Missing repository variable TBT_DATA_REPOSITORY"; exit 1; }
          test -n "$TBT_DATA_GH_TOKEN" || { echo "Missing secret TBT_DATA_GH_TOKEN"; exit 1; }
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing to store TBT history in non-private repo: $visibility"; exit 1; }
          [[ "${{ inputs.start_year }}" =~ ^[0-9]{4}$ ]] || { echo "start_year must be a 4-digit year"; exit 1; }
          [[ "${{ inputs.end_year }}" =~ ^[0-9]{4}$ ]] || { echo "end_year must be a 4-digit year"; exit 1; }
          if (( 10#${{ inputs.start_year }} > 10#${{ inputs.end_year }} )); then
            echo "start_year must be <= end_year"
            exit 1
          fi
          if (( 10#${{ inputs.end_year }} >= 2025 )); then
            echo "V20.4 safety stop: this workflow is only for 2024 and older."
            exit 1
          fi
          echo "Cold history: ${{ inputs.start_year }}-${{ inputs.end_year }} -> $TBT_DATA_REPOSITORY"
          echo "Supabase is intentionally NOT configured in this job."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt

      - name: Compile
        run: python -m compileall -q api scripts

      - name: Download current private snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt
          gh release view "$TBT_HISTORY_RELEASE_TAG" --repo "$TBT_DATA_REPOSITORY" >/dev/null 2>&1 || {
            echo "V20.4 safety stop: $TBT_HISTORY_RELEASE_TAG is missing."
            echo "Refusing to replace the existing history with a partial provider range."
            exit 1
          }
          gh release download "$TBT_HISTORY_RELEASE_TAG" \
            --repo "$TBT_DATA_REPOSITORY" \
            --pattern 'training_snapshot.parquet' \
            --pattern 'training_snapshot.meta.json' \
            --dir .cache/tbt \
            --clobber

      - name: Build monthly checkpoint plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > .cache/tbt/months.txt
          import calendar
          from datetime import date

          start_year = int("${{ inputs.start_year }}")
          end_year = int("${{ inputs.end_year }}")
          for year in range(start_year, end_year + 1):
              for month in range(1, 13):
                  start = date(year, month, 1)
                  end = date(year, month, calendar.monthrange(year, month)[1])
                  print(f"{start.isoformat()}|{end.isoformat()}")
          PY
          cat .cache/tbt/months.txt

      - name: Fetch, merge and publish month-by-month
        shell: bash
        run: |
          set -euo pipefail
          FORCE=()
          if [[ "${{ inputs.force }}" == "true" ]]; then FORCE+=(--force); fi

          while IFS='|' read -r MONTH_START MONTH_END; do
            echo "=== Cold-history checkpoint ${MONTH_START} -> ${MONTH_END} ==="
            python scripts/bootstrap_history_release.py \
              --start-date "$MONTH_START" \
              --end-date "$MONTH_END" \
              --snapshot .cache/tbt/training_snapshot.parquet \
              --meta .cache/tbt/training_snapshot.meta.json \
              "${FORCE[@]}"

            # Persist every successful month. If a later month hits a provider quota,
            # completed months are already safe in the private Release and are marked
            # in metadata so a rerun skips them unless force=true.
            gh release upload "$TBT_HISTORY_RELEASE_TAG" \
              .cache/tbt/training_snapshot.parquet \
              .cache/tbt/training_snapshot.meta.json \
              --repo "$TBT_DATA_REPOSITORY" \
              --clobber
          done < .cache/tbt/months.txt

          ls -lh .cache/tbt/training_snapshot.*
