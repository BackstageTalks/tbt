name: V20.6 · Backfill cold history directly to GitHub

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Cold-history year (2024 or older)"
        required: true
        default: "2024"
        type: string
      start_month:
        description: "First month to fetch (1-12)"
        required: true
        default: "1"
        type: string
      end_month:
        description: "Last month to fetch (1-12)"
        required: true
        default: "1"
        type: string
      force:
        description: "Re-fetch months already checkpointed in this partition"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tbt-history-release-v1
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: api
      TBT_HISTORY_DIR: .cache/tbt/history
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1

    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing non-private data repo: $visibility"; exit 1; }
          [[ "${{ inputs.year }}" =~ ^[0-9]{4}$ ]] || { echo "Invalid year"; exit 1; }
          [[ "${{ inputs.start_month }}" =~ ^([1-9]|1[0-2])$ ]] || { echo "Invalid start_month"; exit 1; }
          [[ "${{ inputs.end_month }}" =~ ^([1-9]|1[0-2])$ ]] || { echo "Invalid end_month"; exit 1; }
          (( 10#${{ inputs.year }} < 2025 )) || { echo "Cold backfill is 2024 and older only"; exit 1; }
          (( 10#${{ inputs.start_month }} <= 10#${{ inputs.end_month }} )) || { echo "start_month > end_month"; exit 1; }
          echo "Supabase is intentionally NOT configured in this flow."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          python -m compileall -q api scripts

      - name: Download current partitioned history
        shell: bash
        run: bash scripts/download_history_release.sh .cache/tbt

      - name: Fetch selected months directly to GitHub partition
        shell: bash
        run: |
          set -euo pipefail
          FORCE=()
          if [[ "${{ inputs.force }}" == "true" ]]; then FORCE+=(--force); fi

          for MONTH in $(seq ${{ inputs.start_month }} ${{ inputs.end_month }}); do
            DATES=$(python - "$MONTH" <<'PY'
          import calendar, sys
          from datetime import date
          year = int("${{ inputs.year }}")
          month = int(sys.argv[1])
          start = date(year, month, 1)
          end = date(year, month, calendar.monthrange(year, month)[1])
          print(f"{start.isoformat()}|{end.isoformat()}")
          PY
            )
            IFS='|' read -r MONTH_START MONTH_END <<<"$DATES"
            echo "=== ${MONTH_START} -> ${MONTH_END} ==="

            python scripts/bootstrap_history_release.py \
              --start-date "$MONTH_START" \
              --end-date "$MONTH_END" \
              --history-dir "$TBT_HISTORY_DIR" \
              --legacy-snapshot .cache/tbt/training_snapshot.parquet \
              "${FORCE[@]}"

            gh release upload "$TBT_HISTORY_RELEASE_TAG" \
              "$TBT_HISTORY_DIR/history-${{ inputs.year }}.parquet" \
              "$TBT_HISTORY_DIR/history_manifest.json" \
              --repo "$TBT_DATA_REPOSITORY" \
              --clobber
          done

      - name: Validate after backfill
        run: python scripts/validate_history_partitions.py --history-dir "$TBT_HISTORY_DIR"
