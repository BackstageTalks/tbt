name: FIX4 verified source current CDB NULL-only preflight
'on':
  pull_request:
    paths:
      - scripts/research/fix4_null_delta_stage.py
      - tests/test_fix4_null_delta_stage.py
      - scripts/research/fix4_strict_cdb_crosswalk.py
      - .github/workflows/fix4-current-cdb-null-preflight.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/fix4-current-cdb-null-preflight.yml
permissions:
  contents: read
concurrency:
  group: fix4-cdb-null-preflight-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression and bounded write contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/research/fix4_null_delta_stage.py scripts/research/fix4_strict_cdb_crosswalk.py
          python scripts/research/fix4_null_delta_stage.py --help >/dev/null
          PYTHONPATH=api:scripts python -m unittest discover -s tests -p test_fix4_null_delta_stage.py -v
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/research/fix4_null_delta_stage.py').read_text()
          assert "'production_writes':0" in p and "'training_allowed':False" in p
          assert 'upload_bundle(' not in p and 'write_partition(' not in p
          print('FIX4_NULL_ONLY_PREFLIGHT_RESEARCH_CONTRACT_PASS')
          PY
  current-cdb:
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      DRIVE_READER_JSON: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
      SOURCE_STAGE_DRIVE_ID: 1sVhAw9rR06XtHCzr1AHyRXy-g2kncHhB
      BRIDGE_DRIVE_ID: 1Knf6bzFlfdFr1lEbhk_xy0FPgSGSv-Oh
      PRIVATE_REPO: BackstageTalks/tbt-data
      VERIFIED_TAG: blinq-fix4-independent-cdb-links-38802586167-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify private reader contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$DRIVE_READER_JSON"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
      - run: python -m pip install --disable-pip-version-check -q google-auth requests 'pyarrow>=17,<25'
      - name: Read independently SHA pinned private sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/fix4/{source,identity,links,history,check,out,readback}
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from google.oauth2.service_account import Credentials
          from google.auth.transport.requests import AuthorizedSession
          auth=AuthorizedSession(Credentials.from_service_account_info(json.loads(os.environ['DRIVE_READER_JSON']),scopes=['https://www.googleapis.com/auth/drive.readonly']))
          for env,name,digest in (
            ('SOURCE_STAGE_DRIVE_ID','stage.zip','39e62b87455ebd34b9451e5ddf4a752fe30d648f8f3f02603f5e078096bc61ea'),
            ('BRIDGE_DRIVE_ID','bridge.zip','da4854ca582a0baae488f9874e608894b8757dcdf72c1379f9a1e2d53c37dff2')):
           res=auth.get('https://www.googleapis.com/drive/v3/files/'+os.environ[env],params={'alt':'media'},timeout=180)
           res.raise_for_status();v=res.content
           if hashlib.sha256(v).hexdigest()!=digest:raise SystemExit('INVALID_PINNED_SOURCE_'+name)
           Path('work/fix4/source',name).write_bytes(v)
          print('FIX4_PRIVATE_SOURCE_SHA_ATTESTED')
          PY
      - name: Download independent link and canonical sources
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$VERIFIED_TAG" -R "$PRIVATE_REPO" -D work/fix4/links
          (cd work/fix4/links && sha256sum -c SHA256SUMS)
          gh release download tbt-canonical-identity-links-v1 -R "$PRIVATE_REPO" -D work/fix4/identity \
            -p player-identity-crosswalk.jsonl -p _tbt_bundle_manifest.json
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -D work/fix4/history \
            -p history-2015.parquet -p history-2016.parquet -p history-2017.parquet -p history-2019.parquet \
            -p history_manifest.json -p _tbt_bundle_manifest.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('work/fix4/identity');m=json.loads((p/'_tbt_bundle_manifest.json').read_text())
          expected=m['files']['player-identity-crosswalk.jsonl']['sha256']
          assert expected==hashlib.sha256((p/'player-identity-crosswalk.jsonl').read_bytes()).hexdigest()
          PY
      - name: Independent fresh exact-link and source-stats NULL preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research/fix4_null_delta_stage.py \
            --stage work/fix4/source/stage.zip --bridge work/fix4/source/bridge.zip \
            --private-links work/fix4/links/private_verified_links.jsonl.gz \
            --private-players work/fix4/links/private_discovered_player_links.jsonl.gz \
            --official-players work/fix4/identity/player-identity-crosswalk.jsonl \
            --cdb work/fix4/history --out work/fix4/out
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('work/fix4/links/report.json').read_text())
          b=json.loads(Path('work/fix4/out/report.json').read_text())
          if b['observed_identity_links']!=a['verified_unique_match_links'] or b['new_player_ids']!=a['counts']['new_independent_player_links']:
           raise SystemExit('FIX4_PRIVATE_IDENTITY_AND_NULL_GATE_DRIFT')
          if b['production_writes']!=0 or b['training_allowed'] is not False:
           raise SystemExit('FIX4_PREMATURE_WRITER_REFUSED')
          print('FIX4_GOVERNED_NULL_ONLY_PREFLIGHT_CANDIDATE_CELLS',b['counts'].get('candidate_null_cells',0))
          PY
      - name: Confirm no concurrent CDB changes
        shell: bash
        run: |
          set -euo pipefail
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -D work/fix4/check \
            -p history-2015.parquet -p history-2016.parquet -p history-2017.parquet -p history-2019.parquet \
            -p history_manifest.json -p _tbt_bundle_manifest.json
          for f in history-2015.parquet history-2016.parquet history-2017.parquet history-2019.parquet history_manifest.json _tbt_bundle_manifest.json; do
            cmp "work/fix4/history/$f" "work/fix4/check/$f" || { echo CDB_CHANGED_DURING_FIX4_NULL_AUDIT; exit 1; }
          done
      - name: Publish private preflight candidates with SHA readback, never canonical
        shell: bash
        run: |
          set -euo pipefail
          (cd work/fix4/out && sha256sum report.json protected-null-only-stage.jsonl conflict_review_private.jsonl > SHA256SUMS && sha256sum -c SHA256SUMS)
          tag="blinq-fix4-protected-null-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" -R "$PRIVATE_REPO" --target main \
            --title 'BlinQ FIX4 guarded exact CDB NULL delta research stage' \
            --notes 'Private immutable source-verified post-match field delta only; no canonical writer called. Cross-provider conflict and source quality quarantine retained.' \
            --latest=false work/fix4/out/report.json work/fix4/out/protected-null-only-stage.jsonl \
            work/fix4/out/conflict_review_private.jsonl work/fix4/out/SHA256SUMS
          gh release download "$tag" -R "$PRIVATE_REPO" -D work/fix4/readback
          (cd work/fix4/readback && sha256sum -c SHA256SUMS)
          cmp work/fix4/out/report.json work/fix4/readback/report.json
          echo "FIX4_PRIVATE_NULL_DELTA_TAG=$tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fix4-cdb-null-aggregate-${{ github.run_id }}
          path: work/fix4/out/report.json
          retention-days: 30
          if-no-files-found: warn