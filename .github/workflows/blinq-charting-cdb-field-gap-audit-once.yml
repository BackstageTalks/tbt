name: BlinQ Charting current CDB field-gap audit once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blinq-charting-cdb-field-gap-audit-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-charting-cdb-field-gap-readonly
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: main
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: private-data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test and authenticate, read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          python -m pip install --disable-pip-version-check --quiet pyarrow 'pandas>=2,<3'
          (cd app && python -m unittest discover -s tests -p test_charting_cdb_field_gap_review.py -v)
          (cd private-data && PYTHONPATH=scripts python -m unittest discover -s tests -p test_charting_cdb_safe_bridge.py -v)
      - name: Download stable and SHA-verified current canonical release
        shell: bash
        working-directory: app
        env:
          PYTHONPATH: api:scripts
        run: |
          set -euo pipefail
          python scripts/download_stable_cdb.py \
            --repository "$PRIVATE_REPO" --tag tbt-data-v1 \
            --out "$GITHUB_WORKSPACE/.cache/charting-cdb-gap/history" \
            --report "$GITHUB_WORKSPACE/.cache/charting-cdb-gap/snapshot.json"
      - name: Pin current year SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('.cache/charting-cdb-gap')
          history=base/'history'
          manifest=json.loads((history/'history_manifest.json').read_text())
          bundle=json.loads((history/'_tbt_bundle_manifest.json').read_text())
          pins={}
          for year,meta in manifest['years'].items():
              name=f'history-{int(year):04d}.parquet'
              assert meta['asset']==name and (history/name).is_file()
              assert bundle['files'][name]['sha256']==meta['sha256']
              pins[name]=meta['sha256']
          assert pins and set(pins)=={p.name for p in history.glob('history-*.parquet')}
          (base/'canonical-pins.json').write_text(json.dumps(pins,indent=2))
          print('PINNED_CANONICAL_PARTITIONS',len(pins))
          PY
      - name: Rematch same checksum-pinned snapshot (read-only)
        shell: bash
        run: |
          set -euo pipefail
          base=.cache/charting-cdb-gap
          python private-data/scripts/charting_cdb_safe_bridge.py \
            --charting private-data/tennis/charting/matches.json.gz \
            --cdb "$base"/history/history-*.parquet \
            --expected-shas "$base/canonical-pins.json" \
            --output "$base/links"
      - name: Verify source point balances and measure NULL-only research gaps
        shell: bash
        run: |
          set -euo pipefail
          base=.cache/charting-cdb-gap
          python app/scripts/charting_cdb_field_gap_review.py \
            --charting private-data/tennis/charting/matches.json.gz \
            --players private-data/tennis/charting/players.json \
            --profiles-root private-data/tennis/charting \
            --crosswalk "$base/links/crosswalk_candidates.jsonl.gz" \
            --cdb "$base"/history/history-*.parquet \
            --expected-shas "$base/canonical-pins.json" \
            --output "$base/gap"
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('.cache/charting-cdb-gap')
          link=json.loads((base/'links/crosswalk_report.json').read_text())
          gap=json.loads((base/'gap/field_gap_report.json').read_text())
          assert gap['counts']['compound_candidate_rows']==link['candidate_links']
          assert gap['counts']['cdb_rows_scanned']==link['counts']['cdb_rows']
          assert gap['approved_cdb_cells']==0 and gap['canonical_cdb_writes']==0
          assert gap['production_mutated'] is False
          print('READ_ONLY_FIELD_GAP_COUNTS',json.dumps(gap['counts'],sort_keys=True))
          PY
      - name: Persist privately with immutable byte readback
        shell: bash
        run: |
          set -euo pipefail
          base=.cache/charting-cdb-gap
          tag="blinq-charting-cdb-field-gaps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$base/private" "$base/readback"
          cp "$base/links/crosswalk_report.json" "$base/private/"
          cp "$base/gap/field_gap_report.json" "$base/private/"
          cp "$base/gap/field_gap_research_only.jsonl.gz" "$base/private/"
          cp "$base/snapshot.json" "$base/private/"
          (cd "$base/private" && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
          gh release create "$tag" "$base/private/"* \
            -R "$PRIVATE_REPO" --title 'BlinQ read-only charting CDB field-gap and conflict QA' \
            --notes 'Only verified compound candidates compared. This is not provider-event attestation or canonical import. No CDB writes, no model training.'
          gh release download "$tag" -R "$PRIVATE_REPO" -D "$base/readback"
          (cd "$base/readback" && sha256sum -c SHA256SUMS)
          cmp "$base/private/field_gap_report.json" "$base/readback/field_gap_report.json"
          echo "PRIVATE_FIELD_GAP_REPORT_READBACK_VERIFIED: $tag; CDB_WRITES=0"