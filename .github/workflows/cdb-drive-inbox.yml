name: CDB guarded import - existing single writer for Drive and MoviOdds
run-name: "CDB guarded import ${{ inputs.request_id || github.run_id }}"

'on':
  workflow_dispatch:
    inputs:
      request_id:
        description: Admin Model Lab correlation (optional)
        type: string
        required: false
        default: ''
      catchup_remaining:
        description: 'Remaining extra 100-file batches (0-6); bounded and checkpoint-gated'
        required: false
        type: number
        default: 0
      replay_drive_ids:
        description: 'Optional comma-separated exact Drive file IDs for bounded replay (max 12)'
        required: false
        type: string
        default: ''
      source_mode:
        description: Source family for the EXISTING guarded writer
        required: false
        type: choice
        options: [drive, moviodds]
        default: drive
      moviodds_days_back:
        description: Completed UTC days to examine (1..7); protected export window
        required: false
        type: number
        default: 7
  pull_request:
    paths:
      - scripts/cdb_large_source_stage.py
      - tests/test_cdb_large_source_stage.py
      - scripts/cdb_inbox_*.py
      - scripts/moviodds_cdb_batch.py
      - scripts/moviodds_cdb_link.py
      - tests/test_moviodds_cdb_batch.py
      - tests/test_moviodds_cdb_retry.py
      - scripts/cdb_drive_identity_registry.py
      - scripts/link_offline_serve_return.py
      - tests/test_cdb_drive_multischema.py
      - tests/test_cdb_inbox_adapter.py
      - tests/test_cdb_inbox_drive.py
      - tests/test_cdb_inbox_scheduler_bridge.py
      - tests/test_cdb_inbox_wait_resume.py
      - tests/test_cdb_inbox_integration.py
      - tests/test_cdb_date_provenance.py
      - tests/test_cdb_inbox_pending_batch.py
      - tests/test_cdb_drive_identity_registry.py
      - tests/test_cdb_inbox_catchup.py
      - scripts/cdb_wta_lookback_guard.py
      - tests/test_cdb_wta_lookback_guard.py
      - .github/workflows/cdb-drive-inbox.yml
  push:
    branches: [main]
    paths:
      - scripts/cdb_large_source_stage.py
      - tests/test_cdb_large_source_stage.py
      - scripts/cdb_inbox_*.py
      - scripts/moviodds_cdb_batch.py
      - scripts/moviodds_cdb_link.py
      - tests/test_moviodds_cdb_batch.py
      - tests/test_moviodds_cdb_retry.py
      - scripts/cdb_drive_identity_registry.py
      - scripts/link_offline_serve_return.py
      - tests/test_cdb_drive_multischema.py
      - tests/test_cdb_inbox_adapter.py
      - tests/test_cdb_inbox_wait_resume.py
      - tests/test_cdb_inbox_pending_batch.py
      - tests/test_cdb_drive_identity_registry.py
      - tests/test_cdb_inbox_catchup.py
      - scripts/cdb_wta_lookback_guard.py
      - tests/test_cdb_wta_lookback_guard.py
      - ops/cdb-import-requests/wta-safe-batch-20261020.json
      - .github/workflows/cdb-drive-inbox.yml

permissions:
  contents: read

concurrency:
  group: blinq-cdb-drive-inbox-${{ github.event_name == 'pull_request' && 'ci' || 'production' }}
  cancel-in-progress: false

jobs:
  synthetic-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser test dependencies
        run: python -m pip install --disable-pip-version-check pytest openpyxl pandas pyarrow pydantic requests
      - name: Run source and evidence safety tests
        env:
          PYTHONPATH: .:api:scripts
        run: |
          python -m compileall -q scripts/cdb_inbox_adapter.py scripts/cdb_inbox_drive.py scripts/cdb_inbox_stage.py scripts/moviodds_cdb_batch.py scripts/moviodds_cdb_link.py scripts/moviodds_cdb_retry.py scripts/cdb_native_7z_unpack.py scripts/cdb_native_sackmann_stage.py scripts/cdb_native_slam_pbp_stage.py scripts/cdb_drive_identity_registry.py scripts/cdb_large_source_stage.py scripts/cdb_wta_lookback_guard.py scripts/link_offline_serve_return.py
          python -m pytest tests/test_moviodds_cdb_batch.py tests/test_moviodds_cdb_link.py tests/test_moviodds_cdb_retry.py tests/test_cdb_native_7z_unpack.py tests/test_cdb_native_sackmann_stage.py tests/test_cdb_native_slam_pbp_stage.py tests/test_cdb_inbox_adapter.py tests/test_cdb_drive_identity_registry.py tests/test_cdb_drive_multischema.py tests/test_cdb_large_source_stage.py tests/test_cdb_inbox_drive.py tests/test_cdb_inbox_scheduler_bridge.py tests/test_cdb_inbox_wait_resume.py tests/test_cdb_inbox_pending_batch.py tests/test_cdb_inbox_catchup.py tests/test_cdb_inbox_integration.py tests/test_cdb_date_provenance.py tests/test_cdb_wta_lookback_guard.py -q

  guarded-import:
    # Source preparation may proceed while immutable candidate training owns CDB.
    # A busy writer is a deferred success with verified PRIVATE staging, not
    # hours of paid idle runner time.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        startsWith(github.event.head_commit.message, 'chore(cdb): authorized one-shot Drive import 2026-10-20')))
    needs: synthetic-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      ACTIONS_DISPATCH_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      BLINQ_DRIVE_READER_JSON: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
      CDB_REPO: BackstageTalks/tbt-data
      CDB_TAG: tbt-data-v1
      INBOX_FOLDER_ID: 1jzdzztz8cXquO8VDswqE19PHupQau-xM
      REPLAY_DRIVE_IDS: ${{ inputs.replay_drive_ids || '' }}
      SOURCE_MODE: ${{ inputs.source_mode || 'drive' }}
      MOVIODDS_DAYS_BACK: ${{ inputs.moviodds_days_back || 7 }}
      BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      BLINQ_BASE_URL: ${{ vars.BLINQ_PUBLIC_BASE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce explicit one-shot source authorization (push only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("ops/cdb-import-requests/wta-safe-batch-20261020.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          if (data.get("schema") != 1 or
              data.get("scope") != "one_shot_existing_drive_inbox_batch" or
              data.get("wta_current_match_statistics_import_allowed") is not False or
              data.get("allow_other_vetted_sources_via_existing_importer") is not True or
              data.get("max_source_files_per_batch") != 100 or
              data.get("api_budget_requests_for_this_import") != 0 or
              data.get("source_wta_csv_sha256") !=
                  "1467b2efd02288502f518662fe3ad3e1c9121e7e59a0e65f690f6ec779591548"):
              raise SystemExit("ONE_SHOT_IMPORT_AUTHORIZATION_INVALID")
          print("AUTHORIZED_SAFE_SOURCE_INBOX_ONE_BATCH_NO_WTA_LOOKBACK")
          PY
      - name: Install exact linker and Drive reader dependencies
        run: |
          python -m pip install --disable-pip-version-check google-auth requests pandas pyarrow pydantic openpyxl numpy
      - name: Verify source-specific private connectivity prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo BLOCKED_PRIVATE_CDB_TOKEN_MISSING; exit 1; }
          case "$SOURCE_MODE" in
            drive) test -n "$BLINQ_DRIVE_READER_JSON" || { echo BLOCKED_DRIVE_READER_MISSING; exit 1; } ;;
            moviodds)
              test -n "$BLINQ_LIVE_WORKER_TOKEN" || { echo BLOCKED_MOVIODDS_EXPORT_TOKEN_MISSING; exit 1; }
              [[ "$MOVIODDS_DAYS_BACK" =~ ^[0-9]+$ ]] && (( MOVIODDS_DAYS_BACK >= 1 && MOVIODDS_DAYS_BACK <= 7 )) || exit 1
              test -z "$REPLAY_DRIVE_IDS" || { echo MOVIODDS_CANNOT_REPLAY_DRIVE_IDS; exit 1; } ;;
            *) echo UNSUPPORTED_IMPORT_SOURCE; exit 1 ;;
          esac
          gh api "repos/$CDB_REPO/releases/tags/$CDB_TAG" --jq '.tag_name' > /dev/null
      - name: Restore private Drive-wide import progress
        if: env.SOURCE_MODE == 'drive'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/private-state
          python - <<'PY'
          import base64, gzip, json, os, subprocess
          from pathlib import Path
          uri="repos/"+os.environ["CDB_REPO"]+"/contents/audit/cdb-inbox-progress.json.gz?ref=main"
          result=subprocess.run(["gh","api",uri],capture_output=True,text=True)
          if result.returncode:
              if "HTTP 404" not in result.stderr:
                  raise SystemExit("Private import progress unavailable; refusing silent reset")
              print("CDB_INBOX_PROGRESS_BOOTSTRAP_FIRST_RUN")
          else:
              payload=json.loads(result.stdout)
              raw=gzip.decompress(base64.b64decode(payload["content"]))
              if not raw:
                  raise SystemExit("Empty private import checkpoint")
              Path("work/private-state/current.json").write_bytes(raw)
              Path("work/private-state/original-sha").write_text(payload["sha"])
              print("CDB_INBOX_PRIVATE_PROGRESS_RESTORED")
          PY
      - name: Restore prepared PRIVATE batch when another writer blocked prior work
        if: env.SOURCE_MODE == 'drive'
        id: prepared
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_inbox_pending_batch.py restore --folder-id "$INBOX_FOLDER_ID"
      - name: Reject replay when deferred private staged batch must resume
        if: env.SOURCE_MODE == 'drive' && inputs.replay_drive_ids != '' && steps.prepared.outputs.restored == 'true'
        run: |
          echo '::error::Complete the existing protected staged import before explicit source replay.'
          exit 1
      - name: Read all BlinQ_data descendants; ingest bounded new/changed files
        if: env.SOURCE_MODE == 'drive' && steps.prepared.outputs.restored != 'true'
        run: |
          set -euo pipefail
          mkdir -p work/input
          python scripts/cdb_inbox_drive.py --folder-id "$INBOX_FOLDER_ID" \
            --output work/input --state-file work/private-state/current.json \
            --next-state work/private-state/next.json --max-files 100 \
            --replay-ids "$REPLAY_DRIVE_IDS"
          python scripts/cdb_inbox_adapter.py --input-dir work/input --out-dir work/source --max-files 100 \
            --drive-manifest work/drive_manifest.json
      - name: Retrieve verified MoviOdds final days (no tennis API quota)
        if: env.SOURCE_MODE == 'moviodds'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/moviodds_cdb_batch.py fetch --out-dir work/source --days-back "$MOVIODDS_DAYS_BACK"

      - name: Avoid downloading CDB for empty or entirely unsupported sources
        id: source
        run: |
          python - <<'PY'
          import json,os
          a=json.load(open("work/source/report.json"))
          has=bool(a["normalized"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("eligible="+("true" if has else "false")+"\n")
          print("INBOX_FILES_NORMALIZED",len(a["normalized"]),a["counts"].get("normalized_rows",0))
          PY
      - name: Observe CDB writer only AFTER normalized data preparation
        if: steps.source.outputs.eligible == 'true'
        id: writer_gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from wait_for_cdb_writer_idle import snapshot
          status=snapshot()  # Busy owner is verified; stale locks fail closed.
          if status not in ('FREE','BUSY'):
              raise SystemExit('Unsafe writer gate state')
          ready='true' if status == 'FREE' else 'false'
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('ready='+ready+'\n')
          print('CDB_INBOX_WRITER_'+status+'_AFTER_SOURCE_PREP',flush=True)
          PY
      - name: Fail closed and allow scheduled MoviOdds retry if CDB writer is busy
        # Unlike Drive inbox, MoviOdds doesn't persist a private pending batch.
        # A success here would silently lose a week's seven-day source window.
        # The existing Match Status clock retries the failed weekly run later.
        if: env.SOURCE_MODE == 'moviodds' && steps.source.outputs.eligible == 'true' && steps.writer_gate.outputs.ready == 'false'
        shell: bash
        run: |
          echo '::error::MOVIODDS_CDB_DEFERRED_WRITER_BUSY_NOT_IMPORTED'
          echo 'MoviOdds CDB import deferred: global writer BUSY; no canonical changes. Scheduled retry required.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Persist prepared batch privately and free runner when writer busy
        if: env.SOURCE_MODE == 'drive' && steps.source.outputs.eligible == 'true' && steps.writer_gate.outputs.ready == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_inbox_pending_batch.py persist --folder-id "$INBOX_FOLDER_ID"
          echo 'CDB_INBOX_DEFERRED_PENDING_LOCK_RELEASE_NO_RUNNER_WAIT'
      - name: Download entire manifest-required canonical snapshot; target only 2016-2026
        if: steps.source.outputs.eligible == 'true' && steps.writer_gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/before
          patterns=(-p history_manifest.json -p _tbt_bundle_manifest.json -p "history-*.parquet")
          gh release download "$CDB_TAG" -R "$CDB_REPO" "${patterns[@]}" -D work/before --clobber
          gh api "repos/$CDB_REPO/releases/tags/$CDB_TAG" > work/before/release-metadata.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          folder=Path("work/before")
          bundle=json.loads((folder/"_tbt_bundle_manifest.json").read_text())["files"]
          years=json.loads((folder/"history_manifest.json").read_text())["years"]
          assets={x["name"]:x for x in json.loads((folder/"release-metadata.json").read_text())["assets"]}
          for name in ["history_manifest.json",*(f"history-{y}.parquet" for y in sorted(map(int,years)))]:
              file=folder/name
              sha=hashlib.sha256(file.read_bytes()).hexdigest()
              if bundle[name]["sha256"] != sha or assets[name].get("digest") != "sha256:"+sha:
                  raise SystemExit("Canonical release content/manifest mismatch: "+name)
              if name.endswith(".parquet") and years[name[8:12]]["sha256"] != sha:
                  raise SystemExit("Canonical year SHA inconsistent: "+name)
          print("CANONICAL_PARTITIONS_SHA_VERIFIED",len(years))
          PY
      - name: Exact link, quarantine conflict, and filter to strongest match evidence
        if: steps.source.outputs.eligible == 'true' && steps.writer_gate.outputs.ready == 'true'
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_MODE" == "moviodds" ]]; then
            python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          data=json.loads(Path("work/source/report.json").read_text())
          for row in data["normalized"]:
              day=row["date_utc"]
              subprocess.run([sys.executable,"scripts/moviodds_cdb_link.py",
                  "--archive",f"work/source/source/moviodds-{day}.json",
                  "--history-dir","work/before",
                  "--out-dir",f"work/moviodds-linked/{day}"],check=True)
          PY
            python scripts/moviodds_cdb_batch.py combine \
              --source-dir work/source --stage-root work/moviodds-linked --out-dir work/stage
          else
            python scripts/cdb_inbox_stage.py --normalized-report work/source/report.json \
              --history-dir work/before --out-dir work/stage
          fi
          python scripts/import_offline_linked_serve_return.py \
            --stage work/stage/eligible.jsonl --history-dir work/before --out-dir work/dry-run
          python - <<'PY'
          import json,os
          a=json.load(open("work/stage/report.json"))
          dry=json.load(open("work/dry-run/report.json"))
          counts=dry["counts"]
          if dry.get("production_mutated") is not False or dry.get("local_partitions_written") is not False:
              raise SystemExit("Dry-run caused an unexpected write")
          if counts.get("updated",0) != a["eligible_matches"]:
              raise SystemExit("Candidate count differs from exact import preflight")
          additions=counts.get("stat_fields_added",0)
          if additions != a["eligible_new_values"]:
              raise SystemExit("Candidate field count differs from dry-run")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("additions="+("true" if additions else "false")+"\n")
          print("CDB_INBOX_STRICT_DRYRUN",a["eligible_matches"],additions,
                "filtered",a["filtered_matches"],"conflicts",a["conflict_matches"])
          PY
      - name: Preserve exact-source private player ID review without identity promotion
        if: env.SOURCE_MODE == 'drive' && steps.source.outputs.eligible == 'true' && steps.stage.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Source IDs are not canonical IDs. This private release is an
          # immutable QA registry, including blocked metadata candidates.
          python scripts/cdb_drive_identity_registry.py \
            --normalized-report work/source/report.json \
            --stage-dir work/stage \
            --drive-manifest work/drive_manifest.json \
            --output work/cdb-drive-identity-review.json
          tag="blinq-cdb-drive-id-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" work/cdb-drive-identity-review.json \
            -R "$CDB_REPO" --target main \
            --title "PRIVATE unverified Drive-to-CDB ID candidate review $GITHUB_RUN_ID" \
            --notes "Non-authoritative, SHA-bound source player IDs and metadata candidates. Not an independently verified crosswalk. No write authorization."
          mkdir -p work/private-identity-readback
          gh release download "$tag" -R "$CDB_REPO" \
            -p cdb-drive-identity-review.json -D work/private-identity-readback --clobber
          cmp work/cdb-drive-identity-review.json \
            work/private-identity-readback/cdb-drive-identity-review.json
          echo "CDB_DRIVE_IDENTITY_PRIVATE_SHA_READBACK_PASS $(sha256sum work/cdb-drive-identity-review.json | cut -d ' ' -f1)"
          python - <<'PY'
          import json
          record=json.load(open("work/private-identity-readback/cdb-drive-identity-review.json"))
          if (record["canonical_write_authorized"] is not False or
              record["crosswalk_promotion_authorized"] is not False or
              any(x["independently_verified"] is not False or x["write_authorized"] is not False
                  for x in record["players"])):
              raise SystemExit("Unverified Drive evidence was wrongly promoted")
          print("CDB_DRIVE_PRIVATE_REVIEW",record["source_ids_count"],
                "candidate_matches",record["candidate_match_count"],
                "strict_eligible",record["strict_eligible_match_count"])
          PY
      - name: Preserve immutable MoviOdds source and SHA-linked stage in PRIVATE repo
        # Existing CDB importer does not persist provider-native proofs inside
        # canonical Parquet. Keep the exact source + staged evidence privately
        # before acquiring the writer; loss of proof prevents any mutation.
        if: env.SOURCE_MODE == 'moviodds' && steps.stage.outputs.additions == 'true'
        shell: bash
        run: |
          set -euo pipefail
          folder=work/moviodds-private-evidence
          mkdir -p "$folder" work/moviodds-evidence-readback
          cp work/source/report.json "$folder/source-batch-report.json"
          cp work/stage/report.json "$folder/link-stage-report.json"
          cp work/stage/eligible.jsonl "$folder/eligible.jsonl"
          cp work/stage/review.jsonl "$folder/review.jsonl"
          cp work/source/source/moviodds-*.json "$folder/"
          (cd "$folder" && sha256sum -- * > SHA256SUMS && sha256sum -c SHA256SUMS)
          tag="blinq-moviodds-cdb-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" "$folder"/* -R "$CDB_REPO" --target main \
            --title "PRIVATE SHA-verified MoviOdds CDB import proof $GITHUB_RUN_ID" \
            --notes "Verified raw provider payloads + exact null-only canonical stage. Immutable prewrite evidence; existing CDB writer remains authoritative."
          gh release download "$tag" -R "$CDB_REPO" -D work/moviodds-evidence-readback
          (cd work/moviodds-evidence-readback && sha256sum -c SHA256SUMS)
          echo 'MOVIODDS_PRIVATE_PREWRITE_SOURCE_PROOF_READBACK_PASS'

      - name: Acquire global single writer ONLY for a positive, validated delta
        if: steps.stage.outputs.additions == 'true'
        id: writer
        shell: bash
        run: |
          set -euo pipefail
          # Intake can race another legal writer; requeue without checkpointing.
          if python scripts/cdb_global_writer_lock.py acquire --wait-seconds 0 > work/writer-lock.log 2>&1; then
            cat work/writer-lock.log
            echo 'locked=true' >> "$GITHUB_OUTPUT"
          elif grep -Fq 'CDB global writer busy; refusing concurrent release writes' work/writer-lock.log; then
            echo 'locked=false' >> "$GITHUB_OUTPUT"
            if [[ "$SOURCE_MODE" == "drive" ]]; then
              python scripts/cdb_inbox_pending_batch.py persist --folder-id "$INBOX_FOLDER_ID"
            fi
            echo 'CDB_INBOX_DEFERRED_LATE_LOCK_RACE_RETRY_ON_NEXT_SCHEDULE'
          else
            cat work/writer-lock.log
            exit 1
          fi
      - name: Atomic CAS verification and select immutable backup years
        if: steps.stage.outputs.additions == 'true' && steps.writer.outputs.locked == 'true'
        run: |
          set -euo pipefail
          mkdir -p work/backup work/after
          python - <<'PY'
          import hashlib,json,shutil,os
          from pathlib import Path
          from cdb_global_writer_lock import verify
          from release_store import ReleaseStore
          before=Path("work/before")
          current=json.loads((before/"_tbt_bundle_manifest.json").read_text())["files"]
          verify(os.environ["CDB_REPO"],Path(".cdb-global-writer-lock.json"))
          store=ReleaseStore(os.environ["CDB_REPO"],os.environ["CDB_TAG"],before)
          if store._remote_bundle_files() != current:
              raise SystemExit("Canonical bundle changed between stage and global lock")
          staged=[json.loads(s) for s in Path("work/stage/eligible.jsonl").read_text().splitlines() if s.strip()]
          years=sorted({int(x["canonical"]["scheduled_date_utc"][:4]) for x in staged})
          if not years or any(y not in range(2016,2027) for y in years):
              raise SystemExit("Invalid staged year")
          for name in ["history_manifest.json","_tbt_bundle_manifest.json",*(p.name for p in before.glob("history-*.parquet"))]:
              shutil.copy2(before/name,Path("work/after")/name)
          for name in ["history_manifest.json","_tbt_bundle_manifest.json",*(f"history-{y}.parquet" for y in years)]:
              shutil.copy2(before/name,Path("work/backup")/name)
          hashes=[]
          for p in sorted(Path("work/backup").iterdir()):
              hashes.append(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name)
          (Path("work/backup")/"SHA256SUMS").write_text("\n".join(hashes)+"\n")
          Path("work/backup-years.json").write_text(json.dumps(years))
          print("PREWRITE_BACKUP_PREPARED",len(years),"years")
          PY
          (cd work/backup && sha256sum -c SHA256SUMS)
      - name: Persist immutable backup in PRIVATE repository and independently download
        if: steps.stage.outputs.additions == 'true' && steps.writer.outputs.locked == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="blinq-inbox-prewrite-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$tag" work/backup/* -R "$CDB_REPO" \
            --title "CDB Inbox original partitions $tag" \
            --notes "Private immutable rollback of original CDB and two manifests."
          mkdir -p work/backup-readback
          gh release download "$tag" -R "$CDB_REPO" -D work/backup-readback
          (cd work/backup-readback && sha256sum -c SHA256SUMS)
      - name: Run existing additive-only importer and exhaustive local readback
        if: steps.stage.outputs.additions == 'true' && steps.writer.outputs.locked == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_global_writer_lock.py verify
          python scripts/import_offline_linked_serve_return.py \
            --stage work/stage/eligible.jsonl --history-dir work/after \
            --out-dir work/local-import --write-partitions --write-history-dir work/after --exact-stats-only
          python - <<'PY'
          import json
          from pathlib import Path
          from offline_exact_cdb_write import verify_persisted
          report=json.load(open("work/local-import/report.json"))
          stage=[json.loads(s) for s in Path("work/stage/eligible.jsonl").read_text().splitlines() if s.strip()]
          verified=verify_persisted(Path("work/before"),Path("work/after"),stage,report["changed_years"])
          if (verified["added_values"]!=sum(len(x["incoming_stats"]) for x in stage)
                  or verified["enriched_matches"]!=len(stage)):
              raise SystemExit("Local exact readback count mismatch")
          Path("work/local-verification.json").write_text(json.dumps(verified,indent=2))
          print("LOCAL_EXACT_READBACK_PASS",verified["enriched_matches"],verified["added_values"])
          PY
      - name: Publish through existing manifest CAS and global writer lock
        if: steps.stage.outputs.additions == 'true' && steps.writer.outputs.locked == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json
          from pathlib import Path
          from release_store import ReleaseStore
          from cdb_global_writer_lock import verify
          repo=os.environ["CDB_REPO"]
          verify(repo,Path(".cdb-global-writer-lock.json"))
          before=Path("work/before")
          after=Path("work/after")
          initial=json.loads((before/"_tbt_bundle_manifest.json").read_text())["files"]
          years=json.loads(Path("work/local-import/report.json").read_text())["changed_years"]
          if not years:
              raise SystemExit("No changed year for expected positive delta")
          store=ReleaseStore(repo,os.environ["CDB_TAG"],after)
          def cas():
              verify(repo,Path(".cdb-global-writer-lock.json"))
              if store._remote_bundle_files()!=initial:
                  raise ValueError("Canonical release changed: CAS fail-closed")
          store.upload_bundle([*(after/f"history-{y}.parquet" for y in years),
                               after/"history_manifest.json"],before_upload=cas)
          print("CANONICAL_PUBLICATION_ATTEMPT",years)
          PY
      - name: Independent PRIVATE release readback of every changed value
        if: steps.stage.outputs.additions == 'true' && steps.writer.outputs.locked == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/readback
          patterns=(-p history_manifest.json -p _tbt_bundle_manifest.json)
          for year in $(cat work/backup-years.json | python -c 'import json,sys; print(" ".join(str(y) for y in json.load(sys.stdin)))'); do
            patterns+=(-p "history-$year.parquet")
          done
          gh release download "$CDB_TAG" -R "$CDB_REPO" "${patterns[@]}" -D work/readback --clobber
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from offline_exact_cdb_write import verify_persisted
          after,before,remote=Path("work/after"),Path("work/before"),Path("work/readback")
          changes=json.load(open("work/local-import/report.json"))["changed_years"]
          bundle=json.loads((remote/"_tbt_bundle_manifest.json").read_text())["files"]
          manifest=json.loads((remote/"history_manifest.json").read_text())["years"]
          for name in ["history_manifest.json",*(f"history-{y}.parquet" for y in changes)]:
              if (after/name).read_bytes()!=(remote/name).read_bytes():
                  raise SystemExit("Remote readback changed: "+name)
              sha=hashlib.sha256((remote/name).read_bytes()).hexdigest()
              if bundle[name]["sha256"]!=sha:
                  raise SystemExit("Remote bundle digest mismatch")
              if name.endswith(".parquet") and manifest[name[8:12]]["sha256"]!=sha:
                  raise SystemExit("Remote history digest mismatch")
          staged=[json.loads(s) for s in Path("work/stage/eligible.jsonl").read_text().splitlines() if s.strip()]
          result=verify_persisted(before,remote,staged,changes)
          local=json.load(open("work/local-verification.json"))
          if result["added_values"]!=local["added_values"] or result["enriched_matches"]!=local["enriched_matches"]:
              raise SystemExit("Remote CDB readback count mismatch")
          print("CDB_PRODUCTION_READBACK_VERIFIED",result["enriched_matches"],result["added_values"],"overwritten",result["existing_values_overwritten"])
          PY
      - name: Commit private ingestion progress only after successful guarded work
        if: env.SOURCE_MODE == 'drive' && success() && (steps.source.outputs.eligible != 'true' || (steps.writer_gate.outputs.ready == 'true' && (steps.stage.outputs.additions != 'true' || steps.writer.outputs.locked == 'true')))
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json, os, subprocess
          from pathlib import Path
          current=Path("work/private-state/current.json")
          next_file=Path("work/private-state/next.json")
          if not next_file.is_file():
              raise SystemExit("Missing full-tree intake progress")
          previous=current.read_bytes() if current.is_file() else b""
          updated=next_file.read_bytes()
          if previous == updated:
              print("CDB_INBOX_PROGRESS_UNCHANGED")
              raise SystemExit(0)
          resource="repos/"+os.environ["CDB_REPO"]+"/contents/audit/cdb-inbox-progress.json.gz"
          body={"message":"chore(cdb): checkpoint BlinQ_data file intake",
                "branch":"main",
                "content":base64.b64encode(gzip.compress(updated,mtime=0)).decode("ascii")}
          command=["gh","api","--method","PUT",resource,"--input","-"]
          sha_path=Path("work/private-state/original-sha")
          if sha_path.is_file():
              body["sha"]=sha_path.read_text().strip()
          result=subprocess.run(command,input=json.dumps(body),capture_output=True,text=True)
          if result.returncode:
              raise SystemExit("Private CDB inbox checkpoint CAS update failed")
          readback=subprocess.run(["gh","api",resource+"?ref=main"],
                                  capture_output=True,text=True,check=True)
          remote=gzip.decompress(base64.b64decode(json.loads(readback.stdout)["content"]))
          if remote != updated:
              raise SystemExit("Private checkpoint readback mismatch")
          print("CDB_INBOX_PROGRESS_PRIVATE_READBACK_VERIFIED")
          PY
      - name: Clear PRIVATE prepared batch only after checkpoint readback
        if: env.SOURCE_MODE == 'drive' && success() && (steps.source.outputs.eligible != 'true' || (steps.writer_gate.outputs.ready == 'true' && (steps.stage.outputs.additions != 'true' || steps.writer.outputs.locked == 'true')))
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_inbox_pending_batch.py clear --folder-id "$INBOX_FOLDER_ID"
      - name: Always release global writer if owned
        if: always()
        run: python scripts/cdb_global_writer_lock.py release --if-held
      - name: Queue bounded continuation after authorized one-shot push
        if: >-
          env.SOURCE_MODE == 'drive' &&
          success() &&
          github.event_name == 'push' &&
          steps.prepared.outputs.restored != 'true' &&
          (steps.source.outputs.eligible != 'true' ||
           (steps.writer_gate.outputs.ready == 'true' &&
            (steps.stage.outputs.additions != 'true' || steps.writer.outputs.locked == 'true')))
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from cdb_inbox_catchup import next_budget
          manifest_path=Path("work/drive_manifest.json")
          if not manifest_path.is_file():
              print("CDB_WTA_ONE_SHOT_NO_FRESH_MANIFEST")
              raise SystemExit(0)
          manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
          following=next_budget(6,manifest)
          if following is None:
              print("CDB_WTA_ONE_SHOT_NO_PENDING_SOURCES")
              raise SystemExit(0)
          token=os.environ.get("ACTIONS_DISPATCH_TOKEN")
          if not token:
              raise SystemExit("Missing Actions write token for bounded continuation")
          env={**os.environ, "GH_TOKEN": token}
          subprocess.run(["gh", "workflow", "run", "cdb-drive-inbox.yml",
              "--repo", "BackstageTalks/tbt", "--ref", "main",
              "-f", "catchup_remaining="+str(following)], env=env, check=True)
          print("CDB_WTA_ONE_SHOT_CHAINED_SAFE_BATCH remaining="+str(following))
          PY
      - name: Chain a bounded next 100-file batch after private checkpoint readback
        # Only after verified successful completion, private progress CAS,
        # cleared pending batch and owner-scoped writer release.
        # No chained dispatch if another CDB writer deferred this batch.
        if: >-
          env.SOURCE_MODE == 'drive' &&
          success() &&
          github.event_name == 'workflow_dispatch' &&
          steps.prepared.outputs.restored != 'true' &&
          (steps.source.outputs.eligible != 'true' ||
           (steps.writer_gate.outputs.ready == 'true' &&
            (steps.stage.outputs.additions != 'true' || steps.writer.outputs.locked == 'true')))
        env:
          CATCHUP_REMAINING: ${{ inputs.catchup_remaining || 0 }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cdb_inbox_catchup.py --remaining "$CATCHUP_REMAINING"
