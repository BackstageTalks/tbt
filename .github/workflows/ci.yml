name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          pip install pytest

      - name: Compile
        run: |
          python -m compileall -q api scripts

      - name: Tests
        env:
          PYTHONPATH: api
        run: |
          python -m pytest -q
