name: Test and deploy
run-name: "BlinQ CI · ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize generated artifacts
        run: python scripts/clean_generated_artifacts.py

      - name: Guard fresh main commit
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha="$(git rev-parse origin/main)"
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Current main: $main_sha"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "::error::STALE CI RUN: this workflow is attached to $GITHUB_SHA, while current main is $main_sha. Do not use Re-run jobs on an old run; start a fresh run from current main."
            exit 42
          fi

      # Production candidate: the same checks are mandatory for every trigger,
      # including manual deploys. No test bypass is allowed on workflow_dispatch.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-train.txt

      - name: Inspect live Azure UI configuration (read-only)
        env:
          BLINQ_PUBLIC_URL: ${{ vars.TBT_PRODUCTION_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
        shell: bash
        run: |
          set -euo pipefail
          url="${BLINQ_PUBLIC_URL%/}/api/v1/ui-config"
          if ! curl -fsSL --connect-timeout 4 --max-time 18 -H 'Cache-Control: no-cache' "$url?restore_audit=$GITHUB_SHA" -o /tmp/blinq-live-ui.json; then
            echo "::warning::Live UI storage could not be inspected. Preserve existing published settings."
          else
            python - <<'PYUI'
          import json
          p=json.load(open('/tmp/blinq-live-ui.json',encoding='utf-8'))
          cfg=p.get('config') or {}
          els=cfg.get('elements') or {}
          banners=[els.get(f'HERO_BANNER_{i}') or {} for i in range(1,6)]
          enabled=sum(bool((b.get('content') or {}).get('enabled')) for b in banners)
          hero=cfg.get('hero_banner') or {}
          print(f"Live UI: storage_available={p.get('storage_available')}, runtime_configured={p.get('runtime_configured')}, banner_slots={enabled}, active_slots={hero.get('slot_count')}")
          # Only expose marketing metadata, never the complete config or account secrets.
          for i,b in enumerate(banners,1):
              c=b.get('content') or {}
              print("Live hero %s: %s" % (i,json.dumps({
                  "enabled":c.get("enabled"),"headline":str(c.get("headline") or "")[:90],
                  "image_url":str(c.get("image_url") or "")[:180],
                  "mobile_image_url":str(c.get("mobile_image_url") or "")[:180],
                  "has_link":bool(c.get("link") or c.get("route")),
              },ensure_ascii=False)))
          if p.get('storage_available') is not True or p.get('runtime_configured') is not True:
              print("::warning::Live Azure UI config is not confirmed; do not overwrite it with the release fallback.")
          PYUI
          fi

      - name: Audit repository/release contract
        run: |
          echo "Commit: $GITHUB_SHA"
          python scripts/audit_repo_contract.py

      - name: Install API runtime dependencies
        run: python -m pip install -r api/requirements.txt

      - name: Compile API and scripts
        run: python -m compileall -q api scripts

      - name: Smoke import Azure API
        env:
          PYTHONPATH: api
        run: |
          python - <<'PY'
          import function_app
          from tbt.services.auth import auth_provider, update_firebase_profile, verify_user
          assert callable(auth_provider)
          assert callable(update_firebase_profile)
          assert callable(verify_user)
          assert callable(function_app.health)
          print('Azure API import smoke: PASS')
          PY

      - name: Guard Firebase-only auth runtime
        run: |
          set -euo pipefail
          if grep -RniE 'supabase|SUPABASE' \
            api/function_app.py \
            api/tbt/config.py \
            api/tbt/services/auth.py \
            api/tbt/services/admin_accounts.py \
            web/auth.js \
            web/staticwebapp.config.json; then
            echo 'Supabase reference found in Firebase-only auth runtime' >&2
            exit 1
          fi
          echo 'Firebase-only auth runtime guard: PASS'

      - name: Install backend test dependencies
        run: python -m pip install -r api/requirements-train.txt pytest

      - name: Run backend tests
        env:
          PYTHONPATH: api:scripts
        run: python -m pytest tests --ignore=tests/legacy

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check frontend JavaScript
        run: |
          node --check web/app.js
          node --check web/auth.js
          node --check web/responsive.js
          node tests/test_projection_display.cjs
          node tests/test_frontend_runtime_contract.js
          node tests/test_auth_refresh_race.js
          node tests/test_firebase_web_auth.js
          node tests/test_firebase_email_verification.js
          node tests/test_auth_init_resilience_r35.js
          node tests/test_v736_ui_regression_contract.js
          node tests/test_banner_editor_contract.js
          node tests/test_admin_diagnostics_view.js

      - name: Run real-browser runtime contract
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
          python tests/browser_comparator_search.py
          python tests/browser_runtime_r43.py
          python tests/browser_access_odds.py
          python tests/browser_preproduction_r61.py
          python tests/browser_banner_editor_r62.py
          python tests/browser_admin_account_filters.py
          python tests/browser_admin_dashboard_setting.py
          python tests/browser_info_sg_detail.py
          python tests/browser_admin_live_delete.py
          python tests/browser_results_financial_audit.py
          python tests/browser_mobile_results_layout.py
          python tests/browser_mobile_header.py
          python tests/browser_mobile_dashboard_audit.py
          python tests/browser_results_betting_day.py
          python tests/browser_profile_chip_fit.py

      - name: Check production web artifact
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/staticwebapp.config.json
          test -s web/blinq-app.css
          test -s web/release.json
          grep -q 'data-web-release="7.3.6"' web/index.html
          patch=$(python -c "import re,pathlib; s=pathlib.Path('web/index.html').read_text(); print(re.search(r'blinq-web-patch\" content=\"736-r(\\d+)',s).group(1))")
          grep -q "/blinq-app.css?v=7360&p=${patch}" web/index.html
          grep -q "/app.js?v=7360&p=${patch}" web/index.html
          grep -q "/auth.js?v=7360&p=${patch}" web/index.html
          test -s api/function_app.py
          test -s api/requirements.txt
          test -s scripts/prepare_feed.py
          test ! -e web/preview.html
          test ! -e web/pro-preview.html
          if find web -type f \( -name '*.bak' -o -name '*.tmp' -o -name '*.pyc' \) | grep -q .; then
            echo 'Temporary/backup file found in production web artifact' >&2
            exit 1
          fi

  deploy:
    needs: checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (vars.TBT_DEPLOY_ENABLED == 'true' ||
        contains(github.event.head_commit.message, '[deploy-current]')))
    # Web/API deployment only reads committed prediction/player-asset releases.
    # It must not queue behind long-running history/environment writers.
    # Keep production deployments serialized only against other deployments.
    concurrency:
      group: tbt-production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize generated artifacts
        run: python scripts/clean_generated_artifacts.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare private serving feed
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          python scripts/prepare_feed.py
          test -s api/data/feed.json
          python scripts/verify_presentation_feed.py api/data/feed.json --summary

      # A run that passed tests hours ago may be queued behind a newer deploy.
      # Recheck main while holding the production lock, immediately before upload.
      - name: Reject queued stale deploy and stamp exact frontend revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          latest="$(git rev-parse origin/main)"
          current="$(git rev-parse HEAD)"
          if [[ "$current" != "$latest" || "$GITHUB_SHA" != "$latest" ]]; then
            echo "::error::STALE DEPLOY: checkout=$current, workflow=$GITHUB_SHA, main=$latest"
            exit 42
          fi
          python scripts/stamp_web_deployment.py --web web --sha "$GITHUB_SHA"

      - name: Deploy BlinQ to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: ''
          skip_app_build: true

      - name: Verify deployed frontend release
        if: ${{ vars.TBT_PRODUCTION_URL != '' }}
        env:
          TBT_PRODUCTION_URL: ${{ vars.TBT_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          base="${TBT_PRODUCTION_URL%/}"
          stamp="${GITHUB_SHA}"
          visual=$(python -c "import json; print(json.load(open('web/release.json', encoding='utf-8'))['visual_revision'])")
          patch=$(python -c "import json; print(json.load(open('web/release.json', encoding='utf-8'))['patch'].split('-r')[-1])")
          ok=0

          # Azure Static Web Apps can report "Deployment Complete" a few seconds
          # before every CDN edge serves the new HTML/assets. Verify the exact
          # release repeatedly instead of marking a successful upload as failed
          # after one stale edge response.
          for attempt in 1 2 3 4 5 6 7 8; do
            bust="${stamp}-${attempt}"
            echo "Frontend verification attempt ${attempt}/8 for ${stamp}"

            fetched=1
            curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache' "$base/?__blinq_release=$bust" -o /tmp/blinq-index.html || fetched=0
            curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache' "$base/deployment.json?__blinq_release=$bust" -o /tmp/blinq-deployment.json || fetched=0
            curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache' "$base/blinq-app.css?__blinq_release=$bust" -o /tmp/blinq-app.css || fetched=0
            curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache' "$base/auth.js?__blinq_release=$bust" -o /tmp/blinq-auth.js || fetched=0
            curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache' "$base/app.js?__blinq_release=$bust" -o /tmp/blinq-app.js || fetched=0
            curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache' "$base/responsive.js?__blinq_release=$bust" -o /tmp/blinq-responsive.js || fetched=0
            curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache' "$base/release.json?__blinq_release=$bust" -o /tmp/blinq-release.json || fetched=0

            if [[ "$fetched" == "1" ]] &&               GITHUB_SHA="$stamp" EXPECTED_VISUAL="$visual" EXPECTED_PATCH="$patch" python - <<'PYWEB'
          import hashlib
          import json
          import os
          from pathlib import Path

          stamp = os.environ['GITHUB_SHA']
          visual = os.environ['EXPECTED_VISUAL']
          patch_number = os.environ['EXPECTED_PATCH']
          patch = f'736-r{patch_number}'

          index = Path('/tmp/blinq-index.html').read_text(encoding='utf-8')
          css = Path('/tmp/blinq-app.css').read_text(encoding='utf-8')
          auth = Path('/tmp/blinq-auth.js').read_text(encoding='utf-8')
          app = Path('/tmp/blinq-app.js').read_text(encoding='utf-8')
          release = json.load(open('/tmp/blinq-release.json', encoding='utf-8'))
          deploy = json.load(open('/tmp/blinq-deployment.json', encoding='utf-8'))
          expected = json.load(open('web/release.json', encoding='utf-8'))

          checks = [
              ('web release', 'data-web-release="7.3.6"' in index),
              ('deployment SHA meta', f'blinq-deployment-sha" content="{stamp}' in index),
              ('visual revision meta', f'blinq-visual-revision" content="{visual}' in index),
              ('web patch meta', f'blinq-web-patch" content="{patch}' in index),
              ('CSS cache key', f'/blinq-app.css?v=7360&p={patch_number}' in index),
              ('app.js cache key', f'/app.js?v=7360&p={patch_number}' in index),
              ('auth.js cache key', f'/auth.js?v=7360&p={patch_number}' in index),
              ('CSS runtime patch', f'BlinQ runtime patch 7.3.6-r{patch_number}' in css),
              ('CSS visual revision', f'BlinQ visual revision {visual}' in css),
              ('auth runtime patch', f"AUTH_RUNTIME = '{patch}'" in auth),
              ('app auth fallback marker', 'UI config failed; auth remains available' in app),
              ('app visual revision', f'BlinQ visual revision: {visual}' in app),
              ('release frontend marker', release.get('frontend_marker') == 'blinq-web-736'),
              ('release patch', release.get('patch') == expected.get('patch')),
              ('release visual revision', release.get('visual_revision') == expected.get('visual_revision')),
              ('deployment git SHA', deploy.get('git_sha') == stamp),
              ('deployment patch', deploy.get('patch') == expected.get('patch')),
          ]
          failed = [name for name, passed in checks if not passed]
          for name, local in {
              'blinq-app.css': '/tmp/blinq-app.css',
              'app.js': '/tmp/blinq-app.js',
              'auth.js': '/tmp/blinq-auth.js',
              'responsive.js': '/tmp/blinq-responsive.js',
          }.items():
              digest = hashlib.sha256(Path(local).read_bytes()).hexdigest()
              if digest != (deploy.get('files_sha256') or {}).get(name):
                  failed.append(f'{name} sha256')

          if failed:
              print('Not fully propagated yet:', ', '.join(failed))
              print('Current deployment.json:', json.dumps({
                  'git_sha': deploy.get('git_sha'),
                  'patch': deploy.get('patch'),
              }, ensure_ascii=False))
              raise SystemExit(1)

          print(json.dumps(release, indent=2))
          print('Exact Git SHA and all four deployed asset hashes: PASS')
          PYWEB
            then
              ok=1
              break
            fi

            if [[ "$attempt" != "8" ]]; then
              sleep $((attempt * 2))
            fi
          done

          if [[ "$ok" != "1" ]]; then
            echo "::error::Frontend deploy uploaded successfully, but the exact release did not propagate to production after 8 checks."
            exit 1
          fi

      - name: Smoke deployed authentication readiness
        if: ${{ vars.TBT_PRODUCTION_URL != '' }}
        env:
          TBT_PRODUCTION_URL: ${{ vars.TBT_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          base="${TBT_PRODUCTION_URL%/}"
          ok=0
          for attempt in 1 2 3 4 5; do
            if curl -fsSL -H 'Cache-Control: no-cache' "$base/api/v1/auth/config?__blinq_auth_smoke=${GITHUB_SHA}" -o /tmp/blinq-auth-config.json; then
              if python - <<'PYAUTH'
          import json
          data=json.load(open('/tmp/blinq-auth-config.json', encoding='utf-8'))
          assert data.get('enabled') is True, data
          assert data.get('provider') == 'firebase', data
          assert data.get('project_id') == 'blinq-182', data
          assert data.get('server_ready') is True, data
          print(json.dumps(data, indent=2))
          PYAUTH
              then
                ok=1
                break
              fi
            fi
            sleep $((attempt * 2))
          done
          test "$ok" = 1 || { echo 'Deployed authentication readiness check failed' >&2; exit 1; }

      - name: Confirm deployed prediction publication
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
          TBT_PRODUCTION_URL: ${{ vars.TBT_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          ui_args=()
          if [[ -n "${TBT_PRODUCTION_URL:-}" ]] && curl -fsSL --connect-timeout 4 --max-time 20 -H 'Cache-Control: no-cache' "${TBT_PRODUCTION_URL%/}/api/v1/ui-config?publication_audit=${GITHUB_SHA}" -o /tmp/blinq-publication-ui.json; then
            python - <<'PYUI'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/blinq-publication-ui.json').read_text(encoding='utf-8'))
          config=payload.get('config')
          if not isinstance(config,dict):
              raise SystemExit('Effective UI config missing from public response')
          Path('/tmp/blinq-effective-ui.json').write_text(json.dumps(config,ensure_ascii=False),encoding='utf-8')
          PYUI
            ui_args=(--ui-config-file /tmp/blinq-effective-ui.json)
          else
            echo "::warning::Effective UI config could not be frozen with this issuance."
          fi
          for attempt in 1 2 3; do
            if python scripts/confirm_prediction_publication.py \
              --data-repository "$TBT_DATA_REPOSITORY" \
              --deployed-feed api/data/feed.json \
              "${ui_args[@]}"; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Prediction publication confirmation failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Smoke deployed health endpoint
        if: ${{ vars.TBT_PRODUCTION_URL != '' }}
        env:
          TBT_PRODUCTION_URL: ${{ vars.TBT_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          base="${TBT_PRODUCTION_URL%/}"
          python - <<'PYSMOKE'
          import json, os, urllib.request
          base=os.environ['TBT_PRODUCTION_URL'].rstrip('/')
          with urllib.request.urlopen(base + '/api/health', timeout=20) as r:
              payload=json.load(r)
          assert payload.get('ok') is True, payload
          assert payload.get('release') == '7.3.6', payload
          print(json.dumps(payload, indent=2))
          PYSMOKE
