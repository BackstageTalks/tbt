name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Full backend tests remain mandatory for push/PR.
      # A manual workflow_dispatch is the explicit web deploy path, so an
      # unrelated backend/history test cannot block publishing web changes.
      - name: Set up Python
        if: github.event_name != 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install backend test dependencies
        if: github.event_name != 'workflow_dispatch'
        run: python -m pip install -r api/requirements-train.txt pytest

      - name: Run backend tests
        if: github.event_name != 'workflow_dispatch'
        run: python -m pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check frontend JavaScript
        run: |
          node --check web/app.js
          node --check web/auth.js

      - name: Check required web files
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/staticwebapp.config.json

  deploy:
    needs: checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.TBT_DEPLOY_ENABLED == 'true')
    concurrency:
      group: blinq-production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare private serving feed
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          python scripts/prepare_feed.py
          test -s api/data/feed.json

      - name: Deploy BlinQ to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: ''
          skip_app_build: true
