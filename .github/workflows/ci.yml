name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tbt-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r api/requirements-train.txt pytest
      - run: python -m pytest
      - run: node --check web/app.js
      - run: node --check web/auth.js
  deploy:
    needs: test
    if: github.event_name == 'push' && vars.TBT_DEPLOY_ENABLED == 'true'
    concurrency:
      group: tbt-history-data-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare private serving feed
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Missing private data token'; exit 1; }
          python scripts/prepare_feed.py
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SKY_011A7FE10 }}
          action: upload
          app_location: web
          api_location: api
          output_location: ''
          skip_app_build: true
