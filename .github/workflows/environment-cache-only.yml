name: Environment 1 - cache-only bulk backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Inclusive UTC start"
        required: true
        default: "2021-01-01"
        type: string
      end:
        description: "Exclusive UTC end (blank = today UTC)"
        required: false
        default: ""
        type: string
      mode:
        description: "First use dry-run; write persists verified cache hits"
        required: true
        type: choice
        default: "dry-run"
        options: [dry-run, write]
      limit:
        description: "Max cache-recoverable matches; 0 = all"
        required: true
        default: "0"
        type: string

permissions:
  contents: read

# Shares the same lock as Environment enrichment and Statistics.
concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install and test
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
          python -m unittest discover -s scripts/tests -p "test_environment_location_candidates.py" -v
          python -m unittest discover -s scripts/tests -p "test_environment_bulk_modes.py" -v
      - name: Verify private history access
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo 'Refusing non-private training data repository'; exit 1; }

      - name: Backfill from verified history cache (ZERO geocoder calls)
        shell: bash
        env:
          BLINQ_START: ${{ inputs.start }}
          BLINQ_END: ${{ inputs.end }}
          BLINQ_MODE: ${{ inputs.mode }}
          BLINQ_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          END_VALUE="${BLINQ_END:-$(date -u +%F)}"
          ARGS=(--start "$BLINQ_START" --end "$END_VALUE"
                --limit "$BLINQ_LIMIT" --cache-only --static-only
                --complete-static --max-requests 1
                --max-runtime-minutes 320
                --data-repository "$TBT_DATA_REPOSITORY")
          if [[ "$BLINQ_MODE" == "dry-run" ]]; then ARGS+=(--dry-run); fi
          python scripts/enrich_environment_snapshot.py "${ARGS[@]}"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".cache/tbt/history/environment_enrichment_report.json").read_text())
          assert report["open_meteo_requests"] == 0, "Cache-only made network requests!"
          print("Cache-only verified: 0 Open-Meteo requests")
          PY
      - name: Save summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-environment-cache-only-${{ github.run_id }}
          path: .cache/tbt/history/environment_enrichment_report.json
          if-no-files-found: warn
