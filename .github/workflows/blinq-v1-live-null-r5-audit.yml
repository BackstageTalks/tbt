name: BlinQ V1 repaired R5 SHA-provenance CDB crosswalk audit

# This branch-only workflow CANNOT mutate the CDB. Do not enable on main:
# the actual protected publisher is a separate, rigorously gated workflow.
on:
  push:
    branches: [audit/blinq-v1-live-cdb-null-diff-20261015]
    paths:
      - .github/workflows/blinq-v1-live-null-r5-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-repaired-r5-readonly-crosswalk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-current-cdb-dry-run:
    if: github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      SOURCE_REPO: BackstageTalks/tbt-data
      SOURCE_TAG: blinq-uploaded-2025-26-source-layer-8202ff4b4854-v1
      CDB_TAG: tbt-data-v1
      DRIVE_READER_JSON: ${{ secrets.BLINQ_DRIVE_READER_JSON }}
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested Parquet dependencies and validate identity tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r api/requirements-train.txt google-auth requests
          python -m unittest discover -s tests -p test_link_uploaded_flashscore_verified.py -v
      - name: Require private destination and retrieve frozen input sources
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$SOURCE_REPO" --json visibility -q .visibility)" = PRIVATE
          mkdir -p work/blinq-v1/source work/blinq-v1/before work/blinq-v1/out work/blinq-v1/after
          # Fetch the repaired R5 stage from private Drive under read-only service-account scope.
          # This is the original-byte provenance fix, not the older wrongly pinned source layer.
          if [[ -z "$DRIVE_READER_JSON" ]]; then
            echo "::error::Read-only Drive credential missing"; exit 45
          fi
          python - <<'PY'
          import hashlib,json,os,gzip
          from pathlib import Path
          from google.oauth2.service_account import Credentials
          from google.auth.transport.requests import AuthorizedSession
          cred=Credentials.from_service_account_info(json.loads(os.environ["DRIVE_READER_JSON"]),
                      scopes=["https://www.googleapis.com/auth/drive.readonly"])
          session=AuthorizedSession(cred)
          def get(file_id):
              r=session.get("https://www.googleapis.com/drive/v3/files/"+file_id,
                            params={"alt":"media"},timeout=150)
              r.raise_for_status()
              return r.content
          base=Path("work/blinq-v1/source")
          raw=get("1VneeImVG_FrloUC8yDqa0DNGJrB-pFJ3")
          manifest=json.loads(get("1DP7TUqx4TojJVrbiXFL1q9AjzKLxgwPT"))
          stage_sha="d6d62982c438c625d531a50fc38faa2179835fe336d6e40d5b10a7ef63919210"
          if (hashlib.sha256(raw).hexdigest()!=stage_sha
                  or manifest.get("repaired_stage_sha256")!=stage_sha):
              raise SystemExit("BLOCKED_R5_STAGE_SHA_DISAGREEMENT")
          filename=base/"repaired-stage-r5.jsonl.gz"
          filename.write_bytes(raw)
          original_sha=manifest.get("repaired_source_file_sha256_mapping")
          if not isinstance(original_sha,dict) or len(original_sha)!=5:
              raise SystemExit("BLOCKED_R5_MANIFEST_NO_FIVE_ORIGINAL_FILE_SHAS")
          count=0
          with gzip.open(filename,"rt",encoding="utf8") as handle:
              for line in handle:
                  if not line.strip(): continue
                  row=json.loads(line)
                  if (row.get("source_sha256")!=original_sha.get(row.get("source_file"))
                          or row.get("canonical_match_id") is not None
                          or row.get("import_ready") is not False
                          or row.get("write_authorized") is not False):
                      raise SystemExit("BLOCKED_R5_SOURCE_ROW_PROVENANCE_OR_WRITER_FLAG")
                  count+=1
          if count!=9741:
              raise SystemExit("BLOCKED_R5_UNEXPECTED_ROW_COUNT")
          print("R5_ORIGINAL_SOURCE_FILE_SHA_PROVENANCE_VERIFIED=9741")
          print("R5_SOURCE_ARCHIVE_SHA="+manifest.get("original_raw_archive_sha256",""))
          PY
          gh release download "$CDB_TAG" -R "$SOURCE_REPO" \
            -p blinq-flashscore-event-index-2026.jsonl.gz -D work/blinq-v1/source
          gh release download "$CDB_TAG" -R "$SOURCE_REPO" \
            -p history-2024.parquet -p history-2025.parquet -p history-2026.parquet \
            -p history_manifest.json -p _tbt_bundle_manifest.json -D work/blinq-v1/before
          gh api "repos/$SOURCE_REPO/releases/tags/$CDB_TAG" > work/blinq-v1/before/release-api.json
          echo 'd6d62982c438c625d531a50fc38faa2179835fe336d6e40d5b10a7ef63919210  work/blinq-v1/source/repaired-stage-r5.jsonl.gz' | sha256sum -c
          echo '328f9c36c0f4021c745ca7119ea904a4ae7cadb66cee17cc63f2ca6f5774a952  work/blinq-v1/source/blinq-flashscore-event-index-2026.jsonl.gz' | sha256sum -c
      - name: Validate original Flashscore player ID consistency (source-only, never canonical proof)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections,gzip,json,re
          from pathlib import Path
          stage=Path('work/blinq-v1/source/repaired-stage-r5.jsonl.gz')
          identities=collections.defaultdict(set); events=set()
          blank_or_same=0; duplicate_events=0; by_season=collections.Counter()
          for raw in gzip.open(stage,'rt',encoding='utf8'):
              if not raw.strip(): continue
              row=json.loads(raw)
              tour=str(row.get('source_tour') or '')
              eid=str(row.get('source_match_id') or '')
              pair=(tour,eid)
              if not eid or pair in events:
                  duplicate_events+=1
              events.add(pair)
              ids=(row.get('source_winner_id'),row.get('source_loser_id'))
              if not all(isinstance(x,str) and re.fullmatch(r'[A-Za-z0-9]{8}',x) for x in ids) or ids[0]==ids[1]:
                  blank_or_same+=1
              for pid,name in ((ids[0],row.get('source_winner_name')),(ids[1],row.get('source_loser_name'))):
                  if pid:
                      identities[tour,pid].add(str(name or '').strip())
              by_season[tour,str(row.get('source_season'))]+=1
          aliases=sum(len(values)>1 for values in identities.values())
          if len(events)!=9741 or blank_or_same or duplicate_events or aliases:
              raise SystemExit('BLOCKED_SOURCE_PLAYER_ID_ALIAS_COLLISION_OR_DUPLICATE')
          print('SOURCE_NATIVE_IDENTITY_ROWS='+str(len(events)))
          print('SOURCE_NATIVE_PLAYER_IDS_DISTINCT='+str(len(identities)))
          print('SOURCE_NATIVE_ID_WITH_MULTIPLE_NAMES='+str(aliases))
          print('SOURCE_NATIVE_PLAYER_ID_FAILURES='+str(blank_or_same))
          print('SOURCE_NATIVE_EVENT_DUPLICATES='+str(duplicate_events))
          print('SOURCE_SEASON_COUNTS='+json.dumps(
              {tour+'_'+year:n for (tour,year),n in sorted(by_season.items())},sort_keys=True))
          print('SOURCE_TO_CANONICAL_ID_INDEPENDENTLY_ATTESTED=FALSE')
          print('CANONICAL_WRITES=0')
          PY
      - name: Independently verify all current baseline release digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('work/blinq-v1/before')
          meta=json.loads((root/'release-api.json').read_text())
          assets={a['name']:a for a in meta['assets']}
          bundle=json.loads((root/'_tbt_bundle_manifest.json').read_text())['files']
          hist=json.loads((root/'history_manifest.json').read_text())['years']
          names=['history-2024.parquet','history-2025.parquet','history-2026.parquet',
                 'history_manifest.json','_tbt_bundle_manifest.json']
          for name in names:
              value=hashlib.sha256((root/name).read_bytes()).hexdigest()
              if assets[name].get('digest') != 'sha256:'+value:
                  raise SystemExit('BLOCKED_RELEASE_API_ASSET_DIGEST_CHANGED')
              if name != '_tbt_bundle_manifest.json' and bundle[name]['sha256'] != value:
                  raise SystemExit('BLOCKED_BUNDLE_MANIFEST_DIGEST_CHANGED')
              if name.endswith('.parquet') and hist[name[8:12]]['sha256'] != value:
                  raise SystemExit('BLOCKED_YEAR_MANIFEST_DIGEST_CHANGED')
          print('CURRENT_CANONICAL_RELEASE_DIGESTS_VERIFIED=5')
          print('PINNED_YEARS=2024,2025,2026')
          PY
      - name: Compute real current exact-source identity and NULL delta (never publish candidate rows)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/blinq-private-exact-link.txt"
          trap 'rm -f "$log_file"' EXIT
          # Only the read-only linker SHA pin is replaced; the shipped production writer is untouched.
          if ! python -c "import link_uploaded_flashscore_verified as m; m.SOURCE_SHA='d6d62982c438c625d531a50fc38faa2179835fe336d6e40d5b10a7ef63919210'; m.run('work/blinq-v1/source/repaired-stage-r5.jsonl.gz','work/blinq-v1/source/blinq-flashscore-event-index-2026.jsonl.gz','work/blinq-v1/before','work/blinq-v1/out')" >"$log_file" 2>&1; then
            echo "::error::Real private source crosswalk failed; no private trace exposed in public logs."
            exit 61
          fi
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('work/blinq-v1/out/direct_link_report.json').read_text())
          c=r['counts']; n=int(r['stage_rows'])
          stage=Path('work/blinq-v1/out/cdb_import_stage_EXACT_DIRECT_ONLY.jsonl')
          rows=[json.loads(line) for line in stage.read_text().splitlines() if line.strip()]
          if len(rows)!=n or len({v['match_id'] for v in rows})!=n:
              raise SystemExit('BLOCKED_DUPLICATE_OR_MISMATCHED_STAGE')
          if (r.get('canonical_writes')!=0 or r.get('writer_executed') is not False
              or any(v.get('import_ready') is not True for v in rows)):
              raise SystemExit('BLOCKED_INVALID_LINKER_STATUS')
          field_counts={}
          for v in rows:
              for name in v.get('incoming_stats',{}):
                  field_counts[name]=field_counts.get(name,0)+1
          if sum(field_counts.values())!=c.get('staged_new_canonical_null_cells',0):
              raise SystemExit('BLOCKED_SOURCE_STAT_CELL_COUNT_MISMATCH')
          print('DRYRUN_REAL_SOURCE_ROWS='+str(c.get('source_rows',0)))
          print('DRYRUN_MATCHES_IN_STAGE='+str(n))
          print('DRYRUN_NEW_NULL_CELLS='+str(sum(field_counts.values())))
          print('DRYRUN_FOUR_COUNT_AND_TWO_SET_PROOFS='+str(c.get('verified_four_counts_and_two_sets',0)))
          print('DRYRUN_ALREADY_COMPLETE='+str(c.get('already_complete',0)))
          print('DRYRUN_CONFLICTS='+str(c.get('other_stats_conflict',0)))
          print('DRYRUN_AMBIGUOUS_OR_DUPLICATE_TARGETS='+str(c.get('duplicate_canonical_target',0)))
          print('DRYRUN_REJECTED_BY_CAUSE='+json.dumps({k:v for k,v in c.items()
                  if k not in ('source_rows','staged_new_canonical_null_cells')},sort_keys=True))
          print('DRYRUN_STAT_FIELD_COUNTS='+json.dumps(field_counts,sort_keys=True))
          print('PRODUCTION_CDB_WRITES=0')
          print('PAID_PROVIDER_API_CALLS=0')
          PY
      - name: Research-only native event clock and identity witness audit (never a writer gate)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections, gzip, json
          from pathlib import Path
          import audit_uploaded_clock_bridge as bridge
          # Fixed reviewed R5 SHA; the prior workflow steps already byte-attested
          # the stage and proved each original CSV source_sha256.
          bridge.SOURCE_SHA='d6d62982c438c625d531a50fc38faa2179835fe336d6e40d5b10a7ef63919210'
          root=Path('work/blinq-v1')
          src=root/'source/repaired-stage-r5.jsonl.gz'
          index=root/'source/blinq-flashscore-event-index-2026.jsonl.gz'
          out=root/'clock-research-private'
          r=bridge.run(src,index,root/'before',out)
          cand=[json.loads(line) for line in gzip.open(out/'private-candidates.jsonl.gz','rt') if line.strip()]
          conflict=[json.loads(line) for line in gzip.open(out/'private-conflicts.jsonl.gz','rt') if line.strip()]
          unique_source=len(set(x['source_key'] for x in cand))==len(cand)
          unique_target=len(set(x['canonical_match_id'] for x in cand))==len(cand)
          if not unique_source or not unique_target:
              raise SystemExit('BLOCKED_DUPLICATE_CLOCK_RESEARCH_CROSSWALK')
          if r.get('canonical_cells_written')!=0 or r.get('model_training') is not False:
              raise SystemExit('BLOCKED_CLOCK_PROBE_WRITE_POLICY')
          ct=r['counts']
          print('RESEARCH_CLOCK_STAGE_R5_SHA_VERIFIED=TRUE')
          print('RESEARCH_NATIVE_EVENT_CORROBORATED='+str(ct.get('proven_same_native_event_players_score_four_stats',0)))
          print('RESEARCH_UNIQUE_NULL_CANDIDATE_MATCHES='+str(len(cand)))
          print('RESEARCH_POTENTIAL_NULL_CELLS='+str(ct.get('potential_new_null_cells',0)))
          print('RESEARCH_CONFLICTING_MATCHES='+str(len(conflict)))
          print('RESEARCH_ALREADY_COMPLETE='+str(ct.get('already_complete',0)))
          print('RESEARCH_CLOCK_BUCKETS='+json.dumps(r['clock_discrepancy_buckets'],sort_keys=True))
          print('RESEARCH_REJECTION_COUNTS='+json.dumps(ct,sort_keys=True))
          # Determine whether source and index actually provide independent IDs
          # for BOTH sides. Only emit schema-field names, never real player data.
          index_first=next(iter(bridge.rows(index)))
          src_first=next(iter(bridge.rows(src)))
          idx_fields=sorted(index_first)
          source_fields=sorted(src_first)
          print('PRIVATE_SOURCE_SCHEMA_FIELD_NAMES='+json.dumps(source_fields))
          print('PRIVATE_EVENT_INDEX_SCHEMA_FIELD_NAMES='+json.dumps(idx_fields))
          print('PRIVATE_EVENT_INDEX_LINK_FIELD_NAMES='+json.dumps(sorted(index_first.get('link') or {})))
          # Research clock differences are NOT certified start time, identity,
          # ranking as-of, or proof of production import eligibility.
          print('RESEARCH_CLOCK_PROBE_WRITE_AUTHORIZED=FALSE')
          print('PRODUCTION_CDB_WRITES=0')
          PY
      - name: Reconfirm baseline has not changed during private computation
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$SOURCE_REPO/releases/tags/$CDB_TAG" > work/blinq-v1/after/release-api.json
          gh release download "$CDB_TAG" -R "$SOURCE_REPO" \
            -p history_manifest.json -p _tbt_bundle_manifest.json -D work/blinq-v1/after
          cmp work/blinq-v1/before/history_manifest.json work/blinq-v1/after/history_manifest.json
          cmp work/blinq-v1/before/_tbt_bundle_manifest.json work/blinq-v1/after/_tbt_bundle_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('work/blinq-v1')
          old=json.loads((p/'before/release-api.json').read_text())
          new=json.loads((p/'after/release-api.json').read_text())
          chosen=['history-2024.parquet','history-2025.parquet','history-2026.parquet',
                  'history_manifest.json','_tbt_bundle_manifest.json']
          def subset(d):
              return {a['name']:(a['id'],a['digest'],a['size'])
                      for a in d['assets'] if a['name'] in chosen}
          if subset(old)!=subset(new):
              raise SystemExit('BLOCKED_CDB_RELEASE_CHANGED_DURING_READ_ONLY_DRYRUN')
          if len(subset(new))!=5:
              raise SystemExit('BLOCKED_CDB_RELEASE_MISSING_PARTITIONS')
          print('CURRENT_CANONICAL_BASELINE_STABLE_DURING_DRYRUN=TRUE')
          print('PRODUCTION_CDB_WRITES=0')
          PY
      - name: Persist SHA-versioned private quarantined research stage, then independently read back
        if: github.repository == 'BackstageTalks/tbt' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh repo view "$SOURCE_REPO" --json visibility -q .visibility)" = PRIVATE
          python - <<'PY'
          import gzip,hashlib,json
          from collections import Counter
          from pathlib import Path
          root=Path('work/blinq-v1')
          source=root/'source/repaired-stage-r5.jsonl.gz'
          research=root/'clock-research-private'
          attest=root/'research-checkpoint'
          attest.mkdir(parents=True,exist_ok=True)
          stage_sha=hashlib.sha256(source.read_bytes()).hexdigest()
          assert stage_sha=='d6d62982c438c625d531a50fc38faa2179835fe336d6e40d5b10a7ef63919210'
          src={}
          for line in gzip.open(source,'rt',encoding='utf8'):
              if not line.strip(): continue
              r=json.loads(line)
              if r['source_key'] in src: raise SystemExit('Duplicate source identity before checkpoint')
              src[r['source_key']]=r
          can=[]
          for line in gzip.open(research/'private-candidates.jsonl.gz','rt',encoding='utf8'):
              if not line.strip():continue
              r=json.loads(line);s=src[r['source_key']]
              expected={'source_key':r['source_key'],'canonical_match_id':r['canonical_match_id'],
                  'source_native_event_id':s['source_match_id'],
                  'source_winner_native_id':s['source_winner_id'],
                  'source_loser_native_id':s['source_loser_id'],
                  'source_original_file_sha256':s['source_sha256'],
                  'source_raw_row_sha256':s['source_row_sha256'],
                  'source_tour':s['source_tour'],'source_season':s['source_season'],
                  'candidate_null_stat_names':sorted(set(r['new_null_keys'])),
                  'source_minus_index_seconds':r['source_minus_index_seconds'],
                  'source_minus_canonical_seconds':r['source_minus_canonical_seconds'],
                  'identity_status':'RESEARCH_CROSS_NAMESPACE_NOT_INDEPENDENTLY_ATTESTED',
                  'timestamp_status':'DISAGREEMENT_REQUIRES_EXTERNAL_WITNESS',
                  'write_authorized':False,'canonical_import_ready':False,
                  'rights_source_specific_clearance_pending':True,
                  'model_training_allowed':False}
              if not expected['candidate_null_stat_names']:raise SystemExit('Empty candidate missing stats')
              can.append(expected)
          can.sort(key=lambda x:(x['source_tour'],x['source_native_event_id'],x['canonical_match_id']))
          if len(can)!=139 or len({r['source_key'] for r in can})!=len(can) or len({r['canonical_match_id'] for r in can})!=len(can):
              raise SystemExit('Research cardinality/uniqueness changed')
          cells=sum(len(r['candidate_null_stat_names']) for r in can)
          if cells!=524:raise SystemExit('Research NULL candidate cardinality changed')
          def persist(name,items):
              with (attest/name).open('wb') as fh:
                  with gzip.GzipFile(filename='',fileobj=fh,mode='wb',mtime=0) as z:
                      z.write(''.join(json.dumps(x,sort_keys=True,ensure_ascii=False)+'\n' for x in items).encode('utf8'))
          persist('research-identity-pending.jsonl.gz',can)
          conflicts=[]
          for line in gzip.open(research/'private-conflicts.jsonl.gz','rt',encoding='utf8'):
              if not line.strip():continue
              r=json.loads(line)
              s=src.get(r['source_key'])
              if s is None:raise SystemExit('Untraceable conflict source row')
              conflicts.append({
                  'source_key':r['source_key'],
                  'native_event_id':s['source_match_id'],
                  'original_file_sha256':s['source_sha256'],
                  'conflicting_keys':sorted(set(r['conflicting_keys'])),
                  'quarantine_only':True,'write_authorized':False})
          if len(conflicts)!=395:raise SystemExit('Unexpected private quarantine count')
          conflicts.sort(key=lambda x:x['source_key'])
          persist('conflict-quarantine.jsonl.gz',conflicts)
          prior=json.loads((research/'report.json').read_text())
          snapshots=json.loads((root/'before/release-api.json').read_text())
          names=['history-2024.parquet','history-2025.parquet','history-2026.parquet',
                 'history_manifest.json','_tbt_bundle_manifest.json']
          sha={a['name']:a['digest'] for a in snapshots['assets'] if a['name'] in names}
          if len(sha)!=len(names):raise SystemExit('Missing canonical release asset hashes')
          report={
              'schema':'BLINQ_R5_PRIVATE_CDB_RESEARCH_STAGE_V1',
              'state':'PERSIST_PRIVATE_UNAPPROVED_RESEARCH_ONLY',
              'source_raw_archive_sha256':'8202ff4b485495546e507317357b9f1c3c84ad9b5f806931044bfede16a9783d',
              'repaired_stage_sha256':stage_sha,
              'independent_event_index_sha256':'328f9c36c0f4021c745ca7119ea904a4ae7cadb66cee17cc63f2ca6f5774a952',
              'canonical_asset_release_digests':sha,
              'canonical_before_and_after_unchanged':True,
              'input_source_rows':len(src),'identity_pending_research_candidates':len(can),
              'candidate_null_field_names_only':cells,
              'quarantined_conflicting_matches':len(conflicts),
              'native_event_clock_disagreement':prior['counts'].get('clock_diff_with_same_native_event',0),
              'source_ids_proven_same_namespace_as_cdb':False,
              'all_both_player_cross_provider_ids_attested':False,
              'positive_import_eligibility':0,
              'production_cdb_written_cells':0,
              'source_operator_supplied_internal_use_attested':True,
              'source_specific_exclusions_still_override':True,
              'model_training_allowed':False,'rights_for_raw_redistribution':False,
              'next':'Independently attest original native event and both participant IDs across provider namespaces; resolve clock conflict without fuzzy matching; rerun fresh CAS NULL gate and restore proof before any writer.'
          }
          (attest/'report.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n',encoding='utf8')
          with (attest/'SHA256SUMS').open('w') as z:
              for item in sorted(attest.iterdir()):
                  if item.name!='SHA256SUMS':
                      z.write(hashlib.sha256(item.read_bytes()).hexdigest()+'  '+item.name+'\n')
          print('PREPARED_RESEARCH_CANDIDATES='+str(len(can)))
          print('PREPARED_NULL_FIELD_NAMES_ONLY='+str(cells))
          print('PREPARED_QUARANTINED_CONFLICTS='+str(len(conflicts)))
          print('PREPARED_CANONICAL_WRITES=0')
          PY
          (cd work/blinq-v1/research-checkpoint && sha256sum -c SHA256SUMS)
          tag="blinq-r5-private-current-crosswalk-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" -R "$SOURCE_REPO" --target main \
            --title "BlinQ R5 private current-CDB crosswalk research; not import-ready" \
            --notes 'Private only. Original CSV SHA-pinned. 139 timestamp/identity candidates and 395 conflicts quarantined; no canonical source/player bridge attested, no CDB writes or model training.' \
            work/blinq-v1/research-checkpoint/*
          mkdir -p work/blinq-v1/research-readback
          gh release download "$tag" -R "$SOURCE_REPO" -D work/blinq-v1/research-readback
          (cd work/blinq-v1/research-readback && sha256sum -c SHA256SUMS)
          cmp work/blinq-v1/research-checkpoint/report.json work/blinq-v1/research-readback/report.json
          cmp work/blinq-v1/research-checkpoint/research-identity-pending.jsonl.gz work/blinq-v1/research-readback/research-identity-pending.jsonl.gz
          cmp work/blinq-v1/research-checkpoint/conflict-quarantine.jsonl.gz work/blinq-v1/research-readback/conflict-quarantine.jsonl.gz
          echo "PRIVATE_RESEARCH_STAGE_REMOTE_SHA_READBACK_VERIFIED=$tag"
          echo "CDB_PRODUCTION_WRITES=0"
      - name: Clean ephemeral private data
        if: always()
        shell: bash
        run: rm -rf work/blinq-v1
