name: BlinQ Telegram complete daily offer (06:20 queue)
# External scheduler calls repository_dispatch in Europe/Bratislava at 06:20.
# The job retries while data writers run; no native GitHub cron.
on:
  schedule:
    - cron: '20 6 * * *'
      timezone: Europe/Bratislava
  repository_dispatch:
    types: [telegram-daily-offer-tick]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/telegram-daily-offer-tick.json'

permissions:
  contents: read
  actions: write

jobs:
  queue:
    if: ${{ github.event_name != 'schedule' || vars.BLINQ_NATIVE_SCHEDULES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: blinq-telegram-ledger
      cancel-in-progress: false
    outputs:
      queued: ${{ steps.intent.outputs.queued }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: telegram-bot-state
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: .private-telegram
          sparse-checkout: ops
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Persist daily intent in private ledger before waiting
        id: intent
        shell: bash
        run: |
          set -euo pipefail
          test -s .private-telegram/ops/telegram-bot-state.json
          python scripts/telegram_offer_publisher.py queue-daily --state .private-telegram/ops/telegram-bot-state.json | tee /tmp/daily-intent.json
          if [[ "$(jq -r .status /tmp/daily-intent.json)" == "skipped" ]]; then
            echo "queued=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C .private-telegram config user.name "github-actions[bot]"
          git -C .private-telegram config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git -C .private-telegram diff --quiet -- ops/telegram-bot-state.json; then
            git -C .private-telegram add ops/telegram-bot-state.json
            git -C .private-telegram commit -m "Queue confirmed BlinQ daily Telegram offer [skip ci]"
            git -C .private-telegram push origin HEAD:telegram-bot-state
            expected="$(git -C .private-telegram rev-parse HEAD)"
            actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
            test "$expected" = "$actual" || { echo "::error::Queue read-back failed"; exit 1; }
          fi
          echo "queued=true" >> "$GITHUB_OUTPUT"

  wait-for-confirmed-offer:
    needs: queue
    if: needs.queue.outputs.queued == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 285
    outputs:
      ready: ${{ steps.wait.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait while writers are running and for today's verified release snapshot
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
          BLINQ_PRODUCTION_URL: ${{ vars.TBT_PRODUCTION_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
        run: |
          set -euo pipefail
          test -n "$DATA_TOKEN"
          # At most ~4h20 per attempt. Before GitHub's timeout, hand off
          # the persisted QUEUED intent via workflow_dispatch; never claim
          # Telegram delivery before independently verified message IDs.
          # A failed/uncertain Telegram send stays reserved for manual review
          # (Telegram sendMessage has no reliable idempotency key).
          start_day="$(TZ=Europe/Bratislava date +%Y-%m-%d)"
          for n in $(seq 1 260); do
            current_day="$(TZ=Europe/Bratislava date +%Y-%m-%d)"
            current_hour="$(TZ=Europe/Bratislava date +%H)"
            if [[ "$current_day" != "$start_day" && "$current_hour" -ge 6 ]]; then
              echo "::warning::Betting day rolled; stale offers are never sent."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Read the immutable confirmed private offer AND the live website
            # serving generation. Long-running unrelated data writers do not
            # hold the morning TG queue once the public board is verified ready.
            if GH_TOKEN="$DATA_TOKEN" python - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"scripts"))
          import telegram_offer_publisher as pub
          now=datetime.now(timezone.utc)
          snap=pub.snapshot(Path("/tmp/blinq-telegram-gate")/"assets")
          base=os.environ["BLINQ_PRODUCTION_URL"].rstrip("/")
          token=os.environ["BLINQ_LIVE_WORKER_TOKEN"]
          if not token or not base.startswith("https://") or "/" in base.split("://",1)[1]:
              raise SystemExit("Verified website origin and existing worker token required")
          req=urllib.request.Request(
              base+"/api/v1/internal/serving-readback",
              headers={"X-Blinq-Worker-Token":token,"Cache-Control":"no-cache",
                       "Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as resp:
              readback=json.loads(resp.read(100001))
          print("MORNING_SITE_PARITY",json.dumps(
              pub.verified_website_morning_parity(snap,readback,now),sort_keys=True))
          PY
            then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $n: confirmed snapshot / live website parity not ready; waiting 60s"
            sleep 60
          done
          echo "::notice::Still queued; handing off to a fresh workflow run"
          gh workflow run telegram-daily-offer.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "ready=false" >> "$GITHUB_OUTPUT"

  deliver:
    needs: [queue, wait-for-confirmed-offer]
    if: needs.wait-for-confirmed-offer.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: blinq-telegram-ledger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: telegram-bot-state
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: .private-telegram
          sparse-checkout: ops
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Prepare entire confirmed daily TOP VALUE ACES and one FREE TOP
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
          BLINQ_URL: ${{ vars.TBT_PRODUCTION_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net' }}
        run: |
          set -euo pipefail
          python scripts/telegram_offer_publisher.py prepare --daily --config-url "$BLINQ_URL/api/v1/ui-config" --state .private-telegram/ops/telegram-bot-state.json
          if [[ ! -s /tmp/blinq-telegram/ready ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Previously reserved or no longer eligible. No duplicate."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reserve exactly once before Telegram requests
        if: steps.prepare.outputs.ready == 'true'
        id: reserve
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/blinq-telegram/state.json .private-telegram/ops/telegram-bot-state.json
          git -C .private-telegram config user.name "github-actions[bot]"
          git -C .private-telegram config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Reserve full daily Telegram delivery [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual" || { echo "::error::Reservation read-back failed"; exit 1; }
      - name: Send ALL confirmed picks and separate FREE TOP
        if: steps.prepare.outputs.ready == 'true'
        env:
          TGB: ${{ secrets.TGB }}
          TGCH: ${{ secrets.TGCH }}
        run: |
          python scripts/telegram_offer_publisher.py send
      - name: Persist Telegram receipts and independently verify
        if: steps.prepare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/telegram_offer_publisher.py mark-sent
          cp /tmp/blinq-telegram/state.json .private-telegram/ops/telegram-bot-state.json
          git -C .private-telegram add ops/telegram-bot-state.json
          git -C .private-telegram commit -m "Confirm full daily Telegram delivery receipts [skip ci]"
          git -C .private-telegram push origin HEAD:telegram-bot-state
          expected="$(git -C .private-telegram rev-parse HEAD)"
          actual="$(git -C .private-telegram ls-remote origin refs/heads/telegram-bot-state | awk '{print $1}')"
          test "$expected" = "$actual" || { echo "::error::Telegram receipt read-back failed"; exit 1; }

  dispatch-more-aces:
    needs: deliver
    if: needs.deliver.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch separate website-ball VIAC ES after regular daily delivery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # VIAC ES independently confirms the original daily receipt, exact
          # current web generation, future fixture day and private ledger slot.
          # No request data or bookmaker quote is passed via dispatch.
          gh workflow run telegram-more-aces.yml --repo "$GITHUB_REPOSITORY" --ref main
