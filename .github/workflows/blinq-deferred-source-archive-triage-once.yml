name: BlinQ deferred and quarantined Drive archive triage (manual once)

# No scheduled run, no tennis API and no canonical CDB mutation.
'on':
  pull_request:
    paths:
      - scripts/audit_drive_rejected_statuses.py
      - tests/test_audit_drive_rejected_statuses.py
      - .github/workflows/blinq-deferred-source-archive-triage-once.yml
  push:
    branches: [main]
    paths: [.github/deferred-source-census-request.json]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: blinq-deferred-census-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test original archive SHA, classification and zero-write constraints
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_audit_drive_rejected_statuses.py -v
          python -m compileall -q scripts/audit_drive_rejected_statuses.py

  classify-private-archive:
    needs: safety-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'BackstageTalks/tbt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      DATA_REPO: BackstageTalks/tbt-data
      ORIGINAL_RELEASE: blinq-drive-cdb-audit-38161326646-1
      EXPECTED_SHA: a5d43ac0a55cc0d0fa7bf79c8dac0135054d905434e2a642944f2353a3b71af4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm explicit request and exclusively private destination
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$DATA_REPO" --json visibility -q .visibility)" = PRIVATE
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(jq -er .mode .github/deferred-source-census-request.json)" = review-source-only
          fi
          echo 'PRIVATE_DESTINATION_NO_SPORTS_API_NO_CDB_WRITER_PASS'
      - name: Download original immutable Drive audit (no Drive API and no sports API)
        run: |
          set -euo pipefail
          mkdir -p work/older work/reclassified
          gh release download "$ORIGINAL_RELEASE" -R "$DATA_REPO" -p drive-cdb-audit-bundle.tar.gz -D work/older >/dev/null
          test "$(sha256sum work/older/drive-cdb-audit-bundle.tar.gz | cut -d' ' -f1)" = "$EXPECTED_SHA"
          python scripts/audit_drive_rejected_statuses.py \
            --prior-archive work/older/drive-cdb-audit-bundle.tar.gz \
            --expected-sha256 "$EXPECTED_SHA" --out work/reclassified \
            >work/reclassified/execution-report.json
          (cd work/reclassified && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json,gzip
          from pathlib import Path
          p=Path('work/reclassified')
          r=json.loads((p/'report.json').read_text())
          assert r['canonical_cells_written']==0
          assert r['sports_api_requests']==0
          assert r['quarantine_count']==40
          assert r['original_readonly_file_status_counts']['DEFERRED_BUDGET']==1457
          assert r['original_readonly_file_status_counts']['NEEDS_FORMAT_ADAPTER']==2025
          assert r['rejected_status_count']==3523
          with gzip.open(p/'recovery-work-queue-private.jsonl.gz','rt',encoding='utf-8') as f:
            rows=[json.loads(line) for line in f if line.strip()]
          assert len(rows)==r['rejected_status_count']
          assert len({x['drive_file_id'] for x in rows})==len(rows)
          assert all(not x['canonical_write_authorized'] and not x['import_ready'] for x in rows)
          print('PRIVATE_CDB_SOURCE_TRIAGE_COUNTS:', {
            'classified':len(rows),'quarantine':r['quarantine_count'],
            'deferred_budget':r['original_readonly_file_status_counts']['DEFERRED_BUDGET']})
          PY
      - name: Persist classified SHA-based source queue in private Release
        run: |
          set -euo pipefail
          tag="blinq-deferred-source-census-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          root=work/reclassified
          gh release create "$tag" "$root/report.json" "$root/SHA256SUMS" \
            "$root/recovery-work-queue-private.jsonl.gz" "$root/quarantine-40-private.jsonl" \
            -R "$DATA_REPO" --title 'BlinQ deferred Drive sources private recovery queue' \
            --notes 'Research only: SHA-pinned original audit, 40 quarantine files and all other deferred/adapter source IDs; no new API, no CDB modification.'
          mkdir -p work/independent-readback
          gh release download "$tag" -R "$DATA_REPO" -D work/independent-readback >/dev/null
          (cd work/independent-readback && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json,gzip
          from pathlib import Path
          r=Path('work/independent-readback')
          j=json.loads((r/'report.json').read_text())
          assert j['canonical_cells_written']==0
          with gzip.open(r/'recovery-work-queue-private.jsonl.gz','rt') as f:
            assert sum(1 for line in f if line.strip())==j['rejected_status_count']
          assert len((r/'quarantine-40-private.jsonl').read_text().splitlines())==j['quarantine_count']
          print('PRIVATE_DEFERRED_SOURCE_QUEUE_INDEPENDENT_READBACK_PASS:',j['rejected_status_count'])
          PY
          echo 'Source-only private Release:' "$tag" >> "$GITHUB_STEP_SUMMARY"
