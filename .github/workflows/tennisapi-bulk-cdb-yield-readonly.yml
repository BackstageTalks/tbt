name: BlinQ TennisApi PRO batch yield vs pinned private CDB (read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/tennisapi-bulk-yield-run-request.json

permissions:
  contents: read

concurrency:
  group: blinq-tennisapi-bulk-cdb-yield-readonly
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      BLINQ_SHARED_API_BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
      BLINQ_SHARED_API_BUDGET_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      BLINQ_SHARED_API_BUDGET_PURPOSE: history
      BLINQ_PROVIDER_REQUEST_RESERVE: '500'
      BLINQ_REQUIRE_PROVIDER_RATE_LIMIT_HEADER: 'true'
      BLINQ_RAPIDAPI_MAX_RPS: '3'
      PYTHONPATH: api:scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Check source permissions, bounded request and exact shared budget
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema==1 and .phase=="cdb_yield" and
            .max_requests==12 and .provider_requests_allowed==true and
            .cdb_writes_allowed==false and .model_changes_allowed==false and
            .years==[2023,2026]' .github/tennisapi-bulk-yield-run-request.json >/dev/null
          test -n "$GH_TOKEN" && test -n "$RAPIDAPI_KEY" && test -n "$BLINQ_SHARED_API_BUDGET_TOKEN"
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          from datetime import datetime,timezone
          url=os.environ["BLINQ_SHARED_API_BUDGET_URL"]
          if not url.startswith("https://") or not url.endswith("/api/v1/internal/api-budget/reserve"):
              raise SystemExit("Invalid protected budget route")
          req=Request(url,headers={"X-Blinq-Worker-Token":os.environ["BLINQ_SHARED_API_BUDGET_TOKEN"]})
          with urlopen(req,timeout=20) as response:
              result=json.load(response)
          b=result.get("budget") if result.get("ok") is True else None
          if not isinstance(b,dict) or b.get("schema")!=2 or b.get("global_limit")!=14500 or b.get("reserved_provider_headroom")!=500 or b.get("provider_plan_limit")!=15000:
              raise SystemExit("Protected quota ledger unavailable/unrecognized")
          spent,remain=b.get("global_spent"),b.get("global_remaining")
          if type(spent) is not int or type(remain) is not int or remain!=14500-spent or remain<20:
              raise SystemExit("Insufficient exact shared provider-day budget")
          reset=datetime.fromisoformat(b["next_reset_utc"].replace("Z","+00:00"))
          if (reset-datetime.now(timezone.utc)).total_seconds()<20*60:
              raise SystemExit("Too near provider reset for safe QA")
          print(json.dumps({"shared_budget":"VERIFIED","global_spent":spent,
                            "global_remaining":remain,"max_provider_calls":12},sort_keys=True))
          PY
      - name: Install provider/CDB dependencies and run exact overlap regression
        run: |
          python -m pip install -r api/requirements-train.txt
          python -m pip install "pandas>=2,<3" pyarrow
          python -m pytest -q tests/test_tennisapi_bulk_cdb_yield.py tests/test_tennisapi_bulk_contract_probe.py
      - name: Independently freeze SHA-verified 2023/2026 private CDB
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          mkdir -p .cache/qa-yield/source .cache/qa-yield/report
          gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" > .cache/qa-yield/release-before.json
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -D .cache/qa-yield/source -p history-2023.parquet -p history-2026.parquet -p history_manifest.json -p _tbt_bundle_manifest.json
          python - <<'PY'
          from pathlib import Path
          from scripts.cdb_wta_verified_window import verified_window
          root=Path(".cache/qa-yield")
          r=verified_window(root/"source",root/"release-before.json",root/"view",years=(2023,2026))
          assert set(r["partitions"]) == {"2023","2026"}
          print("PINNED_PRIVATE_CDB_2023_2026_SHA_VERIFIED")
          PY
      - name: Guarded provider bulk/odds vs exact current CDB match identities
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_tennisapi_bulk_cdb_yield.py --history-dir .cache/qa-yield/view --max-requests 12 --output .cache/qa-yield/report/verified-overlap.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".cache/qa-yield/report/verified-overlap.json").read_text())
          assert r["cdb_writes"]==0 and r["model_changes"]==0
          assert 1<=r["provider_requests_including_retries"]<=12
          assert r["verified_historical_prematch_odds"]==0
          assert r["production_route_switched"] is False
          assert r["source"]["unique_eligible_native_event_ids"]>=1
          print("SOURCE_NATIVE_CDB_OVERLAP_READ_ONLY_PASS")
          PY
      - name: Independently re-read canonical release to exclude publisher race
        run: |
          set -euo pipefail
          gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" > .cache/qa-yield/release-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".cache/qa-yield")
          before=json.loads((root/"release-before.json").read_text())
          after=json.loads((root/"release-after.json").read_text())
          keys={"history-2023.parquet","history-2026.parquet","history_manifest.json","_tbt_bundle_manifest.json"}
          def pins(data):
              return {x["name"]:(x["id"],x["digest"]) for x in data["assets"] if x["name"] in keys}
          if len(pins(before))!=4 or pins(before)!=pins(after):
              raise SystemExit("Canonical release mutated during read-only QA")
          p=root/"report/verified-overlap.json"
          r=json.loads(p.read_text())
          r["independent_cdb_release_unchanged"]=True
          p.write_text(json.dumps(r,sort_keys=True,indent=2)+"\n")
          print("CANONICAL_CDB_INDEPENDENT_READBACK_STABLE")
          PY
      - name: Upload safe research aggregates, no raw source or private CDB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennisapi-pro-bulk-cdb-yield-run
          path: .cache/qa-yield/report/verified-overlap.json
          if-no-files-found: warn
          retention-days: 14
      - name: Delete local private CDB and any provider source samples
        if: always()
        run: rm -rf .cache/qa-yield
