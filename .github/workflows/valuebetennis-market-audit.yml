name: Audit Valuebetennis market history

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.head_ref == 'data/valuebetennis-market-history-20261002' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r api/requirements.txt -r api/requirements-train.txt
      - name: Download verified canonical history
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",Path(".cache/tbt/history")).download()
          PY
      - name: Download Valuebetennis CC BY 4.0 CSVs
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt/valuebetennis
          for y in 2021 2022 2023 2024 2025 2026; do
            curl --fail --location --retry 4 --retry-all-errors               "https://www.valuebetennis.com/datasets/valuebetennis-matchs-${y}.csv"               -o ".cache/tbt/valuebetennis/valuebetennis-matchs-${y}.csv"
            test -s ".cache/tbt/valuebetennis/valuebetennis-matchs-${y}.csv"
          done
          python - <<'PY'
          import csv, json
          from pathlib import Path
          for p in sorted(Path(".cache/tbt/valuebetennis").glob("*.csv")):
              with p.open(encoding="utf-8-sig", newline="") as h:
                  r=csv.reader(h); header=next(r); first=next(r)
              print("VALUEBET_SCHEMA", p.name, json.dumps(header,ensure_ascii=False), json.dumps(first,ensure_ascii=False))
          PY
      - name: Link fail closed
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r f; do args+=(--source-csv "$f"); done < <(find .cache/tbt/valuebetennis -name '*.csv' -type f | sort)
          python scripts/link_valuebetennis_market_history.py             --history-dir .cache/tbt/history "${args[@]}"             --out-dir .cache/tbt/valuebetennis-audit
      - name: Dry-run importer
        run: |
          python scripts/import_offline_market_history.py             --stage .cache/tbt/valuebetennis-audit/auto_linked.jsonl             --history-dir .cache/tbt/history             --out-dir .cache/tbt/valuebetennis-dry
      - name: Safety gate
        run: |
          python - <<'PY'
          import json
          a=json.load(open(".cache/tbt/valuebetennis-audit/report.json"))
          d=json.load(open(".cache/tbt/valuebetennis-dry/report.json"))
          ac=a.get("counts",{}); dc=d.get("counts",{})
          if ac.get("invalid_source_rows",0) == ac.get("source_rows",0): raise SystemExit("All Valuebetennis rows rejected by parser")
          if ac.get("staged_matches",0) <= 0: raise SystemExit("Zero Valuebetennis rows staged")
          # Ambiguous source links are expected to be quarantined by the linker; only staged rows reach the importer.
          if dc.get("identity_changed",0) or dc.get("invalid_market_history",0) or dc.get("market_conflicts",0):
              raise SystemExit(f"Importer safety failure: {dc}")
          if dc.get("updated",0) != ac.get("staged_matches",0):
              raise SystemExit("Stage/import count mismatch")
          print(json.dumps({"audit":a,"dry_run":d},indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valuebetennis-market-audit-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            .cache/tbt/valuebetennis-audit/
            .cache/tbt/valuebetennis-dry/
