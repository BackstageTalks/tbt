name: BlinQ score feature ablation

on:
  push:
    branches: [main]
    paths:
      - ".github/score-feature-ablation-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-score-feature-ablation-parallel
  cancel-in-progress: false

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        year: [2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install training dependencies
        run: python -m pip install -r api/requirements-train.txt

      - name: Validate controlled request
        run: |
          set -euo pipefail
          test "$(jq -r '.mode // ""' .github/score-feature-ablation-request.json)" = "score-ablation"
          test "$(jq -r '.zero_provider_api_requests // false' .github/score-feature-ablation-request.json)" = "true"
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }

      - name: Download canonical production history
        run: python scripts/download_production_preflight_inputs.py

      - name: Run paired score ON vs OFF fold
        run: |
          set -euo pipefail
          python scripts/ablate_score_features.py \
            --history-dir .cache/tbt/history \
            --out ".cache/tbt/score-ablation-${{ matrix.year }}.json" \
            --year "${{ matrix.year }}"
          test -s ".cache/tbt/score-ablation-${{ matrix.year }}.json"

      - name: Upload fold evidence
        uses: actions/upload-artifact@v4
        with:
          name: blinq-score-ablation-${{ matrix.year }}-${{ github.run_id }}
          path: .cache/tbt/score-ablation-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      ABLATION_RUN_ID: ${{ github.run_id }}
      ABLATION_RUN_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install aggregation dependency
        run: python -m pip install scipy

      - name: Download fold evidence
        uses: actions/download-artifact@v4
        with:
          pattern: blinq-score-ablation-*-${{ github.run_id }}
          path: .cache/tbt/score-ablation-folds
          merge-multiple: true

      - name: Aggregate paired score ablation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from scipy.stats import binomtest

          root = Path(".cache/tbt/score-ablation-folds")
          reports = [json.loads(p.read_text(encoding="utf-8")) for p in sorted(root.glob("*.json"))]
          if len(reports) != 4:
              raise SystemExit(f"Expected 4 fold reports, got {len(reports)}")
          folds = [r["folds"][0] for r in reports]
          folds.sort(key=lambda f: int(f["year"]))
          metric_keys = ("accuracy", "roc_auc", "log_loss", "brier_score", "ece_10")
          total_n = sum(int(f["test_rows"]) for f in folds)

          def weighted(arm, key):
              pairs = [(int(f["test_rows"]), f[arm].get(key)) for f in folds]
              pairs = [(n, float(v)) for n, v in pairs if v is not None]
              return sum(n*v for n, v in pairs) / sum(n for n, _ in pairs) if pairs else None

          full_only = sum(int(f["paired_accuracy"]["full_only_correct"]) for f in folds)
          base_only = sum(int(f["paired_accuracy"]["base_only_correct"]) for f in folds)
          discordant = full_only + base_only
          paired_p = float(binomtest(full_only, discordant, p=.5, alternative="two-sided").pvalue) if discordant else 1.0

          overall = {
              "n": total_n,
              "full": {key: weighted("full", key) for key in metric_keys},
              "base_without_score": {key: weighted("base_without_score", key) for key in metric_keys},
              "paired_accuracy": {
                  "full_only_correct": full_only,
                  "base_only_correct": base_only,
                  "discordant": discordant,
                  "mcnemar_exact_p_value": paired_p,
              },
          }
          overall["delta_full_minus_base"] = {
              key: (
                  overall["full"][key] - overall["base_without_score"][key]
                  if overall["full"][key] is not None and overall["base_without_score"][key] is not None
                  else None
              )
              for key in metric_keys
          }

          def aggregate_subset(name):
              parts = [f.get("score_subsets", {}).get(name) for f in folds]
              parts = [p for p in parts if p and int(p.get("n", 0)) > 0]
              if not parts:
                  return None
              n = sum(int(p["n"]) for p in parts)
              def w(arm, key):
                  pairs = [(int(p["n"]), p[arm].get(key)) for p in parts]
                  pairs = [(nn, float(v)) for nn, v in pairs if v is not None]
                  return sum(nn*v for nn, v in pairs) / sum(nn for nn, _ in pairs) if pairs else None
              fo = sum(int(p["paired_accuracy"]["full_only_correct"]) for p in parts)
              bo = sum(int(p["paired_accuracy"]["base_only_correct"]) for p in parts)
              dis = fo + bo
              pval = float(binomtest(fo, dis, p=.5, alternative="two-sided").pvalue) if dis else 1.0
              full = {key: w("full", key) for key in metric_keys}
              base = {key: w("base_without_score", key) for key in metric_keys}
              return {
                  "n": n,
                  "full": full,
                  "base_without_score": base,
                  "delta_full_minus_base": {
                      key: (full[key]-base[key] if full[key] is not None and base[key] is not None else None)
                      for key in metric_keys
                  },
                  "paired_accuracy": {
                      "full_only_correct": fo,
                      "base_only_correct": bo,
                      "discordant": dis,
                      "mcnemar_exact_p_value": pval,
                  },
              }

          payload = {
              "schema": 1,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "run_id": os.environ["ABLATION_RUN_ID"],
              "run_sha": os.environ["ABLATION_RUN_SHA"],
              "api_requests": 0,
              "method": "parallel paired calendar-year walk-forward score ON vs OFF; identical folds; only score-derived features removed from OFF arm",
              "score_features": reports[0]["score_features"],
              "overall": overall,
              "score_subsets": {
                  "any_known": aggregate_subset("any_known"),
                  "workload_known": aggregate_subset("workload_known"),
                  "all_known": aggregate_subset("all_known"),
              },
              "folds": folds,
          }
          out = Path("/tmp/score-feature-ablation-latest.json")
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({
              "overall": overall,
              "score_subsets": payload["score_subsets"],
              "folds": [
                  {
                      "year": f["year"],
                      "test_rows": f["test_rows"],
                      "score_known_test_rows": f["score_known_test_rows"],
                      "delta": f["delta_full_minus_base"],
                  }
                  for f in folds
              ],
          }, indent=2))
          PY

      - name: Persist latest score ablation audit
        run: |
          set -euo pipefail
          path="audit/score-feature-ablation-latest.json"
          existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/score-feature-ablation-latest.json)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" \
              -f message="Audit BlinQ score feature ablation run $ABLATION_RUN_ID" \
              -f content="$encoded" -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" \
              -f message="Audit BlinQ score feature ablation run $ABLATION_RUN_ID" \
              -f content="$encoded" >/dev/null
          fi

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: blinq-score-ablation-aggregate-${{ github.run_id }}
          path: /tmp/score-feature-ablation-latest.json
          if-no-files-found: error
          retention-days: 14
