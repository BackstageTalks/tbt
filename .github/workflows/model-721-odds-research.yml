name: BlinQ 7.2.1 odds specialist synthetic checks
on:
  pull_request:
    paths:
      - scripts/train_top_721_odds_specialist.py
      - tests/test_top_721_odds_specialist.py
      - .github/workflows/model-721-odds-research.yml
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas scikit-learn joblib pytest
      - run: python -m pytest tests/test_top_721_odds_specialist.py -q
