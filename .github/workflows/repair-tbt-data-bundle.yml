name: Repair tbt-data bundle manifest

on:
  push:
    branches:
      - library-all-matches-enrichment
    paths:
      - '.github/workflows/repair-tbt-data-bundle.yml'

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: BackstageTalks/tbt-data
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Download current bundle manifest and replaced assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cache/tbt/bundle-repair
          mkdir -p .cache/tbt/bundle-repair
          cd .cache/tbt/bundle-repair
          gh release download tbt-data-v1 --repo "$TBT_DATA_REPOSITORY" --pattern _tbt_bundle_manifest.json --clobber
          for name in \
            history-1992.parquet \
            history-1994.parquet \
            history-1995.parquet \
            history-1996.parquet \
            history-1998.parquet \
            history-1999.parquet \
            history-2003.parquet \
            history-2007.parquet \
            history-2008.parquet \
            history-2009.parquet \
            history-2011.parquet \
            history-2012.parquet \
            history-2013.parquet \
            history-2014.parquet \
            history-2015.parquet \
            history-2016.parquet \
            history-2017.parquet \
            history-2018.parquet \
            history_manifest.json
          do
            gh release download tbt-data-v1 --repo "$TBT_DATA_REPOSITORY" --pattern "$name" --clobber
          done

      - name: Rebuild checksum entries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path(".cache/tbt/bundle-repair")
          path=root/"_tbt_bundle_manifest.json"
          data=json.loads(path.read_text(encoding="utf-8"))
          files=data.get("files")
          if not isinstance(files,dict):
              raise SystemExit("Invalid existing bundle manifest")
          changed=[
              "history-1992.parquet","history-1994.parquet","history-1995.parquet","history-1996.parquet",
              "history-1998.parquet","history-1999.parquet","history-2003.parquet","history-2007.parquet",
              "history-2008.parquet","history-2009.parquet","history-2011.parquet","history-2012.parquet",
              "history-2013.parquet","history-2014.parquet","history-2015.parquet","history-2016.parquet",
              "history-2017.parquet","history-2018.parquet","history_manifest.json",
          ]
          for name in changed:
              p=root/name
              if not p.is_file() or p.stat().st_size <= 0:
                  raise SystemExit(f"Missing release asset during repair: {name}")
              h=hashlib.sha256()
              with p.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024*1024), b""):
                      h.update(chunk)
              files[name]={"sha256":h.hexdigest(),"bytes":int(p.stat().st_size)}
          data["schema"]=1
          data["generated_at"]=datetime.now(timezone.utc).isoformat()
          data["files"]=files
          path.write_text(json.dumps(data,indent=2,sort_keys=True),encoding="utf-8")
          print(json.dumps({name:files[name] for name in changed},indent=2))
          PY

      - name: Commit repaired bundle manifest
        shell: bash
        run: |
          set -euo pipefail
          gh release upload tbt-data-v1 \
            .cache/tbt/bundle-repair/_tbt_bundle_manifest.json \
            --repo "$TBT_DATA_REPOSITORY" \
            --clobber

      - name: Verify canonical release end to end
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          rm -rf .cache/tbt/history .cache/tbt/player-assets
          python scripts/download_production_preflight_inputs.py
          python - <<'PY'
          from pathlib import Path
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          from tbt.models.feature_builder import FeatureBuilder
          matches=load_partitions(Path(".cache/tbt/history"))
          safe,safety=sanitize_history_identities(matches)
          quality=sum(1 for m in safe if all(
              FeatureBuilder._extract_quality(m.stats or {},side)[0] is not None and
              FeatureBuilder._extract_quality(m.stats or {},side)[1] is not None
              for side in ("p1","p2")
          ))
          if len(safe)!=740121 or safety.get("quarantined_rows"):
              raise SystemExit(f"Canonical integrity failed: rows={len(safe)} safety={safety}")
          if quality < 281254:
              raise SystemExit(f"Quality ready below expected enriched state: {quality}")
          print({"rows":len(safe),"quality_ready":quality,"quarantined_rows":safety.get("quarantined_rows",0)})
          PY
