name: BlinQ tbt-pro legacy audit

on:
  push:
    branches: [main]
    paths:
      - ".github/tbt-pro-legacy-audit-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-tbt-pro-legacy-audit-v2
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      AUDIT_RUN_ID: ${{ github.run_id }}
      AUDIT_RUN_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout legacy tbt-pro repository
        uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-pro
          path: .cache/tbt-pro
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            data/marq_ai/odds_snapshots/events
            blinq/data/form/previous_matches
            thinq/data/players
            thinq/data/ta_profiles
            thinq/data/elo
            outputs/2026/all
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install audit dependencies
        run: python -m pip install -r api/requirements-train.txt

      - name: Validate controlled request
        run: |
          set -euo pipefail
          test "$(jq -r '.mode // ""' .github/tbt-pro-legacy-audit-request.json)" = "legacy-audit"
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }

      - name: Download canonical production history
        run: python scripts/download_production_preflight_inputs.py

      - name: Audit legacy repository against canonical history
        run: |
          set -euo pipefail
          python scripts/audit_tbt_pro_legacy.py             --history-dir .cache/tbt/history             --legacy-dir .cache/tbt-pro             --out-dir .cache/tbt/legacy-audit
          test -s .cache/tbt/legacy-audit/legacy_audit.json

      - name: Audit exact provider opening/current odds
        run: |
          set -euo pipefail
          python scripts/audit_tbt_pro_exact_market_outputs.py             --history-dir .cache/tbt/history             --legacy-dir .cache/tbt-pro             --out-dir .cache/tbt/exact-market-audit
          test -s .cache/tbt/exact-market-audit/exact_market_audit.json

      - name: Strict legacy score gap-fill dry-run
        run: |
          set -euo pipefail
          python scripts/dryrun_import_legacy_scores.py \
            --history-dir .cache/tbt/history \
            --legacy-dir .cache/tbt-pro \
            --out-dir .cache/tbt/legacy-score-dryrun
          test -s .cache/tbt/legacy-score-dryrun/report.json

      - name: Persist compact audit in private data repo
        run: |
          set -euo pipefail
          cp .cache/tbt/legacy-audit/legacy_audit.json /tmp/tbt-pro-legacy-audit-latest.json
          path="audit/tbt-pro-legacy-audit-latest.json"
          existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/tbt-pro-legacy-audit-latest.json)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit tbt-pro legacy data run $AUDIT_RUN_ID"               -f content="$encoded" -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit tbt-pro legacy data run $AUDIT_RUN_ID"               -f content="$encoded" >/dev/null
          fi

          exact_path="audit/tbt-pro-exact-market-audit-latest.json"
          exact_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$exact_path" --jq .sha 2>/dev/null || true)"
          exact_encoded="$(base64 -w0 .cache/tbt/exact-market-audit/exact_market_audit.json)"
          if [[ -n "$exact_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$exact_path"               -f message="Audit exact legacy market run $AUDIT_RUN_ID"               -f content="$exact_encoded" -f sha="$exact_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$exact_path"               -f message="Audit exact legacy market run $AUDIT_RUN_ID"               -f content="$exact_encoded" >/dev/null
          fi

          score_path="audit/tbt-pro-legacy-score-dryrun-latest.json"
          score_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$score_path" --jq .sha 2>/dev/null || true)"
          score_encoded="$(base64 -w0 .cache/tbt/legacy-score-dryrun/report.json)"
          if [[ -n "$score_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$score_path" \
              -f message="Audit legacy score dry-run $AUDIT_RUN_ID" \
              -f content="$score_encoded" -f sha="$score_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$score_path" \
              -f message="Audit legacy score dry-run $AUDIT_RUN_ID" \
              -f content="$score_encoded" >/dev/null
          fi

      - name: Upload legacy audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: blinq-tbt-pro-legacy-audit-${{ github.run_id }}
          path: |
            .cache/tbt/legacy-audit/legacy_audit.json
            .cache/tbt/legacy-audit/market_candidates.jsonl.gz
            .cache/tbt/legacy-audit/previous_match_candidates.jsonl.gz
            .cache/tbt/exact-market-audit/exact_market_audit.json
            .cache/tbt/exact-market-audit/exact_market_candidates.jsonl.gz
            .cache/tbt/legacy-score-dryrun/report.json
            .cache/tbt/legacy-score-dryrun/stage.jsonl.gz
            .cache/tbt/legacy-score-dryrun/rejections_sample.jsonl.gz
          if-no-files-found: error
          retention-days: 14
