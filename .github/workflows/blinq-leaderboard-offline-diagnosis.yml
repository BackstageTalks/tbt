name: BlinQ ATP Leaderboards cached HTML diagnosis (no source requests)

on:
  push:
    branches: [main]
    paths: [.github/workflows/blinq-leaderboard-offline-diagnosis.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      ARCHIVE: blinq-atp-leaderboards-38039406462-1.tar.gz
      PRIVATE_REPO: BackstageTalks/tbt-data
      RELEASE: blinq-cloud-atptour-20261009
    steps:
      - name: Download latest original ATP captured HTML privately
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = "true"
          mkdir -p /tmp/leaderboards
          gh release download "$RELEASE" --repo "$PRIVATE_REPO" \
            --pattern "$ARCHIVE" --dir /tmp/leaderboards
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Analyze captured DOM, row selectors and embedded payloads, OFFLINE
        run: |
          python - <<'PY'
          import gzip,json,os,re,tarfile
          from pathlib import Path
          from bs4 import BeautifulSoup
          t=Path("/tmp/leaderboards")/os.environ["ARCHIVE"]
          results=[]
          with tarfile.open(t,"r:gz") as tar:
              members=[x for x in tar if x.isfile()]
              for x in members:
                  if not x.name.endswith(".html.gz"):
                      continue
                  data=tar.extractfile(x).read()
                  try:
                      html=gzip.decompress(data).decode("utf-8",errors="replace")
                  except (OSError,ValueError):
                      results.append({"file":Path(x.name).name,"error":"invalid_gzip"});continue
                  soup=BeautifulSoup(html,"html.parser")
                  tables=soup.select("table")
                  tbodys=soup.select("tbody")
                  leaders=soup.select("div.leaderboard table")
                  all_tr=soup.select("table tbody tr")
                  rows=soup.select("div.leaderboard table tbody tr")
                  scripts=soup.select("script")
                  script_data=[{"id":tag.get("id","")[:70],"type":tag.get("type","")[:55],
                      "bytes":len(tag.get_text())} for tag in scripts if len(tag.get_text())>500]
                  results.append({
                      "file":Path(x.name).name,"html_bytes":len(html),
                      "title":soup.title.get_text(" ",strip=True)[:95] if soup.title else "",
                      "tables":len(tables),"leaderboard_tables":len(leaders),
                      "tbody":len(tbodys),"all_table_rows":len(all_tr),
                      "leaderboard_rows":len(rows),
                      "table_classes":[(table.get("class") or [])[:5] for table in tables[:5]],
                      "table_ids":[table.get("id") for table in tables[:5]],
                      "script_json_candidates":script_data[:8],
                      "bot_wall_indicators":[term for term in ("captcha","Cloudflare","Just a moment","Access denied") if term.lower() in html.lower()],
                      "first_row_cells":[td.get_text(" ",strip=True)[:80] for td in rows[0].select("td")[:10]] if rows else [],
                  })
          if not results:
              raise SystemExit("No archived HTML found; no source request attempted")
          report={"status":"OFFLINE_RAW_HTML_DIAGNOSIS_NOT_CDB_DATA","captured_html_count":len(results),"samples":results[:35]}
          Path("leaderboard-dom-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print("LEADERBOARD_CACHED_DOM_REPORT",json.dumps(report,ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("### ATP leaderboard cached source HTML diagnosis\n")
              out.write("No source requests; raw files remain private.\n")
              for item in results[:12]:
                  out.write(f"- {item.get('file')}: table rows {item.get('leaderboard_rows')}, html bytes {item.get('html_bytes')}\n")
          PY
      - name: Counts-only DOM diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: atp-leaderboard-cached-dom-diagnostic
          path: leaderboard-dom-report.json
          retention-days: 30

  parser-selftest:
    name: Verify ATP JS-template detection without ATP network requests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run entire ATP parser selftest suite
        working-directory: source
        run: python -u scripts/scrape_atptour_official.py --mode selftest
      - name: Check invalid HTTP 200 placeholder never triggers follow-up requests
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          import tempfile,sys,json
          from types import SimpleNamespace
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import scrape_atptour_official as s
          blank = """<div class='leaderboard'><table><tbody>
          <tr><td> </td><td></td><td> </td></tr>
          <tr><td></td><td></td><td></td></tr></tbody></table></div>"""
          class Stub:
              calls=0
              def get(self,url):
                  self.calls+=1
                  if self.calls>1:
                      raise AssertionError("Illegal follow-up ATP source request")
                  return blank
          stub=Stub()
          with tempfile.TemporaryDirectory() as d:
              try:
                  s.leaderboard_job(SimpleNamespace(leaderboard_frames="all"),stub,Path(d))
              except RuntimeError as e:
                  assert "empty template" in str(e) and "stop" in str(e)
              else:
                  raise AssertionError("Empty JS template was wrongly accepted")
              assert stub.calls == 1
              report=json.loads((Path(d)/"leaderboards"/"_unpopulated_serve.json").read_text())
              assert report["status"]=="UNPOPULATED_DYNAMIC_LEADERBOARD"
              assert report["valid_player_rows"]==0
          print("ATP_LEADERBOARD_FASTFAIL_TEST_PASSED; only one mocked GET, zero upstream traffic")
          PY
