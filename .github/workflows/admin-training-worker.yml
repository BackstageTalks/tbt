name: BlinQ admin training worker
on:
  # GitHub cron is forbidden. Subscribe to existing externally clocked
  # match-status completions (every 30 minutes), not to an additional timer.
  workflow_dispatch:
  workflow_run:
    workflows: [Test and deploy, Prediction fixture schedule and match status, Hourly prediction match status, Tennis data and predictions, BlinQ protected frozen-CDB candidate training, BlinQ Model Factory source preflight, CDB Drive Inbox - guarded external file import, BlinQ read-only champion vs challenger shadow audit, BlinQ private model calibration monitor, Activate verified 7.2.1 shadow candidate, BlinQ explicit admin production release]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: blinq-admin-training-worker
  cancel-in-progress: false
jobs:
  sync:
    # External scheduler calls match-status every 30 minutes. Subscribe to
    # completed real work; skip push-triggered no-op runs.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: api:scripts
      BLINQ_TRAINING_GITHUB_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      BLINQ_TRAINING_DISPATCH_TOKEN: ${{ github.token }}
      BLINQ_LIVE_WORKER_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      BLINQ_BASE_URL: https://agreeable-sky-011a7fe10.7.azurestaticapps.net
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize queued protected candidate training
        run: python scripts/admin_training_worker.py
      - name: Synchronize Model Lab and dispatch at most one guarded operation
        if: ${{ !cancelled() }}
        run: python scripts/admin_model_lab_worker.py
