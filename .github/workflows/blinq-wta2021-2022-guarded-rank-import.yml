name: Guarded WTA 2021-2022 exact ID rank CDB publish
on:
  pull_request:
    paths:
      - scripts/import_wta2023_2024_verified_rank_exact_cells.py
      - tests/test_wta2023_2024_verified_rank_exact_cells.py
      - .github/wta2021-rank-publish-request.json
      - .github/wta2022-rank-publish-request.json
      - .github/workflows/blinq-wta2021-2022-guarded-rank-import.yml
      - .github/workflows/reusable-wta-oldrank-publish.yml
  push:
    branches: [main]
    paths:
      - .github/wta2021-rank-publish-request.json
      - .github/wta2022-rank-publish-request.json
permissions:
  contents: read
  actions: read
concurrency:
  group: wta-2021-2022-verified-ranks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guarded-publish:
    uses: ./.github/workflows/reusable-wta-oldrank-publish.yml
    with:
      year_matrix: '[2021, 2022]'
    secrets: inherit
