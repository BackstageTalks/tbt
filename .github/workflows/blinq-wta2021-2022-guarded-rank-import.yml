name: Guarded WTA 2021-2022 exact ID rank CDB publish
on:
  pull_request:
    paths:
      - scripts/import_wta2023_2024_verified_rank_exact_cells.py
      - tests/test_wta2023_2024_verified_rank_exact_cells.py
      - .github/wta2021-rank-publish-request.json
      - .github/wta2022-rank-publish-request.json
      - .github/workflows/blinq-wta2021-2022-guarded-rank-import.yml
  push:
    branches: [main]
    paths:
      - .github/wta2021-rank-publish-request.json
      - .github/wta2022-rank-publish-request.json
permissions:
  contents: read
  actions: read
concurrency:
  group: wta-2021-2022-verified-ranks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: |
          set -euo pipefail
          python -m pip install -q -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_wta2023_2024_verified_rank_exact_cells.py tests/test_wta2023_2024_verified_rank_gaps.py
          python -m compileall -q scripts/import_wta2023_2024_verified_rank_exact_cells.py
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2021, 2022]
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PYTHONPATH: api:scripts
      DATA_REPO: BackstageTalks/tbt-data
      SOURCE_YEAR: ${{ matrix.year }}
      ROOT: .cache/tbt/wta-oldrank-${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install writer and regression dependencies
        run: |
          set -euo pipefail
          python -m pip install -q -r api/requirements-train.txt pytest
          python -m pytest -q tests/test_wta2023_2024_verified_rank_exact_cells.py tests/test_wta2023_2024_verified_rank_gaps.py
      - name: Validate private provenance, SHA pins and writer flags
        id: gate
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$DATA_REPO" --jq .private)" = true
          r=".github/wta${SOURCE_YEAR}-rank-publish-request.json"
          test -s "$r"
          test "$(jq -r .year "$r")" = "$SOURCE_YEAR"
          python - "$r" <<'PY'
          import json,sys
          from import_wta2023_2024_verified_rank_exact_cells import configure
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          configure(r)
          assert r["year"] in (2021,2022)
          print("PINNED_WTA_YEAR_WRITER_REQUEST_SAFE",r["year"],r["expected_added_values"])
          PY
          echo "mode=$(jq -r .mode "$r")" >> "$GITHUB_OUTPUT"
          echo "stage_tag=$(jq -r .source_tag "$r")" >> "$GITHUB_OUTPUT"
      - name: Read back pinned private audit source and current full canonical year
        env:
          STAGE_TAG: ${{ steps.gate.outputs.stage_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/stage" "$ROOT/before" "$ROOT/local" "$ROOT/out"
          gh release download "$STAGE_TAG" -R "$DATA_REPO" -D "$ROOT/stage"
          (cd "$ROOT/stage" && sha256sum -c SHA256SUMS)
          gh release download tbt-data-v1 -R "$DATA_REPO" -p "history-${SOURCE_YEAR}.parquet" -p history_manifest.json -p _tbt_bundle_manifest.json -D "$ROOT/before"
          gh api "repos/$DATA_REPO/releases/tags/tbt-data-v1" > "$ROOT/before/release.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ["ROOT"]); y=os.environ["SOURCE_YEAR"]
          r=json.loads(Path(f".github/wta{y}-rank-publish-request.json").read_text())
          rel=json.loads((d/"before/release.json").read_text())
          assets={a["name"]:a["digest"] for a in rel["assets"]}
          manifest=json.loads((d/"before/history_manifest.json").read_text())["years"][y]
          for f in (f"history-{y}.parquet","history_manifest.json","_tbt_bundle_manifest.json"):
              h=hashlib.sha256((d/"before"/f).read_bytes()).hexdigest()
              assert assets[f]=="sha256:"+h, f
          part_hash=hashlib.sha256((d/"before"/f"history-{y}.parquet").read_bytes()).hexdigest()
          assert part_hash==r["source_original_year_sha256"]==r["current_year_sha256"]==manifest["sha256"]
          bundle=json.loads((d/"before/_tbt_bundle_manifest.json").read_text())["files"]
          assert bundle[f"history-{y}.parquet"]["sha256"]==part_hash
          assert bundle["history_manifest.json"]["sha256"]==hashlib.sha256((d/"before/history_manifest.json").read_bytes()).hexdigest()
          print("WTA_OLD_YEAR_CURRENT_CDB_PIN_AND_BUNDLE_READBACK_PASS",y)
          PY
      - name: Full-year dry-run, local write and independent local verify
        run: |
          set -euo pipefail
          r=".github/wta${SOURCE_YEAR}-rank-publish-request.json"
          args=(--request "$r" --current-dir "$ROOT/before" --source-old-dir "$ROOT/before" --stage-file "$ROOT/stage/wta${SOURCE_YEAR}-rank-null-candidates.jsonl.gz" --stage-report "$ROOT/stage/report.json")
          python scripts/import_wta2023_2024_verified_rank_exact_cells.py --mode dry-run "${args[@]}" --output-dir "$ROOT/local" --out "$ROOT/out/dry.json"
          python scripts/import_wta2023_2024_verified_rank_exact_cells.py --mode write "${args[@]}" --output-dir "$ROOT/local" --out "$ROOT/out/local-write.json"
          python scripts/import_wta2023_2024_verified_rank_exact_cells.py --mode verify "${args[@]}" --output-dir "$ROOT/local" --out "$ROOT/out/local-verify.json"
          test "$(jq -r .status "$ROOT/out/local-verify.json")" = verified_full_year
          test "$(jq -r .existing_nonnull_cells_overwritten "$ROOT/out/local-verify.json")" = 0
          test "$(jq -r .counts.updated_matches "$ROOT/out/local-verify.json")" = "$(jq -r .expected_matches "$r")"
          test "$(jq -r '.counts.player1_rank_filled+.counts.player2_rank_filled' "$ROOT/out/local-verify.json")" = "$(jq -r .expected_added_values "$r")"
      - name: Acquire global CDB single-writer lease
        if: steps.gate.outputs.mode == 'write'
        run: python scripts/cdb_global_writer_lock.py acquire --wait-seconds 1800
      - name: Fresh canonical compare under lock
        if: steps.gate.outputs.mode == 'write'
        run: |
          set -euo pipefail
          python scripts/cdb_global_writer_lock.py verify
          mkdir -p "$ROOT/recheck"
          gh release download tbt-data-v1 -R "$DATA_REPO" -p "history-${SOURCE_YEAR}.parquet" -p history_manifest.json -p _tbt_bundle_manifest.json -D "$ROOT/recheck"
          for f in "history-${SOURCE_YEAR}.parquet" history_manifest.json _tbt_bundle_manifest.json; do
            cmp "$ROOT/before/$f" "$ROOT/recheck/$f"
          done
      - name: Immutable private prewrite year backup with independent reread
        if: steps.gate.outputs.mode == 'write'
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/backup" "$ROOT/backup-readback"
          for f in "history-${SOURCE_YEAR}.parquet" history_manifest.json _tbt_bundle_manifest.json; do cp "$ROOT/before/$f" "$ROOT/backup/$f"; done
          cp "$ROOT/stage/report.json" "$ROOT/backup/source-report.json"
          cp "$ROOT/stage/wta${SOURCE_YEAR}-rank-null-candidates.jsonl.gz" "$ROOT/backup/source-stage.jsonl.gz"
          cp "$ROOT/out/local-verify.json" "$ROOT/backup/local-verify.json"
          cp ".github/wta${SOURCE_YEAR}-rank-publish-request.json" "$ROOT/backup/request.json"
          (cd "$ROOT/backup"; sha256sum "history-${SOURCE_YEAR}.parquet" history_manifest.json _tbt_bundle_manifest.json source-report.json source-stage.jsonl.gz local-verify.json request.json > SHA256SUMS; sha256sum -c SHA256SUMS)
          tag="blinq-wta${SOURCE_YEAR}-ranks-prewrite-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" "$ROOT/backup/"* -R "$DATA_REPO" --title "WTA ${SOURCE_YEAR} immutable rank prewrite" --notes "Verifiable prior year, source pins, local parity and restore inputs."
          gh release download "$tag" -R "$DATA_REPO" -D "$ROOT/backup-readback"
          (cd "$ROOT/backup-readback" && sha256sum -c SHA256SUMS)
      - name: Publish year partition CAS, manifest last
        if: steps.gate.outputs.mode == 'write'
        run: |
          set -euo pipefail
          python scripts/cdb_global_writer_lock.py verify
          python - <<'PY'
          import json,os
          from pathlib import Path
          from release_store import ReleaseStore
          from cdb_global_writer_lock import verify
          root=Path(os.environ["ROOT"]); repo=os.environ["DATA_REPO"]; year=os.environ["SOURCE_YEAR"]
          prior=json.loads((root/"before/_tbt_bundle_manifest.json").read_text())["files"]
          def freshness():
              verify(repo,Path(".cdb-global-writer-lock.json"))
              if ReleaseStore(repo,"tbt-data-v1",root/"cas")._remote_bundle_files()!=prior:
                  raise ValueError("Another canonical CDB writer changed release")
          ReleaseStore(repo,"tbt-data-v1",root/"local").upload_bundle(
              [root/"local"/f"history-{year}.parquet",root/"local/history_manifest.json"],
              before_upload=freshness)
          PY
      - name: Independent remote year readback, SHA and all fields parity
        if: steps.gate.outputs.mode == 'write'
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/remote-after" "$ROOT/verified"
          gh release download tbt-data-v1 -R "$DATA_REPO" -p "history-${SOURCE_YEAR}.parquet" -p history_manifest.json -p _tbt_bundle_manifest.json -D "$ROOT/remote-after"
          r=".github/wta${SOURCE_YEAR}-rank-publish-request.json"
          python scripts/import_wta2023_2024_verified_rank_exact_cells.py --mode verify --request "$r" --current-dir "$ROOT/before" --source-old-dir "$ROOT/before" --stage-file "$ROOT/stage/wta${SOURCE_YEAR}-rank-null-candidates.jsonl.gz" --stage-report "$ROOT/stage/report.json" --output-dir "$ROOT/remote-after" --out "$ROOT/verified/report.json"
          cmp "$ROOT/remote-after/history-${SOURCE_YEAR}.parquet" "$ROOT/local/history-${SOURCE_YEAR}.parquet"
          cmp "$ROOT/remote-after/history_manifest.json" "$ROOT/local/history_manifest.json"
          test "$(jq -r .status "$ROOT/verified/report.json")" = verified_full_year
          test "$(jq -r .existing_nonnull_cells_overwritten "$ROOT/verified/report.json")" = 0
          echo "WTA_RANK_CDB_FULL_REMOTE_READBACK_PASS year=$SOURCE_YEAR"
      - name: Persist private verified provenance
        if: steps.gate.outputs.mode == 'write'
        env:
          STAGE_TAG: ${{ steps.gate.outputs.stage_tag }}
        run: |
          set -euo pipefail
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg source "$STAGE_TAG" --arg backup "blinq-wta${SOURCE_YEAR}-ranks-prewrite-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --slurpfile proof "$ROOT/verified/report.json" '{schema:1,status:"published_and_independently_verified",run_id:$run,app_sha:$sha,source_release:$source,immutable_prewrite_backup:$backup,full_year_readback:$proof[0],existing_nonnull_overwrites:0,model_trained:false,model_promoted:false,provider_requests:0}' > "$ROOT/verified/persisted.json"
          path="audit/wta${SOURCE_YEAR}-id-rank-import-latest.json"
          encoded="$(base64 -w0 "$ROOT/verified/persisted.json")"
          old="$(gh api "repos/$DATA_REPO/contents/$path" --jq .sha 2>/dev/null || true)"
          if [[ -n "$old" ]]; then
            gh api -X PUT "repos/$DATA_REPO/contents/$path" -f message="Record verified WTA ranks $GITHUB_RUN_ID" -f content="$encoded" -f sha="$old" >/dev/null
          else
            gh api -X PUT "repos/$DATA_REPO/contents/$path" -f message="Record verified WTA ranks $GITHUB_RUN_ID" -f content="$encoded" >/dev/null
          fi
          gh api -H "Accept: application/vnd.github.raw+json" "repos/$DATA_REPO/contents/$path" | jq -e --arg run "$GITHUB_RUN_ID" '.status=="published_and_independently_verified" and .run_id==$run and .existing_nonnull_overwrites==0'
      - name: Upload only aggregate QA report to CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wta-oldrank-summary-${{ matrix.year }}-${{ github.run_id }}
          path: |
            .cache/tbt/wta-oldrank-${{ matrix.year }}/out/dry.json
            .cache/tbt/wta-oldrank-${{ matrix.year }}/out/local-verify.json
            .cache/tbt/wta-oldrank-${{ matrix.year }}/verified/report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Release global CDB lock on all outcomes
        if: always()
        run: python scripts/cdb_global_writer_lock.py release --if-held
