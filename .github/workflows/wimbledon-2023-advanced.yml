name: Link Wimbledon 2023 advanced point data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/wimbledon-2023-advanced-request.json"
      - ".github/workflows/wimbledon-2023-advanced.yml"
      - "scripts/link_wimbledon_2023_advanced.py"

permissions:
  contents: read

concurrency:
  group: wimbledon-2023-advanced-sidecar
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      RESEARCH_RELEASE: tbt-research-sources-v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install and test
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt pytest openpyxl
          python -m pytest tests/test_wimbledon_2023_advanced.py -q
          python -m compileall -q scripts/link_wimbledon_2023_advanced.py

      - name: Verify private destination and source
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"
          rm -rf .cache/tbt/wimbledon-2023-advanced
          mkdir -p .cache/tbt/wimbledon-2023-advanced/{source,link}
          gh release download "$RESEARCH_RELEASE" -R "$TBT_DATA_REPOSITORY"             -p figshare-wimbledon-2023-ccby4.xlsx             -D .cache/tbt/wimbledon-2023-advanced/source --clobber
          gh api -H "Accept: application/vnd.github.raw"             "repos/$TBT_DATA_REPOSITORY/contents/audit/figshare-wimbledon-2023-latest.json?ref=main"             > .cache/tbt/wimbledon-2023-advanced/source/source-audit.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path(".cache/tbt/wimbledon-2023-advanced/source/figshare-wimbledon-2023-ccby4.xlsx")
          a=json.loads(Path(".cache/tbt/wimbledon-2023-advanced/source/source-audit.json").read_text())
          expected=(a.get("files") or [{}])[0].get("sha256")
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if a.get("license")!="CC BY 4.0": raise SystemExit("license mismatch")
          if expected!=actual: raise SystemExit(f"source hash mismatch {actual} != {expected}")
          if int(a.get("tabular_rows_total") or 0)!=774: raise SystemExit("unexpected source row count")
          print(json.dumps({"sha256":actual,"rows":a.get("tabular_rows_total")},indent=2))
          PY

      - name: Download canonical history
        run: |
          set -euo pipefail
          python scripts/download_production_preflight_inputs.py

      - name: Exact-link advanced point data
        run: |
          set -euo pipefail
          python scripts/link_wimbledon_2023_advanced.py             --workbook .cache/tbt/wimbledon-2023-advanced/source/figshare-wimbledon-2023-ccby4.xlsx             --history-dir .cache/tbt/history             --out-dir .cache/tbt/wimbledon-2023-advanced/link
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".cache/tbt/wimbledon-2023-advanced/link/report.json").read_text())
          c=r.get("counts") or {}
          if r.get("production_mutated") is not False or r.get("canonical_history_mutated") is not False:
              raise SystemExit("advanced sidecar unexpectedly mutates canonical history")
          if r.get("model_promoted") is not False:
              raise SystemExit("advanced sidecar unexpectedly promotes model")
          if (r.get("identity_safety") or {}).get("quarantined_rows"):
              raise SystemExit("canonical identity quarantine non-empty")
          if int(c.get("linked_matches") or 0)<=0:
              raise SystemExit(f"no safely linked matches: {c}")
          if int(c.get("linked_point_rows") or 0)<100:
              raise SystemExit(f"too few safely linked point rows: {c}")
          print(json.dumps(c,indent=2))
          PY

      - name: Publish private advanced sidecar and unique attribution note
        run: |
          set -euo pipefail
          cat > .cache/tbt/wimbledon-2023-advanced/figshare-wimbledon-2023-LICENSE-NOTE.txt <<'EOF'
          Source: Figshare "Tennis Data"
          DOI: 10.6084/m9.figshare.25511917
          Version: 1
          Author shown by source: Ray Ring
          Figshare file id: 45381565
          License: Creative Commons Attribution 4.0 International (CC BY 4.0)
          BlinQ use: private research advanced point sidecar; canonical history and serving model unchanged.
          EOF
          gh release upload "$RESEARCH_RELEASE" -R "$TBT_DATA_REPOSITORY" --clobber             .cache/tbt/wimbledon-2023-advanced/link/wimbledon-2023-advanced-points.jsonl.gz             .cache/tbt/wimbledon-2023-advanced/figshare-wimbledon-2023-LICENSE-NOTE.txt

      - name: Persist audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path(".cache/tbt/wimbledon-2023-advanced")
          report=json.loads((root/"link/report.json").read_text())
          source=json.loads((root/"source/source-audit.json").read_text())
          report["generated_at_utc"]=datetime.now(timezone.utc).isoformat()
          report["source_sha256"]=(source.get("files") or [{}])[0].get("sha256")
          report["private_sidecar"]="tbt-research-sources-v1/wimbledon-2023-advanced-points.jsonl.gz"
          (root/"audit.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          path="audit/wimbledon-2023-advanced-latest.json"
          encoded="$(base64 -w0 .cache/tbt/wimbledon-2023-advanced/audit.json)"
          sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit Wimbledon 2023 advanced point sidecar"               -f content="$encoded" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit Wimbledon 2023 advanced point sidecar"               -f content="$encoded" >/dev/null
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wimbledon-2023-advanced-${{ github.run_id }}
          path: |
            .cache/tbt/wimbledon-2023-advanced/link/report.json
            .cache/tbt/wimbledon-2023-advanced/link/review.jsonl
          if-no-files-found: warn
          retention-days: 14
