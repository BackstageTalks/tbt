name: Integrate Grand Slam PBP serve-return

on:
  push:
    branches: [main]
    paths:
      - ".github/slam-pbp-import-request.json"

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      SOURCE_SHA: 83733587353df8a41f2fd4f516147d5aa83f5a8d
      MAX_AUDITED_STAGE_ROWS: "1456"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path:
            api/requirements-train.txt

      - name: Install dependencies
        run: python -m pip install --retries 8 --timeout 60 -r api/requirements-train.txt

      - name: Verify controlled request and private destination
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q .visibility)" = "PRIVATE"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".github/slam-pbp-import-request.json").read_text())
          expected={
            "schema":1,
            "mode":"write",
            "source":"jeff_sackmann_slam_pointbypoint",
            "source_sha":"83733587353df8a41f2fd4f516147d5aa83f5a8d",
            "max_audited_stage_rows":1456,
          }
          for k,v in expected.items():
              if r.get(k)!=v:
                  raise SystemExit(f"Request mismatch {k}: {r.get(k)!r} != {v!r}")
          print("controlled request verified")
          PY

      - name: Download current canonical history
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",Path(".cache/tbt/history")).download(require_bundle_manifest=True)
          PY

      - name: Record dynamic baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.audit_serve_return_gaps import analyze
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          matches,safety=sanitize_history_identities(load_partitions(".cache/tbt/history"))
          if safety.get("quarantined_rows"):
              raise SystemExit("Canonical identity quarantine is non-empty")
          r=analyze(matches)
          Path(".cache/tbt/baseline.json").write_text(json.dumps(r,indent=2),encoding="utf-8")
          print(json.dumps(r["overall"],indent=2))
          PY

      - name: Fetch pinned Grand Slam PBP source
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --no-checkout https://github.com/AngieXuAU/tennis-point-by-point-archive.git .cache/tbt/slam-src
          git -C .cache/tbt/slam-src checkout -q "$SOURCE_SHA" -- slam_pointbypoint
          test "$(git -C .cache/tbt/slam-src rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Re-link against current canonical state
        run: |
          set -euo pipefail
          python scripts/link_slam_pbp_serve_return.py             --history-dir .cache/tbt/history             --source-dir .cache/tbt/slam-src/slam_pointbypoint             --out-dir .cache/tbt/slam-link
          python - <<'PY'
          import json, os
          r=json.load(open(".cache/tbt/slam-link/report.json"))
          c=r.get("counts") or {}
          staged=int(c.get("staged_matches") or 0)
          added=int(r.get("quality_ready_projected_added") or 0)
          max_rows=int(os.environ["MAX_AUDITED_STAGE_ROWS"])
          if r.get("production_mutated") is not False or r.get("api_requests") != 0:
              raise SystemExit("Linker safety contract violated")
          if staged <= 0:
              raise SystemExit("No remaining net-new Grand Slam PBP rows")
          if staged > max_rows:
              raise SystemExit(f"Unexpected stage expansion: {staged} > {max_rows}")
          if added != staged:
              raise SystemExit(f"Not every staged row becomes complete: staged={staged}, added={added}")
          if int(c.get("ambiguous") or 0) != 0:
              raise SystemExit("Ambiguous canonical links present")
          print(json.dumps(r,indent=2))
          PY

      - name: Dry-run strict importer
        run: |
          set -euo pipefail
          python scripts/import_offline_linked_serve_return.py             --stage .cache/tbt/slam-link/auto_linked.jsonl             --history-dir .cache/tbt/history             --out-dir .cache/tbt/slam-dry
          python - <<'PY'
          import json
          link=json.load(open(".cache/tbt/slam-link/report.json"))
          r=json.load(open(".cache/tbt/slam-dry/report.json"))
          staged=int((link.get("counts") or {}).get("staged_matches") or 0)
          c=r.get("counts") or {}
          checks={
            "stage_rows":(r.get("stage_rows"),staged),
            "updated":(c.get("updated",0),staged),
            "quality_ready_added":(r.get("quality_ready_added"),staged),
            "identity_missing":(c.get("identity_missing",0),0),
            "identity_changed":(c.get("identity_changed",0),0),
            "stat_conflicts":(c.get("stat_conflicts",0),0),
            "invalid_stats":(c.get("invalid_stats",0),0),
          }
          bad=[f"{k}:{a}!={b}" for k,(a,b) in checks.items() if a!=b]
          if bad:
              raise SystemExit("Dry-run contract failed: "+"; ".join(bad))
          print("dry-run verified")
          PY

      - name: Apply verified PBP stage locally
        run: |
          set -euo pipefail
          python scripts/import_offline_linked_serve_return.py             --stage .cache/tbt/slam-link/auto_linked.jsonl             --history-dir .cache/tbt/history             --out-dir .cache/tbt/slam-import             --write-partitions             --write-history-dir .cache/tbt/history
          python - <<'PY'
          import json
          link=json.load(open(".cache/tbt/slam-link/report.json"))
          r=json.load(open(".cache/tbt/slam-import/report.json"))
          staged=int((link.get("counts") or {}).get("staged_matches") or 0)
          c=r.get("counts") or {}
          if r.get("quality_ready_added") != staged:
              raise SystemExit("Local import quality gain drifted")
          if c.get("stat_conflicts",0) or c.get("identity_changed",0) or c.get("invalid_stats",0):
              raise SystemExit(f"Importer safety failure: {c}")
          if not r.get("changed_years"):
              raise SystemExit("No changed years")
          print(json.dumps(r,indent=2))
          PY

      - name: Validate post-write history and leakage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.audit_serve_return_gaps import analyze
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          before=json.load(open(".cache/tbt/baseline.json"))
          link=json.load(open(".cache/tbt/slam-link/report.json"))
          matches,safety=sanitize_history_identities(load_partitions(".cache/tbt/history"))
          if safety.get("quarantined_rows"):
              raise SystemExit("Post-write identity quarantine")
          after=analyze(matches)
          Path(".cache/tbt/slam-after.json").write_text(json.dumps(after,indent=2),encoding="utf-8")
          staged=int((link.get("counts") or {}).get("staged_matches") or 0)
          if after["overall"]["completed"] != before["overall"]["completed"]:
              raise SystemExit("Canonical completed count changed")
          if after["overall"]["both_ready"] != before["overall"]["both_ready"] + staged:
              raise SystemExit("Post-write serve/return count mismatch")
          print(json.dumps(after["overall"],indent=2))
          PY
          python scripts/audit_training_leakage.py             --history-dir .cache/tbt/history             --report .cache/tbt/slam-leakage.json
          python - <<'PY'
          import json
          r=json.load(open(".cache/tbt/slam-leakage.json"))
          if r.get("status") not in {"PASS","pass"} and r.get("passed") is not True:
              raise SystemExit("Leakage audit failed")
          PY

      - name: Publish changed canonical partitions
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          r=json.load(open(".cache/tbt/slam-import/report.json"))
          years=[int(x) for x in r.get("changed_years") or []]
          root=Path(".cache/tbt/history")
          paths=[root/f"history-{y:04d}.parquet" for y in years] + [root/"history_manifest.json"]
          for p in paths:
              if not p.is_file() or p.stat().st_size <= 0:
                  raise SystemExit(f"Missing publish asset {p}")
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",root).upload_bundle(paths)
          print("published",years)
          PY

      - name: Verify committed private release
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.release_store import ReleaseStore
          from scripts.audit_serve_return_gaps import analyze
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities
          ReleaseStore(os.environ["TBT_DATA_REPOSITORY"],"tbt-data-v1",Path(".cache/tbt/verify")).download(require_bundle_manifest=True)
          before=json.load(open(".cache/tbt/baseline.json"))
          link=json.load(open(".cache/tbt/slam-link/report.json"))
          matches,safety=sanitize_history_identities(load_partitions(".cache/tbt/verify"))
          if safety.get("quarantined_rows"):
              raise SystemExit("Committed release identity quarantine")
          after=analyze(matches)
          staged=int((link.get("counts") or {}).get("staged_matches") or 0)
          if after["overall"]["completed"] != before["overall"]["completed"]:
              raise SystemExit("Committed canonical row count changed")
          if after["overall"]["both_ready"] != before["overall"]["both_ready"] + staged:
              raise SystemExit("Committed serve/return verification failed")
          Path(".cache/tbt/verify-report.json").write_text(json.dumps(after,indent=2),encoding="utf-8")
          print(json.dumps(after["overall"],indent=2))
          PY

      - name: Persist import audit privately
        env:
          GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          baseline=json.load(open(".cache/tbt/baseline.json"))
          link=json.load(open(".cache/tbt/slam-link/report.json"))
          imp=json.load(open(".cache/tbt/slam-import/report.json"))
          verify=json.load(open(".cache/tbt/verify-report.json"))
          audit={
            "schema":1,
            "generated_at_utc":datetime.now(timezone.utc).isoformat(),
            "source":"jeff_sackmann_slam_pointbypoint",
            "source_sha":"83733587353df8a41f2fd4f516147d5aa83f5a8d",
            "license":"CC BY-NC-SA 4.0",
            "canonical_rows":verify["overall"]["completed"],
            "serve_return_before":baseline["overall"]["both_ready"],
            "serve_return_after":verify["overall"]["both_ready"],
            "serve_return_added":verify["overall"]["both_ready"]-baseline["overall"]["both_ready"],
            "link_counts":link.get("counts"),
            "changed_years":imp.get("changed_years"),
            "provider_api_requests":0,
            "model_promoted":False,
          }
          Path(".cache/tbt/slam-import-audit.json").write_text(json.dumps(audit,indent=2),encoding="utf-8")
          PY
          path="audit/slam-pbp-import-latest.json"
          encoded="$(base64 -w0 .cache/tbt/slam-import-audit.json)"
          sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" -f message="Update Grand Slam PBP import audit" -f content="$encoded" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path" -f message="Add Grand Slam PBP import audit" -f content="$encoded" >/dev/null
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slam-pbp-import-${{ github.run_id }}
          retention-days: 14
          path: |
            .cache/tbt/baseline.json
            .cache/tbt/slam-link/report.json
            .cache/tbt/slam-link/review.jsonl
            .cache/tbt/slam-import/report.json
            .cache/tbt/slam-after.json
            .cache/tbt/slam-leakage.json
            .cache/tbt/verify-report.json
            .cache/tbt/slam-import-audit.json
