name: Environment enrichment

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start UTC/date (inclusive). For the full current corpus use 2021-01-01."
        required: true
        default: "2021-01-01"
        type: string
      end:
        description: "End UTC/date (exclusive). Blank = today UTC."
        required: false
        default: ""
        type: string
      limit:
        description: "Maximum matches to inspect (0 = all rows that need work)"
        required: true
        default: "0"
        type: string
      mode:
        description: "Dry-run does not publish parquet changes"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, write]
      force:
        description: "Re-enrich every row in range (normally leave OFF)"
        required: true
        default: false
        type: boolean
      retry_unresolved:
        description: "Second pass: retry unresolved + repair incompatible cached venue rows"
        required: true
        default: false
        type: boolean
      static_only:
        description: "Static venue/geo only (recommended; no historical weather)"
        required: true
        default: true
        type: boolean
      max_requests:
        description: "Open-Meteo/geocoder cap for this run (does NOT use Tennis RapidAPI quota)"
        required: true
        default: "12000"
        type: string

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  enrich-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: api
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_WEATHER_RESEARCH: ${{ vars.TBT_WEATHER_RESEARCH }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies and syntax-check
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q api scripts

      - name: Preflight
        shell: bash
        env:
          BLINQ_INPUT_STATIC_ONLY: ${{ inputs.static_only }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          if [[ "$BLINQ_INPUT_STATIC_ONLY" != "true" ]]; then
            test "$TBT_WEATHER_RESEARCH" = "true" || { echo 'TBT_WEATHER_RESEARCH must be true for historical weather research'; exit 1; }
          fi
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo 'Refusing non-private data repository'; exit 1; }

      - name: Enrich GitHub history
        shell: bash
        env:
          BLINQ_INPUT_START: ${{ inputs.start }}
          BLINQ_INPUT_END: ${{ inputs.end }}
          BLINQ_INPUT_LIMIT: ${{ inputs.limit }}
          BLINQ_INPUT_MAX_REQUESTS: ${{ inputs.max_requests }}
          BLINQ_INPUT_MODE: ${{ inputs.mode }}
          BLINQ_INPUT_STATIC_ONLY: ${{ inputs.static_only }}
          BLINQ_INPUT_FORCE: ${{ inputs.force }}
          BLINQ_INPUT_RETRY_UNRESOLVED: ${{ inputs.retry_unresolved }}
        run: |
          set -euo pipefail
          END_VALUE="$BLINQ_INPUT_END"
          if [[ -z "$END_VALUE" ]]; then END_VALUE="$(date -u +%F)"; fi
          ARGS=(
            --start "$BLINQ_INPUT_START"
            --end "$END_VALUE"
            --limit "$BLINQ_INPUT_LIMIT"
            --max-requests "$BLINQ_INPUT_MAX_REQUESTS"
            --data-repository "$TBT_DATA_REPOSITORY"
          )
          if [[ "$BLINQ_INPUT_MODE" == "dry-run" ]]; then ARGS+=(--dry-run); fi
          if [[ "$BLINQ_INPUT_STATIC_ONLY" == "true" ]]; then ARGS+=(--static-only); fi

          # Force means exactly that: overwrite/re-resolve every row in range.
          # Do NOT combine --force with --complete-static; the Python CLI rejects
          # that combination by design. This used to make force+static-only fail.
          if [[ "$BLINQ_INPUT_FORCE" == "true" ]]; then
            ARGS+=(--force)
          elif [[ "$BLINQ_INPUT_RETRY_UNRESOLVED" == "true" ]]; then
            ARGS+=(--retry-unresolved)
          elif [[ "$BLINQ_INPUT_STATIC_ONLY" == "true" ]]; then
            ARGS+=(--complete-static)
          fi
          python scripts/enrich_environment_snapshot.py "${ARGS[@]}"
      - name: Upload environment run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-environment-enrichment-${{ github.run_id }}
          path: .cache/tbt/history/environment_enrichment_report.json
          if-no-files-found: warn

