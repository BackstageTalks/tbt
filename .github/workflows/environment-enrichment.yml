name: Environment enrichment

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start UTC/date (inclusive). For the full current corpus use 2021-01-01."
        required: true
        default: "2021-01-01"
        type: string
      end:
        description: "End UTC/date (exclusive). Blank = today UTC."
        required: false
        default: ""
        type: string
      limit:
        description: "Maximum matches to inspect (0 = all rows that need work)"
        required: true
        default: "0"
        type: string
      mode:
        description: "Dry-run does not publish parquet changes"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, write]
      force:
        description: "Re-enrich every row in range (normally leave OFF)"
        required: true
        default: false
        type: boolean
      retry_unresolved:
        description: "Second pass: retry unresolved + repair incompatible cached venue rows"
        required: true
        default: false
        type: boolean
      static_only:
        description: "Static venue/geo only (recommended; no historical weather)"
        required: true
        default: true
        type: boolean
      max_requests:
        description: "Shared Open-Meteo/geocoder cap across both passes (does NOT use Tennis RapidAPI quota)"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  plan-window:
    runs-on: ubuntu-latest
    outputs:
      stop_at: ${{ steps.deadline.outputs.stop_at }}
      stop_at_local: ${{ steps.deadline.outputs.stop_at_local }}
    steps:
      - id: deadline
        name: Plan 10-hour enrichment window
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          started_at = datetime.now(timezone.utc)
          stop_utc = started_at + timedelta(hours=10)
          stop_local = stop_utc.astimezone(ZoneInfo("Europe/Bratislava"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"stop_at={stop_utc.isoformat()}\n")
              fh.write(f"stop_at_local={stop_local.isoformat()}\n")
          print(
              f"Environment may run for 10 hours, through "
              f"{stop_local.isoformat()} Bratislava time ({stop_utc.isoformat()} UTC)."
          )
          PY

  enrich-environment-1:
    needs: plan-window
    runs-on: ubuntu-latest
    outputs:
      requests_used: ${{ steps.pass1-summary.outputs.requests_used }}
    timeout-minutes: 350
    env:
      PYTHONPATH: api
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_WEATHER_RESEARCH: ${{ vars.TBT_WEATHER_RESEARCH }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install dependencies and syntax-check
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
          PYTHONPATH=api python -m unittest discover -s scripts/tests -p "test_environment_location_candidates.py"
      - name: Preflight
        shell: bash
        env:
          BLINQ_INPUT_STATIC_ONLY: ${{ inputs.static_only }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          if [[ "$BLINQ_INPUT_STATIC_ONLY" != "true" ]]; then
            test "$TBT_WEATHER_RESEARCH" = "true" || { echo 'TBT_WEATHER_RESEARCH must be true for historical weather research'; exit 1; }
          fi
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo 'Refusing non-private data repository'; exit 1; }
      - name: Enrich GitHub history - pass 1
        shell: bash
        env:
          BLINQ_INPUT_START: ${{ inputs.start }}
          BLINQ_INPUT_END: ${{ inputs.end }}
          BLINQ_INPUT_LIMIT: ${{ inputs.limit }}
          BLINQ_INPUT_MAX_REQUESTS: ${{ inputs.max_requests }}
          BLINQ_INPUT_MODE: ${{ inputs.mode }}
          BLINQ_INPUT_STATIC_ONLY: ${{ inputs.static_only }}
          BLINQ_INPUT_FORCE: ${{ inputs.force }}
          BLINQ_INPUT_RETRY_UNRESOLVED: ${{ inputs.retry_unresolved }}
          BLINQ_STOP_AT: ${{ needs.plan-window.outputs.stop_at }}
        run: |
          set -euo pipefail
          END_VALUE="$BLINQ_INPUT_END"
          if [[ -z "$END_VALUE" ]]; then END_VALUE="$(date -u +%F)"; fi
          ARGS=(
            --start "$BLINQ_INPUT_START"
            --end "$END_VALUE"
            --limit "$BLINQ_INPUT_LIMIT"
            --max-requests "$BLINQ_INPUT_MAX_REQUESTS"
            --max-runtime-minutes "325"
            --stop-at "$BLINQ_STOP_AT"
            --data-repository "$TBT_DATA_REPOSITORY"
          )
          if [[ "$BLINQ_INPUT_MODE" == "dry-run" ]]; then ARGS+=(--dry-run); fi
          if [[ "$BLINQ_INPUT_STATIC_ONLY" == "true" ]]; then ARGS+=(--static-only); fi
          if [[ "$BLINQ_INPUT_FORCE" == "true" ]]; then
            ARGS+=(--force)
          elif [[ "$BLINQ_INPUT_STATIC_ONLY" == "true" ]]; then
            ARGS+=(--complete-static)
            if [[ "$BLINQ_INPUT_RETRY_UNRESOLVED" == "true" ]]; then ARGS+=(--retry-unresolved); fi
          elif [[ "$BLINQ_INPUT_RETRY_UNRESOLVED" == "true" ]]; then
            ARGS+=(--retry-unresolved)
          fi
          python scripts/enrich_environment_snapshot.py "${ARGS[@]}"
      - id: pass1-summary
        name: Capture pass 1 request usage
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          requests_used="$(python -c 'import json; print(int(json.load(open(".cache/tbt/history/environment_enrichment_report.json", encoding="utf-8")).get("open_meteo_requests", 0)))')"
          echo "requests_used=$requests_used" >> "$GITHUB_OUTPUT"
          echo "Pass 1 used $requests_used Open-Meteo/geocoder requests."
      - name: Upload environment run report - pass 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-environment-enrichment-pass1-${{ github.run_id }}
          path: .cache/tbt/history/environment_enrichment_report.json
          if-no-files-found: warn

  enrich-environment-2:
    needs: [plan-window, enrich-environment-1]
    if: ${{ needs.enrich-environment-1.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: api
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_WEATHER_RESEARCH: ${{ vars.TBT_WEATHER_RESEARCH }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install dependencies and syntax-check
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
          PYTHONPATH=api python -m unittest discover -s scripts/tests -p "test_environment_location_candidates.py"
      - name: Enrich GitHub history - continuation
        shell: bash
        env:
          BLINQ_INPUT_START: ${{ inputs.start }}
          BLINQ_INPUT_END: ${{ inputs.end }}
          BLINQ_INPUT_LIMIT: ${{ inputs.limit }}
          BLINQ_INPUT_MAX_REQUESTS: ${{ inputs.max_requests }}
          BLINQ_INPUT_MODE: ${{ inputs.mode }}
          BLINQ_INPUT_STATIC_ONLY: ${{ inputs.static_only }}
          BLINQ_INPUT_FORCE: ${{ inputs.force }}
          BLINQ_INPUT_RETRY_UNRESOLVED: ${{ inputs.retry_unresolved }}
          BLINQ_STOP_AT: ${{ needs.plan-window.outputs.stop_at }}
          BLINQ_REQUESTS_USED: ${{ needs.enrich-environment-1.outputs.requests_used || '0' }}
        run: |
          set -euo pipefail
          REMAINING_REQUESTS=$((BLINQ_INPUT_MAX_REQUESTS - BLINQ_REQUESTS_USED))
          if (( REMAINING_REQUESTS <= 0 )); then
            echo "Open-Meteo/geocoder request budget already exhausted by pass 1; nothing to continue."
            exit 0
          fi
          END_VALUE="$BLINQ_INPUT_END"
          if [[ -z "$END_VALUE" ]]; then END_VALUE="$(date -u +%F)"; fi
          ARGS=(
            --start "$BLINQ_INPUT_START"
            --end "$END_VALUE"
            --limit "$BLINQ_INPUT_LIMIT"
            --max-requests "$REMAINING_REQUESTS"
            --max-runtime-minutes "325"
            --stop-at "$BLINQ_STOP_AT"
            --data-repository "$TBT_DATA_REPOSITORY"
          )
          if [[ "$BLINQ_INPUT_MODE" == "dry-run" ]]; then ARGS+=(--dry-run); fi
          if [[ "$BLINQ_INPUT_STATIC_ONLY" == "true" ]]; then ARGS+=(--static-only); fi
          if [[ "$BLINQ_INPUT_FORCE" == "true" ]]; then
            ARGS+=(--force)
          elif [[ "$BLINQ_INPUT_STATIC_ONLY" == "true" ]]; then
            ARGS+=(--complete-static)
            if [[ "$BLINQ_INPUT_RETRY_UNRESOLVED" == "true" ]]; then ARGS+=(--retry-unresolved); fi
          elif [[ "$BLINQ_INPUT_RETRY_UNRESOLVED" == "true" ]]; then
            ARGS+=(--retry-unresolved)
          fi
          python scripts/enrich_environment_snapshot.py "${ARGS[@]}"
      - name: Upload environment run report - pass 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-environment-enrichment-pass2-${{ github.run_id }}
          path: .cache/tbt/history/environment_enrichment_report.json
          if-no-files-found: warn
