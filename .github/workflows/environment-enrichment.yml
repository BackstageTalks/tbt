name: Environment enrichment

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date/time UTC (e.g. 2026-08-25)"
        required: true
        default: "2026-08-25"
        type: string
      end:
        description: "Exclusive end date/time UTC (e.g. 2026-09-03)"
        required: true
        default: "2026-09-03"
        type: string
      limit:
        description: "Maximum matches to inspect (0 = all)"
        required: true
        default: "20"
        type: string
      mode:
        description: "Run mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - write
      force:
        description: "Re-enrich already resolved matches"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  enrich-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt

      - name: Syntax check
        run: |
          python -m compileall -q api scripts

      - name: Run environment enrichment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          ARGS=(
            --start "${{ inputs.start }}"
            --end "${{ inputs.end }}"
            --limit "${{ inputs.limit }}"
          )

          if [[ "${{ inputs.mode }}" == "dry-run" ]]; then
            ARGS+=(--dry-run)
          fi

          if [[ "${{ inputs.force }}" == "true" ]]; then
            ARGS+=(--force)
          fi

          python scripts/enrich_environment.py "${ARGS[@]}"
