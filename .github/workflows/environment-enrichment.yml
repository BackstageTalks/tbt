name: Environment enrichment

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start UTC/date (inclusive)"
        required: true
        default: "2024-01-01"
        type: string
      end:
        description: "End UTC/date (exclusive)"
        required: true
        default: "2024-01-08"
        type: string
      max_requests:
        description: "Maximum Open-Meteo requests for this run (1-500)"
        required: true
        default: "100"
        type: string
      limit:
        description: "Maximum matches to inspect (0 = all in range)"
        required: true
        default: "200"
        type: string
      mode:
        description: "Dry-run does not publish parquet changes"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, write]
      force:
        description: "Re-enrich rows that already have a resolved venue"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  enrich-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      PYTHONPATH: api
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_WEATHER_RESEARCH: ${{ vars.TBT_WEATHER_RESEARCH }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies and syntax-check
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m compileall -q api scripts

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Missing TBT_DATA_GH_TOKEN'; exit 1; }
          test "$TBT_WEATHER_RESEARCH" = "true" || { echo 'TBT_WEATHER_RESEARCH must be true'; exit 1; }
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo 'Refusing non-private data repository'; exit 1; }

      - name: Enrich GitHub history
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --start "${{ inputs.start }}"
            --end "${{ inputs.end }}"
            --max-requests "${{ inputs.max_requests }}"
            --limit "${{ inputs.limit }}"
            --data-repository "$TBT_DATA_REPOSITORY"
          )
          if [[ "${{ inputs.mode }}" == "dry-run" ]]; then ARGS+=(--dry-run); fi
          if [[ "${{ inputs.force }}" == "true" ]]; then ARGS+=(--force); fi
          python scripts/enrich_environment_snapshot.py "${ARGS[@]}"
