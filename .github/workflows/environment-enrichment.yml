name: Environment enrichment

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start UTC (outside rolling hot buffer -> GH; recent -> Supabase)"
        required: true
        default: "2026-08-25"
        type: string
      end:
        description: "Exclusive end UTC"
        required: true
        default: "2026-09-03"
        type: string
      limit:
        description: "Maximum matches to inspect (0 = all)"
        required: true
        default: "20"
        type: string
      mode:
        description: "Run mode"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, write]
      force:
        description: "Re-enrich already resolved matches"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  enrich-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api
      TBT_HISTORY_DIR: .cache/tbt/history
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve storage target
        id: route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          def parse(value: str) -> datetime:
              if len(value.strip()) == 10:
                  value = value.strip() + "T00:00:00+00:00"
              dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)
          start = parse("${{ inputs.start }}")
          end = parse("${{ inputs.end }}")
          from datetime import timedelta
          boundary = datetime.now(timezone.utc) - timedelta(days=60)
          if end <= start:
              raise SystemExit("end must be later than start")
          if start < boundary < end:
              raise SystemExit(f"Split the run at rolling hot cutoff {boundary.isoformat()}")
          print("target=github" if end <= boundary else "target=supabase")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          python -m compileall -q api scripts

      - name: Preflight private data repository
        if: steps.route.outputs.target == 'github'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TBT_DATA_REPOSITORY" || exit 1
          test -n "$TBT_DATA_GH_TOKEN" || exit 1
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing non-private repo"; exit 1; }

      - name: Download partitioned history
        if: steps.route.outputs.target == 'github'
        shell: bash
        run: bash scripts/download_history_release.sh .cache/tbt

      - name: Enrich historical GitHub partitions
        if: steps.route.outputs.target == 'github'
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --start "${{ inputs.start }}"
            --end "${{ inputs.end }}"
            --limit "${{ inputs.limit }}"
            --history-dir "$TBT_HISTORY_DIR"
            --legacy-snapshot .cache/tbt/training_snapshot.parquet
          )
          if [[ "${{ inputs.mode }}" == "dry-run" ]]; then ARGS+=(--dry-run); fi
          if [[ "${{ inputs.force }}" == "true" ]]; then ARGS+=(--force); fi
          python scripts/enrich_environment_snapshot.py "${ARGS[@]}"

      - name: Publish changed historical partitions
        if: steps.route.outputs.target == 'github' && inputs.mode == 'write'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TBT_HISTORY_RELEASE_TAG" \
            "$TBT_HISTORY_DIR"/history-*.parquet \
            "$TBT_HISTORY_DIR"/history_manifest.json \
            --repo "$TBT_DATA_REPOSITORY" \
            --clobber

      - name: Enrich lean Supabase hot tier
        if: steps.route.outputs.target == 'supabase'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--start "${{ inputs.start }}" --end "${{ inputs.end }}" --limit "${{ inputs.limit }}")
          if [[ "${{ inputs.mode }}" == "dry-run" ]]; then ARGS+=(--dry-run); fi
          if [[ "${{ inputs.force }}" == "true" ]]; then ARGS+=(--force); fi
          python scripts/enrich_environment.py "${ARGS[@]}"
