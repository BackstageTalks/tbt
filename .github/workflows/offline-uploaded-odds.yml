name: BlinQ uploaded historical odds import

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run first; write publishes only identity-verified linked historical odds"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, write]
      source_ref:
        description: "Private tbt-data ref containing staged source parts"
        required: true
        default: "source/wta-historical-odds-cedbf748"
        type: string
  pull_request:
    paths:
      - ".github/uploaded-historical-odds-request.json"
      - ".github/workflows/offline-uploaded-odds.yml"
      - "api/tbt/data/offline_odds.py"
      - "api/tbt/data/provider_context.py"
      - "scripts/link_offline_match_winner_odds.py"
      - "scripts/import_offline_linked_match_winner_odds.py"
      - "tests/test_offline_match_winner_odds.py"
  push:
    branches: [main]
    paths:
      - ".github/uploaded-historical-odds-request.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tbt-offline-odds-dry-run-{0}', github.ref) || 'tbt-history-data-writer' }}
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: api:scripts
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || 'BackstageTalks/tbt-data' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve controlled request
        id: request
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          request=".github/uploaded-historical-odds-request.json"
          test -s "$request" || { echo "Missing controlled odds request"; exit 1; }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${DISPATCH_MODE:-dry-run}"
            source_ref="${DISPATCH_SOURCE_REF:-$(jq -r '.source_ref' "$request")}"
          else
            mode="$(jq -r '.mode // "dry-run"' "$request")"
            source_ref="$(jq -r '.source_ref // empty' "$request")"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              mode="dry-run"
            fi
          fi

          case "$mode" in dry-run|write) ;; *) echo "Invalid mode: $mode"; exit 1;; esac
          if [[ "$mode" == "write" && "$GITHUB_EVENT_NAME" != "push" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Write mode is forbidden outside main push/manual dispatch"
            exit 1
          fi

          source_prefix="$(jq -r '.source_prefix // empty' "$request")"
          expected_sha="$(jq -r '.expected_sha256 // empty' "$request")"
          expected_file_lines="$(jq -r '.expected_file_lines // 0' "$request")"
          expected_source_rows="$(jq -r '.expected_source_rows // 0' "$request")"
          source_tour="$(jq -r '.tour // empty' "$request")"
          source_label="$(jq -r '.source_label // empty' "$request")"

          [[ "$source_ref" == "main" ]] || { echo "Uploaded bundle must come from private tbt-data main"; exit 1; }
          [[ "$source_prefix" == research/offline-sources/blinq-import-2026-10-06 ]] || { echo "Unexpected source prefix"; exit 1; }
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid expected sha256"; exit 1; }
          [[ "$expected_file_lines" -gt 1 ]] || { echo "Invalid expected_file_lines"; exit 1; }
          [[ "$expected_source_rows" -gt 0 ]] || { echo "Invalid expected_source_rows"; exit 1; }
          [[ "$source_tour" == "wta" || "$source_tour" == "atp" ]] || { echo "Invalid source tour"; exit 1; }
          [[ -n "$source_label" ]] || { echo "Missing source label"; exit 1; }

          {
            echo "ODDS_MODE=$mode"
            echo "SOURCE_REF=$source_ref"
            echo "SOURCE_PREFIX=$source_prefix"
            echo "EXPECTED_SHA256=$expected_sha"
            echo "EXPECTED_FILE_LINES=$expected_file_lines"
            echo "EXPECTED_SOURCE_ROWS=$expected_source_rows"
            echo "SOURCE_TOUR=$source_tour"
            echo "SOURCE_LABEL=$source_label"
          } >> "$GITHUB_ENV"
          echo "Resolved offline odds request: event=$GITHUB_EVENT_NAME mode=$mode ref=$source_ref"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies and focused tests
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements-train.txt
          python -m unittest discover -s tests -p 'test_offline_match_winner_odds.py'

      - name: Reassemble, convert and verify uploaded source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }
          source_dir=".cache/tbt/offline-odds/source"
          mkdir -p "$source_dir"
          raw_file="$source_dir/raw.csv"
          b64_file="$source_dir/raw.csv.xz.b64"
          : > "$b64_file"
          for part in 00 01 02 03 04; do
            gh api               -H "Accept: application/vnd.github.raw+json"               "repos/$TBT_DATA_REPOSITORY/contents/$SOURCE_PREFIX/${SOURCE_TOUR}_odds_2013_2026.csv.xz.b64.part$part?ref=$SOURCE_REF"               >> "$b64_file"
          done
          base64 -d "$b64_file" > "$source_dir/raw.csv.xz"
          xz -dc "$source_dir/raw.csv.xz" > "$raw_file"

          actual_sha="$(sha256sum "$raw_file" | awk '{print $1}')"
          actual_lines="$(wc -l < "$raw_file" | tr -d ' ')"
          echo "raw_source_sha256=$actual_sha"
          echo "raw_source_lines=$actual_lines"
          [[ "$actual_sha" == "$EXPECTED_SHA256" ]] || {
            echo "Raw source SHA mismatch: expected=$EXPECTED_SHA256 actual=$actual_sha"
            exit 1
          }
          [[ "$actual_lines" == "$EXPECTED_FILE_LINES" ]] || {
            echo "Raw source line mismatch: expected=$EXPECTED_FILE_LINES actual=$actual_lines"
            exit 1
          }

          RAW_FILE="$raw_file" python - <<'PY'
          import csv, math, os
          from pathlib import Path

          src = Path(os.environ["RAW_FILE"])
          dst = src.parent / "wta.txt"
          preferred = (("AvgW","AvgL"),("PSW","PSL"),("B365W","B365L"),("BFEW","BFEL"))
          written = 0
          with src.open("r", encoding="utf-8-sig", newline="") as inp, dst.open("w", encoding="utf-8", newline="") as out:
              reader = csv.DictReader(inp)
              fieldnames = ["Tournament","Date","Surface","Round","Best of","Player_1","Player_2","Winner","Rank_1","Rank_2","Odd_1","Odd_2"]
              writer = csv.DictWriter(out, fieldnames=fieldnames)
              writer.writeheader()
              for row in reader:
                  odds = None
                  for wk, lk in preferred:
                      try:
                          w, l = float(row.get(wk) or ""), float(row.get(lk) or "")
                      except (TypeError, ValueError):
                          continue
                      if math.isfinite(w) and math.isfinite(l) and w > 1 and l > 1:
                          odds = (w, l)
                          break
                  if odds is None:
                      continue
                  writer.writerow({
                      "Tournament": row.get("Tournament") or "",
                      "Date": row.get("Date") or "",
                      "Surface": row.get("Surface") or "",
                      "Round": row.get("Round") or "",
                      "Best of": row.get("Best of") or "",
                      "Player_1": row.get("Winner") or "",
                      "Player_2": row.get("Loser") or "",
                      "Winner": row.get("Winner") or "",
                      "Rank_1": row.get("WRank") or "",
                      "Rank_2": row.get("LRank") or "",
                      "Odd_1": odds[0],
                      "Odd_2": odds[1],
                  })
                  written += 1
          expected = int(os.environ["EXPECTED_SOURCE_ROWS"])
          if written != expected:
              raise SystemExit(f"Converted source rows mismatch: {written} != {expected}")
          print(f"Converted safe two-way market rows: {written}")
          PY

      - name: Download checksum-verified private history
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore

          directory = Path(".cache/tbt/offline-odds/history")
          store = ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", directory)
          store.download(require_bundle_manifest=True)
          PY

      - name: Link historical odds to canonical identities
        run: |
          set -euo pipefail
          python scripts/link_offline_match_winner_odds.py             --history-dir .cache/tbt/offline-odds/history             --source-csv .cache/tbt/offline-odds/source/wta.txt             --tour "$SOURCE_TOUR"             --source-label "$SOURCE_LABEL"             --out-dir .cache/tbt/offline-odds/link

      - name: Validate linker report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          r = json.loads(Path(".cache/tbt/offline-odds/link/report.json").read_text())
          c = r.get("counts") or {}
          expected = int(os.environ["EXPECTED_SOURCE_ROWS"])
          summary = {
              "canonical_rows": r.get("canonical_rows"),
              "source_rows": r.get("source_rows"),
              "usable_source_rows": r.get("usable_source_rows"),
              "identity_linked": c.get("identity_linked", 0),
              "staged_matches": c.get("staged_matches", 0),
              "already_present": c.get("already_present", 0),
              "unmatched": c.get("unmatched", 0),
              "weak_evidence": c.get("weak_evidence", 0),
              "ambiguous": c.get("ambiguous", 0),
              "market_conflicts": c.get("market_conflicts", 0),
              "invalid_source_rows": c.get("invalid_source_rows", 0),
              "api_requests": r.get("api_requests"),
          }
          print("Offline odds linker:", json.dumps(summary, ensure_ascii=False))
          if int(r.get("source_rows") or 0) != expected:
              raise SystemExit(f"Unexpected source row count: {r.get('source_rows')} != {expected}")
          if int(r.get("api_requests", -1)) != 0:
              raise SystemExit("Offline odds linker unexpectedly used provider API")
          if int(c.get("market_conflicts") or 0):
              raise SystemExit(f"Existing historical market conflicts detected: {c.get('market_conflicts')}")
          if int(c.get("staged_matches") or 0) <= 0 and int(c.get("already_present") or 0) <= 0:
              raise SystemExit("No safe linked historical odds rows available")
          PY

      - name: Dry-run strict historical odds importer
        run: |
          set -euo pipefail
          stage=.cache/tbt/offline-odds/link/auto_linked.jsonl
          if [[ -s "$stage" ]]; then
            python scripts/import_offline_linked_match_winner_odds.py               --stage "$stage"               --history-dir .cache/tbt/offline-odds/history               --out-dir .cache/tbt/offline-odds/dry-run
          else
            mkdir -p .cache/tbt/offline-odds/dry-run
            python - <<'PY'
          import json
          from pathlib import Path
          link=json.loads(Path(".cache/tbt/offline-odds/link/report.json").read_text())
          lc=link.get("counts") or {}
          report={
              "schema":1,
              "stage_rows":0,
              "counts":{"already_present":int(lc.get("already_present") or 0)},
              "changed_years":[],
              "production_mutated":False,
              "local_partitions_written":False,
              "api_requests":0,
              "note":"Verified no-op: linker found no new historical odds rows.",
          }
          Path(".cache/tbt/offline-odds/dry-run/report.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          PY
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path(".cache/tbt/offline-odds/dry-run/report.json").read_text())
          c = r.get("counts") or {}
          print("Historical odds importer dry-run:", json.dumps(r, ensure_ascii=False))
          for key in ("identity_missing", "identity_changed", "invalid_market", "market_conflicts"):
              if int(c.get(key) or 0):
                  raise SystemExit(f"Strict odds importer rejected rows: {key}={c.get(key)}")
          if int(c.get("updated") or 0) <= 0 and int(c.get("already_present") or 0) <= 0:
              raise SystemExit("No verified historical odds enrichment rows")
          PY

      - name: Write verified odds into local private history
        if: env.ODDS_MODE == 'write'
        run: |
          set -euo pipefail
          stage=.cache/tbt/offline-odds/link/auto_linked.jsonl
          if [[ -s "$stage" ]]; then
            python scripts/import_offline_linked_match_winner_odds.py               --stage "$stage"               --history-dir .cache/tbt/offline-odds/history               --out-dir .cache/tbt/offline-odds/write               --write-partitions               --write-history-dir .cache/tbt/offline-odds/history
          else
            mkdir -p .cache/tbt/offline-odds/write
            cp .cache/tbt/offline-odds/dry-run/report.json .cache/tbt/offline-odds/write/report.json
          fi

      - name: Validate and publish changed private history bundle
        if: env.ODDS_MODE == 'write'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from release_store import ReleaseStore
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities

          directory = Path(".cache/tbt/offline-odds/history")
          report = json.loads(Path(".cache/tbt/offline-odds/write/report.json").read_text())
          counts = report.get("counts") or {}
          for key in ("identity_missing", "identity_changed", "invalid_market", "market_conflicts"):
              if int(counts.get(key) or 0):
                  raise SystemExit(f"Write rejected rows: {key}={counts.get(key)}")

          years = [int(year) for year in report.get("changed_years") or []]
          if not years:
              print("No changed partitions; nothing to publish.")
              raise SystemExit(0)

          matches, safety = sanitize_history_identities(load_partitions(directory))
          if safety.get("quarantined_rows"):
              raise SystemExit("Identity safety failed after historical odds import")

          market_rows = sum(
              1
              for match in matches
              if isinstance((match.provider_payload or {}).get("_tbt_match_winner_odds"), dict)
          )
          if market_rows <= 0:
              raise SystemExit("No persisted historical odds markers after local write")

          paths = [directory / f"history-{year:04d}.parquet" for year in years]
          paths.append(directory / "history_manifest.json")
          if any(not path.is_file() or path.stat().st_size <= 0 for path in paths):
              raise SystemExit("Changed history bundle is incomplete")

          store = ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", directory)
          store.upload_bundle(paths)
          print(f"Published historical odds for years={years}; market_rows={market_rows}")
          PY

      - name: Verify committed private release
        if: env.ODDS_MODE == 'write'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from release_store import ReleaseStore
          from tbt.data.history_snapshot import load_partitions
          from tbt.data.history_safety import sanitize_history_identities

          directory = Path(".cache/tbt/offline-odds/verify")
          store = ReleaseStore(os.environ["TBT_DATA_REPOSITORY"], "tbt-data-v1", directory)
          store.download(require_bundle_manifest=True)
          matches, safety = sanitize_history_identities(load_partitions(directory))
          if safety.get("quarantined_rows"):
              raise SystemExit("Committed history identity validation failed")
          market_rows = sum(
              1
              for match in matches
              if isinstance((match.provider_payload or {}).get("_tbt_match_winner_odds"), dict)
          )
          if market_rows <= 0:
              raise SystemExit("Committed release contains no historical odds markers")
          print(f"Committed private history verified: rows={len(matches)} historical_odds_rows={market_rows}")
          PY

      - name: Persist latest historical odds audit
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def read_json(path):
              p = Path(path)
              if not p.is_file():
                  return None
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  return {"read_error": str(exc)}

          audit = {
              "schema": 1,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "job_status": os.environ.get("JOB_STATUS"),
              "mode": os.environ.get("ODDS_MODE"),
              "run_id": os.environ.get("RUN_ID"),
              "run_sha": os.environ.get("RUN_SHA"),
              "source_ref": os.environ.get("SOURCE_REF"),
              "source_sha256": os.environ.get("EXPECTED_SHA256"),
              "source_tour": os.environ.get("SOURCE_TOUR"),
              "source_label": os.environ.get("SOURCE_LABEL"),
              "api_requests": 0,
              "link_report": read_json(".cache/tbt/offline-odds/link/report.json"),
              "dry_run_report": read_json(".cache/tbt/offline-odds/dry-run/report.json"),
              "write_report": read_json(".cache/tbt/offline-odds/write/report.json"),
          }
          Path("/tmp/offline-historical-odds-audit.json").write_text(
              json.dumps(audit, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

          path="audit/offline-historical-odds-latest.json"
          existing_sha="$(gh api "repos/$TBT_DATA_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 /tmp/offline-historical-odds-audit.json)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit offline historical odds run $RUN_ID"               -f content="$encoded"               -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$TBT_DATA_REPOSITORY/contents/$path"               -f message="Audit offline historical odds run $RUN_ID"               -f content="$encoded" >/dev/null
          fi

      - name: Upload historical odds evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinq-offline-historical-odds-${{ github.run_id }}
          path: |
            .cache/tbt/offline-odds/link/report.json
            .cache/tbt/offline-odds/link/review.jsonl
            .cache/tbt/offline-odds/link/quarantine.jsonl
            .cache/tbt/offline-odds/dry-run/report.json
            .cache/tbt/offline-odds/dry-run/review.jsonl
            .cache/tbt/offline-odds/write/report.json
            .cache/tbt/offline-odds/write/review.jsonl
          if-no-files-found: warn
          retention-days: 14
