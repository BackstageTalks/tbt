name: Historical coverage report

on:
  workflow_dispatch:

jobs:
  historical-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt

      - name: Compile
        run: |
          python -m compileall -q api scripts

      - name: Generate historical coverage report
        env:
          PYTHONPATH: api
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/historical_coverage_report.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: historical-coverage-report
          path: reports/historical_coverage.json
          if-no-files-found: error
