name: V20.6 · Sync hot tier to private GitHub Release

on:
  workflow_dispatch:
    inputs:
      hot_full_refresh:
        description: "Emergency full refresh of Supabase HOT tier only (2025+)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '11 3 * * *'

permissions:
  contents: read

concurrency:
  group: tbt-history-release-v1
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api
      TBT_HISTORY_DIR: .cache/tbt/history
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight private data repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TBT_DATA_REPOSITORY" || { echo "Missing TBT_DATA_REPOSITORY"; exit 1; }
          test -n "$TBT_DATA_GH_TOKEN" || { echo "Missing TBT_DATA_GH_TOKEN"; exit 1; }
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing non-private data repo: $visibility"; exit 1; }
          echo "Policy: GitHub year partitions = training history; Supabase = lean 2025+ hot tier only."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          python -m compileall -q api scripts

      - name: Download or migrate partitioned history
        shell: bash
        run: bash scripts/download_history_release.sh .cache/tbt

      - name: Merge Supabase hot-tier changes only
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "${{ inputs.hot_full_refresh || false }}" == "true" ]]; then EXTRA+=(--hot-full-refresh); fi
          python scripts/history_release.py \
            --history-dir "$TBT_HISTORY_DIR" \
            --legacy-snapshot .cache/tbt/training_snapshot.parquet \
            --overlap-minutes 1440 \
            "${EXTRA[@]}"
          ls -lh "$TBT_HISTORY_DIR"/

      - name: Publish partition assets and manifest
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TBT_HISTORY_RELEASE_TAG" \
            "$TBT_HISTORY_DIR"/history-*.parquet \
            "$TBT_HISTORY_DIR"/history_manifest.json \
            --repo "$TBT_DATA_REPOSITORY" \
            --clobber
