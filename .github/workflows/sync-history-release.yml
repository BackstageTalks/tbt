name: V20.4 · Sync hot tier to private GitHub Release

on:
  workflow_dispatch:
    inputs:
      hot_full_refresh:
        description: "Emergency full refresh of Supabase HOT tier only (2025+)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '11 3 * * *'

permissions:
  contents: read

concurrency:
  group: tbt-history-release-v1
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight private data repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TBT_DATA_REPOSITORY" || { echo "Missing repository variable TBT_DATA_REPOSITORY"; exit 1; }
          test -n "$TBT_DATA_GH_TOKEN" || { echo "Missing secret TBT_DATA_GH_TOKEN"; exit 1; }
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing to store TBT history in non-private repo: $visibility"; exit 1; }
          echo "V20.4 policy: Supabase hot tier = 2025+, GitHub cold tier = <2025."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install snapshot dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt

      - name: Download authoritative private snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt
          gh release view "$TBT_HISTORY_RELEASE_TAG" --repo "$TBT_DATA_REPOSITORY" >/dev/null 2>&1 || {
            echo "V20.4 safety stop: history release is missing."
            echo "Cold history is no longer reconstructable from Supabase by this workflow."
            exit 1
          }
          gh release download "$TBT_HISTORY_RELEASE_TAG" \
            --repo "$TBT_DATA_REPOSITORY" \
            --pattern 'training_snapshot.parquet' \
            --pattern 'training_snapshot.meta.json' \
            --dir .cache/tbt \
            --clobber

      - name: Merge Supabase hot-tier changes only
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "${{ inputs.hot_full_refresh || false }}" == "true" ]]; then EXTRA+=(--hot-full-refresh); fi
          python scripts/history_release.py \
            --snapshot .cache/tbt/training_snapshot.parquet \
            --meta .cache/tbt/training_snapshot.meta.json \
            "${EXTRA[@]}"
          ls -lh .cache/tbt/training_snapshot.*

      - name: Publish snapshot assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TBT_HISTORY_RELEASE_TAG" \
            .cache/tbt/training_snapshot.parquet \
            .cache/tbt/training_snapshot.meta.json \
            --repo "$TBT_DATA_REPOSITORY" \
            --clobber
