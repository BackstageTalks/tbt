name: V20 · Sync history snapshot to GitHub Release

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Force full Supabase bootstrap (use only when necessary)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '11 3 * * *'

permissions:
  contents: write

concurrency:
  group: tbt-history-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api
      TBT_ALLOW_SUPABASE_FULL_HISTORY: '1'
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY || github.repository }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN || github.token }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt

      - name: Install snapshot dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt

      - name: Download previous normalized snapshot if present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tbt
          gh release download tbt-data \
            --repo "$TBT_DATA_REPOSITORY" \
            --pattern 'training_snapshot.parquet' \
            --pattern 'training_snapshot.meta.json' \
            --dir .cache/tbt \
            --clobber || true

      - name: Build incremental snapshot
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [[ "${{ inputs.full || false }}" == "true" ]]; then EXTRA="--full"; fi
          python scripts/history_release.py \
            --snapshot .cache/tbt/training_snapshot.parquet \
            --meta .cache/tbt/training_snapshot.meta.json \
            $EXTRA
          ls -lh .cache/tbt/training_snapshot.*

      - name: Create data release if missing
        shell: bash
        run: |
          set -euo pipefail
          gh release view tbt-data --repo "$TBT_DATA_REPOSITORY" >/dev/null 2>&1 || \
            gh release create tbt-data --repo "$TBT_DATA_REPOSITORY" --title 'TBT normalized training data' --notes 'Machine-managed normalized historical snapshot. Raw provider payload is excluded.'

      - name: Publish snapshot assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload tbt-data \
            .cache/tbt/training_snapshot.parquet \
            .cache/tbt/training_snapshot.meta.json \
            --repo "$TBT_DATA_REPOSITORY" \
            --clobber
