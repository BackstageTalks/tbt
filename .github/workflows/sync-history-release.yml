name: V20.7 · Archive rolling hot buffer to private GitHub Release

on:
  workflow_dispatch:
    inputs:
      hot_full_refresh:
        description: "Emergency refresh of the rolling Supabase HOT buffer only"
        required: false
        default: false
        type: boolean
      retention_days:
        description: "Rolling Supabase hot buffer in days"
        required: false
        default: "60"
        type: string
  schedule:
    - cron: '11 3 * * *'

permissions:
  contents: read

concurrency:
  group: tbt-history-data-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: api
      TBT_HISTORY_DIR: .cache/tbt/history
      TBT_DATA_REPOSITORY: ${{ vars.TBT_DATA_REPOSITORY }}
      TBT_DATA_GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      TBT_HISTORY_RELEASE_TAG: tbt-data-v1
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TBT_HOT_RETENTION_DAYS: ${{ inputs.retention_days || '60' }}

    steps:
      - uses: actions/checkout@v4
      - name: Preflight private data repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TBT_DATA_REPOSITORY"
          test -n "$TBT_DATA_GH_TOKEN"
          visibility="$(gh repo view "$TBT_DATA_REPOSITORY" --json visibility -q '.visibility')"
          test "$visibility" = "PRIVATE" || { echo "Refusing non-private data repo: $visibility"; exit 1; }
          echo "Policy: GitHub = complete history; Supabase = rolling ${TBT_HOT_RETENTION_DAYS}-day operational buffer."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r api/requirements-train.txt
          python -m compileall -q api scripts
      - name: Download partitioned history
        run: bash scripts/download_history_release.sh .cache/tbt
      - name: Merge rolling hot changes into GH history
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "${{ inputs.hot_full_refresh || false }}" == "true" ]]; then EXTRA+=(--hot-full-refresh); fi
          python scripts/history_release.py \
            --history-dir "$TBT_HISTORY_DIR" \
            --legacy-snapshot .cache/tbt/training_snapshot.parquet \
            --retention-days "$TBT_HOT_RETENTION_DAYS" \
            --overlap-minutes 1440 \
            "${EXTRA[@]}"
      - name: Publish history before any deletion
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TBT_HISTORY_RELEASE_TAG" \
            "$TBT_HISTORY_DIR"/history-*.parquet \
            "$TBT_HISTORY_DIR"/history_manifest.json \
            --repo "$TBT_DATA_REPOSITORY" \
            --clobber
      - name: Trim Supabase outside rolling hot buffer
        shell: bash
        run: |
          set -euo pipefail
          python scripts/trim_supabase_hot_buffer.py \
            --history-dir "$TBT_HISTORY_DIR" \
            --retention-days "$TBT_HOT_RETENTION_DAYS" \
            --execute \
            --confirmation "TRIM ROLLING HOT BUFFER"
