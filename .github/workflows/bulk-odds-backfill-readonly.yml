name: BlinQ daily bulk odds backfill (read-only research)

on:
  workflow_dispatch:
    inputs:
      start:
        description: First day YYYY-MM-DD
        required: true
      end:
        description: Last day YYYY-MM-DD
        required: true
      max_requests:
        description: Max paid requests (1 per day, <= 1200)
        required: true
        default: '400'

permissions:
  contents: read

concurrency:
  group: blinq-bulk-odds-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      BLINQ_SHARED_API_BUDGET_URL: ${{ vars.BLINQ_API_BUDGET_RESERVE_URL || 'https://agreeable-sky-011a7fe10.7.azurestaticapps.net/api/v1/internal/api-budget/reserve' }}
      BLINQ_SHARED_API_BUDGET_TOKEN: ${{ secrets.BLINQ_LIVE_WORKER_TOKEN }}
      BLINQ_SHARED_API_BUDGET_PURPOSE: history
      BLINQ_PROVIDER_REQUEST_RESERVE: '500'
      BLINQ_REQUIRE_PROVIDER_RATE_LIMIT_HEADER: 'true'
      BLINQ_RAPIDAPI_MAX_RPS: '3'
      PYTHONPATH: api:scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-train.txt
      - run: python -m pip install -r api/requirements-train.txt
      - name: Validate inputs
        env:
          MAX: ${{ inputs.max_requests }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          [[ "$START" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ && "$END" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$MAX" =~ ^[0-9]+$ ]] && (( 10#$MAX >= 1 && 10#$MAX <= 1200 ))
          test -n "$RAPIDAPI_KEY" && test -n "$BLINQ_SHARED_API_BUDGET_TOKEN"
      - name: Backfill (read-only, no CDB writes)
        env:
          MAX: ${{ inputs.max_requests }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python scripts/backfill_daily_bulk_odds.py --start "$START" --end "$END" --max-requests "$MAX" --out .cache/bulk-odds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-odds-${{ inputs.start }}-${{ inputs.end }}
          path: .cache/bulk-odds
          retention-days: 90
          if-no-files-found: warn
