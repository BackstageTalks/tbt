name: BlinQ final Charting CDB safe-import disposition

# One-time, read-only finalization: intentionally no canonical release writer.
# Revalidate against latest CDB after 2025 partition changed under a separate
# legitimate canonical writer. Both pre/post asset digests must stay identical.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blinq-charting-final-import-decision-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blinq-charting-cdb-final-noop
  cancel-in-progress: false

jobs:
  verified-final-decision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.TBT_DATA_GH_TOKEN }}
      PRIVATE_REPO: BackstageTalks/tbt-data
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BackstageTalks/tbt-data
          ref: main
          token: ${{ secrets.TBT_DATA_GH_TOKEN }}
          path: private-data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify private access, exact decision tests, source integrity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRIVATE_REPO" --jq .private)" = true
          python -m pip install --disable-pip-version-check --quiet pyarrow
          python -m unittest discover -s app/tests -p test_charting_cdb_final_decision.py -v
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path('private-data')
          report=json.loads((base/'audit/cross-source/CHARTING-SOURCE-PREFLIGHT-20261012.json').read_text())
          src=base/'tennis/charting/matches.json.gz'
          assert hashlib.sha256(src.read_bytes()).hexdigest()==report['source_sha256']
          assert report['counts']['input_rows']==11822
          print('SOURCE_BYTES_VERIFIED',report['source_sha256'])
          PY
      - name: Download and checksum-check source witness and researched gaps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/witness work/research work/current work/out work/readback
          gh release download blinq-charting-single-event-witness-38306001594-1 \
            -R "$PRIVATE_REPO" -D work/witness -p candidate.json -p SHA256SUMS
          (cd work/witness && sha256sum --check --ignore-missing SHA256SUMS)
          gh release download blinq-charting-context-recovery-38305377606-1 \
            -R "$PRIVATE_REPO" -D work/research \
            -p field_gap_report.json -p field_gap_research_only.jsonl.gz -p SHA256SUMS
          (cd work/research && sha256sum --check --ignore-missing SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('work/witness/candidate.json').read_text())
          b=json.loads(Path('work/research/field_gap_report.json').read_text())
          assert a['cdb_writes']==0 and a['event_identity_proven'] is False
          assert b['counts']['missing_candidate_cells_not_approved']==13
          print('RESEARCH_INPUT_PINNED_WITNESS')
          PY
      - name: Independently verify current canonical 2025 partition by SHA-256
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" > work/current/release-before.json
          gh release download tbt-data-v1 -R "$PRIVATE_REPO" -D work/current \
            -p history-2025.parquet -p history_manifest.json -p _tbt_bundle_manifest.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('work/current')
          first=json.loads((root/'release-before.json').read_text())
          assets=[x for x in first['assets'] if x['name']=='history-2025.parquet']
          assert len(assets)==1
          year=json.loads((root/'history_manifest.json').read_text())['years']['2025']
          bundle=json.loads((root/'_tbt_bundle_manifest.json').read_text())['files']['history-2025.parquet']
          digest=hashlib.sha256((root/'history-2025.parquet').read_bytes()).hexdigest()
          assert digest==year['sha256']==bundle['sha256']
          assert assets[0]['digest']=='sha256:'+digest
          (root/'year-sha.txt').write_text(digest)
          print('CURRENT_YEAR_SHA256_VERIFIED',digest)
          PY
      - name: Final numeric counter-witness and NULL-only no-write verdict
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/charting_cdb_final_decision.py \
            --witness work/witness/candidate.json \
            --report work/research/field_gap_report.json \
            --observations work/research/field_gap_research_only.jsonl.gz \
            --partition work/current/history-2025.parquet \
            --sha256 "$(cat work/current/year-sha.txt)" \
            --out work/out/final_decision.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('work/out/final_decision.json').read_text())
          assert r['result']=='NO_SAFE_CANONICAL_ADDITIONS_FROM_CHARTING'
          assert r['unapproved_candidate_cells']==13
          assert r['cells_authorized']==r['cells_written']==0
          assert r['canonical_assets_modified'] is False
          assert r['independent_conflicts'] and any(x['field']=='p1_aces' for x in r['independent_conflicts'])
          summary=[
            'FINAL CDB IMPORT VERDICT: 0 approved Charting NULL cells; 0 canonical writes.',
            'Original 11822 Charting matches: 1153 strict + 3905 context research candidates.',
            'Only 13 formerly missing basic cells in one event; independent whole-match'
            ' statistics disagree with the charted subset (57 versus 68 serve points).',
            'Source event/provider identity is not independently established.',
            'All 13 candidate cells remain quarantined; raw research data retained.',
            'Canonical 2025 SHA256: '+r['canonical_partition_2025_sha256'],
            'No model training, no source deletion, no release asset overwrite.',
          ]
          Path('work/out/summary.md').write_text('\n'.join(summary)+'\n')
          print('\n'.join(summary))
          PY
      - name: Recheck live asset SHA; publish immutable PRIVATE final report/readback
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$PRIVATE_REPO/releases/tags/tbt-data-v1" > work/current/release-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('work/current')
          assets=[]
          for filename in ('release-before.json','release-after.json'):
            rel=json.loads((base/filename).read_text())
            selected={x['name']:x['digest'] for x in rel['assets']
                      if x['name'] in {'history-2025.parquet','history_manifest.json','_tbt_bundle_manifest.json'}}
            assert len(selected)==3
            assets.append(selected)
          assert assets[0]==assets[1],'Concurrent canonical publication: final audit must be rerun'
          PY
          (cd work/out && sha256sum final_decision.json summary.md > SHA256SUMS && sha256sum -c SHA256SUMS)
          tag="blinq-charting-cdb-final-decision-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            work/out/final_decision.json work/out/summary.md work/out/SHA256SUMS \
            -R "$PRIVATE_REPO" --title "BlinQ final Charting CDB import no-write receipt" \
            --notes-file work/out/summary.md
          gh release download "$tag" -R "$PRIVATE_REPO" -D work/readback
          (cd work/readback && sha256sum -c SHA256SUMS)
          cmp work/out/final_decision.json work/readback/final_decision.json
          echo "FINAL_PRIVATE_READBACK_VERIFIED=$tag"
