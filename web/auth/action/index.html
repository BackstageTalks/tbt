<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>BlinQ · Account action</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf6f1;background:#03110e}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(2,13,11,.78),rgba(2,13,11,.88)),url('/assets/blinq_page_background.webp') center/cover fixed no-repeat}
    main{width:min(560px,100%);padding:30px;border:1px solid rgba(72,218,159,.24);border-radius:20px;background:rgba(4,24,19,.93);box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.025);backdrop-filter:blur(12px)}
    .logo{display:block;width:150px;height:auto;margin:0 0 24px}small{display:block;color:#4be5a2;font-size:11px;font-weight:900;letter-spacing:.15em}h1{margin:7px 0 10px;font-size:28px;line-height:1.16}p{margin:0;color:#9bb4aa;font-size:14px;line-height:1.65}.en{margin-top:14px;padding-top:14px;border-top:1px solid rgba(84,151,128,.16);color:#78938a}.status{margin:20px 0 0;padding:12px 14px;border:1px solid rgba(77,202,155,.18);border-radius:11px;background:rgba(43,156,116,.07);color:#b7cec5;font-size:13px;line-height:1.5}.status.error{border-color:rgba(231,111,93,.25);background:rgba(146,42,31,.08);color:#e8aaa0}form{display:grid;gap:11px;margin-top:20px}label{display:grid;gap:6px;color:#8fa9a0;font-size:12px;font-weight:700}input{height:44px;padding:0 13px;border:1px solid rgba(77,151,126,.25);border-radius:10px;background:#061914;color:#edf8f4;font:inherit;outline:none}input:focus{border-color:#49e5a2;box-shadow:0 0 0 3px rgba(73,229,162,.09)}button,a.cta{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 17px;border:0;border-radius:10px;background:#47e5a1;color:#03110d;font-weight:900;text-decoration:none;cursor:pointer}.home{margin-top:16px;background:transparent!important;border:1px solid rgba(84,151,128,.22)!important;color:#b9cec6!important}.hidden{display:none!important}
  </style>
</head>
<body>
<main>
  <img class="logo" src="/assets/blinq_logo.svg" alt="BlinQ">
  <small>BLINQ ACCOUNT</small>
  <h1 id="title">Spracovanie odkazu…</h1>
  <p id="copy">Prosím počkajte.</p>
  <p id="copyEn" class="en">Please wait.</p>
  <div id="status" class="status">Overujeme bezpečný Firebase odkaz…</div>
  <form id="resetForm" class="hidden">
    <label>Nové heslo / New password<input id="password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Zopakujte heslo / Repeat password<input id="password2" type="password" minlength="8" autocomplete="new-password" required></label>
    <button type="submit">Nastaviť heslo / Set password</button>
  </form>
  <a id="home" class="cta home hidden" href="/">Späť do BlinQ / Back to BlinQ</a>
</main>
<script src="/auth/action/action.js?v=7360&p=44"></script>
</body>
</html>
