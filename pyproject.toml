[project]
name = "tbt-v200"
version = "2.0.0"
description = "Leakage-safe tennis prediction, calibration, backtesting and Azure serving pipeline"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
